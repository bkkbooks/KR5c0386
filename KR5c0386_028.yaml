body:
  text: 雜篇則陽第二十五以人名篇則陽遊於楚夷節言之於王王未之見夷節歸姓彭名陽字則陽魯人遊事諸侯後入楚欲事楚文王則陽司馬云名則陽字彭陽也一云姓彭名則陽周初人也夷姓名節楚臣也則陽欲事於楚故因夷節稱言於王王既貴重故猶未之見也夷節所進未遂故罷朝而歸家夷節楚臣彭陽見王果曰夫子何不談我於王王果楚之賢大夫也談猶稱説也本亦有作言談字者前因夷節未得見王後説王果冀其談薦也王果司馬云楚賢人談音談本亦作談李云説也郭徒堪反徐徒暗反王果曰我不若公閲休若如也公閲休隱者之號也王果賢人嫌彭陽貪榮情速故盛稱隱者以抑其進趨之心也公閲休隱士也閲音悅彭陽曰公閲休奚為者邪奚何也既稱公閲休言己不如故問何為庶聞所以曰冬則擉鱉於江夏則休乎山樊有過而問者曰此豫宅也夫夷節已不能而況我乎吾又不若夷節夫夷節之為人也無德而有知不自許以之神其交固顛冥乎富貴之地非相助以德相助消也夫凍者假衣於春喝者反冬乎冷風夫楚王之為人也形尊而嚴其於罪也無赦如虎非夫佞人正德其孰能橈焉言此者以抑彭陽之進趨擉刺也樊傍也亦茂林也隆冬刺鱉於江渚以逍遙盛夏歸休偃茂林而取適既無環廡故指山傍而為舍此略陳閲休之事迹也擉初角反又敕角反司馬云刺也郭音觸徐丁緑反一音捉盧文弨曰舊捉作促訛今改正慶藩案廣韻引司馬云擉鱉刺也與釋文小異樊音煩李云傍也司馬云陰也廣雅云邊也豫宅司馬云以隱居山陰自顯也言己不若夷節之好富貴能交結意盡形名任知以干上也顛冥猶迷沒也言夷節交遊堅固意在榮華顛倒迷惑情貪富貴實無真德而有俗知不能虛淡以從神而好任知以干上數數如此猶自不能況我守愚若為堪薦此是王果謙遜之辭也有知音智注同顛冥音眠司馬云顛冥猶迷惑也言其交結人主情馳富貴苟進故德薄而名消消毀損也言則陽憑我談己於王者此適可敗壞名行必不益於盛德也言已順四時之施不能赴彭陽之急夫遭凍之人得衣則暖被暍之遇水便活乃待陽和以解凍須寒風以救暍雖乖人事實順天時履道達人體無近惠不進彭陽其義亦爾暍音謁字林云傷暑也之施始豉反下同儀形有南面之尊威嚴據千乘之貴赫怒行毒猶如暴虎戮辱蒼生必無赦宥自非大佞之人不堪任使若履正懷德之士誰能屈撓心志而事之乎能橈乃孝反又呼毛反王云惟正德以至道服之佞人以才辨奪之故能泥橈之也故聖人其窮也使家人忘其貧其達也使王公忘爵祿而化卑其於物也與之為娛矣其於人也樂物之通而保己焉故或不言而飲人以和與人並立而使人化父子之宜彼其乎歸居而一間其所施其於人心者若是其遠也故曰待公閲休淡然無欲樂足於所遇不以侈靡為貴而以道德為榮故其家人不識貧之可苦寇居鄭老萊在楚妻孥窮窶而樂在其內賢士尚然況乎真聖斯忘貧也淡然徒暫反輕爵祿而重道德超然坐忘不覺榮之在身故使王公失其所以為高韜光為窮顯迹為達哀公德友於尼父軒轅膝步於廣成斯皆道任則尊不拘品命故能使萬乘之王五等之君化其高貴之心而為卑下之行也而化卑居高而以卑為本也本或作而化卑於人也不以為物自苦同塵涉事與物無私所造皆適故未嘗不樂也通彼不喪我混迹人間而無滯塞雖復通物而不喪我動不傷寂而常守於其真不喪息浪反人各自得斯飲和矣豈待言哉蔭芘群生冥同蒼昊中和之道各得其心滿腹而歸豈勞言教而飲於鴆反望其風而靡之和光同塵斯並立也各反其真斯人化也使彼父父子子各歸其所雖復混同貴賤而倫敘無虧故父子君臣各居其位無相參冒不亦宜乎其所施同天地之德故間靜而不二所有施惠與四時合敘未嘗不間暇從容動靜不二一間音間聖人之用心如上説是以知其清高深遠也家世父曰父子之宜承上家人忘其貧子養父者也父待養於子者也所謂宜也歸居即據上文冬擉鱉夏休乎山樊言之釋間也謂別異其所施以求自足也使家人忘其貧自忘而已矣此其遠於人心者也欲其釋楚王而從閲休將以靜泰之風鎮其動心也此總結也而字依世德堂本改聖人達綢繆周盡一體矣而不知其然性也復命搖作而以天為師人則從而命之也憂乎知而所行恆無幾時其有止也若之何所謂玄通綢繆結縛也夫達道聖人超然縣解體知物境空幻豈為塵網所羈閲休雖未極乎道故但託而説之也綢直周反繆亡侯反綢繆猶纏綿也又云深奧也無外內而皆同照夫智周萬物窮理盡性物我不二故混同一體也周盡一體所鑒綢繆精粗洞盡故言周盡一體一體天也不知其然而自然者非性如何能所相應境智冥合不知所以莫辨其然故與真性符會搖者自搖作者自作莫不復命而師其天然也反乎真根復於本命雖復搖動順物而作動靜無心合於天地故師於二儀也復命搖作搖動也萬物動作生長各有天然則是復其命也此非赴名而高其迹性而動其迹自高故人不能下其名也命名也合道聖人本無名字為有清塵可慕故人從後而名之命之也命名也任知行則憂患相繼任知為物憂患斯生心靈易奪所行無幾攀緣念慮寧有住時假令神禹無奈之何憂乎知音智而所行恆無幾居豈反時其有止也若之何王云憂乎智謂有為者以形智不至為憂也不知用智必喪喪而更以不智為憂及其智之所行有弊無濟故其憂患相接無須臾停息故曰恆無幾時其有止也不能遺智去憂非可憂如何世德堂本作內外帥字依世德堂本改而字依趙諫議本改生而美者人與之鑑不告則不知其美於人也若知之若不知之若聞之若不聞之其可喜也終無已人之好之亦無已性也聖人之愛人也人與之名不告則不知其愛人也若知之若不知之若聞之若不聞之其愛人也終無已人之安之亦無已性也鑑鏡也鑑物無私故人美之今夫鑑者豈知鑑而鑑耶生而可鑑則人謂之鑑耳若人不相告則莫知其美於人譬之聖人人與之名鑑鏡也告語也生明照照物無私人愛慕之故名為鏡若人不相告語明鏡本亦無名此起譬也則不知其美於人生便有見物之美而為無心人與作名言鏡耳故人美之若不相告即莫知其美於人夫鑑之可喜由其無情不問知與不知聞與不聞來即鑑之故終無已若鑑由聞知則有時而廢也已止也夫鏡之照物義在無情不問怨親照恆平等若不聞而不知鏡亦不照既有聞知鏡能照之斯則事涉間奪有時休廢矣焉能久照乎只為凝照無窮故為人之所喜好也慶藩案王氏念孫曰終無已者終竟也竟無已時也若性所不好豈能久照鏡之能照出自天然人之喜好率乎造物既非矯性所以無窮好之呼報反注同聖人無愛若鏡耳然而事濟於物故人與之名若人不相告則莫知其愛人也聖人澤被蒼生恩流萬代物荷其德人與之名更相告語嘉號斯起不若然者豈有聖名乎蕩然以百姓為芻狗而道合於愛人故能無已若愛之由乎聞知則有時而衰也夫聖德遐曠接物無私亭毒群生芻狗百姓豈待知聞而後愛之哉只為慈救無偏故德無窮已此合也性之所安故能久安定也夫靜而與陰同德動而與陽同波故無心於動靜也故能疾雷破山而恆定大風振海而不驚斯率其真性者也若矯性偽情則有時而動矣故王弼云不性其情焉能久行其企舊國舊都望之暢然雖使丘陵草木之緡入之者十九猶之暢然況見見聞聞者也以十仞之臺縣衆間者也得舊猶暢然況得性乎國都其真性也夫少失本邦流離他邑歸望桑梓暢然喜歡況喪道日淹逐末來久今既還原反本故曰暢然暢然喜悅貌緡合也之緡民忍反徐音昏郭云合也司馬云盛也見所嘗見聞所嘗聞而猶暢然況體其體用其性也緡合也舊國舊都荒廢日久丘陵險陋草木叢生入中相訪十人識九見所曾見聞所曾聞懷生之情暢然歡樂況喪道日久流沒生死忽然反本會彼真原歸其重玄之鄉見其至道之境其為樂也豈易言乎十九謂見十識九也見見聞聞見所見聞所聞俞樾曰緡字釋文引司馬云盛也郭注云合也於義俱通入之者十九釋文曰謂見十識九也此未得其義入者謂入於丘陵草木所掩蔽之中也入之者十九則其出於外而可望見者止十之一耳而猶覺暢然喜悅故繼之曰況見見聞聞者也郭注曰見所嘗見聞所嘗聞而猶暢然則於況見見聞聞句不復可通遂增益之曰況體其體用其性也於莊子本義不合矣衆之所習雖危猶間況聖人之無危七尺曰仞臺高七丈可謂危縣人衆數登遂不怖懼習以性成尚自寬間而況得真何往不安者也臺縣音玄衆間音間注同元嘉本作間俞樾曰此承見見聞聞而言以十仞之臺而縣於衆人耳目之間此人所共見共聞者非猶夫丘陵草木之緡入之者十九也其為暢然可知矣郭注曰衆之所習雖危猶間此誤讀間為間於義殊不可通蓋由不解上文故於此亦失其旨家世父曰説文間隙也周禮匠人井間成間同間凡空處謂之間屋空處亦曰間十仞之臺縣之衆間傑然獨出見見聞聞不能掩也得其環中以隨成不以之見於外而自得之於中乃可以應無窮冉相氏得其環中以隨成與物無終無始無幾無時日與物化者一不化者也闔嘗舍之夫師天而不得師天與物皆殉其以為事也若之何夫聖人未始有天未始有人未始有始未始有物與世偕行而不替所行之備而不洫其合之也若之何湯得其司御門尹登恆為之傅之從師而不囿得其隨成為之司其名之名嬴法得其兩見仲尼之盡慮為之傅之容成氏曰除日無歲無內無外冉相氏古之聖王也居空以隨物物自成冉相氏三皇以前無為皇帝也環中之空也言古之聖王得真空之道體環中之妙故道順群生混成庶品冉相息亮反注同郭云冉相氏古聖王俞樾曰路史循蜚紀有冉相氏忽然與之俱往無始無過去無終無未來也無幾無時無見在也體化合變與物俱往故無三時也日與物化故常無我常無我故常不化也順於日新與物俱化者動而常寂故凝寂一道嶷然不化言夫為者何不試舍其所為之乎闔何也言體空之人冥於造物千變萬化而與化俱往曷嘗暫相舍離也嘗舍音捨注同唯無所師乃得師天師者倣效之名天者自然之謂夫大塊造物率性而動若有心師學則乖於自然故不得也雖師天猶未免於殉奚足事哉師天猶不足稱事況又不師耶殉者逐也求也夫有心倣效造化而與物俱往者此不率其本性也奚足以為修其事業乎尚有所求故是殉也夫師猶有稱殉況己逐物其如之何皆殉辭俊反家世父曰其有止也通乎命者也其以為事應乎物者也其舍之也盡性復命渾人己而化之也云若之何者如是之為道也夫得中聖人達於至理故能人天雙遣物我兩忘既曰無終何嘗有始率性合道不復師天都無乃冥合替廢也堙塞也混同人事與世並行接物隨時曾無廢闕然人間否泰備經之矣而未嘗堙塞所遇斯通無心師學自然合道如何倣效方欲契真固不可也所行之備而不洫音溢郭許的反李虛域反濫也王云壞敗也無心偕行何往而不至故曰皆殉也所行行備而物我無傷故無壞敗也委之百官而不與焉姓門名尹言門尹官號也姓登名恆殷湯聖人忘懷順物故得良臣御事既為師傅玄默端拱而不為也門尹登恆向云門尹官名登恆人名為之于偽反下同傅之音付下同不與音預任其自聚非囿之也縱其自散非解之也從任也囿聚也虛淡無為委任師傅終不積聚而為己功司御之屬亦能隨物之自然也而湯得之所以名寄於物而功不在己良臣受委隨物而成推功司御名不在己名法者已過之迹耳非適足也故曰嬴然無心者寄治於群司則其名迹並見於彼嬴然無心也見顯也成物之名聖迹之法並是師傅而不與焉故名法二事俱顯於彼嬴然間放功成弗居也之名嬴音盈法得其兩見賢遍反注同得其隨成之道以司其名名實法立故得兩見猶人鑑之相得也家世父曰隨成者渾成者也兩見者對待者也説文傅相也即輔相之義隨成可以為相矣仲尼之盡慮亦輔相也是亦對待也司者察也名之嬴法之絀也爾雅釋詁法常也老子名可名非常名察其名迹之所至而可知其成故曰兩見寄治直吏反仲尼曰天下何思何慮慮已盡矣若有纖芥之慮豈得寂然不動應感無窮以輔萬物之自然也傅輔也盡絶也孔丘聖人忘懷絶慮故能開化群品輔稟自然若蘊纖芥有心豈能坐忘應感今所以有歲而存日者為有死生故也若無死無生則歲日之計除容成古之聖王也歲日者時敘之名耳為計於時日故有生死生死無矣故歲日除焉容成老子師也俞樾曰漢書藝文志陰陽家有容成子十四篇房中家又有容成陰道二十六卷此即老子之師也列子湯問篇黃帝與容成子居空洞之上同齋三月當是別一人淮南本經篇昔容成氏之時道路雁行列處託嬰兒於巢上置餘糧於畝首虎豹可尾虺蛇可蹍而不知其所由然此則當為上古之君即莊子胠篋之容成氏與大庭伯皇中央栗陸諸氏並稱者也而高誘注乃云容成氏黃帝時造曆日者則以為黃帝之臣矣此以説列子湯問篇與黃帝同居空洞之容成氏乃為得之非此容成也合諸説觀之容成氏有三黃帝之君一也黃帝之臣二也老子之師三也然老子生年究不可考其師或即黃帝之臣未可知也無彼我則無內外也內我也外物也為計死生故有內名歲日既遣物我何施之字依覆宋本及王叔岷説刪世德堂本耳作而魏瑩與田侯牟約田侯牟背之魏瑩怒將使人刺之瑩魏惠王名也田侯即齊威王也名牟桓公之子田恆之後故曰田侯齊魏二國約誓立盟不相征伐盟後未幾威王背之故魏侯瞋怒將使人刺而殺之其盟在齊威二十六年魏惠八年魏瑩郭本作罃音瑩磨之瑩今本多作瑩乙耕反司馬云魏惠王也盧文弨曰舊作罃與作瑩互易文頗不順且今書實多作瑩字今改正史表梁惠王之名作罃與田侯一本作田侯牟司馬云田侯齊威王也名牟桓公子案史記威王名因不名牟盧文弨曰案今書有牟字史記威王名因齊戰國策亦同俞樾曰史記威王名因齊田齊諸君無名牟者惟桓公名午與牟字相似牟或午之訛然齊桓公午與梁惠王又不相值也背之音佩刺之七賜反犀首公孫衍聞而恥之曰君為萬乘之君也而以匹夫從讎衍請受甲二十萬為君攻之虜其人民係其牛馬使其君內熱發於背然後拔其國忌也出走然後抶其背折其脊犀首官號也如今虎賁之類公家之孫名衍為此官也諸侯之國革車萬乘故謂之君也匹夫者謂無官職夫妻相匹偶也從讎猶報讎也夫君人者一怒則伏尸流血今乃令匹夫行刺單使報讎非萬乘之事故可羞犀首魏官名也司馬云若今虎牙將軍公孫衍為此官元嘉本作齒首慶藩案戰國策三鮑注引司馬云犀首魏官若今虎牙將軍視釋文較略萬乘繩證反將軍孫衍請專命受鉞率領甲卒二十萬人攻其齊城必當獲勝於是虜掠百姓羈係牛馬勳酬賞分布軍人也為君于偽反下請為君同姓田名忌齊將也抶折擊也國破人亡而懷恚怒故熱氣蘊於心疽發於背也國既傾拔獲其主將於是擊抶其背打折腰脊旋師獻凱不亦快乎忌也出走忌畏而走或言圍之也元嘉本忌作亡抶敕一反三蒼云擊也郭云秩又豬栗反盧文弨曰舊秩仍作抶訛今書內所載音義作秩姑從之或疑是柣亦不訓擊折其之舌反公孫衍三字依疏文及趙諫議本補官字依國策鮑注補季子聞而恥之曰築十仞之城城者既十仞矣則又壞之此胥靡之所苦也今兵不起七年矣此王之基也衍亂人不可聽也季姓也子德之稱魏之賢臣也胥靡徒役人也季子懷道不用征伐聞犀首請兵羞而進諫夫七丈之城用功非少城就成矣無事壞之此乃徒役之人濫遭辛苦此起譬也季子魏臣俞樾曰下十字疑七字之誤城者既七仞則雖未十仞而去十仞不遠矣故壞之為可惜若既十仞則直謂之已成可耳不當言既十仞也下文曰今兵不起七年矣此王之基也明是以七仞喻七年其為字誤無疑又壞音怪干戈靜息已經七年偃武修文王者洪基犀首方為禍亂不可聽從華子聞而醜之曰善言伐齊者亂人也善言勿伐者亦亂人也謂伐之與不伐亂人也者又亂人也華姓子有德之稱亦魏之賢臣也善巧言伐齊者謂興動干戈故是禍亂之人此公孫衍也善言勿伐者意在王之洪基勝於敵國有所解望故是亂人斯季子也謂伐與不伐亂人者未能忘言行道猶以是非為心故亦未免為亂人此華子自道之辭也華子亦魏臣也君曰然則若何一華子遣蕩既深王不測其所以故問言旨意趣如何曰君求其道而已矣夫道清虛淡漠物我兼忘故勸求之庶其寡欲必能履道爭奪自消惠子聞之而見戴晉人戴晉人曰有所謂蝸者君知之乎戴晉人梁之賢者也姓戴字晉人惠施聞華子之清言猶恐魏王之未悟故引戴晉庶解所疑惠子惠施也而見賢遍反下同戴晉人梁國賢人惠施薦之於魏王曰然蝸至微而有兩角蝸者蟲名有類小螺也俗謂之黃犢亦謂之蝸牛有四角君知之不曰然魏王答云我識之矣蝸音瓜郭音戈李云蝸蟲有兩角俗謂之蝸牛三蒼云小牛螺也一云俗名黃犢有國於蝸之左角者曰觸氏有國於蝸之右角者曰蠻氏時相與爭地而戰伏尸數萬逐北旬有五日而後反誠知所爭者若此之細也則天下無爭矣蝸之兩角二國存焉蠻氏觸氏頻相戰爭殺傷既其不少進退亦復淹時此起譬也數萬色主反逐北如字又音佩軍走曰北君曰噫其虛言與所言奇譎不近人情故發噫嘆疑其不實也曰噫於其反言與音餘曰臣請為君實之君以意在四方上下有窮乎必謂虛言請陳實録君以意測四方上下有極不因斯理物又質魏侯君曰無窮魏侯答云上下四方竟無窮已曰知遊心於無窮而反在通達之國若存若亡乎人迹所及為通達謂今四海之內也人迹所接為通達也存有也亡無也遊心無極之中又比九州之內語其大小可謂如有如無也君曰然今自以四海為大然計在無窮之中若有若無也然猶如此也謂所陳之語不虛也曰通達之中有魏於魏中有梁於梁中有王王與蠻氏有辨乎謂魏國在四海之中昔在河東國號為魏魏為強秦所逼徙都於梁梁從魏而有故曰魏中有梁也辨別也王之一國處於六合欲論大小如有如無與彼蠻氏有何差異此合譬也君曰無辨王與蠻氏俱有限之物耳有限則不問大小俱不得與無窮者計也雖復天地共在無窮之中皆蔑如也況魏中之梁梁中之王而足爭哉自悟己之所爭與蝸角無別也雖復扶又反趙諫議本無耳字客出而君惝然若有亡也自悼所爭者細惝然悵恨貌也晉人言畢辭出而行君覺己非惝然悵恨心之悼矣恍然如失惝音敞字林云惘也又吐蕩反客出惠子見君曰客大人也聖人不足以當之聖人謂堯舜也晉人所談其理弘博堯舜之行不足以當惠子曰夫吹管也猶有嗃也吹劍首者吷而已矣堯舜人之所譽也道堯舜於戴晉人之前譬猶一吷也曾不足聞嗃大聲吷小聲也夫吹竹管聲猶高大吹劍環聲則微小唐堯俗中所譽若於晉人之前盛談斯道者亦何異乎吹劍首聲曾無足可聞也管音管本亦作管嗃許交反管聲也玉篇呼洛反又呼教反廣雅云鳴也劍首司馬云謂劍環頭小孔也吷音血又呼悅反司馬云吷然如風過所譽音餘孔子之楚舍然蟻丘之漿其鄰有夫妻臣妾登極者子路曰是稯稯何為者邪蟻丘丘名也漿賣漿水之家也仲尼適楚而為聘使路旁舍息於賣漿水之家其家住在丘下故以丘為名也蟻丘魚綺反李云蟻丘山名之漿李云賣漿家司馬云謂逆旅舍以菰蔣草覆之也極高也總總衆聚也孔丘應聘門徒甚多車馬威儀驚異常俗故漿家鄰舍男女群聚共登賣漿觀視仲尼子路不識是以怪問登極司馬云極屋棟也升之以觀也一云極平頭屋也稯稯音總字亦作總李云聚貌本又作稷一本作稷初力反盧文弨曰兩稷字疑有一訛仲尼曰是聖人僕也是自埋於民自藏於畔其聲銷其志無窮其口雖言其心未嘗言方且與世違而心不屑與之俱是陸沈者也是其市南宜僚邪古者淑人君子均號聖人故孔子名宜僚為聖人也言臣妾登極聚衆多者是市南宜僚之僕隸也聖人僕謂懷聖德而隱僕隸也司馬本僕作朴謂聖人壞朴也與民同進不榮華退不枯稿混迹泥滓同塵氓俗不顯其德故自埋於民也進不榮華退不枯稿隱顯出處之際故自藏於畔也藏於畔王云修田農之業是隱藏於畔損其名也銷音消司馬云小也捐其本亦作損盧文弨曰今書捐作損規是生也聲名也消滅也一榮辱故毀滅其名冥至道故其心無極所言者皆世言口應人間心恆凝寂故不言而言言未嘗言心與世異道與俗反固違於世虛心無纍不與物同此心迹俱異也不屑屑潔也不潔世也本或作肯人中隱者譬無水而沈也寂寥虛淡譬無水而沈謂陸沈也陸沈司馬云當顯而反隱如無水而沈也姓熊字宜僚居於市南故謂之市南宜僚也趙諫議本損作捐趙本規是作視長子路請往召之由聞宜僚陸沈賢士請往就舍召之孔子曰已矣彼知丘之著於己也知丘之適楚也以丘為必使楚王之召己也彼且以丘為佞人也夫若然者其於佞人也羞聞其言而況親見其身乎而何以為存已止也彼必不來幸止勿喚著明也彼宜僚也著明也知丘明識宜僚是陸沈賢士又知適楚必向楚王薦召之如是則用丘為諂佞之人也陸沈之人率性誠直其於邪佞恥聞其言況自視其形良非所願不如舍之以從其志而汝也存在也匿影銷聲久當逃避汝何為請召謂其猶在子路往視之其室虛矣果逃去也仲由無鑑不用師言遂往其家庶觀盛德而辭聘情切宜僚已逃其屋虛矣長梧封人問子牢曰君為政焉勿鹵莽治民焉勿滅裂昔豫為禾耕而鹵莽之則其實亦鹵莽而報豫藝而滅裂之其實亦滅裂而報豫豫來年變齊深其耕而熟耰之其禾蘩以滋豫終年厭飧鹵莽滅裂輕脫末略不盡其分長梧地名其地有長樹之梧因以名焉封人也即此地守疆之人子牢孔子弟子姓琴宋也為政行化也治民宰割也鹵莽不用心也滅裂輕薄也夫民為邦本本固則邦寧唯當用意養人亦不可輕爾搔擾封人有道故戒子牢長梧封人長梧地名封人守封疆之人子牢司馬云即琴牢孔子弟字慶藩案琴張孔子弟子經傳中無作琴牢子牢者惟孔子家語弟子有琴張一名牢字子開亦字張衛人也是琴張始見於家語其書乃王子雍所偽撰不足為據賈逵鄭衆注左傳以琴張為顓孫師服虔駮之云子張少孔子四十餘歲孔子是時四十知未有子張趙岐注孟子亦以琴張為子張云子張善鼓琴號曰琴張蓋又據禮記子張既除喪數語而附會者也尤為不經琴張子牢本非一人也司馬此説非漢書古今人表作琴牢亦淺學者據家語改之也如漢書有琴牢則賈鄭服各注早據之以釋牢曰琴張矣論語鄭注孟子趙岐注及左傳同鹵音魯莽莫古反又如字滅裂猶短草也李云謂不熟也郭云鹵莽滅裂輕脫末略不盡其分也司馬云鹵莽猶粗粗也謂淺耕稀種也滅裂斷其草也盧文弨曰案粗千奴反粗才古反二字古多連用如春秋繁露俞篇云始於粗粗終於精微論衡正説篇云略正題目粗粗之説以照篇中微妙之文其他以粗粗連用者亦多猶粗粗也有欲改為粗疏者故正之為禾猶種禾也藝拔草也耕地不深鉏治不熟至秋收時嘉實不多皆由疏略故致斯報也藝音云除草也功盡其分無為之至變齊才細反司馬如字云變更也謂變更所法也齊同也耰音憂司馬云鋤也廣雅云推也字林云摩田器也變改也耕治也耰藝也去歲為田亟遭飢餧今年藝植故改法深耕耕墾既深鉏耰又熟於是禾苗蘩茂子實滋榮寬歲足飧故其宜矣厭音孫本又作飧序字依繁露改世德堂本作無所不至趙諫議本所作為今本作飧莊子聞之曰今人之治其形理其心多有似封人之所謂遁其天離其性滅其情亡其神以衆為故鹵莽其性者欲惡之孽為性萑葦蒹葭始萌以扶吾形尋擢吾性並潰漏發不擇所出漂疽疥內熱溲膏是也今世之人澆浮輕薄馳情欲境倦而不休至於治理心形例如封人所謂莊周聞此因而論之夫遁離滅亡以衆為之所致也若各至其極則何患也逃自然之理散淳和之性滅真實之情失養神之道者皆以徇逐分外多滯有為故也離其力智反下同以衆為如字王云凡事所可為者也遁離滅亡皆由衆為衆為所謂鹵莽也司馬本作為偽萑葦害黍稷欲惡傷正性萑葦蘆也夫欲惡之心多為妖孽萑葦害黍稷欲惡傷真性皆由鹵莽浮偽故致其然也欲惡烏路反注並同之孽魚列反萑音丸葦類葦於鬼反蘆也形扶疏則神氣傷蒹葭亦蘆也夫穢草初萌尚易除翦及扶疏盛茂必害黍稷亦猶欲心初萌尚易止息及其昏溺戒之在微故老子云其未兆易謀也蒹古恬反薕也葭音加亦蘆也俞樾曰為性萑葦蒹葭六字為句郭於萑葦下出注云萑葦害禾稷欲惡傷正性此失其讀也始萌以扶吾形尋擢吾性尋與始相對為義尋之言寖尋也漢書郊祀志寖尋於泰山矣晉灼曰尋遂往之意也始萌以扶吾形言其始若足以扶助吾形也尋擢吾性言寖尋既久則拔擢吾性也郭解扶吾形曰形扶疏則神氣傷亦為失之以欲惡引性不止於當尋引也擢拔也以欲惡之事誘引其心遂使拔擢真性不止於當也此鹵莽之報也故治性者安可以不齊其至分潰漏人冷瘡也漂疽熱毒腫也亦疽之類也溲膏溺精也耽滯物境沒溺聲色故致精神昏亂形氣虛羸衆病發動不擇處所也並潰回內反漏發李云謂精氣散泄上潰下漏不擇所出也漂本亦作瘭徐敷妙反又匹招反一音必招反疽七餘反瘭疽謂病瘡膿出也疥音界溲本或作廋所求反膏司馬云謂虛勞人尿上生肥白沫也皆為利欲感動失其正氣不如深耕熟耰之有實不齊才細反又如字世德堂本致作至趙諫議本至作致柏矩學於老聃曰請之天下遊柏姓矩名懷道之士老子門人也請遊行宇內觀風化察物情也柏矩有道之人老聃曰已矣天下猶是也老子止之不許其往言天下物情與此處無別也又請之老聃曰汝將何始鄭重殷勤所請不已方問行李欲先往何邦曰始於齊柏矩魯人與齊相近齊人無道欲先行也至齊見辜人焉推而強之解朝服而幕之號天而哭之曰子乎子乎天下有大災子獨先離之曰莫為盜莫為殺人榮辱立然後睹所病貨財聚然後睹所爭今立人之所病聚人之所爭窮困人之身使無休時欲無至此得乎遊行至齊以觀風化忽見罪人刑戮而死於是推而強之令其正臥解取朝服幕而覆之辜辜罪也李云謂應死人也元嘉本作幸人盧文弨曰幸或是罪之誤俞樾曰釋文辜罪也李云謂應死人也此失其義辜謂辜磔也周官掌戮殺王之親者辜之鄭注辜之言枯也謂磔之是其義漢景帝紀改磔曰棄市顏注磔謂張其尸也是古之辜磔人者必張其尸於市故柏矩推而強之解朝服而幕之也強之其良反字亦作強朝服直遙反幕音莫司馬云覆也殺人大災謂自此以下事大災既有則雖戒以莫為其可得已乎離罹也災禍也號叫上天哀而大哭其枉濫故重曰子乎為盜殺人世間大禍子獨何罪先此遭罹大災之條具列於下又解所謂辜人則朝士是也言其強相推讓以被朝服重為羅網以繼黎元故告天哭之明災由斯起預張之網列在下文俞樾曰子乎子乎乃歎辭也詩綢繆子兮子兮毛傳子兮者嗟茲也管子小稱篇嗟茲乎聖人之言長乎哉説苑貴德篇曰嗟茲乎我窮必矣並以嗟茲為歎辭説詳經義述聞此云子乎子乎正與子兮子兮同義子當讀為釋文子字不作音蓋失其義久矣號天戶刀反大災音哉離之離著也各自得則無榮辱得失紛紜故榮辱立榮辱立則夸其所謂辱而跂其所謂榮矣奔馳乎夸跂之間非病如何軒冕為榮戮恥為辱奔馳取舍非病如何若以知足為富將何爭乎珍寶彌積馳競斯起上有所好則下不能安其本分賞之以軒冕玩之以珠璣遂使群品奔馳困而不止欲令各安本分其可得乎所好呼報反古之君人者以得為在民以失為在己以正為在民以枉為在己故一形有失其形者退而自責今則不然匿為物而愚不識大為難而罪不敢重為任而罰不勝遠其塗而誅不至民知力竭則以偽繼之日出多偽士民安取不偽夫力不足則偽知不足則欺財不足則盜盜竊之行於誰責而可乎君莫之失則民自得矣推功於物故以得在民受國不祥故以失在己君莫之枉則民自正無為任物正在民也引過責躬枉在己也夫物之形性何為而失哉皆由人君撓之以至斯患耳故自責夫人受氣不同稟分斯異令各任其能則物皆自得若有一物失所虧其形性者則引過歸己退而責躬昔殷湯自翦千里來霖是也步驟殊時澆淳異世故今之馭物者則不復如此也反其性匿也用其性顯也故為物所顯則皆識所作憲章皆反物性藏匿罪名愚妄不識故罪名者衆也匿女力反為物而愚一本作遇俞樾曰下文大為難而罪不敢重為任而罰不勝遠其塗而誅不至曰罪曰罰曰誅皆謂加之以刑也此曰愚則與下文不一律矣釋文曰愚一本作遇遇疑過字之誤廣雅釋詁曰過責也因其不識而責之是謂過不識呂覽適威篇曰煩為教而過不識數為令而非不從巨為危而罪不敢重為任而罰不勝與此文義相似而正作過不識高誘注訓過為責可據以訂此文之誤過誤為遇又臆改為愚耳慶藩案愚與遇古通晏子春秋外篇盛為聲樂以淫愚民墨子非儒篇愚作遇韓子南面篇愚贛寙惰之民宋乾道本愚作遇秦策愚惑與罪人同心姚本愚作遇曩謂當從釋文作遇之義為長今案俞氏以為過字之誤其説更精過遇二字古多互訛本書漁父篇今者丘得過也釋文過或作遇讓王篇君過而遺先生食釋文過本亦作遇是二字形似互誤之證不識反物性而強令識之為物所易則皆敢法既難定行之不易故決定違者斯罪之也大為難而罪不敢王云凡所施為者皆用物之所能則莫不易而敢矣而故大為艱難令出不能物有不敢者則因罪之所易以豉反輕其所任則皆勝不勝音升注同適其足力則皆至力微事重而責其不勝路遠期促而罰其後至皆不可也將以避誅罰也智力竭盡不免誅罰懼罰情急故繼之以偽民知音智下同主日興偽士民何以得其真乎譎偽之風日日而出偽衆如草於何得真當責上也夫知力窮竭譎偽必生賦斂益急貪盜斯起皆由主上無德法令滋彰夫能忘愛釋私不貴珍寶當責在上豈罪下民乎趙諫議本責下有也字蘧伯玉行年六十而六十化未嘗不始於是之而卒詘之以非也未知今之所謂是之非五十九非也萬物有乎生而莫見其根有乎出而莫見其門人皆尊其知之所知而莫知恃其知之所不知而後知可不謂大疑乎已乎已乎且無所逃此所謂然與然乎亦能順世而不係於彼我故也姓蘧名瑗字伯玉衛之賢大夫也盛德高明照達空理故能與日俱新隨年變化蘧其居反順物而暢物情之變然也初履之年謂之為是年既終謝謂之為非一歲之中而是非常出故始時之是終詘為非也詘起勿反廣雅云曲也郭音黜物情之變未始有極故變為新以新為是故已謝矣以故為非然則去年之非於今成是今年之是來歲為非是知執是執非滯新執故者倒置之流也故容成氏曰除日無歲蘧瑗達之故隨物化也無根無門忽爾自然故莫見也唯無其生亡其出者為能睹其門而測其根也隨變而生生無根原任化而出出無門戶既曰無根無門故知無生無出生出無門理其如此何年歲之可像乎我所不知物有知之者矣故用物之知則無所不知獨任我知知甚寡矣今不恃物以知而自尊其知則物不告我非大疑如何所知者俗知也所不知者真知也流俗之人皆尊重分別之知鋭情取捨而莫能賴其之知以照真原可謂大疑惑之人也不能用彼則寄身無地已止也夫鋭情取捨不休止必遭禍患無處逃形自謂然者天下未之然也各然其所然各可其所可彼我相對孰是孰非乎然與音餘又如字然乎言未然此下世德堂本有則字世德堂本甚作其其字依世德堂本補不知依正文改仲尼問於大史大韜伯常騫狶韋曰夫衛靈公飲酒湛樂不聽國家之政田獵畢弋不應諸侯之際其所以為靈公者何邪太史官號也下三人皆史官之姓名也所問之事次列下文大史音太大韜吐刀反人名伯常騫起虔反人名狶本亦作俙同虛豈反又音希郭音郗李音熙韋李云狶韋者太史官名畢大網也弋繩繫箭而射也庸猥之君淫聲嗜酒捕獵禽獸不聽國政會盟交際不赴諸侯汝等史官應須定諡無道如此何為諡靈湛丁南反樂之久也李常淫反樂音洛不應應對之應諸侯之際司馬云盟會之事大韜曰是因是也靈即是無道之諡也依周公諡法亂而不損曰靈靈即無道之諡也此是因其無道諡之曰靈故曰是因是也伯常騫曰夫靈公有妻三人同濫而浴史奉御而進所搏幣而扶翼其慢若彼之甚也見賢人若此其肅也是其所以為靈公也男女同浴此無禮也同濫徐胡暫反或力暫反浴器也以為賢而奉御之勞故搏幣而扶翼之使其不得終禮此其所以為肅賢也幣者奉御之物濫浴器也姓史字魚衛之賢大夫也幣帛也又諡法德之精明曰靈男女同浴使賢人進御公見史魚良臣深懷愧悚假遣人搏捉幣帛令扶將羽翼慰而送之使不終其禮敬賢如此便是明君故諡為靈靈則有道之諡史音秋司馬云史魚也所搏音博弊郭作幣帛也徐扶世反司馬音蔽云引衣裳自蔽盧文弨曰今書作幣而扶翼司馬云謂公及浴女相扶翼自隱也此殊郭義欲以肅賢補其私慢靈有二義可謂善故仲尼問焉男女同浴嬌慢之甚忽見賢人頓懷肅敬用為有道故諡靈也闕誤引張君房本濫作檻亦字依覆宋本及王叔岷説改狶韋曰夫靈公也死卜葬於故墓不吉卜葬於沙丘而吉掘之數仞得石槨焉洗而視之有銘焉曰不馮其子靈公奪而里之夫靈公之為靈也久矣之二人何足以識之子謂蒯瞶也言不馮其子靈公將奪女處也夫物皆先有其命故來事可知也是以凡所為者不得不為凡所不為者不可得為而愚者以為之在己不亦妄乎故墓一本作大墓沙丘地名掘之其月反又其勿反數仞所主反洗而西禮反不馮音憑其子靈公郭讀絶句司馬以其子字絶句云言子孫不足可憑故使公得此處為冢也家世父曰郭象注子謂蒯瞶非也石槨有銘古之葬者謂子孫無能憑依以保其墓靈公得而奪之釋文一本作奪而埋之是也奪而里而汝也里居處也一本作奪而埋之蒯起怪反瞶五怪反蒯瞶衛莊公名女處音汝下昌慮反徒識已然之見事耳未知已然之出於自然也沙丘地名也在盟津河北子蒯瞶也欲明人之名諡皆定於未兆非關物情而有升降故沙丘石槨先有其銘豈馮蒯瞶方能奪葬與常騫詎能識邪之見賢遍反趙諫議本作埋少知問於大公調曰何謂丘里之言智照狹劣謂之少知太大也公正也道德廣大公正無私復能調順群物故謂之太公調假設二人以論道理大公音泰下同古者十家為丘二十家為里鄉閭丘里風俗不同故假問答以辨之也丘里之言李云四井為邑四邑為丘五家為鄰五鄰為里古者鄰里井邑士風不同猶今鄉曲各自有方俗而物不齊同盧文弨曰舊士作土今書內音義作士字從之趙諫議本作太下同大公調曰丘里者合十姓百名而以為風俗也合異以為同散同以為異今指馬之百體而不得馬而馬係於前者立其百體而謂之馬也是故丘山積卑而為高江河合水而為大大人合并而為公是以自外入者有主而不執由中出者有正而不距四時殊氣天不賜故歲成五官殊職君不私故國治文武大人不賜故德備萬物殊理道不私故無名無名故無為無為而無不為時有終始世有變化禍福淳淳至有所拂者而有所宜自殉殊面有所正者有所差比於澤百材皆度觀於大山木石同壇此之謂丘里之言采其十姓取其百名合而論之以為風俗也十姓百名一姓為十人十姓為百名則有異有同故合散以定之如采丘里之言以為風俗斯合異以為同也一人設教隨方順物斯散同以為異也亦猶指馬百體頭尾腰脊無復是馬此散同以為異也而係於前見有馬此合異以為同也無私於天下則天下之風一也積土石以成丘山聚細流以成江海亦猶聖人無心隨物施教故能并合八方均一天下華夷共履遐邇無私積卑如字又音婢合水一本作合流俞樾曰水乃小字之誤卑高小大相對為文合并而為公合群小之稱以為至公之一也自從也謂聖人之教從外以入從中而出隨順物情故居主竟無所執也自外入者大人之化也由中出者民物之性也性各得正故民無違心化必至公故主無所執所以能合丘里而并天下一萬物而夷群異也由亦從也謂萬物黔黎各有正性率心而出稟受皇風既合物情故順而不距殊氣自有故能常有若本無之而由天賜則有時而廢賜與也夫春暄夏暑秋涼冬寒稟之自然故歲敘成立若由天與之則有時而廢矣天不賜賜與也殊職自有其才故任之耳非私而與之五官謂古者法五行置官也春官秋官各有司職君王玄默委任無私故致宇內清夷國家寧泰也國治直吏反文者自文武者自武非大人所賜也若由賜而能則有時而闕矣豈唯文武凡性皆然文相武將量才授職各任其能非聖與也無私於物故道德圓備夫群物不同率性差異或巢居穴處走地飛空而亭之毒之咸能自濟物各得理故無功也名止於實故無為實各自為故無不為功歸於物故為無為不執此而無不為故無心者斯順時謂四敘遞代循環世謂人事遷貿不定流行反覆淳淳流行貌夫天時寒暑流謝不常人情禍福何能久定故老經云禍兮福所倚福兮禍所伏也淳淳如字王云流動流貌盧文弨曰兩流字疑衍其一反覆芳服反於此為戾於彼或以為宜拂戾也夫物情向背蓋無定準故於此乖戾者或於彼為宜是以達道之人不執逆順也所拂扶弗反戾也又音弗又音弼各自信其所是不能離也殉逐也面向也夫彼此是非紛然固執故各逐己見而所向不同也自殉殊面廣雅云面向也謂心各不同而自殉焉殊向自殉是非天隔故有所正者亦有所差離也力智反正於此者或差於彼於此為正定者或於彼為差此明物情顛倒殊向而然也家世父曰禍福淳淳任之以無心雖有拂於人而自得所宜自殉殊面強之以異趣名為正之而實已兩差矣無棄材也比譬也度量也夫廣大皋澤林籟極多隨材量用必無棄擲大人取物其義亦然比于大澤本亦作宅盧文弨曰今書于作於百材皆度度居也雖別區異所同以大澤為居雖木石異端同以大山為壇此可以當丘里之言也合異以為同也壇基也石有巨小木有粗細共聚大山而為基本此合異以為同也言於丘里則天下可知總結前義也大字依世德堂本改同以二字依下句補少知曰然則謂之道足乎以道為名名道於理謂不足乎欲明至道無名故發斯問大公調曰不然今計物之數不止於萬而期曰萬物者以數之多者號而讀之也是故天地者形之大者也陰陽者氣之大者也道者為之公因其大以號而讀之則可也已有之矣乃將得比哉則若以斯辨譬猶狗馬其不及遠矣夫有數之物猶不止於萬況無數之數謂道而足耶期限也號語也夫有形之物物乃無窮今世人語之限曰萬物者此舉其大經為言也亦猶虛道妙理本自無名據其功用強名為道名於理未足也而讀李云讀猶語也物得以通通物無私而強字之曰道天覆地載陰陽生育故形氣之中最大者也天道能通萬物亭毒蒼生施化無私故謂之公也強字巨丈反所謂道可道也大通有物生化群品語其始本實曰無名因其功號讀亦可也名已有矣故乃將無可得而比耶因其功用已有道名不得將此有名比於無名之理以斯比擬去之迢遞今名之辨無不及遠矣故謂道猶未足也必在乎無名無言之域而後至焉雖有名故莫之比也夫獨以狗馬二獸語而相比者非直大小有殊亦乃貴賤斯別也今以有名之道比無名之理者非直粗妙不同亦深淺斯異故不及遠也闕誤引劉得一本大作廣少知曰四方之內六合之裏萬物之所生惡起問此者或謂道能生之六合之內天地之間萬物動植從何生起少知發問欲辨其原惡起音烏大公調曰陰陽相照相蓋相治四時相代相生相殺欲惡去就於是橋起雌雄片合於是庸有安危相易禍福相生緩急相摩聚散以成此名實之可紀精微之可志也隨序之相理橋運之相使窮則反終則始此物之所有言之所盡知之所至極物而已睹道之人不隨其所廢不原其所起此議之所止言此皆其自爾非無所生夫三光相照二儀相蓋風雨相治炎涼相代春夏相生秋冬相殺豈關情慮物理自然也俞樾曰蓋當讀為害爾雅釋言蓋割裂也釋文曰蓋舍人本作害是蓋害古字通陰陽或相害或相治猶下句云四時相代相生相殺也凡此事故云為趨舍近起於陰陽之相照四時之相代也矯起貌也庸常也順則就而欲逆則惡而去言物在陰陽造化之中蘊斯情慮開杜交合以此為常也欲惡烏路反橋起居表反下同又音羔王云高徑言所起之徑疾也片合音判又如字夫逢泰則安遇否則危危則為禍安則為福緩者為壽急者為夭散則為死聚則為生凡此數事出乎造物相摩而成其猶四敘變易遷貿豈關情慮哉過此以往至於自然自然之故誰知所以也志記也夫陰陽之內天地之間為實有名故可綱可紀假令精微猶可言記至於重玄妙理超絶形名故不可以言象求也皆物之所有自然而然耳非無能有之也夫四序循環更相治理五行運動遞相驅役物極則反終而復始物之所有理盡於斯隨序謂變化相隨有次序也序或作原一本作享橋運之相使橋運謂相橋代頓至次序以相通理橋運以相制使也物表無所復有故言知不過極物也夫真理玄妙絶於言知若以言詮辨運知思慮適可極於有物而已固未能造於玄玄之境所復扶又反廢起皆自爾無所原隨也極於自爾故無所議睹見也隨逐也夫見道之人玄悟之士凝神物表寂照環中體萬境皆玄四生非有豈復留情物物而推逐廢起之所由乎所謂之言語道斷議論休止者也少知曰季真之莫為接子之或使二家之議孰正於其情孰遍於其理季真曰道莫為也接子曰道或使或使者有使物之功也季真接子並齊之賢人俱遊稷下故託二賢明於理莫無也使為也季真以無為為道接子謂道有為使物之功各執一家未為通論今少知問此以定臧否於素情妙理誰正誰偏者也季真接子李云二賢人俞樾曰尚書微子篇殷其勿或亂正四方多士篇時豫乃或言枚傳並曰或有也禮記祭義篇庶或饗之孟子公孫丑篇夫既或治之鄭趙注並曰或有也此云季真之莫為接子之或使或與莫為對文莫無也或有也周易益上九莫益之或擊之亦以莫或相對慶藩案接子漢書古今人表作捷子接捷字異而義同爾雅接捷也郭璞曰捷謂相接續也公羊春秋莊十二年宋萬弒其君接僖三十年鄭伯接卒左穀皆作捷又案史記孟子荀卿列傳索隱云接子古箸書者之名號孰遍音遍徐音篇大公調曰雞鳴狗吠是人之所知雖有大知不能以言讀其所自化又不能以意其所將為斯而析之精至於無倫大至於不可圍或之使莫之為未免於物而終以為過或使則實莫為則虛有名有實是物之居無名無實在物之虛可言可意言而愈疏未生不可忌已死不可徂死生非遠也理不可睹或之使莫之為疑之所假吾觀之本其往無窮吾求之末其來無止無窮無止言之無也與物同理或使莫為言之本也與物終始道不可有有不可無道之為名所假而行或使莫為在物一曲夫胡為於大方言而足則終日言而盡道言而不足則終日言而盡物道物之極言默不足以載非言非默議有所極物有自然非為之所能也由斯而觀季真之言當也夫目見耳聞雞鳴狗吠出乎造化愚智同知故雖大聖至知不能用意測其所為不能用言道其所以自然鳴吠豈道使之然是知接子之言於理未當吠符廢反大知音智皆不為而自爾假令精微之物無有倫緒粗大之物不可圍量用此道理推而析之未有一法非自然獨化者也物有相使亦皆自爾故莫之為者未為非物也凡物云云皆由莫為而過去不合於道故未免於物各滯一邊故卒為過患也實自使之滯有也無使之也溺無故也指名實之所在物之所在其實至虛夫情苟滯於有則所在皆物也情苟尚無則所在皆虛也是知有無在心不在乎境故求之於言意之表而後至焉夫可以言詮可以意察者去道彌疏遠也故當求之於言意之表而後至焉突然自生制不由我我不能禁忽然自死吾不能違忌禁也阻礙也突然而生不可禁忌忽然而死有何礙阻唯當隨變任化所在而安字亦有作沮者怨也處順而死故不怨喪也不可徂一本作阻近在身中猶莫見其自爾而欲憂之勞息聚散近在一身其理窈冥愚人不見此二者世所至疑也有無二執非達者之心疑惑之人情偏乃為議論之也物理無窮故知言無窮然後與物同理也本過去也末未來也過去已往生化無窮莫測根原焉可意致假令盛談無有既其偏滯未免於物故與物同於一理也恆不為而自使然也本猶始各執一邊以為根本者猶未免於本末也故與有物同於始斯離於物也道故不能使有而有者常自然也夫至道不絶非有非無故執有執無二俱不可也物所由而行故假名之曰道道大無名強名曰道假此名教而行之也舉一隅便可知胡何也方道也或使莫為未階虛妙斯乃俗中一物偏曲之人何足以造重玄語乎大道求道於言意之表則足不能忘言而存意則不足足圓遍也不足遍滯也苟能忘言會理故曰言未嘗言盡合玄道也如其執言不能契理既乖虛通之道故盡是滯礙之物也夫道物之極常莫為而自爾不在言與不言道物極處非道非物故言默不能盡載之極於自爾非言默而議之也默非默議非議唯當索之於四句之外而後造於衆妙之門也趙諫議本徂作阻世德堂本有所作其有趙本去下有所字之字依世德堂本刪
