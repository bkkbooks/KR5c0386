body:
  text: 雜篇寓言第二十七以義名篇寓言十九重言十七卮言日出和以天倪寄之他人則十言而九見信寓寄也世人愚迷妄為猜忌聞道己説則起嫌疑寄之他人則十言而信九矣故鴻蒙雲將肩吾連叔之類皆寓言耳寓言十九寓寄也以人不信己故託之他人十言而九見信也世之所重則十言而七見信重言長老鄉閭尊重者也老人之言猶十信其七也重言謂為人所重者之言也家世父曰重當為直容切廣韻重復也莊生之文注焉而不窮引焉而不竭者是也郭云世之所重作柱用切者誤夫卮滿則傾空則仰非持故也況之於言因物隨變唯彼之從故曰日出日出謂日新也日新則盡其自然之分自然之分盡則和也卮酒器也日出猶日新也天倪自然之分也和合也夫卮滿則傾卮空則仰空滿任物傾仰隨人無心之言即卮言也是以不言言而無係傾仰乃合於自然之分也又解卮支也支離其言言無的當故謂之卮言耳卮言字又作卮音支字略云卮圓酒器也李起宜反王云夫卮器滿即傾空則仰隨物而變非執一守故者也施之於言而隨人從變己無常主者也司馬云謂支離無首尾言也盧文弨曰卮舊作卮案説文作下從今多省作卮若作卮則不必云又作矣天倪音宜徐音詣寓言十九藉外論之親父不為其子媒親父譽之不若非其父者也非吾罪也人之罪也與己同則應不與己同則反同於己為是之異於己為非之言出於己俗多不受故借外耳肩吾連叔之類皆所借者也藉假也所以寄之人十言九信者為假託外人論説之也藉郭云藉借也李云因也父之譽子誠多不信然時有信者輒以常嫌見疑故借外論也媒媾合也父談其子人多不信別人譽之信者多矣譽之音餘注同己雖信而懷常疑者猶不受寄之彼人則信之人之聽有斯纍也吾父也非父談子不實而聽者妄起嫌疑致不信之過也互相非也夫俗人顛倒妄為否與己同見則應而為是與己不同則反而非之三異同處而二異訟其所取是必於不訟者俱異耳而獨信其所是非借外如何夫迷執同異妄見是非同異既空是非滅矣世德堂本借下無者字重言十七所以已言也是為耆艾年先矣而無經緯本末以期年耆者是非先也人而無以先人無人道也人而無人道是之謂陳人以其耆艾故俗共重之雖使言不借外猶十信其七耆艾壽考者之稱也已自言之不藉於外為是長老故重而信之流俗之人有斯迷妄也耆艾五蓋反年在物先耳其餘本末無以待人則非所以先也期待也期待也上下為經傍通曰緯言此人直以年老居先亦無本末之智故待以耆宿之禮非關道德可先也家世父曰已言者已前言之而復言也爾雅釋詁耆艾長也艾歷也郭璞注長者多更歷釋名六十曰耆耆指也指事使人也是耆艾而先人之義經緯本末所以先人人亦以是期之重言之不倦提撕警惕人道是乎存直是陳久之人耳而俗便共信之此俗之所以為安故而習常也無禮義以先人無人倫之道也直是陳久之人故重之耳世俗無識一至於斯高山寺本年耆二字作來卮言日出和以天倪因以曼衍所以窮年不言則齊齊與言不齊言與齊不齊也故曰無言言無言終身言未嘗不言終身不言未嘗不言有自也而可有自也而不可有自也而然有自也而不然惡乎然然於然惡乎不然不然於不然惡乎可可於可惡乎不可不可於不可物固有所然物固有所可無物不然無物不可非卮言日出和以天倪孰得其久萬物皆種也以不同形相禪始卒若環莫得其倫是謂天均天均者天倪也夫自然有分而是非無主無主則曼衍矣誰能定之哉故曠然無懷因而任之所以各終其天年曼衍無心也隨日新之變轉合天然之倪分故能因循萬有接物無心所以窮造化之天年極生涯之遐壽也曼衍以戰反夫理處無言言則乖當故直置不言而物自均等也家世父曰不言則齊謂與為卮言曼衍以窮年猶之不言也卮言之言隨乎言而言之隨乎不言而言之有言而固無言無言而固非無言是之謂天倪齊不言也不言與言既其不一故不齊也付之於物而就用其言則彼此是非居然自齊若不能因彼而立言以齊之則我與萬物復不齊耳復不扶又反下同言彼所言故雖有言而我竟不言也夫以言遣言言則無盡縱加百非亦未偕妙唯當凝照聖人智冥動寂出處默語其致一焉故能無言則言言則無言也豈有言與不言之別齊與不齊之異乎故曰言無言也雖出吾口皆彼言耳據出我口此復解前言無言義夫各執自見故有可有然自他既空然可斯泯自由也由彼我之情偏故有可不可惡乎猶於何也自他並空物我俱幻於何處而有可不可於何處而有然不然以此推窮然可自息斯復解前有自而然可義也惡乎音烏下同各自然各自可統而言之則無可無不可無可無不可而至也夫俗中之物倒置之徒於無然而固然於不可而執可也夫唯言隨物制而任其天然之分者能無夭落自非隨日新之變達天然之理者誰能證長生久視之道乎言得之者之至也雖變化相代原其氣則一禪代也夫物云云稟之造化受氣一種而形質不同運運遷流而更相代謝皆種章勇反於今為始者於昨已復為卒也物之遷貿譬彼循環死去生來終而復始此出禪代之狀也理自爾故莫得倫理也尋索變化之道竟無理之可致也夫均齊者豈妄哉皆天然之分均齊也此總結以前一章之謂天然齊等之道即齊均之道亦名自然之分也家世父曰言相生猶萬物之相禪也萬物有種生發至於無窮而不能執一形以相禪言有種而推衍至於無窮不能執一言以為始始卒無有端倪是之天均高山寺本曰下有言字而字依上句補莊子謂惠子曰孔子行年六十而六十化始時所是卒而非之未知今之所謂是之非五十九非也與時俱也夫運運不停新新流謝是以行年六十而與年俱變者也然莊惠相逢好談玄道故遠稱尼父以顯變化之方時變則俗情亦變乘物以遊心者豈異於俗哉變者不停是不可常夫人之壽命依年而數年既不定數豈有耶是以去年之是於今非矣故知今年之是還是去歲之非今歲之非即是來年之是故容成氏曰除日無歲也趙諫議本也作化惠子曰孔子勤志服知也謂孔子勤志服膺而後知非能任其自化也此明惠子不及聖人之韻遠矣服用也惠施未達抑度孔子謂其勵志勤行用心學道故至斯智非自然任化者也莊子曰孔子謝之矣而其未之嘗言孔子云夫受才乎大本復靈以生鳴而當律言而當法利義陳乎前而好惡是非直服人之口而已矣使人乃以心服而不敢蘁立定天下之定已乎已乎吾且不得及彼乎謝變化之自爾非知力之所為故隨時任物而不造言也謝代也而汝也未無也言尼父於勤服之心久已代謝汝宜復靈無復浪言也若役其才知而不復其本靈則生亡矣夫人稟受才智於大道妙本復於靈命以盡生涯豈得勤志役心乖於造物此是莊子述孔丘之語訶抵惠施也才知音智鳴者律之所生言者法之所出而法律者衆之所為聖人就用之耳故無不當而未之嘗言未之嘗為也鳴聲也當中也尼父聖人與陰陽合德故風韻中於鍾律言教考於模範也哉服用也我無言也我之所言直用人之口耳好惡是非利義之陳未始出吾口也仁義利害好惡是非逗彼前機應時陳説雖復言出於口而隨前人即是用衆人之口矣而好呼報反注同惡烏路反注同口所以宣心既用衆人之口則衆人之心用矣我順衆心則衆心信矣誰敢逆立哉吾因天下之自定而定之又何為乎隨衆所宜用其心智教既隨物物以順之如草從風不敢逆立因其本靜隨性定之故定天下之定也蘁音悟又五各反逆也因而乘之故無不及已止也彼孔子也重勗惠子止而勿言吾徒庸淺不能逮及此是莊子歎美宣尼之言曾子再仕而心再化曰吾及親仕三釜而心樂後仕三千鍾而不洎吾心悲姓曾名參孔子弟子再仕之義列在下文洎及也六斗四升曰釜六斛四斗曰鍾洎及也曾參至孝求祿養親故前仕親在祿雖少而歡樂後仕親沒祿雖多而悲悼所謂再化以悲樂易心為不及養親故也三釜小爾雅云六斗四升曰釜心樂音洛下注同不洎其器反世德堂本無而字弟子問於仲尼曰若參者可謂無所縣其罪乎縣係也謂參仕以為親無係祿之罪也縣係也門人之中無的姓諱當是四科十哲之流也曾參仁孝為親求祿雖復悲樂應無係罪門人疑此咨問仲尼也參所金反無所縣音玄下同其罪乎縣係也心再化於祿所存者親也雖係祿而無係於罪也以為于偽反曰既已縣矣夫無所縣者可以有哀乎彼視三釜三千鍾如觀雀蚊虻相過乎前也係於祿以養也以養羊尚反下同夫養親以適不問其具若能無係則不以貴賤經懷而平和怡暢盡色養之宜矣夫孝子事親務在於適無論祿之厚薄盡於色養而已故有庸賃而稱孝子三仕猶為不孝參既心存哀樂得無係祿之罪乎夫唯無係者故當無哀樂也彼謂無係也夫無係者視榮祿若蚊虻鳥雀之在前而過去耳豈有哀樂於其間哉彼謂無係之人也鳥雀大以諭千鍾蚊虻小以比三釜達道之人無心係祿千鍾三釜不覺少多猶如鳥雀蚊虻相與飛過於前矣決然而已豈係之哉如鸛本亦作觀同古亂反盧文弨曰今書作觀蚊音文虻孟庚反司馬云觀雀飛疾與蚊相過忽然不覺也王云鸛蚊取大小相縣以喻三釜三千鍾之多少元嘉本作如鸛蚊無虻字俞樾曰雀字衍文也釋文云元嘉本作如鸛蚊無虻字則陸氏所據本尚未衍雀字故元嘉本作鸛蚊陸氏但言其無虻字不言其無雀字也惟鸛與蚊虻一鳥一蟲取喻不倫王云謂取大小相縣以喻三釜三千鍾之多少此不然也夫至人之視物一吷而已豈屑屑於三釜三千鍾之多寡而必分別其為鸛為蚊乎今案釋文云鸛本作觀疑是古本如此其文蓋曰彼視三釜三千鍾如觀蚊虻相過乎前也淮南子俶真篇毀譽之於己猶蚊虻之一過也義與此同因觀誤作鸛則鸛蚊虻三字不倫乃有刪一虻字使蚊與鸛兩文相稱者元嘉本是也又有增一雀字使鸛雀與蚊虻兩文相稱者今本是也皆非莊子之舊矣趙諫議本觀作鸛闕誤同引張君房本云鸛雀作觀鳥雀顏成子遊謂東郭子綦曰自吾聞子之言一年而野二年而從三年而通四年而物五年而來六年而鬼入七年而天成八年而不知死不知生九年而大妙外權利也居在郭東號曰東郭猶是齊物篇中南郭子綦也子遊子綦弟子也野質朴也聞道一年學心未熟稍能朴素去浮華耳子綦音其不自專也順於俗也通彼我也不滯境也與物同也與物同也自得也為衆歸也外形骸也神會理物無所復為合自然成所復扶又反所遇皆適而安智冥造物神合自然故不覺死生聚散之異也妙善也善惡同故無往而不冥此言久聞道知天籟之自然將忽然自忘則穢纍日去以至於盡耳妙精微也聞道日久學心漸著故能超四句絶百非義極重玄理窮衆妙知照弘博故稱大也天籟力帶反生有為死也勸公以其死也有自也而生陽也無自也而果然乎惡乎其所適惡乎其所不適天有曆數地有人據吾惡乎求之莫知其所終若之何其無命也莫知其所始若之何其有命也有以相應也若之何其無鬼邪無以相應也若之何其有鬼邪生而有為則喪其生處生人道沈溺有為適歸死滅也則喪息浪反自由也由有為故死由私其生故有為今所以勸公者以其死之由私耳公平也自由也所以人生動之死地者私愛其生不能公正故勸導也夫生之陽遂以其絶迹無為而忽然獨爾非有由也感於陽氣而有此生既無所由從故不足私也果決定也陽氣生物決定如此然而果然故無適無不適而後皆適皆適而至也夫氣聚為生生不足樂氣散為死死不足哀生死既齊哀樂斯泯故於何處而可適於何處而不可適乎所在皆適耳惡乎音烏下同皆已自足夫星曆度數玄象麗天九州四極人物依據造化之中悉皆具足吾於何處分外求之也天有曆一本作天有曆數理必自終不由於知非命如何夫天地晝夜人物死生尋其根由莫知終始時來運去非命如何其無命者言有命也不知其所以然而然謂之命似若有意也故又遣命之名以明其自爾而後命理全也夫死去生來猶春秋冬夏既無終始豈其命乎其有命者言無命也此又遣命也理必有應若有神靈以致之也鬼神識也夫耳眼應於聲色心智應於物境義同影響豈無靈乎其無鬼者言其有之也理自相應相應不由於故也則雖相應而無靈也夫人睡中則不知外物雖有眼耳則不應色聲若其有靈如何不應其有鬼者言其無也此又遣其有也闕誤引張君房本其下有私字衆罔兩問於景曰若向也俯而今也仰向也括撮而今也被髮向也坐而今也起向也行而今也止何也罔兩影外微陰也斯寓言者也若汝也俯低頭也撮束髮也汝坐起行止唯形是從以此測量必因形乃有言不待厥理未詳設此問答以彰獨化耳景音影又如字本或作影盧文弨曰影字係陶弘景所撰非古字也括古活反司馬云謂括髮也被髮皮寄反趙諫議本景作影下同撮字依成疏及闕誤引張君房本補景曰搜搜也奚稍問也豫有而不知其所以豫蜩甲也蛇蛻也似之而非也火與日吾屯也陰與夜吾代也彼吾所以有待邪而況乎以無有待者乎彼來則我與之來彼往則我與之往彼強陽則我與之強陽強陽者又何以有問乎運動自爾無所稍問叟叟無心運動之貌也奚何也景答云我運動無心蕭條自得無所可待獨化而生汝無所知何勞見問也搜搜本又作叟同素口反又素刀反又音蕭向云動貌自爾故不知所以豫我也我所有行止率乎造物皆不知所以悉莫辨其然爾豈有待哉影似形而非形蜩甲蟬殼也蛇蛻皮也夫蠐螬變化而為蟬蛇從皮內而蛻出者皆不自覺知也而蠐螬滅於前蟬自生於後非因蠐螬而有蟬蟬亦不待蠐螬而生也蛇皮之義亦復如之是知一切萬有無相因待悉皆獨化僉曰自然故影云我之因待同蛇蛻蜩甲似形有而實非待形者也蜩甲音條司馬云蜩甲蟬蛻皮也蛇蛻音帨又吐臥反又始鋭反屯聚也代謝也有火有日影即屯聚逢夜逢陰影便代謝若其形有影故當不待火日陰夜有形而無影將知影必不待形而獨化之理彰也吾屯徒門反聚也慶藩案文選謝靈運遊南亭詩注引司馬云屯聚也火日明而影見故曰吾聚也陰暗則影不見故曰吾代也夜代謂使得休息也釋文闕吾所以有待者火日也必其不形火日亦不能生影也故影亦不待於火日也推而極之則今之所謂有待者率卒至於無待而獨化之理彰矣況乎有待者形也必無火日形亦不能生影不待形也夫形之生也不用火日影之生也豈待形乎故以火日況之則知影不待形明矣形影尚不相待而況他物乎是知一切萬法悉皆獨化也家世父曰火日出而景生焉陰夜而景潛焉屯草木之始生也代者更也替也有相替者而吾固休也景之與形相待也又待火日而動待陰夜而休彼吾所以相待又有待也有待故不為物先待焉而即應故亦與物無忤景之隨形各肖其人之情態虛而與之委蛇此莊生應世之大旨也直自強陽運動相隨往來耳無意不可問也彼者形也強陽運動之貌也夫往來運動形影共時既無因待咸資獨化獨化之理妙絶名言名言問答其具之矣趙諫議本搜作叟無字依郭注及闕誤引張君房本補所謂二字依趙本刪卒字依趙本改至字矣字依趙本刪陽子居南之沛老聃西遊於秦邀於郊至於梁而遇老子老子中道仰天而歎曰始以汝為可教今不可也姓楊名朱字子居之往也沛彭城今徐州是也邀遇也梁國今汴州也楊朱南邁老子西遊邂逅逢於梁宋之地適於郊野而與之言陽子居姓楊名朱字子居之沛音貝邀古堯反要也遇也玉篇云求也抄也遮也昔逢楊子謂有道心今見矜夸知其難教嫌其異俗是以傷嗟也陽子居不答至舍進盥漱巾櫛脫履戶外膝行而前二曰向者弟子欲請夫子夫子行不間是以不敢今間矣請問其過自覺己非默然悚愧盥灑也櫛梳也屆逆旅之舍至止息之所於是進水漱灑執持巾櫛肘行膝步盡禮虔恭殷勤請益庶蒙針艾也盥音管小爾雅云澡也灑也漱所又反巾櫛莊乙反向被抵訶欲請其過正逢行李未有間庸今至主人清間無事庶聞責旨以助將來也不間音間下同一音如字老子曰而睢睢盱盱而誰與居大白若辱盛德若不足睢睢盱盱跋扈之貌人將畏難而疏遠睢盱躁急威權之貌也而汝也跋扈威勢矜莊耀物物皆哀悼誰將汝居處乎睢睢郭呼維反徐許圭反盱盱香于反又許吳反又音虛廣雅云睢睢盱盱元氣也而汝也言汝與元氣合德去其矜驕誰復能同此心解異郭義跋步末反畏難乃旦反疏遠于萬反夫人廉潔貞清者猶如汙辱也盛德圓滿者猶如不足也此是老子引道德經以戒子居也陽子居蹴然變容曰敬聞命矣蹙然慚悚也既承教旨驚懼更深稽首虔恭敬奉尊命也蹴子六反其往也舍者迎將其家公執席妻執巾櫛舍者避席煬者避灶其反也舍者與之爭席矣尊形自異故憚而避之也將送也家公主人公也煬然火也楊朱往沛正事威容舍息逆旅主人迎送夫執氈席妻捉梳巾先坐之人避席而走然火之者不敢當灶威勢動物一至於斯矣家公李云主人公也一讀舍者迎將其家為句煬羊尚反又音羊向反炊也去其夸矜故也從沛反歸已蒙教戒除其容飾遣其矜夸混迹同塵和光順俗於是舍息之人與爭席而坐矣去其起呂反
