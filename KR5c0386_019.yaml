body:
  text: 外篇繕性第十六以義名篇繕性於俗俗學以求復其初滑欲於俗思以求致其明謂之蔽蒙之民已治性於俗矣而欲以俗學復性命之本所以求者愈非其道也疏繕治也性生也俗習也初本也言人稟性自然各守生分率而行之自合於理今乃習於僞法治於真性矜而矯之已困弊矣方更行仁義禮智儒俗之學以求歸復本初之性故俗彌得而性彌失學愈近而道愈遠也繕善戰反崔云治也或云善也性性本也已亂其心於欲而方復役思以求明思之愈精失之愈遠滑亂也致得也欲謂名利聲色等可貪之物也言人所以心靈暗亂者為貪欲於塵俗故也今還役用分別之心思量求學望得獲其明照之道者必不可也唯當以無學學可以歸其本矣以無思思可以得其明矣本亦有作滑欲於欲者也滑音骨亂也崔云治也俞樾曰釋文滑音骨亂也崔云治也此當從崔說為長上文繕性於俗學以求復其初崔注繕亦訓治蓋二句一義繕也滑也皆治也故曰求復其初求致其明若訓滑為亂則與求字之義不貫矣滑得訓治者滑猶汨也說文水部汨治水也是其義也玉篇手部曰抇亦搰字然則滑之與汨猶搰之與抇矣思以李息吏反注役思同方復扶又反下無復雖復同若夫發蒙者必離俗去欲而後幾焉蔽塞也蒙暗也此則結前以俗學歸本以思慮求明如斯之類可謂蔽塞蒙暗之人必離力智反下文同去欲起呂反闕誤引張君房本下俗字作闕誤引張君房本俗作欲古之治道者以恬養知知生而無以知為也謂之以知養恬知與恬交相養而和理出其性夫德和也道理也德無不容仁也道無不理義也義明而物親忠也中純實而反乎情樂也信行容體而順乎文禮也禮樂遍行則天下亂矣彼正而蒙己德德則不冒冒則物必失其性也恬靜而後知不蕩知不蕩而性不失也恬靜也古者聖人以道治身治國者必以恬靜之法養真實之知使不蕩於外也治道如字又直吏反養知音智下以意求之夫無以知為而任其自知則雖知周萬物而恬然自得也率性而照知生者也無心而知無以知為也任知而往無用造為斯則無知而知知而無知非知之而知者也故終日知而未嘗知亦未嘗不知終日為而未嘗為亦未嘗不為仍以此真知養於恬靜若不如是何以恬乎知而非為則無害於恬恬而自為則無傷於知斯可謂交相養矣二者交相養則和理之分豈出他哉夫不能恬靜則何以生彼真知不有真知何能致茲恬靜是故恬由於知所以能靜知資於靜所以獲真知故知之與恬交相養也斯則中和之道存乎寸心自然之理出乎天性在我而已豈關他哉和故無不得道故無不理德被於人故以中和為義理通於物故以大道為名也無不容者非為仁也而仁跡行焉玄德深遠無不包容慈愛弘博仁跡斯見無不理者非為義也而義功著焉夫道能通物物各當理理既宜矣義功著焉若夫義明而不由忠則物愈疏義理明顯情率於中既不矜矯故物來親附也仁義發中而還任本懷則志得矣志得矣其跡則樂也既仁義由中故志性純實雖復涉於物境而恆歸於真情所造和適故謂之樂樂也音洛注同信行容體而順乎自然之節文者其跡則禮也夫信行顯著容儀軌物而不乖於節文者其跡則禮也信行下孟反注同下以行小行注行者行立皆放此以一體之所履一志之所樂行之天下則一方得而萬方失也夫不能虛心以應物而執跡以馭世者則必滯於華藻之禮而溺於荒淫之樂也是以芻狗再陳而天下亂矣遍音遍俞樾曰郭注曰以一體之所履一志之所樂行之天下則一方得而萬方失也是偏為一偏之偏故郭以一體一志說之釋文作遍而音遍非是各正性命而自蒙己德則不以此冒彼也若以此冒彼安得不失其性哉蒙暗也冒亂也彼謂履正道之聖人也言人必己冒亂則物我失其性矣家世父曰德足以正物矣而抑聽物之自然而蒙吾德焉未嘗以德強天下而冒之也強天下而冒之則正者我也非物之自正也而物之失其性多矣不冒莫報反崔云覆也闕誤無知字引張君房本云知下重知字通章知俱作智闕誤引張君房本忠作中闕誤作偏引江南古藏本云偏作遍古之人在混芒之中與一世而得淡漠焉當是時也陰陽和靜鬼神不擾四時得節萬物不傷群生不夭人雖有知無所用之此之謂至一當是時也莫之為而常自然謂三皇之前玄古無名號之君也其時淳風未散故處在混沌芒昧之中而與時世為一冥然無跡君臣上下不相往來俱得恬淡寂漠無為之道也在混胡本反芒莫剛反崔云混混芒芒未分時也淡徒暫反任其自然而已當是混沌之時淳朴之世舉世恬惔體合無為遂使陰升陽降二氣和而靜泰鬼幽人顯各守分而不擾炎涼順序四時得節既無災眚萬物不傷群生各盡天年終無夭折人雖有心知之術無為故無用之也不擾而小反物皆自然故至一也均彼此於無為混是非於恬惔物我不二故謂之至一也莫無也莫之為而自為無為也不知所以然而然自然也故當是時也人懷無為之德物含自然之道焉慶藩案自然謂自成也廣雅然成也大戴禮武王踐阼篇毋曰胡殘其禍將然謂禍將成也楚辭遠遊無滑而魂兮彼將自然言彼將自成也郭云物皆自然語未晰闕誤引張君房本得作應逮德下衰及燧人伏羲始為天下是故順而不一德又下衰及神農黃帝始為天下是故安而不順德又下衰及唐虞始為天下興治化之流澆淳散朴離道以善險德以行然後去性而從於心心與心識知而不足以定天下然後附之以文益之以博文滅質博溺心然後民始惑亂無以反其性情而復其初夫德之所以下衰者由聖人不繼世則在上者不能無為而羡無為之跡故致斯弊也世已失一惑不可解故釋而不推順之而已逮及也古者茹毛飲血與麋鹿同群及至燧人始變生為熟伏羲則服牛乘馬創立庖廚畫八卦以制文字放蜘蛛而造密網既而智詐萌矣嗜欲漸焉澆淳朴之心散無為之道德衰而始為天下此之謂乎是順黎庶之心而不能混同至一也燧人音遂安之於其所安而已夫德化更衰為弊增甚故神農有共工之伐黃帝致蚩尤之戰祅氣不息兵革屢興是以誅暴去殘弔民問罪苟且欲安於天下未能有順於群生者也聖人無心任世之自成成之淳薄皆非聖也聖能任世之自得耳豈能使世得聖哉故皇王之跡與世俱遷而聖人之道未始不全也夫唐堯虞舜居五帝之末而興治行化冠三王之始是以設五典而綱紀五行置百官而平章百姓百姓因此而澆訛五行自斯而荒殆枝流分派迄至於茲豈非毀淳素以作澆訛散朴質以為華僞興治直吏反水梟古堯反本亦作澆醇本亦作淳音純善者過於適之稱故有善而道不全夫虛通之道善惡兩忘今乃捨己效人矜名企善善既乖於理所以稱離也之稱尺證反行者違性而行之故行立而德不夷險危阻也不能率性任真晦其蹤跡乃矯情立行以取聲名實由外行聲名浮僞故令內德危險何清夷之有哉慶藩案離道以善險德以行郭注訓為有善而道不全行立而德不夷望文生義於理未順善字疑是為字之誤言所為非大道所行非大德也淮南俶真篇雜道以僞雜當為離字之誤僞古為字為亦行也儉德以行儉險古字通曾子本孝篇不興儉行以徼幸漢慎令劉修碑動乎儉中儉並當作險荀子富國篇俗儉而百姓不一楊倞注儉當為險即本於此以心自役則性去也離虛通之道捨淳和之德然後去自然之性從分別之心彼我之心競為先識無復任性也彼我之心更相謀慮是非臧否競為前識者也心與心識如字衆本悉同向本作職云彼我之心競為先職矣郭注既與向同則亦當作職也忘知任性斯乃定也夫心攀緣於有境知分別於無崖六合為之煙塵八荒為之騰沸四時所以愆序三光所以彗斯乃禍亂之源何足以定天下也家世父曰郭象云彼我之心競為先識無復任性也諸本皆以心與心識為句向秀本作職云彼我之心競為先職矣疑心與心非彼我之有異心也心自異也本然者一心然引之而動者又一心引之而動一念之覺而有識焉冬則識寒夏則識暖是也因覺生意而有知焉食則知求甘衣則知求溫是也佛家以意識分兩境知者意之發也故曰不識不知順帝之則識者內心之炯知者外心之通也知識並生而亂始繁矣烏足以定天下哉俞樾曰識知二字連文詩曰不識不知是識知同義故連言之曰識知也心與心識知而不足以定天下明必不識不知而後可言定也諸家皆斷識字為句非是向本作職尤非文博者心質之飾也前使心運知不足以定天下故後依附文書以匡時代增博學而濟世不知質是文之本文華則隱滅於素質博是心之末博學則沒溺於心靈唯當絶學而去文方會無為之美也博溺乃瀝反郭奴學反初謂性命之本文華既隱滅於素質博學又沒溺於心靈於是蠢民成亂始矣欲反其恬惔之情性復其自然之初本其可得乎噫心知文博之過世德堂本作隱字依上句疏文補由是觀之世喪道矣道喪世矣世與道交相喪也道之人何由興乎世世亦何由興乎道哉道無以興乎世世無以興乎道雖聖人不在山林之中其德隱矣夫道以不貴故能存世然世存則貴之貴之道斯喪矣道不能使世不貴而世亦不能不貴於道故交相喪也喪廢也由是事跡而觀察之故知時世澆浮廢棄無為之道亦由無為之道廢變淳和之世是知世之與道交相喪之也世喪息浪反下及注皆同慶藩案文選江文通雜體詩注引司馬云世皆異端喪道道不好世故曰喪耳釋文闕若不貴乃交相興也故懷道聖人高蹈塵俗未肯興弘以馭世而澆僞之世亦何能興感於聖道也今所以不隱由其有情以興也何由而興由無貴也澆季之時不能用道無為之道不復行世假使體道聖人降跡塵俗混同群生無人知者韜藏聖德莫能見用雖居朝市何異山林矣隱故不自隱古之所謂隱士者非伏其身而弗見也非閉其言而不出也非藏其知而不發也時命大謬也當時命而大行乎天下則反一無跡不當時命而大窮乎天下則深根寧極而待此存身之道也若夫自隱而用物則道世交相興矣何隱之有哉時逢昏亂故聖道不行豈是韜光自隱其德邪莫知反一以息跡而逐跡以求一愈得跡愈失一斯大謬矣雖復起身以明之開言以出之顯知以發之何由而交興哉祇所以交喪也謬僞妄也非伏匿其身而不見雖見而不亂群非閉其言而不出雖出而不忤物非藏其知而不發雖發而不眩但時逢謬妄命遇迍邅故隨世污隆全身遠害也弗見賢遍反祇所音支此淡漠之時也反任物性而物性自一故無跡時逢有道命屬清夷則播德弘化大行天下既而人人反一物物歸根彼我冥符故無朕跡此不能淡漠之時也雖有事之世而聖人未始不淡漠也故深根寧極而待其自為耳斯道之所以不喪也時遭無道命值荒淫德化不行則大窮天下既而深固自然之本保寧至極之性安排而隨變化處常而待終年豈有窮通休戚於其間哉未有身存而世不興者也在窮塞而常樂處危險而安寧任時世之行藏可謂存身之道也古之行身者不以辨飾知不以知窮天下不以知窮德危然處其所而反其性已又何為哉道固不小行德固不小識小識傷德小行傷道故曰正己而已矣樂全之謂得志任其真知而已古人輕辨重訥賤言貴行是以古人之行任其身者必不用浮華之言辨飾分別之小智也此淡泊之情也窮者困纍之謂也不縱知毒害以困苦蒼生也淡大暫反泊音薄守其自德而已知止其分不以無涯而纍其自得也危然獨正之貌危猶獨也言獨居亂世之中處危而所在安樂動不傷寂恆反自然之性率性而動復何為之哉言其無為也危然如字郭云獨正貌司馬本作云獨立貌崔本作垝音如纍垝之垝垝然自持安固貌遊於坦途大道廣蕩無不範圍小成隱道固不小行矣於坦敕但反塊然大通上德之人智周萬物豈留意是非而為識鑒也塊然苦對反小識小知虧損深玄之盛德小學小行傷毀虛通之大道也自得其志獨夷其心而無哀樂之情斯樂之全者也夫己身履於正道則所作皆虛通也既而無順無逆忘哀忘樂所造皆適斯樂全之全者也至樂全矣然後志性得焉樂全音洛注下皆同世德堂本行作存闕誤引張君房本為下有乎字樂之全者依注文改古之所謂得志者非軒冕之謂也謂其無以益其樂而已矣今之所謂得志者軒冕之謂也軒冕在身非性命也物之儻來寄者也寄之其來不可圉其去不可止故不為軒冕肆志不為窮約趨俗其樂彼與此同故無憂而已矣今寄去則不樂由觀之雖樂未嘗不荒也故曰喪己於物失性於俗者謂之倒置之民全其內而足益加也軒車也冕冠也古人淳朴體道無為得志在乎恬夷取樂非關軒冕樂已足矣豈待加之也今世之人澆浮者衆貪美榮位待此適心是以戴冕乘軒用為得志也儻者意外忽來者耳軒冕榮華身外之物物之儻來非我性命暫寄而已豈可久長也儻來吐黨反崔本作黨云衆也慶藩案崔本儻作黨黨古儻字黨者或然之詞也史記淮陰侯傳恐其黨不漢書伍被傳黨可以徼幸並與儻同篇怪星之黨見楊注訓黨為頻王念孫謂於古無據惠定宇九經古義曰黨見猶所見也又訓黨為所則據公羊注義也亦似未協崔云黨衆也尤非在外物耳得失之非我也時屬儻來泛然而取軒冕命遭寄去淡爾而捨榮華既無心於扞禦豈有情於留也可圉魚呂反本又作禦淡然自若不覺寄之在身不為于僞反下同曠然自得不覺窮之在身肆申也趨競也古人體窮通之有命達榮枯之非己假使軒冕當塗亦未足申其志氣或儉約以窮窘豈趨競於囂俗彼此謂軒冕與窮約彼軒冕也此窮約也夫軒冕窮約俱是儻來既樂彼軒冕亦須喜茲窮約二俱是寄所以相同也亦無欣歡之喜也軒冕不樂窮約不苦安排去化所以無憂者也夫寄去則不樂者寄來則荒矣斯以外易內也今世之人識見浮淺是以物之寄也欣然而喜及去也悒然不樂豈知彼此事出儻來而寄去寄來常憂常喜故知雖樂而心未始不荒亂也營外虧內倒置也夫寄去寄來且憂且喜以己徇物非喪如何軒冕窮約事歸塵俗若習俗之常失於本性違真背道實此之由其所安置足為顛倒也倒置之民崔云逆其性命而不順也向云以外易內可謂倒置闕誤引張君房本命下有之有二字是字依世德堂本改就字依史記原文改荀子天論四字依劉文典補正本改其置倒三字依世德堂本改
