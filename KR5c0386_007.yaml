body:
  text: 內篇人間世第四與人群者不得離人然人間之變故世世異宜唯無心而不自用者為能隨變所適而不荷其纍也人間世此人間見事世所常行者也慶藩案文選潘安仁秋興賦注引司馬云言處人間之宜居亂世之理與人群者不得離人然人間之事故與世異宜唯無心而不自用者為能唯變所適而何足纍釋文闕離人力智反不荷胡我反又音河其纍力偽反顏回見仲尼請行姓顏名回字子淵魯人也孔子三千門人之中總四科入室弟子也仲尼者姓孔名丘字仲尼亦魯人殷湯之後生衰周之世有聖德即顏回之師也其根由事迹遍在儒史今既解釋莊子意在玄虛故不復委碎載之耳然人間事緒糾紛實難接物利他理在不易故寄顏孔以顯化導之方託此聖賢以明心齋之術也孔聖顏賢耳顏回孔子弟子姓顏名回字子淵魯人也曰奚之奚何也之適也質問顏回欲往何處耳曰將之衛衛即殷紂之都又是康叔之封今汲郡衛州是也此則顏答孔問欲行之所也曰奚為焉欲往衛國何所云為重責顏生行李意謂矣曰回聞衛君其年壯其行獨輕用其國而不見其過輕用民死死者以國量乎澤若蕉民其無如矣回嘗聞之夫子曰治國去之亂國就之醫門多疾願以所聞思其則庶幾其國有瘳乎不與民同欲也衛君即靈公之子蒯瞶也荒淫昏亂縱情無道其年少壯而威猛可畏獨行凶暴而不順物心顏子述己所聞以答尼父衛君司馬云衛莊公蒯瞶也案左傳衛莊公以魯哀十五年冬始入國時顏回已死不得為莊公蓋是出公輒也其行下孟反獨崔云自專也向云與人異也郭云不與人同欲夫君人者動必乘人一怒則伏尸流血一喜則軒冕塞路故君人者之用國不可輕之也夫民為邦本本固則邦寧不能愛重黎元方欲輕蔑其用欲不顛覆其可得乎莫敢諫也強足以距諫辨足以飾非故百姓惶懼而吞聲有過而無敢諫者也輕用之於死地不凝動靜泰然自安乃輕用國民投諸死地也舉國而輸之死地不可稱數視之若草芥也蕉草芥也或征戰屢興或賦稅煩重而死者其數極多語其多少以國為量若舉為數造次難悉縱恣一身不恤百姓視於國民如藪澤之中草芥者也國量音亮李力章反若蕉似遙反徐在堯反向云草芥也崔云芟刈也其澤如見芟夷言野無青草盧文弨曰蕉亦同樵故可訓芟夷家世父曰蕉與焦通風俗通水草交厝名之為澤若焦者水竭草枯如火然即詩如惔如焚之意左傳成九年雖有姬薑無棄蕉萃班固賓戲朝而榮華夕而焦瘁蕉焦字通博雅蕉黑也亦通焦陸氏音義引向云草芥也崔云芟刈也並誤稱數所主反無所依歸君上無道臣子飢荒非但無可奈何亦乃無所歸往也庶冀也幾近也瘳愈也治邦寧謐不假匡扶亂國孤危應須規諫顏生今將化衛是以述昔所聞思其稟受法言冀其近於善道譬彼醫門多能救疾方茲賢士必能拯難荒淫之疾庶其瘳愈者也治國直吏反醫門於其反思其則絶句崔李云則法也有瘳丑由反李云愈也闕誤引江南李氏本其下有所行二字則字屬下句仲尼曰嘻若殆往而刑耳其道不足以救彼患嘻怪笑聲也若汝也殆近也孔子哂其術淺未足化他汝若往於衛必遭刑戮者也嘻音熙又於其反闕誤引張君房本殆在而字下夫道不欲雜雜則多多則擾擾則憂憂而不救古之至人先存諸己而後存諸人所存於己者未定何暇至於暴人之所行宜正得其人若夫不得其人則雖百醫守病適足致疑而不能一愈也夫靈通之道唯在純粹必其喧雜則事緒繁多事多則中心擾亂心中擾亂則憂患斯起藥病既乖彼此俱困己尚不立焉能救物哉有其具然後可以接物也諸於也存立也古昔至德之人虛懷而遊世間必先安立己道然後拯救他人未有己身不存而能接物者也援引古人以為鑒誡不虛心以應物而役思以犯難故知其所存於己者未定也夫唯外其知以養真寄妙當於群才功名歸物而患慮遠身然後可以至於暴人之所行也夫唯虛心以應務忘智以養真寄當於群才歸功於萬物者方可處涉人間逗機行化也今顏回存立己身猶未安定是非喜怒勃戰胸中有何暇輒至於衛欲諫暴君此行未可也役思息嗣反遠身于萬反且若亦知夫德之所蕩而知之所為出乎哉德蕩乎名知出乎爭名也者相也知也者爭之器也二者凶器非所以盡行也德之所以流蕩者矜名故也知之所以橫出者爭善故也雖復桀跖其所矜惜無非名善也汝頗知德蕩智出所由乎哉夫德之所以流蕩喪真為矜名故也智之所以橫出逾分者爭善故也夫唯善惡兩忘名實雙遣者故能德不蕩至智不出者也而知音智下及注同所為于偽反爭善此及下爭名二字依字讀雖復扶又反下皆同桀跖之石反桀夏王也跖盜跖也夫名智者世之所用也而名起則相智用則爭興故遺名知而後行可盡也札傷也夫矜名則更相毀損顯智則爭競路興故二者並凶禍之器盡不可盡行於世相札徐於八反又側列反李云折也崔云夭也亦作軋崔又云或作禮相賓禮也盧文弨曰今本作軋慶藩案相札猶言相甲也廣雅札甲也今本札訛作禮又車搹焦札也太平御覽引作隼禮鈔本引作鷦禮古禮字作與札相似札訛為後人又改為禮耳今本廣雅作鷦亦札之訛崔撰札或作禮亦沿札形似而誤淮南説林篇鳥力勝日而服於禮禮亦為札之訛軋字依趙諫議本及世德堂本改盧校亦作軋覆宋本作蓋至之破體不可盡依正文及注改且德厚信矼未達人氣名聞不爭未達人心而強以仁義繩墨之言術暴人之前者是以人惡有其美也命之曰災人災人者人必反災之若殆為人災夫且苟為悅賢而惡不肖惡用而求有以異若唯無詔王公必將乘人而鬥其捷而目將熒之而色將平之口將營之容將形之心且成之是以火救火以水救水名之曰益多順始無窮若殆以不信厚言必死於暴人之前矣矼確實也假且道德純厚信行確實芳名令聞不與物爭而衛君素性頑愚凶悖少鑒既未達顏回之意氣豈識匡扶之心乎信矼徐古江反崔音控簡文云實貌夫投人夜光鮮不按劍者未達故也今回之德信與其不爭之名彼所未達也而強以仁義準繩於彼彼將謂回欲毀人以自成也是故至人不役志以經世而虛心以應物誠信著於天地不爭暢於萬物然後萬物歸懷天地不逆故德音發而天下響會景行彰而六合俱應而後始可以經寒暑涉治亂而不與逆鱗忤也繩墨之言即五德聖智也回之德性衛君未達而強用仁義之術行於暴人之前所述先王美言必遭衛君憎惡故不可也而強其兩反注同盧文弨曰今本作強書內並同不重出家世父曰祭義結諸心形諸色而術省之鄭注術當作述術暴人之前猶言述諸暴人之前人惡有烏路反下惡不肖及注同崔本有作育云賣也俞樾曰釋文惡音烏路反非也美惡相對為文當讀如本字有者育字之誤釋文云崔本作育云賣也説文貝部也讀若育此育字即之假字經傳每以鬻為之鬻亦音育也以人惡育其美謂以人之惡鬻己之美也鮮不息淺反涉治直吏反忤音誤適不信受則謂與己爭名而反害之命名也衛侯不達汝心謂汝災害於己既遭疑二必被反災故也災音災下皆同苟能悅賢惡愚聞義而服便為明君也苟為明君則不無賢臣汝往亦不足復奇如其不爾往必受害故以有心而往無往而可無心而應其應自來則無往而不可也殆近也夫歎也汝若往衛必近危亡為暴人所災害深可歎也且衛侯苟能悅愛賢人憎惡不肖故當朝多君子屏黜小人已有忠臣何求於汝汝至於彼亦何異彼人既與無異去便無益災夫音扶不肖音笑徐蘇叫反似也惡用音烏汝唯有寂然不言耳言則王公必乘人以君人之勢而角其捷辨以距諫飾非也詔言也王公衛侯也汝若行衛唯當默爾不言若有針規必遭戮辱且衛侯恃千乘之勢用五等之威飾非距諫鬥其捷辨汝既恐怖何暇匡扶也若唯郭如字一音唯癸反無詔絶句詔告也言也崔本作詻音云逆擊曰詻王公必將乘人絶句而鬥其捷在接反崔讀若唯無詻王公絶句必將乘人而鬥絶句捷作接其接引續也其言辨捷使人眼眩也熒眩也衛侯雖荒淫暴虐而甚俊辨聰明加持人君之威陵藉忠諫之士故顏回心生惶怖眼目眩惑者也熒之戶扃反向崔本作營音熒慶藩案營熒字古通用皆之借字也説文惑也從目熒省聲玉篇唯並胡亭二切字或作熒通作營又通作榮史記孔子世家匹夫而熒惑諸侯熒司馬貞本作營漢書吳王濞傳淮南王安傳營惑史記並作熒惑否象傳不可榮以祿虞翻本榮作營謂不可惑以祿也漢書禮樂志亂富貴之耳目漢紀作榮皆其證眼眩玄遍反不能復自異於彼也縱有諫心不敢顯異顏色靡順與彼和平自救解不暇衛侯位望既高威嚴可畏顏生恐禍及己憂懼百端所以口舌自營略無容暇形見也既懼災害故委順面從擎跽曲拳形迹斯見也容將形之謂擎跽也乃且釋己以從彼也豈直外形從順亦乃內心和同不能進善而更成彼惡故也適不能救乃更足以成彼之威以用也夫用火救火猛燎更增用水救水波浪彌甚故顏子之行適足成衛侯之暴不能匡勸可謂益多也尋常守故未肯變也未信而諫雖厚言為害汝之忠厚之言近不信用則雖誠心獻替而必遭刑戮於暴虐君人之前矣闕誤引江南古藏本術作衒苦字依世德堂本改營字依漢書改且昔者桀殺關龍逢紂殺王子比干是皆修其身以下傴拊人之民以下拂其上者也故其君因其修以擠之是好名者也昔者堯攻叢枝胥敖禹攻有扈國為虛厲身為刑戮其用兵不止其求實無已是皆求名實者也而獨不聞之乎名實者聖人之所不能勝也而況若乎龍逢比干居下而任上之憂非其事者也諡法賊民多殺曰桀殘義損善曰紂姓關字龍逢夏桀之賢臣盡誠而遭斬首比干殷紂之庶叔忠諫而被割心傴拊猶愛養也拂逆戾也此二子者並古昔良佐修飾其身仗行忠節以臣下之位憂君上之民臣有德而君無道拂戾其君咸遭戮辱援古證今足為龜鏡是知顏回化衛理未可行也關龍逢夏桀之賢臣王子比干殷紂之叔父以下遐嫁反傴紆甫反拊徐向音撫李云傴拊謂憐愛之也崔云猶嘔詬謂養也拂其符弗反崔云違也又芳弗反不欲令臣有勝君之名也擠墜也陷也毒也夏桀殷紂無道之君自不揣量猶貪令譽故因賢臣之修飾肆其鴆毒而陷之意在爭名逐利遂至於此故也以擠徐子計反又子禮反司馬云毒也一云陷也方言云滅也簡文云排也是好呼報反欲令力呈反夫暴君非徒求恣其欲復乃求名但所求者非其道耳堯禹二君已具前解叢枝胥敖有扈並是國名有扈者今雍州鄠縣是也宅無人曰虛鬼無後曰厲言此三國之君悉皆無道好起兵戈征伐他國豈唯貪求實利亦乃規覓虛名遂使境土丘虛人民絶滅身遭刑戮宗廟顛殞貪名求實一至如斯今古共知汝獨不聞也叢支才公反盧文弨曰今本作枝有扈音戶司馬云國名在始平郡案即今京兆鄠縣也虛厲如字又音墟李云居宅無人曰虛死而無後為厲慶藩案虛厲即虛戾也墨子魯問篇是以國為虛戾趙策齊為虛戾均作戾戾厲古音義通詩小雅節南山篇降此大戾大雅瞻卬篇戾作厲小宛翰飛戾天文選西都賦注引韓詩作厲孟子滕文公篇狼戾鹽鐵論未通篇作梁厲皆其證惜名貪欲之君雖復堯禹不能勝化也故與衆攻之而汝乃欲空手而往化之以道哉夫庸人暴主貪利求名雖堯禹聖君不能懷之以德猶興兵衆問罪夷凶況顏子匹夫空手行化不然之理亦在無疑故也趙諫議本無之字雖然若必有以也嘗以語我來嘗試也汝之化道雖復未弘既欲請行必有所以試陳汝意告語我來語我魚據反下同盧文弨曰舊作魚豫反訛今改正顏回曰端而虛勉而一則可乎正其形而虛其心也端正其形盡人臣之敬虛豁心慮竭匡諫之誠既承高命敢述所以耳言遜而不二也勉厲身心盡誠奉國言行忠謹才無差二如前二術可以行不曰惡惡可夫以陽為充孔揚采色不定常人之所不違因案人之所感以求容與其心名之曰日漸之德不成而況大德乎將執而不化外合而內不訾其庸詎可乎言未可也惡惡猶於何也於何而可言未可也惡惡皆音烏下同言衛君亢陽之性充張於內而甚揚於外強禦之至也陽剛猛也充滿也孔甚也言衛君以剛猛之性滿實內心強暴之甚彰揚外迹喜怒無常順心則喜違意則嗔神采氣色曾無定準莫之敢逆為性暴虐威猛尋常諫士賢人詎能逆忤夫頑強之甚人以快事感己己陵藉而乃抑挫之以求從容自放而遂其侈心也案抑也容與猶放縱也人以快善之事針規感動君乃因其忠諫而抑挫之以求快樂縱容遂其荒淫之意也挫之子臥反從容七容反言乃少多無回降之勝也衛侯無道其來已久日將漸漬之德尚不能成況乎鴻範聖明如何可望也故守其本意也飾非暗主不能從人諫如流固執本心誰肯變惡為善者也外合而內不訾即向之端虛而勉一耳言此未足以化之外形擎跽以盡足恭內心順從不敢訾毀以此請行行何利益化衛之道庸詎可乎斯則斥前端虛之術未宜行用之矣不訾向徐音紫崔云毀也趙諫議本快作使然則我內直而外曲成而上比內直者與天為徒與天為徒者知天子之與己皆天之所子而獨以己言蘄乎而人善之蘄乎而人不善之邪若然者人謂之童子是之謂與天為徒外曲者與人之為徒也擎跽曲拳人臣之禮也人皆為之吾敢不為邪為人之所為者人亦無疵焉是之謂與人為徒成而上比者與古為徒其言雖教謫之實也古之有也非吾有也若然者雖直而不病是之謂與古為徒若是則可乎顏回更説此三條也前陳二事已被詆訶今設三條庶其允合此標題目下釋其義顏生述己以簡宣尼是也而上時掌反下同物無貴賤得生一也故善與不善付之公當耳一無所求於人也此下釋義蘄求也言我內心質素誠直共自然之理而為徒類是知帝王與我皆稟天然故能忘貴賤於君臣遺善惡於榮辱復矜名以避惡求善於他人乎具此虛懷庶其合理蘄乎音祈依乎天理推己命若嬰兒之直往也然如此也童子嬰兒也若如向説推理直前行比嬰兒故人謂之童子結成前義故是之謂與天為徒也夫外形委曲隨順世間者將人倫為徒類也擎手跽足磬折曲躬俯仰拜伏者人臣之禮也而和同塵垢污隆任物人皆行此我獨不為邪是以為人所為故人無怨疾也擎徐其驚反跽徐其里反説文云長跪也曲拳音權無疵才斯反外形委曲隨人事之所當為者也此結也成於今而比於古也忠諫之事乃成於今君臣之義上比於古故與古之忠臣比干等類是其義也雖是常教實有諷責之旨謫責也所陳之言雖是教迹論其意旨實有諷責之心也謫之直革反諷責非鳳反敻古以來有此忠諫非我今日獨起針規者也寄直於古故無以病我也若忠諫之道自古有之我今誠直亦幸無憂纍此結前也呈此三條未知可不趙諫議本無之字信字依趙諫議本改依下疏文改仲尼曰惡惡可大多政法而不諜雖固亦無罪雖然止是耳矣夫胡可以及化猶師心者也當理無二而張三條以政之與事不冥也諜條理也當也法苟當理不俟多端政設三條大傷繁冗於理不當亦不安恬故於何而可也大多音泰徐敕佐反崔本作太不諜徐徒協反向吐頰反李云安也崔云間諜也俞樾曰政字絶句大多政者郭注所謂當理無二而張三條以政之也法而不諜四字為句列禦寇篇形諜成光釋文曰諜便僻也此諜字義與彼同謂有法度而不便僻也李訓安崔訓間諜並失其義雖未弘大亦且不見咎責設此三條雖復固陋既未行李亦幸無咎責者也罪則無矣化則未也胡何也顏回化衛止有是法才可獨善未及濟時故何可以及化也又解若止而勿行於理便是如其適衛必自遭殆也挾三術以適彼非無心而付之天下也夫聖人虛己應時無心譬彼明鏡方茲虛谷今顏回預作言教方思慮可不既非忘淡薄故知師其有心也挾三戶牒反顏回曰吾無以進矣敢問其方顏生三術一朝頓盡化衛之道進趣無方更請聖師庶聞妙法仲尼曰齋吾將語若有心而為之其易邪易之者天不宜夫有其心而為之者誠未易也顏回殷勤致請尼父為説心齋但能虛忘吾當告汝必有其心為作便乖心齋之妙故有心而索玄道誠未易者也曰齊本亦作齋同側皆反下同盧文弨曰今本作齋其易以豉反後皆同向崔云輕易也以有為為易未見其宜也爾雅云夏曰皓天言其氣皓汗也以有為之心而行道為易者天之下不見其宜言不宜以有為心齋也天徐胡老反向云天自然也盧文弨曰舊本皞從白今從注本從日心字依闕誤引張君房本及注文補趙諫議本無之字顏回曰回之家貧唯不飲酒不茹葷者數月矣如此則可以為齋乎茹食也葷辛菜也齋齊也謂心迹俱不染塵境也顏子家貧儒史具悉無酒可飲無葷可茹簞瓢蔬素已經數月請若此得為齋不不茹徐音汝食也葷徐許云反數月色主反曰是祭祀之齋非心齋也尼父答言此是祭祀神君獻宗廟俗中致齋之法非所謂心齋者也回曰敢問心齋向説家貧事當祭祀心齋之術請示其方仲尼曰若一志無聽之以耳而聽之以心無聽之以心而聽之以氣聽止於耳心止於符氣也者虛而待物者也唯道集虛虛者心齋也去異端而任獨者也乎志一汝心無復異端凝寂虛忘冥符獨化此下答於顏子廣示心齋之術者也去異起呂反下同耳根虛寂不凝宮商反聽無聲凝神心符心有知覺猶起攀緣氣無情慮虛柔任物故去彼知覺取此虛柔遣之又遣漸階玄妙也乎不著聲塵止於聽此釋無聽之以耳也符合也心起緣慮必與境合庶令凝寂不復與境相符此釋無聽之以心者也耳目去心意而符氣性之自得此虛以待物者也如氣柔弱虛空其心寂泊忘懷方能應物此解而聽之以氣也俞樾曰上文云無聽之以耳而聽之以心無聽之以心而聽之以氣此文聽止於耳當作耳止於聽傳寫誤倒也乃申説無聽之以耳之義言耳之為用止於聽而已故無聽之以耳也心止於符乃申説無聽之以心之義言心之用止於符而已故無聽之以心也符之言合也言與物合也與物合則非虛而待物之謂矣氣也者虛而待物者也乃申説氣字明當聽之以氣也郭注曰遺耳目去心意等語誤以符氣二字連讀不特失其義且不成句矣虛其心則至道集於懷也唯此真道集在虛心故如虛心者心齋妙道也者乎二字依世德堂本刪遺字依世德堂本及諸子平議改顏回曰回之未始得使實自回也得使之也未始有回也可謂虛乎未始使心齋故有其身未稟心齋之教猶懷封滯之心既不能隳體以忘身尚謂顏回之實有也未始得使絶句崔讀至實字絶句既得心齋之使則無其身既得夫子之教使其人以虛齋遂能物我洞忘未嘗回之可有也夫子曰盡矣吾語若若能入遊其樊而無感其名入則鳴不入則止無門無毒一宅而寓於不得已則幾矣夫子向説心齋之妙妙盡於斯放心自得之場當於實而止夫子語顏生化衛之要慎莫據其樞要且復遊入蕃傍亦宜晦迹消聲不可以名智感物樊蕃也譬之宮商應而無心故曰鳴也夫無心而應者任彼耳不強應也若已道狎衛侯則可鳴聲匡救如其諫不入耳則宜緘口忘言強顯忠貞必遭禍害不強其丈反使物自若無門者也付天下之自安無毒者也毒治也毒治也如水如鏡應感虛懷己不預作也無毒如字治也崔本作每云貪也家世父曰説文毒厚也老子亭之毒之無門者入焉不測其方無毒者遊焉不泥其迹應乎自然之符斯能入遊其藩而無感其名李楨曰門毒對文毒與門不同類説文毒厚也害人之草往往而生義亦不合毒乃壔之假借許壔下云保也亦曰高土也讀若毒與此注自安義合張行孚説文發疑曰壔者纍土為臺以傳信即呂氏春秋所謂為高保禱於王路置鼓其上遠近相聞是也禱當為壔之訛壔是保衛之所故借其義為保衛易經莊老三毒字正是此義老子亭之毒之周易以此毒天下而民從之毒字並是假借廣雅所以有毒安也一訓按為毒本字正與門同類所以門毒對文讀都皓切音之轉也不得已者理之必然者也體至一之宅而會乎必然之符者也宅居處也處心至一之道不得止而應之機感冥會非預謀也而寓崔本作如愚理盡於斯幾盡也應物理盡於斯也絶迹易無行地難為人使易以偽為天使難以偽聞以有翼飛者矣未聞以無翼飛者也聞以有知知者矣未聞以無知知者也瞻彼闋者虛室生白吉祥止止夫且不止是之謂坐馳夫徇耳目內通而外於心知鬼神將來舍而況人乎是萬物之化也禹舜之所紐也伏戲几蘧之所行終而況散焉者乎不行則易欲行而不踐地不可能也無為則易欲為而不傷性不可得也夫端居絶迹理在不難行不踐地故當不易亦猶無為虛寂應感則易有為思慮涉物則難其理必然故舉斯譬矣絶迹易無絶句向崔皆以無字屬下句盧文弨曰此讀謬甚何不依注視聽之所得者粗故易欺也至於自然之報細故難偽也則失真少者不全亦少失真多者不全亦多失得之報未有不當其分者也而欲違天為偽不亦難乎夫人情驅使其法粗淺而所以易欺天然馭用斯理微細是故難矯故知人間涉物必須率性任真也者粗音言必有其具乃能其事今無至虛之宅無由有化物之實也夫鳥無六翮必不可以摶空人無二知亦未能以接物也有知知者上音智下如字下句同夫視有若無虛室者也虛室而純白獨生矣瞻觀照也彼前境也闋空也觀察萬有悉皆空寂故能虛其心室乃照真源而智惠明白隨用而生白道也闋者徐苦穴反司馬云空也虛室生白崔云白者日光所照也司馬云室比喻心心能空虛則純白獨生也夫吉祥之所集者至虛至靜也吉者福善之事祥者嘉慶之徵止者凝靜之智言吉祥善福止在凝靜之心亦能致吉祥之善應也俞樾曰止止連文於義無取淮南子俶真篇作虛室生白吉祥止也疑此文下止字亦也字之誤唐盧重元注列子天瑞篇曰虛室生白吉祥止耳亦可證止止連文之誤若夫不止於當不會於極此為以應坐之日而馳騖不息也故外敵未至而內已困矣豈能化物哉苟不能形同稿木心若死灰則雖容儀端拱而精神馳騖謂形坐而心馳者也夫使耳目閉而自然得者心知之用外矣故將任性直通無往不冥尚無幽昧之責而況人間之纍乎徇使也夫能令根竅內通不緣於物境精神安靜外於心知者斯則外遣於形內忘於智則隳體黜聰虛懷任物鬼神冥附而舍止不亦當乎人倫鑽仰而歸依固其宜矣故外篇云無鬼責無人非也夫徇辭俊反徐辭倫反李云使也心知音智注同言物無貴賤未有不由心知耳目以自通者也故世之所謂知者豈欲知而知哉所謂見者豈為見而見哉若夫知見可以欲而為而得者則欲賢可以得賢為聖可以得聖乎固不可矣而世不知知之自知因欲為知以知之不見見之自見因欲為見以見之不知生之自生又將為生以生之故見目而求離朱之明見耳而責師曠之聰故心神奔馳於內耳目竭喪於外處身不適而與物不冥矣不冥矣而能合乎人間之變應乎世世之節者未之有也是指斥之名也此近指以前心齋等法能造化萬物孕育蒼生也伏牛乘馬號曰伏戲姓風即太昊几蘧者三皇已前無文字之君也言此心齋之道夏禹虞舜以為應物綱紐伏戲几蘧行之以終其身而況世間凡鄙疏散之人軌轍此道而欲化物所紐徐女酒反崔云系而行之曰紐簡文云紐本也伏戲本又作羲亦作犧同許宜反即大三皇之始也几蘧其居反向云古之帝王也李云上古帝王散焉悉旦反李云放也崔云德不及聖王為散之聰一本作聽竭喪息浪反虛室二字趙諫議本互易為字世德堂本作謂趙本亦作為為而依世德堂本互易葉公子高將使於齊問於仲尼曰王使諸梁也甚重齊之待使者蓋將甚敬而不急匹夫猶未可動而況諸侯乎吾甚栗之子常語諸梁也曰凡事若小若大寡不道以歡成事若不成則必有人道之患事若成則必有陰陽之患若成若不成而後無患者唯有德者能之吾食也執粗而不臧爨無欲清之人今吾朝受命而夕飲冰我其內熱與吾未至乎事之情而既有陰陽之患矣事若不成必有人道之患是兩也為人臣者不足以任之子其有以語我來重其使欲有所求也楚莊王之玄孫尹成子名諸梁字子高食采於葉僭號稱公王者春秋實為楚子而僭稱王齊即薑姓太公之裔其先禹之四嶽或封於呂故謂太公為呂望周武王封太公於營丘是為齊國齊楚二國結好往來玉帛使乎相繼不絶或急難而求救或問罪而請兵情事不輕委寄甚重是故諸梁憂慮詢道仲尼也葉公音攝子高楚大夫為葉縣尹僭稱公姓沈名諸梁字子高將使所吏反注及下待使同恐直空報其敬而不肯急應其求也齊侯迹爾往來心無真實至於迎待楚使甚自殷勤所請事情未達依允奉命既重預有此憂匹夫鄙志尚不可動況夫五等如何可動以此而量甚為憂栗之也栗之音栗李云懼也夫事無大小少有不言以成為歡者耳此仲尼之所曾告諸梁者也子者仲尼寡之言少夫經營事緒抑乃多端雖復大小不同而莫不以成遂為歡適也故諸梁引前所稟用發后機也常語魚據反下同盧文弨曰今本書常作嘗夫以成為歡者不成則怒矣此楚王之所不能免也情若乖阻事不成遂則有人倫之道刑罰之憂人患雖去然喜懼戰於胸中固已結冰於五藏矣喜則陽舒憂則陰慘事既成遂中情允愜變昔日之憂為今時之喜喜懼交集於一心陰陽勃戰於五藏冰聚結非患如何故下文云藏矣才浪反成敗若任之於彼而莫足以患心者唯有德者乎安得喪於靈府任成敗於前塗不以憂喜纍心者其唯盛德焉對火而不思涼明其所饌儉薄也臧善也清涼也承命嚴重心懷怖懼執用粗餐不暇精膳所饌既其儉薄爨人不欲思涼燃火不多無熱可避之也執衆家本並然簡文作熱粗音粗又才古反而不臧作郎反善也絶句一音才郎反句至爨字爨七亂反無欲清七性反字宜從從者假借也凊涼也之人言爨火為食而不思清涼明火微而食宜儉薄所饌士戀反所饌儉薄而內熱飲冰者誠憂事之難非美食之為也諸梁晨朝受詔暮夕飲冰足明怖懼憂愁內心燻灼詢道情切達照此懷也內熱與音餘下慎與同向云食美食者必內熱事未成則唯恐不成耳若果不成則恐懼結於內而刑網羅於外也夫情事未決成敗不知而憂喜存懷是陰陽之患也事若乖舛必不成遂則有人臣之道刑網斯及有此二患何處逃愆則恐懼丘勇反忝為人臣濫充末使位高德薄不足任之子既聖人情兼利物必有所以幸來告示以任而林反一音而鴆反闕誤引江南古藏本此句作寡有不道以成歡仲尼曰天下有大戒二其一命也其一義也子之愛親命也不可解於心臣之事君義也無適而非君也無所逃於天地之間是之謂大戒是以夫事其親者不擇地而安之孝之至也夫事其君者不擇事而安之忠之盛也自事其心者哀樂不易施乎前知其不可奈何而安之若命德之至也為人臣子者固有所不得已行事之情而忘其身何暇至於悅生而惡死夫子其行可矣戒法也寰宇之內教法極多要切而論莫過二事二事義旨具列下文自然結固不可解也夫孝子事親盡於愛敬此之性命出自天然中心率由故不可解千人聚不以一人為主不亂則散故多賢不可以多君無賢不可以無君此天人之道必至之宜夫君臣上下理固必然故忠臣事君死成其節此乃分義相投非關天性然六合雖寬未有無君之國若有罪責亦何處逃愆是以奉命即行無勞進退若君可逃而親可解則不足戒也結成以前君親大戒義矣夫孝子養親務在順適登仕求祿不擇高卑所遇而安方名至孝也夫禮親事主志盡忠貞事無夷險安之若命豈得揀擇利害然後奉行能如此者是忠臣之盛美也知不可奈何者命也而安之則無哀無樂何易施之有哉故冥然以所遇為命而不施心於其間泯然與至當為一而無休戚於其中雖事凡人猶無往而不適而況於君親哉夫為道之士而自安其心智者體違順之不殊達得喪之為一故能涉哀樂之前境不輕易施知窮達之必然豈人情之能制是以安心順命不乖天理自非至人玄德孰能如茲也哀樂音洛注下同施乎如字崔以豉反云移也慶藩案施讀為移不易施猶言不移易也晏子春秋外篇君臣易施荀子儒效篇哀虛之相施易之漢書衛綰傳人之所施易施並讀為移正言之則為易施倒言之則為施易也本王氏讀書雜志事有必至理固常通故任之則事濟事濟而身不存者未之有也又何用心於其身哉夫臣子事於君父必須致命盡情有事即行無容簡擇忘身整務固是其宜苟不得止應須任命也理無不通故當任所遇而直前耳若乃信道不篤而悅惡存懷不能與至當俱往而謀生慮死吾未見能成其事者也既曰行人無容悅惡奉事君命但當適齊有何間暇謀生慮死也而惡烏路反下皆同丘請復以所聞凡交近則必相靡以信遠則必忠之以言言必或傳之夫傳兩喜兩怒之言天下之難者也夫兩喜必多溢美之言兩怒必多溢惡之言凡溢之類妄妄則其信之也莫莫則傳言者殃故法言曰傳其常情無傳其溢言則幾乎全近者得接故以其信驗親相靡服也復以扶又反下注同遙以言傳意也凡交遊鄰近則以信情靡順相去遙遠則以言表忠誠此仲尼引己所聞勸戒諸梁也傳意丈專反下文並注同夫喜怒之言若過其實傳之者宜使兩不失中故未易也以言表意或使人傳彼此相投乍相喜怒為此使乎人間未易兩怒如字注同本又作怨下同未易以豉反下文注皆同溢過也喜怒之言常過其當也溢過也彼此兩人互相喜怒若其順情則美惡之言必當過者也嫌非彼言似傳者妄作類似也夫溢當之言體非真實聽者既疑似使人妄構也莫然疑之也莫致疑貌也既似傳者妄作遂生不信之心莫然疑之也就傳過言似於誕妄受者有疑則傳言者橫以輕重為罪也受者生疑心懷不信傳語使乎殃過斯及雖聞臨時之過言而勿傳也必稱其常情而要其誠致則近於全也夫處涉人間為使實難必須探察常情必使賓主折中不得傳一時喜怒致兩言窺能如是者近獲全身夫子引先聖之格言為當來之軌轍也而要一遙反則近附近之近趙諫議本作妄誕且以巧鬥力者始乎陽常卒乎陰至則多奇巧以禮飲酒者始乎治常卒乎亂至則多奇樂凡事亦然始乎諒常卒乎鄙其作始也簡其將畢也必巨本共好戲共好呼報反欲勝情至潛興害彼者也陽喜也陰怒也夫較力相戲非無機巧初始戲謔則情在喜歡逮乎終卒則心生忿怒好勝之情潛似相害世間喜怒情變例然此舉鬥力以譬之也家世父曰凡顯見謂之陽隱伏謂之陰鬥巧者必多陰謀極其心思之用以求相勝也不復循理忿怒之至欲勝之甚則情多奇譎巧詐百端也大至音泰本亦作泰徐敕佐反下同盧文弨曰今本書作泰奇巧如字又苦孝反尊卑有別旅酬有次乎治直吏反有別彼列反湛湎淫液也治理也夫賓主獻酬自有倫理之後無復尊卑初正卒亂物皆如此舉飲酒以為譬湛直林反又答南反湎面善反淫液以隻反淫荒縱橫無所不至宴賞既酬荒淫斯甚當歌屢舞無復節文多方奇異歡樂何極也夫煩生於簡事起於微此必至之勢也凡情常事亦復如然莫不始則誠信終則鄙惡初起簡少後必巨大是以煩生於簡事起於微此合喻也俞樾曰諒與鄙文不相對上文云乎陽常卒乎陰始乎治常卒乎亂陰陽治亂皆相對而諒鄙不相對諒疑諸字之誤諸讀為都爾雅釋地宋有孟諸史記夏本紀作明都是其例也始乎都常卒乎鄙都鄙正相對因字通作諸又誤作諒遂失其恉矣淮南子詮言篇曰故始於都者常大於鄙即本莊子可據以訂正彼文大字乃卒字之誤説見王氏念孫讀書雜志泰字依世德堂本及盧校改世德堂本無者也二字側辨依劉文典補正本改世德堂本荒作流夫言者風波也故行之則實喪矣夫水因風而起波譬心因言而喜怒也故因此風波之言而行喜怒者則喪於實理者也慶藩案波當讀為播鄭注禹貢云播散也波與播古字通言風播則易動也風播與實喪對文則不可作波浪訓矣外物篇司馬波臣注云波蕩之臣波蕩即播蕩也僖二十三年左傳波及晉國波亦當為播謂播散及晉國也本王引之經義述聞禹貢滎波既豬馬鄭王本並作播索隱云是播溢之義皆其證實喪息浪反注下同家世父曰實喪猶言得失實者有而存之喪者忽而忘之佹得而佹失者行之大患也故曰危郭象注行之則實喪矣遺風波而弗行則實不喪矣恐誤故遺風波而弗行則實不喪矣夫事得其實則危可安而蕩可定也風鼓水波易為動蕩譬言喪實理危殆不難也夫忿怒之作無他由也常由巧言過實偏辭失當耳夫施設忿怒更無所由每為浮偽巧言偏辭諂佞之故也偏辭音篇崔本作諞音辨譬之野獸蹴之窮地音急情盡則和聲不至而氣息不理茀然暴怒俱生疵以相對之夫野獸困窘之窮地性命將死鳴不擇音氣息茀鬱心生疵疾忽然暴怒搏噬於人此是起譬也氣息並如字向本作器云馬氏作息器氣也崔本作云喘息不調也又作蓽字慶藩案釋文氣一本作器氣器古通用氣正字器借字也大戴記文王官人篇其氣寬以柔周書氣作器是其證茀然徐符弗反郭敷末反李音怫崔音勃心厲如字李音賴蹴之子六反疑賣反又音詣本又作疣音尤疵士賣反又齊計反上若作疣此則才知反盧文弨曰蓋讀與睚眥同夫寬以容物物必歸焉剋核太精則鄙吝心生而不自覺也故大人蕩然放物於自得之場不苦人之能不竭人之歡故四海之交可全矣夫剋切責核逼迫太甚則不善之心欻然自應情事相感物理自然是知躁則失君寬則得衆也剋核幸格反苟不自覺安能知禍福之所齊詣也夫急躁忤物必拒之理數自相召不知所以且當時以不肖應之則誰知終後之禍者邪所齊如字又才計反慶藩案文選鮑明遠擬古詩注引司馬云誰知禍之所終者也傳彼實也承君令命以實傳之不得以臨時喜怒輒為遷改者也任其自成直陳君令任彼事情無勞勸獎強令成就也益則非任實者安於天命率性任情無勞添益語言過於本度也此事之危殆者故改其君命強勸彼其於情事大成危殆美成者任其時化譬之種植不可一朝成心之所美率意而成不由勸獎故能長久家世父曰美者久於其道而後化成一日之成不足恃也惡者一成而遂不及改美惡幾微之辨而難易形焉是以就美而去惡者人之常情也而勢常不相及有反施之而習而安焉者矣注意似隔彼之所惡而勸強成之則悔敗尋至心之所惡強勸而成不及多時尋當改悔所惡烏路反勸其丈反下欲同處涉人世銜命使乎先聖法言深宜戒慎寄物以為意也夫獨化之士混迹人間乘有物以遨遊運虛心以順世則何殆之有哉任理之必然者中庸之符全矣斯接物之至者也不得已者理之必然也寄必然之事養中和之心斯真理之造極應物之至妙者乎當任齊所報之實何為為齊作意於其間哉率己運命推理而行何須預生抑度為齊作報故也為為上如字下于偽反直為致命最易而以喜怒施心故難也直致率情任於天命甚自簡易豈有難邪此其難者言不難夫字依世德堂本移下世德堂本大作太也字依世德堂本補迫字依下疏文逼迫太甚改原誤在疏文下今改正成字依劉文典補正本改顏闔將傅衛靈公大子而問於蘧伯玉曰有人於此其德天殺與之為無方則危吾國與之為有方則危吾身其知適足以知人之過而不知其所以過若然者吾奈之何姓顏名闔魯之賢人也大子蒯瞶也顏闔自魯適衛將欲為太子之師傅也顏闔胡臘反向崔本作廅魯之賢人隱者盧文弨曰今本廅作盍衛靈公左傳云名元大子音泰司馬云蒯瞶也姓蘧名瑗字伯玉衛之賢大夫蒯瞶稟天然之凶德持殺戮以快心既是衛國之人故言有人於此將為儲君之傅故詢道於哲人蘧其居反伯玉名瑗衛大夫天殺如字謂如天殺物也徐所列反夫小人之性引之軌制則憎己縱其無度則亂邦方猶法稟性凶頑不履仁義與之方法而軌制憎己所以危身縱之無度而荒淫顛蹶所以亡國無方李云方道也不知民過之由己故罪責於民而不自改己之無道曾不悛革百姓有罪誅戮極深唯見黔首之不知過之由己既知如風靡草是知責在於君其知音智然猶如是將奈之何詢道蘧瑗故陳其所以蘧伯玉曰善哉問乎戒之慎之正女身也哉形莫若就心莫若和雖然之二者有患就不欲入和不欲出形就而入且為顛為滅為崩為蹶心和而出且為聲為名為妖為孽彼且為嬰兒亦與之為嬰兒彼且為無町畦亦與之為無町畦彼且為無崖亦與之為無崖達之入於無疵反覆與會俱所以為正身戒勗也己身不可率耳防慎儲君勿輕犯觸身履正道隨順機宜前歎其能問後則示其方法也正女音汝下同反覆芳服反形不乖忤和而不同身形從就不乖君臣之禮心智和順迹混而事濟之也前之二條略標方術既未盡善猶有其患纍也就者形順入者遂與同郭注云就者形順入者遂與同也和者以義濟出者自顯伐也心智和順方便接引推功儲君不顯己能斯不出也若遂與同則是顛危而不扶持與彼俱亡矣故當格天地但不立小異耳顛覆也滅絶也崩壞也蹶敗也形容從就同入彼惡則是顛危而不扶持故致顛覆滅絶崩蹶敗壞與彼俱亡也矣為蹶徐其月反郭音厥李舉衛反摸格莫胡反盧文弨曰今本摸從木作模自顯和之且有含垢之聲濟彼之名彼將惡其勝己妄生妖孽故當悶然若晦玄同光塵然後不可得而親不可得而疏不可得而利不可得而害變物為妖孽災也雖復和光同塵而自顯出己智不能韜光晦迹故有濟彼之名蒯瞶惡其勝己謂其妄生妖孽故以事而害之家世父曰和始五味之相濟甘辛並用混合無形若表而出之則非和矣時其喜怒因其緩急以調伏其機而不與為迎拒有迎拒斯有出入和不欲出為無拒也孽彥列反將惡烏路反悶然音門不小立圭角以逆其鱗也町畔也畦垺也與共也入會也夫處世接物其道實難不可遂與和同亦無容頓生乖忤或同嬰兒之愚鄙且復無知或類田野之無畦略無界畔縱奢侈之貪求任凶猛之殺戮然後道之以德齊之以禮達斯趣者方會無纍之道也嬰兒李云喻無意也崔云喻驕遊也無町徒頂反畦戶圭反李云町畦畔埒也無畔埒無威儀也崔云喻守節無崖司馬云不顧法也無疵似移反病也世德堂本無也字以字也字依趙諫議本及世德堂本刪模字依世德堂本及盧校改汝不知夫螳蜋乎怒其臂以當車轍不知其不勝任也是其才之美者也戒之慎之積伐而美者以犯之幾矣夫螳蜋之怒臂非不美也以當車轍顧非敵耳今知之所無奈何而欲強當其任即螳蜋之怒臂也螳蜋有斧蟲也夫螳蜋鼓怒其臂以當軒車之轍雖復自恃才能之美善而必不勝舉其職任喻顏闔欲以己之才能以當儲君之勢何異乎螳蜋怒臂之當車轍也不勝音升慶藩案御覽九百四十六引司馬云非不有美才顧不勝任耳釋文闕積汝之才伐汝之美以犯此人危殆之道積蘊蓄也而汝也幾危也既傅儲君應須戒慎今乃蘊蓄才能自矜汝美犯觸威勢必致危亡汝不知夫養虎者乎不敢以生物與之為其殺之之怒也不敢以全物與之為其決之之怒也時其飢飽達其怒心虎之與人異類而媚養己者順也故其殺者逆也恐其因有殺心而遂怒也汝頗知世有養虎之法乎豬羊之類不可生供猛獸恐其因殺而生嗔怒也家世父曰幾矣言其怒視螳蜋幾近之也此不自量其才者也虎之怒也而可使馴馬之良也而使缺銜毀首碎胸以怒無他勿與攖之而已螳蜋之攖車轍奚所利而為之哉為其于偽反下同方使虎自齧分之則因用力而怒矣汝頗知假令以死物投獸猶須先為分決若使虎自齧分恐因用力而怒之也分之如字知其所以怒而順之知飢飽之時達喜怒之節通於物理豈復危亡順理則異類生愛逆節則至親交兵夫順則悅媚虎狼可以馴狎逆則殺害至親所以交兵媚己之道既同涉物之方無別也家世父曰達其怒心自有作用所謂順者非務徇其欲也無使殺焉而不導之以為怒也無使決焉而不縱之以為怒也苟無攖其怒而已其心常有所自達焉則順矣夫愛馬者以筐盛矢以蜄盛溺適有虻僕緣而拊之不時則缺銜毀首碎胸意有所至而愛有所亡可不慎邪矢溺至賤而以寶器盛之愛馬之至者也蜄大蛤也愛馬之屎意在貴重屎溺至賤以大蜄盛之情有所滯遂至於是也盛矢音成下及注同矢或作屎同以蜄徐市軫反蛤類溺奴弔反僕僕然群著馬音文本或作同虻孟庚反僕緣普木反徐敷木反向云僕僕然虻緣馬稠穊之貌崔音如字云僕御王念孫曰案向崔二説皆非也僕之言附也言虻附緣於馬體也僕與附聲近而義同大雅既醉篇景命有僕毛傳曰僕附也鄭箋曰天之大命又附著於女文選子虛賦注引廣雅曰僕謂附著於人案今廣雅無此語廣雅疑廣倉之訛群著直略反雖救其患而掩馬之不意而拊李音撫又音付一音附崔本作府音附掩其不備故驚而至此僕聚也拊拍也銜勒也適有虻群聚緣馬主既愛惜卒然拊之意在除害不定時節掩馬不意忽然驚駭於是馬缺銜勒挽破轡頭人遭蹄踏毀首碎胸者也意至除患率然拊之以至毀碎失其所以愛矣故當世接物逆順之際不可不慎也亡猶失也意之所在乎愛馬既以毀損即失其所愛人間涉物其義亦然機感參差即遭禍害拊馬之喻深宜慎之也家世父曰人與人相接而成世而美惡生焉從違判焉順逆形焉如是而大患因之以生謂人之不足與處也而烏知己之不足與處人也處己以無用斯得之矣德蕩乎名知出乎爭為此一篇之主腦篇尾五段去名與爭乃可出入於人間世率然疏律反本或作卒七忽反至字依正文及郭注改匠石之齊至於曲轅見櫟社樹其大蔽數千牛潔之百圍其高臨山十仞而後有枝其可以為舟者旁十數觀者如市匠伯不顧遂行不輟之適也曲轅地名也其道屈曲猶如嵩山之西有轘轅之道即斯類也櫟木名也社土神也祀封土曰社社吐也言能吐生萬物故謂之社也匠是工人之通稱石乃巧者之私名其人自魯適齊塗經曲道睹茲異木擁腫不材欲明處涉人間必須以無用為用也曲轅音袁司馬云曲轅曲道也崔云道名櫟力狄反李云木名一云梂也盧文弨曰梂衆本作采訛今從宋本正潔約束也櫟社之樹特高常木枝葉覆蔭蔽數千牛以繩束之圍粗百尺江南莊本多言其大蔽牛無數千字此本應錯且商丘之木既結駟千乘曲轅之樹豈蔽一牛以此格量數千之本是也蔽牛必世反李云牛住其旁而不見潔向徐戶結反徐又虎結反約束也慶藩案文選賈長沙過秦論注引司馬云潔匝也釋文闕百圍李云徑尺為圍蓋十丈也七尺曰仞此樹直竦崟岑七十餘尺然後挺生枝幹蔽日捎雲堪為船者旁有數十木之大蓋其狀如是也十仞小爾雅云四尺曰仞案七尺曰仞崔本作千仞或云八尺曰仞旁十數所具反崔云旁旁枝也俞樾曰旁讀為方古字通用尚書皋陶謨篇方施象刑惟明新序節士篇方作旁甫刑篇方告無辜於上論衡變動篇方作旁並其證也在宥篇出入無旁即出入無方此本書假旁為方之證詩正月篇民今方殆鄭箋云方且也其可以為舟者方十數言可以為舟者且十數也釋文引崔曰旁旁枝也蓋不知旁為方假字故語詞而誤以為實義矣輟止也木大異常看者甚衆唯有匠石知其不材行塗直過曾不留視也觀者古奐反又音官匠伯伯匠石字也崔本亦作石慶藩案文選何平叔景福殿賦注王子淵洞簫賦注嵇叔夜琴賦注司馬紹統贈山濤詩注張景陽七命注並引司馬云匠石字伯釋文闕不輟丁劣反世德堂本無數千二字與釋文同闕誤引江南李氏及張君房本有弟子厭觀之走及匠石曰自吾執斧斤以隨夫子未嘗見材如此其美也先生不肯視行不輟何邪門人驚櫟社之盛美乃住立以視看自負笈以從師未見材有若此怪大也怪匠之不顧走及遂以咨詢厭於豔反又於瞻反曰已矣勿言之矣散木也以為舟則沈以為棺槨則速腐以為器則速毀以為門戶則液樠以為柱則蠹是不材之木也無所可用故能若是之壽已止也匠石知大木之不材非世俗之所用嫌弟子之辭費訶令止而勿言也櫟木體重為船即沈近土多敗為棺槨速折疏散之樹終於天年亦是不材之木故致間散也散木悉但反徐悉旦反下同則速如字向崔本作數向所祿反下同腐扶甫反人間器物貴在牢固櫟既疏脆早毀何疑也樠脂汗出也蠹木內蟲也為門戶則液樠而脂出為梁柱則蠹而不牢液音亦樠亡言反向李莫干反郭武半反司馬云液津液也樠謂脂出樠樠然也崔云黑液出也李楨曰廣韻二十二元樠松心又木名也説文樠松心木段注云疑有奪誤當作松心也一曰木名也陸所據是説文古本按松心有脂液樠正取此義謂脂出如松心也此莊子字法之妙疏與釋文義俱不明又廣韻釋曰松脂段云即樠為松脂之誤余疑為樠之或體蠹丁故反不在可用之數故曰散木間散疏脆故不材之木涉用無堪所以免早夭匠石歸櫟社見夢曰女將惡乎比豫哉若將比豫於文木邪夫柤梨橘柚果蓏之屬實熟則剝剝則辱大枝折小枝泄此以其能苦其生者也故不終其天年而中道夭自掊擊於世俗者也物莫不若是且豫求無所可用久矣幾死乃今得之為豫大用使豫也而有用且得有此大也邪且也若與豫也皆物也奈何哉其相物也而幾死之散人又惡知散木凡可用之木為文木惡乎猶於何也若汝也豫我也可用之木為文木也匠石歸寢櫟社感夢問於匠石汝將何物比並我哉為當將我作不材散木邪為當比豫於有用文章之木邪見夢胡薦反女將音汝惡乎音烏下同夫在樹曰果柤梨之類在地曰蓏瓜瓠之徒汝豈比我於此之輩者耶柤側加反橘均必反柚由救反徐以救反果蓏徐力果反物皆以自用傷夫果蓏之類其味堪食子實既熟即遭剝落於是大枝折損小枝發泄此豈不為滋味能美所以用苦其生毀辱之言即斯之謂且春生秋落乃盡天年中塗打擊名為橫夭而有識無情世俗人物皆以有用傷夭其生故此結言莫不如是掊打也泄徐思列反崔云泄泄同俞樾曰泄字之義於此無取殆非也泄當讀為抴荀子非相篇接人則用抴楊注抴牽引也小枝抴謂見牽引也詩七月篇取彼斧斨以伐遠揚即此所云大枝折也又曰猗彼女桑即此所云小枝抴也鄭箋云女桑少枝少枝即小枝矣猗乃掎之假字説文手部掎偏引也是與抴同義苦其如字崔本作枯掊普口反徐方垢反數有睨己者唯今匠石明之耳幾死音祈又音機下同數有音朔普係反睨五係反積無用乃為濟生之大用不材無用必獲全生櫟社求之其來久矣而庸拙之匠疑是文木頻去顧盼欲見誅翦懼夭斧斤鄰乎死地今逢匠伯鑒我不材方得全生為我大用幾近也若有用見伐向使我是文木而有材用必遭翦截夭折斧斤豈得此長大而壽年乎汝之與我皆造化之一物也與物豈能相知奈何哉假問之辭以戲匠石匠石以不材為散櫟社以材能為無用故謂石為散人也炫材能於世俗故鄰於夭折我以疏散而無用故得全生汝是近死之散人安知我是散木耶託於夢中以戲匠石也而幾死之絶句向同一讀連下散人為句崔同久字依世德堂本改匠石覺而診其夢弟子曰趣取無用則為社何邪診占也匠石既覺思量睡中占候其夢説向弟子也覺古孝反而診徐直信反司馬向云診占夢也王念孫曰向秀司馬彪並云診占夢也案下文皆匠石與弟子論櫟社之事無占夢之事診當讀為畛爾雅云畛告也郭注引曲禮曰畛於鬼神畛與診古字通此謂匠石覺而告其夢於弟子非謂占夢也猶嫌其以為社自榮不趣取於無用而已櫟木意趣取於無用為用全其生者則何為為社以自榮乎門人未解故起斯問也曰密若無言彼亦直寄焉以為不知己者詬厲也不為社者且幾有翦乎且也彼其所保與衆異而以義之不亦遠乎社自來寄耳非此木求之為社也若汝也彼謂社也汝但慎密莫輕出言彼社之神自來寄託非關此木為社也言此木乃以社為不知己而見辱病者也豈榮之哉詬辱也思此社神為不知我以無用為用貴在全生乃橫來寄託深見詬病翻為羞恥豈榮之哉詬李云呼豆反徐音垢厲如字司馬云詬辱也厲病也自以無用為用則雖不為社亦終不近於翦伐之害本以疏散不材故得全其生道假令不為社樹豈近於翦伐之害乎且幾音機或音祈翦乎子淺反崔本作前于慶藩案乎崔本作于于即乎也論語為政篇書云孝乎惟孝皇侃本及漢石經並作于呂覽審應篇然則先王聖于高注于乎也皆其例不近附近之近下同彼以無保為保而衆以有保為保疏散之樹以無用保生文木之徒以才能折夭所以為其異之者也利人長物禁民為非社之義也夫無用者泊然不為而群才自用自用者各得其敘而不與焉此以無用之所以全生也汝以社譽之無緣近也乎夫散木不材稟之造物賴其無用所以全生而社神寄託以成詬厲更以社義讚譽失之彌遠義譽音餘注同盧文弨曰今本書譽作喻長物丁兩反泊然步各反不與音餘喻字依世德堂本及盧校改本字依疏文及世德堂本改自字及以字依宋本刪南伯子綦遊乎商之丘見大木焉有異結駟千乘隱將芘其所藾子綦曰此何木也哉此必有異材夫仰而視其細枝則拳曲而不可以為棟梁俯而其大根則軸解而不可以為棺槨咶其葉則口爛而為傷嗅之則使人狂酲三日而不已其枝所陰可以隱芘千乘者也伯長也其道甚尊堪為物長故之伯即南郭子綦也商丘地名在梁宋之域駟馬曰乘藾陰也子綦於宋國之中徑於商丘之地遇見大木異於尋常樹木粗長枝葉茂盛垂陰布影蔭覆極多連結車乘可芘千匹馬也南伯李云即南郭也伯長也商之丘司馬云今梁國睢陽縣是也千乘繩證反隱崔云傷於熱也將芘本亦作庇徐甫至反又悲位反崔本作比云芘也所藾音賴崔本作賴向云蔭也可以蔭芘千乘也李同所陰於鴆反子綦既睹此木不識其名疑有異能故致斯大軸解者如車軸之轉謂轉心木也周身為棺棺完也周棺為槨夫梁棟須直拳曲所以不堪棺槨藉牢解散所以不固也異材夫音符仰而向崔本作從而則拳本亦作卷音權軸直竹反解李云如衣軸之直解也以舌咶葉則脣口爛傷用鼻嗅之則醉悶不止酲酒病也咶食紙反嗅崔作許救反盧文弨曰舊作崔云云字訛今改正狂酲音呈李云狂如酲也病酒曰酲闕誤引張君房本隱將作將隱視字依世德堂本改也者二字依世德堂本刪子綦曰此果不材之木也以至於此其大也嗟乎神人以此不材通體不材可謂全生之大才衆無用乃是濟物之妙用故能不夭斤斧而蔭庇千乘也矣夫王不材於百官故百官御其事而明者為之視聰者為之聽知者為之謀勇者為之扞夫何為哉玄默而已而群材不失其當則不材乃材之所至賴也故天下樂推而不厭乘萬物而無害也夫至人神矣陰陽所以不測混迹人間和光所以不耀故能深根固蒂長生之久視舟船庶物蔭覆黔黎譬彼櫟社方茲異木是以嗟歎神人之用不材者大材也為之于偽反下為之皆同趙諫議本乘作臣宋有荊氏者宜楸柏桑其拱把而上者求狙猴之杙者斬之三圍四圍求高名之麗者斬之七圍八圍貴人富商之家求樿傍者斬之故未終其天年而中道之夭於斧斤此材之患也故解以之以牛之白顙者與豚之亢鼻者與人有痔病者不可以適河此皆巫祝以知之矣所以為不祥也此乃神人之所以為大祥也荊氏地名也宋國有荊氏之地宜此楸柏桑之三木悉皆端直堪為材用此略舉文木有材所以夭折對前散木無用所以全生也荊氏司馬云地名也一曰里名宜秋柏桑崔云荊氏之地宜此三木李云三木文木也盧文弨曰今本書秋作楸兩手曰拱一手曰把狙猴獮猴也杙橛也亦杆也拱把之木其材非大適可斬為杆橛以擊扞獮猴也拱恭勇反把百雅反徐甫雅反司馬云兩手曰拱一手曰把而上時掌反狙七餘反猴音侯之杙以職反又羊植反郭且羊反司馬作音八李云欲以栖戲狙猴也崔本作柭音跋云枷也麗屋棟也亦曰小船也高名榮顯也三尺四尺之圍其木稍大求榮華高屋顯好名船者輒取之也三圍崔云圍環八尺為一圍之麗如字又音禮司馬云小船也又屋也慶藩案名大也謂求高大之麗者用三圍四圍之木也謂大為名説見天下篇名山三百下樿旁棺材也亦言棺之全一邊而不兩合者謂之樿旁七圍八圍其木極大富貴之屋商賈之家求大板為棺材者當斬取之也求樿本亦作擅音膳盧文弨曰舊本樿從示訛注同今改正傍薄剛反崔云樿傍棺也司馬云棺之全一邊者謂之樿傍有材者未能無惜也為有用故不盡造化之年而中途夭於工人之手斯皆以其才能為之患害也巫祝解除棄此三者必妙選騂具然後敢用顙額也亢高也痔下漏病也巫祝陳狗以祠祭選牛豕以解除必須精簡純色擇其好者展如在之誠敬庶冥感於鬼神今乃有高鼻折額之豚白額不騂之犢痔漏穢病之人三者既不清潔故不可往於靈河而設祭奠者也古者將人沈河以祭河伯西門豹為鄴令方斷之即其類是也故解徐古賣反又佳買反注同向古邂反顙息黨反司馬云也亢鼻徐古葬反司馬云高也額折故鼻高崔云仰也痔徐直里反司馬云隱創也盧文弨曰舊脫云字今增適河司馬云謂沈人於河祭也騂具恤營反巫祝於此亦知不材者全也夫全生者天下之所謂祥也巫祝以不材為不祥而弗用也彼乃以不祥全生乃大祥也神人者無心而順物者也故天下所謂大祥神人不逆女曰巫男曰覡祝者執板讀祭文者也祥善也巫師祝史解除之時知此三者不堪享祭故棄而不用以為不善之物也然神聖之人知侔造化知不材無用故得全生是知白顙亢鼻之言痔病不祥之説適是小巫之鄙情豈曰大人之適智故才不全者神人所以為吉祥大善之事也之以二字依世德堂本互易杙無且羊音郭下疑脫作戕二字廣韻十一唐戕下云戕牁亦作牂牁則郎切漢書地理志牂牁郡注牂戕係船杙也是郭本作戕即戕柯之戕與杙形近義同而音殊其音且羊反是戕非杙明矣支離疏者頤隱於臍肩高於頂會撮指天五管在上兩髀為挫針治繲足以糊口鼓策播精足以食十人上徵武士則支離攘臂而遊於其間上有大役則支離以有常疾不受功上與病者粟則受三鍾與十束薪夫支離其形者猶足以養其身終其天年又況支離其德者乎四支離拆百體寬疏遂使頤頰隱在臍間肩膊高於頂上形容如此故以支離名之支離疏司馬云形體支離不全貌疏其名也頤以之反於頂如字本作項亦如字司馬云言脊曲頸縮也淮南曰脊管高於頂也會撮高豎貌五管五臟腧也五臟之腧並在人背古人頭髻皆近頂後今支離殘病傴僂低頭一使臟腧頭髻悉皆向上兩腳髀股攣縮而迫於肋也會古外反徐古活反向音活撮子外反向徐子活反崔云會撮項椎也指天司馬云會撮髻也古者髻在項中脊曲頭低故髻指天也向云兩肩竦而上會撮然也李楨曰崔云會撮項椎也説是大宗師篇句贅指天李云句贅項椎也其形如贅證知崔説是素問刺熱篇項上三椎陷者中也王注此舉數脊椎大法也沈氏彤釋骨曰項大椎以下二十一椎通曰脊骨曰脊椎崔知會撮是此者難經四十五難骨會大杼張注大杼穴名在項後第一椎兩旁諸骨自此檠架往下支生故骨會於大杼據此知會撮正從骨會取義又在大椎之間故曰項椎也撮唐徐堅初學記卷十九引作玉篇木節也與脊節正相似從木作於義為長按頤肩屬外説會撮五管屬內説頤隱故肩高項椎指天故藏腧在上各相因而致者也靈樞背腧篇肺腧在三椎之間心腧在五椎之間肝腧在九椎之間牌腧在十一椎之間腎腧在十四椎之間司馬訓髻是別一義詩小雅臺笠緇撮傳云緇撮緇布冠也正義曰言撮是小撮持其髻而已據此則以會撮為髻當亦是小撮持其髮故名之會與通説文骨擲之可以會髮者衛風會辨如星許氏引作周禮會五采玉琪注故書會作又士喪禮鬠辨用桑疏云以髻為鬠取以髮會聚之意會與鬠亦通集韻有字音撮髻也當是俗因會撮造為頭髻專字慶藩案釋文引崔云會撮項椎也字當作玉篇木椎也徂活切撮聲近尸子行險以撮撮乘載器音與鑽同周禮喪大記君殯用楯欑注輴乘柩之車欑猶菆也尸子所謂即禮之欑管崔本作管在上李云管腧也五藏之腧皆在上也兩髀本又作牌同音陛徐又甫婢反崔云僂人腹在髀裏也為許劫反司馬云脊曲髀豎故與並也挫針縫衣也治繲洗浣也糊飼也庸役身力以飼養其口命也挫徐子臥反郭租禾反崔云案也針執金反司馬云挫針縫衣也治繲佳賣反司馬云浣衣也向同崔作音糊口徐音胡李云食也崔云字或作互或作策小箕也精米也言其掃市場鼓箕策播揚土簡精粗也又解鼓策謂布蓍數卦兆也播精謂精判吉凶辨精靈也或掃市以供家口或賣卜以活身命所得之物可以養十人也鼓策初革反徐又音頰司馬云鼓也小箕曰策崔云鼓策揲蓍鑽龜也播精如字一音所字則當作數精司馬云簡米曰精崔云播精卜卦占兆也鼓策播精言賣卜慶藩案精當為糈之誤郭璞注南山經曰糈先呂反今江東音取釋文音取字當作糈精字古無取音與糈字形相似而誤説文糈糧也以食音嗣其無用故不自竄匿邊蕃有事徵求勇夫殘病之人不堪征討自得無懼攘臂遨遊恃其無用故不竄匿攘如羊反臂於其間如字司馬云間裏也崔本作攘臂於其開云開門中也竄匿女力反不任徭役故也國家有重大徭役為有痼疾故不受其功程者也役則不與賜則受之六石四斗曰鍾君上憂憐鰥寡矜恤貧病形殘既重受物還多故郭注云役則不預賜則受之者也三鍾司馬云六斛四斗曰鍾盧文弨曰舊本六訛斛今改正不與音豫神人無用於物而物各得自用歸功名於群才與物冥而無迹故免人間之害處常美之實此支離其德者也夫支離其形猶忘形也支離其德猶忘德也而況支離殘病適是忘形既非聖人故未能忘德夫忘德者智周萬物而反智於愚明並三光而歸明於昧故能成功不居為而不恃推功名於群才與物冥而無迹斯忘德者也夫忘形者猶足以養身終年免乎人間之害何況忘德者邪其勝劣淺深故不可同年而語矣是知支離其德者其唯聖人乎世德堂本無而遊二字簸字依世德堂本改按釋文不言精音取其謂一音所者指播字言故云字則當作數郭説殊誤恃字依疏文及世德堂本改孔子適楚楚狂接輿遊其門曰鳳兮鳳兮何如德之衰也來世不可待往世不可追也天下有道聖人成焉天下無道聖人生焉方今之時僅免刑焉福輕乎羽莫之知載禍重乎地莫之知避已乎已乎臨人以德殆乎殆乎畫地而趨迷陽迷陽無傷吾行吾行郤曲無傷吾足當順時直前盡乎會通之宜耳世之盛衰蔑然不足覺故曰何如何如猶如何也適之也時孔子自魯之楚舍於賓館楚有賢人姓陸名通字接輿知孔子歷聘行歌譏刺鳳兮鳳兮故哀歎聖人比於來儀應瑞之鳥也有道即見無道當隱如何懷此聖德往適衰亂之邦者耶趣當盡臨時之宜耳當來之世有懷道之君可應聘者時命如馳故不可待適往之時堯舜之主變化已久亦不可尋趣合當時之宜無勞瞻前顧後也付之自爾而理自生成生成非我也豈為治亂易節哉治者自求成故遺成而不敗亂者自求生故忘生而不死有道之君休明之世聖人弘道施教成就天下時逢暗主命屬荒季適可全生遠害韜光晦迹豈為于偽反治亂直吏反下同不瞻前顧後而盡當今之會冥然與時世為一而後妙當可全刑名可免方猶當今喪亂之時正屬衰周之世危行言遜僅可免於刑戮方欲執迹應聘不亦妄乎此接輿之詞譏誚孔子也僅音覲足能行而放之手能執而任之聽耳之所聞視目之所見知止其所不知能止其所不能用其自用為其自為恣其性內而無纖芥於分外此無為之至易也無為而性命不全者未之有也性命全而非福者理未聞也故夫福者即向之所謂全耳非假物也豈有寄鴻毛之重哉率性而動動不過分天下之至易者也舉其自舉載其自載天下之至輕者也然知以無涯傷性心以欲惡蕩真故乃釋此無為之至易而行彼有為之至難棄夫自舉之至輕而取夫載彼之至重此世之常患也至易以豉反下同知以音智欲惡烏路反舉其性內則雖負萬鈞而不覺其重也外物寄之雖重不盈錙銖有不勝任者矣為內福也故福至輕為外禍也故禍至重禍至重而莫之知避此世之大迷也夫視聽知能若有涯分止於分內可以全生求其分外必遭夭折全生所以為福夭折所以為禍而分內之福輕於鴻毛貪競之徒不知載之在己分外之禍重於厚地執迷之徒不知避之去身此蓋流俗之常患者也故寄孔陸以彰其纍也知避舊本作置云置也不勝音升夫畫地而使人循之其迹不可掩矣有其己而臨物與物不冥矣故大人不明我以耀彼而任彼之自明不德我以臨人而付人之自故能彌貫萬物而玄同彼我泯然與天下為一而內外同福也已止也殆危也仲尼生衰周之末當澆季之時執持聖迹歷國應聘頻遭斥逐屢被詆訶故重言已乎不如止而勿行也若用五德臨於百姓捨己效物必致危己猶如畫地作迹使人走逐徒費巧勞無由得掩以己率物其義亦然也畫地音獲迷陽猶亡陽也亡陽任獨不蕩於外則吾行全矣天下皆全其吾則凡稱吾者莫不皆全也迷亡也陽明也動也陸通勸尼父令其晦迹韜光宜放獨任之無為忘遣應物之明智既而止於分內無傷吾全生之行也迷陽司馬云迷陽伏陽也言詐狂曲成其行自足矣郤空也曲從順也虛空其心隨順物性則凡稱吾者自足也郤曲去逆反字書作廣雅云曲也盧文弨曰案今説文廣雅俱作慶藩案郤釋文引字書作為是也説文曲行也從只聲廣雅曲也集韻作云物曲也一曰曲受也玉篇音丘戟反説文又云讀若隱匿也象曲隱蔽形字本從作今作闕誤引張君房本吾行作郤曲治者亂者世德堂本無兩者字德字依趙諫議本改山木自寇也膏火自煎也桂可食故伐之漆可用故割之人皆知有用之用而莫知無用之用也寇伐也山中之木楸梓之徒為有材用橫遭寇伐膏能明照以充鐙炬為其有用故被煎燒豈獨膏木在人亦然山木自寇也膏火自煎也子然反司馬云木生斧柄還自伐膏起火還自消崔云山有木故火焚也桂心辛香故遭斫伐漆供器用所以割之俱為才能夭於斤斧有用則與彼為功無用則自全其生夫割肌膚以為天下者天下之所知也使百姓不失其自全而彼我俱適者悗然不覺妙之在身也楸柏橘柚膏火桂漆斯有用也曲轅之樹商丘之木白顙之牛亢鼻之豕斯無用也而世人皆炫己才能為有用之用而不知支離其德為無用之用也故郭注云有用則與彼為功無用則自全乎其生也悗然亡本反
