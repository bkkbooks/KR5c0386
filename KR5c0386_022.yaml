body:
  text: 外篇達生第十九以義名篇達生之情者不務生之所無以為達命之情者不務知之所無奈何養形必先之以物物有餘而形不養者有之矣有生必先無離形形不離而生亡者有之矣生之來不能卻其去不能止悲夫世之人以為養形足以存生而養形果不足以存生則世奚足為哉雖不足為而不可不為者其為不免矣生之所無以為者分外物也達生達暢也通也廣雅云生出也知之所無奈何者命表事也夫人之生也各有素分形之妍醜命之修短及貧富貴賤愚智窮通一豪已上無非命也故達生於性命之士性靈明照終不貪於分外為己事務也一生命之所鍾者皆智慮之所無奈之何也知止其分物稱其生生斯足矣有餘則傷物者謂資貨衣食旦夕所須夫頤養身形先須用物而物有分限不可無涯故凡鄙之徒積聚有餘而養衛不足者世有之矣物稱尺證反守形甚故生亡也既有此浮生而不能離形遺智愛形大甚亡失全生之道也如此之類世有之矣無離力智反下同大甚音泰非我所制則無為有懷於其閒生死去來委之造物妙達斯原故無所惡故彌養之而彌失之夫壽夭去來非己所制而世俗之人不悟斯理貪多資貨厚養其身妄謂足以存生深可悲歎養之彌厚則死地彌至厚養其形彌速其死故決定不足以存生莫若放而任之夫馳逐物境本為資生生既非養所存故知世閒物務何足為也性分各自為者皆在至理中來故不可免也是以善養生者從而任之分外之事不足為也分內之事不可不為也夫目見耳聽足行心知者稟之性理雖為無為故不務免也弘明集正誣論引知作命世德堂本無以字大字依釋文及世德堂本改夫欲免為形者莫如棄世棄世則無纍無纍則正平正平則與彼更生更生則幾矣事奚足棄而生奚足遺棄事則形不勞遺生則精不虧夫形全精復與天為一天地者萬物之父母也合則成體散則成始形精不虧是謂能移精而又精反以相天更生者日新之謂也付之日新則性命盡矣幾盡也更生日新也夫欲有為養形者無過棄卻世閒分外之事棄世則無憂纍無憂纍則合於正真平等之道平正則冥於日新之變故能盡道之玄妙則幾徐其依反所以遺棄之人世虛無何足捐棄生涯空幻何足遺忘故棄世事則形逸而不勞遺生涯則神凝而不損也俱不為也夫形全不擾故能保完天命精固不虧所以復本還原形神全固故與玄天之德為一無所偏為故能子萬物夫二儀無心而生化萬物故與天地合德者群生之父母所在皆成無常處夫陰陽混合則成體質氣息離散則反於未生之始家世父曰合者息之機也消之漸也散則復反而歸其本而機又於是息焉故曰成始終則有始天行也所以能移不主故常以成其大常也常處昌慮反與化俱也移者遷轉之謂也夫不勞於形不虧其精者故能隨變任化而與物俱遷也還輔其自然也相助也夫遣之又遣乃曰精之又精是以反本還元輔於自然之道也相天息亮反子列子問關尹曰至人行不窒蹈火不熱行乎萬物之上而不栗請問何以至於此其心虛故能御群實古人稱師曰子亦是有德之嘉名具斯二義故曰子列子即列禦寇也關尹姓尹名喜字公度為函谷關令故曰關令尹真人是老子弟子懷道抱德故禦寇詢之也窒塞也夫至極聖人和光匿耀潛伏行世混跡同塵不為物境障礙故等虛室空而無塞本亦作空字關尹李云關令尹喜也不窒珍悉反至適故無不可耳非物往可之冥於寒暑故火不能災一於高卑故心不恐懼蹈火徒報反總結前問意也關尹曰是純氣之守也非知巧果敢之列居豫語女凡有貌象聲色者皆物也物與物何以相遠夫奚足以至乎先是色而已則物之造乎不形而止乎無所化夫得是而窮之者物焉得而止焉彼將處乎不淫之度而藏乎無端之紀遊乎萬物之所終始一其性養其氣合其德以通乎物之所造夫若是者其天守全其神無郤物奚自入焉夫不為外物侵傷者乃是保守純和之氣養於恬淡之心而致之也非關運役心智分別巧詐勇決果敢而得之非知音智之列音例本或作例命禦寇令復坐我告女至言也豫語魚據反女音汝後同唯無心者獨遠耳相遠于萬反同是形色之物耳未足以相先也夫形貌聲色可見聞者皆為物也彼俱物何足以遠亦何足以先至乎俱是聲色故也唯當非色非聲絶視絶聽者故能超貌象之外在萬物之先也常遊於極夫不色不形故能造形色者也無變無化故能變化於萬物者也是以群有從造化而受形任變化之妙本夫至極者非物所制夫得造化之深根自然之妙本而窮理盡性者世間萬物何得止而控馭焉故當獨往獨來出沒自在乘正御辨於何待焉焉得於虔反止於所受之分彼之得道聖人方將處心虛淡其度量弘博終不滯於世閒冥然與變化日新大道無端無緒不始不終即用此混沌而為紀綱故聖人藏心晦跡於恍惚之鄉也終始者物之極夫物所始終謂造化也言生死始終皆是造化物固以終始為造化也而聖人放任乎自然之境遨遊乎造化之場飾則二矣率性而動故不二也不以心使之吐納虛夷故愛養元氣不以物離性抱一不離故常與玄德冥合也萬物皆造於自爾物之所造自然也既一性合德與物相應故能達至道之原通自然之本是者指斥以前聖人也自從也若是者其保守自然之道全而不虧其心神凝照曾無閒郤故世俗事物何從而入於靈府哉無郤去逆反闕誤引江南古藏本色上有形字闕誤引張君房本止作正夫醉者之墜車雖疾不死骨節與人同而犯害與人異其神全也乘亦不知也墜亦不知也死生驚懼不入乎其胸中是故物而不懾彼得全於酒而猶若是而況得全於天乎聖人藏於天故莫之能傷也復讎者不折鏌干雖有忮心者不怨飄瓦是以天下平均故無攻戰之亂無殺戮之刑者由此道也自此已下凡有三譬以況聖人任獨無心一者醉人二者利劍三者飄瓦此則是初夫醉人乘車忽然顛墜雖復困疾必當不死其謂心無緣慮神照凝全既而乘墜不知死生不是故遻於外物而情無懾懼之墜字或作隊同直類反後皆同家世父曰始守乎氣而終養乎神道家所謂鍊氣歸神也乘亦音繩又繩證反遻音悟郭音愕爾雅云遻忤也郭注云謂干觸盧文弨曰今本作不懾之涉反懼也李郭音習醉故失其所知耳非自然無心者也彼之醉人因於困酒猶得暫時凝淡不為物傷而況德全聖人冥於自然之道者乎物莫之傷故其宜矣不窺性分之外故曰藏夫聖人照等三光智周萬物藏光塞智於自然之境故物莫之傷矣夫干將鏌金耶雖與讎為用然報讎者不事折之以其無心此第二也干將鏌金耶並古之良劍雖用劍殺害因以結讎而報讎之人終不瞋怒此劍而折之也其為無心故物莫之害也鏌音莫本亦作莫干李云鏌耶干將皆古之利劍名吳越春秋云吳王闔閭使干將造劍劍有二狀一曰干將二曰鏌耶鏌耶干將妻名也飄落之瓦雖復中人人莫之怨者由其無情飄落之瓦偶爾傷人雖忮逆褊心之夫終不怨恨為瓦是無心之物此第三也忮心之豉反郭李音支害也字書云佷也飄瓦匹遙反郭李云落也雖復扶又反下章同中人丁仲反凡不平者由有情無情之道大矣夫海內清平遐荒靜息野無攻戰之亂朝無殺戮之刑者蓋由此無為之道無心聖人故致之也是知無心之義大矣喻諭古字通但比喻字疏文前皆作喻不開人之天而開天之天開天者德生開人者賊生不厭其天不忽於人民幾乎以其真不慮而知開天也知而後感開人也然則開天者性之動也開人者知之用也郭注云不慮而知開天者也知而後感開人者也然則開天者性之動開人者知之用郭得之矣無勞更釋性動者遇物而當足則忘餘斯德生也知用者從感而求而不已斯賊生也夫率性而動動而常寂故德生也運智御世為害極深故賊生也老經云以智治國國之賊不以智治國國之德也任其天性而動則人理亦自全矣常用自然之性不厭天者也任智自照於物斯不忽人者也不厭李於豔反徐於瞻反民之所患僞之所生常在於知用不在於性動也幾盡也因天任人性動智用既而人天無別知用不殊是以率土盡真蒼生無僞者也幾乎音機或音祈闕誤引劉得一本天作人世德堂本作勸仲尼適楚出於林中見痀僂者承蜩猶掇之也痀僂老人曲腰之貌承蜩取蟬也掇拾也孔子聘楚行出林籟之中遇老公以竿承蟬如俯拾地芥一無遺也痀郭於禹反李徐居具反又其禹反僂郭音縷李徐良付反承一本作美慶藩案承讀為拯說文作拯謂引取之也艮六二不拯其隨虞翻曰拯取也釋文拯作承通志堂本改承為拯云音拯救之拯復渙初六用拯馬壯吉釋文子夏拯作取也列子黃帝篇使弟子並流而承之釋文承音拯引方言出溺為承今方言作拯宣十二年左傳曰目於眢井而拯之釋文拯作承云音拯皆引取之義也蜩音條蟬也猶掇丁活反拾也渙字依易釋文改仲尼曰子巧乎有道邪曰我有道也五六月纍丸二而不墜則失者錙銖纍三而不墜則失者十一纍五而不墜猶掇之也吾處身也若厥株拘吾執臂也若槁木之枝雖天地之大萬物之多而唯蜩翼之知吾不反不側不以萬物易蜩之翼何為而不得怪其巧妙一至於斯故問其方答云有道也纍二丸於竿頭是用手之停審也故其承蜩所失者不過錙銖之閒也錙銖稱兩之微數也初學承蜩時經半歲運手停審故所失不多五六月司馬云黏蟬時也纍丸劣彼反下同司馬云謂纍之於竿頭也慶藩案列子釋文引司馬云纍垸謂纍丸於竿頭也與釋文小異者錙側其反銖音殊所失愈時節久纍丸多所承之蜩十失其一也停審之至故乃無所復失纍五丸於竿頭一無墜落停審之意遂到於斯是以承蜩蟬猶如俯拾不動之至拘謂斫殘枯樹枝也執用也我安處身心猶如枯樹用臂執竿若槁木之枝凝寂停審不動之至斯言有道此之謂也若厥本或作橛同其月反株音誅拘其俱反郭音俱李云厥豎也豎若株拘也盧文弨曰也字未刻依宋本補家世父曰列子黃帝篇作若橛株駒注云株駒斷木也山海經海內經木有九欘下有九枸郭璞注欘枝回曲也枸根盤錯也說文株木根也徐鉉曰在土曰根在土上曰株株枸者近根盤錯處厥者斷木為杙也身若斷株臂若槁木之枝皆堅實不動之意若槁苦老反二儀極大萬物甚多而運智用心唯在蜩翼蜩翼之外無他緣慮也遺彼故得此反側猶變動也外息攀緣內心凝靜萬物雖衆不奪蜩翼之知是以事同拾芥何為不得也趙諫議本作橛世德堂本無故字少字依世德堂本改建字依山海經原文改孔子顧謂弟子曰用志不分乃凝於神其痀僂丈人之謂乎夫運心用志凝靜不離故纍丸乘蜩妙凝神鬼而尼父勉勖門人故云痀僂丈人之謂也不分如字俞樾曰凝當作疑下文梓慶削木為鐻鐻成見者驚猶鬼神即此所謂乃疑於神也列子黃帝篇正作疑張湛注曰意專則與神相似者也可據以訂正顏淵問仲尼曰吾嘗濟乎觴深之淵津人操舟若神吾問焉曰操舟可學邪曰可善游者數能若乃夫沒人則未嘗見舟而便操之也吾問焉而不吾告敢問何謂也觴深淵名也其狀似杯因以為名在宋國也津人謂津濟之人也操捉也顏回嘗經行李濟渡斯淵而津人操舟甚有方便其便辟機巧妙若神鬼顏回怪之故問夫子操舟七曹反下章同言物雖有性亦須數習而後能耳顏回問可學否答曰好游涉者數習則能夫物雖稟之自然亦有習以成性者數能音朔注下同沒人謂能鶩沒於水底注云謂鶩沒水底鶩鴨子也謂津人便水沒入水下猶如鴨鳥沒水因而捉舟鶩音木鴨也仲尼曰善游者數能忘水也若乃夫沒人之未嘗見舟而便操之也彼視淵若陵視舟之覆猶其車卻也覆卻萬方陳乎前而不得入其舍惡往而不暇以瓦注者巧以鉤注者憚以黃金注者惛其巧一也而有所矜則重外也凡外重者內拙習以成性遂若自然好游於水數習故能心無忌憚忘水者也視淵若陵故視舟之覆於淵猶車之卻退於阪也好水數游習以成性遂使顧視淵潭猶如陵陸假令舟之顛覆亦如車之卻退於阪之覆芳服反注下同猶其車卻也元嘉本無車字覆卻雖多而猶不以經懷以其性便故也舍猶心中也隨舟進退方便萬端陳在目前不關懷抱既忘水豈復勞心俞樾曰萬下脫物字此本以覆卻萬物為句方陳乎前而不得入其舍為句方者並也方之本義為兩舟相並故方有並義荀子致仕篇莫不明通方起以尚盡矣楊倞曰方起並起漢書楊雄傳雖方征僑與偓佺兮師古注曰方謂並行也皆其證也方陳乎前謂萬物並陳乎前也今上句脫物字而以方字屬上讀則所謂陳前者果何指歟郭注曰覆卻雖多而猶不以懷是其所據本有物字蓋正文是萬物故以多言若如今本作萬方當以廣大言不當以多言也列子黃帝篇正作覆卻萬物方陳乎前而不得入其舍可據以訂正所遇皆閒暇也率性操舟任真游水心無矜係何往不閒豈唯操舟學道亦爾但能忘遣即是達生惡往音烏閒暇音間所要愈重則其心愈矜也注射也用瓦器賤物而戲賭射者既心無矜惜故巧而中也以鉤帶賭者以其物稍貴恐不中垛故心生怖懼而不著也用黃金賭者既是極貴之物矜而惜之故心智昏亂而不中也是以津人以忘遣故若神射者以矜物故昏亂是以矜之則拙忘之則巧勗諸學者幸志之焉瓦注之樹反李云擊也憚徒丹反又音丹又丈旦反忌惡也一曰難也歹昏武典反又音昏又音門本亦作說文云瞀也元嘉本作昏盧文弨曰今本作舊瞀也作矜也訛今據本書改正慶藩案速也又呂覽去尤篇以黃金殶者殆殆疑也見襄四年公羊傳注亦迷惑之意黃金殶者之殶不別見呂覽高注亦云無考列子黃帝篇以瓦摳者淮南說林訓以金鉒者跂並襲莊子而不作殶字所要一遙反夫欲養生全內者其唯無所矜重也夫射者之心巧拙無二為重於外物故心有所矜只為貴重黃金故內心昏拙豈唯在射萬事亦然闕誤云呂覽注作殶餘同田開之見周威公威公曰吾聞祝腎學生吾子與祝腎游亦何聞焉學生者務中適田開之李云開之其名也周威公崔本作周威公灶俞樾曰史記周本紀王封其弟於河南是為桓公桓公卒子威公代立此周威公殆即其人乎索隱按系本西周桓公名揭威公之子東周公名班而威公之名不傳崔本可補史闕祝腎上之六反下市軫反字又作緊音同本或作賢學生司馬云學養生之道也務中丁仲反下章注而中適同姓田名開之學道之人姓祝名腎懷道者也周公之胤莫顯其名食采於周諡曰威也素聞祝腎學養生之道開之既從游學未知何所聞乎有此咨疑庶稟其術吾子與祝腎游司馬本以吾子屬上句更云子與祝腎游考字依俞樓雜纂改田開之曰開之操拔篲以侍門庭亦何聞於夫子開之謂祝腎為夫子拔篲掃帚也言我操提掃帚參侍門戶灑掃庭前而已亦何敢輒問先生之道乎古人事師皆擁篲以充役也操七曹反拔蒲末反徐甫末反李云把也篲似歲反徐以醉反郭稅反李尋恚反信醉反或蘇忽反帚也盧文弨曰信醉上脫又字亦何聞於夫子絶句豫字依釋文及世德堂本改威公曰田子無讓寡人願聞之讓猶謙也養生之道寡人願聞幸請指陳不勞謙遜開之曰聞之夫子曰善養生者若牧羊然視其後者而鞭之我承祝腎之說養生譬之牧羊鞭其後者令其折中而鞭如字崔本作云匿也視其羸瘦在後者匿著牢中養之也家世父曰崔說非也鞭其後則前者于于然行矣注視其後而前者不勞也謹持其終者也郭象注鞭其後者去其不及也亦誤威公曰何謂也未悟田開之言故更發疑問田開之曰魯有單豹者巖居而水飲不與民共利行年七十而猶有嬰兒之色不幸遇餓虎餓虎殺而食之有張毅者高門縣薄無不走也行年四十而有內熱之病以死豹養其內而虎食其外毅養其外而病攻其內此二子者皆不鞭其後者也姓單名豹魯之隱者也巖居飲水不爭名利雖復年齒長老而形色不衰久處山林忽遭餓虎所食單豹音善李云單豹隱人姓名也而水飲元嘉本作飲水姓張名毅亦魯人也高門富貴之家也縣薄垂簾也言張毅是流俗之人追奔世利高門甲第朱戶垂簾莫不馳驟參謁趨走慶弔形勞神弱困而不休於是內熱發背而死縣音玄薄司馬云簾也無不走也司馬云走至也言無不至門奉富貴也李云走往也俞樾曰無不走也語意未明司馬云走至也言無不至門奉富貴也亦殊迂曲走乃趣之壞字文選幽通賦李注引此文曰有張毅者高門縣薄無不趣義也字正作趣但衍義字耳呂覽必已篇曰張毅好恭門閭帷薄聚居衆無不趨高注曰過之必趨淮南人閒篇曰張毅好恭過宮室廊廟必趨見門閭聚衆必下廝徒馬圉皆與伉禮然不終其壽內熱而死其義更明莊子文不故學者莫得其解夫守一方之事至於過理者不及於會通之適也鞭其後者去其不及也單豹寡欲清虛養其內德而虎食其外張毅交游世貴養其形骸而病攻其內以死此二子各滯一邊未為折中故並不鞭其後也去其起呂反闕誤引劉得一本高上有見字仲尼曰無入而藏無出而陽柴立其中央三者若得其名必極夫畏塗者十殺一人則父子兄弟相戒也必盛卒徒而後敢出焉不亦知乎人之所取畏者衽席之上飲食之閒而不知為之戒者過也藏既內矣而又入之此過於入也注云入既入矣而又藏之偏滯於處此單豹也陽既外矣而又出之是過於出也陽顯也出既出矣而又顯之偏滯於出此張毅也若槁木之無心而中適是立也柴木也不滯於出不滯於處出處雙遣如槁木之無情妙捨二邊而獨立於一中之道名極而實當也夫因名詮理從理生名若得已前三句語意者則理窮而名極者也亦言得此三者名為證至極之人也塗道路也夫路有劫賊險難可畏十人同行一人被殺則親情相戒不敢輕行彊盛卒伍多結徒伴斟量平安然後敢去豈不知全身遠害乎畏塗司馬云阻險道可畏懼者也卒徒子忽反亦知音智十殺一耳便大畏之至於色欲之害動皆之死地而莫不冒之斯過之甚也衽衣服也夫塗路患難十殺其一猶相戒慎不敢輕行況飲食之間不能將節衽席之上恣其淫蕩動之死地萬無一全舉世皆然深為罪過衽而甚反徐而鴆反李云臥衣也鄭注禮記云臥席也動皆之死地一本無地字不冒音墨闕誤引江南古藏本取作最祝宗人元端以臨牢策說彘曰汝奚惡死吾將三月豢汝十日戒三日齊藉白茅加汝肩尻乎雕俎之上則汝為之乎為彘謀曰不如食以糠糟而錯之牢策之中自為謀則苟生有軒冕之尊死得於腞楯之上聚僂之中則為之為彘謀則去之自為謀則取之所異彘者何也祝祝史也如今太宰六祝官也元端衣冠策圈也彘豬也夫饗祭宗廟必有祝史具於元端冠服執版而祭鬼神未祭之間臨圈說彘說彘之文在於下也牢策初革反李云牢豕室也策木欄也說如字又始鋭反彘直例反本亦作豕牛豢養也俎盛肉器也謂雕飾之俎也說彘曰汝何須好生而惡死乎我將養汝以好食齊戒以潔清藉神坐以白茅置汝身於俎上如此相待豈不欲為之乎奚惡烏路反牛豢音患司馬云養也本亦作犧日齊側皆反後章同藉在夜反又在亦反尻苦羔反雕俎莊呂反畫飾之俎也欲贍則身亡理常俱耳不閒人獸也措置也腞畫飾也楯策車也謂畫輀車也聚僂棺槨也為彘謀者不如置之圈內食之糟不用白茅無勞雕俎自為謀則苟且生時有乘軒戴冕之尊死則置於棺中載於楯車之上則欲得為之為彘謀則去白茅雕俎自為謀則取於軒冕楯車而異彘者何也此蓋顛倒愚癡非達生之性也為彘于僞反下自為為彘同食以音嗣音康糟音遭錯之七故反置也又如字本又作措腞音直轉反又敕轉反楯食準反徐敕荀反李敕準反司馬云腞猶篆也楯猶案也聚僂力主反司馬云聚僂器名也今冢壙中注為之一云聚僂棺槨也一云聚當作菆才官反僂當作蔞力久反謂殯於菆塗蔞翣之中王念孫曰釋文引司馬云腞猶篆也楯猶案也僂器名也今冢壙中注為之一云僂棺槨也一云當作菆僂當作蔞謂殯於菆塗蔞翣之中案腞讀為輇謂載柩車也雜記載以輲車鄭注曰輲讀為輇釋文輇市專反又市轉反士喪禮記下篇注曰載柩車周禮謂之蜃車雜記謂之團或作輇或作槫聲讀皆相附耳其車之輿狀如床中央有轅前後出設前後輅輿上有四周下則前後有軸以輇為輪許叔重說有輻曰輪無輻曰輇輇輲槫團並字異而義同此作腞義亦同也楯讀為輴亦謂載柩車也檀弓曰天子之殯也菆塗龍輴以槨又曰天子龍輴而槨幬諸侯輴而設幬喪大記曰君殯用輴鄭注曰天子之殯居棺以龍輴諸侯輴不畫龍大夫廢輴士喪禮下篇注曰輁狀如長床穿桯前後著金而關軸焉大夫諸侯以上有四周謂之輴此謂朝廟時所用輴與楯古字通雜記注曰載柩以楯是其證也聚僂謂柩車飾也衆飾所聚故曰僂亦以其形中高而四下故言僂也雜記注曰將葬載柩之車飾曰柳周官縫人衣翣柳之材注曰柳之言聚飾之所聚劉熙釋名曰輿棺之車其蓋曰柳柳聚也衆飾所聚亦其形僂也檀弓曰設蔞翣荀子禮論篇曰無帾絲歶縷翣其以象菲帷幬尉也柳蔞縷僂並字異而義同呂氏春秋節喪篇僂翣以督之其字亦作僂釋文所引或說以僂為蔞翣字是也餘說皆失之家世父曰釋文引司馬云腞猶篆也楯猶案也聚僂器名也今冢壙中注為之疑楯與輴同腞楯即畫輴也喪大記所謂葬用輴者是也聚僂曲簿也荀子謂之簿器喪大記所謂熬八筐大夫六筐士四筐是也輴者所以載柩故曰腞楯之上筐筲納之槨內棺外故曰聚僂之中皆大夫以上飾葬之具也闕誤引張君房本作豢闕誤引張潛夫本所上有其字趙諫議本閒作問下篇二字依下文補士喪禮下篇即既夕禮諸字依讀書雜志改君字依喪大記改桓公田於澤管仲御見鬼焉公撫管仲之手曰仲父何見對曰臣無所見公即桓公小白也畋獵於野澤之下而使管夷吾御車公因見鬼心有所怖懼執管之手問之答曰臣無所見此章明凡百病患多因妄係而成公反誒詒為病數日不出齊士有皇子告敖者曰公則自傷鬼惡能傷公夫忿滀之氣散而不反則為不足上而不下則使人善怒下而不上則使人善忘不上不下中身當心則為病誒詒是懈怠之容亦是悶之貌既見鬼憂惶而歸遂成病患所以不出去反一本作公反盧文弨曰今本作公反誒於代反郭音熙說文云可惡之辭也李呼該反一音哀詒吐代反郭音怡李音臺司馬云懈倦貌李云誒詒失魂魄也數日所主反司馬本作數月姓皇子字告敖齊之賢人也既聞公有病來問之云公妄係在心自遭傷病鬼有何力而能傷公欲以正理遣其邪病也皇子告敖如字司馬云皇姓告敖字齊之賢士也俞樾曰廣韻六止子字注復姓十一氏莊子有皇子告敖則以皇子為復姓列子湯問篇末載錕鋙劍火浣布事云皇子以為無此物殆即其人也鬼惡音烏夫人忿怒則滀聚邪氣於是精魂離散不歸於身則心虛弊犯神道不足也忿拂粉反李房粉反滀敕六反之氣散而不反則為不足李云忿滿也滀結聚也精神有逆則陰陽結於內魂魄散於外故曰不足夫邪氣上而不下則上攻於頭令人心中怖懼鬱而好怒下而不上陽伏陰散精神恍惚故好忘也夫心者五藏之主神靈之宅故氣當身心則為病上時掌反下同而不下則使人善怒下而不上則使人善忘亡尚反李云陽散陰凝故怒陰發陽伏故忘也不上不下中丁仲反身當心則為病李云上下不和則陰陽爭而攻心心精神主故病也氏字依諸子平議補桓公曰然則有鬼乎曰有沈有履灶有髻戶內之煩壤雷霆處之東北方之下者倍阿鮭蠪躍之西北方之下者則泆陽處之水有象丘有峷山有夔野有倣徨澤有委蛇公問所由答言有鬼沈者水下汙泥之中有鬼曰履灶神其狀如美女著赤衣名髻也沈有履司馬本作沈有漏云沈水汙泥也漏神名俞樾曰司馬云沈水汙泥也則當與水有岡象等句相次不當與灶有髻相次也沈當為煁煁從甚聲沈從冘聲兩音相近詩蕩篇其命匪諶說文心部引作天命匪忱常棣篇和樂且湛禮記中庸篇引作和樂且耽並其證也煁之通作沈猶諶之通作忱湛之通作耽矣白華篇卬烘於煁毛傳曰煁灶也是煁灶同類故以煁有履灶有髻並言之耳鄭裨諶字灶諶即煁之假字漢書古今人表作裨湛湛亦煁之假字李善注文選鄒陽上吳王書曰湛今沈字又注答賓戲曰湛古沈字然則以沈為煁即以湛為煁也灶有髻音結徐胡節反郭音詰李音吉司馬云髻灶神著赤衣狀如美女慶藩案史記孝武本紀索隱引司馬髻作浩云浩灶神也如美女衣赤門戶內糞壤之中其間有鬼名曰雷霆霆音庭又音挺又徒佞反人宅中東北牆下有鬼名倍阿鮭蠪躍狀如小兒長一尺四寸黑衣赤幘帶劍持戟倍音裴徐扶來反阿鮭本亦作蛙戶媧反徐胡佳反蠪音龍又音聾躍之司馬云倍阿神名也鮭蠪狀如小兒長一尺四寸黑衣赤幘大冠帶劍持戟豹頭馬尾名曰泆陽泆陽音逸司馬云泆陽豹頭馬尾一作狗頭一云神名也注云狀如小兒黑色赤衣大耳長臂名曰象罔象如字司馬本作無傷云狀如小兒赤黑色赤爪大耳長臂一云水神名其狀如狗有角身有文彩峷本又作莘所巾反又音臻司馬云狀如狗有角文身五采大如牛狀如鼓一足行也夔求龜反司馬云狀如鼓而一足其狀如蛇兩頭五采方音傍本亦作倣同皇本亦作徨同司馬云方皇狀如蛇兩頭五采文盧文弨曰今本作倣徨罔字依世德堂本改汙字依釋文補今本無此注注疑司馬之誤公曰請問委蛇之狀何如桓公見鬼本在澤中既聞委蛇故問其狀委於危反又如字皇子曰委蛇其大如轂其長如轅紫衣而朱冠其為物也惡聞雷車之聲則捧其首而立見之者殆乎霸桓公辴然而笑曰此寡人之所見者也於是正衣冠與之坐不終日而不知病之去也辴喜笑貌也殆近也若見委蛇近為霸主桓公聞說大笑歡我所見正是此也朱冠司馬本作俞冠云俞國之冠也其制似螺惡聞雷烏路反捧芳勇反其首司馬本同一本作手辴敕引反徐敕一反又敕私反司馬云笑貌李云大笑貌此章言憂來而纍生者不明也患去而性得者達理也聞說委蛇情中暢適於是整衣冠共語論不終日而情抱豁然不知疾病從何而去也紀渻子為王養鬥雞姓紀名渻子亦作消字隨字讀之為齊王養雞擬鬥也此章明不必稟生知自然之理亦有積習以成性者紀渻所景反徐所幸反人姓名也一本作消為于僞反王司馬云齊王也俞樾曰列子黃帝篇亦載此事云紀渻子為周宣王養鬥雞則非齊王也十日而問雞已乎曰未也方虛憍而恃氣養經十日堪鬥乎答曰始性驕矜自恃意氣故未堪也虛憍居喬反又巨消反李云高也司馬云高仰頭也十日又問曰未也猶應嚮景見聞他雞猶相應和若形聲影響也猶應應對之應下同嚮許丈反本亦作響景於領反又如字李云應響鳴顧景行十日又問曰未也猶疾視而盛氣顧視速疾意氣強盛心神尚動故未堪也十日又問曰幾矣雞雖有鳴者已無變矣望之似木雞矣其德全矣異雞無敢應者反走矣幾盡也都不驕矜心神安定雞雖有鳴已無變懾養雞之妙理盡於斯此章言養之以至於全者猶無敵於外況自全乎神識安閒形容審定遙望之者其猶木雞不動不驚其德全具他人之雞見之反走天下無敵誰敢應乎闕誤引文如海劉得一本者上有見字孔子觀於呂梁縣水三十仞流沫四十里黿鼉魚鱉之所不能游也見一丈夫游之以為有苦而欲死也使弟子並流而拯之數百步而出被髮行歌而游於塘下呂梁水名解者不同或言是西河離石有黃河縣絶之處名呂梁也或言蒲州二百里有龍門河水所經瀑布而下亦名呂梁或言宋國彭城縣之呂梁八尺曰仞計高二十四丈而縣下也今者此水縣注名高蓋是寓言談過其實耳黿者似鱉而形大鼉者類魚而有腳此水瀑布既高流波峻駛遂使激湍騰沫四十里至於水族尚不能游況在陸生如何可涉呂梁司馬云河水有石絶處也今西河離石西有此縣絶世謂之黃梁淮南子曰古者龍門未鑿河出孟門之上也慶藩案太平御覽一百八十三引郡國志轉引司馬云呂梁即龍門也不若釋文之詳縣水音玄三十仞音刃七尺曰仞流沫音末黿音元鼉徒多反或音檀鱉字又作鱉必滅反激湍沸涌非人所能游忽見丈夫謂之遭溺而困苦故命弟子隨流而拯接之有苦如字司馬云病也拯之拯救之拯塘岸也既安於水故散髮而行歌自得逍遙遨遊岸下數百所主反被髮皮寄反行歌司馬本作行道道常行之道也孔子從而問焉曰吾以子為鬼察子則人也請問蹈水有道乎丈夫既不憚流波行歌自若尼父怪其如此從而問之我謂汝為鬼神審觀察乃人也汝能履深水頗有道術不乎曰亡吾無道吾始乎故長乎性成乎命與齊俱入與汨偕出從水之道而不為私焉此吾所以蹈之也答云我更無道術直是久游則巧習以性成耳我初始生於陵陸遂與陵為故舊也長大游於水中習而成性也既習水成性心無懼憚恣情放任遂同自然天命也長乎丁丈反下同磨翁而旋入者齊也回伏而涌出者汨也湍沸旋入如磑心之轉者齊也回復騰漫而反出者汨也既與水相宜事符天命故出入齊汨曾不介懷郭注云磨翁而入者關東人喚磑為磨磨翁而入是磑釭轉也與齊司馬云齊水如磨齊也郭云磨翁而旋入者齊也慶藩案齊物之中央也呂刑天齊於民馬注齊中也管子正世篇治莫貴於得齊謂得中也王念孫曰人臍居腹之中故謂之臍臍者齊也漢書郊祀志齊所以為齊以天齊也蘇林注當天中央齊也與司馬訓為回水如磨之義正同與汨胡忽反司馬云涌波也郭云回伏而涌出者汨也任水而不任己隨順於水委質從流不使私情輒懷違拒從水尚爾何況唯道是從乎更無道術理盡於斯回字依釋文原本改孔子曰何謂始乎故長乎性成乎命未開斯旨請重釋之曰吾生於陵而安於陵故也長於水而安於水性也不知吾所以然而然命也此章言人有偏能得其所能而任之則天下無難矣用夫無難以涉乎生生之道何往而不通也此之三義並釋於前無勞重解也梓慶削木為鐻鐻成見者驚猶鬼神魯侯見而問焉曰子何術以為焉不似人所作也姓梓名慶魯大匠也亦云梓者官號鐻者樂器似夾鍾亦言鐻似虎形刻木為之雕削巧妙不類人工見者驚疑謂鬼神所作也梓音子慶李云魯大匠也梓官名慶其名也俞樾曰春秋襄四年左傳匠慶謂季文子杜注匠慶魯大匠即此梓慶鐻音據司馬云樂器也似夾鍾魯侯見其神妙怪而問之汝何道術為此鐻焉對曰臣工人何術之有雖然有一焉臣將為鐻未嘗敢以耗氣也必齊以靜心齊三日而不敢懷慶賞爵祿齊五日不敢懷非譽巧拙齊七日輒然忘吾有四枝形體也當是時也無公朝其巧專而外骨消然後入山林觀天性形軀至矣然後成見鐻然後加手焉不然則已則以天合天器之所以疑神者其是與梓答云臣是工巧材人有何藝術雖復如是亦有一法焉臣欲為鐻之時未嘗輒有攀緣損耗神氣必齊戒清潔以靜心靈也耗呼報反司馬云損也盧文弨曰今本作耗非氣李云氣耗則心動心動則神不專也心跡既齊凡經三日至於慶弔賞罰官爵利祿如斯之事並不入於情田齊日既多心靈漸靜故能非譽雙遣巧拙兩忘非譽音餘視公朝若無則跂慕之心絶矣輒然不敢動貌也齊潔既久情義清虛於是百體四肢一時忘遣輒然不動均於枯木既無意於公私豈有懷於朝廷哉輒然丁協反輒然不動貌無公朝直遙反注同性外之事去也滑亂也專精內巧之心消除外亂之事骨消如字本亦作滑消必取材中者也外事既除內心虛靜於是入山林觀看天性好木形容軀貌至精妙而成事堪為鐻者然後就手加工焉若其不然則止而不為成見賢遍反材中丁仲反不離其自然也機變雖加人工木性常因自然故以合天也盡因物之妙故乃疑是鬼神所作也所以鐻之微妙疑似鬼神者只是因於天性順其自然故得如此此章明順理則巧若神鬼性乖則心勞而自拙也是與音餘趙諫議本骨作滑闕誤引江南古藏本其下有由字趙本無乃字世德堂本也作耳趙本無東野稷以御見莊公進退中繩左右旋中規莊公以為文弗過也使之鉤百而反姓東野名稷古之善御人也以御事魯莊公左右旋轉合規之圓進退抑揚中繩之直莊公以為組繡織文不能過此之妙也東野稷李云東野姓稷名也司馬云孫卿作東野畢以御見賢遍反下同莊公李云魯莊公也或云內篇曰顏闔將傅衛靈公太子問於蘧伯玉則不與魯莊同時當是衛莊公俞樾曰荀子哀公篇載此事莊公作定公顏闔作顏淵則為魯定公矣中繩丁仲反下同文弗過也司馬云謂過織組之文也任馬旋回如鉤之曲百度反之皆復其跡使之鉤百而反司馬云稷自矜其能圓而驅之如鉤復跡百反而不知止文字御覽七四六引作造父顏闔遇之入見曰稷之馬將敗公密而不應姓顏名闔魯之賢人也入見莊公初不信故密不應焉顏闔戶臘反元嘉本作廅崔同少焉果敗而反公曰子何以知之少時之頃馬困而敗公問顏生何以知此曰其馬力竭矣而猶求焉故曰敗斯明至當之不可過也答馬力竭盡而求其過分之能故知必敗也非唯車馬萬物皆然工倕旋而蓋規矩指與物化而不以心稽故其靈臺一而不桎忘足屨之適也忘要帶之適也知忘是非心之適也不內變不外從事會之適也始乎適而未嘗不適者忘適之適也旋規也規圓也稽留也倕是堯時工人稟性極巧蓋用規矩手隨物化因物施巧不稽留也工倕音垂又音睡旋而蓋矩指與物化而不以心稽音雞司馬本矩作瞿云工倕堯工巧人也旋圓也瞿句也倕工巧任規以見為圓覆蓋其句指不以施度也是與物化之不以心稽留也雖工倕之巧猶任規矩此言因物之易也任物因循忘懷虛淡故其靈臺凝一而不桎梏也不桎之實反司馬云閡也之易以豉反百體皆適則都忘其身也足屨九住反要帶一遙反是非生於不適耳夫有履有帶本為足為要今既忘足要履帶理當閒適亦猶心懷憂戚為有是非今則知忘是非故心常適樂也所遇而安故無所變從也外智凝寂內心不移物境虛空外不從事乃契會真道所在常適識適者猶未適也始本也夫體道虛忘本性常適非由感物而後歡娛則有時不適本性常適故無往不歡也斯乃忘適之適非有心適闕誤引文如海張君房本知俱作有孫休者踵門而詫子扁慶子曰休居鄉不見謂不修臨難不見謂不勇然而田原不遇歲事君不遇世賓於鄉里逐於州部則胡罪乎天哉休惡遇此命也姓孫名休魯人也踵頻也詫告也歎也不能述道而怨迍邅頻來至門而歎也姓扁名子慶魯之賢人孫休之師也孫休俗人不達天命頻詣門而言之我居鄉里不見道我不修飾臨於危難不見道我無勇武而營田於平原逢歲不熟禾稼不收處朝廷以事君不遇聖明不縻好爵遭州部而放逐被鄉閭而賓棄有何罪於上天苟遇斯之運命踵門章勇反司馬云至也而詫敕駕反又呼駕反郭都駕反司馬云告也李本作託云屬也子扁慶子音篇又符殄反李云扁姓慶子字也臨難乃旦反賓於必刃反惡遇音烏下同扁子曰子獨不聞夫至人之自行邪忘其肝膽遺其耳目芒然倣徨乎塵垢之外逍遙乎無事之業是謂為而不恃長而不宰今汝飾知以驚愚修身以明汙昭昭乎若揭日月而行也汝得全而形軀具而九竅無中道夭於聾盲跛蹇而比於人數亦幸矣又何暇乎天之怨哉子往矣暗付自然也夫至人立行虛遠清高故能內忘五藏之肝膽外遺六根之耳目蕩然空靜無纖介於胸臆凡非真性皆塵垢也芒然武剛反倣徨元嘉本作房皇音同凡自為者皆無事之業也芒然無心之貌也倣徨是縱放之名逍遙是任適之稱而處染不染縱放於囂塵之表涉事無事任適於物務之中也率性自為耳非恃而為之任其自長耳非宰而長之接物施化不恃藉於我我勞長養黎元豈斷割而從己事出老經長而丁丈反注同汝光飾心智驚動愚俗修營身形顯他汙穢昭昭明白自炫其能猶如擔揭日月而行於世也豈是韜光匿耀以蒙養恬哉飾知音智明汙音烏若揭其列反又其謁反而汝也得軀貌完全九竅具足復免中塗夭於聾盲跛蹇又得預於人倫偕於人數慶幸矣莫甚於斯有何容暇怨於天道子宜速往無勞辭費九竅苦弔反跛波我反盧文弨曰舊作彼我反訛今改正蹇紀輦反又紀偃反徐其偃反而比如字又毗志反孫子出扁子入坐有閒仰天而歎弟子問曰先生何為歎乎孫休聞道而出扁子言訖而歸俄頃之間子慶嗟嘆也扁子門人問其嗟嘆所以扁子曰向者休來吾告之以至人之德吾恐其驚而遂至於惑也孫休頻來踵門而詫述己居世坎軻不平吾遂告以至人深玄之德而器小言大慮有漏機恐其驚迫更增其惑是以吁嘆也弟子曰不然孫子之所言是邪先生之所言非邪非固不能惑是孫子所言非邪先生所言是邪彼固惑而來矣又奚罪焉若孫子言是扁子言非非理之言必不惑是若扁子言是孫子言非彼必以非故來詣斯求是進退尋責何罪有乎先生之嘆終成虛假趙諫議本來下有者字扁子曰不然昔者有鳥止於魯郊魯君說之為具太牢以饗之奏九韶以樂之鳥乃始憂悲眩視不敢飲食此之謂以己養養鳥也若夫以鳥養養鳥者宜棲之深林浮之江湖食之以委蛇則平陸而已矣今休款啓寡聞之民也吾告以至人之德譬之若載鼷以車馬樂鴳以鐘鼓也彼又惡能無驚乎哉各有所便也此爰居之鳥非應瑞之物魯侯濫賞饗以太牢事顯前篇無勞重解說之音悅為具于僞反奏九韶元嘉本作奏韶武以樂音洛下同食之音嗣委於危反蛇如字李云大鳥吞蛇司馬云委蛇泥俞樾曰委蛇未詳何物李云大鳥食蛇然未聞養鳥者必食之以蛇也司馬云委蛇泥此亦臆說今案至樂篇云夫以鳥養養鳥者宜棲之深林遊之壇陸浮之江湖食之隨行列而止委蛇而處然則此文宜亦當云食之以委蛇而處傳寫有闕文耳且云委蛇而處方與下句則平陸而已矣文氣相屬若無而處二字下句便不貫矣此章言善養生者各任性分之適而至矣鼷小鼠也鷃雀也孫休是寡識少聞之人應須款曲啓發其事今乃告以至人之德大道玄妙之言何異乎載小鼠以大車娛鷃雀以韶樂既御小而用大亦何能無驚懼者也款啓李云款空也啓開也如空之開所見小也鼷音奚鷃字又作鴳音晏盧文弨曰今本作鴳闕誤引劉得一本則下有安字
