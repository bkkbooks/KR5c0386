body:
  text: 雜篇外物第二十六以義名篇外物不可必故龍逢誅比干戮箕子狂惡來死桀紂亡人主莫不欲其臣之忠而忠未必信故伍員流于江萇弘死于蜀藏其血三年而化為碧人親莫不欲其子之孝而孝未必愛故孝己憂而曾參悲木與木相摩則然金與火相守則流陰陽錯行則天地大絯於是乎有雷有霆水中有火乃焚大槐有甚憂兩陷而無所逃螴蜳不得成心若縣於天地之間慰暋沈屯利害相摩生火甚多衆人焚和月固不勝火於是乎有僓然而道盡域心執固謂必然也夫人間事物參差萬緒惟安大順則所在虛通若其逆物執情必遭禍害外物王云夫忘懷於我者固無對於天下然後外物無所用必焉若乃有所執為者諒亦無時而妙矣盧文弨曰宋本必作心慶藩案文選嵇叔夜養生論注引司馬云物事也忠孝內也外事咸不信受也釋文闕善惡之所致俱不可必也龍逢比干外篇已解箕子殷紂之庶叔也忠諫不從懼紂之害所以徉狂亦終不免殺戮惡來紂之佞臣畢志從紂所以俱亡精誠之至碧玉也子胥萇弘外篇己釋而言流江者忠諫夫差夫差殺之取馬皮作袋為鴟鳥之形盛伍員尸浮之江水故云流於江萇弘遭譖被放歸蜀自恨忠而遭譖遂刳腸而死蜀人感之以匱盛其血三年而化為碧玉乃精誠之至也而化為碧呂氏春秋藏其血三年化為碧玉慶藩案太平御覽八百九引司馬云萇弘忠而流故其血不朽而化為碧釋文闕是以至人無心而應物唯變所適孝己殷高宗之子也遭後母之難憂苦而死而曾參至孝而父母憎之常遭父母打鄰乎死地故悲泣也夫父子天性君臣義重而至忠至孝尚有不愛不知況乎世事萬塗而可必固者唯當忘懷物我適可全身遠害孝己李云殷高宗之太子曾參李云曾參至孝為父所憎嘗見絶糧而後蘇夫木生火火剋金五行之氣自然之理故木摩木則火生火守金則金爍是以誠心執固而必於外物者爍滅之敗俞樾曰淮南子原道篇亦云兩木相摩而然然兩木相摩未見其然下句云金與火相守則流疑此句亦當作木與火下文云水中有火乃焚大槐又云利害相摩生火甚多衆人焚和月固不勝火是此章多言火益知此文之當為木與火矣蓋木金二物皆畏火故舉以為言見火之為害大也所謂錯行水中有火電也乃焚大槐霹靂也陰陽錯亂不順五行故雷霆擊怒驚駭萬物人乖和氣敗損亦然大絯音駭又音該又胡待反水中有火乃焚大槐司馬云水中有火謂電也焚謂霹靂時燒大樹也家世父曰天地之大用水火而已矣水陽也而用陰火陰也而用陽人生陰陽之用喜怒憂樂愛惡生死相爭相靡猶水火也兩陷者水火之橫溢者也螴當作蝀爾雅釋天螮蝀虹也螴蜳猶言虹霓淮南説山訓天二氣則成虹二氣者陰陽之相薄者也相薄而兩相爭勝則虹霓亦不得成人心水火之爭陽常舒而徐進陰常慘而暴施凡不平於心皆陰氣之發也故曰生火甚多坎為月月者水氣之也體陽而用陰也火生而水不能勝之所以兩陷而無所逃也苟不能忘形則隨形所遭而陷於憂樂左右無宜也不能虛志而忘形域心執固是以馳情於榮辱二境陷溺於憂樂二邊無處逃形兩陷司馬云兩謂心與膽也陷破也畏雷霆甚憂心膽破陷也憂樂音洛矜之愈重則所在為難莫知所守故不得成螴蜳猶怵惕也不能忘情懷矜惜故雖勞形怵慮而卒無所成螴郭音陳又楮允反徐敕盡反蜳郭音惇又柱允反徐敕轉反李餘準反司馬云螴蜳讀曰忡融言怖畏之氣忡融兩溢不安定也所希跂者高而闊也心徇有為高而且遠馳情逐物通乎宇宙若縣音玄非清夷平暢也遂心則慰喜乖意則昏悶遇境則沈溺觸物則屯邅既非清夷豈是平暢慰暋武巾反李音昏又音泯慰鬱也暋悶也沈屯張倫反司馬云沈深也屯難也內熱故也夫利者必有害蟬鵲是也纓纏於利害之間內心恆熱故生火多矣衆人而遺利則和若利害存懷則其和焚也焚燒也衆人猶俗人也不能守分無為而每馳心利害內熱如火故燒焰中和之性大而暗則多纍小而明則知分月雖大而光圓火雖小而明照志大而多貪不如小心守分唯僓然無矜遺形自得道乃盡也僓然放任不矜之貌忘情利害淡爾不矜虛玄道理乃盡於此也僓音頽又呼懷反郭云順也暋原誤睯依世德堂本改下釋文同世德堂本知作之莊周家貧故往貸粟於監河侯監河侯曰諾我將得邑金將貸子三百金可乎監河侯魏文侯也莊子高素不事有為家業既貧故來貸粟貸粟音特或一音他得反監河侯古銜反説苑作魏文侯諾許也銅鐵之類皆名為金此非黃金也待我歲終得百姓租賦封邑之物乃貸子將貸他代反莊周忿然作色曰周昨來有中道而呼者周顧視車轍中有鮒魚焉周問之曰鮒魚來子何為者邪對曰我東海之波臣也君豈有斗升之水而活我哉周曰諾我且南遊吳越之王激西江之水而迎子可乎鮒魚忿然作色曰吾失我常與我無所處吾得斗升之水然活耳君乃言此曾不如早索我於枯魚之肆波浪小臣困於車轍君頗有水以相救乎而呼火故反鮒音附廣雅云鰿也鰿音迹波臣司馬云謂波蕩之臣西江蜀江也江水至多北流者衆惟蜀江從西來故謂之西江是也激西古狄反此言當理無小苟其不當雖大何益索求肆市常行海水鮒魚波浪失於常處升斗之水可以全生乃激西江非所宜也既其不救斯須不如求我於乾魚之肆此言事無大小時有機宜苟不逗機雖大無益也早索所白反枯魚李云猶乾魚也闕誤引張君房本遊下有説字任公子為大鉤巨緇五大犗以為餌蹲乎會稽投竿東海旦旦而釣期年不得魚已而大魚食之牽巨鉤錎沒而下揚而奮白波若山海水震蕩聲侔鬼神憚赫千里任公子得若魚離而臘之自制河以東蒼梧已北莫不厭若魚者已而後世輇才諷説之徒皆驚而相告也夫揭竿纍趣灌瀆守鯢鮒其於得大魚難矣飾小説以干縣令其於大達亦遠矣是以未嘗聞任氏之風俗其不可與經於世亦遠矣任國名任國之公子巨大也緇黑繩也犗犍牛也餌鉤頭肉既為巨鉤故用大繩懸五十頭牛以為餌任公子如字下同李云任國名大鉤本亦作釣盧文弨曰釣舊訛約宋本同今改正巨緇司馬云大黑綸也犗郭古邁反云犍牛也徐音界説文云騬牛也司馬云犧牛也騬音繩犍紀言反盧文弨曰舊無牛字據説文增為餌音二號為巨鉤期年不得魚蹲踞也踞坐也踞其山蹲音存會古外反稽古兮反會稽山名今為郡也期年之外有大魚吞鉤於是牽鉤陷沒馳驚騖而下揚其頭尾奮其鱗遂使白浪如山洪波際日期年本亦作期同音基言必久其事後乃能感也錎沒音陷字林猶陷字也騖揚徐音務一本作驚徐夷反李音須憚徒丹末反慶藩案憚古皆訓為畏難見論語學而篇朱注秦策高注此言憚赫憚者盛威之名也賈子解縣篇陛下威憚大信信與伸同亦此憚字之義盛威為憚盛怒亦為憚大雅桑柔篇逢天僤怒是也僤與憚同見王氏讀書雜志赫火百反千里言千里皆懼若魚海神也浙浙江也蒼梧山名在嶺南舜葬之所海神肉多分為脯臘自五嶺已北三湘已東皆厭之若魚司馬云大魚名若海神也或云若魚猶言此魚而臘音昔制河諸設反依字應作浙漢書音義音逝河亦江也北人名水皆曰河浙江今在餘杭郡後漢以為吳會分界司馬云浙江今在會稽錢塘慶藩案制河之制釋文諸設反字當作浙謂浙水以東也古制聲與浙同論語顏淵篇片言可以折獄者鄭注曰魯讀折為制書呂刑制以刑墨子尚同篇制作折末代季葉才智輕浮諷誦詞説不敦玄道聞得大魚驚而相語輕字有作輇字者輇量也輇七全反又專反又音權李云輇量人也本或作軨軨小也本又或作輕諷説方鳳反纍細繩也鯢鮒小魚也擔揭細小之竿繩趨走溉灌之溝瀆適得鯢鮒難獲大魚也揭其列其謁二反竿纍劣彼反謂次足不得並足也本亦作纍司馬云力追反云綸也趣本又作趨同七須反灌瀆司馬云溉灌之瀆守鯢五兮反鮒音附又音蒲本亦作蒲李云鯢鮒皆小魚也干求也縣高也夫修飾小行矜持言説以求高名令者必不能大通於至道字作縣古懸字多不著心此言志趣不同故經世之宜小大各有所適也人間世道夷險不常自非懷豁虛通未可以治亂若矜名飾行去之遠矣騖字依世德堂本改趙諫議本作驚趙本趣作趨求字依世德堂本改下徒末二字及硯字同儒以詩禮發冢大儒臚傳曰東方作矣事之何若大儒碩儒謂大博士從上傳語告下曰臚臚傳也東方作謂天曙日光起儒弟子發冢為盜恐天時曙故催告之問其如何將事臚力於反一音盧蘇林注漢書云上傳語告下曰臚臚猶行也傳治戀反又丈專反向云從上語下曰臚傳一音張戀反遽也東方作矣司馬云謂日出也小儒曰未解裙襦口中有珠詩固有之曰青青之麥生於陵陂生不伍施死何含珠為接其鬢壓其顪儒以金椎控其頤徐別其頰無傷口中珠小儒弟子也死人裙衣猶未解脫捫其口中知其有寶珠襦而朱反此是逸詩久遭刪削凡貴人葬者口多含珠故誦青青之詩刺之青青之麥司馬云此逸詩刺死人也陵陂彼宜反布施始豉反詩禮者先王之陳迹也苟非其人道不虛行故夫儒者乃有用之為姦則迹不足恃也接撮也按也顪口也控打也撮其鬢按其口鐵錐打仍恐損珠故安徐分別之是以田恆資仁義以竊齊儒生誦詩禮以發冢由是觀之聖迹不足賴壓本亦作同乃協反郭於琰反又敕頰反字林云一指按也其顪本亦作噦許穢反司馬云頤下毛也金椎直追反王念孫曰儒以金椎控其頤藝文類聚寶玉部引此儒作而是也而汝也自未解裙襦以下皆小儒答大儒之詞言汝以金椎控其頤徐別其頰無傷其口中之珠也而儒聲相近上文又多儒字故而誤作儒控苦江反徐別彼列反趙諫議本壓世德堂本恃作持老萊子之弟子出薪遇仲尼反以告曰有人於彼修上而趨下末僂而後耳視若營四海不知其誰氏之子老萊子楚之賢人隱者也常隱蒙山楚王知其賢遣使召為相其妻采樵歸見門前有車馬迹妻問其故老萊曰楚王召我為相妻曰受人有者必為人所制而之不能為人制也妻遂捨而去老萊隨之夫負妻戴逃於江南莫知所之出取薪者采樵也既見孔子歸告其師老萊子楚人也出薪出採薪也長上而促下也趨下音促李云下短也耳卻近後而上僂末僂李云末上謂頭前也又謂背膂也後耳司馬云耳卻後卻近附近之近視之儡然似營他人事者視若營四海夫勞形役智以應世務失其自然者也故堯有亢龍之喻舜有卷僂之談周公類之走狼仲尼比之逸狗豈不或信哉儡律悲反舊魚鬼反又魚威反修長也趨短也末肩背也所見之士下短上長肩背傴僂耳卻近後瞻視高遠所作觀其儀容似營天下未知子之子族姓是誰怪其異常故發斯問闕誤引張君房本出下有拾字老萊子曰是丘也召而來魯人孔丘汝宜喚取仲尼至曰丘去汝躬矜與汝容知斯為君子矣謂仲尼能遺形去知故以為君子躬身也孔丘既至老萊語宜遣汝身之躬飾忘爾容貌心知如此之時可為君子去起呂反注同而本又作女盧文弨曰今書而作汝躬矜躬矜身矜修善行容知音智容智謂飾智為容好仲尼揖而退蹙然改容而問曰業可得進乎受其言也敬受其言揖讓而退設問之令老萊明其不可進蹙然驚恐貌謂仲尼所學聖迹業行可得修進為世用可不蹙然子六反業可得進乎問可行仁義於世乎令老力成反老萊子曰夫不忍一世之傷而驁萬世之患抑固窶邪亡其略弗及邪惠以歡為驁終身之醜中民之行進焉耳相引以名相結以隱與其譽堯而非桀不如兩忘而閉其所譽反無非傷也動無非邪也聖人躊躇以興事以每成功奈何哉其載焉終矜爾一世為之則其迹萬世為患故不可輕也夫聖智仁義救一時之傷後執為姦成萬世之禍恃聖迹而驕謷則陳恆之徒是也亦有作騖音者云使萬代驅騖不息亦是奔馳之義也而驁本亦作敖同五報反下同下或作騖固執聖迹抑揚從己失於本性故窮窶窶其矩反直任之則民性不窶而皆自有略無弗及之事也亡失本性忽略生崖故不及於真道家世父曰不忍一世之傷而貽萬世之患自以為能經營天下也而不知其心無所蓄備也夫無所蓄備之謂窶矣其智略又弗及也郭象云直任之則民性不窶而皆自有略無弗及之事似失莊子本意慶藩案亡讀如無亡其轉語也史記范睢蔡澤列傳亡其言臣者賤不可用乎索隱亡猶輕蔑也義不可通呂氏春秋愛類篇亡其不得宋且不義猶攻之乎韓策又亡其行子之術而廢子之謁乎是凡言亡其皆轉語詞也惠之而歡者無惠則醜矣然惠不可長故一惠終身醜也夫以施惠為歡者惠不可遍故謷慢者多矣是以用惠取人適為怨府故終身醜辱言其易進則不可妄惠之之行下孟反其易以豉反隱括進之謂也夫上智下愚其性難改中庸之人易為進退故聞堯之美相引慕以利名聞桀之惡則結之以隱匿相結以隱郭云隱括也李云隱病患也雖相引以名聲是相結以病患俞樾曰李云隱病患也然病患非所以相結郭注曰隱括進之謂也然隱括所以正曲木亦非所以相結也隱當訓為私呂氏春秋圜道篇分定則下不相隱高注曰隱私也文選赭白馬賦恩隱周渥李善引國語注曰隱私也相結以隱謂相結以恩私舊説皆非閉者閉塞贊譽堯之善道非毀桀之惡迹以此奔馳失性多矣故不如善惡兩忘閉塞毀譽則物性全矣譽堯音餘而閉一本文注並作門順之則全靜之則正夫反於物性無不傷損擾動心靈皆非正法反無非傷也反逆於理動無非邪也似嗟反動矜於是也事不遠本故其功每成躊躇從容聖人無心應機而動興起事業恆自從容不逆物情故其功每就聖人躊音疇躇直居反以興事以每成功每者每有成功也躊躇者從容也從容興事雖有成功聖人不存猶致弊迹流毒百世況動矜善行而載之不已哉不遠于萬反矜不可載故遺而弗有也奈何猶如何也如何執仁義之迹擾撓物心運載矜莊終身不替此是老萊詆訶夫子之詞也家世父曰反猶撥亂世而反之正有所反則必有傷有所動則必為邪其反也矜心之挾以爭也其動也矜心之載以出也聽其自化則無傷矣無為而無不為則非邪矣闕誤引張成二本行下俱有易字唐寫本矜上無終字趙諫議本括進作恬退宋元君夜半而夢人被髮窺阿門曰豫自宰路之淵豫為清江使河伯之所漁者余且得豫宋國君諡曰元即宋元君也阿曲也謂阿旁曲室之門宋元君李云元公也案元公名佐平之公之子阿門司馬云阿屋曲簷也自從也宰路江畔淵名姓余名且捕魚之人也宰路李云淵名龜所居豫為如字又于偽反使河所吏反漁者音魚余音預且子餘反姓余名且也俞樾曰史記龜策傳作豫且慶藩案豫預字同元君覺使人占之曰此神龜也君曰漁者有余且乎左右曰有君曰令余且會朝命召也召令赴朝問其所得覺古孝反令力成反會朝直遙反下同明日余且朝君曰漁何得對曰且之網得白龜焉其圓五尺君曰獻若之龜龜至君再欲殺之再欲活之心疑卜之曰殺龜以卜吉乃刳龜七十二鑽而無遺策心疑猶預殺活再三乃殺吉遂刳龜也卜之算計前後鑽之凡經七十二算計吉凶曾不失中刳口孤反鑽左端反又左亂反慶藩案文選郭景純江賦注引司馬云鑽命卜以所卜事而灼之釋文闕遺策初革反仲尼曰神龜能見夢於元君而不能避余且之網知能七十二鑽而無遺策不能避刳腸之患如是則知有所困神有所不及也雖有至知萬人謀之魚不畏網而畏鵜鶘去小知而大知明去善而自善矣嬰兒生無石師而能言與能言者處也神知之不足恃也如是夫唯靜然居其所能而不營於外者為全夫神智不足恃也是故至人之處世忘形神智慮與枯木同其不華將死灰均其寂任物冥於造化是以孔丘大聖因而議之見夢賢遍反知能音智下及注同知有所困一本作知有所不同不用其知而用衆謀至知音智下注皆同網無情故得魚網無情而得魚聖人無心故天下歸之鵜徒兮反鶘鵜鶘水鳥也一名淘河小知自私大知任物小知取捨於心大知無分別遣間奪之情故無分別則大知光明也去小起呂反下注同去善則善無所慕善無所慕則善者不矯而自善也遣矜尚之小心合自然之大善故前文云離道以善險德以行又老經云天下皆知善之為善斯不善已不矯居表反泛然無習而自能者非跂而學彼也夫嬰兒之性其不假師匠年漸長大而自然能言者非有心學之與父母同處率其本性自然能言是知世間萬物非由運知學而成之也石師石者匠名也謂無人為師匠教之者也一本作所師又作碩師惠子謂莊子曰子言無用莊子通人也空有並照其言弘博不契俗心是以惠施譏為無用莊子曰知無用而始可與言用矣天地非不廣且大也人之所用容足耳然則廁足而墊之致黃泉人尚有用乎惠子曰無用夫有用則同於夭折無用則全其生崖故知無用始可語其用墊掘也夫六合之內廣大無最於地人之所用不過容足若使側足之外掘至黃泉人則戰栗不得行動是知有用之物假無用成功廁足音側又音測墊丁念反司馬崔云下也木又作塹七念反掘也致黃泉致至也本亦作至莊子曰然則無用之為用也亦明矣聖應其內當事而發己言其外以暢事情情暢則事通外明則內用相須之理然也直置容足不可得行必借餘地方能運用腳足無用之理分明故取老子云有之以為利無之以為用莊子曰人有能遊且得不遊乎人而不能遊且得遊乎夫流遁之志決絶之行噫其非至知厚德之任與覆墜而不反火馳而不顧雖相與為君臣時也易世而無以相賤故曰至人不留行焉性之所能不得不為也性所不能不得強為故聖人唯莫之制則同焉皆得而不知所以得也夫人稟性不同所用各異自有聞言如影響自有智昏菽麥故性之能者不得不由性性之無者不可強涉各守其分則物皆不喪得強其丈反非至厚則莫能任其志行而信其殊能也流蕩逐物逃遁不反果決絶滅因而不移此之志行極愚極鄙豈是至妙真知深厚道德之所任用莊子之意謂其如此之行下孟反注同任與音餘人之所好不避是非死生以之愚迷之類執志然雖復家被覆沒身遭顛墜亦不知悔反馳逐物情急如煙火而不知回顧流遁決絶遂至於斯耳覆墜直類反所好呼報反所以為大齊同夫時所賢者為君才不應世者為臣如舜禹應時相代為君臣也故世遭革易不可以為臣為君而相賤輕流遁之徒不知此事唯所遇而因之故能與化俱夫世有興廢隨而行之是故達人曾無留滯唐寫本無曰字趙諫議本無則字世德堂本作所以為人齊同趙本作所以為人齊齊同也夫尊古而卑今學者之流也且以狶韋氏之流觀今之世夫孰能不波唯至人乃能遊於世而不僻順人而不失己彼教不學承意不彼古無所尊今無所卑而學者尊古而卑今失其原矣夫步驟殊時澆淳異世古今情事變化不同而乃貴古賤今深乖遠鑒適滋為學小見豈曰清通隨時因物乃平泯也狶韋三皇已前帝號也以玄古之風御於今代澆淳既章誰能不波蕩而不失其性乎斯由尊古卑今之弊也狶虛豈反不波波高下貌當時應務所在為正不僻匹亦反本無我我何失焉教因彼性故非學也彼意自然故承而用之則夫萬物各全其我獨有至德之人順時而化彼非學心而本性具足不由學致也承意不彼者稟承教意以導性而真道素圓不彼教也唐寫本無乃字趙諫議本正作政目徹為明耳徹為聰鼻徹為顫口徹為甘心徹為知知徹為德凡道不欲壅壅則哽哽而不止則跈跈則衆害生物之有知者恃息其不殷非天之罪天之穿之日夜無降人則顧塞其竇胞有重閬心有天遊室無空虛則婦姑勃心無天遊則六鑿相攘大林丘山之善於人也亦神者不勝徹通也顫者辛臭之事也夫六根無壅故徹聰明不蕩於外故為德也顫舒延反當通而塞則理有不泄而相騰踐也哽庚猛反塞也跈女展反郭云踐也廣雅云履也止也本或作蹍同王念孫曰郭注當通而塞則理有不泄而相騰踐也釋文跈女展反廣雅云履也止也本或作蹍同案踐履與壅塞二義不相比附郭云理有不泄而相騰踐所謂曲説者也本或作蹍亦非也今案跈讀為抮抮戾也言哽塞而不止則相乖戾相乖戾則衆害生也廣雅曰抮盩也盩與戾同方言曰軫戾也郭璞曰相了戾也孟子告子篇紾兄之臂而奪之食趙岐曰紾戾也此云哽而不止則跈義並與抮同生起也凡根生者無知亦不恃息也天生六根廢一不可耳聞眼見鼻臭心知為於分內雖用無咎若乃目滯桑中之色耳淫濮上之聲鼻滋蘭麝之香心用無窮之境則天理滅矣豈謂徹哉故六根窮徹則氣息通而生理全殷當也夫息不由知由知然後失當失當而後不通故知恃息息不恃知也然知欲之用制之由人非不得已之符也殷當也或縱恣六根馳逐前境或竅穴哽塞以害生崖通蹍二徒皆不當理斯並人情之罪也非天然之辜不殷如字一音於靳反通理有常運降止也自然之理穿通萬物自晝及夜未嘗止息家世父曰物之有知恃息息者氣也而氣有厚薄純雜天不能強而同之爾雅釋言殷齊中也齊一則中矣其不能齊天之無如何者也而天既授之以百骸九竅而使之自運焉授之以心思而使之自化焉務開通而已説文穿通也恢恢乎有餘地以自存則通矣玉篇降伏也言積氣之運無停伏也郭象注殷當也誤俞樾曰降當作即癃之籀文素問宣明五氣篇膀胱不利為癃又五常政大論篇其病癃閟日夜無謂不癃閟也無情任天竇乃開竇孔也流俗之人反於天理壅塞根竅滯溺不通其竇音豆閬空曠也閬空也言人腹內空虛故容藏胃藏胃空虛故通氣液胞普交反腹中胎有重直龍反閬音浪郭云空曠也遊不係也虛空故自然之道遊其中爭處也勃爭鬥也屋室不空則不容受故婦姑爭處無復尊卑勃音奚勃爭也空也司馬云勃反戾也無虛空以容其私則反戾共鬥爭也攘逆鑿孔也攘則逆也自然之道不遊其心則六根逆不順於理六鑿在報反相攘如羊反郭云逆也司馬云謂六情攘奪慶藩案荀子哀公篇注引司馬云六情相攘奪較釋文多一相字自然之理有寄物而通也自然之理有寄物而通者也家世父曰大林丘山之善於人言所以樂乎大林丘山為廣大容萬物之生也説文神天神引出萬物者也徐鍇曰申即引也神者不勝言發生萬物不可勝窮也闕誤引張文二本林俱作唐寫本勝下有也字德溢乎名名溢乎暴謀稽乎誸知出乎爭柴生乎守官事果乎衆宜春雨日時草木怒生銚耨於是乎始修草木之到植者過半而不知其然夫名高則利深故修德者過其當溢深也仁義五德所以行之過多者為尚名好勝故也夫禁暴則名美於德暴殘害也夫名者爭之器名既過者必更相賊害內篇云名者相軋者也家世父曰説文暴晞也孟子暴之於民而民受之荀子富國篇聲名足以暴炙之皆表暴之意德溢乎名言德所以洋溢名為之也名溢乎暴言名所以洋溢表暴以成之也五句並同一意郭象云禁暴則名美於德恐誤誸急也急而後考其謀稽考也誸急也急難之事然後校謀計誸音賢郭音玄急也向本作弦云堅正也平往則無用知夫運心知以出境則爭鬥斯至柴塞也柴塞也守執也域情執固而所造不通柴柴積也郭云塞也衆之所宜者不一故官事立也夫置官府設事條者須順於衆人之宜便若求逆之則禍亂生俞樾曰論語子路篇行必果皇侃義疏曰果成也衆有所宜而後官事以成故曰官事果乎衆宜夫事物之生皆有由銚耜之類也耨鋤也青春時節時雨之日凡百草木萌動而生於是農具方始修理此明順時而動不逆物情也銚七遙反削也能有所穿削也又他堯反耨乃豆反似鋤田具也夫事由理發故不覺植生也銚耨既修藝除萑葦幸逢春日鋤罷到生良由時節使然不可以人情均度是知制法立教必須順時到植時力反又音值立也本亦作置司馬云鋤拔反之更生者曰到植盧文弨曰到古倒字趙諫議本覺作齊靜然可以補病眥搣可以休老寧可以止遽雖然若是勞者之務也非佚者之所未嘗過而問焉聖人之所以駴天下神人未嘗過而問焉賢人所以駴世聖人未嘗過而問焉君子所以駴國賢人未嘗過而問焉小人所以合時君子未嘗過而問焉演門有親死者以善毀爵為官師其黨人毀而死者半堯與許由天下許由逃之湯與務光務光怒之紀他聞之帥弟子而踆於窾水諸侯弔之三年申徒狄因以踣河荃者所以在魚得魚而忘荃蹄者所以在兔得兔而忘蹄言者所以在意得意而忘言吾安得夫忘言之人而與之言哉非不病也適有煩躁之病者簡靜可以療之非不老也翦齊髮鬢滅狀貌也衰老之容以此而沐浴眥子斯反徐子智反亦作揃子淺反三蒼云揃猶翦也玉篇云滅也慶藩案蕭該漢書音義引司馬云眥視也釋文闕搣手改女本亦作搣音滅又武齊反字林云也音千米反盧文弨曰舊米作未今從宋本家世父曰釋文眥搣手改女可以休老搣手改女本亦作搣廣韻搣按也摩也似謂以兩手按摩目眥然與上下二句文義不類眥搣手改女當謂左右眥不能流盼可以閉目養神故曰休老又案搣手改女與搣通眥目也眥搣手改女猶云目陷非不遽也遽疾速也夫心性迫者安靜可以止之若是猶有勞故佚者超然不顧夫止遽以寧療躁以靜者以對治之術斯乃小學之人勞役神智之事務也豈是體道之士間逸之人不勞不病之心乎風采清高故未嘗暫過而顧問焉非佚音逸神人即聖人也聖言其外神言其內駭驚也神者不測之號聖者顯迹之名為其垂教動人故不過問以駴戶楷反王云謂改百姓之視聽也徐音戒謂上不問下也證空為賢並照為聖從深望淺故不問之何以人物君子故駭動諸侯之國賢人捨有故不問趨步各有分高下各有等夫趨世小人苟合一時如田恆之徒無足可貴故淑人君子鄙而不顧也慕賞而孝去真遠矣斯尚賢之過也演門東門也亦有作寅者隨字讀之東門之孝出自內心形容外毀惟宋君嘉其至孝遂加爵而命為卿鄉黨之人聞其因孝而貴於是強哭詐毀矯性偽情因而死者其數半矣演門以善反宋城門名堯知由賢禪以九五灑耳辭退逃避箕山湯與務光務光不受訶罵瞋怒遠之林籟斯皆率其本性腥臊榮祿非關矯偽以慕聲名其波蕩傷性遂至於此姓申徒名狄姓紀名他並隱者聞湯讓務光恐其及己與弟子蹲踞水旁諸侯聞之重其廉素時往弔慰恐其沈沒狄聞斯事慕其高名遂赴長河自溺而死波蕩失性遂至於斯矣紀他徒何反而踆音存字林云古蹲字徐七旬反又音尊窾水音款又音科司馬云水名弔之司馬云恐其自沈故弔之踣徐芳附反普豆反字林云僵也李云頓也郭薄杯反盧文弨曰二音之間當有又字下似此者不盡出筌魚笱也以竹為之故字從竹亦有從草者意蓀也香草也可以餌魚置香於柴木蘆葦之中以取魚也蹄兔也亦兔也以繫係兔腳故謂之蹄此二事譬也荃七全反崔音孫香草也可以餌魚或云積柴水中使魚依而食焉一云魚笱也盧文弨曰案如或所云是潛也見詩周頌蹄大兮反兔也又云兔弶也係其腳故曰蹄也音古縣反弶音巨亮反此合也意妙理也夫得魚兔本因筌蹄而筌蹄實異魚兔亦玄理假於言説言説實非玄理魚兔得而筌蹄忘玄理明而名言絶至於兩聖無意乃都無所言也夫忘言得理目擊道存其人實稀故有斯難也得夫音符闕誤引張君房本休作沐高山寺本同趙諫議本作筌下同劉文典補正云當作弶字依釋文改
