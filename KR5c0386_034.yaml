body:
  text: 雜篇漁父第三十一以人名篇孔子遊乎緇帷之林休坐乎杏壇之上弟子讀書孔子絃歌鼓琴奏曲未半緇黑也尼父遊行天下讀講詩書時於江濱休息林籟其林鬱茂蔽日陰沈布葉垂條又如帷幕故謂之緇帷之林也壇澤中之高處也其處多杏謂之杏壇也琴者和也可以和心養性故奏之緇帷司馬云黑林名也本或作惟杏壇司馬云澤中高處也李云壇名有漁父者下船而來須眉交白被髮揄袂行原以上距陸而止左手據膝右手持頤以聽曲終而招子貢子路二人俱對漁父越相范蠡也輔佐越王句踐平吳事訖乃乘扁舟遊三江五湖變易姓名號曰漁父即屈原所逢者也既而泛海至齊號曰鴟夷子至魯號曰白圭先生至陶號曰朱公晦迹韜光隨時變化仍遺大夫種書云揄揮也袂袖也原高平也距至也鬢眉交白壽者之容散髮無冠野人之貌於是遙望平原以手揮袂至於高陸維舟而止頤抱膝以聽琴歌也有漁父者音甫取魚父也一云是范蠡元嘉本作有漁者父則如字須眉本亦作鬚眉交白如字李云俱也一本作皎揄音遙又音俞又褚由反謂垂手衣內而行也李音投投揮也又士由反袂面世反李音芮以上時掌反距陸李云距至也趙諫議本須作鬢闕誤引張君房本交作皎客指孔子曰彼何為者也詢問仲尼是何爵命之人子路對曰魯之君子也答云是魯國賢人君子也客問其族子路對曰族孔氏問其氏族答云姓孔客曰孔氏者何治也又問孔氏以何法術修理其身子路未應子貢對曰孔氏者性服忠信身行仁義飾禮樂選人倫上以忠於世主下以化於齊民將以利天下此孔氏之所治也率姓謙和服行聖迹修飾禮樂簡選人倫忠誠事君化物齊等將欲利群品此孔氏之心乎飾禮如字本又作飭音敕下以化齊民李云齊等也許慎云齊等之民也如淳云齊民猶平民元嘉本作化於齊民後無於字世德堂本句作向如應為本字之誤又問曰有土之君與子貢曰非也侯王之佐與子貢曰非也為是有茅土五等之君為是王侯輔佐卿相乎皆答云非也君與音餘下同客乃笑而還行言曰仁則仁矣恐不免其身苦心勞形以危其真嗚呼遠哉其分於道也夫勞苦心形危忘真性偏行仁愛者去本迢遰而分離於玄道也是以嗤笑徘徊嗚呼歎之也以危危或作偽其分如字本又作介音界司馬云離也慶藩案分釋文作介音界是也隸書介作俗書分作二形相似往往溷亂莊三十年穀梁傳周之分子也釋文分本作介漢書杜周傳執進退之分師古注分或作介是其證藩又案界與介古字通漢書揚雄傳界陽抵穰侯而代之文選界作介史記晉世家號曰介山續漢書郡國志作界山春秋繁露立元神介障險阻淮南覽冥篇介作界涇字依漢書改篇字依春秋繁露改子貢還報孔子孔子推琴而起曰其聖人與乃下求之至於澤畔方將杖拏而引其船顧見孔子還鄉而立孔子反走再拜而進拏橈也反走前進是虔敬之容也杖直亮反拏女居反司馬云橈也音餘鄉而香亮反或作嚮同客曰子將何求孔子曰曩者先生有緒言而去丘不肖未知所謂竊待於下風幸聞咳唾之音以卒相丘也曩向也緒言餘論也卒終也相助也向者先生有清言餘論丘不敏未識所由之故竊聽下風庶承謦咳卒用此言助丘不逮緒言猶先言也俞樾曰楚辭九章款秋冬之緒風王注曰緒餘也讓王篇曰其緒餘以為國家是緒與餘同義緒言者餘言也先生之言未畢而去是有不盡之言故曰緒言釋文曰猶先言也非是竊待待或作侍咳苦代反唾吐臥反相丘息亮反闕誤引張君房本待作侍客曰嘻甚矣子之好學也孔子再拜而起曰丘少而修學以至於今六十九歲矣無所得聞至教敢不虛心嘻笑聲也丘少年已來修學仁義逮乎耆艾未聞至道所以恭謹虔恪虛心矣曰嘻香其反之好呼報反下同丘少詩召反下同客曰同類相從同聲相應固天之理也吾請釋吾之所有而經子之所以子之所以者人事也天子諸侯大夫庶人此四者自正治之美也四者離位而亂莫大焉官治其職人憂其事乃無所陵故田荒室露衣食不足徵賦不屬妻妾不和長少無序庶人之憂也能不勝任官事不治行不清白群下荒怠功美不有爵祿不持大夫之憂也廷無忠臣國家昏亂工技不巧貢職不美春秋後倫不順天子諸侯之憂也陰陽不和寒暑不時以傷庶物諸侯暴亂擅相攘伐以殘民人禮樂不節財用窮匱人倫不飭百姓淫亂天子有司之憂也今子既上無君侯有司之勢而下無大臣職事之官而擅飾禮樂選人倫以化齊民不泰多事乎夫虎嘯風馳龍興雲布自然之理也固其然乎是以漁父大賢宣尼至聖賢聖相感斯同聲相應也故釋吾之所有方外之道經營子之所以方內之業也而經子之所以經經營也司馬云經理也陵亦亂也夫人倫之事抑乃多端切要而言無過此四者若四者守位乃教治盛美若上下相冒則亂莫大焉是以百官各司其職庶人自憂其務不相陵亂斯不易之道者也正治直吏反下官事不治同田畝荒蕪屋室漏露追徵賦稅不相係屬妻妾既失尊卑長幼曾無次序庶人之憂患也慶藩案荒露謂荒蕪敗露方言曰露敗也古本或作路路露古通用淮南臣道篇路亶者也王念孫曰路亶猶羸憊也亦通作潞秦策士民潞病高注云潞羸也皆與敗義相近孟子滕文公篇是率天下而路也趙注云是導率天下之人以羸路也不屬音燭長少丁丈反後遇長同職任不勝物務不理百姓荒亂四民不勤大夫之憂也不勝音升行不下孟反陪臣不忠苞茅不貢春秋盟會落朋倫之後五等之憂也工技其綺反盧文弨曰今書作國技貢職職或作賦春秋後倫朝覲不及等比也攘除也陰陽不調日時愆度兵戈荐起萬物夭傷三公九卿之憂也不飭音敕上非天子諸侯下非宰輔卿相而擅修飾禮樂選擇人倫教化蒼生正齊群物乃是多事之人不泰本又作大音同徐敕佐反後同高山寺本憂作處高山寺本廷作朝世德堂本工作國此蓋依釋文改高山寺本不下有亦字且人有八疵事有四患不可不察也非其事而事之謂之總莫之顧而進之謂之佞希意道言謂之諂不擇是非而言謂之諛好言人之惡謂之讒析交離親謂之賊稱譽詐偽以敗惡人謂之慝不擇善否兩容頰適偷拔其所欲謂之險此八疵者外以亂人內以傷身君子不友明君不臣所謂四患者好經大事變更易常以挂功名謂之叨專知擅事侵人自用謂之貪見過不更聞諫愈甚謂之很人同於己則可不同於己雖善不善謂之矜此四患也能去八疵無行四患而始可教已總濫也非是己事而強知之謂之叨濫也八疵祀知反之總李云謂監也強進忠言人不采顧謂之佞也希望前人意氣而導達其言斯諂也道言音導苟且順物不簡是非謂之諛也聞人之過好揚敗之人有親情交故輒欲離而析之斯賊害也與己親者雖惡而與己疏者雖善而毀以斯詐偽好敗傷人可謂姦慝之人也稱譽音餘以敗補邁反惡人烏路反下同之慝他得反否惡也善惡二邊兩皆容納和顏悅色偷拔其意之所欲隨而佞之斯險詖之人也善否悲美反惡也又方九反兩容頰適善惡皆容顏貌調適也頰或作顏外則惑亂於百姓內則傷敗於一身是以君子不與為友朋明君不將為臣佐也伺候安危經營大事變改之際建立功名謂叨濫之人也以挂音卦別也又音圭之叨吐刀反事己獨擅自用陵人謂之貪也有過不改聞諫彌增很戾之人很胡懇反慶藩案説文很言不聽從也逸周書諡法篇愎很遂過者曰刺荀子成相篇愎很遂過不肯悔物同乎己雖惡而善物異乎己雖善而惡謂之矜夸之人能去起呂及闕誤引張君房本惡作德趙諫議本頰作顏高山寺本道藏本並同高山寺本己下有則字譽字依劉文典補正本改孔子愀然而歎再拜而起曰丘再逐於魯削迹於衛伐樹於宋圍於陳蔡丘不知所失而離此四謗者何也愀然慚竦貌也罹離遭也丘無罪失而遭罹四謗未悟前旨故發此疑愀然在九反又七小反客悽然變容曰甚矣子之難悟也人有畏影惡迹而去之走者舉足愈數而迹愈多走愈疾而影不離身自以為尚遲疾走不休絶力而死不知處陰以休影處靜以息迹愚亦甚矣子審仁義之間察同異之際觀動靜之變適受與之度理好惡之情和喜怒之節而幾於不免矣謹修而身慎守其真還以物與人則無所纍矣今不修之身而求之人不亦外乎留停仁義之間以招門徒伺察同異之際以候機宜觀動靜之變睎其僥幸適受與之度望著功名理好惡之情而是非堅執和喜怒之節用為達道以己誨人矜矯天性近於不免也難語魚據反下同本或作悟盧文弨曰今書作難悟愈數音朔不離力智反謹慎形體修守真性所有功名還歸人物則物我俱全故無患纍也不能修其身而求之他人者豈非疏外乎高山寺本離下無身字高山寺本作今不修身而求之於人孔子愀然曰請問何謂真自竦也客曰真者精誠之至也不精不誠不能動人故強哭者雖悲不哀強怒者雖嚴不威強親者雖笑不和真悲無聲而哀真怒未發而威真親未笑而和真在內者神動於外是所以貴真也其用於人理也事親則慈孝事君則忠貞飲酒則歡樂處喪則悲哀忠貞以功為主飲酒以樂為主處喪以哀為主事親以適為主功成之美無一其迹矣事親以適不論所以矣飲酒以樂不選其具矣處喪以哀無問其禮矣禮者世俗之所為也真者所以受於天也自然不可易也故聖人法天貴真不拘於俗愚者反此不能法天而恤於人不知貴真祿祿而受變於俗故不足惜哉子之蚤湛於人偽而晚聞大道也夫真者不偽精者不雜誠者不矯也故矯情偽性者不能動於人也夫道無不在所在皆通故施於人倫有此四事四事之義列下文故強其丈反下同歡樂音洛下同貞者事之幹也故以功績為主飲酒陶蕩性情故以樂為主是以功在其美故不可一其事迹也此覆釋前四義者也節文之禮世俗為之真實之性稟乎大素自然而然故不可改易也法效自然寶貴真道故不拘束於俗禮也恤憂也祿祿貴貌也愚迷之人反於聖行不能法自然而造適貴道德而逍遙翻復溺人事而憂慮滯囂塵而遷貿徇物無厭故心恆不足也祿祿如字又音録謂形見為禮也司馬云録領録也慶藩案祿司馬本作録文選劉公幹雜詩注引司馬云領也領上無字與釋文異惜孔子之雄才久迷情於聖迹耽人間之浮偽不早聞於玄道蚤音早字亦作早湛丁南反下同高山寺本悲作疾又未發作不嚴又未作不又論下有其字世德堂本無人字兩録字依文選改孔子又再拜而起曰今者丘得遇也若天幸然先生不羞而比之服役而身教之敢問舍所在請因受業而卒學大道尼父喜歡自嗟慶幸得逢漁父欣若登天必其不恥訓誨尋當服勤驅役庶為門人身稟教授問舍所在終學大道丘得過也謂得過失也過或作遇慶藩案釋文過或作遇者是也遇過形似致易互訛説見前而比如字謂親見比數也又毗志反高山寺本不下有為字今書作遇客曰吾聞之可與往者與之至於妙道不可與往者不知其道慎勿與之身乃無咎子勉之吾去子矣吾去子矣乃刺船而去延緣葦間從迷適悟為往也妙道真本也知分別也若逢上智之士可與言於妙本若遇下根之人不可語其玄極觀機吐照方乃無疵戒約孔子令其勉勵延緣止蘆葦之間重言去子殷勤訓勗也乃刺七亦反顏淵還車子路授綏孔子不顧待水波定不聞拏音而後敢乘仲尼既見異人告以至道故仰之彌甚喜懼交懷門人授綏猶不顧盼船遠波定不聞橈響方敢乘車波定李云謂戰如波也案謂船行故水波去遠則波定子路旁車而問曰由得為役久矣未嘗見夫子遇人如此其威也萬乘之主千乘之君見夫子未嘗不分庭伉禮夫子猶有倨敖之容今漁父杖拏逆立而夫子曲要磬折言拜而應得無太甚乎門人皆怪夫子矣漁人何以得此乎天子萬乘諸侯千乘伉對也分處庭中相對設禮位望相似無階降也仲尼遇天子諸侯尚懷倨傲一逢漁父盡禮曲腰并受言詞必拜而應漁父威嚴遂至於此孔丘重方外之道子路是方內之人故致驚疑旁車而問也旁車步浪反萬乘繩證反下同倨音據敖五報反曲要一遙反磬折之設反孔子伏軾而歎曰甚矣由之難化也湛於禮義有間矣而朴鄙之心至今未去進吾語汝夫遇長不敬失禮也見賢不尊不仁也彼非至人不能下人下人不精不得其真故長傷身惜哉不仁之於人也禍莫大焉而由獨擅之且道者萬物之所由也庶物失之者死得之者生為事逆之則敗順之則成故道之所在聖人尊之今漁父之於道可謂有矣吾敢不敬乎湛著禮義時間固久嗟其鄙拙故憑軾歎之也湛於湛或作其召由令前示其進趨夫遇長老不敬則失於禮儀見可貴不尊則心無仁愛若非至德之人則不能使人謙下謙下或不精誠則不造於玄極不仁不愛乃禍敗之基惜哉仲由專擅於此也下人遐嫁反下及注同此篇言無江海而間者能下江海之士也夫孔子之所放任豈直漁父而已哉將周流六虛旁通無外蠕動之類咸得盡其所懷而窮理致命所以為至人之道也由從也庶衆也夫道生萬物則謂之道故知衆庶從道而生是以順而得者則生而成逆而失者則死而敗物無貴賤道在則尊漁父既其懷道孔子何能不敬耶而間音間蠕如兗反高山寺本賢作貴固字依世德堂本改
