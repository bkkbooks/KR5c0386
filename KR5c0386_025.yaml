body:
  text: 外篇知北遊第二十二以義名篇知北遊於玄水之上登隱弅之丘而適遭無為謂焉知謂無為謂曰予欲有問乎若何思何慮則知道何處何服則安道何從何道則得道三問而無為謂不答也非不答不知答也此章並假立姓名寓言明理北是幽冥之域水又幽昧之方隱則深遠難知弅則鬱然可見欲明至道玄絕顯晦無常故寄此言以彰其義也知北遊音智又如字於玄水之上李云玄水水名司馬崔本上作北盧文弨曰今本作玄水水名以下白水例之重者是隱弅符云反又音紛又符紛反李云隱出弅起丘貌若汝也此明運知極心問道假設賓主謂之無為此假設言方運知問道若為尋思何所念慮則知至道若為服勤於何處所則安心契道何所依從何所道說則得其道也知分別也設此三問竟無一答非無為謂惜情不答直是理無分別故不知所以答也知不得問反於白水之南登狐闋之上而睹狂屈焉知以之言也問乎狂屈狂屈曰唉予知之將語若中欲言而忘其所欲言白是潔素之色南是顯明之方狐者疑似夷猶闋者空靜無物問不得決反照於白水之南捨有反無狐疑未能窮理既而猖狂妄行掘若槁木欲表斯義故曰狂屈焉白水水名狐闋苦穴反司馬李云狐闋丘名而睹丁古反狂屈求勿反徐又其述反司馬向崔本作詘李云狂屈侜張似人而非也慶藩案釋文引李云狂屈侜張似人而非也文選甘泉賦捎夔魖扶僪狂狂屈即僪狂也司馬與崔作詘失之以之言司馬云之是也唉應聲也初欲言語中途忘之斯忘之術反照之道唉哀在反徐烏來反李音熙云應聲語若魚據反知不得問反於帝宮見黃帝而問焉黃帝曰無思無慮始知道無處無服始安道無從無道始得道軒轅體道妙達玄言故以一無於三問知問黃帝曰我與若知之彼與彼不知也其孰是邪黃帝曰彼無為謂真是也狂屈似之我與汝終不近也夫知者不言言者不知故聖人行不言之教道不可致德不可至仁可為也義可虧也禮相偽也故曰失道而後德失德而後仁失仁而後義失義而後禮禮者道之華而亂之首也故曰為道者日損損之又損之以至於無為無為而無不為也今已為物也欲復歸根不亦難乎其易也其唯大人乎任其自行斯不言之教也真者不知也似者中忘也不近者以其知之也行不言之教引老子經為證也不近附近之近道在自然非可言致者也致得也夫玄道不可以言得言得非道也不失德故稱德稱德而不至也夫上德不德若為德者非至德也夫至仁無親而今行偏愛之仁者適可有為而已矣夫裁非斷割適可虧殘非大全也大全者生之而已矣夫禮尚往來更相浮偽華藻亂德非真實也禮有常則故矯效之所由生也棄本逐末散樸為澆道喪淳漓逮於行禮故引老經證成其義也損華偽也華去而朴全則雖為而非為也夫修道之夫日損華偽既而前損有後損無有無雙遣以至於非有非無之無為也寂而不動無為故無不為也此引老經重明其旨物失其所故有為物其歸根之易者唯大人耳大人體合變化故化物不難倒置之類浮偽居心徇末忘本以道為物縱欲歸根復命其可得乎今量反本不難唯在大聖人耳家世父曰人所受以生者氣也既得之以為生則氣日流行大化之中而吾塊然受其成形無由反氣而合諸漠道之華為禮與氣之流行而為人皆非其所固然者也通死生為徒一聽其氣之聚散而吾無與焉則無為矣道至於無為而仁義之名可以不立是之謂歸根其易以豉反注同裁非疑裁制之誤趙諫議本效作放生也死之徒死也生之始孰知其紀人之生氣之聚也聚則為生散則為死若死生為徒吾又何患故萬物一也是其所美者為神奇其所惡者為臭腐臭腐復化為神奇神奇復化為臭腐故曰通天下一氣耳聖人故貴一知變化之道者不以死生為異更相為始則未知孰死孰生也氣聚而生猶是死之徒類氣散而死猶是生之本始生死終始誰知紀綱乎聚散往來變化無定更相音庚俱是聚也俱是散也患生於異夫氣聚為生氣散為死聚散雖異為氣則同今斯則死生聚散可為徒伴既無其別有何憂色生死既其不二萬物理當歸一各以所美為神奇所惡為臭腐耳然彼之所美我之所惡也我之所美彼或惡之故通共神奇通共臭腐耳死生彼我豈殊哉夫物無美惡而情有向背故情之所美者則謂為神妙奇特情之所惡者則謂為腥臭腐敗而顛倒本末一至於斯然物性不同所好各異彼之所美此則惡之此之所惡彼又為美故毛嬙麗姬人之所美魚見深入鳥見高飛斯則臭腐神奇神奇臭腐而是非美惡何有定焉是知天下萬物同一和氣耳所惡烏路反注同復化扶又反下同夫體道聖人智周萬化故貴此真一而冥同萬境敦煌本無復字闕誤引劉得一本天下作天地之死生二字依王叔岷說補今字依劉文典補正本刪知謂黃帝曰吾問無為謂無為謂不應我非不我應不知應我也吾問狂屈狂屈中欲告我而不我告非不我告中欲告而忘之也今予問乎若若知之奚故不近黃帝曰彼其真是也以其不知也此其似之也以其忘之也予與若終不近也以其知之也狂屈聞之以黃帝為知言明夫自然者非言知之所得故當昧乎無言之地是以先舉不言之標而後寄明於黃帝則夫自然之冥物概乎可得而見也彼無為謂妙體無知故真是道也此狂屈反照遣言中忘其告似道非真也知與黃帝二人運智以詮理故不近真道也狂屈聽聞此格量謂黃帝雖未近真適可知玄言而已矣之標必遙反天地有大美而不言四時有明法而不議萬物有成理而不說聖人者原天地之美而達萬物之理是故至人無為大聖不作觀於天地之謂也此孔子之所以云予欲無言夫二儀覆載其功最美四時代敘各有明法萬物生成咸資道理竟不言說曾無議論也大美謂覆載之美也任其自為而已夫聖人者合兩儀之覆載同萬物之生成是故口無所言心無所作唯因任也觀其形容象其物宜與天地不異夫大聖至人無為無作觀天地之覆載法至道之生成無為無言斯之謂也今彼神明至精與彼百化物已死生方圓莫知其根也扁然而萬物自古以固存六合為巨未離其內秋豪為小待之成體天下莫不沈浮終身不故陰陽四時運行各得其序惛然若亡而存油然不形而神萬物畜而不知此之謂本根可以觀於天矣百化自化而神明不奪彼神聖明靈至精極妙與物和混變化隨流或聚或散曾無欣戚今言百千萬者並舉其大綱數爾夫死者已自死而生者已自生圓者已自圓而方者已自方未有為其根者故莫知夫物或生或死乍方乍圓變化自然莫知根緒豈待為之而後存哉扁然遍生之貌也言萬物翩然隨時生育從古以來必固自有豈由措意而後有之扁音篇又音幡計六合在無極之中則陋矣未離力智反其內謂不能出自化也秋豪雖小非無亦無以容其質六合天地四方也獸逢秋景毛端生豪豪極微細謂秋豪也巨大也六合雖大猶居至道之中豪毛雖小資道以成體質也日新也世間庶物莫不浮沈升降生死往來不住運之不停新新相續未嘗守故也不待為之夫二氣氤氳四時運轉春秋寒暑次敘天然豈待為之而後行之然若存則亡矣惛然如昧似無而有惛然音昏又音泯絜然有形則不神神者妙萬物而為言也油然無係不見形象而神用無方油然音由謂無所給惜也畜之而不得其本性之根故不知其所以畜也亭毒群生畜養萬物而玄功潛被日用不知此之真力是至道一根本也物畜本亦作滀同敕六反注同與天同觀觀見也天自然也夫能達理通玄識根知本者可謂觀自然之至道也闕誤引劉得一本今作合趙諫議本質下有也字昭字依世德堂本改齧缺問道乎被衣被衣曰若正汝形一汝視天和將至攝汝知一汝度神將來舍德將為汝美道將為汝居汝瞳焉如新生之犢而無求其故齧缺王倪弟子被衣王倪之師也汝形容端雅勿為邪僻視聽純一勿多取境自然和理歸至汝身被衣音披本亦作披收攝私心令其平等專一志度令無放逸汝之精神自來舍止俞樾曰一汝度當作正汝度蓋此四句變文以成辭其實一義也攝汝知即一汝視之意所視者專一故所知者收攝矣正汝度即正汝形之意度猶形也淮南子道應篇文子道原篇並作正汝度可據以訂正深玄上德盛美於汝無極大道居汝心中瞳焉無知直視之貌故事也心既虛夷視亦平直故如新生之犢於事無求也瞳敕紅反郭菟絳反李云未有知貌言未卒齧缺睡寐被衣大說行歌而去之曰形若槁骸心若死灰真其實知不以故自持媒媒晦晦無心而不可與謀彼何人哉談玄未終斯人已悟坐忘契道事等睡瞑於是被衣喜躍贊其敏速行於大道歌而去之齧缺睡寐體向所說畏其視聽以寐耳受道速故被衣喜也大說音悅與變俱也形同槁木之骸心類死灰之土無情直任純實之真知不自矜持於事故也若槁苦老反獨化者也媒媒晦晦息照遣明忘心忘知不可謀議非凡所識故云彼何人哉自形若槁骸以下並被衣歌辭也媒媒音妹又武朋反晦晦音誨李云媒媒晦貌舜問乎丞曰道可得而有乎丞古之得道人舜師也而至道虛通生成動植未知己身之內得有此道不乎既逢師傅故有咨請丞如字李云舜師也一云古有四輔前疑後丞蓋官名曰汝身非汝有也汝何得有夫道夫身者非汝所能有也塊然而自有耳身非汝所有而況哉道者四句所不能得百非所不能詮汝身尚不能自有何得有於道耶有夫音符塊然苦對反舜曰吾身非吾有也孰有之哉未悟生因自然形由造物故云身非我有孰有之哉曰是天地之委形也生非汝有是天地之委和也性命非汝有是天地之委順也孫子非汝有是天地之委蛻也故行不知所往處不知所持食不知所味天地之強陽氣也又胡可得而有邪若身是汝有者則美惡死生當制之由汝今氣聚而生汝不能禁也氣散而死汝不能止也明其委結而自成耳非汝有也委結聚也夫天地陰陽結聚剛柔和順之氣成汝身形性命者也故聚則為生散則為死死生聚散既不由汝是知汝身豈汝有邪委形司馬云委積也俞樾曰司馬云委積也於義未合國策齊策願委之於子高注曰委付也成二年左傳王使委於三吏杜注曰委屬也天地之委形謂天地所付屬之形也下三委字並同氣自委結而蟬蛻也陰陽結聚故有子孫獨化而成猶如蟬蛻也委蛻吐臥反又音悅又敕外反又始銳反又始劣反皆在自爾中來故不知也夫行住食味皆率自然推尋根由莫知其所故行者誰行住者誰住食者誰食味者誰味乎皆不知所由而悉自爾也家世父曰日見其有行而終不知所往日見其有處而終莫能自持日見其有食而終莫知所為味然則其往也非我能自主也其相持數十年之久也非我能自留也其食而知味也非我能自辨也天地陰陽之氣運掉之使然也皆不得而有也強陽猶運動耳明斯道也庶可以遺身而忘生也強陽運動也胡何也夫形性子孫者並是天地陰陽運動之氣聚結而成者也復何得自有此身也天地之強陽氣也郭云強陽猶運動耳案言天地尚運動況氣聚之生何可得執而留也闕誤引張君房本孫子作子孫孔子問於老聃曰今日晏閒敢問至道晏安也孔子師於老子故承安居閒暇而詢問玄道也晏於諫反徐於顯反又於見反閒音閑老聃曰汝齊戒疏而心澡雪而精神掊擊而知夫道窅然難言哉將為汝言其崖略疏猶洒濯也澡雪猶精潔也而汝也掊擊打破也崖分也汝欲問道先須齋汝心跡戒慎專誠洒濯身心清淨神識打破聖智滌蕩虛夷然玄道窅冥難可言辯將為汝舉其崖分粗略言之齊戒側皆反音藥或云漬也掊普口反徐方垢反而知音智窅然烏了反將為于偽反趙諫議本作齋夫昭昭生於冥冥有倫生於無形精神生於道形本生於精而萬物以形相生故九竅者胎生八竅者卵生其來無跡其往無崖無門無房四達之皇皇也邀於此者四肢彊思慮恂達耳目聰明其用心不勞其應物無方天不得不高地不得不廣日月不得不行萬物不得不昌此其道與皆所以明其獨生而無所資借無形謂太初也皆由精以至粗倫理也夫昭明顯著之物生於窅冥之中人倫有為之事生於無形之內精智神識之心生於重玄之道有形質氣之類根本生於精微形本生於精謂常道也言萬物雖以形相生亦皆自然耳故胎卵不能易種而生明神氣之不可為也夫無形之道能生有形之物有形之物則以形質氣類而相生也故人獸九竅而胎生禽魚八竅而卵生稟之自然不可相易九竅苦弔反卵生力管反易種章勇反夫率自然之性遊無跡之塗者放形骸於天地之間寄精神於八方之表是以無門無房四達皇皇逍遙六合與化偕行也皇大也夫以不來為來者雖來而無蹤跡不往為往者雖往亦無崖際是以出入無門戶來往無邊傍故能弘達四方大通萬物也人生而遇此道則天性全而精神定邀遇也恂通也遇於道而會於真理者則百體安康四肢強健思慮通達視聽聰明無心之心用而不勞不應之應應無方所也邀於古堯反俞樾曰說文無邀字彳部徼循也即今邀字也又曰循行順也然則邀亦順也邀於此者猶言順於此者郭注曰人生而遇此道是以遇訓邀義既迂曲且於古訓無徵殆失之矣思慮息嗣反恂達音荀言此皆不得不然而自然耳非道能使然也二儀賴虛通而高廣三光資玄道以運行庶物得之以昌盛斯大道之功用也故老經云天得一以清地得一以寧萬物得一以生是之謂也天不得不高謂不得一道不能為高也道與音餘下皆同世德堂本作枝且夫博之不必知辯之不必慧聖人以斷之矣若夫益之而不加益損之而不加損者聖人之所保也淵淵乎其若海乎其終則復始也運量萬物而不匱則君子之道彼其外與萬物皆往資焉而不匱此其道與斷棄知慧而付之自然也夫博讀經典不必知真弘辯飾詞不必慧照故老經云善者不辯辯者不善知者不博博者不知斯則聖人斷棄之矣博之不必知觀異書為博以斷端管反注同使各保其正分而已故無用知慧為也博知辯慧不益其明沈默面牆不加其損所謂不增不減無損無益聖人妙體故保而愛之也容姿無量尾閭泄之而不耗百川注之而不增淵澄深大故譬玄道與化俱者乃積無窮之紀可謂魏魏巍巍高大貌也夫道遠超太一近邁兩儀囊括無窮故以歎巍巍也終則復始此明無終無始變化日新隨迎不得魏魏魚威反則復扶又反用物而不役己故不匱也運量音亮萬物而不匱求位反謂任物自動運物物各足量也各取於身而足夫運載萬物器量群生潛被無窮而不匱乏者聖人君子之道此而非遠近在內心既不藉稟豈其外也還用萬物故我不匱此明道之贍物在於不贍不贍而物自得故曰此其道與言至道之無功無功乃足稱道也有識無情皆稟此玄之道而玄功冥被終不匱乏然道物不一不異而離道無物故曰此其道與之贍涉豔反下同魏魏依世德堂本改注及釋文亦作魏闕誤引文如海劉得一本匱字俱作遺萬字依劉文典說補中國有人焉非陰非陽處於天地之間直且為人將反於宗自本觀之生者喑醷物也雖有壽夭相去幾何須臾之說也奚足以為堯桀之是非果蓏有理人倫雖難所以相齒聖人遭之而不違過之而不守調而應之德也偶而應之道也帝之所興王之所起也無所偏名敖然自放所遇而安了無功名中國九州也言人所稟之道非陰非陽非柔非剛非短非長故絕四句離百非也處在天地之間直置為人而無偏執本亦作值字者言處乎宇內遇值為人曾無所係也直且如字舊子餘反不逐末也既無偏執任置為人故能反本還原歸於宗極直聚氣也本道也喑噫氣聚也從道理而觀之故知生者聚氣之物也奚足以惜之哉喑音蔭郭音闇李音飲一音於感反醷於界反郭於感反李音意一音他感反李郭皆云暗醷聚氣貌死生猶未足殊況壽夭之間哉一生之內百年之中假令壽夭賒促詎幾俄頃之間須臾之說耳何足以是堯非桀而分別於其間哉幾何居豈反物無不理但當順之果蓏徐力果反人倫有智慧之變故難也然其智慧自相齒耳但當從而任之在樹曰果在地曰蓏桃李之屬瓜瓠之徒木生藤生皆有其理人之處世險阻艱難而貴賤尊卑更相齒次但當任之自合夫道譬彼果蓏有理存焉順所遇也宜過而過遭遇軒冕從而不違既以過焉亦不留舍調偶和合之謂也調和庶物順而應之上德也偶對前境逗機應物聖道也如斯而已夫帝王興起俯應群生莫過調偶隨時逗機接物人生天地之間若白駒之過郤忽然而已注然勃然莫不出焉油然漻然莫不入焉已化而生又化而死生物哀之人類悲之解其天弢墮其天紛乎宛乎魂魄將往乃身從之乃大歸乎不形之形形之不形是人之所同知也非將至之所務也此眾人之所同論也彼至則不論論則不至明見無值辯不若默道不可聞聞不若塞此之謂大得乃不足惜白駒駿馬也亦言日也隙孔也夫人處世俄頃之間其為迫促如馳駿駒之過孔隙欻忽而已何曾足云也白駒或云日也過郤去逆反本亦作隙隙孔也出入者變化之謂耳言天下未有不變也注勃是生出之容油漻是入死之狀言世間萬物相與無恆莫不從變而生順化而死勃然步忽反油然音由漻然音流李音礫俱是化也死物不哀死類不悲夫生死往來皆變化耳委之造物何足係哉故其死也生物人類共悲哀之務非類非生故不悲不哀也家世父曰生物哀之所以知哀惟其生也而不知生之同歸於盡也人類悲之所以知悲惟人之有知也而不知人之知之亦同歸於盡也獨脫也弢囊藏也束囊言人執是競非欣生惡死故為生死束縛也今既一於是非忘於生死故墮解天然之弢也天弢敕刀反字林云弓衣也墮其許規反天陳筆反變化煙熅宛乎於阮反絪音因本亦作煙音因縕於云反本亦作熅音同盧文弨曰今本作煙熅無為用心於其間也紛綸宛轉並適散之貌也魂魄往天骨肉歸土神氣離散紛宛任從自有還無乃大歸也不形形乃成若形之形則敗其形矣夫人之未生也本不有其形故從無形氣聚而有其形氣散而歸於無形也則敗補邁反雖知之然不能任其自形而反形之所以多敗務則不至夫從無形生形從有形復無形質是人之所同知也斯乃人間近事非詣理至人之達務也雖論之然故不能不務所以不至也形質有無生死來往眾人凡類同共乎論悗然不覺乃至悗然亡本反彼至聖之人忘言得理故無所論說若論說之則不至於道闇至乃值值會遇也夫能閉智塞聰故冥契玄理若顯明聞見則不會真也默而塞之則無所奔逐故大得夫大辯飾詞去真遠矣忘言靜默玄道近焉故道不可以多聞求多聞求不如於闇塞若能妙知於此意可謂深得於大理矣家世父曰道無形也見之而以為道遂若巧相值焉而固無值也說文值措也不能舉而措之則此所見一道彼所見又一道而有不勝其辯者矣曰辯不若默形字依世德堂本刪東郭子問於莊子曰所謂道惡乎在居在東郭故號東郭子則無擇之師東郭順子也問莊子曰所謂虛通至道於何處在乎東郭子李云居東郭也惡乎音烏莊子曰無所不在道無不遍在處有之東郭子曰期而後可欲令莊子指名所在郭注云欲令莊子指名所在也欲令力呈反莊子曰在螻蟻曰何其下邪曰在稊稗曰何其愈下邪曰在瓦甓曰何其愈甚邪曰在屎溺東郭子不應莊子曰夫子之問也固不及質正獲之問於監市履狶也每下愈況汝唯莫必無乎逃物至道若是大言亦然周遍咸三者異名同實其指一也大道無不在而所在皆無故處處有之不簡穢賤東郭未達斯趣謂道卓爾清高在瓦甓已嫌卑甚又聞屎溺故瞋而不應也螻力侯反蟻魚綺反在大西反本又作稊薜步計反本又作稗蒲賣反李云薜二草名盧文昭曰今本作稊稗瓦甓本又作步歷反屎尸旨反舊詩旨反本或作矢溺乃弔反舉其標質言無所不在而方復怪此斯不及質也質實也言道無不在豈唯稊稗固答子之問猶未逮真也狶大豕也夫監市之履豕以知其肥瘦者愈履其難肥之處愈知豕肥之要今問道之所在而每況之於下賤則明道之不逃於物也必矣正官號也則今之市令也獲名也監市之魁也則今屠卒也狶豬也凡今問於屠人買豬之法云履踐豕之股腳之間難肥之處愈知豕之肥瘦之意況也何者近下難肥之處有肉足知易肥之處足脂亦猶屎溺卑下之處有道則明清虛之地皆遍也正獲之問於監古銜反市履狶虛豈反每下愈況李云正亭卒也獲其名也監市市魁也狶大豕也履踐也夫市魁履豕履其股腳狶難肥處故知豕肥耳問道亦況下賤則知道也瘦色救反之處昌慮反若必謂無之逃物則道不周矣道而不周則未足以為道無者無為道也夫大道曠蕩無不制圍汝唯莫言至道逃棄於物也必其逃物何為周遍乎明道不逃物至道理也大言教也理既不逃於物教亦普遍無偏也周悉普遍咸皆有道此重明至道不逃於物雖有三名之異其實理旨歸則同一也周遍音遍闕誤引張君房成玄瑛本必下有謂字嘗相與游乎無何有之宮同合而論無所終窮乎嘗相與無為乎澹而靜乎漠而清乎調而閒乎寥已吾志無往焉而不知其所至去而來而不知其所止吾已往來焉而不知其所終彷徨乎馮閎大知入焉而不知其所窮物物者與物無際而物有際者所謂物際者也不際之際際之不際者也謂盈虛衰殺彼為盈虛非盈虛彼為衰殺非衰殺彼為本末非本末彼為積散非積散也若遊有則不能周遍咸也故同合而論之然後知道之無不在知道之無不在然後能曠然無懷而遊彼無窮也無何有之宮謂玄道處所也無一物可有故曰無何有也而周遍咸三者相與遨遊乎至道之鄉實旨既一同合而論冥符玄理故無終始窮極耳此皆無為故也此總歎周遍咸三功能盛德也既游至道之鄉又處無為之域故能恬淡安靜寂寞清虛柔順調和寬閒逸豫澹而徒暫反慶藩案漠而清漠亦清也古人自有複語耳爾雅漠察清也樊注漠然清貌漠亦通作莫昭二十八年左傳德正應和曰莫杜注莫然清靜也而閒音閑寥然空虛得道玄聖契理冥真性志虛夷寂寥而已寥音遼志苟寥然則無所往矣無往焉故往而不知其所至有往矣則理未動而志已矣已驚如字本亦作騖音務慶藩案郭注有往焉則理未動而志已驚矣驚字頗費解義當從釋文作騖是也騖與馳同義注言未動而志已先馳也志不得云驚驚騖字形相近因誤若驚驚又訛為騖斯順之也既寂寥故與無還往假令不往而往不來而來竟無至所亦無止住但往來不由於知耳不為不往來也往來者自然之常理也其有終乎假令往還造物來去死生隨變任化亦不知終始也馮閎者虛廓之謂也大知乎寥廓恣變化之所如故不知也彷徨是放任之名馮閎是虛曠之貌謂入契會也言大聖知之人能會於寂寥虛曠之理是以逍遙自得放任無窮彷音旁本亦作徬徨音皇馮皮冰反又普耕反又步耕反閎音宏李云馮宏皆大也郭云虛廓之謂也明物物者無物而物自物耳物自物耳故冥也際崖畔也夫能物於物者聖人也聖人冥同萬境故與物無彼我之際畔物有際故每相與不能冥然真所謂際者也物情分別取舍萬端故有物我之交際也不際者雖有物物之名直明物之自物耳物物者竟無物也際其安在乎際之不際者聖人之達觀也不際之際者凡鄙之滯情也既明物物者無物又明物之不能自物則為之者誰乎哉皆忽然而自爾也富貴為盈貧賤為虛老病為衰殺終始為本末生來為積死去為散夫物物者非物而生物誰乎此明能物所物皆非物也物既非物何盈虛衰殺之可語耶是知所謂盈虛皆非盈虛故西昇經云君能明之所是反非也衰殺色界反徐所例反下同驚字依釋文世德堂本及郭慶藩按語改惟覆宋本作至志字依正文改遊字依世德堂本改荷甘與神農同學於老龍吉神農隱几闔戶晝瞑荷甘日中奓戶而入曰老龍死矣神農隱几擁杖而起嚗然放杖而笑曰天知予僻陋慢訑故棄予而死已矣夫子無所發予之狂言而死矣夫姓字荷甘神農者非三皇之神農也則後之人物耳二人同學於老龍吉老龍吉亦是號也於河反荷甘音河本或作苛老龍吉李云懷道人也隱憑也闔合也奓開也亦排也學道之人心神凝靜閉門隱几守默而瞑荷甘既聞師亡所以排戶而告隱机於靳反下同盧文弨曰今本作几闔戶戶臘反晝瞑音眠奓郭處野反又音奢徐都嫁反又處夜反司馬云開也起而悟夫死之不足驚故還放杖而笑也嚗然放杖聲也神農聞吉死是以擁杖而驚覆思死不足哀故還放杖而笑俞樾曰既言擁杖而起不當言隱几疑隱几字涉上文神農隱几闔戶晝暝而衍嚗然音剝又孚邈反又孚貌反李云放杖聲也投杖本亦作放杖盧文弨曰今本作放杖自肩吾已下皆以至言為狂而不信也故非老龍連叔之徒莫足與言也夫子老龍吉也言其有自然之德故呼之曰天也狂言猶至言也非世人之所解故名至言為狂也而師知我偏僻鄙陋慢訑不專故棄背吾徒止息而死哲人云亡至言斯絕無復談玄垂訓開發我心僻陋匹亦反慢武半反徐無見反郭如字訑徒旦反徐徒見反郭音但已矣夫音符弇堈弔聞之曰夫體道者天下之君子所繫焉今於道秋豪之端萬分未得處一焉而猶知藏其狂言而死又況夫體道者乎視之無形聽之無聲於人之論者謂之冥冥所以論道而非道也言體道者人之宗主也弇音奄堈音剛弔李云弇剛體道人弔其名繫焉謂為物所歸投也秋豪之端細矣又未得其萬分之一明夫至道非言之所得也唯在乎自得耳姓弇名堈隱者也繫屬也聞龍吉之亡傍為議論云體道之人世間共重賢人君子繫屬歸依今老龍之於玄道猶豪端萬分之未一尚知藏其狂簡處順而亡況乎妙悟之人曾肯露其言說是知體道深玄忘言契理者之至稀也冥冥而猶復非道明道之無名也夫玄道虛漠妙體希夷非色非聲絕視絕聽故於學人論者論曰冥冥而謂之冥冥猶非真道也猶復扶又反於是泰清問乎無窮曰子知道乎無窮曰吾不知泰大也夫至道弘曠恬淡清虛囊括無窮故以泰清無窮為名也既而泰清以知問道無窮答以不知欲明道離形聲亦不可以言知求也又問乎無為無為曰吾知道曰子之知道亦有數乎曰有曰其數若何子既知道頗有名數不乎其數如何請為略述無為曰吾知道之可以貴可以賤可以約可以散此吾所以知道之數也貴為帝王賤為僕隸約聚為生分散為死數乃無極此略言之欲明非名而名非數而數也泰清以之言也問乎無始曰若是則無窮之弗知與無為之知孰是而孰非乎至道玄通寂寞無為隨迎不測無終無始故寄無窮無始為其名焉無窮無為弗知與知誰是誰非請定臧否與無為之知並如字無始曰不知深矣知之淺矣弗知內矣知之外矣不知合理故深玄而處內知之乖道故粗淺而疏外於是泰清中而歎曰弗知乃知乎知乃不知乎孰知不知之知凡得之不由於知乃冥也泰清得中道而嗟歎悟不知乃真知誰知不知之知明真知之至希也中而歎崔本中作卬無始曰道不可聞聞而非也道不可見見而非也道不可言言而非也知形形之不形乎道不當名故默成乎不聞不見之域而後至焉道無聲不可以耳聞耳聞非道也道無色不可以眼見眼見非道也道無名不可以言說言說非道也形自形耳形形者竟無物也夫能形色萬物者固非形色也乃曰形形不形也有道名而竟無物故名之不能當也名無得道之功道無當名之實所以名道而非王叔岷劉文典均謂不見下當有不言二字無始曰有問道而應之者不知道也雖問道者亦未聞道道無問問無應無問問之是問窮也無應應之是無內也以無內待問窮若是者外不觀乎宇宙內不知乎大初是以不過乎崑崙不遊乎太虛不知故問問之而應則非道也不應則非問者所得故雖問之亦終不聞也夫道絕名言不可問答故問道應道悉皆不知絕學去教而歸於自然之意也體道離言有何問應凡言此者覆釋前文去教起呂反所謂責空窮空也理無可問而強問之是責空也實無而假有以應者外矣理無可應而強應之乃成殊外家世父曰道無問意揣夫道而問之是先自窮也故曰問窮道無應意揣夫道而應之是徇外也故曰無內天地四方曰宇往古來今曰宙大初道本也若以理外之心待空內之智者可謂外不識乎六合宇宙內不知乎己身妙本者也大初音泰若夫婪落天地遊虛涉遠以入乎冥冥者不應而已矣崑是高遠之山太虛是深玄之理苟其滯著名言猶存問應者是知未能經過高遠游涉深玄者矣婪落力含反趙諫議本涉作步光曜問乎無有曰夫子有乎其無有乎光曜者是能視之智也無有者所觀之境也智能照察故假名光曜境體空寂故假名無有也而智有明暗境無深淺故以智問境有乎無乎光曜不得問而孰視其狀貌窅然空然終日視之而不見聽之而不聞搏之而不得也夫妙境希夷視聽斷絕故審狀貌唯寂唯空也俞樾曰淮南子道應篇光曜不得問上有無有弗應也五字當從之惟無有弗應故光曜不得問也此脫五字則義不備窅然烏了反搏之音博光曜曰至矣其孰能至此乎予能有無矣而未能無無也及為無有矣何從至此哉此皆絕學之意也於道絕之則夫學者乃在根本中來矣故學之善者其唯不學乎光明照曜其智尚淺唯能得無喪有未能雙遣有無故歎無有至深誰能如此玄妙而言無有者非直無有亦乃無無四句百非悉皆無有以無之一字無所不無言約理廣故稱無也而言何從至此者但無有之境窮理盡性自非玄德上士孰能體之是以淺學小智無從而至也大馬之捶鉤者年八十矣而不失豪芒大馬曰子巧與有道與捶鉤之輕重而無豪芒之差也大馬官號楚之大司馬也捶打鍛也鉤腰帶也大司馬家有工人少而善鍛鉤行年八十而捶鉤彌巧專性凝慮故無豪芒之差失也鉤稱鉤權也謂能拈捶鉤權知斤兩之輕重無豪芒之差失也大馬之捶鉤者年八十矣而不失豪芒捶郭音丁果反徐之累反李之睡反大馬司馬也司馬郭云捶者玷捶鉤之輕重而不失豪芒也或說云江東三魏之間人皆謂鍛為捶音字亦同郭失之今不從此說也盧文弨曰玷捶鉤舊本作玷捶鐵今依宋本改正別本同玷丁恬反捶丁果反司馬怪其年老而捶鍛愈精謂其工巧別有道術也巧與音餘下同唐寫本豪作鉤玷字依釋文及世德堂本改世德堂本作鉤曰臣有守也臣之年二十而好捶鉤於物無視也非鉤無察也是用之者假不用者也以長得其用而況乎無不用者乎物孰不資焉更無別術有所守持少年已來專精好此捶鉤之外無所觀察習以成性遂至於斯也王念孫曰守即道字達生篇仲尼曰子巧乎有道耶曰我有道也是其證道字古讀若守故與守通九經中用韻之文道字皆讀若守楚辭及老莊諸子並同秦會稽刻石文追道高明史記秦始皇紀道作首首與守同音說文道從首聲今本無聲字者二徐不曉古音而削之也而好呼報反都無懷則物來皆應所以至老而長得其捶鉤之用者假賴於不用心視察他物故也夫假不用為用尚得終年況乎體道聖人無用無不用故能成大用萬物資稟不亦宜乎以長丁丈反之字依讀書雜志補冉求問於仲尼曰未有天地可知邪仲尼曰可古猶今也言天地常存乃無未有之時姓冉名求仲尼弟子師資發起詢問兩儀未有之時可知已否夫變化日新則無今無古古猶今也故答云可知也冉求失問而退明日復見曰昔者吾問未有天地可知乎夫子曰可古猶今也昔日吾昭然今日吾昧然敢問何謂也失其問意遂退而歸既遵應問還用應答明日復扶又反見賢遍反昔日初咨心中昭然明察今時後閒情慮昧然暗晦敢問前明後暗意謂如何仲尼曰昔之昭然也神者先受之今之昧然也且又為不神者求邪無古無今無始無終未有子孫而有子孫可乎虛心以待命斯神受也思求更致不了先來未悟銳彼精神用心求受故昭然明白也後時領解不復運用精神直置任真無所求請故昧然闇塞也求邪者言不求也又為于偽反非唯無不得化而為有也有亦不得化而為無矣是以有之為物雖千變萬化而不得一為無也不得一為無故自古無未有之時而常存也日新而變故無始無終無今無古故知無未有天地之時者也言世世無極言子孫相生世世無極天地人物悉皆無原無有之時也可乎言不可也未有孫子而有孫子言其要有由不得無故而有傳世故有子孫不得無子而有孫也如是天地不得先無而今有也盧文弨曰今本孫子亦作子孫家世父曰天地運行而不息子孫代嬗而不窮浸假而有子孫矣求之未有子孫之前是先自惑也天地大化之運行無始無終未有天地於何求之故曰古猶今也相與為無窮之詞也夫字依世德堂本改冉求未對仲尼曰已矣未應矣不以生生死不以死死生死生有待邪皆有所一體有先天地生者物邪物物者非物物出不得先物也猶其有物也猶其有物也無已聖人之愛人也終無已者亦乃取於是者也夫死者獨化而死耳非夫生者生此死也生者亦獨化而生耳已止也未無也夫聚散死生皆獨化日新未嘗假賴豈相因待故不用生生此死不用死死此生冉求未對之間仲尼止令無應理盡於此更何所言也獨化而足死與生各自成體死獨化也豈更成一物哉死既不待於生故知生亦不待於死死生聚散各自成一體耳故無所因待也誰得先物者乎哉吾以陰陽為先物而陰陽者即所謂物耳誰又先陰陽者乎吾以自然為先之而自然即物之自爾耳吾以至道為先之矣而至道者乃至無也既以無矣又奚為先然則先物者誰乎哉而猶有物無已明物之自然非有使然也夫能物於物者非物也故非物則無先後物出則是物復不得有先於此物者何以知其然耶謂其猶是物故也以此推量竟無先物者也然則先物者誰乎哉明物之自然耳自然則無窮已之時也是知天地萬物自古以固存無未有之時也有先悉薦反下及注同家世父曰先天地者道也既謂之生矣是道亦物也既謂之物矣是其先物者又何自而生耶物與物相嬗而不已而推求物之始以得其先物而生者是物豈有已耶有已則或開而先之無已孰開而先之是以謂之物出不得先物也取於自爾故恩流百代而不廢也夫得道聖人慈愛覆育恩流百代而無窮止者良由德合天地妙體自然故能虛己於彼忘懷亭毒不仁萬物芻狗蒼生蓋取斯義而然也唐寫本者下無物字猶其有物也句劉得一本不重顏淵問乎仲尼曰回嘗聞諸夫子曰無有所將無有所迎回敢問其遊請夫子言將送也夫聖人如鏡不送不迎顏回聞之日未曉其理故詢諸尼父問其所由仲尼曰古之人外化而內不化今之人內化而外不化與物化者一不化者也安化安不化安與之相靡必與之莫多狶韋氏之囿黃帝之圃有虞氏之宮湯武之室君子之人若儒墨者師故以是非相也而況今之人乎聖人處物不傷物不傷物者物亦不能傷也唯無所傷者為能與人相將迎山林與皋壤與使我欣欣然而樂與樂未畢也哀又繼之哀樂之來吾不能禦其去弗能止悲夫世人直為物逆旅耳夫知遇而不知所不遇知能能而不能所不能無知無能者固人之所不免也夫務免乎人之所不免者豈不亦悲哉至言去言至為去為齊知之所知則淺矣以心順形而形自化古人純樸合道者多故能外形隨物內心凝靜以心使形內以緣通變化無明外形乖誤不能順物家世父曰外化者物與同內化者心與適心與適則與物俱化而莫得其所化與物俱化相靡而已矣莫得其所化而與為將迎有多於物者矣狶韋之囿黃帝之圃有虞氏之宮湯武之室其中愈深其外愈閟說文苑囿有垣也種菜曰圃釋名宮穹也屋見垣上穹隆然也說文室實也踵而為之飾事將迎日紛是非日淆於是儒墨並興各以其是非相和也而相與學一先生之言奉之為師取其所謂是非者將而非之迎而拒之是以謂之內化而外不化也常無心故一不化一不化乃能與物化耳化與不化皆任彼耳斯無心也安任也夫聖人無心隨物流轉故化與不化斯安任之既無分別曾不概意也直無心而恣其自化耳非將迎而靡順之靡順也所以化與不化悉安任者為不忤蒼生更相靡順不將不迎則足而止雖復與物相順而亦不多仁恩各止於分彼我無損言夫無心而任化乃群聖之所游處狶韋軒轅虞舜殷湯周武並是聖明王也言無心順物之道乃是狶韋彷徨之苑囿軒轅遨遊之園圃虞舜養德之宮闈湯武怡神之虛室斯乃群聖之所游而處之也之囿音又之圃布五反又音布和也夫儒墨之師天下之難和者而無心者猶故和之而況其凡乎和也夫儒墨之師更相是非天下之難和者也而聖人君子猶能順而和之況乎今世之人非儒墨之師者也隨而化之不亦宜乎相子兮反和也狶韋黃帝有虞湯武儒墨之師皆未能盡內不化之道故至於以是非相言其猶有是非之爭也五味相奪而後可以為故曰相至順也處俗和光利而不害故不傷之也在我而已虛舟飄瓦大順群生群生樂推故處不害無心故至順至順故能無所將迎而義冠於將迎也夫唯安任群品彼我無傷者故能與物交際而明不迎而迎者也義冠古亂反山林皋壤未善於我而我便樂之此為無故而樂也山林與音餘下同而樂音洛注下皆同夫無故而樂亦無故而哀也則凡所樂不足樂凡所哀不足哀也凡情滯執妄生欣惡忽睹高山茂林神皋奧壤則欣然欽慕以為快樂而樂情未幾哀又繼之情隨事遷哀樂斯變此乃無故而樂無故而哀是知世之哀樂不足計也不能坐忘自得而為哀樂所寄也逆旅客舍也窮達之來不能禦扞哀樂之去不能禁止而凡俗之人不閑斯趣譬彼客舍為物所停以妄為真深可悲歎也能禦魚呂反知之所遇者即知之知之所不遇者即不知也所不能者不能強能也由此觀之知與不知能與不能制不我也當付之自然耳夫智有明闇能有工拙各稟素分不可強為故分之所遇知則知之不遇者不能知也分之所能能則能之性之不能不可能也譬鳥飛魚泳蛛網蜣丸率之自然寧非性也家世父曰各有所知各有所能無相強也各有所不知各有所不能無相勝也強其所知以通其所不知強其所能以通其所不能而據之以為知據之以為能強天下而齊之是非相乘哀樂滋繁是故忘其所知而知乃自適也忘其所能而能乃自適也至言去言至為去為己且忘之奚暇齊天下焉齊知之所知者據所知以強通之天下者也強其丈反受生各有分也既非聖人未能智周萬物故知與不知能與不能稟生不同機關各異而流俗之人必固其所不免也人之所不免者分外智能之事也而凡鄙之流不能安分故銳意惑清務在獨免愚惑之甚深可悲傷皆自得也至理之言無言可言故去言也至理之為無為可為故去為也夫由知而後得者假學者耳故淺也見賢思齊捨己效物假學求理運知訪道此乃淺近豈曰深知矣齊知之才細反又如字敦煌本人作之闕誤引江南古藏本使上有與我無親四字敦煌本無知字由字依世德堂本改
