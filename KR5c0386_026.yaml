body:
  text: 雜篇庚桑楚第二十三以人名篇本或作庚桑楚盧文弨曰今書有楚字老聃之役有康桑楚者偏得老聃之道以北居畏壘之山其臣之畫然知者去之其妾之挈然仁者遠之擁腫之與居鞅掌之為使居三年畏壘大壤畏壘之民相與言曰庚桑子之始來吾灑然異之今吾日計之而不足歲計之而有餘庶幾其聖人乎子胡不相與尸而祝之社而稷之乎姓庚桑名楚老君之弟子蓋隱者也役門人之稱古人事師供其驅使不憚艱危故稱役也而老君大聖弟子極多門人之中庚桑楚最勝故稱偏得也老聃之役司馬云役學徒弟子也廣雅云役使也庚桑楚司馬云楚名庚桑姓也太史公書作亢桑慶藩案史記老莊列傳索隱引司馬云庚桑楚人姓名與釋文小異俞樾曰列子仲尼篇老聃之弟子有亢倉子者張湛注音庚桑賈逵姓氏英覽云吳邵有庚桑姓稱為七族然則庚桑子吳人歟偏得向音篇畫然飾知挈然矜仁畏壘山名在魯國臣僕隸妾接也言人以仁智為臣妾庚桑子悉棄仁智以接事君子也楚既幽人寄居山藪情敦素朴心鄙浮華山旁士女競為臣妾故畫然智自明炫者斥而去之然矜仁苟異於物者令其疏遠畏本或作又作猥同烏罪反向於鬼反壘崔本作纍同力罪反向良裴反李云畏壘山名也或云在魯又云在梁州畫然音獲知者音智注同挈然本又作契同苦計反向云知也又苦結反廣雅云提也遠之于萬反司馬云言人以仁智為臣妾庚桑悉棄仁智也擁腫朴也擁於勇反腫章勇反本亦作踵鞅掌自得擁腫鞅掌皆淳朴自得之貌也斥棄仁智淡然歸實故淳素之與其同居率性之人供其驅使鞅掌於丈反郭云擁腫朴也鞅掌自得也崔云擁腫無知貌鞅掌不仁意向云二句朴纍之謂司馬云皆醜貌也異其棄知而任愚大壤而掌反本亦作穰崔本同又如羊反廣雅云豐也盧文弨曰案列子天瑞篇亦以壤同穰灑然素殄反又悉禮反崔李云驚貌向蘇反夫與四時俱者無近功大穰豐也灑微驚貌也居住三年山中大熟畏壘百姓僉共私道云庚桑子初來我微驚異今我日計利益不足稱以歲計功其有餘蓋賢聖之人與四時合度無近功故計不足有遠德故歲計有餘三歲一閏天道小成故居三年而畏壘大穰日計之而不足向云無旦夕小利也歲計之而有餘向云順時而大穰也庶慕也幾近也尸主也庚桑大賢之士慕近聖人之德何不相與尊而為君主南面之事為立社稷建其宗廟祝祭依禮豈不善邪飾字依注文改士字依劉文典補正本改很字依韻會改世德堂本誤庚桑子聞之南面而不釋然弟子異之庚桑子曰弟子何異於豫夫春氣發而百草生正得秋而萬寶成夫春與秋豈無得而然哉天道已行矣吾聞至人尸居環堵之室而百姓猖狂不知所如往今以畏壘之細民而竊竊焉欲俎豆豫于賢人之間我其杓之人邪吾是以不釋於老聃之言忽聞畏壘之人立為南面之主既乖無為之道故釋然不悅門人未明斯趣是以怪而異之也夫春秋生皆得自然之道故不為也夫春生秋實陰陽之恆夏長冬藏物之常事故春秋豈有心施於萬實而天然之道已自行焉故忘其生有之德也實亦有作寶字者言二儀以萬物為寶故逢秋而成就也正得秋而萬寶成天地以萬物為寶至秋而成也元嘉本作萬實俞樾曰得字疑衍原文蓋作正秋而萬寶成易說卦兌正秋也萬物之所說也疏正秋而萬物皆說成也即本此文是其證得字蓋涉下句夫春與秋豈無得而然哉因而誤衍春氣發而百草生正秋而萬寶成文義已足不必加得字與上句相儷偶大道已行矣本或作天道直自往耳非由知也四面環各一堵謂之環堵也所謂方丈室也如死尸之寂泊故言尸居環如字廣雅云圓也堵丁魯反司馬云一丈曰堵環堵者面各一丈言小也不欲為物標杓竊竊平章偶語也俎切肉之几豆盛脯之具皆禮器也夫群龍無首先聖格言蒙德養恬後賢軌轍今細碎百姓偶語平章方欲禮我為賢尊我為主便是物之標杓豈曰棲隱者乎俎豆側呂反崔云俎豆食我於衆人間杓郭音的又匹么反又音弔廣雅云樹末也郭云為物之標杓也王云斯由己為人準的也向云馬氏作魡音的標必遙反一音必小反聃云功成事遂而百姓皆謂我自爾今畏壘反此故不釋然老君云功成弗居長而不宰楚既虔稟師訓畏壘反此故不釋然成字依世德堂本改今本作天道弟子曰不然夫尋常之溝巨魚無所還其體而鯢為之制步仞之丘陵巨獸無所隱其軀而狐為之祥且夫尊賢授能先善與利自古堯舜以然而況畏壘之民乎夫子亦聽矣弟子謂大人必有豐祿也八尺曰尋倍尋曰常六尺曰步七尺曰仞鯢小魚而有腳此非鯤大魚也制擅也夫尋常小瀆豈鯤鯨之所周旋而鯢小魚反以為美步仞丘陵非大獸之所藏隱而妖之狐用之為吉祥故知巨獸必隱深山大人應須厚祿也尋常之溝八尺曰尋倍尋曰常尋常之溝則周禮洫澮之廣深也洫廣深八尺澮廣二尋深二仞也所還音旋回也崔本作逮鯢五兮反音秋為之制廣雅云制折也謂小魚得曲折也王云制謂擅之也鯢專制於小溝也慶藩案釋文云制折也小魚得曲折也折與制本古通用字書呂刑制以刑墨子引作折則刑論語顏淵篇片言可以折獄者魯論語作制獄即其證也步仞之丘陵六尺為步七尺曰仞廣一步高一仞也孔安國云八尺曰仞小爾雅云四尺曰仞家世父曰水者魚之所歸也丘陵者獸之所歸也尋常之溝步仞之丘陵亦必有歸之者為有所庇賴也德愈大則歸之者愈衆郭象引巨魚巨獸為喻而云大人必有豐祿誤魚竭反狐為之祥李云祥怪也狐狸為妖言各有宜宜不失則大人有豐祿也王云野狐依之作妖祥也崔云蠱狐以小丘為善也祥善也尊貴賢人擢授能者有善先用與其利祿堯舜聖人尚且如是況畏壘百姓敢異前修夫子通人幸聽從也庚桑子曰小子來夫函車之獸介而離山則不免於罔罟之患吞舟之魚碭而失水則蟻能苦之故鳥獸不厭高魚鱉不厭深夫全其形生之人藏其身也不厭深眇而已矣去利遠害乃全其獸極大口能含車孤介離山則不免網羅為其患害吞舟之魚其質不小波蕩失水蟻能害之故鳥獸高山魚鱉深水豈好異哉蓋全身遠害魚鳥尚爾而況人乎函音含車之獸李云獸大如車也一云大容車介而音戒廣雅云獨也又古黠反一本作分謂分張也元嘉本同俞樾曰方言獸無偶曰介一本作分非慶藩案介釋文一本作分分與離相屬為義則作分者是也古書介本作分分俗作二形相似故傳寫多訛穀梁莊三十年傳燕周子分子釋文分本或作介周禮大宗伯注雉取其首介而死釋文介或作分春秋繁露立元神篇介障險阻介訛作分淮南謬稱篇禍之生也分分王念孫以為介介則介又誤為分皆其證也離山力智反下注同吞舟敕恩反又音天碭而失水徒浪反謂碭溢而失水也崔本作去水陸居也則蟻魚綺反苦之如字向云馬氏作最又作窮若嬰身於利祿則粗而淺眇遠也夫棲遁之人全形養生者故當遠跡塵俗深就山泉若嬰於利祿則粗而淺也深眇彌小反則粗七奴反後皆同一本二字依釋文補且夫二子者又何足以稱揚哉是其於辨也將妄鑿垣牆而殖蓬蒿也簡髮而櫛數米而炊竊竊乎又何足以濟世哉舉賢則民相軋任吞則民相盜之數物者不足以厚民民之於利甚勤子有殺父臣有殺君正晝為盜日中穴壞吾語女大亂之本必生於堯舜之間其末存乎千世之後千世之後其必有人與人相食者也二子謂堯舜二子謂堯舜也唐虞聖跡亂人之本故何足稱邪二子者向崔郭皆云堯舜也將令後世妄行穿鑿而殖穢亂也將令後世妄行穿鑿而殖穢亂辨別也物性之外別立堯舜之風以教跡令人倣效者猶如鑿破好垣牆種殖蓬蒿之草以為蕃屏者也蓬蒲空反將令力呈反理錐刀之末也譬如擇簡毛髮梳以為格量米數炊以供餐利益蓋微為損更甚而扻莊筆反又作櫛亦作楖皆同郭音節徐側冀反盧文弨曰今書作櫛王引之曰釋文扻莊筆反又作櫛亦作楖皆同郭音節徐側冀反按玉篇扻苦敢切打扻也不得音莊筆反又音節扻當為即玉篇字隸書轉寫手旁於左耳玉篇七咨切拏也此借為櫛髮之櫛故音莊筆反又音節凡從次聲之字可讀為即又可讀為節說文以土增大道上從土次聲堲古文從土即聲引虞書朕堲讒說殄行玉篇音才資才即二切說文欂櫨也從木咨聲咨從口次聲即是山節藻稅之節康誥勿庸以次女封荀子致士篇引此次作即皆其例也為櫛髮之櫛當讀入聲而其字以次為聲則亦可讀去聲故徐邈音側冀反數米色主反而炊昌垂反向云理於小利也混然一之無所治為乃濟祖述堯舜私議竊竊此蓋小道何足救世竊竊如字司馬云細語也一云計校之貌崔本作察察將戾拂其性以待其所尚軋烏黠反向音乙戾拂符弗反真不足而以知繼之則僞矣僞以求生非盜如何軋傷也夫舉賢授能任知先善則爭為欺侮盜詐百端趨競路開故更相害也任知音智注同無所復顧數物者謂舉賢任知等也此教浮薄不足令百姓淳厚也而蒼生貪利之心甚自殷勤私情怨忿遂生篡弒謀危社稷正晝為盜攻城穿壁日中穴壞也有殺音試本又作弒下同穴壞普回反向音裴云壞牆也言無所畏忌慶藩案與培同淮南子齊俗篇鑿培而遁之高誘注曰培屋後牆也亦與培同故高注曰後垣也呂氏春秋聽言篇亦作培漢書楊雄傳作壞音稍異而義同堯舜遺其跡飾僞播其後以致斯弊唐虞揖讓之風會成篡逆之亂亂之根本起自堯舜千載之後其弊不絶黃巾赤眉則是相食也吾語魚據反女音汝後皆放此堲字依說文補姦字依淮南子原文改南榮趎蹴然正坐曰若趎之年者已長矣將惡乎託業以及此言邪姓南榮名趎庚桑弟子也蹴然驚悚貌南榮既聞斯義心生慕仰於是驚懼正容勤誠請益云趎年老精神暗昧憑託何學方逮斯言南榮趎昌于反向音疇一音紹俱反徐直俱反又敕俱反又處由反李云庚桑弟子也漢書古今人表作南榮疇或作儔又作壽淮南作南榮幬云欶蹻趹步百舍不休亦作疇盧文弨曰案今淮南修務訓作疇舊欶蹻訛敕蟜今據本書改正高誘注欶猶箸蹻履趹趣也欶所角切蹻其略切趹音決箸即著直略切趣猶趨今淮南或無步字脫也蹴然子六反已長丁丈反將惡音烏庚桑子曰全汝形抱汝生無使汝思慮營營若此三年則可以及此言矣守其分也其分扶問反後以意求之無攬乎其生之外也俞樾曰釋名釋姿容曰抱保也相親保也是抱與保義通抱汝生即保汝生郭注曰無攬乎其生之外也猶泥抱字為說未達假借之旨不逐物境全形者也守其分內抱生者也既正分全生神凝形逸故不復役知思慮營營生也三年虛靜方可及乎斯言此庚桑教南榮之詞也思慮息吏反下同南榮趎曰目之與形吾不知其異也而盲者不能自見耳之與形吾不知其異也而聾者不能自聞心之與形吾不知其異也而狂者不能自得形之與形亦辟矣而物或間之邪欲相求而不能相得今謂趎曰全汝形抱汝生勿使汝思慮營營趎勉聞道達耳矣目與目耳與耳心與心其形相似而所能不同苟有不同則不可相法效也夫盲聾之士與凡常之人耳目無異而盲者不見色聾者不聞聲風狂之人與不狂之者形貌相似而狂人失性不能自得南榮舉此三以況一身不解至道之言與彼盲聾何別故內篇云非唯形骸有聾盲夫智亦有之也可其丈反下章可同未有閉之亦辟婢亦反開也崔云相著也音必亦反家世父曰郭象注形之與形亦辟矣未有閉之釋文辟婢亦反開也是假辟為闢鄭康成禮記大學注辟猶喻也說文言部譬喻也坊記辟則防與中庸辟如行遠辟如登高辟譬皆相通辟譬喻也言形之與形亦易喻也郭象注誤漢書鮑永傳言之者足戒聞之者未譬章懷太子注譬猶曉也曉然於形與形之同曉亦喻也兩形雖開而不能相得將有間也闢開也間別也夫盲與不盲二形孔竅俱開見與不見於物遂有間別而盲聾求於聞見終不可得也亦猶南榮求於解悟無由致之或間間廁之間注同早聞形隔故難化也全形抱生已如前釋重述所以彰問旨勉聞道崔向云勉也本或作達耳矣崔向云僅達於耳未徹入於心也庚桑子曰辭盡矣曰奔蜂不能化藿蠋越雞不能伏鵠卵魯雞固能矣雞之與雞其德非不同也有能與不能者其才固有巨小也今吾才小不足以化子子胡不南見老子奔蜂細腰土蜂也藿豆也蠋者豆中大青蟲越雞荊雞也魯雞今之蜀雞也奔蜂細腰能化桑蟲為己子而不能化藿蠋越雞小不能伏鵠卵蜀雞大必能之也言我才劣未能化大所說辭情理盡於此也奔蜂孚恭反司馬云奔蜂小蜂也一云土蜂藿蠋音蜀司馬云豆藿中大青蟲也越雞司馬向云小雞也或云荊雞也能伏扶又反鵠本亦作鶴同戶各反一音戶沃反卵力管反魯雞向云大雞也今蜀雞也慶藩案太平御覽九百十八引司馬云越雞小雞也魯雞大雞今蜀雞也視釋文所引微異夫雞有五德頭戴冠禮也足有距義也得食相呼仁也知時智也見敵能距勇也而魯越雖異五德則同所以有能與不能者才有大小也我類越雞才小不能化子子何不南行往師以謁老君闕誤引江南古藏本及李張二本曰字俱作南榮趎贏糧七日七夜至老子之所贏裹也擔也慕聖情殷晝夜不息終乎七日方見老君也贏糧音盈案方言贏儋也齊楚陳宋之間謂之贏一音果盧文弨曰音果字或有作裸者老子曰子自楚之所來乎南榮趎曰唯自從也問云汝從桑楚處來南榮趎曰唯直敬應之聲也答云如是曰唯惟癸反老子曰子何與人偕來之衆也南榮趎懼然顧其後二挾三言而來故偕俱也老子聖人照機如鏡未忘仁義故刺以偕來理挾三言故譏之言衆也挾三音協懼然驚貌也未達老子之言忽聞衆來之說顧眄其後恐有多人也懼然向紀俱反本又作戄音同又況縛反慶藩案懼然即瞿然也蓋驚貌其正字作說文九遇切舉目驚然也正字瞿懼皆借字禮檀弓懼然失席作瞿史記孟子傳王公大人初見其術懼然顧化漢書惠紀贊聞叔孫通之諫則懼然皆其證老子曰子不知吾所謂乎謂者言意也我言偕來譏汝挾三言而來汝視其後是不知吾謂也南榮趎俯而慚仰而歎曰今者吾忘吾答因失吾問俯低頭也自知暗眛不達聖言於是俯首羞慚仰天歎息神魂恍惚情彩章惶豈直喪其形容亦乃失其咨問因失吾問元嘉本問作聞慶藩案問猶聞也問聞古通用論語公冶長篇聞一知十釋文聞本或作問荀子堯問篇不聞即物少至楊倞曰聞或作問釋文二字依文義補老子曰何謂也問其所言有何意謂南榮趎曰不知乎人謂我朱愚知乎反愁我軀不仁則害人仁則反愁我身不義則傷彼義則反愁我己我安逃此而可此三言者趎之所患也願因楚而問之朱愚猶專愚無知之貌也若使混沌塵俗則有愚癡之名若運智人間更致危身之禍禍敗在己故云愁軀也家世父曰左傳襄公四年朱儒杜預注短小曰朱儒朱愚者智術短小之謂仁者兼愛之跡義者成物之功並是先聖蘧廬非所以全身遠害者也故不仁不義則傷物害人行義行仁則乖真背道未知若為處心免茲患害寄此三言因桑楚以為媒願留聽於下問使字依上句改老子曰向吾見若眉睫之間吾因以得汝矣今汝又言而信之若規規然若喪父母揭竿而求諸海也女亡人哉惘惘乎汝欲反汝情性而無由入可憐哉吾昔觀汝形貌巳得汝心今子所陳挾三術以子之言於是信驗向吾本又作嚮同眉睫音接釋名云目毛也規規細碎之謂也汝用心細碎懷茲三術猶如童稚小兒喪失父母也似儋揭竿木尋求大海欲測深底其可得乎汝是亡真失道之人亦是溺喪逃亡之子芒昧何所歸依也規規李云失神貌一云細小貌若喪息浪反注同揭其列其謁二反竿音干而求諸海也向云言以短小之物欲測深大之域也女亡人哉崔云喪亡性情之人也榮趎踐於聖跡溺於仁義縱欲還原反本復歸於實真情瘡疣已成無由可入大聖運慈深可哀也南榮趎請入就舍召其所好去其所惡十日自愁復見老子既失所問情識芒然於是退就家中思惟旬日徵求所好之道德除遣所惡之仁義未能契道是以悲愁庶其請益仍見老子所好呼報反去其起呂反所惡烏路反注同復見扶又反老子曰汝自灑濯熟哉鬱鬱乎然而其中津津乎猶有惡也夫外韄者不可繁而捉將內揵內韄者不可繆而捉將外揵外內韄者道德不能持而況放道而行者乎歸家一旬遣除五德滌蕩穢纍精熟以吾觀汝氣鬱鬱乎平雖復加功津津尚漏以此而驗惡猶未盡也灑濯大角反鬱鬱崔云孰灑貌津津如字崔本作律律云惡貌猶有惡也李云惡計未盡也揵關揵也耳目外也心術內也夫全形抱生莫若忘其心術遺其耳目若乃聲色韄於外則心術塞於內欲惡韄於內則耳目喪於外固必無得無失而後為通也韄者繫縛之名揵者關閉之目繁者急也繆者殷勤也言人外用耳目而為聲色也所韄者則心神閉塞於內也若內用心智而為欲惡所牽者則耳目閉塞於外也此內外相感必然之符假令用心禁制急手捉持殷勤綢繆亦無由得也夫唯精神定於內耳目靜於外者方合全生之道外擭向音霍崔云恢廓也又如字本亦作韄音獲又乙虢反又烏邈反又音羈李云縛也三蒼云佩刀靶韋也盧文弨曰今書作韄而捉徐側角反崔作促云迫促也內揵郭其輦反徐其偃反關也向云閉也又音蹇下同繆莫侯反又音稠結也崔向云綢繆也俞樾曰郭於此無注而注下文曰雖繁手以執之綢繆以持之弗能止也則訓繁為繁手殆不可通矣繁疑字之誤俗作繳漢書司馬相如傳名家苛察繳繞如淳曰繳繞猶纏繞也此以而捉繆而捉並言謂繞繆謂綢繆廣雅釋詁與綢繆並訓纏是其義一也繁形似因而致誤耳家世父曰說文韄佩刀絲也徐鍇曰絲其繫系也三蒼云佩刀靶韋是韄者縛繫之意外韄者制其耳目耳目之司紛紜繁變不可捉扼則內揵其心以息耳目之機內韄者制其心而心繆繞百出亦不可捉扼也則外揵其耳目以絶心之緣內外俱韄冥冥焉相與兩忘無有倚著道德不能入而為主又何津津有惡之存哉郭象云聲色韄於外則心術塞於內欲惡韄於內則耳目喪於外偏韄且不可況內外俱韄乎似非莊子本意偏韄不可況外內俱韄乎將耳目眩惑於外而心術流蕩於內雖繁手以執之綢繆以持之弗能止也偏執滯邊已乖生分況內外韄溺為惑更深縱有懷道抱德之士尚不能扶持況放散玄道而專行此惑欲希禁止可得乎放道如字向方往反云依也世德堂本作孰色字依注文補南榮趎曰里人有病里人問之病者能言其病然其病病者猶未病也若趎之聞大道譬猶飲藥以加病也趎願聞衛生之經而已矣閭里有病鄰里問之病人能自說其病狀者此人雖病猶未困重而可療也亦猶南榮雖愚能自陳過狀庶可教也夫藥以療疾疾愈而藥消教以機悟機悟而教息苟其本不病藥復不消教資不忘機又不悟不飲藥以加其病加病如字元嘉本作知病崔本作駕云加也經常也已止也夫聖教多端學門匪一今之所衛全生心之所存止在於此如蒙指誨輒奉為常衛生李云防衛其生令合道也高山寺本無然其病三字猶字依正文改老子曰衛生之經能抱一乎能勿失乎能無卜筮而知吉凶乎能止乎能已乎能舍諸人而求諸己乎能翛然乎能侗然乎能兒子乎兒子終日嗥而嗌不嗄和之至也終日握而手不共其德也終日視而目不瞚偏不在外也行不知所之居不知所為與物委蛇而同其波是衛生之經已不離其性守真不二也還自得也自得其性也當則吉過則凶無所卜也履道則吉徇物則凶斯理必然豈用卜筮王念孫曰吉凶當為凶吉一失吉為韻止已己為韻管子心術篇能專乎能一乎能無卜筮而知凶吉乎是其證內業篇凶吉亦誤為吉凶唯心術篇不誤當則丁浪反後放此止於分也不逐分外無追故跡已過不追全我而不效彼諸於也捨棄效彼之心追求己身之道能舍音捨下同無停跡也往來無係止翛音蕭徐始六反又音育崔本作隨云順也無節礙也順物無心也本又作侗大董反又音慟向敕動反云直而無纍之謂三蒼云直貌崔同字林云大也盧文弨曰今書作侗礙也五代反同於赤子也任聲之自出不由於喜怒嗌喉塞也嗄聲破任氣出聲心無喜怒故終日號不破不塞淳和之守遂至於斯嗥戶羔反本又作號音同而嗌音益崔云喉也司馬云咽也李音厄謂噎也一本作而不嗌案如李音有不字不嗄於邁反本又作嚘徐音憂司馬云楚人謂極無聲為嗄崔本作喝云啞也俞樾曰釋文嗄本作嚘徐音憂當從之老子終日號而不嗄傅奕本作即嚘之異文也揚子太玄經夷次三日柔嬰兒於號三日不嚘二宋陸王本皆如是蓋以嚘與柔為韻可知揚子所見老莊皆作嚘也任手之自握非獨得也拘寄而不勞倦者為其淳和與玄道至德同也終日握李云捲手曰握不五禮反向音藝崔云寄也廣雅云捉也俞樾曰說文無字角部觬角觬曲也疑即此字以角言則從角以手言則從手變觬為字之所以孳乳浸多也終日握而手不謂手不拳曲也崔云寄也殊非其義家世父曰釋文引崔云寄也廣雅云捉也今案揚雄太玄玄云玄之贊詞或以氣或以類或以事之卒擬也雄意假為擬說文擬度也言無有準擬揣度說文共同也授之物握之奪之物亦握之不待準量以為握也其德同也共其如字崔云一也任目之自見非係於色也瞚動也任眼之視視不動目不偏滯於外塵也不瞚字又作瞬同音舜動也本或作瞑莫經反偏不徐音篇任足之自行無所趣之往也泛若不繫之舟故雖行而無所的詣也縱體而自任也恬惔無為寂寞之至斯順之也接物無心委曲隨順委於危反蛇以支反物波亦波和光混跡同其波流總指已前結成其義也南榮趎曰然則是至人之德已乎若能自改而用此言便欲自謂至人之德如前所說衛生之經依而行之合於玄道至人之德止此可乎趙諫議本無若字便欲自三字曰非也是乃所謂冰解凍釋者能乎夫至人者相與交食乎地而交樂乎天不以人物利害相攖不相與為怪不相與為謀不相與為事翛然而往侗然而來是謂衛生之經已能乎明非自爾南榮拘束仁義其日固久今聞聖教方解衛生譬彼冬冰逢茲春日執滯之心於斯釋散此因學致悟非率自然能乎明非真也此則老子答趎之辭也冰解音蟹自無其心皆與物共夫至人無情隨物興感故能同蒼生之食地共群品而樂天交共也交食崔云交俱也李云共也交樂音洛俞樾曰郭注曰自無其無心皆與物共釋文引崔云交俱也李云共也是皆未解交字之義徐無鬼篇曰吾與之邀樂於天吾與之邀食於地與此文異義同交邀也古字只作徼文二年左傳寡君願徼福於周公魯公此云邀食乎地邀樂乎天語意正相似作邀者後出字作交者假借字詩桑扈篇彼交匪傲漢書五行志作匪僥匪傲其例矣攖擾亂也夫至人虛心順世與物同波故能息怪異於群生絶謀謨於黎首不以事為事何利害之能擾乎相攖於營反徐又音嬰廣雅云亂也崔云猶貫也重舉前文結成其義無其二字依正文改曰然則是至乎謂己便可得此言而至耶謂聞此言可以造極南榮不敏重問老君曰未也吾固告汝曰能兒子乎兒子動不知所為行不知所之身若槁木之枝而心若死灰若是者禍亦不至福亦不來禍福無有惡有人災也非以此言為不至也但能聞而學者非自至耳苟不自至則雖聞至言適可以為經胡可得至哉故學者不至至者不學也夫云能者獎勸之辭也此言雖至猶是筌既曰告汝則因稟學然學者不至至者不學在筌異魚故曰未也此是老子重答南榮虛沖凝淡寂寞無情同槁木而不榮類死灰而忘照身心既其雙遣何行動之可知乎衛生之要也若槁苦老反禍福生於失得人災由於愛惡今槁木死灰無情之至則愛惡失得無自而來夫禍福生乎得喪人災起乎美惡今既形同槁木心若死灰得喪兩忘美惡雙遣尚無冥昧之責何人災之有乎惡有音烏愛惡烏路反下同宇泰定者發乎天光發乎天光者人見其人物見其物人有修者乃今有恆有恆者人舍之天助之人之所舍謂之天民天之所助謂之天子夫德宇泰然而定則其所發者天光耳非人耀夫身者神之舍故以至人為道德之器宇也且德宇安泰而靜定者其發心照物由乎自然之智光宇泰定王云宇器宇也謂器宇閒泰則靜定也家世父曰虛室生白吉祥止止人心自兆其端倪而天光發焉自然而不可掩也修其自然而機應之人各自修也各自見也故曰人見其人天光自發則人見其人物見其物物各自見而不見彼所以泰然而定也凡庸之人不能測聖但見群於衆庶不知天光遐照也人而修人則自得矣所以常泰恆常也理雖絶學道亦資求故有真修之人能會凝常之道也常泰故能反居我宅而自然獲助也體常之人動以吉會為蒼生之所舍止皇天之所福助不亦宜乎出則天子處則天民此二者俱以泰然而自得之非為而得之也出則君后處則逸人皆以臨道體常故致斯功者也物見其物四字依闕誤引張君房本及注文補趙諫議本無自然二字學者學其所不能學也行者行其所不能行也辨者辨其所不能辨也知止乎其所不能知至矣若有不即是者天鈞敗之凡所能者雖行非為雖習非學雖言非辨夫為於分內者雖為也不為故雖學不學雖行不行雖辨不辨豈復為於分外學所不能耶學者學其所不能學也言人皆欲學其所不能知凡所能者故是能於所能夫能於所能者則雖習非習也所不能知不可彊知故止斯至率其所能止於分內所不能者不彊知之此臨學之至妙意雖欲為為者必敗理終不能若有心分外不以分內為是者斯敗自然之性者也敗之補邁反或作則元嘉本作則世德堂本有也字備物以將形藏不虞以生心敬中以達彼若是而萬惡至者皆天也而非人也不足以滑成不可內於靈臺靈臺者有持而不知其所持而不可持者也因其自備而順其成形將順也夫造化洪爐物皆備足但順成形於理問學備物以將形備具也將順也心自生耳非虞而出之虞者億度之謂夫至人無情物感斯應包藏聖智遇物生心終不預謀所為虞度者也億度待洛反理自達彼耳非慢中而敬外中內智也彼外境也敬重神智不敢輕染智既凝寂境自虛通天理自有窮通有為而致惡者乃是人若文王之拘羑里孔子之困匡人智非不明也人非不聖也而遭斯萬惡窮否者蓋由天時運命耳豈人之所為哉安之若命故其成不滑滑亂也體道會真安時達命縱遭萬惡不足以亂於大成之心以滑音骨靈臺者心也清暢故憂患不能入內入也靈臺心也妙體空靜故世物不能入其靈臺也靈臺郭云心也案謂心有靈智能住持也許慎云人心以上氣所往來也俞樾曰不可上當有萬惡二字上文若是而萬惡至者皆天也而非人也不足以滑成其文已足萬惡不可內於靈臺則又起下意下文云靈臺者有持而不知其所持而不可持者也皆承此言之讀者不詳文義誤謂不可內於靈臺與不足以滑成兩句相屬故刪萬惡二字耳文選廣絶交論李善注引此文正作萬惡不可內於靈臺有持者謂不動於物耳其實非持惟貴能持之心竟不知所以也若知其所持則持之持則失也若有心執持則失之遠矣故不可也不見其誠己而發每發而不當業入而不舍每更為失為不善乎顯明之中者人得而誅之為不善乎幽閒之中者鬼得而誅之明乎人明乎鬼者然後能獨行此妄發作不見其誠己而發謂不自照其內而外馳也發而不由己誠何由而當以前顯得道之士智照光明此下明喪真之人妄心乖理誠實也未曾反照實智而輒妄發迷心心既不真故每乖實當也每發而不當丁浪反爾雅云每雖也謂雖有發動不中當事不居其分內業事也世事攖擾每入心中不達違從故不能舍止發由己誠乃為得也每妄發心緣逐前境自謂為得更喪真夫人鬼幽顯乃曰殊塗至於推誠履信道理無隔若彼乖分失真必招報應讎怨相感所以遭誅則杜伯彭生之類是也幽閒音間幽顯無愧於心則獨行而不懼幽顯二塗分明無譴不犯於物故獨行不懼也闕誤引劉得一本每下有妄字高山寺本閒作冥券內者行乎無名券外者志乎期費行乎無名者唯庸有光志乎期費者唯賈人也人見其跂猶之魁然與物窮者物入焉與物且者其身之不能容焉能容人不能容人者無親無親者盡人兵莫憯於志鏌金耶為下寇莫大於陰陽無所逃於天地之間非陰陽賊之心則使之也券分也夫遊於分內者行不由於名券分也無名道也履道而為於分內者雖行而無名跡也券內字又作卷徐音勸券分符問反下同崔云券分明也則宜方云反有益無益斯欲損己以為物也期卒也立志矜矯游心分外終無成益卒有費損也期費芳貴反下同廣雅云期卒也費耗也言若存分外而不止者卒有所費耗也俞樾曰案郭象注既言志又言期於義復矣釋文於義亦不可通今案荀子書每用綦字為窮極之義王霸篇目欲綦色耳欲綦聲楊注曰綦極也亦或作期議兵篇曰已期三年然後民可信也宥座篇曰綦三年而百姓往矣是期與綦通期費者極費也費謂財用也呂覽安死篇非愛其費也高曰費財也期費之義與綦色綦聲相近彼謂窮極其聲色此謂窮極其財用也故下文曰志乎期費者惟賈人也以為于僞反本有斯光因而用之庸用也游心無名之道者其所用智日有光明也雖己所無猶借彼而販賣也志求之分外要期聲名而貪損神智者意唯名利猶高價販賣之人賈人音古夫期費者人已見其跂矣而猶自以為安企危也魁安也鋭情貪取分外企求他人見其危乎猶自以為安穩愚之至也人見其跂猶之魁苦回反安也一云主也然謂衆人已見其跂求分外而猶自安可羞愧之甚也家世父曰說文勞也人勞則倦內者反觀外者徇外徇外則測量之意多而營度之用廣測量營度賈人之術也說文期會也費散財用也玉篇費用也期費者約會施用之意魁然自大人見其踑跂以行而不自知釋文魁安也一曰主也似未愜郭象注且謂外而跂者窮者誠己而發者也苟且則苟且相與而已志乎期會之謂且行乎無名斯能窮盡其意也窮謂終始舍止之謂也物我冥符而窮理盡性者故為外物之所歸依之也且謂外而跂者跂者不立焉能自容不能自容焉能容人人不獲容則去也聊與人涉苟且於浮華貪利求名身尚矜企心靈躁競不能自容何能容物耶物且且始也俞樾曰且即苟且之且詩東門之枌篇穀旦于差韓詩旦作且云苟且也是重言為苟且單言為且也上文與物窮者郭注窮謂終始是窮為窮極之義苟且與窮極義正相反也釋文曰且始也非是焉於虔反注同身且不能容則雖己非己況能有親乎故盡是他人褊狹不容則無親愛既無親愛則盡是他人逆忤既多讎敵非少欲求安泰其可得乎夫志之所攖燋火故其為兵甚於劍戟也兵戈鋒刃之徒鏌金耶良劍也夫憯毒傷害莫甚乎心心志所緣不疾而速故其為損害甚於鏌金耶以此校量劍戟為下莫憯七坎反廣雅云痛也元嘉本作潛慶藩案憯與慘同說文慘毒也字或作憯方言慘殺也與訓毒義相近鏌音莫金耶也嗟反鏌金耶良劍名寇敵也域心得喪喜怒戰於胸中其寒凝冰其熱燋火此陰陽之寇也夫勍敵巨寇猶可逃之而兵起內心如何避邪心使氣則陰陽徵結於五藏而所在皆陰陽也故不可逃此非陰陽能賊害於人但由心有躁競故使之然也五藏才浪反後皆放此凝冰二字依宋本及下疏文改道通其分也其成也毀也所惡乎分者其分也以備所以惡乎備者其有以備故出而不反見其鬼出而得是謂得死滅而有實鬼之一也以有形者象無形者而定矣成毀無常分而道皆通夫物之受氣各有崖限妍醜善惡稟分毀成而此謂之成彼謂之毀道以通之無不備足其分符問反注及下皆同一音方云反不守其分而求備焉所以惡分也夫榮辱壽夭稟自天然素分之中反己備足分外馳者而求備焉游心是非之境惡其所受之分也所惡烏路反下及注皆同本分不備而有以求備所以惡備也若其本分素備豈惡之哉造物已備而嫌惡之豈知自然先已備矣不反守其分內則其死不久夫出愚惑妄逐是非之境而不能反本還原者動之死地故見為鬼也故出而不反謂情識外馳而不反觀於內也見其鬼王云永淪危殆資死之術己行及之故曰見鬼也不出而無得乃得生其出心逐物遂其欲情而有所獲者此可謂得死滅之本出而得是謂得死若情識外馳以為得者是曰得死耳非理也已滅其性矣雖有斯生何異於鬼迷滅本性謂身實有生死不殊故與鬼為一也滅而有實鬼之一也廣雅云滅殄也盡也實塞也既殄塞純朴之道而外馳澆薄之境雖復行尸於世與鬼何別故云鬼一也雖有斯形苟能曠然無懷則生全而形定也象似也雖有斯形似如無者即形非有故也曠然忘我故心靈和光而止定也高山寺本其分也下有成也二字出無本入無竅有實而無乎處有長而無乎本剽有所出而無竅者有實有實而無乎處者宇也有長而無本剽者宙也有乎生有乎死有乎出有乎入入出而無見其形是謂天門天門者無有也萬物出乎無有有不能以有為有必出乎無有而無有一無有聖人藏乎是欻然自生非有本欻然自死非有根出生也入死也從無出有有無根原自有還無無乃無竅穴也出無本入無竅苦弔反出生也入死也本始也竅孔也所以知有形纍於無形者以其出入無本竅故也家世父曰郭象以出入為生死出入非生死也以象乎生死者也形者實也無所處乎其形故有出無形之形所以長也而更無始終本末之可言故有入出入無竅也而固有實天地六合曰宇宇以言乎其廣也古往今來曰宙宙以言乎其長也出入宇宙之中而無見其形斯之謂定欻然訓勿反剽末也亦原也本亦作摽字今隨字讀之言從無出有實有此身推索因由無處所自古至今甚為長遠尋求今古竟無本末乎處昌據反下注同有長丁丈反增也又如字下注同本剽本亦作摽同甫小反崔云末也李怖遙反徐又敷遙反下同盧文弨曰摽當作標言出者自有實耳其所出無根竅以出之有所出而無竅穴者以凡觀之謂其有實其實不有也有所出夫生必有所出也而無此明所出是無也既是無矣何能有所出耶竅者有實既言有竅竅必有實求實不得竅亦無也宇者有四方上下而四方上下未有窮處宇者四方上下也方物之生謂其有實尋責宇中竟無來處宇既非矣處豈有邪有實而無乎處者宇也三蒼云四方上下為宇宇雖有實而無定處可求也宙者有古今之長而古今之長無極宙者往古來今也時節賒長謂之今古推求代序竟無本末宙既無矣本豈有耶有長而無本剽者宙也三蒼云往古來今曰宙說文曰舟輿所極覆為宙長猶增也本始也宙雖有增長亦不知其始末所至者也死生出入皆欻然自爾無所由故無所見其形出入生死也謂其出入生死故有出入之名推窮性理竟無出入處所之形而可見也天門者萬物之都名也謂之天門猶云衆妙之門也天者自然之謂也自然者以無所由為義言萬有皆無所從莫測所以自然為造物之門戶也死生出入皆欻然自爾未有為之者也然有聚散隱顯故有出入之名徒有名耳竟無出入門其安在乎故以無為門以無為門則無門也夫天然之理造化之門徒有其名竟無其實而一切萬物從此門生故郭注云以無為門以無為門則無門矣夫有之未生以何為生乎故必自有耳豈有之所能有乎有既有矣焉能有有有之未生誰生其有推求斯有竟無有也此所以明有之不能為有而自有耳非謂無能為有也若無能為有何謂無乎夫已生未生二俱無有此有之出乎無有非謂此無能生有無若生有何謂無乎一無有則遂無矣無者遂無則有自欻生明矣不問百非四句一切皆無故謂一無有任其自生而不生生玄德聖人冥真契理藏神隱智其在茲乎闕誤引張君房本入出作出入竟字依下句改古之人其知有所至矣惡乎至有以為未始有物者至矣盡矣弗可以加矣其次以為有物矣將以生為喪也以死為反也是以分已其次曰始無有既而有生生俄而死以無有為首以生為體以死為尻孰知有無死生之一守者吾與之為友是三者雖異公族也昭景也著戴也甲氏也著封也非一也玄古聖人得道之士知與境合故稱為至問至所由何為至惡乎音烏此顯至之體狀也知既造極觀中皆空故能用諸有法未曾有一物者也可謂精微至極窮理盡性虛妙之甚不復可加矣其次以下未達真空而諸萬境用為有物也喪其散而之乎聚也為喪息浪反注同還融液也喪失也流俗之人以生為得以死為喪今欲反於迷情故以生為喪以其無也以死為反反於空寂雖未盡於至妙猶齊於死生融液音亦雖欲均之然已分也雖齊死生猶見死生之異故從非有而起分別也以分方云反注同其次以下心知稍暗而始本無有從無有生俄頃之間此生彼滅故用無為其頭以生為其形體以死為其尻誰能知有無生死之不二而以此修守者莊生狎而友朋斯人猶難得也為尻苦羔反或有而無之或有而一之或分而齊之故謂三也此三者雖有盡與不盡然俱能無是非於胸中故謂之公族三者謂以無為首以生為體以死為尻是也於一體之中而起此三異猶如楚家於一姓之上分為三族此四者雖公族然已非一則向之三者已復差之昭屈景楚之公族三姓昔屈原為三閭大夫掌三族三姓即斯是也此中文略故直言昭景王孫公子長大加冠故著衣而戴冠也各有品秩咸邪職官因官賜姓故甲第氏族也功績既著封之茅土枝派分流故非一也猶如一道之中分為有無生死種類不同名實各有異故引其族以譬也昭景也著丁略反又張慮反戴本亦作載也甲氏也著張慮反久也又丁略反封也非一也一說云昭景甲三者皆楚同宗也著戴者謂著冠世世處楚朝為衆人所戴仰也著封者謂世世處封邑而光著久也昭景甲三姓雖異論本則同也崔云昭景二姓楚之所顯戴皆甲姓顯封雖非一姓同出公族喻死生同也此兩說與注不同聊出之耳家世父曰郭注四者公族似謂昭景甲氏皆族釋文一說云昭景甲三者皆楚同宗又引崔云昭景二姓楚之所顯戴皆甲姓顯封疑崔說是也王逸楚辭注三閭掌王族三姓曰昭屈景無以甲為氏者說文首戴也爾雅釋地途出其前戴邱著戴者昭景相承為氏也甲者日之始也言始得氏以受封而後相承為氏也同為公族而所從來固非一矣已復扶又反闕誤引文如海本守作宗有生黑咸也披然曰移是嘗言移是非所言也雖然不可知者也臘者之有膍胲可散而不可散也觀室者周於寢廟又適其偃焉為是舉移是直聚氣也黑咸疵也無有此形質而謂之生者直是聚氣成疵黑咸非所貴者也有生黑咸徐於減反司馬云烏簟反云黶有疵也有疵者欲披除之李烏感反字林云釜底黑也既披然而有分則各是其所是矣是無常在故曰移披分散也夫道無披我而物有是非是非不定故分散移徙而不常也其移是之狀列在下文披普皮反然曰移是或云然聚而生披然散而死也所是之移已著於言前矣理形是非故試言耳然是非之移非所言也不言其移則其移不可知故試言也雖復是非不由於言而非言無以知是非故試言是非一遣於是非名不寄言則不知是非之無是非也物各有用臘者大祭也膍牛百葉也胲備也亦言是牛蹄也臘祭之時牲牢甚備至於四肢五藏並皆陳設祭事既訖方復散之則以散為是若其祭未了則不合散則以散為不是是知是與不是移是無常臘力闔反者之有膍音毗司馬云牛百葉也本或作音毗獐也胲古來反足大指也崔云備也案臘者大祭備物而肴有膍胲此雖從散禮應具不可散棄也偃謂屏廁偃屏廁也祭事既竟齊宮與飲施設餘胙於屋室之中觀看周旋於寢廟之內飲食既久應須便僻故往圊圂而便尿也飲食則以寢廟為是便尿則以圊圂為是是非無常竟何定乎臘者明聚散無恆觀室顯處所不定俱無是非也其偃於晚反司馬郭皆云屏廁也又於建反慶藩案郭與司馬云偃屏廁也桂馥云屏當為庰偃當為晏急就篇庰廁清圂糞土壤顏注庰僻偃之名也今案桂氏謂屏當為庰是矣偃當為晏頗無所據愚謂偃當為匽周禮宮人為其井井疑庰之誤字匽鄭司農云匽路廁也燕策宋王鑄諸侯之象使侍屏屏亦庰之訛也匽庰匽者庰廁也開元占經引甘氏云天溷七星在外屏淮南注天溷廁也屏所以障天翳也屏廁步定反又必領反下同寢廟則以饗燕屏廁則以偃溲當其偃溲則寢廟之是移於屏廁矣故是非之移一彼一此誰能常之故至人因而乘之則均耳為是于僞反家世父曰有生塵也者塵之積而留焉者也則將以死易生披然曰移是乎雖然既有生矣如膍胲之相附散之則死而固不可散也有生者有死如寢廟之有偃相須而成者也而是曰移是是以生為擾以死為歸自見為纍者也齊生死者更無是非名實之可言也以生為纍固必有己之見存而乘之以為是非名實而知愚榮辱之爭紛然起矣移是者終有不能移者也有生之所以為也溲所留反闕誤引江南古藏本及李張二本偃下有溲字世德堂本矣作也請常言移是是以生為本以知為師因以乘是非果有名實因以己為質使人以為己節因以死償節若然者以用為知以不用為愚以徹為名以窮為辱移是今之人也是蜩與學鳩同於同也物之變化無時非生生則所在皆本也夫能忘生死者則無是無非者也祇為滯生所以執是也必能遣生是將安寄故知移是以生為本所知雖異而各師其知乘是非者無是非也因其師知之心心乘是非之用豈知師知者顛倒是非者無是非乎物之名實果各自有夫物云云悉皆虛幻芻狗萬象名實何施倒置之徒謂決定有此名實也質主也物各謂己是足以為是非之主質主也妄執名實遂用己為名實之主而競是非也人皆謂己是故莫通節者至操也既迷名實又滯是非遂使無識之人堅執虛名以為節操也當其所守非真脫也守是非以成志操乎不拔期死執之也因以死償節常亮反廣雅云償報也復也案謂殺身以成名節成而身死故曰以死償節也不能隨所遇而安之以炫耀為智晦跡為愚通徹為榮名窮塞為恥辱若然者豈能一窮通榮辱乎為知音智玄古之人無是無非何移之有夫固執名實移滯是非澆季浮僞今世之人也豈上古淳和質朴之士乎同共是其所同蜩鷽二蟲以蓬蒿為是二蟲同是未為通見移是之人斯以類也蜩同於鳩鳩同於蜩故曰同於同也蜩音條學鳩本或作鷽音同闕誤引江南古藏本及李張二本今上俱有非字趙諫議本足作是蹍市人之足則辭以放驁兄則以嫗大親則已矣故曰至禮有不人至義不物至知不謀至仁無親至信辟金稱己脫誤以謝之蹍踏也履也履踏市廛之人不相識者之節足腳則謝云己傲慢放縱錯雜誤而然非故為也者蹍女展反司馬李云蹈也廣雅云履也慶藩案文選馬季長長笛賦注引司馬云蹍女展切釋文漏驁五報反廣雅云妄也言嫗詡之無所辭謝踏著兄弟之足則嫗詡而憐之不以言愧嫗於禹反注同詡況甫反明恕素足若父踏子足則然而已不復辭費故知言辭往來僞不實不人者視人若己視人若己則不相辭謝斯乃禮之至也自彼兩忘視人若己不人者己內外何辭謝之有乎斯至禮也各得其宜則物皆我也物我雙遣妙得其宜不我外有物何非之有斯至義也謀而後知非自然知率性而照非謀謨而斯至智也譬之五藏未曾相親而仁已至矣方之手足更相御用無心相為而相濟之功成矣豈有親愛於其間哉未曾才能反金玉者小信之質耳至信則除矣辟除也金玉者小信之質耳至信則棄除之矣辟金必領反除也又婢亦反也字依上下文補徹志之勃解心之謬去德之纍達道之塞貴富顯嚴名利六者勃志也容動色理氣意六者心也惡欲喜怒哀樂六者纍德也去就取與知能六者塞道也此四六者不蕩胸中則正正則靜靜則明明則虛虛則無為而無不為也道者德之欽也生者德之光也性者生之質也性之動謂之為為之僞謂之失知者接也知者謨也知者之所不知猶睨也動以不得已之謂德動無非我之謂治名相反而實相順也徹毀也勃亂也繫縛也此略標名下具顯釋也之勃本又作悖同必妹反之謬如字一本作繆亡侯反亦音謬去德起呂反榮貴富贍高顯尊嚴聲名利祿六者亂情志之具也容貌變動顏色辭理氣調情意六者綢繆繫縛心靈者也本亦有作謬字者解心之謬妄也憎惡愛欲欣喜恚怒悲哀歡樂六者德家之患纍也惡欲烏路反哀樂音洛纍德劣僞反後注同去捨從就貪取施與知慮伎能六者蔽真道也知能音智蕩動也四六之病不動蕩於胸中則心神平正正則安靜靜則照明明則虛通虛則恬淡無為應物而無窮也不蕩本亦作蕩徒黨反郭云動也又徒浪反又吐浪反道是所修之法德是臨人之法重人輕法故欽仰於道俞樾曰說文部廞陳輿服於庭也小爾雅廣詁廞陳也此欽字即廞之假字蓋所以生者為德而陳列之即為道故曰德之廞也漢書哀帝紀注引李斐曰陳道也是其義矣天地之大德曰生故生化萬物者盛德之光華也德之光一本光字作先質本也自然之性者是稟生之本也以性自動故稱為耳此乃真為非有為也率性而動分內而為為而無為非有為也感物而動性之欲也矯性僞情分外有為謂之喪道也夫交接前物謀謨情事故謂之知也夫目之能視非知視而視也不知視而視不知知而知耳所以為自然若知而後為則知僞也睨視也夫目之張視也不知所以視而視而視有明暗心之能知不知所以知而知而知有深淺而目不能視而不可強視心不能知而不可強知若有分限猶如睨也睨也魚計反又五禮反視也若得已而動則為強動者所以失也夫迫而後動和而不唱不得已而用之可謂盛德也家世父曰與物相接而知生焉因而為之謹謀謨而知名焉其所不知猶將睨視而揣得之知之所由成也道之所由毀也動於不得已而一任我之自然奚以知為哉動而效彼則亂率性而動不捨我效物合於正理故不亂謂治直吏反有彼我之名故反得其實則順有彼我是非之名故名相反無彼我是非之實故實相順也謬字依上文及世德堂本改而字依下句補謀謨二字依上疏文改名字依世德堂本改羿工乎中微而拙乎使人無己譽聖人工乎天而拙乎人夫工乎天而俍乎人者唯全人能之唯蟲能蟲唯蟲能天全人惡天惡人之天而況吾天乎人乎善中則善取譽矣理常俱也羿古之善射人工巧也羿彎弓放矢工中前物盡射家之微妙既有斯伎則擅斯名使己無令譽不可得也羿五計反徐又戶計反中微丁仲反注同己譽音餘後章同任其自然天也有心為之人也前起譬此合也聖人妙契自然功侔造化使群品日用不知不顯其跡此誠難也故上文云使天下兼忘我難工於天即俍於人矣謂之全人全人則聖人也俍善也全人神人也夫巧合天然善能晦跡澤及萬世而日用不知者其神人之謂乎神人無功故能之耳而俍音良崔云良工也又音浪能還守蟲即是能天鳥飛獸走能蟲也蛛網蜣丸能天也皆稟之造物豈仿效之所致哉唯蟲一本唯作雖下句亦爾言蟲自能為蟲者天也家世父曰能天者不知所謂天若知有天則非天矣人惡知天惡知人之天天吾心自適之趣全人初未嘗辨而知之豈吾心所能自喻乎惡當為汪胡切與烏同釋文烏路反者誤慶藩案兩唯字當從釋文作雖唯古或借作雖詩大雅抑篇女雖湛樂從言女唯湛樂之從也書無逸惟耽樂之從管子君臣篇雖有明君能決之又能塞之言唯有明君能之也夫全德之人神功不測豈嫌己之素分而惡人之所稟哉蓋不然乎率順其天然而已矣惡天烏路反下同都不知而任之斯謂工乎天天乎人乎不見人天之異都任之也前自遣天人美惡猶有天人此句混一天人不見天人之異也吾者論主假自稱也也字依王叔岷說補全字依正文改所字依王叔岷說改一雀適羿羿必得之威也以天下為之籠則雀無所逃是故湯以胞人籠伊尹秦穆公以五羊之皮籠百里奚是故非以其所好籠之而可得者無有也威以取物物必逃之假有一雀羿善射射必得之此以威猛猛非由德慧故所獲者少所逃者多以威御世其義亦爾威也崔本作或也天下之物各有所好所好各得則逃將安大道曠蕩無不制圍故以天地為籠則雀無逃處是知以威取物深乖大造之籠力東反所好呼報反下及注文同伊尹有莘氏之媵臣能調鼎負玉鼎以干湯湯知其賢也又順其性故以庖廚而籠之百里奚沒狄狄人愛羊皮秦穆公以五色羊皮而贖之又云百里奚好著五色羊皮裘號曰五羖大夫而湯聖穆賢俱能好士故得此二人用為良皆順其本性所以籠之湯以胞本又作庖白交反盧文弨曰案胞與庖通禮記祭統輝胞翟閽注胞者肉吏之賤者也人籠伊尹伊尹好廚故湯用為庖人也秦穆公以五羊之皮籠百里奚百里奚好秦而拘於宛故秦穆公以五羊皮贖之於楚也或云百里好五色皮裘故因其所好也順其所好則天下無難逆其本性而牢籠得者未之有也趙諫議本胞作庖介者拸畫外非譽也胥靡登高而不懼遺死生也夫復謵不餽而忘人忘人因以為天人矣故敬之而不喜侮之而不怒者唯同乎天和者為然出怒不怒則怒出於不怒矣出為無為則為出於無為矣欲靜則平氣欲神則順心有為也欲當則緣於不得已不得已之類聖人之道畫所以飾容貌也刖者之貌既以虧殘則不復以好醜在懷故拸而棄之介刖也拸去也畫裝也裝嚴服飾本為容儀殘刖之人形貌殘損至於非譽榮辱無復在懷故拸而棄之介音界郭云刖也又古黠反廣雅云獨也崔本作兀拸畫敕紙反又音他又與紙反本亦作移司馬云畫飾容之具無足故不復愛之一云移離也崔云移畫不拘法度也俞樾曰郭注曰畫所以飾容貌也刖者之貌既以虧殘則不復以好醜在懷故拸而棄之然云外非譽似不當以容貌言崔云拸畫不拘法度也當從之漢書司馬相如傳痑以陸離師古注曰痑自放縱也即此拸字之義桓六年穀梁傳以其畫我公羊傳作化我何休注曰行過無禮謂之化即此畫字之義蓋人既刖足不自顧惜非譽皆所不計故不拘法度也不復扶又反無賴於生故不畏死胥靡徒役之人也千金之子固貴其身僕隸之人不重其命既不矜惜故登危而不怖懼也胥靡司馬云刑徒人也一云癃人也崔云腐刑也不識人之所惜餽本亦有作愧字者隨字讀之夫復於本性胥以成之既不舍己效人遂棄忘於愧謝斯忘於人倫之道也譬之手足方諸服用更相御用豈謝賴於其間哉夫復音服徐扶又反謵音習不餽其愧反廣雅云遺也一音愧元嘉本作愧而忘人復者溫復之謂也謵玩也夫人玩習者雖復小事皆所至惜今溫復人之所習既得之矣而不還歸以餽遺之此至愚不獲人之所習者也無復相為之情故曰忘人家世父曰非譽通作毀譽言此言毀其陋也外非譽遺死生忘己者也復謵不餽忘人者也說文讋失氣言謵言謵讋謵也復謵謂人語言懾伏以下我而我報之鄭康成士虞禮注饋猶歸也以物與神及人皆言饋以物與人曰餽以言語餉人亦曰餽復謵不餽忘貴賤也忘人忘己則同乎天和矣釋文謂音習玩也誤無人之情則自然為天人率其天道之性忘於人道之情因合於自然之理也彼形殘胥靡而猶同乎天和況天和之自然乎同乎天和忘於逆順故恭敬之而不喜侮慢之而不怒也侮之亡甫反此故是無不能生有有不能為生之意也夫能出怒出為者不為不怒者也是以從不怒不為出故知為本無為怒本不怒能體斯趣故侮之而不怒也平氣則靜理足順心則神功至緣於不得已則所為皆當故聖人以斯為道豈求無為於恍惚之外哉緣順也夫欲靜攀援必須調乎志氣神功變化莫先委順心靈和混有為之中而欲當於理者又須順於不得止不得止者感而後應分內之事也如斯之例聖人所以用為正道也謵讋二字原誤倒依說文改
