body:
  text: 內篇德充符第五德充於內應物應於外外內玄合信若符命而遺其形骸也崔云此遺形棄知以德實之驗也物應依趙諫議本改魯有兀者王駘從之遊者與仲尼相若常季問於仲尼曰王駘兀者也從之遊者與夫子中分魯立不教坐不議虛而往實而歸固有不言之教無形而心成者邪是何人也姓王名駘魯人也刖一足曰兀形雖殘兀而心實虛忘故冠德充符而為篇首也兀者五忽反又音界李云刖足曰兀案篆書兀介字相似王駘音臺徐又音殆人姓名也弟子多少敵孔子若如也陪從王駘遊行稟學門人多少似於仲尼者也從之如字李才用反下同相若若如也弟子如夫子多少也姓常名季魯之賢人也王駘遊行外忘形骸內德充實所以從遊學者數滿三千與孔子之徒中分魯國常季未達其趣是以生疑常季或云孔子弟子各自得而足也弟子雖多曾無講說立不教授坐無議論請益則虛心而往得理則實腹而歸又解未學無德亦為虛往也立不教坐不議司馬云立不教授坐不議論怪其殘形而心乃充足也夫心之全也遺身形忘五藏忽然獨往而天下莫能離教授門人曾不言議殘兀如是無復形容而玄道至德內心成滿必固有此眾乃從之也五藏才浪反後同常季怪其殘兀而聚眾極多欲顯德充之美故發斯問也仲尼曰夫子聖人也丘也直後而未往耳丘將以為師而況不若丘者乎奚假魯國丘將引天下而與從之宣尼呼王駘為夫子答常季云王駘是體道聖人也汝自不識人所以致疑丘直為參差在後未得往事丘將尊為師傅諮詢問道何況晚學之類不如丘者乎請益服膺固其宜矣丘也直後而未往耳李云自在眾人後未得往師之耳慶藩案直之為言特也呂氏春秋忠廉篇特王子慶忌為之飭而不殺耳高注特猶直也鄘風柏舟實維我特韓特作直史記叔孫通傳吾直戲耳漢書直作特夫神全心具則體與物冥與物冥者天下之所不能遠奚但一國而已哉奚何也何但假藉魯之一邦耶丘將誘引宇內稟承盛德猶恐未盡其道也能遠于萬反常季曰彼兀者也而王先生其與庸亦遠矣若然者其用心也獨若之何王盛也庸常也先生孔子也彼王駘者是殘兀之人門徒侍從盛於尼父以斯疑怪應異常流與凡常之人固當遠矣而王于況反李云勝也崔云君長也其與庸亦遠矣與凡庸異也崔云庸常人也然猶如是也王駘盛德如是為物所歸未審運智用心獨若何術常季不妄發此疑也仲尼曰死生亦大矣而不得與之變雖天地覆墜亦將不與之遺審乎無假而不與物遷命物之化而守其宗也人雖日變然死生之變變之大者也彼與變俱故死生不變於彼夫山舟潛遁薪指遷流雖復萬境皆然而死生最大但王駘心冥造物與變化而遷移跡混人間將死生而俱往故變所不能變者也斯順之也遺失也雖復圜天顛覆方地墜陷既冥於安危故未嘗喪我也雖天地覆芳服反墜本又作隊直類反李云天地猶不能變已況生死也明性命之固當慶藩案無假當是無瑕之誤謂審乎己之無可瑕疵斯任物自遷而無役於物也淮南精神篇正作審乎無瑕瑕假皆從假聲致易互誤鄭世家使人誘劫鄭大夫甫假左傳作傅瑕禮檀弓肩假漢書古今人表作公肩瑕即其證也任物之自遷靈心安審妙體真元既與道相應故不為物所遷變者也以化為命而無乖迕怪迕五故反本亦作遻下同不離至當之極達於分命冥於外物唯命唯物與化俱行動不乖寂故恆住其宗本者也不離力智反闕誤引江南古藏本宗下有者字常季曰何謂也方深難悟更請決疑仲尼曰自其異者視之肝膽楚越也自其同者視之萬物皆一也夫若然者且不知耳目之所宜而遊心乎德之和物視其所一而不見其所喪視喪其足猶遺土也恬苦之性殊則美惡之情背萬物云云悉歸空寂倒置之類妄執是非於重玄道中橫起分別何異乎肝膽附生本同一體也楚越迢遞相去數千而於一體之中起數千之遠異見之徒例皆如是也肝膽丁覽反美惡烏路反下皆同情背音佩雖所美不同而同有所美各美其所美則萬物一美也各是其所是則天下一是也夫因其所異而異之則天下莫不異而浩然大觀者官天地府萬物知異之不足異故因其所同而同之則天下莫不皆同又知同之不足有故因其所無而無之則是非美惡莫不皆無矣夫是我而非彼美己而惡人自中知以下至於昆蟲莫不皆然然此明乎我而不明乎彼者爾若夫玄通泯合之士因天下以明天下天下無曰我非也即明天下之無非無曰彼是也即明天下之無是無是無非混而為一故能乘變任化迕物而不慴若夫玄通之士浩然大觀二儀萬物一指一馬故能忘懷任物大順群生然同者見其同異者見其異至論眾妙之境非異亦非同也中知音智不慴之涉反宜生於不宜者也無美無惡則無不宜無不宜故忘其宜也耳目之宜宜於聲色者也且凡情分別耽滯聲色故有宜與不宜可與不可而王駘混同萬物冥一死生豈於根塵之間而懷美惡之見耶都忘宜故無不任也都任之而不得者未之有也無不得而不和者亦未聞也故放心於道德之閒蕩然無不當而曠然無不適也既而混同萬物不知耳目之宜故能遊道德之鄉放任乎至道之境者也體夫極數之妙心故能無物而不同無物而不同則死生變化無往而非我矣故生為我時死為我順時為我聚順為我散聚散雖異而我皆我之則生故我耳未始有得死亦我也未始有喪夫死生之變猶以為一既睹其一則蛻然無係玄同彼我以死生為寤寐以形骸為逆旅去生如脫屣斷足如遺土吾未見足以纓茀其心也物視猶視物也王駘一於死生均於彼我生為我時不見其得死為我順不見其喪視萬物混而一之故雖兀足視之如遺土者也所喪息浪反下及注同說然始銳反又音悅脫屨九具反本亦作屣所買反盧文弨曰今本書作屣斷足丁管反附字依劉文典補正本補世德堂本作亡下同世德堂本作擴世德堂本作說趙諫議本作悅常季曰彼為己以其知得其心以其心得其常心物何為最之哉嫌王駘未能忘知而自存彼王駘也謂王駘修善修己猶用心知嫌其未能忘知而任獨者也為己於偽反嫌未能遺心而自得嫌王駘不能忘懷任致猶用心以得心也夫得心者無思無慮忘知忘覺死灰槁木泊爾無情措之於方寸之間起之於視聽之表同二儀之覆載順三光以照燭混塵穢而不撓其神履窮塞而不忤其慮不得為得而得在於無得斯得之矣若以心知之術而得之者非真得也夫得其常心平往者也嫌其不得平往而與物遇故常使物就之最聚也若能虛忘平淡得真常之心者固當和光匿耀不殊於俗豈可獨異於物使眾歸之者也最之徂會反徐采會反下注同司馬云聚也家世父曰知者外發心者內存以其知得其心循外以葆中也心者不息之真機常心者無妄之本體以其心得其常心即體以證道也說文最犯而取也猶言物莫能犯之郭象斷句誤慶藩案說文積也從莫狄切取取亦聲徐鍇曰古以聚物之聚為世人多見最少見故書傳字皆作最仲尼曰人莫鑑於流水而鑑於止水唯止能止眾止受命於地唯松柏獨也在冬夏青青受命於天唯舜獨也正幸能正生以正眾生夫保始之徵不懼之實勇士一人雄入於九軍將求名而能自要者而猶若是而況官天地府萬物直寓六骸象耳目一知之所知而心未嘗死者乎彼且擇日而登假人則從是也彼且何肯以物為事乎夫止水之致鑑者非為止以求鑑也故王駘之聚眾眾自歸之豈引物使從己耶鑑照也夫止水所以留鑑者為其澄清故也王駘所以聚眾者為其凝寂故也止水本無情於鑑物物自照之王駘豈有意於招攜而眾自來歸湊者也鑑古暫反流水崔本作沬水云沬或作流慶藩案流水與止水相對為文崔本作沬非也隸書流或作見魯相史晨饗孔廟後碑與沬形相似故崔氏誤以為沬淮南說山篇人莫鑑於沬雨高注沬雨或作流潦則沬為流字之訛益碻動而為之則不能居眾物之止唯獨也唯止是水本凝湛能止是留停鑑人眾止是物來臨照亦猶王駘忘懷虛寂故能容止群生由是功能所以為眾歸聚也夫松柏特稟自然之鍾氣故能為眾木之傑耳非能為而得之也凡厥草木皆資厚地至於稟質堅勁隆冬不凋者在松柏通年四序常保青全受氣自爾非關指意王駘聚眾其義亦然也言特受自然之正氣者至希也下首則唯有松柏上首則唯有聖人故凡不正者皆來求正耳若物皆有青全則無貴於松柏人各自正則無羨於大聖而趣之人稟三才受命蒼昊圓首方足其類極多至如挺氣正真獨有虞舜豈由役意直置自然王駘合道其義亦爾郭注曰下首唯有松柏上首唯有聖人者但人頭在上去上則死木頭在下去下則死是以呼人為上首呼木為下首故上首食傍首傍首食下首下首草木也傍首蟲獸也幸自能正耳非為正以正之受氣上玄能正生道也非由用意幸率自然既能正己復能正物正己正物自利利他內外行圓名為大聖虞舜既爾王駘亦然而舜受讓人故為標的也非能遺名而無不任徵成也信也天子六軍諸侯三軍故九軍也或有一人稟氣勇武保守善始之心信成令終之節內懷不懼之志外顯勇猛之姿既而直入九軍以求名位尚能伏心要譽忘死忘生何況王駘體道之狀列在下文也保始之徵李云徵成也終始可保成也九軍崔云天子六軍諸侯三軍通為九軍也簡文云兵書以攻九天收九地故謂之九軍自要一遙反冥然無不體也綱維二儀曰官天地苞藏宇宙曰府萬物夫勇士入軍直要名位猶能不顧身命忘於生死而況官府兩儀混同萬物視死如生不亦宜乎所謂逆旅寓寄也六骸謂身首四肢也王駘體一身非實達萬有皆真故能混塵穢於俗中寄精神於形內直置暫遇而已豈係之耶六骸崔云手足首身也人用耳目亦用耳目非須耳目象似也和光同塵似用耳目非須也知與變化俱則無往而不冥此知之一者也心與死生順則無時而非生此心之未嘗死也一知智也所知境也能知之智照所知之境境智冥會能無所無差故知與不知通而為一雖復跡理物化而心未嘗見死者也豈容有全兀於其間哉以不失會為擇耳斯人無擇也任其天行而時動者也故假借之人由此而最之耳彼王駘者豈復簡擇良日而登昇玄道蓋不然乎直置虛淡忘懷而會之也至人無心止水留鑑而世閒虛假之人由是而從之也彼且如字徐子余反下同假人古雅反借也徐音遐讀連上句人字向下慶藩案登假即登格也假格古通用詩奏格或作奏假是其證爾雅格陟登升也既言登又曰格者古人自有複語耳楚辭離騷陟陞皇之赫戲兮陟亦陞也其恬漠故全也唯彼王駘冥真合道虛假之物自來歸之彼且何曾以為己務闕誤引張君房本也下有正字俞樾以下在字乃正之誤闕誤引張君房本此句作堯舜獨也正正下有在萬物之首五字唐寫本官作宮世德堂本無耶字趙諫議本鍾作種李字依世德堂本改申徒嘉兀者也而與鄭子產同師於伯昏無人子產謂申徒嘉曰我先出則子止子先出則我止其明日又與合堂同席而坐子產謂申徒嘉曰我先出則子止子先出則我止今我將出子可以止乎其未邪且子見執政而不違子齊執政乎姓申徒名嘉鄭之賢人兀者也姓公孫名僑字子產鄭之賢大夫也伯昏無人師者之嘉號也伯長也昏闇也德居物長韜光若闇洞忘物我故曰伯昏無人子產申徒俱學玄道雖復出處殊隔而同師伯昏故寄此三人以彰德充之義也申徒嘉李云申徒氏嘉名無人雜篇作瞀人羞與刖者並行子產執政當塗榮華富貴申徒稟形殘兀無復容儀子產雖學伯昏未能忘遣猶存寵辱恥見形殘故預相檢約令其必不並己也刖者音月又五刮反質而問之欲使必不並己子產存榮辱之意申徒忘貴賤之心前雖有言都不采領所以居則共堂坐還同席公孫見其如此故質而問之常以執政自多故直云子齊執政便謂足以明其不遜違避也夫出處異塗貴賤殊致我秉執朝政便為貴大汝乃卑賤形殘應殊敬我不能遜讓翻欲齊己也趙諫議本遜下有也字申徒嘉曰先生之門固有執政焉如此哉子而說子之執政而後人者也聞之曰鑑明則塵垢不止止則不明也久與賢人處則無過今子之所取大者先生也而猶出言若是不亦過乎此論德之處非計位也先生伯昏也先生道門深明眾妙混同榮辱齊一死生定以執政自多必如此耶之處昌慮反笑其矜說在位欲處物先汝猶悅愛榮華矜誇政事推人於後欲處物先意見如斯何名學道而說音悅注同事明師而鄙吝之心猶未去乃真過也鑑鏡也夫鏡明則塵垢不止止則非明照也亦猶久與賢人居則無過若有過則非賢哲今子之所取可重可大者先生之道也而先生之道退己虛忘子乃自矜深乖妙旨而出言如是豈非過乎子產曰子既若是矣猶與堯爭善計子之德不足以自反邪若是形殘言不自顧省而欲輕蔑在位與有德者並計子之德故不足以補形殘之過反猶復也言申徒形殘如是而不自知乃欲將我並驅可謂與堯爭善子雖有德何足在言以德補殘猶未平復也爭善如字闕誤引文成李張諸本不作申徒嘉曰自狀其過以不當亡者眾不狀其過以不當存者寡知不可柰何而安之若命唯有德者能之遊於羿之彀中中央者中地也然而不中者命也人以其全足笑吾不全足者多矣我怫然而怒而適先生之所則廢然而反不知先生之洗我以善邪吾與夫子遊十九年矣而未嘗知吾兀者也今子與我遊於形骸之內而子索我於形骸之外不亦過乎多自陳其過狀以己為不當亡者眾也默然知過自以為應死者少也夫自顯其狀推罪於他謂己無愆不合當亡如此之人世間甚多不顯過狀將罪歸己謂己之過不合存生如此之人世間寡少鄭子產奢侈矜伐於義亦然者也若順也夫素質形殘稟之天命雖有知計無如之何唯當安而順之則所造皆適自非盛德其孰能然知不可如字又音智羿古之善射者弓矢所及為彀中夫利害相攻則天下皆羿也自不遺身忘知與物同波者皆遊於羿之彀中耳雖張毅之出單豹之處猶未免於中地則中與不中唯在命耳而區區者各有所遇而不知命之自爾故免乎弓矢之害者自以為巧欣然多己及至不免則自恨其謬而志傷神辱斯未能達命之情者也夫我之生也非我之所生也則一生之內百年之中其坐起行止動靜趣舍情性知能凡所有者凡所無者凡所為者凡所遇者皆非我也理自爾耳而橫生休戚乎其中斯又逆自然而失者也羿堯時善射者也其矢所及謂之彀中言羿善射矢不虛發彀中之地必被殘傷無問鳥獸罕獲免者偶然得免乃關天命免與不免非由工拙自不遺形忘智皆遊於羿之彀中是知申徒兀足忽遭羿之一箭子產形全中地偶然獲免既非人事故不足自多矣羿音詣徐胡係反善射人唐夏有之一云有窮之君篡夏者也彀音遘張弓也家世父曰玉篇彀張弓弩漢書周亞夫傳彀弓弩待滿遊於羿之彀中觸處皆危機也而恢恢乎有中地以自處不中則上弦下弣中承箭筈反有激而傷者矣均之遊也中與不中偶值之數也不可柰何而安之則命也言亡足之非其罪中如字央於良反舊於倉反郭云弓矢所及為彀中中地丁仲反下不中注中地中與不中同單豹音善皆不知命而有斯笑矣見其不知命而怒斯又不知命也怫然暴戾之心也人不知天命妄計虧全況己形好嗤彼殘兀如此之人其流甚眾忿其無知怫然暴怒嗔忿他人斯又未知命也怫然扶弗反見至人之知命遺形故廢向者之怒而復常往伯昏之所稟不言之教則廢向者之怒而復於常性也不知先生洗我以善道故耶我為能自反耶斯自忘形而遺累矣既適師門入於虛室廢棄忿怒反覆尋常不知師以善水洗滌我心為是我之性情能自反覆進退尋責莫測所由斯又忘於學心遺其係累忘形故也我與伯昏遊於道德故能窮陰陽之妙要極至理之精微既其遺智忘形豈覺我之殘兀知吾介本又作兀兩通形骸外矣其德內也今子與我德遊耳非與我形交也而索我外好豈不過哉郭注云形骸外矣其德內也今子與我德遊耳非與我形交也而索我外豈不過哉此注意更不勞別釋也子索色百反注同世德堂本作眾闕誤引張君房本邪下有吾之自寤邪五字世德堂本無矣字趙諫議本知下有我字趙本無也字世德堂本無矣字世德堂本遺作遣無矣字能字依注文補今本書作兀好字依注文改子產蹴然改容更貌曰子無乃稱已悟則厭其多言也蹴然驚慚貌也子產未能忘懷遣欲多在物先既被譏嫌方懷驚悚改矜誇之貌更醜惡之容悟知已至不用稱說者也蹴子六反乃稱如字舉也又尺證反魯有兀者叔山無趾踵見仲尼仲尼曰子不謹前既犯患若是矣雖今來何及矣踵頻也叔山字也踵頻也殘兀之人居於魯國雖遭刖足猶有學心所以接踵頻來尋師訪道既無足趾因以為其名也叔山無趾音止李云叔山無足趾盧文弨曰字疑氏踵朱勇反向郭云頻也崔云無趾故踵行見賢遍反子之修身不能謹慎犯於憲前已遭官患難艱辛形殘若此今來請益何所逮耶子不謹前絕句一讀以謹字絕句字字依世德堂本及盧校改無趾曰吾唯不知務而輕用吾身吾是以亡足今吾來也猶有尊足者存吾是以務全之也夫天無不覆地無不載吾以夫子為天地安知夫子之猶若是也人之生也理自生矣直莫之為而任其自生斯重其身而知務者也若乃忘其自生謹而矜之斯輕用其身而不知務也故五藏相攻於內而手足殘傷於外也刖一足未足以虧其德明夫形骸者逆旅也去其矜謹任其自生斯務全也無趾交遊恭謹重德輕身唯欲務借聲名不知務全生道所以觸犯憲章遭斯殘兀形雖虧損其德猶存是故頻煩追討務全道德以德比形故言尊足者存存者在也去其羌呂反天不為覆故能常覆地不為載故能常載使天地而為覆載則有時而息矣使舟能沈而為人浮則有時而沒矣故物為焉則未足以終其生也不為於偽反下不為而為皆同責其不謹不及天地也夫天地亭毒覆載無偏而聖人德合二儀固當弘普不棄寧知夫子尚不捨形殘善救之心豈其如是也孔子曰丘則陋矣夫子胡不入乎請講以所聞仲尼所陳不過聖跡無趾請學務其全生答淺問深足成鄙陋也無趾出孔子曰弟子勉之夫無趾兀者也猶務學以復補前行之惡而況全德之人乎聞所聞而出全其無為也夫子無趾也胡何也仲尼自覺鄙陋情實多慚故屈無趾令其入室語說所聞方內之道既而廬久處芻狗再陳無趾惡聞故默然而出也全德者生便忘生勉勖勵也夫無趾殘兀尚實全生補其虧殘悔其前行況賢人君子形德兩全生便忘生德充於內者也門人之類宜勖之焉前行下孟反無趾語老聃曰孔丘之於至人其未邪彼何賓賓以學子為彼且蘄以諔詭幻怪之名聞不知至人之以是為己桎梏邪怪其方復學於老聃賓賓恭勤貌也夫玄德之人窮理極妙忘言絕學率性生知而仲尼執滯文字專行聖跡賓賓勤敬問禮老君以汝格量故知其未如至人也學子何為者也語老魚據反賓賓司馬云恭貌張云猶賢賢也崔云有所親疏也簡文云好名貌俞樾曰賓賓之義釋文所引皆望文生義未達古訓賓賓猶頻頻也漢書司馬相如傳仁頻并閭顏注曰頻字或作賓是其例也詩桑柔篇國步斯頻說文目部作國步斯矉書禹貢篇海濱廣斥漢書地理志作海瀕廣潟是皆賓聲頻聲相通之證廣雅釋訓頻頻比也楊子法言學行篇頻頻之黨甚於斯皆可說此賓賓之義夫無心者人學亦學然古之學者為己今之學者為人其弊也遂至乎為人之所為矣夫師人以自得者率其常然者也舍己效人而逐物於外者求乎非常之名者也夫非常之名乃常之所生故學者非為幻怪也幻怪之生必由於學禮者非為華藻也而華藻之興必由於禮斯必然之理至人之所無柰何故以為己之桎梏也蘄求也諔詭猶奇譎也在手曰桎在足曰梏即今之杻械也彼之仲尼行於聖跡所學奇譎怪異之事唯求虛妄幻化之名不知方外體道至人用此聲教為己枷鎖也且蘄音祈諔尺叔反詭九委反李云諔詭奇異也俞樾曰淑與詭語意不倫淑詭當讀為弔詭齊物論篇其名為弔詭正與此同弔作淑者古字通用哀十六年左傳昊天不弔周官大祝職先鄭注引作閔天不淑是其證矣慶藩案諔詭亦作俶詭見呂覽傷樂篇諔猶俶也薛綜注西京賦曰詭異也高誘注淮南本經篇曰詭文奇異之文也幻滑辯反亦作盧文弨曰舊本作案說文作從反予桎之實反郭真一反木在足也梏古毒反木在手也為己于偽反下者為人同舍己音捨闕誤引張君房本其作世德堂本有也字世德堂本無也字作字依諸子平議補老聃曰胡不直使彼以死生為一條以可不可為一貫者解其桎梏其可乎欲以直理冥之冀其無跡無趾前見仲尼談講之日何不使孔丘忘於仁義混同生死齊一是非條貫既融則是帝之縣解豈非釋其枷鎖解其杻械也一貫古亂反無趾曰天刑之安可解今仲尼非不冥也顧自然之理行則影從言則嚮隨夫順物則名跡斯立而順物者非為名也非為名則至矣而終不免乎名則孰能解之哉故名者影嚮也影嚮者形聲之桎梏也明斯理也則名跡可遺名跡可遺則尚彼可絕尚彼可絕則性命可全矣仲尼憲章文武祖述堯舜刪詩書定禮樂窮陳蔡圍商周執於仁義遭斯戮恥亦猶行則影從言則響隨自然之勢必至之宜也是以陳跡既興疵釁斯起欲不困弊其可得乎故天然刑戮不可解也嚮隨許丈反本又作向下同魯哀公問於仲尼曰衛有惡人焉曰哀駘它丈夫與之處者思而不能去也婦人見之請於父母曰與為人妻寧為夫子妾者十數而未止也未嘗有聞其唱者也常和人而已矣無君人之位以濟乎人之死無聚祿以望人之腹又以惡駭天下和而不唱知不出乎四域且而雌雄合乎前是必有異乎人者也寡人召而觀之果以惡駭天下與寡人處不至以月數而寡人有意乎其為人也不至乎期年而寡人信之國無宰寡人傳國焉悶然而後應氾而若辭寡人醜乎卒授之國無幾何也去寡人而行寡人卹焉若有亡也若無與樂是國也是何人者也惡醜也惡醜也言衛國有人形容醜陋內德充滿為物所歸而哀駘是醜貌因以為名惡人惡貌醜也哀駘音臺徐又音殆它徒何反李云哀駘醜貌它其名妻者齊也言其位齊於夫妾者接也適可接事君子哀駘才全德滿為物歸依大順群生物忘其醜遂使丈夫與之同處戀仰不能捨去婦人美其才德競請為其媵妾十數未止明其慕義者多不為人妻彰其道能感物也滅跡匿端謙居物後直置應和而已未嘗誘引先唱常和戶臥反下同明物不由權勢而往夫人君者必能赦過宥罪恤死護生駘它窮為匹夫位非南面無權無勢可以濟人明其懷人不由威力明非求食而往夫儲積倉廩招迎士眾歸湊本希飽腹而駘它既無聚祿何以致人明其慕義非由食往也李楨曰望人之望當讀如易月幾望之朢說文朢月滿也與望各字腹滿則飽猶月滿為朢故以擬之與逍遙游篇腹猶果然同一字法假望為朢不見其妙明不以形美故往駘它形容異常鄙陋論其醜惡驚駭天下明其聚眾非由色往惡駭胡楷反崔本作駴非招而致之譬幽谷之響直而無心既不以言說招攜非由先物而唱者也不役思於分外域分也忘心遣智率性任真未曾役思運懷緣於四方分外也役思息嗣反夫才全者與物無害故入獸不亂群入鳥不亂行而為萬物之林藪雌雄禽獸之類也夫才全之士與物同波人無害物之心物無畏人之慮故鳥與獸且群聚於前也雌雄合乎前李云禽獸屬也亂行戶剛反一無權勢二無利祿三無色貌四無言說五無知慮夫聚集人物必不徒然今駘它為眾歸依不由前之五事以此而驗固異於常人者也未經月已覺其有遠處既聞有異故命召看之形容醜陋果驚駭於天下共其同處不過二旬觀其為人察其意趣心神凝淡似覺深遠也委之以國政日月既久漬鍊彌深是以共處一年情相委信而國無良宰治道未弘庶屈賢人傳於國政者也期年音基傳國丈專反寵辱不足以驚其神悶然而後應不覺之容亦是虛淡之貌既無情於利祿豈有意於榮華故同彼世人悶然而應之也悶然音門李云不覺貌崔云有頃之閒也後應應對之應人辭亦辭氾若者是無的當不係之貌也雖無驚於寵辱亦乃同塵以遜讓故氾然常人辭亦辭也氾浮劍反不係也愧慚也卒終也幾何俄頃也卹憂也寡人是五等之謙稱也既見良人氾然虛淡中心愧醜戀慕殷勤終欲與之國政屈為卿輔俄頃之間逃遁而去喪失賢宰實懷憂卹情之恍惚若有遺亡雖君魯邦曾無歡樂來喜去憂感動如此何人何術一至於斯醜乎李云醜慚也崔云愧也無幾居豈反與樂音洛趙諫議本十數作數十世德堂本寡上有而字而字依趙本及疏文刪之字依正文補崔下疑脫作閒二字仲尼曰丘也嘗使於楚矣適見子食於其死母者少焉眴若皆棄之而走不見己焉爾不得類焉爾所愛其母者非愛其形也愛使其形者也戰而死者其人之葬也不以翣資刖者之屨無為愛之皆無其本矣為天子之諸御不爪翦不穿耳取妻者止於外不得復使形全猶足以為爾而況全德之人乎今哀駘它未言而信無功而親使人授己國唯恐其不受也是必才全而德不形者也食乳也嘗使於楚矣使音所吏反本亦作遊本又直云嘗於楚矣子本又作豚徒門反食於音飲邑錦反注同舊如字簡文同夫生者以才德為類死而才德去矣故生者以失類而走也故含德之厚者比於赤子無往而不為之赤子也則天下莫之害斯得類而明己故也情苟類焉則雖形不與同而物無害心情類苟亡雖則雖形同母子而不足以固其志矣哀公陳己心跡以問孔子孔子以豚子為譬以答哀公丘曾領門徒遊行楚地適見豚子飲其死母之乳眴目之頃少時之閒棄其死母皆散而走不見己類所以為然故郭注云生者以才德為類死而才德去矣故生者以失類而走也以況哀公素無才德非是己類棄捨而去駘它才德既全比於赤子物之親愛固是其宜矣眴若本亦作瞬音舜司馬云驚貌崔云目動也謂死母目動俞樾曰眴若猶眴然也徐無鬼篇眾狙見之恂然棄而走此云眴若彼云恂然文異義同眴恂並之假字說文兮部驚辭也從兮旬聲眴恂亦從旬聲故得通用釋文引司馬曰驚貌得之矣眴若皆棄之而走言子皆驚而走也蓋始焉不知其為死母就之而食少焉覺其死故皆驚走也眴若二字以其子言不以其母言釋文又引崔云目動也謂死母目動然則其母不死與下意不合矣下文不見己焉爾不得類焉爾郭注曰夫生者以才德為類死而才德去矣故生者以失類而走也若從崔說死母之目尚動是其才德未去何為以失類而走乎使形者才德也郭注曰使形者才德也而才德者精神也豚子愛母愛其精神人慕駘它慕其才德者也翣者武所資也戰而死者無武也翣將安施翣資所甲反扇也武王所造宋均云武飾也李云資送也崔本作翣杴音坎謂先人墳墓也盧文弨曰李下舊無云字案當有今增所愛屨者為足故耳為足于偽反翣屨者以足武為本翣者武飾之具武王為之或云周公作也其形似方扇車兩邊軍將行師陷陣而死及其葬日不用翣資是知翣者武之所資屨者足之所使用形者神之所使無足則屨無所用無武則翣無所資無神則形無所然翣屨以足武為本形貌以才德為原二者無本故並無用也全其形也恐傷其形夫帝王宮闈揀擇御女穿耳翦爪恐傷其形匹夫取妻停於外務使役驅馳慮虧其色此重舉譬以況全才也不得復使扶又反章末注同崔本作不得復使云不復入直也家世父曰不爪翦不穿耳謂不加修飾而後本質見止於外不復使謂不交涉他事而後精神專一郭象以為恐傷其形誤也採擇嬪御及燕爾新昏本以形好為意者也故形之全也猶以降至尊之情回貞女之操也形好呼報反德全而物愛之宜矣爾然也夫形之全具尚能降真人感貞女而況德全乎此合譬也故郭注云德全而物愛之宜矣哉夫親由績彰信藉言顯今駘它未至言說而已遭委信本無功績而付託實親遂使魯侯虛襟授其朝政卑己遜讓唯恐不受如是之人必當才智全具而推功於物故德不形見之也趙諫議本無而字者字依世德堂本刪則雖依世德堂本互易比字依注文補入字依釋文原本改趙本猶作無哀公曰何謂才全前雖標舉於義未彰故發此疑庶希後答仲尼曰死生存亡窮達貧富賢與不肖毀譽飢渴寒暑是事之變命之行也日夜相代乎前而知不能規乎其始者也故不足以滑和不可入於靈府使之和豫通而不失於兌使日夜無郤而與物為春是接而生時於心者也是之謂才全其理固當不可逃也故人之生也非誤生也生之所有非妄有也天地雖大萬物雖多然吾之所遇適在於是則雖天地神明國家聖賢絕力至知而弗能違也故凡所不遇弗能遇也其所遇弗能不遇也凡所不為弗能為也其所為弗能不為也故付之而自當矣夫二儀雖大萬物雖多人生所遇適在於是故前之八對並是事物之變化天命之流行而留之不停推之不去安排任化所遇適自非德充之士其孰能然此則仲尼答哀公才全之義毀譽音餘夫命行事變不舍晝夜推之不去留之不停故才全者隨所遇而任之不舍音捨夫始非知之所規而故非情之所留是以知命之必行事之必變者豈於終規始在新戀故哉雖有至知而弗能規也逝者之往吾柰之何哉夫命行事變其速如馳代謝遷流不舍晝夜一前一後反覆循環雖有至知不能測度豈復在新戀故在終規始哉蓋不然也唯當隨變任化則無往而不逍遙也苟知性命之固當則雖死生窮達千變萬化淡然自若而和理在身矣滑亂也雖復事變命遷而隨形任化淡然自若不亂於中和之道也以滑音骨淡然徒蹔反靈府者精神之宅也夫至足者不以憂患經神若皮外而過去靈府者精神之宅所謂心也經寒涉暑涉治亂千變萬化與物俱往未當概意豈復關心耶苟使和性不滑靈府閒豫則雖涉乎至變不失其兌然也兌遍悅也體窮通達生死遂使所遇和樂中心逸豫經涉夷險兌然自得不失其適悅也於兌徒外反李云悅也閒豫音閑泯然常任之郤閒也駘它流轉日夜不停心心相係亦無閒斷也無郤去逆反李云閒也群生之所賴也慈照有生恩霑動植與物仁惠事等青春順四時而俱化是者指斥以前事也才全之人接濟群品生長萬物應赴順時無心之心逗機而照者也是接而生時乎心者也司馬云接至道而和氣在心也李云接萬物而施生順四時而俱作盧文弨曰今本書乎作於總結以前是才全之義也敦煌本郤作陳凡字依世德堂本補斯字依劉文典補正本改何謂德不形已領才全未悟德不形義更相發問庶聞後旨也曰平者水停之盛也其可以為法也內保之而外不蕩也德者成和之脩也德不形者物不能離也天下之平莫盛於停水也停止也而天下均平莫盛於止水故上文云人莫鑒於流水而必鑒於止水此舉為譬以彰德不形義故也無情至平故天下取正焉內保其明外無情偽玄鑒洞照與物無私故能全其平而行其法也夫水性澄清鑒照於物大匠雖巧非水不平故能保守其明而不波蕩者可以軌工人洞鑒妍醜也故下文云水平中準大匠取則焉況至人冥真合道和光物模楷蒼生動而常寂故云內保之而外不蕩者也情為于偽反慶藩案情為即情偽也古為偽二字通用史記小司馬本五帝紀平秩南為漢書王莽傳作南偽禮月令作為淫巧鄭注曰今月令作為作詐偽左定公十二年傳子偽不知釋文偽一作為荀子性惡篇可學而能可事而成之在人者謂之偽偽即為也皆其證事得以成物得以和謂之德也夫成於庶事和於萬物者非盛德孰能之哉必也先須修身立行後始可成事和物以和而我不喪者方可以謂之德也無事不成無物不和此德之不形也是以天下樂推而不厭夫明齊日月而歸明於昧功侔造化而歸功於物者德之不形也是以含德之厚比於赤子天下樂推而不厭斯物不離之者也能離力智反利字依應帝王篇名實不入句下疏文改後同此字依注文改哀公異日以告閔子曰始也吾以南面而君天下執民之紀而憂其死吾自以為至通矣今吾聞至人之言恐吾無其實輕用吾身而亡其國吾與孔丘非君臣也德友而已矣聞德充之風者雖復哀公猶欲遺形骸忘貴賤也姓閔名損字子騫宣尼門人在四科之數甚有孝德魯人也異日猶它日也南面君位也初始未悟矜於魯君執持綱紀憂於兆庶養育教誨恐其夭死用斯治術為至美至通今聞尼父言談且陳才德之義魯侯悟解方覺前非至通憂死之言更成虛幻執紀南面之大都無實錄於是隳肢體黜聰明遺尊卑忘爵位觀魯邦若蝸角視己形如隙影友仲尼以全道德禮司寇以異君臣故知莊老之談其風清遠德充之美一至於斯閔子孔子弟子閔子騫也闉跂支離無脤說衛靈公靈公說之而視全人其脰肩肩甕上央下瓦犬癭說齊桓公桓公說之而視全人其脰肩肩故德有所長而形有所忘人不忘其所忘而忘其所不忘此謂誠忘故聖人有所遊而知為孽約為膠德為接工為商聖人不謀惡用知不斲惡用膠無喪惡用德不貨惡用商四者天鬻也天鬻者天食也既受食於天又惡用人有人之形無人之情有人之形故群於人無人之情故是非不得於身眇乎小哉所以屬於人也謷乎大哉獨成其天偏情一往則醜者更好而好者更醜也闉曲也謂攣曲企腫而行脤脣也謂支體坼裂傴僂殘病復無脣也上央下瓦盆也脰頸也肩肩細小貌也而支離殘病企腫而行瘤癭之病大如盆甕此二人者窮天地之陋而俱能忘形建德體道談玄遂使齊衛兩君欽風愛悅美其盛德不覺病醜顧視全人之頸翻小而自肩肩者闉音因郭烏年反跂音企郭其逆反支離無脤徐市軫反又音脣司馬云闉曲跂企也闉跂支離言腳常曲行體不正卷縮也無脤名也崔云闉跂偃者也支離傴者也脤脣同簡文云跂行也脤臀也慶藩案慧琳一切經音義一百肇論卷上引司馬云跂望也釋文闕說衛始銳反又如字下說齊桓同說之音悅下說之同脰音豆頸也肩肩胡咽反又胡恩反李云羸小貌崔云猶玄玄也簡文云直貌李楨曰攷工梓人文數目顅脰注云顅長脰貌與肩肩義合知肩是省借本字當作顅並可据鄭注補釋文一義甕烏送反郭於寵反上央下瓦烏葬反郭於兩反李云甕上央下瓦大癭貌崔同大癭一領反說文云瘤也其德長於順物則物忘其醜長於逆物則物忘其好大癭支離道德長遠遂使齊侯衛主忘其形惡生則愛之死則棄之故德者世之所不忘也形者理之所不存也故夫忘形者非忘也不忘形而忘德者乃誠忘也誠實也所忘形也不忘德也忘形易而忘德難也故謂形為所忘德為不忘也不忘形而忘德者此乃真實斯德不形之義也遊於自得之場放之而無不至者才德全也物我雙遣形德兩忘故放任乎變化之場遨遊於至虛之域也此四者自然相生其理已具夫至人道邁三清而神遊六合故蘊智以救殃孽約束以檢散心樹德以接蒼生工巧以利群品此之四事凡類有之大聖慈救同塵順物也而知音智下同為孽魚列反司馬云智慧生妖孽約為膠司馬云約束而後有如膠漆崔云約誓所以為膠固德為接司馬云散德以接物也工為商司馬云工巧而商賈起自然已具故聖人無所用其己也惡何也至人不殃孽謀謨何用智惠不散亂彫斲何用膠固本不喪道用德何為不貴難得之貨無勞商賈衹為和光物是故有之者也惡用音烏下同不斲陟角反無喪息浪反言自然而稟之鬻食也食稟也天自然也以前四事蒼生有之稟自天然各率其性聖人順之故無所用己也天鬻音育養也天食音嗣亦如字既稟之自然其理已足則雖沈思以免難或明戒以避禍物無妄然皆天地之會至理所趣必自思之非我思也必自不思非我不思也或思而免之或思而不免或不思而免之或不思而不免凡此皆非我也又奚為哉任之而自至也稟之自然各有定分何須分外添足人情違天任人故至悔者也受食如字又音嗣沈思息嗣反亦如字免難乃旦反視其形貌若人掘若槁木之枝聖人同塵在世有生處之形容體道虛忘無是非之情慮掘若其勿反槁木苦老反類聚群分自然之道和光混跡群聚世間此解有人之形群分如字無情故付之於物也譬彼靈真絕無性識既忘物我何有是非此解無人之情故也形貌若人屬係也跡閔嚚俗形係人群與物不殊故稱眇小也此結有人之形耳眇亡小反簡文云陋也慶藩案慧琳一切經音義九十八廣弘明集音卷十五引司馬云眇高視也釋文闕無情故浩然無不任無不任者有情之所未能也故無情而獨成天也謷高大貌也謷然大教萬境都忘智德高深凝照弘遠故歎美大人獨成自然之至此結無人之情也謷乎五羔反徐五報反簡文云放也今取遨遊義也獨成其天如字崔本天字作大云類同於人所以為小情合於天所以為大趙諫議本作性忘字依正文改趙本獨作及惠子謂莊子曰人故無情乎前文云有人之形無人之情惠施引此語來質疑莊子所言人者必固無情慮乎然莊惠二賢並遊心方外故常稟而為論端莊子曰然然如是也許其所問故答云然惠子曰人而無情何以謂之人若無情智何名為人此是惠施進責之辭問於莊子人之生也非情之所生也生之所知豈情之所知哉故有情於為離曠而弗能也然離曠以無情而聰明矣有情於為賢聖而弗能也然賢聖以無情而賢聖矣豈直賢聖絕遠而離曠難慕哉雖下愚聾瞽及雞鳴狗吠豈有情於為之亦終不能也不問遠之與近雖去己一分顏孔之際終莫之得也是以關之萬物反取諸身耳目不能以易任成功手足不能以代司致業故嬰兒之始生也不以目求乳不以耳向明不以足操物不以手求行豈百骸無定司形貌無素主而專由情以制之哉惡何也虛通之道為之相貌自然之理遺其形質形貌具有何得不謂之人且形之將貌蓋亦不殊道與自然互其文耳欲顯明斯義故重言之也惡得音烏下惡得同吠扶廢反一分如字足操七刀反惠子曰既謂之人惡得無情未解形貌之非情也既名為人理懷情慮若無情識何得謂之人此是惠施未解形貌之非情未解音蟹莊子曰是非吾所謂情也吾所謂無情者言人之不以好惡內傷其身常因自然而不益生也以是非為情則無是無非無好無惡者雖有形貌直是人耳情將安寄吾所言情者是非彼我好惡憎嫌等也若無是無非雖有形貌直是人耳情將安寄任當而直前者非情也莊子所謂無情者非木石其懷也止言不以好惡緣慮分外遂成性而內理其身者也何則蘊虛照之智無情之情也止於當也因任自然之理以此為常止於所稟之涯不知生分惠子曰不益生何以有其身未明生之自生理之自足若不資益生道何得有此身乎未解生之自生理之自足者也莊子曰道與之貌天與之形無以好惡內傷其身今子外乎子之神勞乎子之精倚樹而吟據槁梧而瞑天選子之形子以堅白鳴生理已自足於形貌之中但任之則身存道與形貌生理已足但當任之無勞措意也夫好惡之情非所以益生祇足以傷身以其生之有分也還將益以酬後問也無以好惡呼報反下烏路反注同祇足音支夫神不休於性分之內則外矣精不止於自生之極則勞矣故行則倚樹而吟坐則據梧而睡言有情者之自困也槁梧夾膝几也惠子未遺筌蹄耽內名理疏外神識勞苦精靈故行則倚樹而吟詠坐則隱几而談說是以形勞心倦疲怠而瞑者也倚樹於綺反據槁苦老反梧音吾而瞑音眠崔云據琴而睡也而睡垂臂反言凡子所為外神勞精倚樹據梧且吟且睡此世之所謂情也而云天選明夫情者非情之所生而況他哉故雖萬物萬形云為趣舍皆在無情中來又何用情於其閒哉選授也鳴言說也自然之道授與汝形夭壽妍醜其理已定無勞措意分外益生而子稟性聰明辨析理執持己德炫燿眾人亦何異乎公孫龍作白馬論云白馬非馬堅守斯論以此自多信有其言而無其實能伏眾人之口不能伏眾人之心今子分外誇談即是斯之類也天選宣轉反舊思緩反趙諫議本情作此名字依劉文典說改
