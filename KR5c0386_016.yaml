body:
  text: 外篇天道第十三以義名篇天道運而無所積故萬物成帝道運而無所積故天下歸聖道運而無所積故海內服明於天通於聖六通四辟於帝王之德者其自為也昧然無不靜者矣聖人之靜也非曰靜也善故靜也萬物無足以鐃心者故靜也水靜則明燭鬚眉平中準大匠取法焉水靜猶明而況精神聖人之心靜乎天地之鑑也萬物之鏡也夫虛靜恬淡寂漠無為者天地之平而道德之至故帝王聖人休焉休則虛虛則實實者倫矣虛則靜靜則動動則得矣靜則無為無為也則任事者責矣無為則俞俞俞俞者憂患不能處年壽長矣夫虛靜恬淡寂漠無為者萬物之本也明此以南鄉堯之為君也明此以北面舜之為臣也以此處上帝王天子之德也以此處下玄聖素王之道也以此退居而閒游江海山林之士服以此進為而撫世則功大名顯而天下一也靜而聖動而王無為也而尊朴素而天下莫能與之爭美夫明白於天地之德者此之謂大本大宗與天和者也所以均調天下與人和者也與人和者謂之人樂與天和者謂之天樂運動也轉也積滯也蓄也言天道運轉覆育蒼生照之以日月潤之以雨露鼓動陶鑄曾無滯積是以四序回轉萬物生成也無所積積謂滯積不通天者法天象地運御群品散而不積施化無方所以六合同歸八方款附此三者皆恣物之性而無所牽滯也聖道者玄聖素王之道也隨應垂跡制法立教舟航有識拯濟無窮道合於天德同於帝出處不一故有帝聖二道也而運智救時亦無滯蓄慈造弘博故海內服也任其自為故雖六通四辟而無傷於靜也六通謂四方上下也四辟者謂春秋冬夏也夫唯照天道之無為洞聖情之絶慮通六合以生化順四序以施為以此而總萬乘可謂帝王之德也任物自動故曰自為晦跡韜光其猶昧暗動不傷寂故無不靜也六通謂六氣陰陽風雨晦明四辟毗赤反謂四方開也音妹盧文弨曰今本作昧善之乃靜則有時而動也夫聖人所以虛靜者直形同槁木心若死灰亦不知靜之故靜也若以靜為善美而有情於為靜者斯則有時而動矣斯乃自得也妙體二儀非有萬境皆空是以參變同塵而無喧撓非由飭勵而得靜也鐃心乃孝反又女交反一音而小反夫水動則波流止便澄靜懸鑒洞照與物無私故能明燭鬚眉清而中正治諸邪枉可為準的縱使工倕之巧猶須倣水取平故老經云上善若水此舉喻言之義中準丁仲反盧文弨曰今本作准大匠或云天子也夫有其具而任其自為故所照無不洞明夫聖人德合二儀智周萬物豈與夫無情之水同日論邪水靜猶明燭鬚眉況精神聖人之心靜乎是以鑒天地之精微鏡萬物之玄賾者固其宜矣此合譬也凡不平不至者生於有為虛靜恬淡寂漠無為四者異名同實者也歎無為之美故具此四名而天地以此為平道德用茲為至也淡徒暫反慶藩案至與質同至實也禮雜記使某實鄭注實當為至史記蘇秦傳趙得講於魏至公子延索隱曰至當為質漢書東方朔傳非至數也師古曰至實也刻意篇正作道德之質未嘗動也息慮故平至也倫理也既休慮息心乃與虛空合德與虛空合德則會於真實之道真實之道則自然之理也不失其所以動理虛靜寂寂而能動斯得之矣夫無為也則群才萬品各任其事而自當其責矣故曰巍巍乎舜禹之有天下而不與焉此之謂也任事臣也言臣下各有任職之事也夫帝王任智安靜無為則臣下職任各司憂責斯則主上無為而臣下有事故冕旒垂目而不與焉巍巍魚歸反不與音預俞俞然從容自得之貌俞俞從容和樂之貌也夫有為滯境塵纍所以攖其心無為自得憂患不能處其慮俞俞和樂故年壽長矣俞俞羊朱反廣雅云喜也又音喻從容七容反尋其本皆在不為中來此四句萬物根源故重舉前言結成其美義也夫揖讓之美無出唐虞君臣之盛莫先堯舜故舉二君以明四德雖南面北面而平至一焉南鄉許亮反本亦作嚮此皆無為之至也有其道為天下所歸而無其爵者所謂素王自貴也用此無為而處物上者天子帝堯之德也用此虛淡而居臣下者玄聖素王之道也夫有其道而無其爵者所謂玄聖素王自貴者也即老君尼父是也素王往況反注同退居謂晦跡隱處也用此道而退居故能游玩山水從容閒樂是以天下隱士無不服從即巢許之流是也而閒音間此又其次也故退則巢許之流進則伊望之倫也夫無為之體大矣天下何所不無為哉故主上不為冢宰之任則伊呂靜而司尹矣冢宰不為百官之所執則百官靜而御事矣百官不為萬民之所務則萬民靜而安其業矣萬民不易彼我之所能則天下之彼我靜而自得矣故自天子以下至於庶人下及昆蟲孰能有為而成哉是故彌無為而彌尊也進為謂顯跡出仕也夫妙體無為而同塵降跡者故能撫蒼生於仁壽弘至德於聖朝著莫測之功名顯阿衡之政績是以天下大同車書共軌盡善盡美其唯伊望之倫乎時行則行時止則止自然為物所尊奉其應靜也玄聖素王之尊其應動也九五萬乘之貴無為也而尊出則天子處則素王是知道之所在孰敢不貴也夫美配天者唯朴素也夫淳朴素質無為虛靜者實萬物之根本也故所尊貴孰能與之爭美也天地以無為為德故明其宗本則與天地無逆也夫靈府明靜神照潔白而德合於二儀者固可以宗匠蒼生根本萬有冥合自然之道與天和也夫順天所以應人也故天和至而人和盡也均平也調順也且應感無心方之影響均平萬有大順物情而混跡同塵故與人和也天樂適則人樂足矣俯同塵俗且適人世之歡仰合自然方欣天道之樂也人樂音洛下同闕誤引張君房本自下有然字闕誤引張君房本至下有也字闕誤引張君房本倫作備世德堂本作准本書依釋文改無字依世德堂本刪莊子曰吾師乎吾師乎萬物而不為戾澤及萬世而不為仁長於上古而不為壽覆載天地刻雕衆形而不為巧此之謂天樂故曰知天樂者其生也天行其死也物化靜而與陰同德動而與陽同波故知天樂者無天怨無人非無物纍無鬼責故曰其動也天其靜也地一心定而王天下其鬼不祟其魂不疲一心定而萬服物言以虛靜推於天地通於萬物此之謂天樂天樂者聖人之心以畜天下也變而相雜故曰自耳非吾師之暴戾碎也戾暴也莊子以自然至道為師再稱之者歎美其德言我所師大道亭毒生靈假令萬物亦無心暴怒故素秋搖落而雕零者不怨此明雖復斷裁而非義也子兮反為戾力計反暴也仁者兼愛之名耳無愛故無所稱仁仁者偏愛之跡也言大道開闔天地造化蒼生慈澤無窮而不偏愛故不為仁壽者期之遠耳無期故無所稱壽豈但長於上古抑乃象帝之先既其不滅不生復有何夭何壽也郭注云壽者期之遠耳長於丁丈反章末同巧者為之妙耳皆自爾故無所稱巧乘二儀以覆載取萬物以刻雕而二儀以生化為巧萬物以自然為用生化既不假物雕刻豈假他人是以物各任能人皆率性則工拙之名於斯滅矣郭注云巧者為之妙耳忘樂而樂足所在任適結成天樂天樂音洛章內同既知天樂非哀樂即知生死無生死故其生也同天道之四時其死也混萬物之變化也妙本虛凝將至陰均其寂泊應跡同世與太陽合其波流德合於天故無天怨行順於世故無人非我冥於物故物不纍我我不負幽顯有何鬼責也動靜雖殊無心一也天地以結動靜無心之義也常無心故王天下而不疲病境智冥合謂之為一物不能撓謂之為定祇為定於一心故能王於萬國既無鬼責有何禍祟動而常寂故魂不疲勞而王往況反注及下王天同祟雖遂反徐息類反李云禍也一心凝者類死灰而靜為躁君故萬物歸服我心常靜則萬物之心通矣通則服不通則叛所以一心定而萬物服者祇言用虛靜之智推尋二儀之理通達萬物之情隨物變轉而未嘗不適故謂之天樂也聖人之心所以畜天下者奚為哉天樂而已夫聖人之所以降跡同凡合天地之至樂者方欲畜養蒼生亭毒群品也畜天許六反注同夫帝王之德以天地為宗以道德為主以無為為常無為也則用天下而有餘有為也則為天下用而不足故古之人貴夫無為也上無為也下亦無為也是下與上同德下與上同德則不臣下有為也上亦有為也是上與下同道上與下同道則不主上必無為而用天下下必有為為天下用此不易之道也故古之王天下者知雖落天地不自慮也辨雖雕萬物不自說也能雖窮海內不自為也天不産而萬物化地不長而萬物育帝王無為而天下功故曰莫神於天莫富於地莫大於帝王故曰帝王之德配天地此乘天地馳萬物而用人群之道也王者宗本於天地故覆載無心君主於道德故生而不有雖復千變萬化而常自無為盛德如此堯之為君也有餘者閒暇之謂也不足者汲汲然欲為物用也欲為物用故可得而臣也及其為臣亦有餘也不足者汲汲之辭有餘者閒暇之謂言君上無為智照寬曠御用區宇而閒暇有餘臣下有為情慮狹劣各有職司為君所用匪懈在公猶恐不足是知無為有事勞逸殊塗夫工人無為於刻木而有為於用斧主上無為於親事而有為於用臣臣能親事主能用臣斧能刻木而工能用斧各當其能則天理自然非有為也若乃主代臣事則非主矣臣秉主用則非臣矣故各司其任則上下咸得而無為之理至矣無為者君德也有為者臣道也若上下無為則臣僭君德上下有為則君濫臣道君濫臣道則非主矣臣僭君德豈曰臣哉於是上下相混君臣冒亂既乖天然必招危禍故無為之言不可不察無為君也古之人貴夫無為郭注此文甚有辭理無為之言不可不察也夫用天下者亦有用之為耳然自得此為率性而動故謂之無為也今之為天下用者亦自得耳但居下者親事故雖舜禹為臣猶稱有為故對上下則君靜而臣動比古今則堯舜無為而湯武有事然各用其性而天機玄發則古今上下無為誰有為也夫處上為君則必須無為任物用天下之才能居下為臣亦當親事有為稱所司之職任則天下化矣斯乃百王不易之道謂三皇五帝淳古之君也知照明達籠落二儀而垂拱無為委之臣下知者為謀故不自慮也知雖音智下愚知同弘辨如流雕飾萬物而付之司牧終不自言也自說音悅夫在上者患於不能無為而代人臣之所司使咎繇不得行其明斷后稷不得施其播殖則群才失其任而主上困於役矣故冕旒垂目而付之天下天下皆得其自為斯乃無為而無不為者也故上下皆無為矣但上之無為則用下下之無為則自用也藝術才能冠乎海內任之良佐而不與焉夫何為焉哉玄默而已故老經云是謂用人之力咎音羔繇音遙明斷丁亂反所謂自爾天無情於生産而萬物化生地無心於長成而萬物成育故郭注云所謂自然也功自彼成王者同兩儀之含育順四序以施生任萬物之自為故天下之功成矣王念孫曰案如郭解則功下須加成字而其義始明不知功即成也言無為而天下成也中庸曰無為而成爾雅曰功成也大戴禮盛德篇曰能成德法者為有功周官稿人乃入功於司弓矢及繕人鄭注曰功成也管子五輔篇曰大夫任官辨事官長任事守職士修身功材功材謂成材也荀子富國篇曰百姓之力待之而後功謂待之而後成也萬物化萬物育天下功相對為文是功為成也夫日月明晦雲雷風雨而蔭覆不測故莫神於天囊括川原包容嶽瀆運載無窮故莫富於地位居九五威跨萬乘日月照臨一人總統功德之大莫先王者故老經云域中四大王居其一焉同乎天地之無為也配合也言聖人之德合天地之無為達覆載之無主是以乘馭兩儀循變化之往來故能驅馳萬物任黔黎之才用人群之道也世德堂本無此字道藏本無而字本在於上末在於下要在於主詳在於臣三軍五兵之運德之末也賞罰利害五刑之辟教之末也禮法度數形名比詳治之末也鐘鼓之音羽旄之容樂之末也哭泣衰絰隆殺之服哀之末也此五末者須精神之運心術之動然後從之者也本道德也末仁義也言道德淳朴治之根本行於上古仁義澆薄治之末葉行於下代故云本在於上末在於下也本在於上末在於下李云本天道末人道也要簡省也詳繁多也主道逸而簡要臣道勞而繁冗繁冗故有為而奉上簡要故無為而御下也五兵者一弓二殳三矛四戈五戟也運動也夫聖明之世則偃武修文逮德下衰則偃文修武偃文修武則五兵動亂偃武修文則四民安業德之本末自此可知也賞者軒冕榮華故利也罰者誅殘戮辱故害也辟法也五刑者一劓二墨三刖四宮五大辟夫道喪德衰浮僞日甚故設刑辟以被黎元既虧理本適為教末也之辟毗赤反禮法者五禮之法也數者計算度者丈尺形者容儀名者字諱比者校當詳者定審用此等法以養蒼生治乖淳古故為治末也比詳毗志反下同一音如字云比較詳審治之直吏反下治之至注至治之道同樂者和也羽者鳥羽旄者獸毛言采鳥獸之羽毛以飾其器也夫帝王之所以作樂者欲上調陰陽下和時俗也古人聞樂即知國之興亡治世亂世其音各異是知大樂與天地同和非羽毛鐘鼓者也自三代以下澆浪荐興賞鄭衛之淫聲棄雲韶之雅韻遂使羽毛文采盛飾容儀既非咸池之本適是濮水之末絰者實也衰摧也上曰下曰裳在首在腰二俱有絰隆殺者言禮有斬衰齊衰大功小功緦麻五等哭泣衣裳各有差降此是教跡外儀非情發於衷故哀之末也衰音崔絰田結反隆殺所界反夫精神心術者五末之本也任自然而運動則五事之末不振而自舉也術能也心之所能謂之心術也精神心術者五末之本也言此之五末必須精神心智率性而動然後從於五事即非矜矯者也末學者古人有之而非所以先也君先而臣從父先而子從兄先而弟從長先而少從男先而女從夫先而婦從夫尊卑先後天地之行也故聖人取象焉天尊地卑神明之位也春夏先秋冬後四時之序也萬物化作萌區有狀盛衰之殺變化之流也夫天地至神而有尊卑先後之序而況人道乎宗廟尚親朝廷尚尊鄉黨尚齒行事尚賢大道之序也語道而非其序者非其道也語道而非其道者安取道所以先者本也古之人謂中古人也先本也五末之學中古有之事涉澆僞終非根本也夫尊卑先後天地之行也長先而少詩照反言此先後雖是人事然皆在至理中來非聖人之所作也天地之行者謂春夏先秋冬後四時行也夫天地雖大尚有尊卑況在人倫而無先後是以聖人象二儀之造化觀四序之自然故能篤君臣之大義正父子之要道也天尊地卑不刊之位也春夏先秋冬後次序乎舉此二條足明萬物夫萬物變化未始暫停或起或伏乍生乍死千族萬種色類不同而萌兆區分各有形狀萌區曲俱反夫春夏盛長秋冬衰殺或變生作死或化故成新物理自然非關措意故隨流任物而所造皆適明夫尊卑先後之序固有物之所不能無也二儀生育有不測之功萬物之中最為神化尚有尊卑先後況人倫之道乎言非但人倫所尚也宗廟事重必據昭穆以嫡相承故尚親也朝廷以官爵為尊卑鄉黨以年齒為次第行事擇賢能用之此理之必然故云大道之序朝廷直遙反議論道理而不知次第者雖有語言終非道語既失其序不堪治物也所以取道為其有序也既不識次第雖語非道於何取道而行理之邪闕誤引張君房本神下有也字闕誤引文如海本道下有哉字趙諫議本無言字趙本無至字其字也字依宋本及道藏本補世德堂本作為有序也無其字是故古之明大道者先明天而道德次之道德已明而仁義次之仁義已明而分守次之分守已明而形名次之形名已明而因任次之因任已明而原省次之原省已明而是非次之是非已明而賞罰次之賞罰已明而愚知處宜貴賤履位仁賢不肖襲情必分其能必由其名以此事上以此畜下以此治物以此修身知謀不用必歸其天此之謂大平治之至也天者自然也自然既明則物得其道也此重開大道次序之義言古之明開大道之人先明自然之理為自然是道德之本故道德次之物得其道而和理自適也先德後仁先仁後義故仁義次之理適而不失其分也既行兼愛之仁又明裁非之義次令各守其分不相爭奪也得分而物物之名各當其形也形身也各守其分不相傾奪次勸修身致其名譽也無所復改雖復勸令修身以致名譽而皆須因其素分任其天然不可矯性僞情以要令聞也物各自任則罪責除也原者恕免省者除廢雖復因任其本性而不無其僭過故宜布之愷澤宥免其辜也原省所景反原除省廢也各以得性為是失性為非雖復赦過宥罪而人心漸薄次須示其是非以為鑒誡也賞罰者失得之報也夫至治之道本在於天而末極於斯是非既明臧否斯見故賞善罰惡以勗黎元也官各當其才也用此賞罰以次前序而為治方者智之明暗安處各得其宜才之高下貴賤咸履其位也各自行其所能之情仁賢智也不肖愚也襲用也主上聖明化導得所雖復賢愚各異而咸用本情終不舍己效人矜夸炫物也無相易業夫性性不同物物各異藝能固別才用必分使之如器無不調適也必分方云反名當其實故由名而實不濫也夫名以召實而實故名若使實不名則名過其實今明名實相稱故云必由其名也以用也言用以前九法可以為臣事上為君畜下外以治物內以修身也至默無為委之群下塞聰閉智歸之自然可謂太平之君至治之美也知謀音智大平音泰世德堂本官作言當由二字依注文互易故書曰有形有名形名者古人有之而非所以先也古之語大道者五變而形名可舉九變而賞罰可言也驟而語形名不知其本也驟而語賞罰不知其始也倒道而言忤道而說者人之所治也安能治人驟而語形名賞罰此有知治之具非知治之道可用於天下不足以用天下此之謂辨士一曲之人也禮法數度形名比詳古人有之此下之所以事上非上之所以畜下也先本也言形名等法蓋聖人之應跡耳不得已而用之非所以跡也書者道家之書既遭秦世焚燒今檢亦無的據自先明天以下至形名而五至賞罰而九此自然先後之序也夫為治之體必隨世污隆世有澆淳故治亦有寬急是以五變九變可舉可言苟其不失次序則是太平至治也驟數也速也季世之人不知倫序數語形名以為治術而未體九變以自然為宗但識其末不知其本也速論賞罰以此馭時唯見枝條未知根本始猶本也互其名耳治人者必順序忤逆也不識治方不知次序顛倒道理忤逆物情適可為物所治豈能治物也忤道音悟司馬云橫也而說徐音悅又如字治道先明天不為棄賞罰也但當不失其先後之序耳夫形名賞罰此乃知治之具度非知治之要道也夫用天下者必大通順序之道若以形名賞罰可施用於天下者不足以用於天下也斯乃苟飾華辭浮游之士一節曲見偏執之人未可以識通方悟於大道者也寄此事於群才斯乃畜下也重疊前語古人有之但寄群才而不親預故是臣下之術非主上養民之道總結一章之意以明本末之旨歸也昔者舜問於堯曰天王之用心何如天王猶天子也舜問於堯為帝王之法若為用心以合大道也堯曰吾不敖無告不廢窮民苦死者嘉孺子而哀婦人此吾所以用心已無告者所謂頑民也敖侮慢也無告謂頑愚之甚無堪告示也堯答舜云縱有頑愚之民不堪告示我亦殷勤教誨不敖慢棄舍也故老經云不善者吾亦善之敖亦有作教字者今不用也不敖五報反恆加恩也百姓之中有貧窮者每加拯恤此心不替也孺子猶稚子也哀憐也民有死者輒悲苦而慰之稚子小兒婦人孤寡並皆矜愍善嘉養恤也已止也總結以前用答舜問我之用心止盡於此舜曰美則美矣而未大也用心為治美則美矣其道狹劣未足稱大既領堯答因發此譏堯曰然則何如堯既被譏因茲請益治道之大其術如何舜曰天德而出寧日月照而四時行若晝夜之有經雲行而雨施矣與天合德則雖出而靜化育之方與玄天合德跡雖顯著心恆寧靜此皆不為而自然也經常也夫日月盛明六合俱照春秋涼暑四序運行晝夜昏明雲行雨施皆天地之大德自然之常道者也既無心於偏愛豈有情於養育帝王之道其義亦然雨施始豉反堯曰膠膠擾擾乎子天之合也我人之合也自嫌有事膠膠擾擾皆擾亂之貌也領悟此言自嫌多事更相發起聊此撝謙膠膠交卯反司馬云和也擾擾而小反司馬云柔也案如注意膠膠擾擾動亂之貌堯自謙光推讓於舜故言子之盛德遠合上天我之用心近符人事夫堯舜二君德無優劣故寄此兩聖以顯方治耳夫天地者古之所大也而黃帝堯舜之所共美也故古之王天下者奚為哉天地而已矣自此已下莊生之辭也夫天覆地載生育群品域中四大此當二焉故引古證今歎美其德唯天為大唯堯則之故知軒頊唐虞皆以德合天地為其美也言古之懷道帝王何為者哉蓋無心順物德合二儀而已矣之王往況反孔子西藏書於周室子路謀曰由聞周之徵藏史有老聃者免而歸居夫子欲藏書則試往因焉姓仲名由字子路宣尼弟子也宣尼睹周德已衰不可匡輔故將己所修之書欲藏於周之府藏庶為將來君王治化之術故與門人謀議詳其可否老君姓李名聃為周徵藏史猶今之祕書官職典墳籍見周室版蕩所以解免其官歸休靜處故子路咨勸孔子何不暫試過往因而問焉藏書司馬云藏其所著書也徵藏才浪反司馬云徵藏藏名也一云徵典也史藏府之史老聃吐甘反或云老聃是孔子時老子號也免而歸言老子見周之末不復可匡所以辭去也孔子曰善往見老聃而老聃不許於是翻十二經以說老子知欲藏之書是先聖之已陳芻狗不可久留恐亂後人故云不許孔子刪詩書定禮樂修春秋贊易道此六經也又加六緯合為十二經也委曲敷演故翻覆說之翻敷袁反徐又音盤又音煩司馬云煩冤也十二經說者云詩書禮樂易春秋六經又加六緯合為十二經也一說云易上下經並十翼為十二又一云春秋十二公經也以說如字又始鋭反絶句老聃中其說曰大謾願聞其要中其說者許其有理也大謾者嫌其繁謾太多請簡要之術也老聃中丁仲反其說如字絶句曰大音泰徐敕佐反謾末旦反郭武諫反趙諫議本大作太孔子曰要在仁義經有十二乃得繁盈切要而論莫先仁義也老聃曰請問仁義人之性邪問此仁義率性不乎孔子曰然君子不仁則不成不義則不生仁義真人之性也又將奚為矣然猶如此言仁義是人之天性也賢人君子若不仁則名行不成不義則生道不立故知仁義是人之真性又將何為是疑之也邪老聃曰請問何謂仁義前言仁義是人之真性今之重問請解所由也孔子曰中心物愷兼愛無私此仁義之情也此常人之所謂仁義者也故寄孔老以正之愷樂也忠誠之心願物安樂慈愛平等兼濟無私允合人情可為世教也中心物本亦作勿愷開待反司馬云樂也老聃曰意幾乎後言夫兼愛不亦迂乎無私焉乃私也夫子若欲使天子無失其牧乎則天地固有常矣日月固有明矣星辰固有列矣禽獸固有群矣樹木固有立矣夫子亦放德而行循道而趨已至矣又何偈偈乎揭仁義若擊鼓而求亡子焉意夫子亂人之性也夫至仁者無愛而直前也意不平之聲也幾近也迂曲也後發之言近乎浮僞故興意歎以不平夫至人推理直前無心思慮而汝存情兼愛不乃私曲乎曰意於其反司馬云不平聲也下同幾乎音機司馬本作頎云頎長也後言長也盧文弨曰舊本後作復未詳迂乎音于世所謂無私者釋己而愛人夫愛人者欲人之愛己此乃甚私非忘公而公也夫兼愛於人欲人之愛己也此乃甚私何公之有邪牧養也欲使天下蒼生咸得本性者莫若上下各各守分自全恬養則大治矣牧有本作放字者言君王但放任群生則天下太平也牧乎司馬云牧養也夫天地覆載日月照臨星辰羅列此並自然之理也非關人事豈唯三種萬物悉然但當任之莫不備足何勞措意妄為矜矯也皆已自足有識禽獸無情草木各得生立各有群分豈資仁義方獲如此不待於兼愛也循順也放任己德而逍遙行世順於天道而趨步人間人間至極妙行莫過於此也放德方往反無由得之偈偈勵力貌也揭擔負也亡子逃人也言孔丘勉勵身心擔負仁義強行於世以教蒼生何異乎打擊大鼓而求覓亡子是以鼓聲愈大而亡者愈離仁義彌彰而去道彌遠故無由得之偈偈居謁反又巨謁反或云用力之貌揭仁其謁反又音桀事至而愛當義而止斯忘仁義者也常念之則亂真矣亡子不獲罪在鳴鼓真性不明過由仁義故發噫歎總結之也釋文原本及世德堂本均作復世德堂本已作以士成綺見老子而問曰吾聞夫子聖人也吾固不辭遠道而來願見百舍重趼而不敢息今吾觀子非聖人也鼠壤有餘蔬而棄妹之者不仁也生熟不盡於前而積斂無崖姓士字成綺不知何許人舍逆旅也趼腳生泡漿創也成綺素聞老子有神聖之德故不辭艱苦慕義遠來百經旅舍一不敢息塗路既遙足生重趼士成綺如字又魚紙反士成綺人姓名也願見賢遍反下同百舍司馬云百日止宿也重直龍反趼古顯反司馬云胝也胝音陟其反許慎云足指約中斷傷為趼慶藩案釋文引許說本淮南修務篇注淮南引莊子作重跰跰即趼字之誤也高注云趼足生胝也趼又讀若繭賈子勸學篇百舍重繭宋策墨子百舍重繭高注重繭纍胝也皆假繭作趼也言其不惜物也昔時藉甚謂是至人今日親觀知無聖德見其鼠穴土中有餘殘蔬菜嫌其穢惡故發此譏也餘蔬所居反又音所司馬云蔬讀曰糈糈粒也鼠壤內有遺餘之粒穢惡過甚也一云如鼠之堆壤餘益蔬外也無近恩故曰棄妹猶昧也暗昧之徒應須誘進棄而不教豈曰仁慈也棄妹一本作妹之老不仁釋名云妹末也謂末學之徒須慈誘之乃見棄薄不仁之甚也至足故恆有餘生謂粟帛熟謂飲食充足之外不復概懷所以飲食資財目前狼藉且大聖寬弘而不拘小節士成庸瑣以此為非細碎之間格量真聖可謂以螺酌海焉測淺深也生熟司馬云生膾也一云生熟謂好惡也萬物歸懷來者受之不小立界畔也既有聖德為物所歸故供給聚斂略無涯浩然無心積散任物也而積子亦反李子賜反斂力檢反李狸豔反老子漠然不應不以其言概意塵垢之言豈曾入耳漠然虛淡何足介懷士成綺明日復見曰昔者吾有刺於子今吾心正卻矣何故也自怪刺譏之心所以壞也卻空也息也昨日初來妄生譏刺今時思省方覺己非所以引過責躬深懷慚竦心之空矣不識何耶復見扶又反有刺賜反正卻去逆反或云息也千字依釋文原本改老子曰夫巧知神聖之人吾自以為脫焉昔者子呼我牛也而謂之牛呼我馬也而謂之馬苟有其實人與之名而弗受再受其殃吾服也恆服吾非以服有服脫過去也夫巧智神聖之人者蓋是跡非所以跡也汝言我欲於聖人乎我於此久以免脫汝何為乃謂我是聖非聖耶老君欲抑成綺之譏心故示以息跡歸本也郭注云脫過去也謂我於聖已得過免而去也夫巧苦教反又如字知音智為脫徒活反注同隨物所名有實故不以毀譽經心也毀譽音餘下同一毀一譽若受之於心則名實俱纍斯所以再受其殃也昨日汝喚我作牛我即從汝喚作牛喚我作馬我亦從汝喚作馬我終不拒且有牛馬之實是一名也人與之名諱而不受是再殃也譏刺之言未甚牛馬是尚不諱而況非乎服者容行之謂也不以毀譽自殃故能不變其容郭注云服者容行之謂也老君體道大聖故能制服身心行行容受呼牛呼馬唯物是從此乃恆常非由措意也容行如字有為為之則不能恆服言我率性任真自然容受非關有心用意方得而然必也用心便成矯性既其有作豈曰無為士成綺鴈行避影履行遂進而問修身若何成綺自知失言身心慚愧於是鴈行斜步側身避影隨逐老子之後不敢履躡其跡仍徐進問請修身之道如何老子曰而容崖然而目衝然而顙頯然而口闞然而狀義然似繫馬而止也動而持發也機察而審知巧而睹於泰凡以為不信邊竟有人焉其名為竊進趨不安之貌而汝也言汝莊飾容貌夸駭於人自為崖岸不能舒適衝出之貌心既不安目亦馳動故左盼右睇睢盱充詘也高露發美之貌顙額高亢顯露華飾持此容儀矜敖於物顙頯上息黨反下去軌反本又作顯如字司馬本作虓豁之貌郭注云虓豁之貌也謂志性強梁言語雄猛夸張虓豁使人可畏也闞郭許覽反又火斬反又火暫反虓火交反豁火括反踶跂自持之貌義宜也踶跂驕豪實乖典禮而修飾容狀自然合宜也踶直氏反跂去氏反慶藩案義讀為峨義然峨然也說詳俞氏大宗師篇平議郭訓成疏兩失之志在奔馳形雖矜莊而心性喧躁猶如逸馬被繫意存奔走不能自舒放也馳情逐境觸物而動不能任適每事拘持趨捨速也機弩牙也攀緣之心遇境而發其發猛速有類弩牙明是非也不能虛遣違順兩忘而明察是非域心審定泰者多於本性之謂也巧於見泰則拙於抱朴泰多也不能忘巧忘知觀無為之一理而詐知詐巧見有為之多事凡此十事以為不信性命而蕩夫毀譽皆非修身之道也信實也言此十事皆是虛詐之行非真實之德也家世父曰郭象云凡此十事以為不信性命而蕩夫毀譽於文多一轉折凡以為不信言凡所為皆出於矯揉與自然之性不相應故謂之不信容也目也顙也口也狀也一有矜持若繫馬而制其奔突不能自信於心也動而發一其機應之而相勝以知巧不能自信於外也微分兩義不得為十事亦如汝所行非正人也竊賊也邊蕃境域忽有一人不憚憲章但行竊盜內則損傷風化外則阻隔蕃情蠹政害物莫斯之甚成綺之行其猥亦然舉動睢盱猶如此賊也邊竟音境有人焉其名為竊邊垂之人不聞知禮樂之正縱有言語偶會墳典皆是竊盜所得其道何足語哉司馬云言遠方嘗有是人趙諫議本竟作境世德堂本如作知夫子曰夫道於大不終於小不遺故萬物備廣廣乎其無不容也淵乎其不可測也形德仁義神之末也非至人孰能定之夫至人有世不亦大乎而不足以為之纍天下奮而不與之偕審乎無假而不與利遷極物之真能守其本故外天地遺萬物而神未嘗有所困也通乎道合乎德退仁義賓禮樂至人之心有所定矣莊周師老君故呼為夫子也終窮也二儀雖大猶在道中不能窮道之量秋毫雖小待之成體此則於小不遺既其能小能大故知備在萬物既大無不包細無不入貫穿萬物囊括二儀故廣廣歎其寬博淵乎美其深遠慶藩案廣廣猶言曠曠也曠曠者虛無人之貌漢書五行志師出過時茲謂廣李奇曰廣音曠曠與廣古字義通漢書武五子傳橫術薛瓚曰術道路也何廣廣兮蘇林曰廣音曠夫形德仁義者精神之末跡耳非所以跡也救物之弊不得已而用之自非至聖神人誰能定其粗妙耶用世故不患其大也聖人威跨萬乘王有世界位居九五不亦大乎而姑射汾陽忘物忘己即動即寂何四海之能纍乎靜而順之權也偕居也社稷顛覆宇內崩離趨世之人奮動權必靜而自守不與並逐也奮音柄司馬云威權也李丑倫反一本作棟家世父曰釋文引司馬云威權也說文柄柯也柄或管子山權數篇此之謂國權此謂君操國計之盈虛謂之國權制人事之重輕謂之君者所藉以制事者也大者制大小者制小相與奮起以有為於世皆有所借者也說文假借也無所假則無為無為則因以為弟靡因以為波流而隨物以遷焉無假而不與利遷斯之謂無為而無不為郭象云任真而直往非也任真而直往也志性安靜委命任真榮位既不關情財利豈能遷動也夫聖人靈鑒洞徹窮理盡性斯極物之真者也而應感無方動不傷寂能守其本雖復握圖御宇總統群方而忘外二儀遺棄萬物是以為既無為事既無事心閒神王何困弊之有淡泊之心通乎至道虛忘之智合乎上德斯乃境智相會能冥符也進道德也以情性為主也退仁義之澆薄進道德之淳和擯禮樂之浮華主無為之虛淡俞樾曰賓當讀為擯謂擯斥禮樂也與上句退仁義一律郭注曰以性情為主也則以本字讀之其義轉迂達生篇曰賓於鄉里逐於州部此即假賓為擯之證慶藩案俞說是也古賓擯音同音同之字往往假借為義周禮司儀賓拜送幣釋文云賓音擯本書徐無鬼篇賓於寡人司馬本賓作擯即其證定於無為也恬淡無為而用不乖寂定矣闕誤引江南古藏本重淵字世之所貴道者書也書不過語語有貴也語之所貴者意也意有所隨意之所隨者不可以言傳也而世因貴言傳書世雖貴之我猶不足貴也為其貴非其貴也故視而可見者形與色也聽而可聞者名與聲也悲夫世人以形色名聲為足以得彼之情夫形色名聲果不足以得彼之情則知者不言言者不知而世豈識之哉道者言說書者文字世俗之人識見浮淺或託語以通心或因書以表意持往來以為貴重不知無足可言也所以致書貴宣於語所以宣語貴表於意也隨從也意之所出從道而來道既非色非聲故不可以言傳說言傳丈專反後同其貴恆在意言之表夫書以載言言以傳意而末世之人心靈暗塞遂貴言重書不能忘言求理故雖貴之我猶不足貴者為言書糟粕非可貴之物也故郭注云其貴恆在意言之表為其于僞反得彼之情唯忘言遺書者耳夫目之所見莫過形色耳之所聽唯在名聲而世俗之人不達至理謂名言聲色盡道情實豈知玄極視聽莫偕愚惑如此深可悲歎郭注云得彼之情唯忘言遺書者耳此絶學去知之意也知道者忘言貴德者不知而聾俗愚迷豈能識悟唯當達者方體之矣知者如字下同或並音智去尚起呂反世德堂本之下有哉字之字依宋本及疏補桓公讀書於堂上輪扁斫輪於堂下釋椎鑿而上問桓公曰敢問公之所讀者何言邪桓公齊桓公也輪車輪也扁匠人名也斫雕斫也釋放也齊君玩讀輪扁打車貴賤不同事業各異乃釋放其具方事質疑欲明至道深玄不可傳故寄桓公匠者略顯忘言之致也桓公李云齊桓公也名小白輪扁音篇又符殄反司馬云斫輪人也名扁斫陟角反椎直追反而上時掌反世德堂本者作為公曰聖人之言也所謂憲章文武祖述堯舜是聖人之言曰聖人在乎又問聖人見在以不公曰已死矣答曰聖人雖死厥教尚存焉曰然則君之所讀者古人之糟魄已夫夫酒滓曰糟漬糟曰粕夫醇酎比乎道德糟粕方之仁義已陳芻狗曾何足云糟音遭李云酒滓也魄普各反司馬云爛食曰魄一云糟爛為魄本又作粕音同許慎云粕已漉粗糟也或普白反謂魂魄也已夫音符絶句或如字慶藩案釋文魄本又作粕即司馬本也文選陸士衡文賦注引司馬云爛食曰粕桓公曰寡人讀書輪人安得議乎有說則可無說則死貴賤禮隔不可輕言庸委之夫輒敢議論說若有理方可免辜如其無辭必獲死罪輪扁曰臣也以臣之事觀之斫輪徐則甘而不固疾則苦而不入不徐不疾得之於手而應於心口不能言有數存焉於其間臣不能以喻臣之子臣之子亦不能受之於臣是以行年七十而老斫輪古之人與其不可傳也死矣然則君之所讀者古人之糟魄已夫甘緩也苦急也數術也夫斫輪失所則不牢固若使得宜則口不能言也況之理教其義亦然甘如字又音酣司馬云甘者緩也苦者急也有數李云色注反數術也盧文弨曰案前後俱作色主反此注字疑訛此言物各有性教學之無益也喻曉也輪扁之術不能示其子輪扁之子亦不能稟受其教是以行年至老不免斤斧之勞故知物各有性不可倣效當古之事已滅於古矣雖或傳之豈能使古在今哉古不在今今事已變故絶學任性與時變化而後至焉夫聖人制法利物隨時時既不停法亦隨變是以古人古法淪殘於前今法今人自興於後無容執古聖跡行乎今世故知所讀之書定是糟粕也人與如字又一音餘可傳直專反注同不字依正文補趙諫議本古作今趙本滅作減
