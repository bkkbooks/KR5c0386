body:
  text: 雜篇徐無鬼第二十四以人名篇徐無鬼因女商見魏武侯武侯勞之曰先生病矣苦於山林之勞故乃肯見於寡人姓徐字無鬼隱者也姓女名商魏之宰臣武侯文侯之子畢萬十世孫也無鬼欲針規武侯故假宰臣以見之徐無鬼緡山人魏之隱士也司馬本作緡山人徐無鬼女商人名也李云無鬼女商並魏幸臣魏武侯名擊文侯之子治安邑久處山林勤苦貧病忽能降志混迹俗中中心欣悅有慰勞也武侯勞之力報反唯山林之勞一字如字餘并下章並力報反徐無鬼曰我則勞於君君有何勞於我君將盈耆欲長好惡則性命之情病矣君將黜耆欲掔好惡則耳目病矣我將勞君君有何勞於我武侯超然不對嗜欲好惡內外無可黜廢退也掔引卻也君若嗜欲盈滿好惡長進則性命精靈困病也君屏黜嗜欲掔去好惡既不稱適故耳目病矣是故我將慰勞於君君有何暇能勞於我也盈耆時志反下注同長丁丈反好呼報反下注下章同惡烏路反下注下章同黜敕律反退也本又作出音同司馬本作咄掔苦田反又口間反爾雅云固也崔云引去也司馬云牽也此重結前義不説其言超悵也既不稱情故悵然不答超然司馬云猶悵然也不説音悅下文大説同少焉徐無鬼曰嘗語君吾相狗也下之質執飽而止是狸德也中之質若視日上之質若亡其一吾相狗又不若吾相馬也吾相馬直者中繩曲者中鉤方者中矩圓者中規是國馬也而未若天下馬也天下馬有成材若恤若失若喪其一若是者超軼絶塵不知其所武侯大悅而笑既覺武侯悵然不悅試語狗馬庶愜其心語君魚據反吾相息亮反下皆同執守情志唯貪飽食此之形質德比狐狸下品之狗下之質一本無質字執飽而止司馬以執字絶句云放下之能執禽也是狸德也謂貪如狐狸也俞樾曰廣雅釋獸狸貓也貓之捕鼠飽而止矣故曰是狸德也秋水篇曰騏驥驊騮一日而馳千里捕鼠不如狸狌此本書以狸為貓之證御覽引尸子曰使牛捕鼠不如貓狌之捷莊子言狸狌尸子言貓牲一也釋文曰狸德謂貪如狐狸也未得其義意氣高遠望如視日體質如斯中品狗也示日音視司馬本作視云視日瞻遠也盧文弨曰今書作視日舊音視仍訛作示今改正一身也神氣定審若喪其身上品之狗也若亡其一一身也謂精神不動若無其身也狗有三品馬有數階而相狗之能不若相馬武侯庸鄙故以此逗機冀其歡悅庶幾歸正謂馬前齒謂馬項也謂馬頭也謂馬眼也直者中繩丁仲反下皆同司馬云直謂馬齒曲謂背上方謂頭圓謂目合上之相是謂諸侯之國上品馬也材德素成不待於習斯乃宇內上馬天王所馭也成材字亦作才言自然已足不須教習也眼自顧視既似憂虞蹄足緩疏又如奔佚觀其神彩若忘己身如此之材天子馬也若恤音恤若失音逸司馬本作佚李云恤失皆驚悚若飛也若喪息浪反下章注同其一言喪其耦也軼過也馳走迅速超過群馬疾若迅風塵埃遠隔既非教習故不知所由也超軼李音逸徐徒列反崔云徹也廣雅云過也夫真人之言何遜哉唯物所好之可也語當其機故笑而歡悅徐無鬼出女商曰先生獨何以説吾君乎吾所以説吾君者橫説之則以詩書禮樂從説之則以金板六韜奉事而大有功者不可為數而吾君未嘗啓齒今先生何以説吾君使吾君説若此乎議事已了辭而出女商怪君歡笑是以咨問無鬼也以説如字又始鋭反下皆同司馬作悅詩書禮樂六經金版六韜周書篇名也或言祕讖也本有作韜字者隨字讀之云是太公兵法謂文武虎豹龍犬六韜也橫遠也從近也武侯好武而惡文故以兵法為從六經為橫也從説子容反金版本又作板薄版反又如字盧文弨曰今書作板六韜吐刀反司馬崔云金版六韜皆周書篇名或曰祕也本又作六韜謂太公六韜文武虎豹龍犬也是直樂鴳以鐘鼓耳故愁慶藩案文選郭景純遊仙詩注引司馬云啓齒笑也釋文闕樂音洛章末同鴳一諫反奉事武侯盡於忠節或獻替可否功績克彰如此之徒不可稱數而我君未嘗開口而微笑今子有何術遂使吾君歡説如此耶吾君説音悅讖字依釋文原本改徐無鬼曰吾直告之吾相狗馬耳夫藥無貴賤愈疾則良故直告犬馬更無他説女商曰若是乎直置如是告狗馬乎怪其術淺故有斯問曰子不聞夫越之流人乎去國數日見其所知而喜去國旬月見所嘗見於國中者喜及期年也見似人者而喜矣不亦去人滋久思人滋深乎夫逃虛空者藜藋柱乎鼪鼬之徑踉位其空聞人足音跫然而喜矣又況乎昆弟親戚之謦咳其側者乎久矣夫莫以真人之言謦咳吾君之側乎各思其本性之所好去國迢遞有被流放之人或犯憲綱或遭苛政辭鄉甫爾始經數日忽逢知識喜慰何疑此起譬也越之流人越遠也司馬云流人有罪見流徙者也數日所主反日月稍久思鄉漸深雖非相識而國中曾見故人見之而歡也各得其所好則無思無思則忘其所以喜也去國周年所適漸遠故見似鄉里人而歡喜矣豈非離家漸遠而思戀滋深乎以況武侯性好犬馬久不聞政事等離鄉之人忽聞談笑及期音基得所至樂則大悅也柱塞也踉良人也跫行聲也夫時遭暴亂運屬飢荒逃避波流於虛園宅唯有藜藿野草柱塞門庭狙猿鼪鼬蹊徑斯在若於堂宇人位虛廣間然當爾之際思鄉滋甚忽聞他人行聲猶自欣悅況乎兄弟親眷謦咳言笑者乎此重起譬也夫逃司馬本作巡也虛空者司馬云故壞冢處為空虛也藜力西反藿徒弔反本或作同柱誅矩反司馬云塞也乎鼪音生又音姓鼬由救反之徑本亦作徑司馬云徑道也本又作迹元嘉本作迭徐音逸崔云迭迹慶藩案藜蒿也藋即今所謂灰藋也爾雅拜商藋郭注商藋似藜案藜藋皆生於不治之地其高過人必排之而後得進故史記仲尼弟子傳曰排藜藋此言柱乎鼪鼬之徑亦極謂其高也良位其空司馬云良良人謂巡虛者也位其空謂處虛空之間也良或作踉音同盧文弨曰今書良作踉家世父曰釋文良位其空司馬云良人謂巡虛者也良或作踉據秋水篇跳梁乎井幹之上一本作跳踉潘安仁射雉賦已踉蹡而徐來玉篇踉疾行此云藜藋鼪鼬之徑有空隙焉蹌踉處乎其中説文蹌動貌舒言之言曰蹌踉急言之言曰踉釋文誤跫然郭巨恭反李曲恭反又曲勇反悚也徐苦江反又袪扃反司馬云喜貌崔云行人之聲而喜矣李云喻武侯之無人君之德而處在防衛之間雖臨朝矯厲愈非其意及得其所思猶逃竄之聞人音安能不跫然改貌釋然而喜也謦苦頂反又音罄咳苦愛反一音器李云謦咳喻言笑也但呼聞所好猶大悅況骨肉之情歡之至也所以未嘗啓齒也夫真人之言所以得吾君性也始得之而喜久得之則忘武侯思聞犬馬其日固久譬彼流人方滋茲逃客羈既淹實懷鄉眷今乃以真人六經之説太公兵法之談謦咳其側非所宜也此合前也久矣夫音扶後放此闕誤引文如海張君房本乎俱作于世德堂本又作而徐無鬼見武侯武侯曰先生居山林食芧栗厭蔥韭以賓寡人久矣夫今老邪其欲干酒肉之味邪其寡人亦有社稷之福邪干求也久處山林飧食蔬果年事衰老勞苦厭倦豈不欲求於滋味以養頽齡乎庶稟德以謀固宗廟食芧音序又食汝反本亦作芧栗慶藩案説文橡栩實又曰栩也與芓同其實草字俗作皂一曰樣又曰草斗櫟實一曰樣斗高注呂氏春秋橡斗也恃君篇其狀如栗漢書司馬相如傳應劭注曰櫟采木也合觀諸説櫟一名栩一名一名采其實謂之皂亦謂之樣是樣者采實也司馬此注柔橡子也則采亦謂之樣矣説文樣字今書傳皆作橡案山木篇杼栗徐無鬼篇作芧栗是芧杼三字皆通淮南本經菱杼紾抱高注杼采實也王引之曰杼水草也杼讀為芧字亦作苧漢書司馬相如傳上林賦蔣芧青薠張揖曰芧三稜也文選芧作苧作苧者或字作杼者借也韭音久或下作者非也盧文弨曰即草字頭下作乃俗韭字舊作廾訛今改正以賓必刃反本或作擯司馬云擯棄也又必人反李云賓客也欲干李云干求也社稷之福邪李云謂善言嘉謀可以利社稷也皂字依呂氏春秋高注改徐無鬼曰無鬼生於貧賤未嘗敢飲食君之酒肉將來勞君也生涯貧賤安於山藪豈欲貪於飲食以自養哉蓋不然乎將勞君也君曰何哉奚勞寡人奚何也問其所以也曰勞君之神與形食欲無厭形勞神倦故慰之耳武侯曰何謂邪問其所言有何意謂徐無鬼曰天地之養也一登高不可以為長居下不可以為短君獨為萬乘之主以苦一國之民以養耳目鼻口夫神者不自許也夫神者好和而惡姦夫姦病也故勞之唯君所病之何也不以為君而恣之無極夫天地兩儀亭毒群品物於資養周普無偏不以為君恣其奢侈此並是無鬼勞君之辭如此違天地之平也登高位為君子不可樂之以為長居卑下為百姓不可苦之以為短而獨誇萬乘之威苦此一國黎庶貪色聲香味以恣耳目鼻口既違天地之意竊為公不取焉萬乘繩證反物與之耳許與也夫聖主神人物我平等必不多貪滋味而自與焉不自許司馬云許與也與物共者和也私自許者姦也夫神聖之人好與物和同而惡姦私者夫姦者私通於理為病君獨有斯病其困如何夫姦病王云姦者以正從邪也謂病也所病之何也李云服而無對也或云養違天地之平獨恣其欲自許不損於神而以姦為病故不知所以以此為病何為乎武侯曰欲見先生久矣吾欲愛民而為義偃兵其可乎欲行愛養之仁而為裁非之義修於文教偃息兵戈如斯治國未知可不也偃兵偃息也徐無鬼曰不可愛民害民之始也為義偃兵造兵之本也君自此為之則殆不成凡成美惡器也君雖為仁義幾且偽哉形固造形成固有伐變固外戰君亦必無盛鶴列於麗譙之間無徒驥於錙壇之宮無藏逆於得無以巧勝人無以謀勝人無以戰勝人夫殺人之士民兼人之土地以養吾私與吾神者其戰不知孰善勝之惡乎在君若勿已矣修胸中之誠以應天地之情而勿攖夫民死已脫矣君將惡乎用夫偃兵哉愛民之迹為民所尚尚之為愛愛已偽也為義則名彰名彰則競興競興則喪其真矣父子君臣懷情相欺雖欲偃兵其可得乎夫偏愛之仁裁非之義偃武之功修文之事迹既彰矣物斯徇焉害民造兵自此始也從無為為之乃成耳自從也殆近也從此以為必殆隳敗無為之本故近不成也美成於前則偽生於後故成美者乃惡器也夫善善之事成之於前美迹既彰物則趨競故為惡之器具也民將以偽繼之耳未肯為真也幾近也仁義迹顯物皆喪真故近偽本也仁義有形固偽形必作仁義二塗並有形迹故前迹既依後形必造成則顯也夫功名成者必招爭競故有征伐失其常然夫造作刑法而變更易常者物必害之故致外敵事多爭戰成固有伐變固外戰王云成功在己亦衆所不與欲無有伐其可得乎夫偽生形造又伐焉非本所圖勢之變也既有偽伐得無戰乎家世父曰假仁義為名將日懸仁義之形於胸中而凡依於仁義之形皆可意造之成乎仁義之名則自多小爾雅伐美也謂自多其功美仁可以意造之而固非安之必有中變者矣變則耳目手足皆失其常喜怒哀樂亦違其節是外戰也凡有意為之者皆殆也鶴列陳兵也麗譙高樓也鶴列李云謂兵如鶴之列行司馬云鶴列鍾鼓也麗如字又力智反力支反譙本亦作嶕在逍反司馬郭李皆云麗譙樓觀名也案謂華麗而嶕嶢步兵曰徒但不當為義愛民耳亦無為盛兵走馬鶴列陳兵也言陳設兵馬如鶴之行列也麗譙高樓也言其華麗嶕嶢也錙壇宮名也君但勿起心偃兵為義亦無勞盛陳兵卒於高樓之下驥馬宮苑之間無徒司馬云徒步也錙壇徐側其反錙壇壇名家世父曰史記陳涉世家戰譙門中顏師古注門上為高樓以望遠樓一名譙説文封土曰壇錙壇之宮謂軍壘也麗譙城樓盛鶴列者守兵徒驥猶徒御也謂行兵得中有逆則失耳莫包藏逆心而苟於得無藏一本作臧司馬本同逆於得司馬本作德李云凡非理而貪貪得而居之此藏逆於德內者也孰有貪得而可以德不失哉固宜無藏而捨之又云謂有貪則逆道也守其朴而朴各有所能則平大巧若拙各敦朴素莫以機心爭勝於人率其真知而知各有所長則均忘心遣慮率其真知勿以謀謨勝捷於物以道應物物服而無勝名先為清淡以道服人勿以兵戰取勝於物不知以何為善則雖克非己勝夫應天順人而或滅凶殄逆者雖亡國戮人而不失百姓之歡心也若使誅殺人民兼土并地而意在貪取私養其身及悅其心者雖復戰克前敵善勝於人不知此勝於何處在善且在誰邊也惡乎音烏下同若未能已則莫若修己之誠誠實也攖擾也事不得止應須治國若修心中之實應二儀之生殺無勞作法攖擾黎民勿攖一營反又一盈反甲兵無所陳非偃也順天地施化無心民以勝殘免脫傷死何勞措意作法偃兵耶已脫音奪走字依注文改黃帝將見大隗乎具茨之山方明為御昌宇驂乘張若謵朋前馬昆閽滑稽後車至於襄城之野七聖皆迷無所問塗黃帝軒轅也大隗大道廣大而隗然空寂也亦言大隗古之至人也具茨山名也在熒滎陽密縣界亦名泰隗山黃帝聖人久冥至理方欲寄尋玄道故託迹具茨大隗五罪反司馬崔本作泰隗或云大隗神名也一云大道也具茨一本作次同祀咨反又音資司馬本作疚山名也司馬云在滎陽密縣東今名泰隗山方明滑稽等皆是人名在右為驂在左為御前馬馬前為導也後車車後為從也昌宇音禹驂乘繩證反驂乘車右也謵音習元嘉本作謂崔同舒氏反崔本作本亦作蒲登反徐扶恆反盧文弨曰今書作謵朋慶藩案崔本作朋蓋多朋字常相混古文多字作形與朋相似而誤史記五帝紀鬼神山川封禪與為多焉徐廣曰多亦作朋漢書霍去病傳校尉僕多有功師古曰功臣侯表作僕朋皆傳寫之誤也周策公仲侈韓子十過篇漢書古今人表皆作公仲朋亦其前馬司馬云二人先馬導也昆閽音昏滑音骨稽音雞後車司馬云二人從車後聖者名也名生而物迷矣雖欲之乎大隗其可得乎塗道也今汝州有襄城縣在泰隗山南即黃帝訪道之所也自黃帝已上至於滑稽總有七聖也注云聖者名也名生而物迷矣雖欲之乎大隗其可得乎此注得之今不重釋也襄成之野李云地名七聖黃帝一方明二昌三張若四謵朋五昆閽六滑稽七也適遇牧馬童子問塗焉曰若知具茨之山乎曰然牧馬童子得道人也牧馬曰牧適爾而值牧童因問道之所在若汝也然猶是也問山之所在答云我知若知大隗之所存乎曰然存在也又問道之所在答云知處黃帝曰異哉小童非徒知具茨之山又知大隗之所存請問為天下帝驚異牧童知道所在因問緝理區宇其法如何小童曰夫為天下者亦若此而已矣又奚事焉豫少而自遊於六合之內豫適有瞀病有長者教豫曰若乘日之車而遊於襄城之野今豫病少痊豫又且復遊於六合之外夫為天下亦若此而已豫又奚事焉各自若則無事矣無事乃可以為天下也奚何也若如也夫欲修為天下亦如治理其身身既無為物有何事故老經云我無為而民自化日出而遊日入而息六合之內謂囂塵之裏也瞀病謂風眩冒亂也言我少遊至道之境棲心塵垢之外而有眩病未能體真幸聖人教我修道晝作夜息乘日遨遊以此安居而逍遙處世本有作專字者謂乘日新以變化豫少詩召反瞀莫豆反郭音務李云風眩貌司馬云瞀讀曰謂眩也長者丁丈反乘日之車司馬云以日為車也元嘉本車作居夫為天下莫過自放任自放任矣物亦奚攖焉故我無為而民自化痊除也虛妄之病久已痊除任染而遊心物外治身治國豈有異乎物我混同故無事也少痊七全反李云除也慶藩案文選潘安仁間居賦注引司馬云痊除也釋文闕且復扶又反黃帝曰夫為天下者則誠非吾子之事雖然請問為天下小童辭事由民作令民自得必有道也夫牧養蒼生實非聖人務理雖如此猶請示以要言無所説也黃帝又問小童曰夫為天下者亦奚以異乎牧馬者哉亦去其害馬者而已矣殷勤請小童也馬以過分為害害馬者謂分外之事也夫治身莫先守分故牧馬之術可以養民問既殷勤聊為此答去其起呂反下注同黃帝再拜稽首稱天師而退師夫天然而去其過分則大隗至也頓悟聖言故身心愛敬退其分外至乎大隗命乎天然之道其在吾師乎知士無思慮之變則不樂辨士無談説之序則不樂察士無淩誶之事則不樂皆囿於物者也世屬艱危時逢禍變知謀之士思而慮之如其不然則不樂也知士音智不樂音洛下不樂及注同辨類縣河辭同炙輠無談説端則不歡樂機警之士明察之人若不容主客問訊辭鋒淩轢則不樂也察士李云察識也俞樾曰禮記鄉飲酒篇愁以時察鄭注曰察猶察察嚴殺之貌也老子俗人察察河上公注曰察察急且疾也然則察有嚴急之意故以淩誶為樂李云察識也則與上文知士復矣淩李云謂相淩轢誶音信廣雅云問也又音祟又音峻一本作説不能自得於內而樂物於外故可囿也故各以所樂囿之則萬物不召而自來非強之也此數人者各有偏滯未達大方並囿域於物也皆囿音又非強其丈反闕誤引文成張三本事俱作辭趙諫議本無故可囿也四字招世之士興朝中民之士榮官筋力之士矜難勇敢之士奮患兵革之士樂戰枯稿之士宿名法律之士廣治禮教之士敬容仁義之士貴際農夫無草萊之事則不比商賈無市井之事則不比庶人有旦暮之業則勸百工有器械之巧則壯錢財不積則貪者憂權勢不尤則夸者悲勢物之徒樂變遭時有所用不能無為也此皆順比於歲不物於易者也馳其形性之萬物終身不反悲夫推薦忠良招致人物之士可以興於朝廷也興朝直遙反治理四民甚能折中斯人精幹局分可以榮官中民李云善治民也英髦壯士有力如虎時逢難務於濟世也矜難乃旦反武勇之士果決之人奮發雄豪滌除禍患情好干戈志存鋒刃如此之士樂於征戰食杼衣褐形容留心寢宿唯在聲名也枯稿苦老反後章同宿名宿積久也王云枯稿一生以為娛其所寢宿唯名而已俞樾曰宿讀為縮國語楚語縮於財用則匱戰國秦策縮劍將自誅韋昭高誘注並曰縮取也枯稿之士縮名猶言取名也釋文曰宿積久也於義未安又引王云其所寢宿唯名而已更為迂曲由不知宿為縮之假字耳刑法之士留情格條懲惡勸善其治也廣治直吏反節文之禮矜敬容貌士之不同若此故當之者不可易其方世有迍邅時逢際會則施行仁義以著名勳際會也貴際謂盟會事家世父曰貴際謂相與交際仁義之用行乎交際之間者也鄭康成禮記中庸注人也讀如相人偶之人以人意相存問之言故人與人比而仁見焉仁義之士所以貴際也釋文貴際謂盟會事誤能同則事同所以相比比和樂古者因井為市故謂之市井也若乖本務情必不和也不比毗志反下同俞樾曰比通作庀周官遂師疏云周禮之內云比者先鄭皆為庀是也國語魯語子將庀季氏之政焉又曰夜庀其家事韋注並曰庀治也農夫惟治草萊之事故無草萊之事則不庀商賈惟治市井之事故無市井之事則不庀也郭注曰能同則事同所以比是以本字讀之非是商賈音古業得其志故勸衆庶之人各有事旦暮稱情故自勉勵事非其巧則惰壯盛也百工功巧各有器械能順其情事斯盛矣則壯李云壯猶疾也則惰徒臥反物得所耆而樂也所耆時志反而樂音洛尤甚也夫貪競之人必聚財以適性矜夸之士假權勢以娛心事苟乖情則憂悲斯生矣慶藩案文選賈長沙鳥賦注阮嗣宗詠懷詩注並引司馬云夸虛名也釋文闕權勢生於事變夫禍起則權勢尤故以勢陵物之徒樂禍變也凡此諸士用各有時時用則不能自已也苟不遭時則雖欲自用其可得乎故貴賤無常也以前諸士遭遇時命情隨事遷故不能無為也士之所能各有其極若四時之不可易耳故當其時物順其倫次則各有用矣是以順歲則時序易性則不物物而不物非毀如何次第也夫士之所行能有長短用捨隨時有次第方之歲序炎涼不易於物不物猶不易於物者也不守一家之能而之夫萬方以要時利故有匍匐而歸者所以悲也馳騖身心潛伏前境至乎沒命不知反歸頑愚若此深可悲歎也已矣家世父曰囿於物者致用之器也發之自內者也時有所用待用之資也應之自外者也性有所倚才有所偏內外相須以成能形性交馳而不反矣以要一遙反匍音扶又音蒲匐音服又蒲北反世德堂本教作樂廣字依正文改相字依道藏本補比字依正文改莊子曰射者非前期而中謂之善射天下皆羿也可乎不期而中謂誤中者也非善射也若謂謬中為善射是則天下皆可謂之羿可乎言不可也期謂準的也夫射無期準而誤中一物即謂之善射者若以此為善射可乎而中丁仲反注同惠子曰可謂宇內皆羿也莊子曰天下非有公是也而各是其所是天下皆堯也可乎若謂謬中者羿也則私自是者亦可謂堯矣莊子以此明妄中者非羿而自是者非堯各私其是故無公是也而唐堯聖人對桀為是若各是其所是則皆聖人可乎言不可惠子曰可言各是其是天下盡堯有斯理而惠施滯辨有言無實莊子曰然則儒墨楊秉四與夫子為五果孰是邪或者若魯遽者邪其弟子曰我得夫子之道矣吾能冬爨鼎而夏造冰矣魯遽曰是直以陽召陽以陰召陰非吾所謂道也吾示子乎吾道於是為之調瑟廢一於堂廢一於室鼓宮宮動鼓角角動音律同矣夫或改調一弦於五音無當也鼓之二十五弦皆動未始異於聲而音之君已且若是者邪若皆堯也則五子何為復相非乎儒姓鄭名緩墨名翟也楊名朱秉者公孫龍字也此四子者並聰名過物蓋世雄辨添惠施為五各相是非未知決定用誰為是若天下皆堯何為五復相非乎復相扶又反姓魯名遽周初人云冬取千年燥灰以擁火須臾出火可以爨鼎盛夏以瓦瓶盛水湯中煮之縣瓶井中須臾成冰也而迷惑之俗自是非他與魯無異也魯遽音渠又其據反李云魯遽人姓名也一云周初時人爨七亂反又七端反千年灰陽也火又陽也此是以陽召陽井中陰也水又陰也此是以陰召陰魯遽此言非其弟子也俱亦以陽召陽而橫自以為是廢置也置一瑟於堂中置一瑟於室內鼓堂中宮角室內弦應而動斯乃五音六律聲同故也猶是以陽召陽也為之于偽反廢一廢置也隨調而改堂中改調一弦則室內音無復應動當為律不同故也改調徒弔反注皆同無當丁浪反合也無聲則無以相動有聲則非同不應今改此一弦而二十五弦皆改其以急緩為調也應唯宮角而已密二十五弦俱動聲律同者悉應動也魯遽以此夸其弟子然亦以同應同耳未為獨能其事也聲律之外何曾更有異術雖復應動不同總以五音為其君主而已既無他術何足以自夸五子各私所見而是其所是然亦無異於魯遽之夸其弟子未能相出也惠子之言各私其是務夸陵物不異魯遽故云若是趙諫議本無復字為字世德堂本在獨能下趙諫議本在亦以下惠子曰今夫儒墨楊秉且方與我以辨相拂以辭相鎮以聲而未始吾非也則奚若矣未始吾非者各自是也惠子便欲以此為至相拂扶弗反世德堂本拂作排莊子曰齊人蹢子於宋者其命閽也不以完其求鈃鍾也以束縛其求唐子也而未始出域有遺類矣夫楚人寄而蹢閽者夜半於無人之時而與舟人鬥未始離於岑而足以造於怨也投之異國使門者守之出便與不保其全此齊人之不慈也然亦自以為是故為之閽守門人也齊之人棄蹢其子於宋仍命以此不亦我是蹢呈亦反投也司馬云齊人憎其子蹢之於宋使門者守之令形不全自以為是乃反以愛鍾器為是束縛恐其破傷鈃鍾音刑徐戶挺反又字林云鈃似小鍾而長頸又云似壺而大以束縛郭云恐其破傷也案此言賤子貴鈃自以為是也唐失也失亡其子而不能遠索遺其氣類而亦未始自非人之自是有斯謬矣鈃小鍾也唐亡失也求覓亡子不出境域束縛鈃鍾恐其損壞賤子貴器為不慈遺其氣類亦言我是俞樾曰有遺類矣當連下夫字為句有遺類矣夫與襄二十四年左傳有令德也夫有令名也夫句法相似類謂種類也詩裳裳者華序棄賢者之類正義曰類謂種類是也求亡子而不出域則其亡子不可得必無遺類矣故曰有遺類矣夫反言以明之也郭注失其讀所説未得唐子謂失亡子也遺類遺亡也亡其種類故也惠施畔道而好辨猶齊人遠子而愛鍾也遠索所百反俱寄止而不能自投於高地也岑岸也夜半獨上人船未離岸已共人鬥言齊楚二人所行若此而未嘗自以為非今五子自是豈異斯哉楚郢之人因子客寄近於江濱之側投蹢守門之家夜半無人之時輒入他人舟上而船未離岑已共舟人鬥打不懷恩德更造怨辭愚猥如斯亦云我是惠子之徒此之類也岑岸也俞樾曰案夫楚人寄而蹢閽者句夫字當屬上有遺類矣為句蹢當讀謫揚雄方言謫怒也張揖廣雅釋詁謫責也楚人寄而謫閽者謂寄居人家而怒責其閽者也與下文夜半於無人之時而與舟人鬥均此楚人之事皆喻其自以為是也郭注曰俱寄止而不能自投於高地於義殊不可通而與舟人鬥司馬云夜上人船人必擠己於水也擠排也家世父曰説文蹢住足也易羸豕孚蹢躅載記三年問蹢躅焉釋文蹢躅不行也閽者守門蹢躅不良於行故可以命閽趼鍾當為趼踵天道篇百舍重趼而不敢息説文踵追也一曰往來貌束縛謂行縢也言命閽則足不必完鈃踵急行則於足也又加之束縛爾雅釋宮廟中路謂之唐堂途謂之陳毛詩陳風傳唐堂途也田子方篇猶求馬於唐肆也司馬亦云唐肆廣庭也唐子猶周禮門子謂給使令者未始出域而有遺類言其多也閽者稱其材走者極其量堂途給事人皆能之各據為是而自足豈必殊尤卓絶哉其相非也又各不察其情而以意求勝寄而蹢閽所司閽耳説文閽常以昏閉門隸也何由夜半於無人之境而與舟人鬥意以為夜半無人之境則竟無人矣意以為與舟人鬥則竟鬥矣造怨者無窮而身固未離於岑也齊人之於宋楚人之寄本非族類不相習也無因而造怨則亦可夜半與舟人鬥矣是者之是莫得其所以是非者之非莫知其所以非舊注失之太遠未始離力智反注同於岑七金反徐在林反又語審反謂崖岸也獨上時掌反子字依世德堂本改莊子送葬過惠子之墓顧謂從者曰郢人堊慢其鼻端若蠅翼使匠石斫之匠石運斤成風聽而斫之盡堊而鼻不傷郢人立不失容宋元君聞之召匠石曰嘗試為寡人為之匠石曰臣則嘗能斫之雖然臣之質死久矣自夫子之死也吾無以為質矣吾無與言之矣瞑目恣手郢楚都也漢書揚雄傳作乃回反郢人謂泥畫之人也堊者白善士也漫汙也莊生送親知之葬過惠子之墓緬懷疇昔仍起斯譬瞑目恣手聽聲而斫運斤之妙遂成風聲若蠅翼者言其神妙也從者才用反郢人以井反楚都也漢書音義作人服虔云人古之善塗塈者施廣領大袖以仰塗而領袖不污有小飛泥誤著其鼻因令匠石揮斤而斫之音鐃韋昭乃回反盧文弨曰人舊訛作懮人案漢書揚雄解嘲云人亡則匠石輟斤今據改正下同又音鐃舊訛音混別本音溫亦訛俱改正堊烏路反慢本亦作漫郭莫干反徐莫但反李云猶塗也慶藩案慢當作説文地説文塗地也塗與塗同以之從巾聲籀文婚字今本訛為夒讀若水溫字注安溫也玉篇奴旦切徐鉉依唐韻乃昆切玉篇奴回奴昆二切廣韻回乃案二切廣雅曰墀塈塗也今本亦訛作字曹憲音奴回切鹽鐵論散不足篇富者堊今本訛作憂壁飾案人古人善塗塈者也施廣領大袖以仰塗而領袖不污有小飛泥誤著鼻因令匠石而斫知石之善斫故敢使斫之也見漢書揚雄傳服虔注去堊慢而鼻無傷損郢人立傍容貌不失元君聞其神妙嘗試召而為之為寡人于偽反非夫不動之質忘言之對則雖至言妙斫而無所用之質對也匠石雖巧必須不動之質莊子雖賢猶藉忘言之對蓋知惠子之亡莊子喪偶故匠人輟成風之妙響莊子息濠上之微言趙諫議本作漫闕誤引江南古藏本及李本之下有瞑目恣手四字又云一云四字是郭注乃字依廣韻改管仲有病桓公問之曰仲父之病病矣可不云至於大病則寡人惡乎屬國而可管仲姓管名仲字夷吾齊相也是鮑叔牙之友人桓公尊之號曰仲父桓公即小白也一匡天下九合諸侯而為霸主者管仲之力也病病者言是病極重也大病者至死也既將屬纊故臨問之仲父死後屬付國政與誰為可也大病謂死也惡乎音烏屬國音燭諱字依江南古藏本及李氏本改管仲曰公誰欲與公曰鮑叔牙問國政欲與誰答曰與鮑叔也欲與如字又音餘曰不可其為人潔廉善士也其於不己若者不比之又一聞人之過終身不忘使之治國上且鉤乎君下且逆乎民其得罪於君也將弗久矣姓鮑字叔牙貞廉清潔善人也而庸猥之人不如己者不比數之一聞人之過至死不忘率性廉直不堪宰輔上以忠直鉤束於君下以清明逆忤百姓不能和混故君必罪之管仲賢人通鑑於物恐危社稷慮害叔牙故不舉之也且鉤鉤反也亦作拘音同又音俱公曰然則孰可對曰勿已則隰朋可其為人也上忘而下畔愧不若黃帝而哀不己若者以德分人謂之聖以財分人謂之賢以賢臨人未有得人者也以賢下人未有不得人者也其於國有不聞也其於家有不見也勿已則隰朋可高而不亢姓隰名朋齊賢人也畔猶望也混高卑一榮辱故己為卿輔能遺富貴之尊下撫黎元須忘皂隸之賤事不得止用之可也上忘而下畔言在上不自高於下無背者也故無棄人不及己者但懷哀悲輔弼齊侯期於淳朴心之所愧不逮軒轅也聖人以道德拯物賢人以財貨濟人也若皆聞見則事鍾於己而群下無所措手足故遺之可也未能盡遺故僅可也運智明察臨於百姓逆忤物情叔牙治國則不問物之小瑕治家則不見人之過勿已則隰朋可總結以前義下人遐嫁反所措七故反故僅其靳反吳王浮於江登乎狙之山衆狙見之恂然棄而走逃於深蓁有一狙焉委蛇攫搔蟲改爪見巧乎王王射之敏給搏捷矢王命相者趨射之狙執死敏疾也給續括也狙獮猴也山多獮猴故謂之狙山也恂怖懼也蓁棘叢也委蛇從容也攫搔蟲改爪騰擲也敏給猶速也吳王浮江遨遊眺望衆狙恂懼走避深棘獨一老狙恃便敖王王既怪怒急速射之狙七徐反恂然音舜徐音荀又思俊反司馬云遽也深蓁徐仕巾反一音側巾反委於危反蛇餘支反攫俱縛反徐居碧反三蒼云搏也郭又七反司馬本作攫盧文弨曰攫不應與上同或是獶字之誤本又作搔素報反徐本作七活反司馬本作條見賢遍反巧如字或苦孝反崔本作攻王射食亦反下同捷速也矢往雖速而狙猶能搏之搏接也捷速也矢箭也箭往雖速狙皆接之其敏捷也如此搏音博俞樾曰郭於敏給下出注曰敏疾也給續括也是以敏給屬王言殆非也敏給二字同義後漢書酈炎傳言論給捷李賢注曰給敏也是其證也故國語晉語曰知羊舌職之聰敏肅給也使佐之荀子性惡篇曰齊給便敏而無類並以敏給對言然則郭以給為續括非古義矣敏給當以狙言謂狙性敏給能搏捷矢也捷讀為接爾雅釋詁接捷也是捷與接聲近義通莊十二年左氏經文宋萬弒其君捷僖三十二年鄭伯捷卒文十六年晉人納捷災於邾公羊捷並作接人間世篇必將乘人而鬥其捷釋文曰捷本作接此捷接通用見於本書者搏捷矢即搏接矢謂以手搏而接其矢也郭注曰捷速也夫矢自無不速又何必言捷乎命召也相助也謂王之左右也王既自射不中乃召左右亂趨射之於是狙抱樹而死相者息亮反司馬云佐王獵者也趨射音促急也執死司馬云見執而死也世德堂本作抓假字依世德堂本改能搏依世德堂本改王顧謂其友顏不疑曰之狙也伐其巧恃其便以敖豫以至此殛也戒之哉嗟乎無以汝色驕人哉顏不疑歸而師董梧以助其色去樂辭顯三年而國人稱之姓顏字不疑王之友也殛死也豫我也狙矜伐徑巧恃賴方便傲慢於王遂遭死殛嗟此狡獸可以戒人勿淫聲色驕豪於世之狙也之猶是也本或作是其便婢面反以敖司馬本作悻云佷也稱其忘巧遺色而任夫素朴姓董名梧吳之賢人也鋤除去也既奉王教於是退歸悔過自新師於有道除其美色去其聲樂重素朴辭榮華修德三年國人稱其賢善董梧有道者也師其德以鋤色以助士居反本亦作鋤去樂起呂反趙諫議本作鋤南伯子綦隱几而坐仰天而噓顏成子入見曰夫子物之尤也形固可使若稿骸心固可使若死灰乎猶是齊物中南郭子綦也其隱几等義並具解內篇慶藩案南伯子綦齊物論作南郭子綦伯郭古聲相近故字亦通用唐韻正伯古讀若博周禮司几筵其柏席用萑亦借柏為槨鄭注以柏為槨字磨滅之餘非也説見經義述聞隱於靳反噓音虛顏成子綦門人也尤甚也每仰歎先生志物之甚必固形同稿骸心若死灰慕德殷勤有此嗟詠也入見賢遍反夫物之尤也音符一本作夫子則如字盧文弨曰今書夫下有子字曰吾嘗居山穴之中矣當是時也田禾一睹我而齊國之衆三賀之我必先之彼故知之我必賣之彼故鬻之若我而不有之彼惡得而知之若我而不賣之彼惡得而鬻之嗟乎我悲人之自喪者吾又悲夫悲人者吾又悲夫悲人之悲者其後而日遠矣以得見子綦為榮山穴齊南山也田禾齊王姓名子綦隱居山穴德音遐振齊王暫睹以見為榮所以一國之人三度慶賀也山穴之中司馬本同李云齊南山穴也一本作之口田禾齊君也尊德故國人慶之盧文弨曰即齊太公和我聲名在先故使物知我我便是賣於名聲故田禾見而販之鬻之羊六反若我韜光晦迹不有聲名彼之世人何得知我我若名價不貴彼何得見而販之只為不能滅迹匿端故為物之所賣鬻也彼惡音烏下同喪猶亡失也子綦悲歎世人捨己慕他喪失其道自喪息浪反夫道無得喪而物有悲樂故悲人之自喪者亦可悲也子綦知夫為之不足以救彼而適足以傷我故以不悲悲之則其悲稍去而泊然無心枯稿其形所以為日遠矣夫玄道沖虛無喪無樂是以悲人自喪及悲者雖復前後悲深淺稱異咸未偕道故亦可悲悲而又悲遣之又遣教既彰矣玄玄之理斯著與衆妙相符故日加深遠矣而泊步各反趙諫議本中作口仲尼之楚楚王觴之孫叔敖執爵而立市南宜僚受酒而祭曰古之人乎於此言已古之言者必於會同觴酒器之總名謂以酒燕之也爵亦酒器受一升人欲飲必先祭其先宜僚瀝酒祭故祝聖人願與孔子於此言論也觴之音商李云酒器之總名也孫叔敖執爵案左傳孫叔敖是楚莊王相孔子未生哀公十六年仲尼卒後白公為亂宜僚未嘗仕楚又宣十二年傳楚有熊相宜僚則與叔敖同時去孔子甚遠蓋寄言也曰丘也聞不言之言矣未之嘗言於此乎言之市南宜僚弄丸而兩家之難解孫叔敖甘寢秉羽而郢人投兵丘願有喙三尺聖人無言其所言者百姓之言耳故曰不言之言苟以言為不言則雖言出於口故為未之嘗言今將於此言於無言夫理而教不言矣教而理未之嘗言也是以聖人妙體斯趣故終日言而未嘗言也孔子應宜僚之請故於此亦言於無言矣此二子息訟以默淡泊自若而兵難自解姓熊字宜僚楚之賢人亦是勇士沈者也居於市南因號曰市南子焉楚白公勝欲因作亂將殺令尹子西司馬子綦言熊宜勇士也若得敵五百人遂遣使屈之宜僚正上下弄丸而戲不與使者言使因以劍乘之宜僚曾不驚懼既不從命亦不言他白公不得宜僚反事不成故曰兩家難解姓孫字叔敖楚之令尹甚有賢德者也郢楚都也投息也叔敖蘊藉實知高枕而逍遙會理忘言執羽扇而自得遂使敵國不侵折衝千里之外楚人無事修文德息其武略彰二子有此功能故可與仲尼晤言贊揚玄道也兩家之難乃旦反注同解音蟹注同司馬云宜僚楚之勇士也善弄丸楚白公勝將作亂殺令尹子西子期石乞曰市南有熊宜僚者若得之可以當五百人乃往告之不許也承之以劍不動弄丸如故曰吾亦不泄子白公遂殺子西子期歎息兩家已宜僚不預其患慶藩案太平御覽二百七十九引司馬云宜僚善弄丸白公脅之弄丸如故視釋文較略甘寢秉羽如字又音翮司馬本作云讀曰翮或作翅雩舞者之所執崔本作翼郢人投兵司馬云言叔敖願安寢恬臥以養德於廟堂之上折衝於千里之外敵國不敢犯郢人投兵無所攻伐也郢楚都也慶藩案太平御覽二百七十九引司馬云孫叔敖秉羽之舞郢人無所攻故投兵視釋文較略藩又案孫叔敖甘寢秉羽而郢人投兵淮南主術篇所謂昔孫叔敖恬臥而郢人無所害其鋒同意投兵謂無所用也高注曰但恬臥養德折衝千里之外敵國不敢犯即司馬注所本王念孫曰害其鋒三字義不相屬害當為用之誤謂無所用其鋒也隸書害作其上半與用相似案淮南多本莊子此云投兵亦謂無所用之也王氏正害字義頗精苟所言非己則雖終身言故為未嘗言耳是以有喙三尺未足稱長凡人閉口未是不言喙口也苟其言當即此無言假余喙長三尺與閉口何異故願有之也喙許穢反又丁豆反或昌鋭反三尺三尺言長也司馬云喙息也宜僚弄丸而弭難叔敖除備以折衝丘亦願有歎息其三尺三尺匕首劍慶藩案下三十四字原誤入疏文下彼之謂不道之道此之謂不言之辨故德總乎道之所一而言休乎知之所不知至矣道之所一者德不能同也知之所不能知者辨不能舉也名若儒墨而凶矣故海不辭東流大之至也聖人并包天地澤及天下而不知其誰氏是故生無爵死無諡實不聚名不立此之謂大人狗不以善吠為良人不以善言為賢而況為大乎夫為大不足以為大而況為德乎夫大備矣莫若天地然奚求焉而大備矣知大備者無求無失無棄不以物易己也反己而不窮循古而不摩大人之誠彼謂二子彼謂所詮之理不道而道言非道非不道也此謂仲尼此謂能詮之教不言而言非言非不言也子玄乃云此謂仲尼斯注粗淺失之遠矣夫不道不言斯乃探微索隱窮理盡性豈二子之所能耶若以甘寢弄丸而稱息訟以默者此則默語懸隔丘何得有喙三尺乎故不可也又此一章盛談玄極觀其文勢不關孫熊明矣彼之謂此之謂郭云彼謂二子此謂仲尼也司馬云彼謂甘寢此謂弄丸道之所容者雖無方然總其大歸莫過於自得故一也總音總言止其分非至如何夫至道之境重玄之域聖心所不能知神口所不能辨若以言知索真失之遠矣故德之所總言之所默息者在於至妙之一道也各自得耳非相同也而道一也夫一道虛玄曾無涯量而德有上下誰不能周備也本有作同字者言德有優劣未能同道也此解前道之所一也不能同一本作相同非其分故不能舉夫知者玄道所謂妙絶名言故非辨説所能勝舉也此解前知之所不知也夫儒墨欲同所不能同舉所不能舉故凶夫執是競非而名同儒墨者凶禍斯及矣家世父曰儒墨之所以凶以有儒墨之名也懸儒墨之名以召爭德不能同者強道以一之辨不能舉者強知以通之各是其是而道與知之所及亦小矣生無爵死無諡實且不以自居名何有哉明受之無所辭所以成大百川競注東流不息而巨海容納曾不辭憚此據東海為言亦弘博之至也已泛然都任前舉海為此下合譬也聖人德合二儀故并包天地仁覃無外故澤及天下成而不處故不知誰為推功於人故莫識其氏族矣有而無之諡所以名功功不在己故雖諡而非己有夫人處世生有名位死定諡號所以表其實也聖人生既以功推物故死亦無可諡也令萬物各知足縱有財德悉分散於人也功非己為故名歸於物夫名以召實實既不聚故名將安寄也若為而有之則小矣總結以前忘於名諡之士可謂大德之人賢出於性非言所為善喜好也夫犬不必吠賢人豈復多言善吠伐廢反司馬云不別客主而吠不止善言司馬云失本逐末而言不止也夫大愈不可為而得夫好言為賢猶自不可況惑心取捨於大乎唯自然乃德耳愛心弘博謂之大冥符玄道謂之德夫有心求大於理尚乖況有情為德固不可也天地大備非求之也備具足也夫二儀覆載亭毒無心四敘周行生成庶品蓋何術焉而萬物必備知其自備者不舍己而求物故無求無失無棄也夫體弘自然之理而萬物素備者故能於物我之際淡然忘懷是以無取無捨無失無喪無證無得而不以物境易奪己心也不舍音捨反守我理我理自通只為弘備故契於至理既而反本還原會己身之妙極而無窮竟者也順常性而自至耳非摩拭循順也順於物性無心改作豈復摩飾而矜之循古而不摩一本作磨郭云摩拭也王云摩消滅也雖常通物而不失及己雖理於今常循於古之道焉自古及今其名不摩滅也摩拭音式不為而自得故曰誠誠實也夫反本還原因循萬物者斯乃大聖之人自實之德也趙諫議本凶下有也字子綦有八子陳諸前召九方歅曰為我相吾子孰為祥子綦楚司馬子綦也陳行列也諸於也九方姓也歅名也孰誰也祥善也九方歅善相者也陳列諸子於庭前命方歅令相之八子之中誰為吉善九方歅音因李烏雞反又音煙善相馬人淮南子作九方皋為我于偽反相吾子息亮反九方歅曰梱也為祥梱子名也言八子之中梱最祥善也梱音困又口本反子綦子名子綦瞿然喜曰奚若曰梱也將與國君同食以終其身瞿然驚喜貌聞子吉祥故容貌驚喜問其祥善貌相如何瞿然紀具反司馬云喜貌本亦作矍吁縛反字林云大視貌李云驚視貌慶藩案此瞿然與庚桑楚篇懼然皆驚駭之貌瞿説文作云舉目驚然也漢書吳王濞傳膠西王瞿然駭師古注瞿然無守之貌又鄒陽傳長君懼然曰將為奈何師古注懼讀為瞿瞿然無守之貌東方朔傳於是吳王懼然易容師古注懼然失守之貌案師古訓瞿懼為失守貌為無守貌者本齊風東方未明篇狂夫瞿瞿毛傳也不知傳以下不能辰夜二語故以瞿瞿為無守與瞿然不同瞿然當從李頤此訓為正子綦索然出涕曰吾子何為以至於是極也索然涕出貌方歅識見淺近以食肉為祥子綦鑒深玄妙知其非吉故憫其凶極悲而出涕索然悉各反又色白反司馬云涕下貌九方歅曰夫與國君同食澤及三族而況父母乎今夫子聞之而泣是禦福也子則祥矣父則不祥三族謂父母族也妻族也禦拒扞也夫共國君食尊榮富貴恩被三族何但二親子享吉祥父翻涕泣斯乃禦福德也禦福魚呂反距也逆也世德堂本況下有於字子綦曰歅汝何足以識之而梱祥邪盡於酒肉入於鼻口矣而何足以知其所自來吾未嘗為牧而牂生於奧未嘗好田而鶉生於宎若勿怪何邪吾所與吾子遊者遊於天地吾與之邀樂於天吾與之邀食於地吾不與之為事不與之為謀不與之為怪吾與之乘天地之誠而不以物與之相攖吾與之一委蛇而不與之為事所宜今也然有世俗之償焉凡有怪徵者必有怪行殆乎非我與吾子之罪幾天與之也吾是以泣也自從也方歅小巫識鑒不遠相梱祥者不過酒肉味入於鼻口方歅道術理盡於斯詎知酒肉由來從何而至夫所以怪出於不意故也牂羊也奧西南隅未地羊位也宎東南隅辰地也辰為鶉位故言牂鶉生也夫羊須牧養鶉因田獵若祿藉功著然後可致富貴今梱而功行未聞而與國君同食何異乎無牧而忽有羊也不田而獲鶉也非牧非田怪如何也未嘗如字本或作曾才能反而牂子郎反爾雅云牝羊也於奧烏報反西南隅未地也一曰豕牢也好田呼報反於宎字又作烏弔反徐烏了反司馬云東北隅也一云東南隅鶉火地生鶉也一云窟也郭徒忽反字則穴下犬盧文弨曰案爾雅釋宮東南隅謂之窔其東北隅乃宧也又案説文戶樞聲室之東南隅窔但訓深家世父曰牂所從出牧也鶉所從來田也不牧而牂生不田而鶉生儻然而來倏然而至謂之不祥祥者怪徵也乘天地之誠而有世俗之償是亦怪徵也不有所為遊於天地司馬本地作汨云亂也崔本同隨所遇於天地耳邀遇也邀遇也天地無心也子綦體道虛忘順物自足於性分之內敖遊乎天地之間所造皆適不待歡娛所遇斯食豈資厚味耶邀古堯反遇也樂音洛怪異也循常任性脫然自爾忘物故不為事忘智故不為謀循常故不為怪斯不為也誠實也乘二儀之實道順萬物以逍遙故不與物更相攖擾斯順耳無擇也委蛇猶縱任也心境不二從容任物事既非事何宜便之可為乎夫有功於物物乃報之吾不為功而償之何也夫報功德者世俗務也苟體道任物不立功名何須功之償哉之償時亮反又音賞今無怪行而有怪徵故知其天命也殆危也幾近也夫有怪異之行者必有怪異之徵祥也今吾子未有怪行而有怪徵必遭殆者斯乃近是天降之災非吾子之罪怪行下孟反注同夫為而然者勿為則已矣不為而自至則不可奈何也故泣之罪若由人庶其修改既關天命是以泣也闕誤引江南古藏本地下有也字爾雅釋文作云又作窔同説文作無幾何而使梱之於燕盜得之於道全而鬻之則難不若刖之則易於是乎刖而鬻之於齊適當渠公之街然身食肉而終全恐其逃故不如刖之易售也無幾何謂俄頃間也楚使梱聘燕途道之上為賊所得略梱為奴而全形賣之恐其逃竄故難防禦則刖足不慮其逃故易售無幾居豈反於燕音煙全而鬻之音育絶句一本作鬻之難刖音月又五刮反易以豉反注同售也受又反渠公齊之富人為街正梱之既遭刖足賣與齊國富商之家代主當街終身肉食也字又作術者云渠公屠人也賣梱在屠家共主行宰殺之術終身食肉也渠公或云渠公齊之富室為街正買梱自代終身食肉至死一云渠公屠者與梱君臣同食肉也之街音隹一本作術然身食肉終本或作身肉食者誤盧文弨曰今書終上有而字齧缺遇許由曰子將奚之齧缺逢遇許由仍問欲何之適曰將逃堯答曰將欲逃避帝堯曰奚謂邪問其何意曰夫堯畜畜然仁吾恐其為天下笑後世其人與人相食與夫民不難聚也愛之則親利之則至譽之則勸致其所惡則散愛利出乎仁義捐仁義者寡利仁義者衆夫仁義之行唯且無誠且假乎禽貪者器是以一人之斷制利天下譬之猶一覕也夫堯知賢人之利天下也而不知其賊天下也夫唯外乎賢者知之矣仁者爭尚之原故也畜畜盛行貌也盛行偏愛之仁乖於淳和之德恐宇內喪道之士猶甚澆季將來逐迹百姓飢荒食廩既虛民必相食是以逃也畜畜許六反郭他六反李云行仁貌王云恤愛勤勞之貌其人與如字人相食與音餘言將馳走於仁義不復營農飢則相食夫民撫愛則親利益則至來譽贊則相勸勉與所惡則衆離散故黔首聚散蓋不難也譽之音餘所惡烏路反仁義既行將偽以為之夫利益蒼生愛育群品立功聚衆莫先仁義而履仁蹈義捐率於中者少託於聖迹以規名利者多是故行仁義者矯性偽情無誠實者也之行下孟反仁義可見則夫貪者將假斯器以獲其志器聖迹也且貪於名利險於禽獸者必假夫仁義為其器者也且假夫禽貪者器司馬云禽之貪者殺害無極仁義貪者傷害無窮若夫仁義各出其情則其斷制不止乎一人榮利之徒負於仁義恣其鴆毒斷制天下向無聖迹豈得然乎覕割也萬物萬形而以一劑割之則有傷也覕割也若以一人制服天下譬猶一刀割於萬物其於損傷彼此多矣覕郭薄結反云割也向芳舌反司馬云暫見貌又甫邪反又普結反又初栗反劑子隨反外賢則賢不偽夫賢聖之迹為利一時萬代之後必生賊害唯能忘外賢聖者知之也世德堂本作夫趙諫議本之下有也字有暖姝者有濡需者有卷婁者此略標下解釋暖吁爰反又吁晚反柔貌姝昌朱反妖貌濡音儒又音如安也需音須濡需謂偷安須臾之頃卷音權婁音縷卷婁猶拘攣也所謂暖姝者學一先生之言則暖暖姝姝而私自説也自以為足矣而未知未始有物也是以謂暖姝者也意盡形教豈知我之獨化於玄冥之竟哉暖姝自許之貌也小見之人學問寡薄自悅自足謂窮微極妙豈知所學未有一物可稱也是以謂暖姝者此言結前也自説音悅之竟音境自字依正文補濡需者豕蝨是也擇疏鬣自以為廣宮大囿奎曲隈乳間股腳自以為安室利處不知屠者之一旦鼓臂布草操煙火而己與豕俱焦也此以域進此以域退此其所謂濡需者也濡需矜誇之貌也豕豬也言蝨寄豬體上擇疏長之毛鬣將為廣大宮室苑囿蹄腳奎隈之所股腳乳旁之間蹄用為溫暖利便豈知屠人忽操湯火攘臂布草而殺之乎即己與豕俱焦爛者也流俗寡識之人耽好情欲與豕蝨濡需喜歡無異也蝨音瑟奎苦圭反本亦作睽曲隈烏回反向云股間也慶藩案曲隈胯內也凡言隈者皆在內之名淮南覽冥篇漁者不爭隈高注隈曲深處魚所聚也列子黃帝篇何曲之淫隈殷敬順曰隈水曲也僖二十五年左傳秦人過析隈杜注隈隱蔽之處故知言隈者皆在內曲深之謂向秀曰隈股間也疑誤暖室奴緩反又虛袁反一本作安室盧文弨曰今書作安室操七曹反域境界也蝨則逐豕而有亡人則隨境而榮樂故謂之域進退也非夫通變邈世之才而偷安乎一時之利者皆豕蝨者也此結也家世父曰以域進以域退言逐衆人之好惡而與之為進退暖姝者囿於知識者也濡需者滯於形迹者也卷婁者罷於因應者也三者同蔽莊生所以逃而去之闕誤引張君房本鬣下有長毛二字卷婁者舜也羊肉不慕蟻蟻慕羊肉羊肉羶也舜有羶行百姓悅之故三徙成都至鄧之虛而十有萬家堯聞舜之賢舉之童土之地曰冀得其來之澤舜舉乎童土之地年齒長矣聰明衰矣而不得休歸所謂卷婁者也卷婁者謂背項俯曲向前攣卷而傴僂也夫羊肉羶腥無心慕蟻蟻聞而歸之舜有仁行不慕百姓百姓悅之故羊肉比舜蟻況百姓羊肉不慕蟻魚綺反李云年長心勞無憂樂之志是猶羊肉不慕蟻也羶也設然反羶行下孟反舜避丹朱又不願衆聚故三度逃走移徙避之百姓慕德從者十萬所居之處自成都邑至鄧虛地名也至鄧向云邑名之虛音墟本又作墟地無草木曰童土堯聞舜有賢聖之德妻以娥皇女英舉以自代讓其天下居不毛土歷試艱難望鄰境承儀蒼生蒙澤童土如字又音杜向云童土地無草木也聖人之形不異凡人故耳目之用衰也至於精神則始終常全耳若少則未成及長而衰則聖人之聖曾不崇朝可乎既登九五威跨萬乘念蒼生憂憐凡庶於是年齒長老耳目衰竭無由休息豈得歸寧傴僂攣卷形勞神倦所謂卷婁者也齒長丁丈反注同慶藩案華嚴經音義引司馬云齒數也釋文闕若少詩召反趙諫議本作墟趙本無耳字是以神人惡衆至衆至則不比不比則不利也故無所甚親無所甚疏抱德煬和以順天下此謂真人於蟻棄知於魚得計於羊棄意衆自至耳非好而致也三徙遠之以惡也惡衆烏路反非好呼報反明舜之所以有天下蓋於不得已耳豈比而利之比和也夫衆聚則不和不和則不利於我也不比毗志反下注同煬溫也夫不測神人親疏一觀抱守溫和可謂真聖煬郭音羊徐餘亮反和李云煬炙也為和氣所炙於民則蒙澤於舜則形勞不慕羊肉之仁故於蟻棄智也不為羶行教物故於羊棄意也既遣仁義合乎至道不傷濡沫相忘於江湖故於魚得計此斥虞舜羶行故及斯言也於蟻棄知音智於魚得計於羊棄意司馬云蟻得水則死魚得水則生羊得水則病一説云真人無羶故不致蟻是蟻棄知也共處相忘之大道無沾濡之德是魚得計也羊無羶行而不致蟻是羊棄意也家世父曰所惡乎衆至者惡其比也所以比者歆其利也神人衆至不比正惟不以利歆之蟻之附羶也有利而趨之也即其知也羊之羶也與以可歆之利也即其意也蟻無知而有知羊無意而有意惟羶之惟利也魚相忘於江湖人相忘於道術何羶之可慕哉故曰於魚得計世德堂本也作之趙諫議本無以目視目以耳聽耳以心復心若然者其平也繩其變也循古之真人以天待不以人入天古之真人得之也生失之也死得之也死失之也生此三者未能無其耳目心意也夫視目之所見聽耳之所聞復心之所知不逐物於分外而知止其分內者其真人之道也未能去繩而自平繩無心而正物聖忘懷而平等能去起呂反未能絶迹而玄會循順也處世和光千變萬化大順蒼生曾不逆寡居無事以待事事斯得如上所解即是玄古真人用自然之道虛其心以待物以有事求無事事愈荒不用人事取捨亂於天然之智死生得失各隨其所居耳於生為得於死或復為失未始有常也夫處生而言即以生為得若據死而語便以生為喪死生既其無定得失的在誰邊噫未可知也是以混死生一得喪故謂之真人矣家世父曰形氣之相須也得之生失之死有比而合之者也自然之待化也得之死失之生有委而聽之者也得之生故有為而無為得之死故無為而無不為或復扶又反人字依闕誤引張君房本改藥也其實堇也桔梗也雞壅也豕零也是時為帝者也何可勝言當其所須則無賤非其時則無貴貴賤有時誰能常也堇烏頭也治風痹桔梗治心腹血雞壅即雞頭草也服延年豕零豬苓根也似豬卵治渴病此並賤藥也帝君主也夫藥無貴賤愈病則良藥病相當故便為君主乃至目視耳聽手捉心知用有行藏時有興廢故時之所賢者為君才不應世者為臣此事必然故何可言盡也堇音謹郭音覲徐音靳司馬云烏頭也治風冷痹桔音結本亦作結梗古猛反司馬云桔梗治心腹血瘀瘕痹雞壅徐於容反本或作壅音同司馬云即雞頭也一名芡與藕子合為散服之延年豕零司馬本作豕囊云一名豬苓根似豬卵可以治渴案四者皆藥草名是時為帝者也司馬云藥草有時迭相為帝謂其王相休廢各得所用也慶藩案時者更也帝者主也言堇桔梗雞壅豕零更相為主也方言曰蒔更也蒔郭音侍古無蒔字借時字為之爾雅曰帝君也淮南正論篇時舉而代御齊俗篇此代為帝者也帝今本誤作常太平御覽引馮衍鄧禹箋此更為通適者也適讀若嫡廣雅嫡君也或言時或言代或言更其義一也方言更代也説文代更也勝言音升句踐也以甲楯三千棲於會稽唯種也能知亡之所以存唯種也不知其身之所以愁故曰鴟目有所適鶴脛有所節解之也悲句踐越王也會稽山名也越為吳軍所殘窘迫退走棲息於會稽山上也句踐音鉤甲楯純尹反徐音尹棲於音西李云登山曰棲會古外反稽音雞種越大夫名其時句踐大敗兵唯三千走上會稽山亡滅非遠而種密謀深智亡時可當時矯與吳和後二十年而滅吳矣夫狡兔死良狗烹敵國滅忠臣亡數其然也平吳之後范蠡去越而遊乎江海變名易姓韜光晦迹即陶朱公是也大夫種不去為句踐所誅但知國亡而可以存不知愁身之必死也字亦有作穜者隨字讀之穜章勇反越大夫名也吳越春秋云姓文字少禽所以存本又作可以存言知越雖亡可以存也各適一時之用不能靡所不可則有時而失有時而失故有時而悲矣解去也鴟目晝暗而夜開則適夜不適晝鶴脛稟分而長則能長不能短枝節如此故解去則悲亦猶種暗於謀身長於存國也鴟尺夷反脛刑定反解之佳買反司馬云去也一音懈故曰風之過河也有損焉日之過河也有損焉請只風與日相與守河而河以為未始其攖也恃源而往者也故水之守土也審影之守人也審物之守物也審有形者自然相與為纍唯外乎形者磨之而不磷風日是氣河有形質凡有形氣者未能無纍也而風吹日纍必有損傷恃源而往所以不覺亦猶吳得越之後謀臣必恃謂其功勳謂以無後無慮遭戮是知物相利者必相為害也有損有形自然相纍世能纍物物能纍人故大夫種所以不免也不磷鄰刃反實已損矣而不自覺所以不覺非不損也恃源往也恃賴也攖損也風之與日相與守河於河攖損而不知覺恃其源流恃本亦作持源而往者也水由源往雖遇風日不能損也道成其性雖在於世不能移也無意則止於分所以為審審安定也夫水非土則不安影無人則不見物無造物則不立故三者相守而自以為固而新故不住存亡不停昨日之物於今已化山舟替遁昧者不知斯之義也世德堂本乎作夫故目之於明也殆耳之於聰也殆心之於殉也殆凡能其於府也殆殆之成也不給改禍之長也茲萃其反也緣功其果也待久而人以為己寶不亦悲乎故有亡國戮民無已不知問是也有意則無崖故殆殉逐也夫視目所見聽耳所聞心所逐若目求離朱之明耳索師曠之聰心逐無崖之知欲不危殆其可得乎家世父曰水之守土二物也相比而相須也影之守人一物而為二物也自生而自化也物之守物物還而自證也抱一者也所以謂之審者無外馳也目馳而明生焉耳馳而聰出焉心馳而所殉見焉凡能於其府者皆外馳也其所自持而緣之以為功致果以求之積久而不知所歸役耳目心思之用以與萬物為攖故可悲也所以貴其無能而任其天然夫運分別之智出於藏府而自伐能者必致危亡也故雖有成功不還周給而改悔矣萃聚也苟不能忘知則禍之長也多端矣滋多也萃聚也役於藏府自顯其能故凶災禍患增長而多聚之也之長丁丈反注同茲莘所巾反郭云聚也李云多也本又作萃反守其性則其功不作而成自伐己能而反招禍敗者緣於功成不退故也欲速則不果夫誠意成功決定矜伐有待之心其日固久己寶謂有其知能流之人心處愚暗寶貴己能成功而處執滯如是甚可悲傷皆有其身之禍貪土地為己有大寶取之無道國破家亡殘害黎元無數無窮已也不知問禍之所由由乎有心而修心以救禍也世有明人是為龜鏡不知問禍敗所由唯惡貧賤愚之至也今本作萃故足之於地也踐雖踐恃其所不蹍而後善博也人之於知也少雖少恃其所不知而後知天之所謂也知大一知大陰知大目知大均知大方知大信知大定至矣大一通之大陰解之大目視之大均緣之大方體之大信稽之大定持之踐蹍俱履蹈也夫足之能行必履於地仍賴不踐之土而後得行若無餘地則無由安善而致博遠也此舉譬也恃其所不蹍女展反李云一足常不往故能行廣遠也俞樾曰兩踐字並當作淺或字之誤或古通用也足之於地止取容足而已故曰足之於地也淺然容足之外雖皆無用之地而不可廢也故曰雖淺恃其所不蹍而後善博也外物篇曰夫地非不廣且大也人之所用容足耳然則廁足而墊之致黃泉人尚有用乎即此義也下文曰人之知也少雖少恃其所不知而後知天之所謂也少與淺文義相近若作踐則不可通矣夫忘天地遺萬物然後蜩翼可得而知也況欲知天之所謂而可以不無其心哉知有明暗能有少多各止其分則物逍遙是以地藉不踐而得行心賴不知而能照所以處寂養恬天然之理故老經云有之以為利無之以為用此合也此略標能知七大之名可謂造極自此以下歷解義道也一是陽數大一天也能通生萬物故曰通用其分內則萬事無滯也大陰地也無心運載而無分解物形之也解之音蟹下同又佳買反用萬物之自見亦大目也各視其所見大目因其本性令各自得則大均也緣順也大順則物物各性足均平令各力呈反下同體之使各得其分則萬方俱得所以為大方也萬物之形各有方術蜘蛛結網之類斯體達之命之所期無令越逸斯大信也信實也稽至也循而任之各至其實斯大信也真不撓則自定故持之以大定斯不持也物各信空持而用之其理空矣不撓乃孝反盡有天循有照冥有樞始有彼則其解之也似不解之者其知之也似不知之也不知而後知之其問之也不可以有崖而不可以無崖頡滑有實古今不代而不可以虧則可不謂有大揚榷乎闔不亦問是已奚惑然為以不惑解惑復於不惑是尚大不惑夫物未有無自然者也上來七大未有不由其自然者也循之則明無所作也循順也但順其天然智自明照至理有極但當冥之則得其樞要也窈冥之理自有樞機而用之無勞措意也樞尺朱反始有之者彼也故我述而不作郭注云始有之者彼也故我述而不作也夫解任彼則彼自解解之無功故似不解體從彼學而解也戒成性故不似不解明彼知也能忘其知故似不知也我不知則彼知自用彼知自用則天下莫不皆知也不知而知知而不知非知而知故不知而後知此是真知應物宜而無方各以其分萬物雖頡滑不同而物物各自有實也頡滑不同也萬物紛擾頡滑不同統而治之咸資實道頡徐下結反滑乎八反向云頡滑謂錯亂也各自有故不可相代古自在古不從古以來今今自存今亦不從今以生古物各有性新故不相代換也宜各盡其分也時不往來法無遷貿豈賴古以為今耶榷而揚之有大限也如上所問其道廣大豈不謂顯揚妙理而榷實論之乎揚榷音角又苦學反三蒼云榷敵也許慎云揚榷粗略法度王云榷略而揚顯之慶藩案釋文引三蒼云榷敵也敵當作敲説文榷敲擊也漢書五行志榷其眼師古注云榷謂敲擊去其精也敵敲二文以形近而誤若問其大榷則物有至分故忘己任物之理可得而知也奚為而惑若此也闔何不也奚何無識之類若夜遊何不詢問聖人及其弱喪而迷惑困苦如是何為也夫惑不可解故尚大不惑愚之至也是以聖人從而任之所以皇王殊迹隨世為名也不惑聖智惑於凡情也以聖智之言辨於凡惑忘得反本復乎真根而不能得意忘言而執乎聖迹貴重明言以不惑為大此乃欽尚不惑豈能除惑哉斯又遣於不惑也惑解佳買反注同復於音服又扶又反趙諫議本不亦作亦不唐寫本惑下有也字
