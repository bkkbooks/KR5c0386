body:
  text: 內篇大宗師第六雖天地之大萬物之富其所宗而師者無心也大宗師崔云遺形忘生當大宗此法也知天之所為知人之所為者至矣知天之所為者天而生也知人之所為者以其知之所知以養其知之所不知終其天年而不中道夭者是知之盛也知天人之所為者皆自然也則內放其身而外冥於物與衆玄同任之而無不至者也天者自然之謂至者造極之名天之所為者謂三景晦明四時生殺風雲舒卷雷雨寒溫也人之所為者謂手捉腳行目視耳聽心知工拙凡所施為也知天之所為悉皆自爾非關修造豈由知力是以內放其身外冥於物浩然大觀與衆玄同窮理盡性故稱為至也天者自然之謂也夫為為者不能為而為自為耳為知者不能知而知自知耳自知耳不知也不知也則知出於不知矣自為耳不為也不為也則為出於不為矣為出於不為故以不為為主知出於不知故以不知為宗是故真人遺知而知不為而為自然而生坐忘而得故知稱絶而為名去也雲行雨施川源嶽瀆非關人力此乃天生能知所知並自然也此解前知天之所為天而生向崔本作失而生知稱尺證反人之生也形雖七尺而五常必具故雖區區之身乃舉天地以奉之故天地萬物凡所有者不可一日而相無也一物不具則生者無由得生一理不至則天年無緣得終然身之所有者知或不知也理之所存者為或不為也故知之所知者寡而身之所有者衆為之所為者少而理之所存者博在上者莫能器之而求其備焉人之所知不必同而所為不敢異異則偽成矣偽成而真不喪者未之有也或好知而不倦以困其百體所好不過一枝而舉根俱弊斯以其所知而害所不知也若夫知之盛也知人之所為者有分故任而不也知人之所知者有極故用而不蕩也故所知不以無涯自困則一體之中知與不知暗相與會而俱全矣斯以其所知養所不知者也人之所為謂四肢百體各有御用也知之所知者謂目知於色即以色為所知也知之所不知者謂目能知色不能知聲即以聲為所不知也既而目為手足而視腳為耳鼻而行雖復無心相為而濟彼之功成矣故眼耳鼻舌四肢百體更相役用各有司存心之明暗亦有限極用其分內終不強知斯以其知之所知以養其知之所不知也故得盡其天年不橫夭折能如是者可謂知之盛美者也不喪息浪反下皆同或好呼報反下同不強其兩反盧文弨曰今本書作強雖然有患夫知有所待而後當其所待者特未定也庸詎知吾所謂天之非人乎所謂人之非天乎雖知盛未若遺知任天之無患也知雖盛美猶有患纍不若忘知而任獨也夫知者未能無可無不可故必有待也若乃任天而生者則遇物而當也有待則無定也夫知必對境非境不當境既生滅不定知亦待奪無常唯當境知兩忘能所雙絶者方能無可無不可然後無患也已我生有涯天也心欲益之人也然此人之所謂耳物無非天也天也者自然者也人皆自然則治亂成敗遇與不遇非人為也皆自然耳近取諸身遠託諸物知能運用無非自然是知天之與人理歸無二故謂天則人謂人則天凡庸之流詎曉斯旨所言吾者莊生自稱此則泯合人天混同物我者也庸詎徐其庶反則治直吏反天也二字依世德堂本補且有真人而後有真知何謂真人古之真人不逆寡不雄成不謨士若然者過而弗悔當而不自得也若然者登高不栗入水不濡入火不熱是知之能登假於道者也若此有真人而後天下之知皆得其真而不可亂也夫聖人者誠能冥真合道忘我遺物懷茲聖德然後有此真知是以混一真人而無患纍真之狀列在下文耳假設疑問庶顯其旨凡寡皆不逆則所願者衆矣寡少也引古御今崇本抑末虛懷任物大順群生假令微少曾不逆忤者也不恃其成而處物先為而不恃長而不宰豈雄據成績欲處物先耶縱心直前而群士自合非謀謨以致之者也虛夷忘淡士衆自歸非關運心謀謨招致故也不謨沒乎反直自全當而無過耳非以得失經心者也天時已過曾無悔吝之心分命偶當不以自得為美也俞樾曰過者謂於事有所過失也當者謂行之而當也在衆人之情於事有所過失則悔矣行之而當則自以為得矣真人不然故曰過而弗悔當而不自得也正文明言過郭注謂全當而無過失之言夫知之登至於道者若此之遠也理固自全非畏死也故真人陸行而非避濡也遠火而非逃熱也無過而非措當也故雖不以熱為熱而未嘗赴火不以濡為濡而未嘗蹈水不以死為死而未嘗喪生故夫生者豈生之而生哉成者豈成之而成哉故任之而無不至者真人也豈有概意於所遇哉栗懼也濡溼也登升也假至也真人達生死之不二體安危之為一故能入水入火曾不介懷登高履危豈復驚懼真知之士有此功能升至玄道故得如是者也不栗音栗不濡而朱反登假更百反至也遠火于萬反有概古愛反古之真人其寢不夢其覺無憂其食不甘其息深深真人之息以踵衆人之息以喉屈服者其嗌言若哇其耆欲深者其天機淺無意想也當所遇而安也夢者情意妄想也而真人無情慮絶思想故雖寢寐寂泊而不夢以至覺悟常適而無憂也其覺古孝反理當食耳混迹人間同塵而食不耽滋味故不知其美乃在根本中來者也踵足根也真人心性和緩智照凝寂至於氣息亦復徐遲腳踵中來明其深靜也深深李云內息之貌家世父曰存息於無息之地而後納之深泊然寂然無出無入無往無來鬱怒之所不能結耆欲之所不能加百骸九竅六藏一不與為灌輸而退而寄之於踵乃以養息於深微博厚而寓諸無窮以踵章勇反王穆夜云起息於踵遍體而深氣不平暢嗌喉也哇也凡俗之人心靈馳競言語喘息唯出咽喉情躁氣促不能深靜屈折起伏氣不調和咽喉之中恆如哇也以喉向云喘悸之息以喉為節言情欲奔競所致其嗌音益郭音厄厄咽喉也若哇獲媧反徐胡卦反又音絓崔一音於佳反結也言咽喉之氣結礙不通也簡文云哇嘔也深根寧極然後反一無欲也夫耽耆諸塵而情欲深重者其天然機神淺鈍故也若使智照深遠豈其然乎其耆市志反古之真人不知説生不知惡死其出不欣其入不距翛然而往翛然而來而已矣不忘其所始不求其所終受而喜之忘而復之是之謂不以心捐道不以人助天是之謂真人與化為體者也氣聚而生生為我時氣散而死死為我順既冥變化故不以悅惡存懷説生音悅惡死烏路反泰然而任之也時應出生本無情於欣樂時應入死豈有意於距諱耶不欣音欣又音祈不距本又作拒音巨李云欣出則營生距入則惡死寄之至理故往來而不難也翛然無係貌也翛然獨化任理遨遊雖復死往生來曾無意戀之者也修然音蕭本又作倏徐音叔郭與久反李音悠向云翛然自然無心而自爾之謂郭崔云往來不難之貌司馬云倏疾貌李同盧文弨曰舊久訛冬今從宋本正終始變化皆忘之矣豈直逆忘其生而猶復探求死意也始生也終死也生死都遣曾無滯著豈直獨忘其生而偏求於死邪終始均平所遇斯適也猶復扶又反下非復同不問所受者何物遇之而無不適也喜所遇也復之不由於識乃至也反未生也人生而靜天之性也感物而動性之欲也物之感人無窮人之逐欲無節則天理滅矣真人知用心則背道助天則傷生故不為也是謂者指斥前文總結其旨也捐棄也言上來智惠忘生可謂不用取捨之心捐棄虛通之道亦不用人情分別添助自然之分能如是者名曰真人也捐徐以全反郭作揖一入反崔云或作楫所以行舟也盧文弨曰揖舊訛楫案下方云或作楫則此當作揖俞樾曰捐字誤釋文云郭作揖崔云或作楫所以行舟也其義彌不可通疑皆偝字之誤偝即背字故郭注曰真人知用心則背道助天則傷生是郭所據本正作偝也則背音佩趙諫議本受作愛不以心捐道當為不以心損道損今本缺壞誤作捐史記賈誼列傳索隱引此文正作損若然者其心志其容寂其顙頯淒然似秋暖然似春喜怒通四時與物有宜而莫知其極所居而安為志若如以前不捐道等心是心懷志力而能致然也故老經云強行者有志家世父曰郭象注所居而安為志應作其心志説文志心之所之也商書若射之有志孔疏云如射之有志志之所主欲得中也佛書性相如如常住不遷即此所謂其心志也慶藩案説文無志篆所引當出字林字書其心志當為其心忘志為忘字的形誤雖行而無傷於靜容本亦作寂崔本作盧文弨曰舊本訛家今改正説見前本書作寂頯大朴之貌顙額也頯大朴貌夫真人降世挺氣異凡非直智照虛明志力弘普亦乃威容間雅相貌端嚴日角月弦即斯類也其顙息黨反崔云也頯徐去軌反郭苦對反李音仇一音逵權也王云質朴無飾也向本作云然大朴貌廣雅云大也五罪反殺物非為威也淒然七西反生物非為仁也暖然音暄徐況晚反夫體道合變者與寒暑同其溫嚴而未嘗有心也然有溫嚴之貌生殺之節故寄名於喜怒也聖人無心有感斯應威恩適務寬猛逗機同素秋之降霜本無心於肅殺似青春之生育寧有意於仁惠是以真人如雷行風動木茂華敷覆載合乎二儀喜怒通乎四序無心於物故不奪物宜無物不宜故莫知其極真人應世赴感隨時與物交涉必有宜便而虛心慈愛常善救人量等太虛故莫知其極故聖人之用兵也亡國而不失人心利澤施乎萬世不為愛人故樂通物非聖人也有親非仁也天時非賢也利害不通非君子也行名失己非士也亡身不真非役人也若狐不偕務光伯夷叔齊箕子胥餘紀他申徒狄是役人之役適人之適而不自適其適者也堯攻叢支禹攻有扈成湯滅夏周武伐殷並上合天時下符人事所以興動干戈弔民問罪雖復殄亡邦國而不失百姓歡心故也亡國而不失人心崔云亡敵國而得其人心因人心之所欲亡而亡之故不失人心也夫白日登天六合俱照非愛人而照之也故聖人之在天下暖焉若春陽之自和故蒙澤者不謝淒乎若秋霜之自降故凋落者不怨也利物滋澤事等陽春豈直一時乃施乎萬世而芻狗百姓故無偏愛之情夫聖人無樂也直莫之塞而物自通夫懸鏡高臺物來斯照不迎不送豈有情哉大聖應機其義亦爾和而不唱非謂樂通故知授意於物非聖人者也至仁無親任理而自存至仁無親親則非至仁也時天者未若忘時而自合之賢也占玄象之虧盈候天時之去就此乃小智豈是大賢者也不能一是非之塗而就利違害則傷德而纍當矣未能一窮通均利害而擇情榮辱封執是非者身且不能自達焉能君子人物乎善為士者遺名而自得故名當其實而福應其身矯行求名失其己性此乃流俗之人非為道之士行名下孟反福應應對之應自失其性而矯以從物受役多矣安能役人乎夫矯行喪真求名亡己斯乃受人驅役焉能役人哉斯皆舍己效人徇彼傷我者也姓狐字不偕古之賢人又云堯時賢人不受堯讓投河而死務光黃帝時人身長七尺又云夏時人餌藥養性好鼓琴湯讓天下不受自負石沈於廬水伯夷叔齊遼西孤竹君之二子神農之裔姓薑氏父死兄弟相讓不肯嗣位聞西伯有道試往觀焉逢文王崩武王伐紂夷齊扣馬而諫武王不從遂隱於河東首陽山不食其粟卒餓而死箕子殷紂賢臣諫紂不從遂遭奴戮胥餘者箕子名也又解是楚大夫伍奢之子名員字子胥吳王夫差之臣忠諫不從抉眼而死尸沈於江紀他者姓紀名他湯時逸人也聞湯讓務光恐及乎己遂將弟子陷於窾水而死申徒狄聞之因以踣河此數子者皆矯情偽行亢志立名分外波蕩遂至於此自餓自沈促齡夭命而芳名令譽傳諸史籍斯乃被他驅使何能役人悅樂衆人之耳目焉能自適其情性耶狐不偕司馬云古賢人也務光皇甫謐云黃帝時人耳長七寸伯夷叔齊孤竹君之二子箕子胥餘司馬云胥餘箕子名也見尸子崔同又云尸子曰箕子胥餘漆身為厲被髮佯狂或云尸子曰比干也胥餘其名慶藩案書微子正義僖十五年左傳正義論語十八正義並引司馬云箕子名胥餘與釋文異紀他徒何反申徒狄殷時人負石自沈於河崔本作司徒狄皆舍音捨下同世德堂本脫蒙字世德堂本效作殉古之真人其狀義而不朋若不足而不承與乎其觚而不堅也張乎其虛而不華也邴邴乎其似喜乎崔乎其不得已乎滀乎進我色也與乎止我德也厲乎其似世乎謷乎其未可制也連乎其似好閉也悗乎忘其言也以刑為體以禮為翼以知為時以德為循以刑為體者綽乎其殺也以禮為翼者所以行於世也以知為時者不得已於事也以德為循者言其與有足者至於丘也二而人真以為勤行者也二一故其好之也一其弗好之也一其一也一其不一也一其一與天為徒其不一與人為徒天與人不相勝也是之謂真人與物同宜而非朋黨狀迹也義宜也降迹同世隨物所宜而虛己均平曾無偏黨也俞樾曰郭注訓義為宜朋為黨望文生訓殊為失之此言其狀豈言其德乎義當讀為峨峨與義並從我聲故得通用天道篇而狀義然義然即峨然也朋讀為崩易復象辭朋來無咎漢書五行志引作來無咎是也其狀峨而不者言其狀峨然高大而不崩壞也廣雅釋詁峨高也釋訓峨峨高也高與大義相近故文選西京賦神山峨峨薛綜注曰峨峨高大也天道篇義然即可以此説之郭不知義為峨之假字於此文則訓為宜於彼文則曰踶跂自持之貌皆就本字為説失之沖虛無餘如不足也下之而無不上若不足而不承也韜晦沖虛獨如神智不足率性而動然自得故無所稟承者也不承如字李云迎也又音拯不上時掌反常遊於獨而非固守觚獨也堅固也倣徨放任容與自得遨遊獨化之場而不固執之與乎如字又音豫同云疑貌盧文弨曰同當是向字之誤其觚音孤王云觚特立群也崔云觚稜也俞樾曰郭注曰常遊於獨而非固守是讀觚為孤然與不堅之義殊不相應釋文引崔云觚稜也亦與不堅之義不應殆皆非也養生主篇技經綮之未嘗而況大軱乎釋文引崔云不槃結骨疑此觚字即彼軱字骨之槃結是至堅者也軱而不堅是謂真人崔不知觚軱之同字故前後異訓耳李楨曰與乎其觚與張乎其虛對文觚字太不倫據注疏觚訓獨釋文引王云觚特立不倚也並是孤字之義知所據本必皆作孤觚是假借爾雅釋地觚竹北戶釋文云本又作孤此觚孤互通之證孤特者率方而有稜故其字亦可借觚為之與乎二字與下與乎止我德也復疑此誤注云常遊於獨就遊字義求之或元是字抑或是字説文安行也趣步也並與遊義合曠然無懷乃至於實張廣大貌也靈府寬間與虛空等量而智德真實故不浮華至人無喜暢然和適故似喜也邴邴喜貌也隨變任化所遇斯適實忘喜怒故云似喜者也邴邴徐音丙郭甫杏反向云喜貌簡文云明貌動靜行止常居必然之極崔動也已止也真人凝寂應物無方迫而後動非關先唱故不得已而應之者也崔乎罪反徐息罪反郭且雷反向云動貌簡文云速貌不以物傷己也滀聚也進益也心同止水故能滀聚群生是以應而無情惠而不費適我益我神色終無減損者也滀乎本又作敕六反司馬云色憤起貌王云富有德充也簡文云聚也無所趨也雖復應動隨世接物逗機而恆容與無為作於真德所謂動而常寂者也至人無厲與世同行故若厲也厲危也真人一於安危冥於禍福而和光同世亦似厲乎如孔子之困匡人文王之拘羑里雖遭危厄不廢無為之事也厲乎如字崔本作廣云苞羅者廣也俞樾曰郭注殊不可通且如注意當云世乎其似厲不當反言其似世也今案世乃泰之假字荀子榮辱篇橋泄者人之殃也劉氏台拱補注曰橋泄即驕泰之異文荀子他篇或作汏或作忕或作泰皆同漏泄之泄古多與外大害敗為韻亦讀如泰也又引賈子簡泄不可以得士為證然則以世為泰猶以泄為泰也猛厲與驕泰其義相應釋文曰厲崔本作廣廣大亦與泰義相應泰亦大也若以本字讀之而曰似世則皆不可通矣慶藩案厲當從崔本作廣者是郭注訓與世同行則有廣大之義然既曰無厲又曰若厲殊失解義經傳中厲廣二字往往而混如禮月令天子乃厲飾淮南時則篇作廣飾史記平津侯傳厲賢豫祿徐廣曰厲亦作廣儒林傳以廣賢材漢書廣作厲漢書地理志齊郡廣説文水部注廣訛為厲皆其證又案俞氏云世為泰之假字是也古無泰字其字作大大世二字古音義同得通用也禮曲禮不敢與世子同名注世或為大春秋文三十年大室屋壞公羊作世室衛太叔儀公羊作世叔儀宋樂大心公羊作樂世心鄭子大叔論語作世叔皆其證高放而自得聖德廣大謷然高遠超於世表故不可禁制也謷乎五羔反徐五到反司馬云志遠貌王云高邁於俗也綿邈深遠莫見其門連長也聖德遐長連綿難測心知路絶孰見其門昏默音聲似如關閉不聞見人也連乎如字李云連綿長貌崔云蹇連也音輦似好呼報反下皆同不識不知而天機自發故悗然也悗無心貌也放任安排無為虛淡得玄珠於赤水所以忘言自此以前歷顯真人自利利他內外德行從此以下明真人利物為政之方也悗乎亡本反字或作免李云無匹貌王云廢忘也崔云婉順也刑者治之體非我為治之直吏反禮者世之所以自行耳非我制用刑法為治政之體本以體樂為御物之羽儀知者時之動非我唱德者自彼所循非我作循順也用智照機不失時候以德接物俯順物情以前略標此以下解釋也為循本亦作修兩得俞樾曰陸氏以為兩得非下文與有足者至于丘也自以作循為是説文循順行也若作修則無義矣慶藩案作是也廣雅循述也詩邶風傳述循也隸書循修字易混易繫辭損德之修也釋文馬作循晉語瞍修聲王制正義作循聲史記商君傳湯武不循古而王索隱商君書作修古管子九守篇循名而督實今本訛作修皆其例任治之自殺故雖殺而寬綽寬也所以用刑法為治體者以殺止殺殺一懲萬故雖殺而寬簡是以惠者民之讎法者民之父綽乎昌略反崔本作淖順世之所行故無不行禮雖忠信之薄而為御世之首故不學禮無以立非禮勿動非禮勿言人而無禮胡不遄死是故禮之於治要哉羽翼人倫所以大行於世者也夫高下相受不可逆之流也小大相群不得已之勢也曠然無情群知之府也承百流之會居師人之極者奚為哉任時世之知委必然之事付之天下而已隨機感以接物運至知以應時理無可視聽之色聲事有不得已之形勢故為宗師者曠然無懷付之群智居必然之會乘之以遊者也丘者所以本也以性言之則性之本也夫物各有足足於本也付群德之自循斯與有足者至於本也本至而理盡矣丘本也以德接物順物之性性各有分止分而足順其本性故至於丘也家世父曰孔安國云九州之志謂之九丘莊子則陽篇亦云丘里之言是凡所居曰丘顓頊遺墟謂之帝丘有足而能行終必反其所居循禮者若所居之安有足而必至也凡此皆自彼而成成之不在己則雖處萬機之極而常間暇自適忽然不覺事之經身悗然不識言之在口而人之大迷真謂至人之為勤行者也夫至人者動若行雲止若谷神境智洞忘虛心玄應豈有懷於為物情係於拯救者乎而凡俗之人觸塗封執見舟航庶品亭毒群生實謂聖人勤行不怠詎知汾水之上凝淡窅然故前文云孰以物為事也常間音間常無心而順彼故好與不好所善所惡與彼無二也既忘懷於美惡亦遣蕩於愛憎故好與弗好出自凡情而聖智虛融未嘗不一其一也天徒也其不一也人徒也夫真人同天人均彼我不以其一異乎不一其一聖智也其不一凡情也既而凡聖不二故不一皆一之也無有而不一者天也彼彼而我我者人也同天人齊萬致與玄天而為類也彼彼而我我將凡庶而為徒也夫真人同天人齊萬致萬致不相非天人不相勝故曠然無不一冥然無不在而玄同彼我也雖復天無彼我人有是非確然論之咸歸空寂若使天勝人劣豈謂齊乎此又混一天人冥同勝負體此趣者可謂真人者也闕誤引文如海成玄瑛張君房本喜乎作喜也又引文成張本重崔字已乎作已也又世乎作世也趙諫議本群作君宋本在作任死生命也其有夜旦之常天也人之有所不得與皆物之情也彼特以天為父而身猶愛之而況其卓乎人特以有君為愈乎己而身猶死之而況其真乎其有晝夜之常天之道也故知死生者命之極非妄然也若夜旦耳奚所係哉夫旦明夜暗天之常道死生來去人之分命天不能無晝夜人焉能無死生故任變隨流我將於何係哉夜旦如字崔本作靼音怛夫真人在晝得晝在夜得夜以死生為晝夜豈有所不得人之有所不得而憂娛在懷皆物情耳非理也夫死生晝夜人天常道未始非我何所係哉而流俗之徒逆於造化不能安時處順與變俱往而欣生惡死哀樂存懷斯乃凡物之滯情豈是真人之通智也卓者獨化之謂也夫相因之功莫若獨化之至也故人之所因者天也天之所生者獨化也人皆以天為父故晝夜之變寒暑之節猶不敢惡隨天安之況乎卓爾獨化至於玄冥之境又安得而不任之哉既任之則死生變化惟命之從也卓者獨化之謂也彼之衆人稟氣蒼旻而獨以天為父身猶愛而重之至於晝夜寒溫不能返逆況乎至道窈冥之鄉獨化自然之竟生天生地開闢陰陽適可安而任之何得拒而不順也其卓中學反慶藩案卓之言超也絶也獨也字同趠廣雅趠絶一作逴玉篇敕角切蹇也蹇者獨任一足故謂之逴李善西都賦注逴躒猶超絶也匡謬正俗逴者謂超踰不依次第又作踔漢書河間獻王傳踔爾不群説苑君道篇踔然獨立依説文當作禾部特止徐鍇曰特止卓止也卓趠逴踔古同聲通用敢惡烏路反之竟音境夫真者不假於物而自然也夫自然之不可避豈直君命而已哉愈猶勝也其真則向之獨化者也人獨以君王為勝己尊貴尚殞身致命不敢有避而況玄道至極自然之理欲不從順其可得乎安排委化固其宜矣泉涸魚相與處於陸相詬以濕相濡以沫不如相忘於江湖與其譽堯而非桀也不如兩忘而化其道夫大塊載我以形勞我以生佚我以老息我以死故善吾生者乃所以善吾死也與其不足而相愛豈若有餘而相忘此起譬也江湖浩瀚遊泳自在各足深水無復往還彼此相忘恩情斷絶洎乎泉源旱涸鱣鮪困苦共處陸地尾曝腮於是吐沫相濡詬氣相濕恩愛往來更相親附比之江湖去之遠矣亦猶大道之世物各逍遙雞犬聲聞不相來往淳風既散澆浪漸興從理生教聖迹斯起矜蹩躠以為仁踶跂以為義父子兄弟懷情相欺聖人羞之良有以也故知魚失水所以詬濡人喪道所以親愛之者也泉涸戶各反郭戶格反爾雅云竭也相詬況于況付二反相瀉本又作濡音儒或一音如戍反以沫音末相忘音亡下同夫非譽皆生於不足故至足者忘善惡遺死生與變化為一曠然無不適矣又安知堯桀之所在耶此合喻夫唐堯聖君夏桀庸主故譽堯善而非桀惡祖述堯舜以勗將來仁義之興自茲為本也豈若無善無惡善惡兩忘不是不非是非雙遣然後出生入死隨變化而遨遊莫往莫來履玄道而自得豈與夫詬濡聖迹同年而語哉譽堯音餘注同夫形生老死皆我也故形為我載生為我勞老為我佚死為我息四者雖變未始非我我奚惜哉大塊者自然也夫形是構造之物生是誕育之始老是耆艾之年死是氣散之日但運載有形生必勞苦老既無能暫時間逸死滅還無理歸停憩四者雖變而未始非我而我坦然何所惜耶大塊苦怪反又苦對反徐胡罪反慶藩案文選郭景純江賦注引司馬云大塊自然也釋文闕佚我音逸死與生皆命也無善則死有善則生不獨善也故若以吾生為善乎則吾死亦善也夫形生老死皆我也故以善吾生為善者吾死亦可以為善矣趙諫議本作濡夫藏舟於壑藏山於澤謂之固矣然而夜半有力者負之而走昧者不知也藏小大有宜猶有所遁若夫藏天下於天下而不得所遁是恆物之大情也特犯人之形而猶喜之若人之形者萬化而未始有極也其為樂可勝計邪故聖人將遊於物之所不得遁而皆存善妖善老善始善終人猶效之又況萬物之所係而一化之所待乎方言死生變化之不可逃故先舉無逃之極然後明之以必變之符將任化而無係也於壑火各反夫無力之力莫大於變化者也故乃揭天地以趨新負山嶽以舍故故不暫停忽已涉新則天地萬物無時而不移也世皆新矣而自以為故舟日易矣而視之若舊山日更矣而視之若前今交一臂而失之皆在冥中去矣故向者之我非復今我也我與今俱往豈常守故哉而世莫之覺橫謂今之所遇可係而在豈不昧哉夜半暗冥以譬真理玄邃也有力者造化也夫藏舟船於海壑正合其宜隱山嶽於澤中謂之得所然而造化之力擔負而趨變故日新驟如逝水凡惑之徒心靈愚昧真謂山舟牢固不動巋然豈知冥中貿遷無時暫息昨我今我其義亦然也俞樾曰山非可藏於澤且亦非有力者所能負之而走其義難通山疑當讀為汕爾雅釋器罺謂之汕詩南有嘉魚篇毛傳曰汕汕樔也箋云今之撩罟也藏舟藏汕疑皆以漁者言恐為人所竊故藏之乃世俗常有之事故莊子以為喻耳家世父曰壑可以藏舟澤之大可以藏山然而大化之運行無窮舉天地萬物日夜推移以舍故而即新而未稍有止息水負舟而立水移即舟移矣氣負山而行氣運即山運矣夜半者惟行於無象無兆之中而人莫之見也慶藩案文選江文通雜禮詩注引司馬云舟水物山陸居者藏之壑澤非人意所求謂之固有力者或能取之釋文闕乃揭其列其謁二反不知與化為體而思藏之使不化則雖至深至固各得其所宜而無以禁其日變也故夫藏而有之者不能止其遁也無藏而任化者變不能變也遁變化也藏舟於壑藏山於澤此藏大也藏人於室藏物於器此藏小也然小大雖異而藏皆得宜猶念念遷流新新移改是知變化之道無處可逃也無所藏而都任之則與物無不冥與化無不一故無外無內無死無生體天地而合變化索所遁而不得矣此乃常存之大情非一曲之小意恆常也夫藏天下於天下者豈藏之哉蓋無所藏也故能一死生冥變化放縱寰宇之中乘造物以遨遊者斯藏天下於天下也既變所不能變何所遁之有哉此乃體凝寂之人物達大道之真情豈流俗之迷徒運人間之小智耶索所所百反人形乃是萬化之一遇耳未足獨喜也無極之中所遇者皆若人耳豈特人形可喜而餘物無樂耶慶藩案文選賈長沙鳥賦注引司馬云當復化而為無釋文闕無樂音洛下及注同本非人而化為人化為人失於故矣失故而喜喜所遇也變化無窮何所不遇所遇而樂樂豈有極乎特獨也犯遇也夫大冶洪爐陶鑄群品獨遇人形遂以為樂如人形者其貌類無窮所遇即喜喜亦何極是以唯形與喜不可勝計可勝音升夫聖人遊於變化之塗放於日新之流萬物萬化亦與之萬化化者無極亦與之無極誰得遁之哉夫於生為亡而於死為存則何時而非存哉夫物不得遁者自然也孰能逃於自然之道乎是故聖人遊心變化之塗放任日新之境未始非我何往不存耶此自均於百年之內不善少而否老未能體變化齊死生也然其平粹猶足以師人也善妖崔本作狡同古卯反本又作夭於表反簡文於橋反云異也盧文弨曰今本作夭慶藩案妖字正作夭夭妖古通用史記周本紀後宮童妾所棄妖子徐廣曰妖一作夭崔氏作狡非也善少詩照反否老音鄙本亦作鄙平粹雖遂反此玄同萬物而與化為體故其為天下之所宗也不亦宜乎係屬也夫人之識性明暗不同自有百年之中一生之內從容平淡鮮有欣戚至於壽夭老少都不介懷雖未能忘生死但復無嫌惡猶足以為物師傅人放效之而況混同萬物冥一變化屬在至人必資聖知為物宗匠不亦宜乎世德堂本妖作夭闕誤引張君房本作少趙諫議本無哉字趙本乃作方鵩字依文選改夫道有情有信無為無形可傳而不可受可得而不可見自本自根未有天地自古以固存神鬼神帝生天生地在太極之先而不為高在六極之下而不為深先天地生而不為久長於上古而不為老狶韋氏得之以挈天地伏戲氏得之以襲氣母維斗得之終古不忒日月得之終古不息堪壞得之以襲崑崙馮夷得之以遊大川肩吾得之以處大山黃帝得之以登雲天顓頊得之以處玄宮禺強得之立乎北極西王母得之坐乎少廣莫知其始莫知其終彭祖得之上及有虞下及五伯傅説得之以相武丁奄有天下乘東維騎箕尾而比於列星有無情之情故無為也有無常之信故無形也明鑒洞照有情也趣機若響有信也恬淡寂寞無為也視之不見無形也古今傳而宅之莫能受而有之可傳直專反注同咸得自容而莫見其狀寄言詮理可傳也體非量數不可受也方寸獨悟可得也離於形色不可見也明無不待有而無也自從也存有也虛通至道無始無終從以來未有天地五氣未兆大道存焉故老經云有物混成先天地生又云迎之不見其首隨之不見其後者也無也豈能生神哉不神鬼帝而鬼帝自神斯乃不神之神也不生天地而天地自生斯乃不生之生也故夫神之果不足以神而不神則神矣功何足有事何足恃哉言大道能神於鬼靈神於天帝開明三景生立二儀至無之力有茲功用斯乃不神而神不生而生非神之而神生之而生者也故老經云天得一以清神得一以靈也言道之無所不在也故在高為無高在深為無深在久為無久在老為無老無所不在而所在皆無也且上下無不格者不得以高卑稱也外內無不至者不得以表裏名也與化俱移者不得言久也終始常無者不可謂老也太極五氣也六極六合也且道在五氣之上不為高遠在六合之下不為深邃先天地生不為長久長於敻古不為耆艾言非高非深非久非老故道無不在而所在皆無者也在大極音泰之先一本作之先未崔本同盧文弨曰今本作一本作先之無未字先天悉薦反長於丁丈反稱也尺證反狶韋氏文字已前遠古帝王號也得靈通之道故能驅馭群品提挈二儀又作契字者契合也言能混同萬物符合二儀者也狶韋氏許豈反郭褚伊反李音豕司馬云上古帝王名以挈徐苦結反郭苦係反司馬云要也得天地要也崔云成也伏戲三皇也能伏牛乘馬養伏犧牲故謂之伏犧也襲合也氣母者元氣之母應道也為得至道故能畫八卦演六爻調陰陽合元氣也伏戲音羲崔本作伏戲氏以襲氣母司馬云襲入也氣母元氣之母也崔云取元氣之本維斗北斗也為衆星綱維故謂之維斗忒差也古始也得於至道故歷於終始維持天地心無差忒維斗李云北斗所以為天下綱維盧文弨曰今本天下作天之終古崔云終古久也鄭玄注周禮云終古猶言常也不忒它得反差也崔本作代日月光證於一道故得終始照臨竟無休息者也崑崙山名也在北海之北堪壞崑崙山神名也襲入也堪壞人面獸身得道入崑崙山為神也堪壞徐扶眉反郭孚杯反崔作邳司馬云堪壞神名人面獸形淮南作欽負崑崙崑或作岷同音昆下力門反崑崙山名姓馮名夷弘農華陰潼鄉堤首里人也服八石得水仙大川黃河也天帝錫馮夷為河伯故遊處盟津大川之中也馮夷司馬云清泠傳曰馮夷華陰潼鄉堤首人也服八石得水仙是為河伯一云以八月庚子浴於河而溺死一云渡河溺死大川河也崔本作泰川肩吾神名也得道故處東嶽為太山之神肩吾司馬云山神不死至孔子時大山音泰又如字黃帝軒轅也採首山之銅鑄鼎於荊山之下鼎成有龍垂於鼎以迎帝帝遂將群臣及後宮七十二人白日乘雲駕龍以登上天仙化而去黃帝崔云得道而上天也顓頊帝之孫即帝高陽也亦曰玄帝年十二而冠十五佐少昊二十即位採羽山之銅為鼎能召四海之神有靈異年九十七崩得道為北方之帝玄者北方之色故處於玄宮也顓頊音專下許玉反玄宮李云顓頊帝高陽氏玄宮北方宮也月令曰其帝顓頊其神玄冥禺強水神名也亦曰禺京人面鳥身乘龍而行與顓頊並軒轅之胤也雖復得道不居帝位而為水神水位北方故位號北極也禺強音虞郭語龍反司馬云山海經曰北海之渚有神人面鳥身珥兩青蛇踐兩赤蛇名禺強崔云大荒經曰北海之神名曰禺強靈龜為之使歸藏曰昔穆王子筮卦於禺強案海外經云北方禺強黑身手足乘兩龍郭璞以為水神人面鳥身簡文云北海神也一名禺京是黃帝之孫也少廣西極山名也王母太陰之精也豹尾虎齒善笑舜時王母遣使獻玉環漢武帝時獻青桃顏容若十六七女子甚端正常坐西方少廣之山不復生死故莫知始終也西王母山海經云狀如人狗尾蓬頭戴勝善嘯居海水之涯漢武內傳云西王母與上元夫人降帝美容貌神仙人也少廣司馬云穴名崔云山名或云西方空界之名彭祖帝顓頊之玄孫也封於彭城其道可祖故稱彭祖善養性得道者也五伯者昆吾為夏伯大彭豕韋為殷伯齊桓晉文為周伯合為五伯而彭祖得道所以長年上至有虞下及殷周凡八百年也彭祖解見逍遙篇崔云壽七百歲或以為仙不死五伯如字又音霸崔李云夏伯昆吾殷大彭豕韋周齊桓晉文道無能也此言得之於道乃所以明其自得耳自得耳道不能使之得也我之未得又不能為得也然則凡得之者外不資於道內不由於己掘然自得而獨化也夫生之難也猶獨化而自得之矣既得其生又何患於生之不得而為之哉故夫為生果不足以全生以其生之不由於己為也而為之則傷其真生也武丁殷王名也號曰高宗高宗夢得傅説使求之天下於陝州河北縣傅板築之所而得之相於武丁奄然清泰傅説星精也而傅説一星在箕尾上然箕尾則是二十八宿之數維持東方故言乘東維騎箕尾而與角亢等星比並行列故言比於列星也傅説音悅得之以相息亮反武丁奄有天下乘東維騎箕尾而比於列星司馬云傅説殷相也武丁殷王高宗也東維箕斗之間天漢津之東維也星經曰傅説一星在尾上言其乘東維騎箕尾之間也崔云傅説死其精神乘東維託龍尾乃列宿今尾上有傅説星崔本此下更有其生無父母死登假三年而形遁此言神之無能名者也凡二十二字掘然其勿反世德堂本無為字古字依正文改世德堂本神作人世德堂本無夫字南伯子葵問乎女偊曰子之年長矣而色若子何也葵當為綦字之誤猶人間世篇中南郭子綦也女偊古之懷道人也孺子猶稚子也女偊久聞至道故能攝衛養生年雖老猶有童顏之色駐彩之狀既異凡人是故子葵問其何以致此也南伯子葵李云葵當為綦聲之誤也女偊徐音禹李音矩一云是婦人也年長張丈反盧文弨曰今本作丁丈反與前後同子本亦作孺如喻反李云弱子也盧文弨曰今本作孺是正體曰吾聞道矣聞道則任其自生故氣色全也答云聞道故得全生是以反少還童色如稚子南伯子葵曰道可得學邪睹其容色既異常人心懷景慕故詢其方術也趙諫議本無道字曰惡惡可子非其人也夫卜梁倚有聖人之才而無聖人之道我有聖人之道而無聖人之才吾欲以教之庶幾其果為聖人乎不然以聖人之道告聖人之才亦易矣吾猶守而告之參日而後能外天下已外天下矣吾又守之七日而後能外物已外物矣吾又守之九日而後能外生已外生矣而後能朝徹朝徹而後能見獨見獨而後能無古今無古今而後能入於不死不生殺生者不死生生者不生其為物無不將也無不迎也無不毀也無不成也其名為攖寧攖寧也者攖而後成者也惡惡可言不可也女偊心神內靜形色外彰子葵見容貌欣然請學嫌其所問故抑之謂非其人也惡惡可並音烏下惡乎同卜梁姬姓也倚名也虛心凝淡為道智用明敏為才言梁有外用之才而無內凝之道女偊有虛淡之道而無明敏之才各滯一邊未為通美然以才方道才劣道勝也卜梁倚魚綺反又其綺反李云卜梁姓倚名庶慕也幾近也果決也夫上士聞道猶藉勤行若不勤行道無由致是故雖蒙教誨必須修學慕近玄道決成聖人若其不然告示甚易為須修守所以成難然女偊久聞至道內心凝寂今欲傳告猶自守之況在初學無容懈怠假令口説耳聞蓋亦何益是以非知之難行之難也亦易以豉反外猶遺也外遺忘也夫為師不易傳道極難方欲教人故凝神靜慮修而守之凡經三日心既虛寂萬境皆空是以天下地上悉皆非有也參日音三物者朝夕所須切己難忘天下萬境疏遠所以易忘資身之物親近所以難遺守經七日然後遺之故郭注云物者朝夕所須切己難忘者也都遺也隳體離形坐忘我喪運心既久遺遣漸深也遺生則不惡死不惡死故所遇即安豁然無滯見機而作斯朝徹也朝旦也徹明也死生一觀物我兼忘惠照豁然如朝陽初啓故謂之朝徹也能朝如字李除遙反下同徹如字郭司馬云朝旦也徹達妙之道李云夫能洞照不崇朝而遠徹也不惡烏路反下同豁然喚活反當所遇而安之忘先後之所接斯見獨者也夫至道凝然妙絶言象非無非有不古不今獨往獨來絶待絶對睹斯勝境謂之見獨故老經云寂寞而不改與獨俱往任造物之日新隨變化而俱往不為物境所遷故無古今之異夫係生故有死惡死故有生是以無係無惡然後能無死無生古今會也夫時有古今之異法有生死之殊者此蓋迷徒倒置之見也時既運運新新無今無古故法亦不去不來無死無生者也會斯理者其唯女偊之子耶殺滅也死亦滅也謂此死者未曾滅謂此生者未曾生既死既生能入於無死無生故體於法無生滅也法既不生不滅而情亦何欣何惡耶任之而無不適也殺生者不死李云殺猶亡也亡生者不死也崔云除其營生為殺生生生者不生李云矜生者不生也崔云常營其生為生生任其自將故無不將任其自迎故無不迎將送也夫道之為物拯濟無方雖復不滅不生亦而生而滅是以迎無窮之生送無量之死也任其自毀故無不毀任其自成故無不成不送而送無不毀滅不迎而迎無不生成也夫與物冥者物縈亦縈而未始不寧也攖擾動也寧寂靜也夫聖人慈惠道濟蒼生妙本無名隨物立稱動而常寂雖攖而寧者也攖郭音縈徐於營反李於盈反崔云有所繫著也家世父曰趙岐孟子注攖迫也物我生死之見迫於中將迎成毀之機迫於外而一無所動其心乃謂之攖寧置身紛紜蕃變交爭互觸之地而心固寧焉則幾於成矣故曰攖而後成物縈而獨不縈則敗矣故縈而任之則莫不曲成也既能和光同塵動而常寂然後隨物攖擾善貸生成也闕誤引江南古藏本殺上有故字世德堂本也作矣南伯子葵曰子獨惡乎聞之子葵怪女偊之談其道高妙故問子於何處獨得聞之自斯已下凡有九重前六約教後三據理並是女偊告示子葵之辭也曰聞諸副墨之子副墨之子聞諸洛誦之孫洛誦之孫聞之瞻明瞻明聞之聶許聶許聞之需役需役聞之於謳於謳聞之玄冥玄冥聞之參寥參寥聞之疑始諸之也副副二也墨翰墨也翰墨文字也理能生教故謂文字為副二也夫魚必因筌而得理亦因教而明故聞之翰墨以明先因文字得解故也副墨李云可以副二玄墨也崔云此已下皆古人姓名或寓之耳無其人臨本謂之副墨背文謂之洛誦初既依文生解所以執持披讀次則漸悟其理是故羅洛誦之且教從理生故稱為子而誦因教起名之曰孫也洛誦李云誦通也苞洛無所不通也瞻視也亦至也讀誦精熟功勞積久漸見至理靈府分明瞻明音占李云神明洞徹也聶登也亦是附耳私語也既誦之稍深因教悟理心生歡悅私自許當附耳竊私語也既聞於道未敢公行亦是漸登勝妙玄情者也聶許徐乃攝反李云許與也攝而保之無所施與也需須也役用也行也雖復私心自許智照漸明必須依教遵循勤行勿怠懈而不行道無由致需役徐音須李音儒云儒弱為役也王云需待也役亭毒也謳歌謠也既因教悟理依解而行遂使盛惠顯彰謳歌滿路也於音烏又如字謳徐烏侯反李香于反云謳煦也欲化之貌王云謳歌謠也玄冥者所以名無而非無也玄者深遠之名也冥者幽寂之稱既德行內融芳聲外顯故漸階虛極以至於玄冥故也玄冥李云強名曰玄視之冥然向郭云所以名無而非無也夫階名以至無者必得無於名表故雖玄冥猶未極而又推寄於參寥亦是玄之又玄也參三也寥絶也一者絶有二者絶無三者非有非無故謂之三絶也夫玄冥之境雖妙未極故至乎三絶方造重玄也參七南反寥徐力雕反李云參高也高邈寥曠不可名也夫自然之理有積習而成者蓋階近以至遠研粗以至精故乃七重而後及無之名九重而後疑無是始也始本也夫道超此四句離彼百非名言道斷心知處滅雖復三絶未窮其妙而三絶之外道之根本謂重玄之域衆妙之門意亦難得而差言之矣是以不本而本本無所本疑名為本亦無的可本故謂之疑始也疑始李云又疑無是始則始非無名也研粗七胡反七重直龍反下同子祀子輿子犁子來四人相與語曰孰能以無為首以生為脊以死為尻孰知死生存亡之一體者吾與之友矣四人相視而笑莫逆於心遂相與為友子祀四人未詳所據觀其心迹並方外之士情同淡水共結素交敘莫逆於虛玄述忘言於至道夫人起自虛無無則在先故以無為首從無生有生則居次故以生為脊既生而死死最居後故以死為尻亦故然也尻首雖別本是一身而死生乃異源乎一體能達斯趣所遇皆適豈有存亡欣惡於其間哉誰能知是我與為友也子祀崔云淮南作子永行年五十四而病傴僂慶藩案崔本作子永是也今本淮南精神篇作子求與崔所見本異顧千里曰求當作永抱朴子博喻篇曰子永歎天倫之偉字正作永永求形近經傳中互誤者不可枚舉子輿本又作與音餘子犁禮兮反為尻苦羔反目擊道存故相見而笑同順玄理故莫逆於心也俄而子輿有病子祀往問之曰偉哉夫造物者將以豫為此拘拘也曲僂發背上有五管頤隱於齊肩高於頂句贅指天陰陽之氣有沴其心間而無事跰足鮮而鑑於井曰嗟乎夫造物者又將以豫為此拘拘也友人既病須往問之任理而行不乖於方外也偉大也造物猶造化也拘拘攣縮不申之貌也夫洪爐大冶造物無偏豈獨將我一身故為拘攣之疾以此而言無非命也子輿達理自歎此辭也偉哉韋鬼反向云美也崔云自此至鑑於井皆子祀自説病狀也拘拘郭音駒司馬云體拘攣也王云不申也沴陵亂也傴僂曲腰背骨發露既其俯而不仰故藏腑並在上頭低則頤隱於臍聳則肩高於頂而咽項句曲大挺如贅陰陽二氣陵亂不調遂使一身遭斯疾篤曲僂徐力主反於頂本亦作項崔本作釭音項盧文弨曰舊作釘音頂今本作缸音項據宋本釘音項疑釘為釭之訛參酌改正句俱樹反徐古侯反贅徐之稅反指天李云句贅項椎也其形似贅言其上向也有沴音麗徐又徒顯反郭奴結反云陵亂也李同崔本作云滿也不以為患死生猶為一體疾患豈復概懷故雖曲僂拘拘而心神間逸都不以為事其心間音間崔以其心屬上句夫任自然之變者無嗟也與物嗟耳跰足鮮曳疾貌言曳疾力行照臨于井既見己貌遂使發傷嗟尋夫大道自然造物均等豈偏於我獨此拘攣欲顯明物理故寄茲嗟嘆也跰足鮮步田反下悉田反崔本作邊鮮司馬云病不能行故跰足鮮也而鑑古暫反曰嗟乎崔云此子輿辭子祀曰女惡之乎淡水素交契心方外見其嗟嘆故有驚疑女惡音汝下同下烏路反曰亡豫何惡浸假而化豫之左臂以為雞豫因以求時夜浸假而化豫之右臂以為彈豫因以求梟炙浸假而化豫之尻以為輪以神為馬豫因以乘之豈更駕哉且夫得者時也失者順也安時而處順哀樂不能入也此古之所謂縣解也而不能自解者物有結之且夫物不勝天久矣吾又何惡焉亡無也存亡死生本自無心不嗟之嗟何嫌惡之也曰亡如字絶句豫何惡烏路反下及注同一音如字讀則連亡字為句浸漸也夫體化合變則無往而不因無因而不可也假令陰陽二氣漸而化我左右兩臂為雞為彈彈則求於梟鳥雞則夜候天時尻無識而為輪神有知而作馬因漸漬而變化乘輪馬以遨遊苟隨任以安排亦於何而不適者也浸子鴆反向云漸也豫因以求時夜一本無求為彈徒旦反梟戶驕反炙章夜反當所遇之時世謂之得時不暫停順往而去世謂之失得者生也失者死也夫忽然而得時應生也倏然而失順理死也是以安於時則不欣於生處於順則不惡於死既其無欣無惡何憂樂之入乎哀樂音洛一不能自解則衆物共結之矣故能解則無所不解不解則無所而解也處順忘時蕭然無係古昔至人謂為縣解若夫當生慮死而以憎惡存懷者既內心不能自解故為外物結縛之也縣音玄解音蟹下及注同同向云縣解無所係也天不能無晝夜我安能無死生而惡之哉玄天在上猶有晝夜之殊況人居世間焉能無死生之變且物不勝天非唯今日我復何人獨生憎惡向字依世德堂本及釋文原本改俄而子來有病喘喘然將死其妻子環而泣之子犁往問之曰叱避無怛化倚其戶與之語曰偉哉造化又將奚以汝為將奚以汝適以汝為鼠肝乎以汝為蟲臂乎環繞也喘喘氣息急也子輿語訖俄頃之間子來又病氣奔欲死既將屬纊故妻子繞而哭之也喘喘川轉反又尺軟反崔本作惴惴環而如字徐音患李云繞也夫死生猶寤寐耳於理當寐不願人驚之將化而死亦宜無為怛之也叱訶聲也夫方外之士冥一死生而朋友臨終和光往問故叱彼親族令避傍近正欲變化不欲驚怛也叱避昌失反無怛丁達反崔本作靼音怛案怛驚也鄭衆注周禮考工記不能驚怛是也又復也奚何也適往也倚戶觀化與之而語歎彼大造弘普無私偶爾為人忽然返化不知方外適往何道變作何物將汝五藏為鼠之肝或化四支為蟲之臂任化而往所遇皆適也倚其於綺反鼠肝向云委棄土壤而已王云取微蔑至賤蟲臂臂亦作腸崔本同子來曰父母於子東西南北唯命之從陰陽於人不翅於父母彼近吾死而我不聽我則悍矣彼何罪焉夫大塊載我以形勞我以生佚我以老息我以死故善吾生者乃所以善吾死也今之大冶鑄金金踊躍曰我且必為鏌大冶必以為不祥之金今一犯人之形而曰人耳人耳夫造化者必以為不祥之人今一以天地為大爐以造化為大冶惡乎往而不可哉成然寐蘧然覺自古或有能違父母之命者矣未有能違陰陽之變而距晝夜之節者也自此已下是子來臨終答子犁之詞也夫孝子侍親尚驅馳唯命況陰陽造化何啻二親乎故知違親之教世或有焉拒於陰陽未之有也不翅徐詩知反死生猶晝夜耳未足為遠也時當死亦非所禁而橫有不聽之心適足悍逆於理以速其死其死之速由於我悍非死之罪也彼謂死耳在生故以死為彼彼造化也而造化之中令我近死我惡其死而不聽從則是我拒陰陽逆於變化斯乃咎在於我彼何罪焉郭注以死為彼也彼近如字則悍本亦作捍胡旦反又音旱説文云捍抵也理常俱也此重引前文證成彼義斯言切當所以再出其解釋文意不異前旨人耳人耳唯願為人也亦猶金之踊躍世皆知金之不祥而不能任其自化夫變化之道靡所不遇今一遇人形豈故為哉生非故為時自生耳務而有之不亦妄乎祥善也犯遇也鏌古之良劍名也昔吳人干將為吳王造劍妻名鏌因名雄劍曰干將雌劍曰鏌夫洪爐大冶鎔鑄金鐵隨器大小悉皆為之而爐中之金忽然跳躑殷勤致請願為良劍匠者驚嗟用為不善亦猶自然大冶雕刻衆形鳥獸魚蟲種種皆作偶爾為人遂即欣愛鄭重啓請願更為人而造化之中用為妖孽也我且如字徐子餘反鏌音莫似嗟反鏌劍名人皆知金之有係為不祥故明己之無異於金則所係之情可解可解則無不可也夫用二儀造化一為爐冶陶鑄群物錘鍛蒼生磅礡無心亭毒均等所遇斯適何惡何欣安排變化無往不可也大爐劣奴反惡乎音烏可解如字下同寤寐自若不以死生纍心成然是間放之貌蘧然是驚喜之貌寐寢也以譬於死也覺是寤也以況於生然寤寐雖殊何嘗不從容逸樂死生乃異亦未始不任命逍遙此總結子來以死生為寤寐者也成然如字崔同李云成然縣解之貌本或作戌音恤簡文云當作滅本又作呼括反視高貌本亦作俄然蘧然李音渠崔本作據又其據反蘧然有形之貌覺古孝反向崔本此下更有發然汗出一句云無係則津液通也崔云榮衛和通不以化為懼也趙諫議本悍作捍之字依世德堂本刪闕誤引古本成作云音呼聒切高視貌又音烘矇不明子桑戶孟子反子琴張三人相與友曰孰能相與於無相與相為於無相為孰能登天遊霧撓挑無極相忘以生無所終窮三人相視而笑莫逆於心遂相與為友夫體天地冥變化者雖手足異任五藏殊官未嘗相與而百節同和斯相與於無相與也未嘗相為而表裏俱濟斯相為於無相為也若乃役其心志以恤手足運其股肱以營五藏則相營愈篤而外內愈困矣故以天下為一體者無愛為於其間也此之三人並方外之士冥於變化一於死生志行既同故相與交友仍各率乃誠述其情致云誰能於虛無自然而相與為朋友乎斯乃無與而與無為而為非為之而為與之而與者也猶如五藏六根四肢百體各有司存更相御用豈有心於相與情係於親疏哉雖無意於相為而相濟之功成矣故於無與而相與周旋於無為而為交友者其義亦然乎耳相與如字崔云猶親也或一音豫相為如字或一音于偽反愛為于偽反無所不任撓挑猶宛轉也夫登升上天示清高輕舉遨遊雲霧表不滯其中故能隨變化而無窮將造物而宛轉者也撓徐而少反郭許堯反挑徐徒了反郭李徒堯反又作兆李云撓挑猶宛轉也宛轉玄曠之中簡文云循環之名忘其生則無不忘矣故能隨變任化俱無所窮竟終窮死也相與忘生復忘死死生混一故順化而無窮也若然者豈友哉蓋寄明至親而無愛念之近情也得意忘言故相視而笑智冥於境故莫逆於心方外道同遂相與為友也世德堂本變作而趙諫議本無夫字者字世德堂本官作管趙本此兩句作雖手足五臟異殊莫然有間而子桑戶死未葬孔子聞之使子貢往侍事焉或編曲或鼓琴相和而歌曰嗟來桑戶乎嗟來桑戶乎而已反其真而我猶為人猗子貢趨而進曰敢問臨尸而歌禮乎莫無也三人相視寂爾無言俄頃之間子桑戶死仲尼聞之使子貢往而弔仍令供給喪事將迎賓客欲顯方外方內故寄尼父琴張莫然如字崔云定也有間如字崔李云頃也本亦作為間慶藩案有釋文作為為間即有間矣古為有義通孟子滕文公篇將為君子焉將為野人焉趙岐注為有也雖小國亦有君子野人也又弟子憮然為間注為間有頃之間也又盡心篇為間不用注為間有間也又梁惠王篇善推其所為而已矣説苑貴德篇引孟子為作有燕策故不敢為辭説新序雜事篇為作有皆其證曲薄也或編薄織簾或鼓琴歌詠相和歡樂曾無戚容所謂相忘以生方外之至也編曲必連反字林布千反郭父殄反史記甫連反李云曲蠶薄相和胡臥反人哭亦哭俗內之迹也齊死生忘哀樂臨尸能歌方外之至也嗟來歌聲也桑戶乎以下相和之辭也猗相和聲也夫從無出有名之曰生自有還無名之曰死汝今既還空寂便是歸本反真而我猶寄人間羈旅未還桑梓欲齊一死生而發斯猗歎者也李楨曰嗟來是歌聲卻是歎辭釋名釋言語嗟佐也言之不足以盡意故發此聲以自佐也來哀也故使來入已哀之故其言之低頭以招之也孟子反子琴張歎桑戶之得已反真故為此歌也我猶崔本作獨人猗於宜反崔云辭也哀樂音洛方內之禮貴在節文鄰里有喪舂猶不相況臨朋友之尸曾無哀哭琴歌自若豈是禮乎子貢怪其如此故趨走進問也世德堂本侍作待闕誤引張君房本作侍使字依釋名改二人相視而笑曰是惡知禮意夫知禮意者必遊外以經內守母以存子稱情而直往也若乃矜乎名聲牽乎形制則孝不任誠慈不任實父子兄弟懷情相欺豈禮之大意哉夫大禮與天地同節不拘制乎形名直致任真率情而往況冥同生死豈存哀樂於胸中而子貢方內儒生性猶偏執唯貴粗迹未契妙本如是之人於何知禮之深乎為方外所嗤固其宜矣惡知音烏下皆同稱情尺證反子貢反以告孔子曰彼何人者邪修行無有而外其形骸臨尸而歌顏色不變無以命之彼何人者邪命名也子貢使返且告尼父云彼二人情事難識修己德行無有禮儀而忘外形骸混同生死臨喪歌樂神形不變既莫測其道故難以名之無以命之崔李云命名也孔子曰彼遊方之外者也而丘遊方之內者也外內不相及而丘使女往弔之丘則陋矣彼方且與造物者為人而遊乎天地之一氣彼以生為附贅縣疣以死為決肒潰癰夫若然者又惡知死生先後之所在假於異物託於同體忘其肝膽遺其耳目反覆終始不知端倪芒然倣徨乎塵垢之外逍遙乎無為之業彼又惡能憒憒然為世俗之禮以觀衆人之耳目哉夫理有至極外內相冥未有極遊外之致而不冥於內者也未有能冥於內而不遊於外者也故聖人常遊外以內無心以順有故雖終日形而神氣無變俯仰萬機而淡然自若夫見形而不及神者天下之常纍也是故睹其與群物並行則莫能謂之遺物而離人矣睹其體化而應務則莫能謂之坐忘而自得矣豈直謂聖人不然哉乃必謂至理之無此是故莊子將明流統之所宗以釋天下之可悟若直就稱仲尼之如此或者將據所見以排之故超聖人之內迹而寄方外於數子宜忘其所寄以尋述作之大意則夫遊外內之道坦然自明而莊子之書故是涉俗蓋世之談矣方區域也彼之二人齊一死生不為教迹所拘故遊心寰宇之外而仲尼子貢命世大儒行裁非之義服節文之禮鋭意哀樂之中遊心區域之內所以為異也而淡徒暫反而離力智反下同而應應對之應下同數子所主反坦然吐但反慶藩案文選謝靈運之郡初發都詩注夏侯孝若東方朔贊注並引司馬云方常也言彼遊心于常教之外也釋文闕夫弔者方內之近事也施之於方外則陋矣玄儒理隔內外道殊勝劣而論不相及逮用區中之俗禮弔方外之高人芻狗再陳鄙陋之甚也使女音汝下同皆冥之故無二也達陰陽之變化與造物之為人體萬物之混同遊二儀之一氣也王引之曰應帝王篇豫方將與造物者為人郭曰任人之自為天運篇丘不與化為人郭曰夫與化為人者任其自化者也案郭未曉人字之義人偶也為人猶為偶中庸仁者人也注讀如相人偶之人以人意相存偶之言詩匪風箋人偶能割亨者人偶能輔周道治民者聘禮注每門輒揖者以相人偶為敬也公食大夫禮注每曲揖及當碑揖相人偶是人與偶同義故漢世有相人偶之語淮南原道篇與造化者為人義與此同高注為治也非是互見淮南齊俗篇曰上與神明為友下與造化為人是其明證也慶藩案文選顏延年三月三日曲水詩序注引司馬云造物者為道任彥升到大司馬記室箋注宣德皇后令注陸佐公石關銘注沈休文齊故安陸昭王碑文注並引司馬云造物謂道也釋文闕若疣之自縣贅之自附此氣之時聚非所樂也縣音玄注同疣音尤若肒之自決雍之自潰此氣之自散非所惜也彼三子體道之人達於死生冥於變化是以氣聚而生譬疣贅附縣非所樂也氣散而死若肒癰決潰非所惜也決徐古穴反肒胡亂反盧文弨曰今本正文亦作疣尤改丸音義作疣胡虯反恐臆改潰胡對反慶藩案慧琳一切經音義卷十六大方廣三戒經下引司馬云浮熱為疽不通為癰卷三十持人菩薩經二卷三十七準提陀羅尼經九十五正誣經注引並同釋文闕死生代謝未始有極與之俱往則無往不可故不知勝負之所在也先勝也後劣也夫疣贅癰四者皆是疾而氣有聚散病無勝負若以此方於生死亦安知優劣之所在乎假因也今死生聚散變化無方皆異物也無異而不假故所假雖異而共成一體也水火金木異物相假衆諸寄託共成一身是知形體由來虛偽任之於理而冥往也既知形質虛假無可欣愛故能內則忘於臟腑外則忘其根竅故也五藏猶忘何物足識哉未始有識故能放任於變化之塗玄同於反覆之波而不知終始之所極也端緒也倪畔也反覆猶往來也終始猶生死也既忘其形質隳體絀聰故能去來生死與化俱往化又無極故莫知端倪反覆芳服反端倪本或作淣同音崖徐音詣所謂無為之業非拱默而已所謂塵垢之外非伏於山林也芒然無知之貌也倣徨逍遙皆自得逸豫之名也塵垢色聲等有為之物也前既遺於形骸此又忘於心智是以放任於塵纍之表逸豫於清曠之鄉以此無為而為事業也芒然莫剛反李云無係之貌倣薄剛反徨音皇塵垢如字崔本作冢云冢音垢同齊人以風塵為盧文弨曰舊作逢今本作摓乃字之訛今改正其所以觀示於衆人者皆其塵垢耳非方外之冥物也憒憒猶煩亂也彼數子者清高虛淡安排去化率性任真何能強事節文拘世俗之禮威儀顯示悅衆人之視聽哉憒憒工內反説文蒼頡篇並云亂也以觀古亂反示也注同世德堂本肒作疣注同冥字依趙諫議本改下同世德堂本上冥字誤作私下冥字誤作弘見字依世德堂本改鄭字依中庸注改世德堂本極作及子貢曰然則夫子何方之依子貢不聞性與天道故見其所依而不見其所以依也夫所以依者不依也世豈覺之哉方內方外淺深不同未知夫子依從何道師資起發故設此疑孔子曰丘天之戮民也雖然吾與汝共之以方內為桎梏明所貴在方外也夫遊外者依內離人者合俗故有天下者無以天下為也是以遺物而後能入群坐忘而後能應務愈遺之愈得之苟居斯極則雖欲釋之而理固自來斯乃天人之所不赦者也夫聖迹禮儀乃桎梏形性仲尼既依方內則是自然之理刑戮之人也故德充符篇云天刑之安可解乎雖為世所桎梏但為與汝共之耳明己恆自在外也夫孔子聖人和光接物揚波同世貴斯俗禮雖復降迹方內與汝共之而遊心方外蕭然無著也子貢曰敢問其方問所以遊外而共內之意方猶道也問迹混域中心遊方外外內玄合其道若何孔子曰魚相造乎水人相造乎道相造乎水者穿池而養給相造乎道者無事而生定故曰魚相忘乎江湖人相忘乎道術造詣也魚之所詣者適性莫過深水人之所至者得意莫過道術雖復情智不一而相與皆然此略標義端次下解釋也相造七報反詣也下同所造雖異其於由無事以得事自方外以共內然後養給而生定則莫不皆然也俱不自知耳故成無為也此解釋前義也夫江湖淮海皆名天池魚在大水之中窟穴泥沙以自資養供給也亦猶人處大道之中清虛養性無事逍遙故得性分靜定而安樂也穿池本亦作地崔同俞樾曰定疑足字之誤穿池而養給無事而生足兩句一律給亦足也足與定字形相似而誤管子中匡篇功定以得天與失天其人事一也今本定誤作足與此正可互證各自足而相忘者天下莫不然也至人常足故常忘也此結釋前義也夫深水遊泳各足相忘道術內充偏愛斯絶豈與夫詬濡仁義同年而語哉臨尸而歌其義亦爾故也相忘音亡下同子貢曰敢問畸人問向之所謂方外而不耦於俗者又安在也畸者不耦之名也修行無有而疏外形體乖異人倫不耦於俗敢問此人其道如何畸人居宜反司馬云不耦也不耦於人謂闕於禮教也李其宜反云奇異也曰畸人者畸於人而侔於天故曰天之小人人之君子人之君子天之小人也夫與內冥者遊於外也獨能遊外以冥內任萬物之自然使天性各足而帝王道成斯乃畸於人而侔於天也自此已下孔子答子貢也侔者等也同也夫不修仁義不偶於物而率其本性者與自然之理同也而侔音謀司馬云等也亦從也以自然言之則人無小大以人理言之則侔於天者可謂君子矣夫懷仁履義為君子乖道背德為小人也是以行蹩躠之仁用踶跂之義者人倫謂之君子而天道謂之小人也故知子反琴張不偶於俗乃曰畸人實天之君子重言之者復結其義也趙諫議本大作人顏回問仲尼曰孟孫才其母死哭泣無涕中心不戚居喪不哀無是三者以善處喪蓋魯國固有無其實而得其名者乎回一怪之姓孟孫名才魯之賢人體無為之一道知生死之不二故能迹同方內心遊物表居母氏之喪禮數不闕威儀詳雅甚有孝容而淚不滂沱心不悲戚聲不哀痛三者既無不名孝子而鄉邦之內悉皆善之云其處喪深得禮法也孟孫才李云三桓後才其名也崔云才或作牛李楨曰以善處喪絶句文義未完且嫌於不辭下蓋魯國三字當屬上為句不當連下固有云云為句蓋與應帝王篇功蓋天下義同言孟孫才以善處喪名蓋魯國爾雅釋言弇蓋也小爾雅廣詁蓋覆也釋名釋言語蓋加也並有高出其上之意即此蓋字義也魯國觀其禮而顏回察其心蓋者發語之辭也哭泣縗絰同域中之俗禮心無哀戚契方外之忘懷魯人睹其外迹故有善喪之名顏子察其內心知無至孝之實所以一見孟孫才遂生疑怪也世德堂本無處字世德堂本一作一仲尼曰夫孟孫氏盡之矣進於知矣唯簡之而不得夫已有所簡矣孟孫氏不知所以生不知所以死不知就先不知就後若化為物以待其所不知之化已乎且方將化惡知不化哉方將不化惡知已化哉吾特與汝其夢未始覺者邪且彼有駭形而無損心有旦宅而無情死孟孫氏特覺人哭亦哭是自其所以乃且也相與吾之耳矣庸詎知吾所謂吾之乎且汝夢為鳥而厲乎天夢為魚而沒於淵不識今之言者其覺者乎其夢者乎造適不及笑獻笑不及排安排而去化乃入於寥天一盡死生之理應內外之宜者動而以天行非知之匹也進過也夫孟孫氏窮哀樂之本所以無樂無哀盡生死之源所以忘生忘死既而本迹難測故能合內外之宜應物無心豈是運知之匹者耶應內應對之應簡擇死生而不得其異若春秋冬夏四時行耳夫生來死去譬彼四時故孟孫簡擇不得其異已簡而不得故無不安無不安故不以生死概意而付之自化也雖復有所簡擇竟不知生死之異故能安於變化而不以哀樂概懷也所遇而安不違化也先生也後死也若順也既一於死生故無去無就冥於變化故順化為物也死生宛轉與化為一猶乃忘其所知於當今豈待所未知而豫憂者哉不知之化謂當來未化之事也已止也見在之生猶自忘遣況未來之化豈復逆憂若用心預待不如止而勿為也已化而生焉知未生之時哉未化而死焉知已死之後哉故無所避就而與化俱往也方今正化為人安知過去未化之事乎正在生日未化而死又安知死後之事乎俱當推理直前與化俱往無勞在生憂死妄為欣惡也惡知音烏下同焉知於虔反下皆同夫死生猶覺夢耳今夢自以為覺則無以明覺之非夢也苟無以明覺之非夢則亦無以明生之非死矣死生覺夢未知所在當其所遇無不自得何為在此而憂彼哉夢是昏睡之時覺是了知之日仲尼顏子猶拘名教為昏於大夢之中不達死生未嘗暫覺者也覺者古孝反注下皆同以變化為形之駭動耳故不以死生損纍其心彼之孟孫冥於變化假見生死為形之驚動終無哀樂損纍心神也駭形如字崔作咳云有嬰兒之形以形骸之變為旦宅之日新耳其情不以為死旦日新也宅者神之舍也以形之改變為宅舍之日新耳其性靈凝淡終無死生之纍者也旦宅並如字王云旦暮改易宅是神居也李本作怛上丹末反下陟嫁反云驚惋之貌崔本作靼宅靼怛也夫常覺者無往而有逆也故人哭亦哭正自是其所宜也孟孫冥同生死獨居覺悟應於內外不乖人理人哭亦哭自是順物之宜者也所以乃崔本乃作惡夫死生變化吾皆吾之既皆是吾吾何失哉未始失吾吾何憂哉無逆故人哭亦哭無憂故哭而不哀吾生吾死相與皆吾未始非吾吾何所失若以係吾為意何適非吾靡所不吾也故玄同外內彌貫古今與化日新豈知吾之所在也庸常也凡常之人識見淺狹詎知吾之所謂無處非吾假令千變萬化而吾常在新吾故吾何欣何惡也庸詎其庶反下章同言無往而不自得也夢之時自以為覺則焉知今者之非夢耶亦焉知其非覺耶覺夢之化無往而不可則死生之變無時而足惜也厲至也且為魚為鳥任性逍遙處死處生居然自得而魚鳥既無優劣死生亦何勝負而係之哉孟孫妙達斯源所以未嘗介意又不知今之所論魚鳥者為是覺中而辨為是夢中而説乎夫人夢中自以為覺今之覺者何妨夢中是知覺夢生死未可定也所造皆適則忘適矣故不及笑也排者推移之謂也夫禮哭必哀獻笑必樂哀樂存懷則不能與適推移矣今孟孫常適故哭而不哀與化俱往也造至也獻善也排推移也夫所至皆適斯亦適也其常適何及歡笑然後樂哉若從善事感己而後適者此則不能隨變任化與物推移也今孟孫常適故哭而不哀也造適七報反注同獻笑向云獻善也王云章也意有適章於笑故曰獻笑家世父曰造適者以心取適而已言笑皆忘也獻笑者以笑為歡而已推排皆化也極推排之力而冥然安之窮變化之用而超然去之乃以遊蕩於萬物之表而與天為一及排皮皆反必樂音洛下同安於推移而與化俱去故乃入於寂寥而與天為一也自此以上至於子祀其致一也所執之喪異故歌哭不同所在皆適故安任推移未始非吾而與化俱去如此之人乃能入於寥廓之妙門自然之一道也寥本亦作廖力雕反李良救反天一崔本作造敵不及笑獻芥不及安排而造化不及眇眇不及雄漂淰雄漂淰不及簟筮簟筮乃入於漻天一以上時掌反朱桂曜本乃作盈世德堂本往作生世德堂本以作似趙諫議本無注首夫字注末也字世德堂本是吾作自吾兩哉字均作矣意而子見許由許由曰堯何以資汝資者給濟之謂也意而古之賢人資給濟之謂也意而先謁帝堯後見仲武問云帝堯大聖道德甚高汝既謁見有何敬授資濟之術幸請陳説耳意而子李云賢士也資汝資給也意而子曰堯謂我汝必躬服仁義而明言是非躬身也仁則恩慈育物義則斷割裁非是則明賞其善非則明懲其惡此之四者人倫所貴汝必須己身服行亦須明言示物此是意而述堯教語之辭也許由曰而奚來為軹夫堯既已黥汝以仁義而劓汝以是非矣汝將何以遊夫遙蕩恣睢轉徙之塗乎而汝也奚何也軹語助也堯將教迹刑害於汝瘡痕已大何為更來矣為軹之是反郭之忍反崔云軹辭也李云是也言其將以刑教自虧殘而不能復遊夫自得之場無係之塗也黥鑿額也劓割鼻也恣睢縱任也轉徙變化也塗道也夫仁義是非損傷真性其為殘害譬之刑戮汝既被堯黥劓拘束性情如何復能遨遊自得逍遙放蕩從容自適於變化之道乎言其不復能如是黥其京反劓魚器反李云毀道德以為仁義不似黥乎破玄同以為是非不似劓乎遙蕩王云縱散也恣七咨反又如字睢郭李云許維反徐許鼻反李王皆云恣睢自得貌復遊扶又反下同意而子曰雖然吾願遊於其藩不敢復求涉中道也且願遊其藩傍而已我雖遭此虧殘而庶幾之心靡替不復敢當中路願涉道之藩傍也其藩甫煩反李音煩司馬向皆云崖也崔云域也許由曰不然夫盲者無以與乎眉目顏色之好瞽者無以與乎青黃黼黻之觀盲者有眼睛而不見物瞽者眼無眹縫如鼓皮也作斧形謂之黼兩己相背謂之黻而盲瞽之人眼睛已敗既不能觀文彩青黃亦不愛好眉目顏色譬意而遭堯黥劓情智已傷豈能愛慕深玄觀覽衆妙邪盲者本又作眇崔本作目云目或作刑刑黥劓也以與音豫下同之好如字又呼報反黼黻上音甫下音弗觀古亂反意而子曰夫無莊之失其美據梁之失其力黃帝之亡其知皆在爐捶之間耳庸詎知夫造物者之不息我黥而補我劓使我乘成以隨先生邪言天下之物未必皆自成也自然之理亦有須冶鍛而為器者耳故此之三人亦皆聞道而後忘其所務也此皆寄言以遣云為之纍耳無莊古之美人為聞道故不復莊飾而自忘其美色也據梁古之多力人為聞道守雌故不勇其力也黃帝軒轅也有聖知亦為聞道故能忘遣其知也爐灶也錘鍛也以上三人皆因聞道然後忘其所務以契其真猶如世間器物假於爐冶打鍛以成其用者耳今何妨自然之理令夫子教示於我以成其道耶故知自然造物在爐冶之間則是有修學冶鍛之義也無莊據梁司馬云皆人名李云無莊無莊飾也據梁強梁也爐音盧捶本又作錘徐之睡反又之反一音時反李云錘鴟頭頗口句鐵以吹火也崔云盧謂之甕捶當作甀盧甀之間言小處也甀音丈偽反鍛丁亂反夫率性直往者自然也往而傷性性傷而能改者亦自然也庸詎知我之自然當不息黥補劓而乘可成之道以隨夫子耶而欲棄而勿告恐非造物之至也造物猶造化也我雖遭仁義是非殘傷情性焉知造化之內不補劓息黥令我改過自新乘可成之道隨夫子以請益耶乃欲棄而不教恐乖造物者也慶藩案乘猶載也成猶也與詩儀既成兮義同黥劓則形體不備息之補之復完成矣言造物者使我得遇先生安知不使我載一成體以相隨耶此兼采宣氏説較郭訓為長趙諫議本捶作錘趙本性作然世德堂本知我作我知世德堂本無也字許由曰噫未可知也我為汝言其大略吾師乎吾師乎萬物而不為義澤及萬世而不為仁長於上古而不為老覆載天地刻雕衆形而不為巧此所遊已噫嘆聲也至道深玄絶於言象不可以心慮測故嘆云未可知也既請益殷勤亦無容杜默雖復不可言盡為汝梗概陳之曰噫徐音醫李云歎聲也崔云亂也本亦作意音同又如字謂呼意而名也我為于偽反注同皆自爾耳亦無愛為於其間也安所寄其仁義吾師乎者至道也然至道不可心知為汝略言其要即吾師是也碎也至如素秋霜降碎落萬物豈有情斷割而為義哉青春和氣生育萬物豈有情恩愛而為仁哉蓋不然而然也而許由師於至道至道既其如是汝何得躬服仁義耶此略為意而説息黥補劓之方也子兮反司馬云碎也盧文弨曰説文作亦作兗陸每從敕訛今從隸省作下並同日新也長於丁丈反自然故非巧也萬象之前先有此道智德具足故義説為長而實無長也長既無矣老豈有耶欲明不長而長老而不老故長於上古而不為老也雖復天覆地載而以道為源衆形雕刻咸資造化同稟自然故巧名斯滅既其無老無巧無是無非汝何所明言耶遊於不為而師於無師也吾師之所遊心止如此説而已此則總結以前吾師之義是也顏回曰回益矣以損之為益也顏子稟教孔氏服膺問道覺己進益呈解於師損有益空故以損為益也仲尼曰何謂也既言益矣有何意謂曰回忘仁義矣忘兼愛之仁遣裁非之義所言益者此之謂乎曰可矣猶未也仁者兼愛之迹義者成物之功愛之非仁仁迹行焉成之非義義功見焉存夫仁義不足以知愛利之由無心故忘之可也但忘功迹故猶未玄達也仁義已忘於理漸可解心尚淺所以猶未功見賢遍反下文同他日復見曰回益矣他日猶異日也空解日新時更復見所言進益列在下文他日崔本作異日下亦然復見扶又反下同曰何謂也所言益者是何意謂也曰回忘禮樂矣禮者荒亂之首樂者淫蕩之具為纍更重次忘之也曰可矣猶未也禮者形體之用樂者樂生之具忘其具未若忘其所以具也虛心漸可猶未至極也樂生音洛又音嶽他日復見曰回益矣曰何謂也並不異前解也曰回坐忘矣虛心無著故能端坐而忘坐忘之義具列在下文慶藩案文選賈長沙鵩鳥賦注引司馬云坐而自忘其身釋文闕仲尼蹴然曰何謂坐忘蹴然驚悚貌也忘遺既深故悚然驚歎坐忘之謂厥義云何也蹴然子六反崔云變色貌顏回曰墮肢體黜聰明離形去知同於大通此謂坐忘墮毀廢也黜退除也雖聰屬於耳明關於目而聰明之用本乎心靈既悟一身非有萬境皆空故能毀廢四肢百體屏黜聰明心智者也墮許規反徐又待果反夫坐忘者奚所不忘哉既忘其迹又忘其所以迹者內不覺其一身外不識有天地然後曠然與變化為體而無不通也大通猶大道也道能通生萬物故謂道為大通也外則離析於形體一一虛假此解墮肢體也內則除去心識悗然無知此解黜聰明也既而枯木死灰冥同大道如此之益謂之坐忘也去起呂反知音智坐忘崔云端坐而忘盧文弨曰依次當在蹴然之前仲尼曰同則無好也化則無常也而果其賢乎丘也請從而後也無物不同則未嘗不適未嘗不適何好何惡哉無好呼報反注同何惡烏路反同於化者唯化所適故無常也既同於大道則無是非好惡冥於變化故不執滯守常也果決也而汝也忘遺如此定是大賢丘雖汝師遂落汝後從而學之是丘所願撝謙退己以進顏回者也子輿與子桑友而霖雨十日子輿曰子桑殆病矣裹飯而往食之至子桑之門則若歌若哭鼓琴曰父邪母邪天乎人乎有不任其聲而趨舉其詩焉此二人相為於無相為者也今裹飯而相食者乃任之天理而自爾耳非相為而後往者也雨經三日已上為霖殆近也子桑家貧屬斯霖雨近於餓病此事不疑於方外之交任理而往雖復裹飯非有相為之情者也霖雨本又作淋音林左傳云雨三日以往為霖裹音果食音嗣注同任堪也趨卒疾也子桑既遭飢餒故發琴聲問此飢貧從誰而得為關父母為是人天此則歌哭之辭也不堪此舉又卒爾詩詠也有不任音壬其聲而趨七住反舉其詩焉崔云不任其聲憊也趨舉其詩無音曲也趙諫議本作淋子輿入曰子之歌詩何故若是嫌其有情所以趨出遠理也一於死生忘於哀樂相與於無相與方外之交今子歌詩似有怨望故入門驚怪問其所由也曰吾思夫使我至此極者而弗得也父母豈欲吾貧哉天無私覆地無私載天地豈私貧我哉求其為之者而不得也然而至此極者命也夫言物皆自然無為之者也夫父母慈造不欲飢凍天地無私豈獨貧我思量主宰皆是自然尋求來由竟無兆朕而使我至此窮極者皆我之賦命也亦何惜之有哉
