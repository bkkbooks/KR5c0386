body:
  text: 雜篇讓王第二十八以事名篇堯以天下讓許由許由不受又讓於子州支父子州支父曰以我為天子猶之可也雖然我適有幽憂之病方且治之未暇治天下也夫天下至重也而不以害其生又況他物乎唯無以天下為者可以託天下也堯許事跡具載內篇姓子名州字支父懷道之人隱者也堯知其賢讓以帝位以我為帝亦當能以為事故言猶之可也幽深也憂勞也言我滯竟幽深固心憂勞且欲修身庶令合道未有閒暇緝理萬機也子州支父音甫李云支父字也即支伯也幽憂之病王云謂其病深固也夫位登九五威跨萬乘人倫尊重莫甚於此尚不以斯榮貴損害生涯況乎他外事物何能介意也夫忘天下者無以天下為也唯此之人可以委託於天下也舜讓天下於子州支伯子州支伯曰豫適有幽憂之病方且治之未暇治天下也故天下大器也而不以易生此有道者之所以異乎俗者也舜之事跡具在內篇支伯猶支父也俞樾曰漢書古今人表有子州支父無支伯則支父支伯是一人也夫帝王之位重大之器也而不以此貴易奪其生自非有道孰能如是故異於流俗之行也舜以天下讓善卷善卷曰余立於宇宙之中冬日衣皮毛夏日衣葛絺春耕種形足以勞動秋收斂身足以休食日出而作日入而息逍遙於天地之間而心意自得吾何以天下為哉悲夫子之不知余也遂不受於是去而入深山莫知其處姓善名卷隱者也處於六合順於四時自得天地之間逍遙塵垢之外道在其中故不用天下善卷卷勉反居阮反又音眷李云姓善名卷俞樾曰呂覽下賢篇作善綣衣皮於既反下同古人淳朴喚帝為子恨舜不識野情所以悲歎其處昌慮反舜以天下讓其友石戶之農石戶之農曰捲捲乎后之為人葆力之士也以舜之德為未至也於是夫負妻戴攜子以入於海終身不反也戶字亦有作后者隨字讀之石戶地名也農人也今江南喚人作農此則舜之友人也葆牢固也言舜心志堅固筋力勤苦腰背捲捲不得歸休以此勤勞翻來見讓故不受也石戶本亦作后之農李云石戶地名農農人也捲捲音權郭音眷用力貌葆力音保字亦作保古人荷物多用頭戴如今高麗猶有此風以舜德化未為至極故攜妻子不踐其土入於大海州島之中往而不返也以入於海司馬云凡言入者皆居其海島之上與其曲隈中也大王亶父居邠狄人攻之事之以皮帛而不受事之以犬馬而不受事之以珠玉而不受狄人之所求者土地也大王亶父曰與人之兄居而殺其弟與人之父居而殺其子吾不忍也子皆勉居矣為吾臣與為狄人臣奚以異且吾聞之不以所用養害所養因杖策而去之民相連而從之遂成國於岐山之下夫大王亶父可謂能尊生矣能尊生者雖貴富不以養傷身雖貧賤不以利纍形今世之人居高官尊爵者皆重失之見利輕亡其身豈不惑哉亶父王季之父文王之祖也邠地名狄人獫狁也國鄰戎虜故為狄人攻伐大王音太下同亶丁但反父音甫下同邠筆貧反徐甫巾反事奉也勉勵也奚何狄人貪殘意在土地我不忍傷殺汝勉力居之用養土地也所養百姓也本用地以養人今殺人以存地故不可也因拄杖而去民相連續遂有國於岐陽不以所用養害所養地所以養人也今爭以殺人是以地害人也人為地養故不以地故害人也因杖直亮反策初革反相連力展反司馬云連讀曰輦岐山其宜反或祁支反夫亂世澆僞人心浮淺徇於軒冕以喪其身逐於財利以殞其命不知輕重深成迷惑也不以養傷身不以利纍形王云富貴有養而不以養傷身貧賤無利而不以求利纍形也昧字依釋文原本改越人三世弒其君王子搜患之逃乎丹穴而越國無君求王子搜不得從之丹穴王子搜不肯出越人薰之以艾乘以王輿王子搜援綏登車仰天而呼曰君乎君乎獨不可以舍我乎王子搜非惡為君也惡為君之患也若王子搜者可謂不以國傷生矣此固越人之所欲得為君也搜王子名也丹穴南山洞也玉輿君之車輦也亦有作王字者隨字讀之所謂玉輅也越國之人頻殺君主王子怖懼逃之洞穴呼召不出以艾薰之既請為君故乘以玉輅弒其音試王子搜素羔反又悉遘反又邀遘反李云王子名淮南子作翳俞樾曰釋文云搜淮南子作翳然翳之前無三世弒君之事史記越世家索隱以搜為翳之子無顓據竹書紀年翳為其子所弒越人殺其子立無余又見弒而立無顓是無顓以前三君皆不善終則王子搜是無顓之異名無疑矣淮南子蓋傳聞之誤當據索隱訂正丹穴爾雅云南戴日為丹穴以艾五蓋反王輿一本作玉輿援引也綏車上繩也辭不獲免長歎登車非惡為君恐為禍患以其重生輕位故可屈而為君也援音爰而呼火故反本或作歎以舍音捨非惡烏路反下及下章真惡同趙諫議本王作玉邀遘疑悉邀之誤韓魏相與爭侵地子華子見昭僖侯昭僖侯有憂色子華子曰今使天下書銘於君之前書之言曰左手攫之則右手廢右手攫之則左手廢然而攫之者必有天下君能攫之乎僖侯韓國之君也華子魏之賢人也韓魏相鄰爭侵境土干戈既動勝負未知怵惕居懷故有憂色子華子司馬云魏人也俞樾曰呂覽貴生篇引子華子曰全生為上虧生次之死次之迫生為下又誣徒篇引子華子曰王者樂其所以王亡者樂其所以亡高注並云子華子古體道人知度審為兩篇注同昭僖侯司馬云韓侯俞樾曰韓有昭侯有僖王無昭僖侯銘書記也攫捉取也廢斬去之也假且書一銘記投之於前左手取銘則斬去右手右手取銘則斬去左手然取銘者必得天下君取之不以取以譬借問韓侯也攫俱碧俱縛二反又史虢反李云取也盧文弨曰舊作俱碧反俱縛反或又史虢反訛今皆從宋本改正廢李云棄也司馬云病也一云攫者援書銘廢者斬右手高山寺本君下無能字昭僖侯曰寡人不攫也答云不能斬兩臂而取六合也子華子曰甚善自是觀之兩臂重於天下也身亦重於兩臂韓之輕於天下亦遠矣今之所爭者其輕於韓又遠君固愁身傷生以憂戚不得也歎君之言甚當於理自從也於此言而觀察之則一身重於兩臂兩臂重於天下天下又重於韓韓之與天下輕重遠矣所爭者疆畔之間故於韓輕重遠矣而必固憂愁傷形損性恐其不得豈不惑哉其輕於韓又遠絶句亦字依正文改僖侯曰善哉教寡人者衆矣未嘗得聞此言也子華子可謂知輕重矣頓悟其言歎之奇妙也魯君聞顏闔得道之人也使人以幣先焉顏闔守陋閭苴布之衣而自飯牛魯君之使者至顏闔自對之使者曰此顏闔之家與顏闔對曰此闔之家也使者致幣顏闔對曰恐聽者謬而遺使者罪不若審之使者還反審之復來求之則不得已故若顏闔者真惡富貴也魯侯魯哀公或云魯定公也姓顏名闔魯人隱者也幣帛也聞顏闔得清廉之道欲召之為相故遣使人持幣帛先通其意魯君一本作魯侯李云哀公也苴布子麻布也飯飼也居疏陋之閭巷著粗惡之布衣身自飯牛足明貧儉苴音粗徐七餘反李云有子麻也本或作粗非也飯牛符晚反遺與也不欲幣致此矯詞以欺使者俞樾曰上者字衍文恐聽謬而遺使者罪恐其以誤聽得罪也聽即使者聽之非聽者一人使者一人也呂氏春秋貴生篇正作恐聽繆而遺使者罪之使所吏反下及下章同家與音餘而遺唯季反下皆同復來音服或音扶又反下章皆同闕誤引張君房本者作囗故曰道之真以治身其緒餘以為國家其土苴以治天下由此觀之帝王之功聖人之餘事也非所以完身養生也今世俗之君子多危身棄生以殉物豈不悲哉凡聖人之動作也必察其所以之與其所以為今且有人於此以隨侯之珠彈千仞之雀世必笑之是何也則其所用者重而所要者輕也夫生者豈特隨侯之重哉緒殘也土糞也苴草也夫用真道以持身者必以國家為殘餘之事將天下同於草土者也緒餘並如字徐上音奢下以嗟反司馬李云緒者殘也謂殘餘也慶藩案文選司馬子長報任少卿書注引司馬云緒餘也視釋文較略土敕雅反又片賈行賈二反又音如字苴側雅反又知雅反司馬云土苴如糞草也李云土苴糟魄也皆不真物也一云土苴無心之貌殉逐也察世人之所適往觀黎庶之所云為然後動作而應之也必察其所以之王云聖人真以持身餘以為國故其動作必察之焉所以之者謂德所加之方也所為者謂所以待物也動作如此不必察也隨國近濮水濮水出寶珠即是靈蛇所銜以報恩隨侯所得者故謂之隨侯之珠也夫雀高千仞以珠彈之所求者輕所用者重傷生殉物其義亦然也所要一遙反俞樾曰隨侯下當有珠字若無珠字文義不足呂氏春秋貴生篇作夫生豈特隨侯珠之重也哉當據補高山寺本今下無且字子列子窮容貌有飢色客有言之於鄭子陽者曰列禦寇蓋有道之士也居君之國而窮君無乃為不好士乎鄭子陽即令官遺之粟子列子見使者再拜而辭子陽鄭相也禦寇鄭人也有道而窮子陽不好賢士遠游之客譏刺子陽子陽鄭相不好呼報反命召主倉之官令與之粟禦寇清高辭謝不受也即令力呈反使者去子列子入其妻望之而拊心曰妾聞為有道者之妻子皆得佚樂今有飢色君過而遺先生食先生不受豈不命邪與粟不受天命貧窮嗟惋拊心責夫罪過故知禦寇之妻不及老萊之婦遠矣拊心徐音撫得佚音逸樂音洛君過古臥反本亦作遇高山寺本豈不命邪作豈非命也哉子列子笑謂之曰君非自知我也以人之言而遺我粟至其罪我也又且以人之言此吾所以不受也其卒民果作難而殺子陽子陽嚴酷人多怒之左右有誤折子陽弓者恐必得罪因國人逐猘狗遂殺子陽也作難乃旦反下章同殺子陽子陽嚴酷罪者無赦舍人折弓畏子陽怒責因國人逐猘狗而殺子陽俞樾曰子陽事見呂覽適威篇淮南泛論訓至史記鄭世家則云繻公二十五年鄭公殺其相子陽二十七年子陽之黨共弒繻公駘又與諸書不同楚昭王失國屠羊說走而從於昭王昭王反國將賞從者及屠羊說屠羊說曰大王失國說失屠羊大王反國說亦反屠羊臣之爵祿已復矣又何賞之有昭王名軫平王之子也伍奢伍尚遭平王誅戮子胥奔吳而耕於野後至吳王闔閭之世請兵伐楚遂破楚入郢以雪父之讎其時昭王窘急棄走奔隨又奔於鄭有屠羊賤人名說從王奔走奔走之由置在下文楚昭王名軫平王子屠羊說音悅或如字王曰強之屠羊說曰大王失國非臣之罪故不敢伏其誅大王反國非臣之功故不敢當其賞王曰見之屠羊說曰楚國之法必有重賞大功而後得見今臣之知不足以存國而勇不足以死寇吳軍入郢說畏難而避寇非故隨大王也今大王欲廢法毀約而見說此非臣之所以聞於天下也王謂司馬子綦曰屠羊說居處卑賤而陳義甚高子綦為我延之以三旌之位三旌三公也亦有作圭字者謂三卿皆執圭故謂三卿為圭也俞樾曰子綦為我延之以三旌之位句此昭王自與司馬子綦言當稱子不當稱子綦綦字衍文從者才用反強之其丈反見之賢遍反下同之知音智入郢以井反毀約如字徐於妙反而見如字亦賢遍反為我于僞反三旌三公位也司馬本作三圭云謂諸侯之三卿皆執圭也慶藩案白帖御覽二百二十八並引司馬本三旌作三圭云諸侯三卿皆執三圭與釋文小異屠羊說曰夫三旌之位吾知其貴於屠羊之肆也萬鍾之祿吾知其富於屠羊之利也然豈可以貪爵祿而使吾君有妄施之名乎說不敢當願復反吾屠羊之肆遂不受也妄施如字又始豉反原憲居魯環堵之室茨以生草蓬戶不完桑以為樞而甕牖二室褐以為塞上漏下溼匡坐而弦原憲孔子弟子姓原名思字憲也周環各一堵謂之環堵猶方丈之室也以草蓋屋謂之茨也褐粗衣也匡正也原憲家貧室唯環堵仍以草覆舍桑條為樞蓬作門扉破甕為牖夫妻二人各居一室逢雨溼而弦歌自娛知命安貧所以然也茨徐疾私反李云蓋屋也慶藩案生草新序節士篇作生蒿蒿亦草也生者謂新生未乾之草即牽蘿補屋之意也蓬戶織蓬為戶桑以為樞尺朱反司馬云屈桑條為戶樞也甕牖音酉司馬云破甕為牖二室司馬云夫妻各一室褐下葛反郭音葛字或作為塞悉代反司馬云以褐衣塞牖也匡坐而弦司馬云匡正也案弦謂弦歌闕誤引張君房本弦下有歌字褐字依釋文原本及世德堂本改子貢乘大馬中紺而表素軒車不容巷往見原憲原憲華冠縰履杖藜而應門子貢孔子弟子名賜能言語好榮華其軒蓋是白素為紺色車馬高大故巷道不容也中紺古暗反李云紺為中衣加素為表縰躡也以華皮為冠用藜藿為杖貧無僕使故自應門也華冠胡化反以華木皮為冠慶藩案華也說文木也以其皮裹松脂讀若華或作穫玉篇穫並胡霸胡郭二切字通作華司馬相如上林賦華楓枰櫨張揖曰華皮可以為索縰履所倚反或所買反本或作并下曳縰同三蒼解詁作云躡也聲類或作屣韋昭蘇寄反通俗文云履不著跟曰屣司馬本作踐李云縰履謂履無跟也王云體之能躡舉而曳之也履或作屨杖藜以藜為杖也司馬本作扶杖也應門自對門也字依段氏說文改子貢曰嘻先生何病原憲應之曰憲聞之無財謂之貧學而不能行謂之病今憲貧也非病也子貢逡巡而有愧色嘻笑聲也逡巡卻退貌也以儉繫奢故懷慚愧之色嘻許其反逡巡七旬反原憲笑曰夫希世而行比周而友學以為人教以為己仁義之慝輿馬之飾憲不忍為也慝姦惡也飾莊嚴也夫趨世候時希望富貴周旋親比以結朋黨自求名譽學以為人多覓束修教以為己託仁義以為姦慝飾車馬以衒矜夸君子恥之不忍為之也希世而行司馬云希望也所行常顧世譽而動故曰希世而行比周毗志反為人于僞反下為己同教以為己學當為己教當為人今反不然也仁義之慝吐得反惡也司馬云謂依託仁義為姦惡曾子居衛縕袍無表顏色腫噲手足胼胝三日不舉火十年不製衣正冠而纓絶捉襟而肘見納屨而踵決曳縰而歌商頌聲滿天地若出金石天子不得臣諸侯不得友故養志者忘形養形者忘利致道者忘心矣以麻縕袍絮復無表裏也腫噲猶剝錯也每自力作故生胼胝縕袍紆紛反司馬云謂麻縕為絮論語云衣敝縕袍是也種本亦作腫章勇反盧文弨曰今書作腫噲古外反徐古活反司馬云種噲剝錯也王云盈虛不常之貌慶藩案釋文引司馬云種噲剝錯也王云盈虛不常之貌據說文噲咽也一曰饞噲也疑字當為癐病甚也通作腫決曰說文瘣病也一曰腫旁出噲瘣並一聲之轉胼薄田反胝竹尼反守分清虛家業窮窶三日不營熟食十年不製新衣繩爛正冠而纓斷袖破捉襟而肘見履敗納之而後決也肘竹久反見賢遍反響歌商頌響韻宮商察其詞理雅符天地聲氣清虛又諧金石風調高素超絶人倫故不與天子為臣不與諸侯為友也夫君子賢人不以形挫志攝衛之士不以利傷生得道之人心知之術也孔子謂顏回曰回來家貧居卑胡不仕乎顏回對曰不願仕回有郭外之田五十畝足以給粥郭內之田十畝足以為絲麻鼓琴足以自娛所學夫子之道者足以自樂也回不願仕孔子愀然變容曰善哉回之意丘聞之知足者不以利自纍也審自得者失之而不懼行修於內者無位而不怍丘誦之久矣今於回而後見之是丘之得也麋也怍羞也夫自得之士不以得喪駭心內修之人豈復羞慚無位孔子誦之其來已久今勸回仕豈非失言因回反照故言丘得之矣之然反字或作饘廣雅云糜也一云紀言反家語云厚粥一音干謂干盧文弨曰舊訛餅今改正粥之六反又音育自樂音洛愀七小反徐在九反又七了子了二反又資酉反李音秋又七遙反一本作欣盧文弨曰舊作七了反子了反今改正下七遙反舊脫七字亦補正行修下孟反不怍在洛反爾雅云慚也又音昨闕誤引江南李氏本利作羡中山公子牟謂瞻子曰身在江海之上心居乎魏闕之下奈何瞻子魏之賢人也魏公子名牟封中山故曰中山公子牟也公子有嘉遁之情而無高蹈之德故身在江海上而隱遁心思魏闕下之榮華既見賢人借問其術也公子牟司馬云魏之公子封中山名牟瞻子賢人也淮南作詹魏闕淮南作騩司馬本同云騩讀曰魏象魏觀闕人君門也言心存榮貴許慎云天子兩觀也盧文弨曰案今淮南亦作魏瞻子曰重生重生則利輕重於生道則輕於榮利榮利既輕則不思魏闕重生李云重存生之道者則名利輕輕則易絶矣此人身居江海心貪榮利故以此戒之中山公子牟曰雖知之未能自勝也雖知重於生道未能勝於情欲能勝音升下同世德堂本無自字瞻子曰不能自勝則從神無惡乎不能自勝而強不從者此之謂重傷重傷之人無壽類矣若不勝於情欲則宜從順心神亦不勞妄生嫌惡也不能自勝則從絶句一讀至神字絶句俞樾曰釋文曰不能自勝則從絶句此讀是也又曰一讀至神字絶句則失之呂氏春秋審為篇亦載此事作不能自勝則縱之神無惡乎文子下德篇淮南子道應篇并疊從之二字作從之從之則從神之不當連讀明矣又案從呂氏春秋作縱則當讀子用反而釋文無音亦失之無惡如字又烏路反乎絶句一讀連下不能自勝為句情既不勝強生抑挫情欲已損抑又乖心故名重傷也如此之人自然夭折故不得與壽考者為儕類也重傷直用反下同俞樾曰重傷猶再傷也不能自勝則已傷矣又強制之而不使縱是再傷也故曰此之謂重傷呂氏春秋審為篇高誘注曰重讀復重之重是也釋文音直用反非是趙諫議本無此重傷二字魏牟萬乘之公子也其隱巖穴也難為於布衣之士雖未至乎道可謂有其意矣夫大國王孫生而榮貴遂能巖棲谷隱身履艱辛雖未階乎玄道而有清高之志足以激貪勵俗也萬乘繩證反孔子窮於陳蔡之間七日不火食藜羹不糝顏色甚憊而弦歌於室顏回擇菜子路子貢相與言曰夫子再逐於魯削跡於衛伐樹於宋窮於商周圍於陳蔡殺夫子者無罪藉夫子者無禁弦歌鼓琴未嘗絶音君子之無恥也若此乎陳蔡之事外篇已解既遭飢餒營無火食藜菜之羹不加米糝顏色衰憊而歌樂自娛達道聖人不以為事也不火食元嘉本無火字不糝素感反甚憊皮拜反仕於魯而被放游於衛而削跡講於宋樹下而司馬桓魋欲殺夫子憎其坐處遂伐其樹故欲殺夫子當無罪咎凌藉之者應無禁忌由賜未達故發斯言伐樹於宋孔子之宋與弟子習禮大樹下宋司馬桓魋欲殺孔子伐其樹孔子遂行藉藉毀也又云凌藉也一云鑿也或云係也趙諫議本擇作釋顏回無以應入告孔子孔子推琴喟然而歎曰由與賜細人也召而來吾語之子路子貢入子路曰如此者可謂窮矣喟然嗟歎貌由與賜細碎之人也命召將來告之善道如斯困苦豈不窮乎喟去愧反又苦怪反語之魚據反孔子曰是何言也君子通於道之謂通窮於道之謂窮今丘抱仁義之道以遭亂世之患其何窮之為故內省而不窮於道臨難而不失其德天寒既至霜雪既降吾是以知松柏之茂也陳蔡之隘於丘其幸乎夫歲寒別木處窮知士因難顯德可謂幸矣慶藩案何窮之為為猶謂也古謂為二字義通呂氏春秋慎人篇作何窮之謂呂氏春秋精諭篇胡為不可淮南原道道應篇作胡謂不可漢書高帝紀酈食其為里監門史記為作謂皆其證案左傳一之謂甚韓詩外傳王欲用何謂辭之新序雜事篇何謂至於此也謂字並與為同義臨難乃旦反俞樾曰天乃大字之誤國語魯語大寒降韋昭注曰謂季冬建丑之月大寒之後也若作天寒既至失其義矣呂氏春秋慎人篇亦載此事正作大寒之隘音厄又於懈反趙諫議本雪作露闕誤引江南古藏本茂也下有桓公得之莒文公得之曹越王得之會稽十六字孔子削然反琴而弦歌子路扢然執干而舞子貢曰吾不知天之高也地之下也削然取琴聲也扢然奮勇貌也既師資領悟彼此歡娛也削然如字李云反琴聲亦作梢音消盧文弨曰宋本梢作俏扢許訖反又巨乙反魚乙反李云奮舞貌司馬云喜貌執干干楯也古之得道者窮亦樂通亦樂所樂非窮通也道德於此則窮通為寒暑風雨之序矣故許由娛於潁陽而共伯得乎共首夫陰陽天地有四序寒溫人處其中何能無窮通否泰耶故得道之人處窮通而常樂譬之風雨何足介懷乎亦樂音洛下同俞樾曰德當作得呂覽慎人篇作道得於此則窮達一也為寒暑風雨之序矣疑此文窮通下亦當有一也二字而今奪之共伯名和周王之孫也懷道抱德食封於共厲王之難天子曠絶諸侯知共伯賢請立為王共伯不聽辭不獲免遂即王位一十四年天下大旱舍屋生火卜曰厲王為祟遂廢共伯而立宣王共伯退歸還食本邑立之不喜廢之不怨逍遙於丘首之山丘首山今在河內潁陽地名在襄陽未為定地名也故許由娛樂於潁水共伯得志於首山也虞於潁陽廣雅云虞安也安於潁陽一本作娛娛樂也共伯音恭下同得乎共首司馬云共伯名和修其行好賢人諸侯皆以為賢周厲王之難天子曠絶諸侯皆請以為天子共伯不聽即干王位十四年大旱屋焚卜於太陽兆曰厲王為祟召公乃立宣王共伯復歸於宗逍遙得意共山之首共丘山今在河內共縣西魯連子云共伯後歸於國得意共山之首紀年云共伯和即干王位孟康注漢書古今人表以為入為三公本或作丘首盧文弨曰案今蜀書作攝行天子事慶藩案路史發揮二注引司馬云共伯和修行而好賢厲王之難天子曠絶諸侯知共伯賢立為天子共伯不聽弗獲免遂即王位一十四年天下大旱舍屋焚卜於太陽兆曰厲王為祟召公乃立宣王共伯還歸於宗逍遙得意於共丘山之首與釋文小異藩又案釋文引司馬云共伯逍遙得意於共山之首而不詳共山屬某所疑共首即共頭也荀子儒效篇至共頭而山隧楊倞注共河內縣名共頭蓋共縣之山名盧云共頭即莊子之共首呂氏春秋誠廉篇亦作共頭此首字亦當為頭之誤頭從頁頁即首字也古頭首字通用高山寺本德作得闕誤引江南古藏本娛作虞闕誤引江南古藏本得乎共首作得志乎丘首趙諫議本共作丘今本作娛舜以天下讓其友北人無擇北人無擇曰異哉后之為人也居於畎畝之中而遊堯之門不若是而已又欲以其辱行漫我吾羞見之因自投清泠之淵孔子曰士志於仁者有殺身以成仁無求生以害仁夫志尚清遐高風邈世與夫貪利沒命者故有天地之降也北方之人名曰無擇舜之友人也后君也壟上曰畝下曰畎清泠淵在南陽西崿縣界舜耕於歷山長於壟畝游堯門闕受堯禪讓其事跡豈不如是乎又欲將恥辱之行汙漫於我以此羞慚遂投清泠也俞樾曰廣韻二十五德北字注古有北人無擇則北人是復姓漢書古今人表作北人亡擇畎古犬反畝司馬云壟上曰畝壟中曰畎盧文弨曰畝字俗說文作亦作為正辱行下孟反下章同漫我武諫反徐武畔反下章同清泠音零之淵山海經云在江南一云在南陽郡西崿山下湯將伐桀因卞隨而謀卞隨曰非吾事也湯曰孰可曰吾不知也湯又因瞀光而謀瞀光曰非吾事也趙諫議本作務下同湯曰孰可曰吾不知也湯曰伊尹何如曰強力忍垢吾不知其他也姓卞名隨姓務名光並懷道之人隱者也湯知其賢因之謀議既非隱者之務故答以不知姓伊名尹字贄佐世之賢人也忍耐也垢恥辱也既欲阻兵應須強力之士方將弒主亦藉耐羞之人他外之能吾不知也瞀光音務又莫豆反本或作務強力李云阻兵須力盧文弨曰舊阻訛徂今改正忍垢司馬云垢辱也李云弒君須忍垢也湯遂與伊尹謀伐桀剋之以讓卞隨卞隨辭曰后之伐桀也謀乎我必以我為賊也勝桀而讓我必以我為貪也吾生乎亂世而無道之人再來漫我以其辱行吾不忍數聞也乃自投水而死漫汙也稠水在潁川郡界字又作桐數聞音朔水直留反本又作桐水徐音同又徒董反又音封本又作稠司馬本作洞云洞水在潁川一云在范陽郡界以字依世德堂本補椆字依世德堂本及釋文原本改下釋文同湯又讓瞀光曰知者謀之武者遂之仁者居之古之道也吾子胡不立乎瞀光辭曰廢上非義也殺民非仁也人犯其難我享其利非廉也吾聞之曰非其義者不受其祿無道之世不踐其土況尊我乎吾不忍久見也乃負石而自沈於廬水享受也廢上謂放桀也殺民謂征戰也人犯其難謂遭誅戮也我享其利謂受祿也知者音智其難乃旦反舊說曰如卞隨務光者其視天下也若六合之外人所不能察也斯則謬矣夫輕天下者不得有所重也苟無所重則無死地矣以天下為六合之外故當付之堯舜湯武耳淡然無係故然從衆得失無於懷何自投之為哉若二子者可以為殉名慕高矣未可謂外天下也廬水在遼西北平郡界也廬水音閭司馬本作盧水在遼東西界一云在北平郡界淡然徒暫反無古代反人字依正文補泛字依世德堂本改趙諫議本無也字昔周之興有士二人處於孤竹曰伯夷叔齊二人相謂曰吾聞西方有人似有道者試往觀焉至於岐陽武王聞之使叔旦往見之與盟曰加富二等就官一列血牲而埋之孤竹國名在遼西伯夷叔齊兄弟讓位聞文王有道故往觀之夷齊事跡外篇已解矣孤竹司馬云孤竹國在遼東令支縣界伯夷叔齊其君之二子也令音郎定反支音巨移反岐陽是岐山之陽文王所都之地今扶風是也周公名旦是武王之弟故曰叔旦也其時文王已崩武王登極將欲伐紂招慰賢良故令周公與其盟誓加祿二級授官一列仍牲血釁其盟書埋之壇下也血牲一本作殺牲司馬本作血之以牲世德堂本與下有之字二人相視而笑曰嘻異哉此非吾所謂道也昔者神農之有天下也時祀盡敬而不祈喜其於人也忠信盡治而無求焉樂與政為政樂與治為治不以人之壞自成也不以人之卑自高也不以遭時自利也今周見殷之亂而遽為政上謀而下行貨阻兵而保威割牲而盟以為信揚行以說衆殺伐以要利是推亂以易暴也吾聞古之士遭治世不避其任遇亂世不為苟存今天下暗德衰其並乎周以塗吾身也不如避之以潔吾行二子北至於首陽之山遂餓而死焉若伯夷叔齊者其於富貴也苟可得已則必不賴高節戾行獨樂其志不事於世此二士之節也祈求也喜福也神農之世淳朴未殘四時祭祀盡於恭敬其百姓忠誠信實緝理而已無所求焉嘻許其反一音於其反祈喜如字徐許記反俞樾曰喜當作禧爾雅釋詁禧福也不祈禧者不祈福也呂氏春秋誠廉篇作時祀盡敬而不祈福也與此字異義同盡治直吏反為政順事百姓緝理從於物情終不幸人之災以為己福願人之險以為己利也遽速也速為治政彰紂之虐謀謨行貨以保兵威顯物行說以化黎庶可謂推周之亂以易殷之暴也王念孫曰上謀而下行貨下字後人所加也上與尚同上謀而行貨阻兵而保威句法正相對後人誤讀上為上下之上故加下字耳呂氏春秋誠廉篇正作上謀而行貨阻兵而保威揚行下孟反下吾行戾行同以說音悅以要一遙反論語曰伯夷叔齊餓于首陽之下不言其死也而此云死焉亦欲明其守餓以終未必餓死也此篇大意以起高讓遠退之風故被其風者雖貪冒之人乘天衢入紫庭猶時慨然中路而歎況其凡乎故夷許之徒足以當稷契對伊呂矣夫居山谷而弘天下者雖不俱為聖佐不猶高於蒙埃塵者乎其事雖難為然其風少弊故可遺也曰夷許之弊安在曰許由之弊使人飾讓以求進遂至乎之噲也伯夷之風使暴虐之君得肆其毒而莫之敢亢也伊呂之弊使天下貪冒之雄敢行篡逆唯聖人無跡故無弊也若以伊呂為聖人之跡則伯夷叔齊亦聖人之跡也若以伯夷叔齊非聖人之跡邪則伊呂之事亦非聖人矣夫聖人因物之自行故無跡然則所謂聖者我本無跡故物得其跡跡得而強名聖則聖者乃無跡之名也塗汙也若與周並存恐汙吾行不如逃避餓死於首山首山在蒲州城南近河是也故被皮義反貪冒亡北反或亡報反下同稷契息列反之噲音快篡初患反唐云或曰讓王之篇其章多重生而務光二三子自投於水何也答曰莊書之興存乎反本反本之由先於去榮是以明讓王之一篇標傲世之逸志旨在不降以厲俗無厚身以全生所以時有重生之辭者亦歸棄榮之意耳深於塵務之為弊也其次者雖復被褐啜粥保身而已其全道尚高而超俗自逸寧投身於清泠終不屈於世纍也此舊集音有聊復録之於義無當也高山寺本作熹高山寺本無下字殷字依高山寺本及闕誤引江南古藏本李氏本改人字依趙諫議本補
