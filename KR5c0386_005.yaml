body:
  text: 內篇齊物論第二夫自是而非彼美己而惡人物莫不皆然然故是非雖異而彼我均也齊物論力頓反李如字而惡烏路反南郭子綦隱機而坐仰天而噓答焉似喪其耦顏成子遊立侍乎前曰何居乎形固可使如稿木而心固可使如死灰乎今之隱機者非昔之隱機者也同天人均彼我故外無與為歡而答焉解體若失其配匹楚昭王之庶弟楚莊王之司馬字子綦古人淳質多以居處為號居於南郭故號南郭亦猶市南宜僚東郭順子之類其人懷道抱德虛心忘淡故莊子羡其清高而託為論首隱憑也噓嘆也答焉解釋貌耦匹也身與神為匹物與我為耦也子綦憑几坐忘凝神遐想仰天而歎妙悟自然離形去智答焉墜體身心俱遣物我忘故若喪其匹耦也南郭子綦音其司馬云居南郭因為號隱於靳反馮也機音紀李本作几盧文弨曰案今本作几而噓音虛吐氣為噓向云息也答焉本又作嗒同吐答反又都納反注同解體貌盧文弨曰今本作嗒案解體即趙岐孟子注所云解罷枝也慶藩案慧琳一切經音義八十八終南山龍田寺釋法琳本傳卷四引司馬云答焉云失其所故有似喪耦也釋文闕其耦本亦作偶五口反匹也對也司馬云耦身也身與神為耦俞樾曰喪其耦即下文所謂吾喪我也郭注曰若失其配匹未合喪我之義司馬云耦身也此説得之然云身與神為耦則非也耦當讀為寓寓寄也神寄於身故謂身為寓死灰稿木取其莫無情耳夫任自然而忘是非者其體中獨任天真而已又何所有哉故止若立枯木動若運稿枝坐若死灰行若遊塵動止之容吾所不能一也其於無心而自得吾所不能二也姓顏名偃字子遊居安處也方欲請益故起而立侍如何安處神識凝寂頓異從來遂使形將稿木而不殊心與死灰而無別必有妙術請示所由顏成子遊李云子綦弟子也姓顏名偃諡成字子遊何居如字又音姬司馬云猶故也稿木古老反注同音寂本亦作寂盧文弨曰舊訛家今案大宗師云其容釋文云本亦作寂崔本作據改正方言云安靜也漢人碑版多作此字老子銘顯虛無之清張公神碑疆界靜成皋令任伯嗣碑官朝靜巴郡太守張納碑四竟謐博陵太守孔彪碑兮冥冥皆如此作今注作寂寞莫本亦作漠子遊嘗見隱機者而未有若子綦也子遊昔見坐忘未盡玄妙今逢隱機實異曩時怪其寂泊無情故發驚疑之旨趙諫議本無解字為字依上句例補莫趙本作寂漠世德堂本作寂寞其於無心而自得趙本作無心自得二也世德堂本作一也趙本二亦作一與上句一字下均無也字世德堂本嘗作常有作見子綦曰偃不亦善乎而問之也今者吾喪我汝知之乎女聞人籟而未聞地籟女聞地籟而未聞天籟夫吾喪我我自忘矣我自忘矣天下有何物足識哉故都忘外內然後超然俱得而猶汝也喪猶忘也許其所問故言不亦善乎而子綦境智兩忘物我雙絶子遊不悟而以驚疑故示隱几之能汝頗知不籟簫也夫簫管參差宮商異律故有短長高下萬殊之聲聲雖萬殊而所稟之度一也然則優劣無所錯其間矣況之風物異音同是而咸自取焉則天地之籟見矣人籟簫也長一尺二寸十六管象鳳翅舜作也夫簫管參差所受各足況之風物咸稟自然故寄此二賢以明三籟之義釋在下文女聞音汝下皆同本亦作汝盧文弨曰上汝知何以不一律作女人籟力帶反簫也籟夫音扶參初林反差初宜反所錯七故反見矣賢遍反人字依注文刪子遊曰敢問其方方道術也雖聞其名未解其義故請三籟其術如何子綦曰夫大塊噫氣其名為風是唯無作作則萬竅怒呺而獨不聞之翏翏乎山林之畏佳大木百圍之竅穴似鼻似口似耳似枅似圈似臼似窪者似污者激者謞者叱者吸者叫者譹者宎者咬者前者唱于而隨者唱喁泠風則小和飄風則大和厲風濟則衆竅為虛而獨不見之調調之二乎大塊者無物也夫噫氣者豈有物哉氣塊然而自噫耳物之生也莫不塊然而自生則塊然之體大矣故遂以大塊為名大塊者造物之名亦自然之稱也言自然之理通生萬物不知所以然而然大塊之中噫而出氣仍名此氣而為風也大塊苦怪反李苦對反説文同云俗字也徐口回反徐李又胡罪反郭又苦猥反司馬云大朴之貌衆家或作大槐班固同淮南子作大昧解者或以為無或以為元氣或以為混成或以為天謬也慶藩案慧琳一切經音義九十五正誣經卷五引司馬云大塊謂天也與釋文所引異俞樾曰大塊者地也塊乃之或體説文土部墣也蓋即中庸所謂一撮土之多者積而至於廣大則成地矣故以地為大塊也司馬云大朴之貌郭注曰大塊者無物也並失其義此本説地籟然則大塊者非地而何噫乙戒反注同一音蔭言風唯無作作則萬竅皆怒動而為聲也是者指此風也作起也言此大風唯當不起若其動作則萬殊之穴皆鼓怒呺叫也萬竅苦弔反怒呺胡刀反徐又口反又胡到反長風之聲翏翏良救反又六收反長風聲也李本作飂音同又力竹反大風之所扇動也翏翏長風之聲畏佳扇動之貌而翏翏清吹擊蕩山林遂使樹木枝條畏佳扇動世皆共睹汝獨不聞之邪下文云畏於鬼反郭烏罪反崔本作佳醉癸反徐子唯反郭祖罪反李諸鬼反李頤云畏隹山阜貌盧文弨曰佳舊本作隹今莊子衆家本皆作佳韻會支韻內引此似亦可讀追此所音皆仄聲然實與佳本音皆相近故從衆家本改正此略舉衆竅之所似竅穴樹孔也枅柱頭木也今之斗是也圈畜獸闌也木既百圍穴亦奇衆故或似人之口鼻或似獸之闌圈或似人之耳孔或似舍之枅或窪曲而擁腫或污下而不平形勢無窮略陳此八事亦世間萬物種類不同或醜或妍蓋稟之造化之竅崔本作窾似鼻似口司馬云言風吹竅穴動作或似人鼻或似人口似枅音雞又音肩字林云柱上方木也簡文云欂櫨也似圈起權反郭音權杯圈也徐其阮反言如羊豕之闌圈也似臼其九反似窪者攜反李於花反又烏乖反郭烏蛙反司馬云若窪曲污者音烏司馬云若污下此略舉竅之聲殊激者如水湍激聲也謞者如箭鏃頭孔聲也叱者咄聲也吸者如呼吸聲也叫者如叫呼聲也譹者哭聲也宎者深也若深谷然咬者哀切聲也略舉樹穴即有八種風吹木竅還作八聲亦人稟分不同種種差異率性而動莫不均齊假令小大夭壽未足以相傾激者經歷反如水激也李古弔反司馬云聲若激喚也李又驅弔反慶藩案慧琳一切經音義六十八阿毗達摩大婆沙論卷四引司馬云流急曰激也七十八音經律異相卷十四九十高僧傳十三引並同又文選盧子諒時興詩注玄應衆經音義十四引亦同與釋文所引異謞者音孝李虛交反簡文云若箭去之聲司馬云若歡謞聲盧文弨曰舊音考訛今注本音孝從之叱者昌實反徐音七司馬云若叱咄聲吸者許及反司馬云若噓吸聲也叫者古弔反郭古幼反李居曜反司馬云若叫呼聲也譹者音豪郭又戶報反司馬云若譹哭聲盧文弨曰舊脫者字今增與衆句一例宎者徐於堯反一音杳又於弔反司馬云深者也若深宎宎然咬者於交反或音狡司馬云聲哀切咬咬然又許拜反夫聲之宮商雖千變萬化唱和大小莫不稱其所受而各當其分泠小風也飄大風也于喁皆是風吹樹動前後相隨之聲也故泠泠清風和聲即小暴疾飄風和聲即大各稱所受曾無勝劣以況萬物稟氣自然唱于如字唱喁五恭反徐又音愚又五斗反李云于喁聲之相和也泠風音零李云泠泠小風也小和胡臥反下及注皆同飄風鼻遙反又符遙反李敷遙反司馬云疾風也爾雅云回風為飄不稱尺證反其分符問反下不出者同濟止也烈風作則衆竅實及其止則衆竅虛虛實雖異其於各得則同厲大也烈也濟止也言大風止則衆竅虛及其動則衆竅實虛實雖異各得則同耳況四序盈虛二儀生殺既無心於亭毒豈有意於虔劉厲風司馬云大風向郭云烈風濟子細反向云止也慶藩案厲風濟濟者止也詩鄘風載馳篇旋濟毛傳曰濟止也風止則萬籟寂然故曰衆竅為虛調調動搖貌也言物聲既異而形之動搖亦又不同也動雖不同其得齊一耳豈調調獨是而獨非乎而汝也調調動搖之貌也言物形既異動亦不同雖有調之殊而終無是非之異況盈虛聚散生死窮通物理自然不得不爾豈有是非臧否於其間哉調調音條刀刀徐都堯反向云調調刀刀皆動搖貌盧文弨曰舊俱作刁俗今改依正體動搖如字又羊照反闕誤引李本翏作飂力救切刀字依世德堂本及盧校改下注及疏文並同一下疑脫作喑二字知北遊篇生者喑醷物也釋文喑音陰引李郭云喑醷聚氣貌喑氣亦即聚氣許字依釋文原本改抱經堂原刻本唯作脽誤此本作唯亦非字當作雖由猶古通用今以義別之後不復出烏字依釋文原本改衆字依世德堂本及上注文改趙諫議本亦作異也字依上下文句例補子遊曰地籟則衆竅是已人籟則比竹是已敢問天籟地籟則竅穴之徒人籟則簫管之類並皆眼見此則可知惟天籟深玄卒難頓悟敢陳庸昧請決所疑比竹毗志反又必履反李扶必反注同子綦曰夫吹萬不同而使其自己也咸其自取怒者其誰邪此天籟也夫天籟者豈復別有一物哉即衆竅比竹之屬接乎有生之類會而共成一天耳無既無矣則不能生有有之未生又不能為生然則生生者誰哉塊然而自生耳自生耳非我生也我既不能生物物亦不能生我則我自然矣自己而然則謂之天然天然耳非為也故以天言之以天言之所以明其自然也豈蒼蒼之謂哉而或者謂天籟役物使從己也夫天且不能自有況能有物哉故天者萬物之總名也莫適為天誰主役物乎故物各自生而無所出焉此天道也夫天者萬物之總名自然之別稱豈蒼蒼之謂哉故夫天籟者豈別有一物邪即比竹衆竅接乎有生之類是爾尋夫生生者誰乎蓋無物也故外不待乎物內不資乎我塊然而生獨化者也是以郭注云自己而然則謂之天然故以天然言之者所以明其自然也而言吹萬不同且風唯一體竅則萬殊雖復大小不同而各稱所受咸率自知豈賴他哉此天籟也故知春生夏長目視耳聽近取諸身遠託諸物皆不知其所以悉莫辨其所然使其自己當分各足率性而動不由心智所謂亭之毒之此天籟之大意者也豈復扶又反莫適丁歷反慶藩案文選謝九日從宋公戲馬臺集送孔令詩注引司馬云吹萬言天氣吹煦生養萬物形氣不同已止也使各得其性而止謝靈運道路憶山中詩注江文通雜體詩注引同釋文闕物皆自得之耳誰主怒之使然哉此重明天籟也自取自得也言風竅不同形聲乃異至於各自取足未始不齊而怒動為聲誰使之然也欲明群生糾紛萬象參差分內自取未嘗不足或飛或走誰使其然故知鼓之怒之莫知其宰此則重明天籟之義者也此重直用反四字依世德堂本補靈運二字依文選原本改大知間間小知間間大言炎炎小言詹詹其寐也魂交其覺也形開與接為搆日以心鬥縵者窖者密者小恐惴惴大恐縵縵其發若機栝其司是非之謂也其留如詛盟其守勝之謂也其殺若秋冬以言其日消也其溺之所為之不可使復之也其厭也如緘以言其老洫也近死之心莫使復陽也喜怒哀樂慮嘆變慹姚佚啓態樂出虛蒸成菌日夜相代乎前而莫知其所萌已乎已乎旦暮得此其所由以生乎此蓋知之不同間間寬裕也間間分別也夫智惠寬大之人率性虛淡無是無非小知狹劣之人性靈褊促有取有捨有取有捨故間隔而分別無是無非故間暇而寬裕也大知音智下及注同間間李云無所容貌簡文云廣博之貌間間古間反有所間別也俞樾曰廣雅釋詁間覗也小知間間當從此義謂好覗察人也釋文曰有所間別非是此蓋言語之異炎炎猛烈也詹詹詞費也夫詮理大言猛火炎燎原野清蕩無遺儒墨小言滯於競辨徒有詞費無益教方炎炎于廉于凡二反又音談李作淡徒濫反李頤云同是非也簡文云美盛貌詹詹音占李頤云小辨之貌崔本作閻此蓋寤寐之異凡鄙之人心靈馳躁耽滯前境無得暫停故其夢寐也魂神妄緣而交接其覺悟也則形質開朗而取染也魂交司馬云精神交錯也其覺古孝反形開司馬云目開意悟也此蓋交接之異構合也窖深也今穴地藏穀是也密隱也交接世事構合根塵妄心既重日不足故惜彼寸陰心與日鬥也其運心逐境情性萬殊略而言之有此三別也與接為構司馬云人道交接構結歡愛也縵者旦反簡文云寬心也窖者古孝反司馬云深也李云穴也案穴地藏穀曰窖簡文云深心也此蓋恐悸之異惴惴怵惕也縵縵沮喪也夫境有違從而心恆憂度慮其不遂恐懼交懷是以小恐惴栗而怵惕大恐寬暇而沮喪也小恐曲勇反下及注同惴惴之瑞反李云小心貌爾雅云懼也縵縵李云齊死生貌悸其季反機弩牙也栝箭栝也司主也言發心逐境速如箭栝役情拒害猛若弩牙唯主意是非更無他謂也機栝古活反機弩牙栝箭栝慶藩案文選鮑明遠苦熱行注引司馬云言生死是非臧否交校則禍敗之來若機栝之發釋文闕又案機謂弩牙見易繫辭鄭注釋名曰弩弩怒也鉤弦者曰牙牙外曰郭郭下曰縣刀合名之則曰機栝言如機之巧也機栝與樞機義各不同樞為戶樞機為門橛廣雅也與梱同説文梱門橛也王引之曰樞為戶樞所以利轉機為門梱所以止扉故以樞機並言謂開閣有節也書傳機與栝並言弩牙也此蓋動止之異詛祝也盟誓也言役意是非如祝詛心取境不異誓盟堅守確乎情在勝物詛側據反盟音明徐武耕反郭武病反其衰殺日消有如此者夫素秋搖落玄冬肅殺物景貿遷驟如交臂愚惑之類豈能覺邪唯爭虛妄是非詎知日新消毀人之衰老其狀例然其殺色界反徐色例反注同其溺而遂往有如此者滯溺於境其來已久所為之事背道乖真欲使復命還源無由可致其溺奴狄反郭奴徼反其厭沒於欲老而愈洫有如此者厭沒溺也顛倒之流厭沒於欲惑情堅固有類緘繩豈唯壯年縱恣抑乃老而愈洫其厭於葉反徐於冉反又於感反如緘徐古咸反老洫本亦作溢同音逸郭許鵙反又已質反其利患輕禍陰結遂志有如此者莫無也陽生也耽滯之心鄰乎死地欲使反於生道無由得之近死附近之近復陽陽謂生也家世父曰日以心鬥百變不窮司是非者有萬應之機守勝者有一成之見或久倦思反而殺如秋令或沈迷不悟而溺為之亦有深緘其機無復生人之氣者人心之相搆各視所藏之機以探而取之此蓋性情之異者凡品愚迷執違順順則喜樂違則哀怒然哀樂則重喜怒則輕故喜則心生歡悅樂則形於舞忭怒則當時嗔恨哀則舉體悲號慮則抑度未來嘆則咨嗟已往變則改易舊事慹則屈服不伸姚則輕浮躁動佚則奢華縱放啓則開張情欲態則嬌淫妖冶衆生心識變轉無窮略而言之有此十二審而察之物情斯見矣哀樂音洛慹之涉反司馬云不動貌姚郭音遙徐李敕弔反佚音逸態敕代反李又奴載反此蓋事變之異也自此以上略舉天籟之無方自此以下明無方之自然也物各自然不知所以然而然則形雖彌異其然彌同也夫簫管內虛故能出於雅樂濕暑氣蒸故能生成朝菌亦猶二儀萬物虛假不真從無生有例如菌樂浮幻若是喜怒何施蒸之膺反成菌其隕反向云結也以上時掌反日夜相代代故以新也夫天地萬物變化日新與時俱往何物萌之哉自然而然耳日晝月夜輪轉循環更相遞代互為前後推求根緒莫知其狀者也萌武耕反言其自生已止也推求日夜前後難知起心虞度不如止息又重推旦暮覆察昏明亦莫測其所由固不知其端緒欲明世間萬法虛妄不真推求生死即體皆寂故老經云迎之不見其首隨之而不見其後理由若此旦暮本又作莫音同闕誤引江南古藏本洫作溢依下句例補怒也依釋名改以下郭則栝三字均依釋名刪世德堂本其作自非彼無我非我無所取是亦近矣而不知其所為使若有真宰而特不得其眹可行己信而不見其形有情而無形百骸九竅六藏賅而存焉吾誰與為親汝皆説之乎其有私焉如是皆有為臣妾乎其臣妾不足以相治乎其遞相為君臣乎其有真君存焉如求得其情與不得無益損乎其真一受其成形不忘以待盡與物相刃相靡其行盡如馳而莫之能止不亦悲乎終身役役而不見其成功苶然疲役而不知其所歸可不哀邪人謂之不死奚益其形化其心與之然可不謂大哀乎人之生也固若是芒乎其我獨芒而人亦有不芒者乎夫隨其成心而師之誰獨且無師乎奚必知代而心自取者有之愚者與有焉未成乎心而有是非是今日適越而昔至也是以無有為有無有為有雖有神禹且不能知吾獨且奈何哉彼自然也自然生我我自然生故自然者即我之自然豈遠之哉彼自然也取稟受也若非自然誰能生我若無有我誰稟自然乎然我則自然自然則我其理非遠故曰是亦近矣凡物云云皆自爾耳非相為使也故任之而理自至矣言我稟受自然其理已具足行手捉耳聽目視功能御用各有司存亭之毒之非相為使無勞措意直置任之相為于偽反下未為同萬物萬情趣舍不同若有真宰使之然也起索真宰之眹迹而亦終不得則明物皆自然無使物然也夫肢體不同而御用各異似有真性竟無宰主眹迹攸肇從何而有而特崔云特辭也其眹李除忍反兆也趣舍七喻反字或作取下音捨或音赦下皆倣此起索所百反今夫行者信己可得行也信己而用可意而行天機自張率性而動自濟自足豈假物哉不見所以得行之形物皆信己而行不見信可行之貌者也情當其物故形不別見也有可行之情智無信己之形質情當丁浪反下皆同別見賢遍反付之自然而莫不皆存也百骸百骨節也九竅謂眼耳鼻舌口及下二漏也六藏六腑也謂大腸小腸膀胱三焦也藏謂五藏肝心脾肺腎也賅備也言體骨在外藏腑在內竅通內外備此三事以成一身故言存百骸戶皆反六藏才浪反案心肺肝脾腎謂之五藏大小腸膀胱三焦謂之六府身別有九藏氣天地人天以候頭角之氣人候耳目之氣地候口齒之氣三部各有天地人三三而九神藏五形藏四故九今此云六藏未見所出李楨曰釋文云此云六藏未見所出成疏遂穿鑿以六為六腑藏五藏致與上百官九竅訓不一例按難經三十九難五藏亦有六藏者謂腎有兩藏也其左為腎右為命門命門者謂精神之所舍也其氣與腎通故言藏有六也賅徐古來反司馬云備也小爾雅同簡文云兼也直自存耳皆説之則是有所私也有私則不能賅而存矣故不説而自存不為而自生也言夫六根九竅俱是一身豈有親疏私存愛悅若有心愛悅便是有私身而私之理在不可莫不任置自有司存於身既然在物亦爾皆説音悅注同今本多即作悅字後皆倣此若皆私之則志過其分上下相冒而莫為臣妾矣臣妾之才而不安臣妾之任則失矣故知君臣上下手足外內乃天理自然豈真人之所為哉臣妾者士女之賤職也且人之一身亦有君臣之別至如見色則目為君而耳為臣行步則足為君手為臣也斯乃出自天理豈人之所為乎非關係意親疏故為君臣也郭注云時之所賢者為君才不應世者為臣治國治身內外無異夫臣妾但各當其分耳未為不足以相治也相治者若手足耳目四肢百體各有所司而更相御用也夫臣妾御用各有職司手執腳行當分自足豈為手之不足而腳為行乎蓋天機自張無心相為而治理之也舉此手足諸事可知也而更音庚夫時之所賢者為君才不應世者為臣若天之自高地之自卑首自在上足自居下豈有遞哉雖無錯於當而必自當也夫首自在上足自居下目能視色耳能聽聲而用捨有時故有貴賤豈措情於上下而遞代為君臣乎但任置無心而必自當也其遞音弟徐又音第不應應對之應無錯七素反下同任之而自爾則非偽也直置忘懷無勞措意此即真君妙道存乎其中矣又解真君即前之真宰也言取捨之心青黃等色本無自性緣合而成不自不他非無非有故假設疑問以明無有真君也凡得真性用其自為者雖復皂隸猶不顧毀譽而自安其業故知與不知皆自若也若乃開希幸之路以下冒上物喪其真人忘其本則毀譽之間俯仰失錯也夫心境相感欲染斯興是以求得稱情即謂之為益如其不得即謂之為損斯言凡情迷執有得喪以攖心道智觀之無損益於其真性者也家世父曰彼我相形而有是非而是非之成於心者先入而為之主是之非之隨人以為役皆臣妾也而百骸九竅六藏悉攝而從之夫此攝而從之以聽役於人與其心之主宰果有辨乎果無辨乎心之主宰有是非於人何與求得人之情而是之非之無能為益不得無能為損而既搆一是非之形役心以從之終其身守而不化夫是之謂成心成心者臣妾之所以聽役也雖復扶又反下同毀譽音餘物喪息浪反言性各有分故知者守知以待終而愚者抱愚以至死豈有能中易其性者也夫稟受形性各有涯量不可改愚以為智安得易醜以為妍是故形性一成終不中途亡失適可守其分內待盡天年矣群品云云逆順相交各信其偏見而恣其所行莫能自反此衆人之所悲者亦可悲矣而衆人未嘗以此為悲者性然故也物各性然又何物足悲哉刃逆也靡順也群品云云鋭情逐境境既有逆有順心便執是執非行有終年速如馳驟唯知貪境曾無止息格量物理深可悲傷夫物情無極知足者鮮故得不止復逐於彼皆疲役終身未厭其志死而後已故其成功者無時可見也夫物浮競知足者稀故得此不休復逐於彼所以終身疲役沒命貪殘持影繫風功成何日者鮮息淺反凡物各以所好役其形骸至於疲困苶然不知所以好此之歸趣云何也苶然疲頓貌也而所好情篤勞役心靈形魂既弊苶然困苦直以信心好此貪競責其意謂亦不知所歸愚癡之甚深可哀歎苶然乃結反徐李乃協反崔音捻云忘貌簡文云疲病困之狀盧文弨曰苶今注本乃作薾説文引詩彼薾維何音義與此異慶藩案苶司馬作薾文選謝靈運過始寧墅詩注引司馬云薾極貌也釋文闕所好呼報反下同言其實與死同奚何也耽滯如斯困而不已有損行業無益神氣可謂雖生之日猶死之年也言其心形並馳困而不反比於凡人所哀則此真哀之大也然凡人未嘗以此為哀則凡所哀者不足哀也然猶如此也念念遷移新新流謝其化而為老心識隨而昏昧形神俱變故謂與之然世之悲哀莫此甚也凡此上事皆不知其所以然而然故曰芒也今未知者皆不知所以知而自知矣生者皆不知所以生而自生矣萬物雖異至於生不由知則未有不同者也故天下莫不芒也芒暗昧也言凡人在生芒昧如是舉世皆惑豈有一人不昧者而莊子體道真人智用明達俯同塵俗故云而我獨芒郭注稍乖今不依用芒乎莫剛反又音亡芒芒昧也簡文云芒同也夫心之足以制一身之用者謂之成心人自師其成心則人各自有師矣人各自有師故付之而自當夫域情滯著執一家之偏見者謂之成心夫隨順封執之心師之以為準的世皆如此故誰獨無師乎夫以成代不成非知也心自得耳故愚者亦師其成心未肯用其所謂短而舍其所謂長者也愚惑之類堅執是非何必知他理長代己之短唯欲斥他為短自取為長如此之人處處皆有愚癡之輩先豫其中與有音豫家世父曰説文代更也今日以為是明月以為非而一成乎心是非迭出而不窮故曰知代心以為是則取所謂是者而是之心以為非則取所謂非者而非之故曰心自取而舍音捨字亦作捨下同今日適越昨日何由至哉未成乎心是非何由生哉明夫是非者群品之所不能無故至人兩順之吳越路遙必須積旬方達今朝發途昨日何由至哉欲明是非彼我生自妄心言心必也未生是非從何而有故先分別而後是非先造途而後至越昔至崔云昔夕也向云昔者昨日之謂也家世父曰是非者人我相接而成者也而必其心先有一是非之準而後以為是而是之以為非而非之人之心萬應焉而無窮則是非亦與為無窮是非因人心而生物論之所以不齊也理無是非而惑者以為有此以無有為有也惑心已成雖聖人不能解故付之自若而不強知也夏禹字文命鯀子啓父也諡法泉源流通曰禹又云受禪成功曰禹理無是非而惑者為有此用無有為有也迷執日久惑心已成雖有大禹神人亦不能令其解悟莊生深懷慈救獨奈之何故付之自若不強知之者也不強其丈反趙諫議本若有作有若趙本自作目比字及此字依宋本及世德堂本改世德堂本作薾皆字依道藏焦竑本補夫言非吹也言者有言其所言者特未定也果有言邪其未嘗有言邪其以為異於鷇音亦有辨乎其無辨乎道惡乎隱而有真偽言惡乎隱而有是非道惡乎往而不存言惡乎存而不可道隱於小成言隱於榮華故有儒墨之是非以是其所非而非其所是欲是其所非而非其所是則莫若以明各有所説故異於吹夫名言之與風吹皆是聲法而言者必有詮辨故曰有言吹也如字又叱瑞反崔云吹猶籟也我以為是而彼以為非彼之所是我又非之故未定也未定也者由彼我之情偏雖有此言異於風吹而咸言我是僉曰彼非既彼我情偏故獨未定者也以為有言邪然未足以有所定以為無言邪則據己已有言果決定也此以為是彼以為非此以為非而彼以為是既而是非不定言何所詮故不足稱定有言也然彼此偏見各執是非據己所言故不可以為無言也夫言與鷇音其致一也有辨無辨誠未可定也天下之情不必同而所言不能異故是非紛紜莫知所定辨別也鳥子欲出卵中而鳴謂之鷇音也言亦帶殼曰鷇夫彼此偏執不定是非亦何異鷇鳥之音有聲無辨故將言説異於鷇音者恐未足以為別者也鷇苦豆反李音彀司馬云鳥子欲出者也惡乎謂於何也虛通至道非真非偽於何逃匿而真偽生焉惡乎音烏下皆同真偽一本作真詭崔本作真然道焉不在言何隱蔽而有真偽是非之名紛然而起至教至言非非非是於何隱蔽有是有非者哉道焉於虔反皆存存在也陶鑄生靈周行不殆道無不遍于何不在乎所以在偽在真而非真非偽也皆可玄道真言隨物生殺何往不可而言隱邪故可是可非而非非非是者也小成者謂仁義五德小道而有所成得者謂之小成也世薄時澆唯行仁義不能行於大道故言道隱於小成而道不可隱也故老君云大道廢有仁義夫小成榮華自隱於道而道不可隱則真偽是非者行於榮華而止於實當見於小成而滅於大全也榮華者謂浮辨之辭華美之言也只為滯於華辨所以蔽隱至言所以老君經云信言不美美言不信實當丁浪反後可以意求不復重出見於賢遍反昔有鄭人名緩學於氏之地三年藝成而化為儒儒者祖述堯舜憲章文武行仁義之道辨尊卑之位故謂之儒也緩弟名翟緩化其弟遂成於墨墨者禹道也尚賢崇禮儉以兼愛摩頂放踵以救蒼生此謂之墨也而緩翟二人親則兄弟各執一教更相是非緩恨其弟感激而死然彼我是非其來久矣爭競之甚起自二賢故指此二賢為亂群之帥是知道喪言隱方督是非儒墨更相是非而天下皆儒墨也故百家並起各私所見而未始出其方也天下莫不自以為是以彼為非彼亦與汝為非自以為是故各用己是是彼非各用己非非彼是更相音庚夫有是有非者儒墨之所是也無是無非者儒墨之所非也今欲是儒墨之所非而非儒墨之所是者乃欲明無是無非也欲明無是無非則莫若還以儒墨反覆相明反覆相明則所是者非是而所非者非非矣非非則無非非是則無是世皆以他為非用己為是今欲翻非作是翻是作非者無過還用彼我反覆相明反覆相明則所非者非非則無非所是者非是則無是無是則無非故知是非皆虛妄耳家世父曰郭象云有是有非者儒墨之所是也無是無非者儒墨之所非也今欲是儒墨之所非而非儒墨之所是莫若還以儒墨反覆相明則所是者非是而所非者非非矣今觀墨子之書及孟子之闢楊墨儒墨互相是非各據所見以求勝墨者是之儒者非焉是非所由成彼是之所由分也彼是有對待之形而是非兩立則所持之是非非是非也彼是之見存也莫若以明者還以彼是之所明互取以相證也郭注誤反覆芳服反下同裘字依漁父篇改物無非彼物無非是自彼則不見自知則知之故曰彼出於是是亦因彼彼是方生之説也雖然方生方死方死方生方可方不可方不可方可因是因非因非因是是以聖人不由而照之於天亦因是也是亦彼也彼亦是也彼亦一是非此亦一是非果且有彼是乎哉果且無彼是乎哉彼是莫得其偶謂之道樞樞始得其環中以應無窮是亦一無窮非亦一無窮也故曰莫若以明以指喻指之非指不若以非指喻指之非指也以馬喻馬之非馬不若以非馬喻馬之非馬也天地一指也萬物一馬也物皆自是故無非是物皆相彼故無非彼無非彼則天下無是矣無非是則天下無彼矣無彼無是所以玄同也注曰物皆自是故無非是物皆相彼故無非彼無非彼也則天下無是矣無非是也則天下無彼矣無彼無是所以玄同此注理盡無勞別釋自為彼所彼此則不自見自知己為是便則知之物之有偏也例皆如是若審能見他見自故無是無非也夫物之偏也皆不見彼之所見而獨自知其所知自知其所知則自以為是自以為是則以彼為非矣故曰彼出於是是亦因彼彼是相因而生者也夫彼對於此是待於非文家之大體也今言彼出於是者言約理微舉彼角勢也欲示舉彼明此舉是明非也而彼此是非相因而有推求分析即體皆空也夫死生之變猶春秋冬夏四時行耳故死生之狀雖異其於各安所遇一也今生者方自謂生為生而死者方自謂生為死則無生矣生者方自謂死為死而死者方自謂死為生則無死矣無生無死無可無不可故儒墨之辨吾所不能同也至於各冥其分吾所不能異也方方將也言彼此是非無異生死之説也夫生死交謝寒暑之遞遷而生者以生為生而死者將生為死亦如是者以是為是而非者以是為非故知因是而非因非而是因非而是則無是矣因是而非則無非矣是以無是無非非生無死無可無不可何彼此之論乎夫懷豁者因天下之是非而自無是非也故不由是非之塗而是非無患不當者直明其天然而無所奪故也天自然也聖人達悟不由是得非直置虛凝照以自然之智只因此是非而得無非無是終不奪有而別證無我亦為彼所彼彼亦自以為是我自以為是亦為彼之所非我以彼為非而彼亦以自為是也此亦自是而非彼彼亦自是而非此此與彼各有一是一非於體中也此既自是彼亦自是此既非彼彼亦非此故各有一是各有一非也今欲謂彼為彼而彼復自是欲謂是為是而是復為彼所彼故彼是有無未果定也夫彼此是非相待而立反覆推討舉體浮虛自以為是此則不無為彼所彼此則不有有無彼此未可決定彼復扶又反下同偶對也彼是相對而聖人兩順之故無心者與物冥而未嘗有對於天下也樞要也此居其樞要而會其玄極以應夫無方也偶對也樞要也體夫彼此俱空是非兩幻凝神獨見而無對於天下者可謂會其玄極得道樞要也前則假問有無待奪不定此則重明彼此當體自空前淺後深所以為次也道樞尺朱反樞要也以應應對之應前注同後可以意求不復重音夫是非反覆相尋無窮故謂之環環中空矣今以是非為環而得其中者無是無非也無是無非故能應夫是非是非無窮故應亦無窮夫絶待獨化道之本始為學之要故謂之樞環者假有二竅中者真空一道環中空矣以明無是無非是非無窮故應亦無窮也家世父曰是非兩化而道存焉故曰道樞握道之樞以遊乎環中中空也是非反復相尋無窮若循環然遊乎空中不為是非所役而後可以應無窮慶藩案唐釋湛然止觀輔行傳宏決引莊子古注云以圓環內空體無際故曰環中天下莫不自是而莫不相非故一是一非兩行無窮唯涉空得中者曠然無懷乘之以遊也夫物莫不自是故是亦一無窮莫不相非故非亦一無窮唯彼我兩忘是非雙遣而得環中之道者故能大順蒼生乘之遊也指手指也馬戲籌也喻比也言人是非各執彼我異情故用己指比他指即用他指為非指復將他指比汝指汝指於他指復為非指矣指義既爾馬亦如之所以諸法之中獨奉指者欲明近取諸身切要無過於指遠託諸物勝負莫先於馬故舉二事以況是非夫自是而非彼彼我之常情也故以我指喻彼指則彼指於我指獨為非指矣此以指喻指之非指也若復以彼指還喻我指則我指於彼指復為非指矣此非指喻指之非指也將明無是無非莫若反覆相喻反覆相喻則彼之與我既同於自是又均於相非均於相非則天下無是同於自是則天下無非何以明其然邪是若果是則天下不得有非之者也非若果非則天下亦不得復有是之者也今是非無主紛然淆亂明此區區者各信其偏見而同於一致耳仰觀俯察莫不皆然是以至人知天地一指也萬物一馬也故浩然大寧而天地萬物各當其分同於自得而無是無非也天下雖大一指可以蔽之萬物雖多一馬可以理盡何以知其然邪今以彼我是非反覆相喻則所是者非是所非者非非故知二儀萬物無是無非者也天地一指也萬物一馬也崔云指百體之一體馬萬物之一物浩然戶老反樞要也三字依焦竑本補以字復字依宋本改則天下三字依焦竑本補可乎可不可乎不可道行之而成物謂之而然惡乎然然於然惡乎不然不然於不然物固有所然物固有所可無物不然無物不可故為是舉莛與楹厲與西施恢譎怪道通為一其分也成也其成也毀也凡物無成與毀復通為一唯達者知通為一為是不用而寓諸庸庸也者用也用也者通也通也者得也適得而幾矣因是已已而不知其然謂之道勞神明為一而不知其同也謂之朝三何謂朝三狙公賦芧曰朝三而暮四衆狙皆怒曰然則朝四而暮三衆狙皆悅名實未虧而喜怒為用亦因是也是以聖人和之以是非而休乎天鈞是之謂兩行可於己者即謂之可不可於己者即謂之不可夫理無是非而物有違順故順其意者則謂之可乖其情者則謂之不可違順既空故知可不可皆妄也無不成也大道曠蕩亭毒含靈周行萬物無不成就故在可成於可而不當於可在不可成不可亦不當於不可也無不然也物情顛倒不達違從虛計是非妄為然不心境兩空物我雙幻於何而有然法遂執為然於何不然為不然也各然其所然各可其所可物情執滯觸境皆迷必固有然必固謂有可豈知可則不可然則不然邪群品云云各私所見皆然其所然可其所可無物不然無物不可崔本此下更有可於可而不可於不可不可於不可而可於可也夫莛橫而楹縱厲醜而西施好所謂齊者豈必齊形狀同規矩哉故舉縱橫好醜恢譎怪各然其所然各可其所可則理雖萬殊而性同得故曰道通為一也為是義故略舉八事以破之莛屋梁也楹舍柱也厲病醜人也西施吳王美姬也恢者寬大之名者奇變之稱譎者矯詐之心怪者妖異之物夫縱橫美惡物見所以萬殊恢譎奇異世情用之為顛倒故有是非可不可迷執其分今以玄道觀之本來無二是以妍醜之狀萬殊自得之情惟一故曰道通為一也故為于偽反下為是皆同莛徐音庭李音挺司馬云屋梁也楹音盈司馬云屋柱也俞樾曰司馬以莛為屋梁楹為屋柱故郭云莛橫而楹縱案説文莛莖也屋梁之説初非本義漢書東方朔傳以莛撞鍾文選答客難篇莛作筳李注引説苑曰建天下之鳴鐘撞之以筳豈能發其音聲哉筳與莛通是古書言莛者謂其小也莛楹以大小言厲西施以好醜言舊説非是厲如字惡也李音賴司馬云病癩西施司馬云夏姬也案句踐所獻吳王美女也恢徐苦回反大也郭苦虺反簡文本作弔盧文弨曰案弔音的下字與詭同弔詭見下文九委反徐九彼反李云戾也譎怪音決李云譎乖也怪異也家世父曰可不可然不然達者委而不用而即寓用於不用之中故通為一楹縱本亦作從同將容反夫物或此以為散而彼以為成夫物或於此為散於彼為成欲明聚散無恆不可定執此則於不二之理更舉論端者也其分如字我之所謂成而彼或謂之毀或於此為成於彼為毀物之涉用有此不同則散毛成伐木為舍等也夫成毀者生於自見而不見彼也故無成與毀猶無是與非也夫成毀是非生於偏滯者也既成毀不定是非無主故無成毀通而一之復通扶又反寓寄也庸用也唯當達道之夫凝神玄鑒故能去彼二偏通而為一為是義故成功不處用而忘用寄用群材也夫達者無滯於一方故忽然自忘而寄當於自用自用者莫不條暢而自得也夫有夫至功而推功於物馳馭億兆而寄用群材者其惟聖人乎是以應感無心靈通不滯可謂冥真體道得玄珠於赤水者也幾盡也至理盡於自得也幾盡也夫得者內不資於我外不資於物無思無為絶學絶待適爾而得蓋無所由與理相應故能盡妙也幾矣音機盡也下同徐具衣反達者因而不作夫達道之士無作無心故能因是非而無是非循彼我而無彼我我因循而已豈措情哉夫達者之因是豈知因為善而因之哉不知所以因而自因耳故謂之道也已而者仍前生後之辭也夫至人無心有感斯應譬彼明鏡方茲虛谷因循萬物影響蒼生不知所以然不知所以應豈有情於臧否而係於利害者乎以法因人可謂自然之道也謂之道向郭絶句崔讀謂之道勞云因自然是道之功也夫玄道妙一常湛凝然非由心智謀度而後不二而愚者勞役神明邂逅言辨而求一者與彼不一無以異矣不足也不知至理理自混同豈俟措心方稱不二耶此起譬也家世父曰謂之朝三明以朝三為義也蓋賦芧在朝故以得四而喜得三而怒皆所見惟目前之一隅也是以謂之因也疏謂混同萬物以為其一因以為一者無異衆狙之惑解因是也一語大謬夫達者之於一豈勞神哉若勞神明於為一不足賴也與彼不一者無以異矣亦同衆狙之惑因所好而自是也此解譬也狙獼猴也賦付與也芧橡子也似栗而小也列子曰宋有養狙老翁善解其意戲狙曰吾與汝芧朝三而暮四足乎衆狙皆起而怒又曰我與汝朝四而暮三足乎衆狙皆伏而喜焉朝三暮四朝四暮三其於七數並皆是一名既不虧實亦無損而一喜一怒為用愚迷此亦同其所好自以為是亦猶勞役心慮辨飾言詞混同萬物以為其一因以為一者亦何異衆狙之惑耶狙公七徐反又緇慮反司馬云狙公典狙官也崔云養猿狙者也李云老狙也廣雅云狙獼猴賦芧音序徐食汝反李音豫司馬云橡子也朝三暮四司馬云朝三升暮四升也所好呼報反下文皆同莫之偏任故付之自均而止也天均者自然均平之理也夫達道聖人虛懷不執故能和是於無是同非於無非所以息智乎均平之鄉休心乎自然之境也天鈞本又作均崔云鈞陶鈞也任天下之是非不離是非而得無是非故謂之兩行趙諫議本無各字賴字依下注文改古之人其知有所至矣惡乎至有以為未始有物者至矣盡矣不可以加矣其次以為有物矣而未始有封也其次以為有封焉而未始有是非也是非之彰也道之所以虧也道之所以虧愛之所之成果且有成與虧乎哉果且無成與虧乎哉有成與虧故昭氏之鼓琴也無成與虧故昭氏之不鼓琴也昭文之鼓琴也師曠之枝策也惠子之據梧也三子之知幾乎皆其盛者也故載之末年唯其好之也以異於彼其好之也欲以明之彼非所明而明之故以堅白之昧終而其子又以文之綸終終身無成若是而可謂成乎雖我亦成也若是而不可謂成乎物與我無成也是故滑疑之耀聖人之所圖也為是不用而寓諸庸此之謂以明至造極之名也淳古聖人運智虛妙雖復和光混俗而智則無知動不乖寂常真妙本所至之義列在下文也假設疑問於何而造極耶此忘天地遺萬物外不察乎宇宙內不覺其一身故能曠然無纍與物俱往而無所不應也未始猶未曾世所有法悉皆非有唯物與我內外咸空四句皆非蕩然虛靜理盡於此不復可加答於前問意以明至極者也雖未都忘猶能忘其彼此初學大賢鄰乎聖境雖復見空有之異而未曾封執雖未能忘彼此猶能忘彼此之是非也通欲難除滯物之情已有別惑易遣是非之見猶忘也無是非乃全也夫有非有是流俗之鄙情無是無非達人之通鑒故知彼我彰而至道隱是非息而妙理全矣道虧則情有所偏而愛有所成未能忘愛釋私玄同彼我也虛玄之道既以虧損愛染之情於是乎成著矣有之與無斯不能知乃至果決定也夫道無增減物有虧成是以物愛既成謂道為損而道實無虧也故假設論端以明其義有無既不決定虧成理非實録夫聲不可勝舉也故吹管操絃雖有繁手遺聲多矣而執籥鳴弦者欲以彰聲也彰聲而聲遺不彰聲而聲全故欲成而虧之者昭文之鼓琴也不成而無虧者昭文之不鼓琴也姓昭名文古之善鼓琴者也夫昭氏鼓琴雖云巧妙而鼓商則喪角揮宮則失徵未若置而不鼓則五音自全亦有成有虧存情所以乖道無成無虧忘智所以合真者也可勝音升操弦七刀反執籥羊灼反昭文司馬云古善琴者幾盡也夫三子者皆欲辨非己所明以明之故知盡慮窮形勞神倦或枝策假寐或據梧而瞑師曠字子野晉平公樂師甚知音律支柱也策打鼓也亦言擊節也梧琴也今謂不爾昭文已能鼓琴何容二人共同一伎況檢典籍無惠子善琴之文而言據梧者只是以梧几而據之談説猶隱几者也幾盡也昭文善能鼓琴師曠妙知音律惠施好談名理而三子之性稟自天然各以己能明示於世世既不悟己又疲怠遂使柱策假寐或復几而瞑三子之能咸盡於此枝策司馬云枝柱也策杖也崔云舉杖以擊節據梧音吾司馬云梧琴也崔云琴瑟也之知音智而瞑亡千反賴其盛故能久不爾早困也惠施之徒皆少年盛壯故能運載形智至於衰末之年是非少盛久當困苦也故載之末年崔云書之於今也言此三子唯獨好其所明自以殊於衆人三子各以己之所好耽而玩之方欲矜其所能獨異於物明示衆人欲使同乎我之所好所以疲倦形神好之不已者欲將己之道術明示衆人也是猶對牛鼓簧耳彼竟不明故己之道術終於昧然也彼衆人也所明道術也白即公孫龍守白馬論也姓公孫名龍趙人當六國時弟子孔穿之徒堅執此論橫行天下服衆人之口不服衆人之心言物稟性不同所好各異故知三子道異非衆人所明非明而強示之彼此終成暗昧亦何異乎堅執守白之論眩惑世間雖弘辨如流終有言而無理也堅白司馬云謂堅石白馬之辨也又云公孫龍有淬劍之法謂之堅白崔同又云或曰設矛伐之説為堅辨白馬之名為白盧文弨曰伐即盾也亦作又作瞂音皆同鼓簧音黃昭文之子又乃終文之緒亦卒不成綸緒也言昭文之子亦乃荷其父業終其綸緒卒其年命竟無所成況在它人如何放哉之綸音倫崔云琴瑟絃也俞樾曰釋文綸音倫崔云琴瑟絃也然以文之絃終其義未安郭注曰昭文之子又乃終文之緒則是訓綸為緒今以文義求之上文曰彼非所明而明之故以堅白之昧終之昧與之綸必相對為文周易繫辭傳故能彌綸天地之道京房注曰綸知也淮南子説山篇以小明大以近論遠高誘注曰論知也古字綸與論通淮南與明對言則綸亦明也以文之綸終謂以文之所知者終即是以文之明終蓋彼非所明而明之故以堅白之昧終而昭文之子又以文之明終則仍是非所明而明矣故下曰終身無成也郭注尚未達其恉此三子雖求明於彼彼竟不明所以終身無成若三子而可謂成則雖我之不成亦可謂成也我衆人也若三子異於衆人遂自以為成而衆人異於三子亦可謂之成也物皆自明而不明彼若彼不明即謂不成則萬物皆相與無成矣故聖人不顯此以耀彼不捨己而逐物從而任之各其所能故曲成而不遺也今三子欲以己之所好明示於彼不亦妄乎若三子之與衆物相與而不謂之成乎故知衆人之與三子彼此共無成矣夫聖人無我者也故滑疑之耀則圖而域之恢譎怪則通而一之使群異各安其所安衆人不失其所是則己不用於物而萬物之用用矣物皆自用則孰是孰非哉故雖放蕩之變屈奇之異曲而從之寄之自用則用雖萬殊歷然自明夫聖人者與天地合其德與日月齊其明故能晦迹同凡韜光接物終不眩耀群品亂惑蒼生亦不矜己以率人而各域限於分內忘懷大順於萬物為是寄用於群才而此運心斯可謂聖明真知也滑疑古沒反司馬云亂也屈奇求物反闕誤引江南古藏本作雖我無成亦可謂成矣趙諫議本我作此杖字依釋文改冥字依宋本及世德堂本改今且有言於此不知其與是類乎其與是不類乎類與不類相與為類則與彼無以異矣雖然請嘗言之有始也者有未始有始也者有未始有夫未始有始也者有有也者有無也者有未始有無也者有未始有夫未始有無也者俄而有無矣而未知有無之果孰有孰無也今我則已有謂矣而未知吾所謂之其果有謂乎其果無謂乎天下莫大於秋豪之末而大山為小莫壽於殤子而彭祖為夭天地與我並生而萬物與我為一既已為一矣且得有言乎既已謂之一矣且得無言乎一與言為二二與一為三自此以往巧曆不能得而況其凡乎故自無適有以至於三而況自有適有乎無適焉因是已今以言無是非則不知其與言有者類乎不類乎欲謂之類則我以無為是而彼以無為非斯不類矣然此雖是非不同亦固未免於有是非也則與彼類矣故曰類與不類又相與為類則與彼無以異也然則將大不類莫若無心既遣是非又遣其遣遣之又遣之以至於無遣然後無遣無不遣而是非自去矣類者輩徒相似之類也但群生愚迷滯是滯非今論乃欲反彼世情破茲迷執故假且説無是無非則用為真道是故復言相與為類此則遣於無是無非也既而遣之又遣方至重玄也至理無言言則與類故試寄言之嘗試也夫至理雖復無言而非言無以詮理故試寄言倣象其義有始則有終此假設疑問以明至道無始無終此遣於始終也謂無終始而一死生未始猶未曾也此又假問有未曾有始終不此遣於無始終也夫一之者未若不一而自齊斯又忘其一也此又假問有未曾有始也者斯則遣於無始無終也有有則美惡是非具也夫萬象森羅悉皆虛幻故標此有明即以有體空此句遣有也有無而未知無無也則是非好惡猶未離懷假問有此無不今明非但有即不有亦乃無即不無此句遣於無也好惡並如字未離力智反知無無矣而猶未能無知假問有未曾有無不此句遣非假問有未曾未曾有無不此句遣非非無也而自淺之深從入妙始乎有有終乎非無是知離百非超四句明矣前言始終此則明時今言有無此則辨法唯時與法皆虛靜者也此都忘其知也爾乃俄然始了無耳了無則天地萬物彼我是非豁然確斯也前從有無之迹入非非有無之本今從非非有無之體出有無之用而言俄者明即體即用俄爾之間蓋非遠也夫玄道窈冥真宗微妙故俄而用則非有無而有無用而體則有無非有無也是以有無不定體用無恆誰能決定無耶誰能決定有耶此又就有無之用明非有非無之體者也俄而徐音峨確斯苦角反斯又作澌音賜李思利反盧文弨曰斯訓盡與澌賜義同謂無是非即復有謂即復扶又反又不知謂之有無爾乃蕩然無纖芥於胸中也謂言也莊生復無言也理出有言之教即前請嘗言之類是也既寄此言以詮於理未知斯言定有言耶定無言耶欲明理家非默非言教亦非無非有恐學者滯於文字故致此辭纖介古邁反又音界盧文弨曰今本介作芥夫以形相對則大山大於秋豪也若各據其性分物冥其極則形大未為有餘形小不為不足苟各足於其性則秋豪不獨小其小而大山不獨大其大矣若以性足為大則天下之足未有過於秋豪也性足者大則雖大山亦可稱小矣故曰天下莫大於秋豪之末而大山為小大山為小則天下無大矣秋豪為大則天下無小也無小無大無壽無夭是以蟪蛄不羡大椿而欣然自得斥鴳不貴天池而榮願以足苟足於天然而安其性命故雖天地未足為壽而與我並生萬物未足為異而與我同得則天地之生又何不並萬物之得又何不一哉秋時獸生豪毛其末至微故謂秋豪之末也人生在於襁褓而亡謂之殤子太大也夫物之生也形氣不同有小有大有夭有壽若以性分言之無不自足是故以性足為大天下莫大於豪末無餘為小天下莫小於大山大山為小則天下無大豪末為大則天下無小小大既爾夭壽亦然是以兩儀雖大各足之性乃均萬物雖多自得之義唯一前明不終不始非有非無此明非小非大無夭無壽耳秋豪如字依字應作毫司馬云兔毫在秋而成王逸注楚辭云鋭毛也案毛至秋而耎細故以喻小也大山音泰殤子短命者也或云年十九以下為殤萬物萬形同於自得其得一也已自一矣理無所言夫名謂生於不明者也物或不能自明其一而以此逐彼故謂一以正之既謂之一即是有言矣夫玄道冥寂理絶形聲誘引迷途稱謂斯起故一雖玄統而猶是名教既謂之一豈曰無言乎夫以言言一而一非言也則一與言為二矣一既一矣言又二之有一有二得不謂之三乎夫以一言言一猶乃成三況尋其支流凡物殊稱雖有善數莫之能紀也故一之者與彼未殊而忘一者無言而自一夫妙一之理理非所言是知以言言一而一非言也且一既一矣言又言焉有一有言二名斯起覆將後時之二名對前時之妙一有一有二得不謂之三乎從三以往假有善巧算曆之人亦不能紀得其數而況凡夫之類乎殊稱尺證反善數色主反夫一無言也而有言則至三況尋其末數其可窮乎自從也適往也夫至理無言言則名起故從無言以往有言才言則至乎三況從有言往有言枝流分派其可窮乎此明一切萬法本無名字從無生有遂至於斯矣各止於其所能乃最是也夫諸法空幻何獨名言是知無即非無有即非有有無名數當體皆寂既不從無以適有豈復自有以適有耶故無所措意於往來因循物性而已矣趙諫議本遣作遺下並同趙本寄作嘗苟各足三字依趙本及世德堂本補若字非字依趙本及世德堂本改命字趙本作分世德堂本作命與字依世德堂本補趙本忘作亡夫道未始有封言未始有常為是而有畛也請言其畛有左有右有倫有義有分有辨有競有爭此之謂八德六合之外聖人存而不論六合之內聖人論而不議春秋經世先王之志聖人議而不辨故分也者有不分也辨也者有不辨也曰何也聖人懷之衆人辨之以相示也故曰辨也者有不見也夫大道不稱大辨不言大仁不仁大廉不嗛大勇不忮道昭而不道言辨而不及仁常而不成廉清而不信勇忮而不成五者而幾向方矣故知止其所不知至矣孰知不言之辨不道之道若有能知此之謂天府注焉而不滿酌焉而不竭而不知其所由來此之謂葆光冥然無不在也夫道無不在所在皆無蕩然無際有何封域也夫道未始有封崔云齊物七章此連上章而班固説在外篇彼此言之故是非無定道理虛通既無限域故言教隨物亦無常定也道無封故萬物得恣其分域畛界畔也理無崖域教隨物變是為是義故畛分不同為是于偽反有畛徐之忍反郭李音真謂封域畛陌也畛假設問旨發起後文也各異便也左陽也右陰也理雖凝寂教必隨機畛域不同升沈各異故有東西左右春秋生殺有左有右崔本作宥在宥也盧文弨曰舊作崔本作有訛案下云在宥也則當作宥明甚今改正異便婢面反物物有理事事有宜倫理也義宜也群物糾紛有理存焉萬事參差各隨宜便者也有倫有義崔本作有論有議俞樾曰釋文云崔本作有論有議當從之下文云六合之外聖人存而不論六合之內聖人論而不議又曰故分也者有不分也辨也者有不辨也彼所謂分辨即此有分有辨然則彼所謂論議即此有論有議矣群分而類別也辨別也飛走雖衆各有群分物性萬殊自隨類別矣有分如字注同類別彼列反下皆同並逐曰競對辨曰爭夫物性昏愚彼我封執既而並逐勝負對辨是非也有爭爭鬥之爭注同略而判之有此八德德者功用之名也群生功用轉變無窮略而陳之有此八種斯則釋前有畛之義也夫六合之外謂萬物性分之表耳夫物之性表雖有理存焉而非性分之內則未嘗以感聖人也故聖人未嘗論之若論之則是引萬物使學其所不能也故不論其外而八畛同於自得也六合者謂天地四方也六合之外謂衆生性分之表重玄至道之鄉也夫玄宗象出四句之端妙理希夷超六合之外既非神口所辨所以存而不論也陳其性而安之六合之內謂蒼生所稟之性分夫云云取捨皆起妄情尋責根源並同虛有聖人隨其機感陳而應之既曰馮虛亦無可詳議故下文云我亦妄説之順其成迹而凝乎至當之極不執其所是以非衆人也春秋者時代也經者典誥也先王者三皇五帝也志記也夫祖述軒頊憲章堯舜記録時代以為典謨軌轍蒼生流傳人世而聖人議論利益當時終不執是辨非滯於陳迹夫物物自分事事自別而欲由己以分別之者不見彼之自別也夫理無分別而物有是非故於無封無域之中而起有分有辨之見者此乃一曲之士偏滯之人亦何能剖析於精微分辨於事物者也故分如字下及注同假問質疑發生義旨以不辨為懷耳聖人無懷夫達理聖人冥心會道故能懷藏物我包括是非枯木死灰曾無分別矣不見彼之自辨故辨己所知以示之衆多之人即衆生之別稱也凡庸迷執未解虛故辨所知示見於物豈唯不見彼之自別亦乃不鑒己之妙道故云有不見也付之自稱無所稱謂大道虛廓妙絶形名既非色聲故不可稱謂體道之人消聲亦爾也不稱尺證反注同已自別也妙悟真宗無可稱説故辨雕萬物而言無所言無愛而自存也亭毒群品愛無心譬彼青春非為仁也夫至足者物之去來非我也故無所容其嗛盈夫玄悟之人鑒達空有知萬境虛幻無一可貪物我俱空何所遜讓不嗛郭欺簟反徐音謙無往而不順故能無險而不往忮逆也內蘊慈悲外弘接物故能俯順塵俗惠救蒼生虛己逗機終無忤逆不忮徐之豉反又音跂李之移反害也李云健也以此明彼彼此俱失矣明己功名炫耀於物此乃淫偽不是真道道昭音照不能及其自分不能玄默唯滯名言華詞浮辨不達深理物無常愛而常愛必不周不能忘愛釋知玄同彼我而恆懷恩惠每挾親情欲效成功無時可見皎然廉清貪名者耳非真廉也皎然異俗卓爾不群意在聲名非實廉也忮逆之勇天下共疾之無敢舉足之地也捨慈而勇忮逆物情衆共疾之必無成遂也此五者皆以有為傷當者也不能止乎本性而求外無已夫外不可求而求之譬猶以圓學方以魚慕鳥耳雖希翼鸞鳳擬規日月此愈近彼愈遠實學彌得而性彌失故齊物而偏尚之纍去矣圓也幾近也五者即已前道昭等也夫學道之人直須韜晦而乃矜炫己之能顯耀於物其於道也不亦遠乎猶如慕方而學圓愛飛而好遊泳雖希翼鸞鳳終無鶱翥之能擬規日月詎有幾方之效故也崔音刓徐五丸反司馬云圓也郭音團而幾徐其衣反向方本亦作嚮音同下皆放此近彼附近之近遠實于萬反所不知者皆性分之外也故止於所知之內而至也夫境有大小智有明暗智不逮者不須強知故知止其分學之造極也浩然都任之也孰誰也天自然也誰知言不言之言道不道之道以此積辨用茲通物者可謂合於自然之府藏也至人之心若鏡應而不藏故曠然無盈虛之變也注焉徐之喻反至理之來自然無迹夫巨海深弘莫測涯際百川注之而不滿尾閭泄之而不竭體道大聖其義亦然萬機頓起而不撓其神千難殊對而不忤其慮故能囊括群有府藏含靈又譬懸鏡高堂物來斯照能照之智不知其所由來可謂即照而忘忘而能照者也任其自明故其光不弊也葆蔽也至忘而照即照而忘故能韜蔽其光其光彌朗此結以前天府之義葆光音保崔云若有若無謂之葆光闕誤引江南古藏本成作周若論之三字依趙本及世德堂本補故昔者堯問於舜曰我欲伐宗膾胥敖南面而不釋然其故何也舜曰夫三子者猶存乎蓬艾之間若不釋然何哉昔者十日並出萬物皆照而況德之進乎日者乎於安任之道未弘故聽朝而不怡也將寄明齊一之理於大聖故發自怪之問以起對也釋然怡悅貌也宗膾胥敖是堯時小蕃三國號也南面君位也舜者顓頊六世孫也父曰瞽瞍母曰握登感大虹而生舜舜生於姚墟因即姓姚住於媯水亦曰媯氏目有重瞳子因字重華以仁孝著於鄉黨堯聞其賢妻以二女封邑於虞年三十總百揆三十三受堯禪即位之後都於蒲阪在位四十年讓禹後崩葬於蒼梧之野而三國貢賦既愆所以應須問罪謀事未定故聽朝不怡欲明齊物之一理故寄問答於二聖宗膾徐古外反胥息徐反華胥國敖徐五高反司馬云宗膾胥敖三國名也崔云宗一也膾二也胥敖三也聽朝直遙反夫物之所安無陋也則蓬艾乃三子之妙處也妙處昌慮反三子即三國之君也言蓬艾賤草斥鴳足以逍遙況蕃國雖卑三子足以存養乃不釋然有何意謂也夫重明登天六合俱照無有蓬艾而不光被也重明直龍反光被皮寄反夫日月雖無私於照猶有所不及德則無不得也而今欲奪蓬艾之願而伐使從己於至道豈弘哉故不釋然神解耳若乃物暢其性各安其所安無遠邇幽深付之自若皆得其極則彼無不當而我無不怡也進過也淮南子云昔堯時十日並出焦禾稼殺草木封狶長蛇皆為民害於是堯使羿上射十日遂落其九下殺長蛇以除民害夫十日登天六合俱照覆盆隱處猶有不明而聖德所臨無幽不燭運茲二智過彼三光乃欲興動干戈伐令從己於安任之道豈曰弘通者耶家世父曰伐國者是非之見之積而成者也而於此有不釋然左右倫義分辨競爭八德交戰於中而不知夫三子者蓬艾之間無為辨而分之萬物受日之照而不能遁其形而於此纍十日焉皆求得萬物而照之則萬物之神必敝日之照無心者也德之求辨乎是非方且以有心出之又進乎日之照矣人何所措手足乎慶藩案文選謝靈運出遊京口北固應詔詩注引司馬云言陽麗天則無不鑒釋文闕神解音蟹光字依文選注原文改齧缺問乎王倪曰子知物之所同是乎齧缺許由之師王倪弟子並堯時賢人也託此二人明其齊一言物情顛倒執見不同悉皆自是非他頗知此情是否齧五結反缺丘悅反王倪徐五嵇反李音詣高士傳云王倪堯時賢人也天地篇云齧缺之師曰吾惡乎知之所同未必是所異不獨非故彼我莫能相正故無所用其知王倪答齧缺云彼此各有是非遂成無主我若用知知彼我知還是是非故我於何知之言無所用其知也惡乎音烏下皆同子知子之所不知邪子既不知物之同是頗自知己之不知乎此從入妙次第窮質假託師資以顯深趣曰吾惡乎知之若自知其所不知即為有知有知則不能任群才之自當若以知知不知不知還是知故重言於何知之還以不知答也然則物無知邪重責云汝既自無知物豈無知者邪曰吾惡乎知之都不知乃曠然無不任矣豈獨不知我亦乃不知物唯物與我內外都忘故無所措其知也雖然嘗試言之庸詎知吾所謂知之非不知邪庸詎知吾所謂不知之非知邪以其不知故未敢正言試言之耳然乎猶雖然也既其無知理無所説不可的當故嘗試之也魚遊於水水物所同咸謂之知然自鳥觀之則向所謂知者復為不知矣夫蛣蜣之知在於轉丸而笑蛣蜣者乃以蘇合為貴故所同之知未可正據夫物或此知而彼不知彼知而此不知魚鳥水陸即其義也故知即不知不知即知凡庸之人詎知此理耶庸詎徐本作巨其庶反郭音巨李云庸用也詎何也猶言何用也服虔云詎猶未也復為扶又反蛣丘一反蜣丘良反爾雅云蛣蜣蜣蜋也所謂不知者直是不同耳亦自一家之知所謂不知者彼此不相通耳非謂不知也慶藩案文選潘安仁秋興賦注引司馬云庸猶何用也釋文闕又案庸詎猶言何遽也詎遽距巨巨通用或作渠史記甘茂傳何遽叱乎淮南人間篇此何遽不能為福乎韓子難篇衛奚距然哉荀子正論篇是定巨知見侮之為不辱哉王制篇豈渠得免夫纍乎皆其證且吾嘗試問乎女民溼寢則腰疾偏死然乎哉木處則惴栗恂懼猿猴然乎哉三者孰知正處民食芻豢麋鹿食薦蝍蛆甘帶鴟鴉耆鼠四者孰知正味猿猵狙以為雌麋與鹿交與魚遊毛嬙麗姬人之所美也魚見之深入鳥見之高飛麋鹿見之決驟四者孰知天下之正色哉自我觀之仁義之端是非之塗樊然殽亂吾惡能知其辨己不知其正故試問女理既無言不敢正據聊復反質試問乎女乎女音汝注及下同己不知音紀此略舉三者以明萬物之異便惴栗恂懼是恐迫之別名然乎哉謂不如此也言人溼地臥寢則病腰跨偏枯而死泥豈如此乎人於樹上居處則迫怖不安猿猴跳躑曾無所畏物性不同便宜各異故舉此三者以明萬物誰知正定處所乎是知蓬戶金閨榮辱安在偏死司馬云偏枯死也徐音秋司馬云魚名惴之瑞反栗音栗恂郭音荀徐音峻恐貌崔云戰也班固作眴也猿音猿猴音侯異便婢面反此略舉四者以明美惡之無主芻草也是牛羊之類豢養也是犬豕之徒皆以所食為名也麋與鹿而食長薦茂草鴟鳶鳥便嗜腐鼠蜈蚣食蛇略舉四者定與誰為滋味乎故知盛饌疏食其致一者也芻初俱反小爾雅云謂之芻音古但反豢徐音患又胡滿反司馬云牛羊曰芻犬豕曰豢以所食得名也麋音眉薦箋練反司馬云美草也崔云甘草也郭璞云三蒼云六畜所食曰薦慶藩案説文薦獸之所食草從豸從草古者神人以豸遺黃帝帝曰何食曰食薦漢書趙充國傳今虜亡其美地薦草三蒼郭注云六畜所食曰薦管子八觀篇薦草多衍則六畜易繁也蝍音即且字或作蛆子徐反李云蝍且蟲名也廣雅云蜈公也爾雅云蒺藜蝍蛆郭璞注云似蝗大腹長角能食蛇腦蒺音疾藜音梨帶如字崔云蛇也司馬云小蛇也蝍蛆好食其眼鴟尺夷反鴉本亦作於加反崔云烏也耆市志反字或作嗜崔本作甘美惡烏路反此略舉四者以明天下所好之不同也不同者而非之則無以知所同之必是猿猴狙以為雌雄麋鹿更相接泥與魚遊戲毛嬙越王嬖妾麗姬晉國之寵嬪此二人者姝妍冠世人謂之美也然魚見怖而深入鳥見驚而高飛麋鹿走而不顧舉此四者誰知宇內定是美色耶故知凡夫愚迷妄生憎愛以理觀察孰是非哉決卒疾貌也猵篇面反徐敷面反又敷畏反郭李音偏狙七餘反司馬云狙一名獦牂似猿而狗頭熹與雌猿交也崔云猵狙一名獦牂其雄與猿雌為牝牡向云猵狙以猿為雌也獦音葛為雌音妻一音如字慶藩案御覽九百十引司馬云猵狙似猿而狗頭食獼猴好與雄狙接與釋文所引異毛嬙徐在良反司馬云毛嬙古美人一云越王美姬也麗姬力知反下同麗姬晉獻公之嬖以為夫人崔本作西施決喜缺反李云疾貌崔云疾足不顧為決徐古惠反郭音古穴反驟士救反又在遘反慶藩案決驟即決躁也説文廣雅並云躁疾也易傳為決躁躁與躁同正義作決驟云取其剛也其正字當作趹趣説文趹馬行貌又云趹踶也淮南修務篇敕蹻趹高注云趹趣亦與駃同廣雅云駃奔也史記張儀傳探前趹後蹄間三尋索隱曰言馬之走勢疾也與崔氏訓疾走不顧義同所好呼報反夫利於彼者或害於此而天下之彼我無窮則是非之竟無常故唯莫之辨而任其自是然後蕩然俱得夫物乃衆而未嘗非我故行仁履義損益不同或於我為利於彼為害或於彼為是則於我為非是以從彼我而互觀之是非之路仁義之緒樊亂糾紛若殽饌之雜亂既無定法吾何能知其分別耶樊然音煩殽亂徐戶交反郭作散悉旦反慶藩案殽郭本作散非也説文殽雜錯也散雜肉也雜乃離之誤辨見説文考正義不相通隸書殽或作見漢殽坑君神祠碑與散相似散或作見李翕析橋郙閣頌與殽亦相似殽散以形相似而誤太玄元瑩晝夜殽者其禍福雜今本殽誤散淮南原道篇不與物殽粹之至也精神篇不與物殽而天下自服今本皆誤作散高注曰散雜貌案諸書散字無雜亂之訓故散皆當作殽之竟音境今本多作境下放此趙諫議本無故字趙本無略舉二字及以字之字動字依正義原文改後字依史記原文補齧缺曰子不知利害則至人固不知利害乎未能妙其不知故猶嫌至人當知之斯懸之未解也齧缺曰未悟彼此之不知更起利害之疑請云子是至人應知利害必其不辨迷暗若夜遊重為此難冀圖後答之矣未解音蟹王倪曰至人神矣大澤焚而不能熱河漢沍而不能寒疾雷破山飄風振海而不能驚若然者乘雲氣騎日月而遊乎四海之外死生無變於己而況利害之端乎無心而無不順至者妙極之體神者不測之用夫聖人虛己應物無方知而不知辨而不辨豈得以名言心慮億度至人耶夫神全形具而體與物冥者雖涉至變而未始非我故蕩然無介於胸中也沍凍也原澤焚燎河漢冰凝雷霆奮發而破山飄風濤蕩而振海而至人神凝未兆體與物冥水火既不為災風雷詎能驚駭沍戶故反徐又戶各反李戶格反向云凍也崔云沍猶涸也家世父曰大浸稽天而不溺大旱金石流土山焦而不熱能不以物為而天地造化自存於吾心則外境不足以相纍莊子之自期許如此故屢及之蠆敕邁反又音豸介古邁反又音界寄物而行非我動也若然猶如此也虛淡無心方之雲氣蔭芘群品順物而行有晝夜而無死生也昏明代序有晝夜之可分處順安時無死生之能異而控馭群物運載含靈故有乘騎之名也耳夫唯無其知而任天下之自為故馳萬物而不窮也動寂相即應一時端坐寰宇之中而心遊四海之外矣與變為體故死生若一況利害於死生愈不足以介意夫利害者生涯之損益耳既死生為晝夜乘變化以遨遊況利害於死生曾何足以介意矣飄字依趙諫議本補蠆字依世德堂本改瞿鵲子問乎長梧子曰吾聞諸夫子聖人不從事於務不就利不違害不喜求不緣道無謂有謂有謂無謂而遊乎塵垢之外夫子以為孟浪之言而我以為妙道之行也吾子以為奚若務自來而理自應耳非從而事之也務猶事也諸於也瞿鵲是長梧弟子故謂師為夫子夫體道聖人忘懷冥物雖涉事有而不以為務混迹塵俗泊爾無心豈措意存情從於事物瞿鵲既欲請益是以述昔之所聞者也瞿鵲其俱反長梧子李云居長梧下因以為名崔云名丘簡文云長梧封人也夫子向云瞿鵲之師俞樾曰瞿鵲子必七十子之後人所稱聞之夫子謂聞之孔子也下文長梧子曰是黃帝之所聽熒也而丘也何足以知之丘即是孔子名因瞿鵲子述孔子之言故曰丘也何足以知之也而讀者不達其意誤以丘也為長梧子自稱其名故釋文云長梧子崔云名丘此大不然下文云丘也與女皆夢也豫謂女夢亦夢也夫豫者長梧子自謂也既云丘與女皆夢又云豫亦夢則安得即以丘為長梧子之名乎任而直前無所避就違避也體窮通之關命達利害之有時故推理直前而無所避就也求之不喜直取不怒妙悟從也故物求之而不欣喜矣獨至者也夫聖智凝湛照物無情不將不迎無生無滅固不以攀緣之心行乎虛通至道者也凡有稱謂者皆非吾所謂也彼各自謂耳故無彼有謂而有此無謂也謂言教也夫體道至人虛夷寂絶從本降迹感而遂通故能理而教無謂而有謂教而理有謂而無謂者也稱謂尺證反下放此凡非真性皆塵垢也和光同塵處染不染故雖在囂俗之中而心自遊於塵垢之外者矣而遊崔本作而施孟浪猶率略也奚何也若如也如何所謂不緣道等乃窮理盡性瞿鵲將為妙道之行長梧用作率略之談未知其理如何以何為是孟如字徐武黨反又或武葬反浪如字徐力蕩反向云孟浪音漫瀾無所趨舍之謂李云猶較略也崔云不精要之貌慶藩案文選左太沖吳都賦注引司馬云孟浪鄙野之語釋文闕又案孟浪猶莫絡不委細之意見劉逵注文選左思吳都賦莫絡一作摹略墨子小取篇摹略萬物之然摹略者總括之詞莫絡摹略孟浪皆一聲之轉也之行如字又下孟反長梧子曰是帝之所聽熒也而丘也何足以知之且女亦大早計見卵而求時夜見彈而求梟炙聽熒疑惑不明之貌也夫至道深玄非名言而可究雖復三皇五帝乃是聖人而詮辨至理不盡其妙聽熒至竟疑惑不明我是何人猶能曉了本亦有作黃字者則是軒轅皇帝本又作黃帝盧文弨曰皇黃通用今本作黃帝聽敕定反熒音瑩磨之瑩本亦作瑩於迥反向司馬云聽熒疑惑也李云不光明貌崔云小明不大了也向崔本作榮盧文弨曰字彙補云字見釋典中隨函云與輝同夫物有自然理有至極循而直往則冥然自合非所言也故言之者孟浪而聞之者聽熒雖復黃帝猶不能使萬物無懷而聽熒至竟故聖人付當於塵垢之外而玄合乎視聽之表照之以天而不逆計放之自爾而不推明也今瞿鵲子方聞孟浪之言而便以為妙道之行斯亦無異見卵而責司晨之功見彈而求梟炙之實也夫不能安時處順而探變求化當生而慮死執是以辨非皆逆計之徒也梟即鵬鳥賈誼之所賦者也大小如雌雞而似斑鳩青緑色其肉甚美堪作羹炙出江南然卵有生雞之用而卵時未能司晨彈有得梟之功而彈時未堪為炙亦猶教能詮於妙理而教時非理今瞿鵲才聞言説將為妙道此計用之太早且女音汝下同亦大音泰徐李敕佐反注同時夜崔云時夜司夜謂雞也見彈徒旦反梟于驕反司馬云小鳩可炙毛詩草木疏云大如斑鳩緑色其肉甚美雖復扶又反下皆同下章注亦準此黃字依世德堂本改趙諫議本無夫字豫嘗為女妄言之女以妄聽之奚旁日月挾宇宙為其吻合置其滑涽以隸相尊衆人役役聖人愚芚參萬歲而一成純萬物盡然而以是相蘊言之則孟浪也故試妄言之嘗為于偽反若正聽妄言復為太早計也故亦妄聽之何豫我也奚何也夫至理無言言則孟浪我試為汝妄説汝亦妄聽何如亦言奚者即何之聲也以死生為晝夜旁日月之喻也以萬物為一體挾宇宙之譬也旁依附也挾懷藏也天地四方曰宇往來古今曰宙契理聖人忘物忘我既而囊括萬有冥一死生故郭注云以死生為晝夜旁日月之喻也以萬物為一體挾宇宙之喻也旁日月薄葬反徐扶葬反司馬云依也崔本作謗盧文弨曰官校本改謗為傍未必是家世父曰郭象以女以妄聽之奚斷句熟玩文義奚旁日月挾宇宙自為句言操何術以超出天地之表慶藩案旁當為放之借字放依也論語里仁篇放於利而行鄭孔注並曰放依也墨子法儀篇放依以從事放亦依也亦通作方詩維鳩方之言鵲有巢而鳩依之也見王氏經義述聞又通作傍旁日月謂依日月也應從司馬訓依之義為正崔本作謗者非也挾戶牒反崔本作扶宇宙治救反尸子云天地四方曰宇往古來今曰宙説文云舟輿所極覆曰宙以有所賤故尊卑生焉而滑涽紛亂莫之能正各自是於一方矣故為然自合之道莫若置之勿言委之自爾也涽然無波際之謂也無分別之貌也置任也滑亂也涽暗也隸皂僕之類也蓋賤稱也夫物情顛倒妄執尊卑今聖人欲祛此惑然合同之道者莫若滑亂昏雜隨而任之以隸相尊一於貴賤也本或作郭音泯徐武軫反李武粉反無波際之貌司馬云合也向音脣云若兩脣之相合也盧文弨曰今注本波作被似誤滑徐古沒反亂也向本作汨音同崔戶八反云栝口也涽徐音昏向云汨昏未定之謂崔本作武巾反云繩也盧文弨曰舊作涽宋本從氏並注中昏涽並從氏今從之馳鶩於是非之境也芚然無知而直往之貌役役馳動之容也愚芚無知之貌凡俗之人馳逐前境勞役而不息體道之士忘知廢照芚然而若愚也芚徐徒奔反郭治本反司馬云渾沌不分察也崔云文厚貌也或云束也李丑倫反純者不雜者也夫舉萬歲而參其變而衆人謂之雜矣故役役然勞形怵心而去彼就此唯大聖無執故芚然直往而與變化為一一變化而常遊於獨者也故雖參糅億載千殊萬異道行之而成則古今一成也物謂之而然則萬物一然也無物不然無時不成斯可謂純也夫聖人者與二儀合其德萬物同其體故能隨變任化與世相宜雖復代歷古今時經夷險參雜塵俗千殊萬異而淡然自若不以介懷抱一精純而常居妙極也家世父曰衆人役役較量今日又較量明日今日見為是明日又見為非今日見為非非明日又見為非是聖人愚芚為是不用而寓諸庸參萬歲以極其量一者渾然無彼此之別成者怡然無然可之差純者泊然無是非之辨聖人以此應萬物之變而相蘊於無窮斯為參萬歲而一成純怵心敕律反參糅如救反無物不然蘊積也積是於萬歲則萬歲一是也積然於萬物則萬物盡然也故不知死生先後之所在彼我勝負之所如也蘊積也夫物情封執為日已久是以橫論萬物莫不我然彼不然説古今悉皆自是他不是雖復萬物之多古今之遠是非蘊積未有休時聖人順世汙隆動而常寂參糅億載而純一凝然也相蘊本亦作縕徐於憤反郭於本反李於問反積也朱桂曜本奚下有若字趙諫議本作下同闕誤引劉同一本芚作芼云芚治本切無知直往之貌為字依覆宋本改世德堂本作被本書依釋文原本改木字依世德堂本改云字依世德堂本補豫惡乎知説生之非惑邪豫惡乎知惡死之非弱喪而不知歸者邪麗之姬艾封人之子也晉國之始得之也涕泣沾襟及其至於王所與王同筐床食芻豢而後悔其泣也豫惡乎知夫死者不悔其始之蘄生乎死生一也而獨説生欲與變化相背故未知其非惑也夫爐錘萬物未始不均變化死生其理唯一而獨悅生惡死非惑如何豫惡音烏下惡乎皆同説音悅注同相背音佩少而失其故居名為弱喪夫弱喪者遂安於所在而不知歸於故鄉也焉知生之非夫弱喪焉知死之非夫還歸而惡之哉弱者弱齡喪之言失謂少年遭亂喪失桑梓遂安他土而不知歸謂之弱失從無出有謂之為生自有還無謂之為死遂其戀生惡死豈非弱喪不知歸邪惡死烏路反注同弱喪悉浪反注同少而詩照反焉知於虔反下同一生之內情變若此當此之日則不知彼況夫死生之變惡能相知哉昔秦穆公與晉獻公共伐麗戎之國得美女一玉環二秦取環而晉取女即麗戎國艾地守封疆人之女也筐正也初去麗戎離別親戚懷土之戀故涕泣沾襟後至晉邦寵愛隆重與獻公同方床而燕處進牢饌以盈廚情好既移所以悔其先泣一生之內情變若此況死生之異何能知哉莊子寓言故稱獻公為王耳至於王所崔云六國時諸侯僭稱王因此謂獻公為王也筐本亦作匡徐起狂反床徐音床司馬云筐床安床也崔云筐方也一云正床也蘄求也蘄求也麗姬至晉悔其先泣焉知死者之不卻悔初始在生之日求生之意也蘄音祈求也趙諫議本不知下有所謂二字趙本無之字夢飲酒者旦而哭泣夢哭泣者旦而田獵方其夢也不知其夢也夢之中又占其夢焉覺而後知其夢也且有大覺而後知此其大夢也而愚者自以為覺竊竊然知之君乎牧乎固哉丘也與女皆夢也豫謂女夢亦夢也是其言也其名為弔詭萬世之後而一遇大聖知其解者是旦暮遇之也此寤寐之事變也事苟變情亦異則死生之願不得同矣故生時樂生則死時樂死矣死生雖異其於各得所願一也則何係哉夫死生之變猶覺夢之異耳夫覺夢之事既殊故死生之情亦別而世有覺凶而夢吉亦何妨死樂而生憂邪是知寤寐之間未足可係也樂生音洛下同由此觀之當死之時亦不知其死而自適其志也方將為夢之時不知夢之是夢亦猶方將處死之日不知死之為死各適其志何所戀哉夫夢者乃復夢中占其夢則無以異於寤者也當所遇無不足也何為方生而憂死哉夫人在睡夢之中謂是真實亦復占候夢想思度吉凶既覺以後方知是夢是故生時樂生死時樂死何為當生而憂死哉覺而音教下及注皆同夫大覺者聖人也大覺者乃知夫患慮在懷者皆未寤也夫擾擾生民藝藝群品馳騖有為之境昏迷大夢之中唯有體道聖人朗然獨覺知夫患慮在懷者皆未寤也夫愚者大夢而自以為寤故竊竊然以所好為君上而所惡為牧圉欣然信一家之偏見可謂固陋矣夫物情愚惑暗若夜遊昏在夢中自以為覺竊竊然議專所知情之好者為君上情之惡者同牧圉以此為情懷可謂固陋牛曰牧馬曰圉也竊竊司馬云猶察察也牧乎崔本作跂乎云踶跂強羊貌所好呼報反注同所惡烏路反未能忘言而神解故非大覺也丘是長梧名也夫照達真原猶稱為夢況愚徒竊竊豈有覺哉神解音蟹徐戶解反即復夢中之占夢也夫自以為夢猶未寤也況竊竊然自以為覺哉夫迷情無覺論夢還在夢中聲説非真妙辨猶居言內是故夢中占夢夢所以皆空言內試言言所以虛假此託夢中之占夢亦結孟浪之談耳夫非常之談故非常人之所知故謂之弔當卓詭而不識其懸解夫舉世皆夢此乃玄談非常之言不顧於俗弔當卓詭駭異物情自非清通豈識深遠哉弔如字又音的至也盧文弨曰舊脫又字今補詭九委反異也言能蛻然無係而玄同死生者至希也且世歷萬年而一逢大聖知三界悉空四生非有彼我言説皆在夢中如此解人其為希遇論其賒促是旦暮逢之三十年為一世也其解音蟹徐戶解反蛻然音帨又始鋭反既使我與若辨矣若勝我我不若勝若果是也我果非也邪我勝若若不吾勝我果是也而果非也邪其或是也其或非也邪其俱是也其俱非也邪我與若不能相知也則人固受其黮暗吾誰使正之使同乎若者正之既與若同矣惡能正之使同乎我者正之既同乎我矣惡能正之使異乎我與若者正之既異乎我與若矣惡能正之使同乎我與若者正之既同乎我與若矣惡能正之然則我與若與人俱不能相知也而待彼也邪若而皆汝也若不勝汝也耶假問之詞也夫是非彼我舉體不真倒置之徒妄為臧否假使我與汝對爭汝勝我不勝汝勝定是我不勝定非耶固不可也若而皆汝也假令我勝於汝汝不及我我決是也汝定非也各據偏執未足可依也或不定也我之與汝或是或非彼此言之勝負不定故或是則非是或非則非非也俱是則無非俱非則無是故是非彼我出自妄情也不知而後推不見而後辨辨之而不足以自信以其與物對也辨對終日黮暗至竟莫能正之故當付之自正耳彼我二人各執偏見咸謂自是故不能相知必也相知己之所非者他家之是也假令別有一人遣定臧否此人還有彼此亦不離是非各據妄情總成暗惑心必懷愛此見所以黮暗不明三人各執使誰正之黮暗不明之謂也黮暗貪暗反李云黮暗不明貌既將汝同見則與汝不殊與汝不殊何能正定此覆釋第一句惡能音烏下皆同同故是之未足信也注云同故是之耳未足信也此覆釋第二句也異故相非耳亦不足據既異我汝故別起是非別起是非亦何足可據此覆解第三句是若果是則天下不得復有非之者也非若信非則亦無緣復有是之者也今是其所同而非其所異異同既具而是非無主故夫是非者生於好辨而休乎天均付之兩行而息乎自正也彼此曲從是非兩順不異我汝亦何能正之此解第四句各自正耳待彼不足以正此則天下莫能相正也故付之自正而至矣我與汝及人固受黮暗之人總有三人各執一見咸言我是故俱不相知三人既不能定豈復更須一人若別待一人亦與前何異待彼也耶言其不待之也何謂和之以天倪曰是不是然不然是若果是也則是之異乎不是也亦無辨然若果然也則然之異乎不然也亦無辨化聲之相待若其不相待和之以天倪因之以曼衍所以窮年也忘年忘義振於無竟故寓諸無竟天倪者自然之分也天自然也倪分也夫彼我妄執是非無主所以三人四句不能正之故假設論端託為問答和以自然之分令歸無是無非天倪之義次列於下文和之如字崔胡臥反天倪李音崖徐音詣郭音五底反李云分也崔云或作霓音同際也班固曰天研盧文弨曰舊本崖訛崔今據大宗師篇改正倪音近研故計倪亦作計研是非然否彼我更對故無辨無辨故和之以天倪安其自然之分而已不待彼以正之辨別也夫是非然否出自妄情以理推求舉體虛幻所是則不是然則不然何以知其然耶是若定是是則異非然若定然然則異否而今此謂之是彼謂之非彼之所然此以為否故知是非然否理在不殊彼我更對妄為分別故無辨也矣是非之辨為化聲夫化聲之相待俱不足以相正故若不相待也夫是非彼我相待而成以理推尋待亦非實故變化聲説有此待名名既不真待便虛待待即非待故知不相待者也家世父曰言隨物而變謂之化聲是與不是然與不然在人者也待人之為是為然而是之然之與其無待於人而自是自然一皆無與於其心是謂和之以天倪和之以自然之分任其無極之化尋斯以往則是非之境自泯而性命之致自窮也曼衍猶變化也因任也窮盡也和以自然之分所以無是無非任其無極之化故能不滯不著既而處順安時盡天年之性命也曼徐音萬郭武半反衍徐以戰反司馬云曼衍無極也夫忘年故玄同死生忘義故彌貫是非是非死生蕩而為一斯至理也至理暢於無極故寄之者不得有窮也振暢也竟窮也寓寄也夫年者生之所稟也既同於生死所以忘年也義者裁於是非也既一於是非所以忘義也此則遣前知是非無窮之義也既而生死是非蕩而為一故能通暢妙理洞照無窮寄言無窮亦無無窮之可暢斯又遣於無極者也振如字崔云止也又之忍反無竟如字極也崔作境闕誤引江南古藏本是也下亦無辨作其無辨矣然也下亦無辨作亦無辨矣罔兩問景曰曩子行今子止曩子坐今子起何其無特操與罔兩景外之微陰也罔兩景外之微陰也曩昔也特向也特獨也莊子寓言以暢玄理故寄景與罔兩明於獨化之義而罔兩問景云汝向行今止昔坐今起然則子行止坐起制在於形唯欲隨逐於他都無獨立志操者何耶罔兩郭云景外之微陰也向云景之景也崔本作罔浪云有無之狀慶藩案罔兩司馬作罔浪文選班孟堅幽通賦注引司馬云罔浪景外重陰也釋文引崔本作罔浪云有無之狀與司馬訓異義景永反又如字本或作影俗也曩徐乃蕩反李云嚮者也無特本或作持崔云特辭也向云無特者行止無常也操與音餘景曰吾有待而然者邪吾所待又有待而然者邪吾待蛇蚹蜩翼邪惡識所以然惡識所以不然言天機自爾坐起無待無待而獨得者孰知其故而責其所以哉夫物之形質咸稟自然事似有因理在無待而形影非遠尚有天機故曰萬類參差無非獨化者也若責其所待而尋其所由則尋責無極至於無待而獨化之理明矣影之所待即是形也若使影待於形形待造物請問造物復何待乎斯則待待無窮卒乎無待也若待蛇蚹蜩翼則無特操之所由未為難識也今所以不識正由不待斯類而獨化故耳昔諸講人及郭生注意皆云蛇蚹是腹下齟齬蜩翼者是蜩翅也言蛇待蚹而行蜩待翼而飛影待形而有也蓋不然乎若使待翼而飛待足而走飛禽走獸其類無窮何勞獨舉蛇蚹頗引為譬即今解蚹者蛇蛻皮也蜩翼者蜩甲也言蛇蛻舊皮蜩新出甲不知所以莫辨其然獨化而生蓋無待也而蛇蜩二蟲猶蛻皮甲稱異諸物所以引之故外篇云吾待蛇蚹蜩甲耶是知形影之義與蚹甲無異者也蛇蚹音附徐又音敷司馬云謂蛇腹下齟齬可以行者也齟音士女反齬音魚女反蜩徐音條世或謂罔兩待景景待形形待造物者請問夫造物者有耶無耶無也則胡能造物哉有也則不足以物衆形故明衆形之自物而後始可與言造物耳是以涉有物之域雖復罔兩未有不獨化於玄冥者也故造物者無主而物各自造物各自造而無所待焉此天地之正也故彼我相因形景俱生雖復玄合而非待也明斯理也將使萬物各反所宗於體中而不待乎外外無所謝而內無所矜是以誘然皆生而不知所以生同焉皆得而不知所以得也今罔兩之因景猶云俱生而非待也則萬物雖聚而共成乎天而皆歷然莫不獨見矣故罔兩非景之所制而景非形之所使形非無之所化也則化與不化然與不然從人之與由己莫不自爾吾安識其所以哉故任而不助則本末內外暢然俱得泯然無迹若乃責此近因而忘其自爾宗物於外喪主於內而愛尚生矣雖欲推而齊之然其所尚已存乎胸中何夷之得有哉夫待與不待然與不然天機自張莫知其宰豈措情於尋責而思慮於心識者乎喪息浪反卒字依宋本及世德堂本改世德堂本物作化昔者莊周夢為胡蝶栩栩然胡蝶也自喻適志與不知周也俄然覺則蘧蘧然周也不知周之夢為胡蝶與胡蝶之夢為周與周與胡蝶則必有分矣此之謂物化自快得意悅豫而行栩栩欣暢貌也喻曉也夫生滅交謝寒暑遞遷蓋天地之常萬物之理也而莊生暉明鏡以照燭上善以遨遊故能託夢覺於死生寄自他於物化是以夢為胡蝶栩栩而適其心覺乃莊周蘧蘧而暢其志者也胡蝶徐徒協反司馬崔云蛺蝶也栩徐況羽反喜貌崔本作翩自喻李云喻快也志與音餘下同崔云與哉方其夢為胡蝶而不知周則與殊死不異也然所在無不適志則當生而係生者必當死而戀死矣由此觀之知夫在生而哀死者誤也方為胡蝶曉了分明快意適情悅豫之甚只言是蝶識莊周死不知生其義亦爾自周而言故稱覺耳未必非夢也蘧蘧驚動之貌也俄頃之間夢罷而覺驚怪思省方是莊周故注云自周而言故稱覺耳未必非夢也然覺古孝反蘧蘧徐音渠又其慮反李云有形貌崔作據據引大宗師云據然覺今之不知胡蝶無異於夢之不知周也而各適一時之志則無以明胡蝶之不夢為周矣世有假寐而夢經百年者則無以明今之百年非假寐之夢者也昔夢為蝶甚有暢情今作莊周亦言適志是以覺夢既無的當莊蝶豈辨真虛者哉夫覺夢之分無異於死生之辨也今所以自喻適志由其分定非由無分也既覺既夢有蝶有莊乃曰浮虛亦不無崖分也夫時不暫停而今不遂存故昨日之夢於今化矣死生之變豈異於此而勞心於其間哉方為此則不知彼夢為胡蝶是也取之於人則一生之中今不知後麗姬是也而愚者竊竊然自以為知生之可樂死之可苦未聞物化之謂也夫新新變化物物遷流譬彼窮指方茲交臂是以周蝶覺夢俄頃之間後不知前此不知彼而何為當生慮死妄起憂悲故知生死往來物理之變化也可樂音洛
