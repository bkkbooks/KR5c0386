body:
  text: 內篇逍遙遊第一內篇依通志堂本經典釋文補內者對外立名說文篇書也字從竹從草者草名耳非也夫小大雖殊而放於自得之場則物任其性事稱其能各各字宋趙諫議本作名當其分逍遙一也豈容勝負於其間哉慶藩案劉義慶世說新語文學類云莊子逍遙篇舊是難處諸名賢所可鑽味而不能拔理於郭向之外支道林在白馬寺中將馮太常共語因及逍遙支卓然標新理於二家之表立異義於衆賢之外皆是諸名賢尋味之所不得後遂用支理劉孝標注云向子期郭子玄逍遙義曰夫大鵬之上九萬尺鷃之起榆枋小大雖差各任其性苟當其分逍遙一也然物之藝藝同資有待得其所待然後逍遙耳唯聖人與物冥而循大變為能無待而常通豈獨自通而已又從有待者不失其所待不失則同於大通矣支氏逍遙論曰夫逍遙者明至人之心也莊生建言大道而寄指鵬鷃鵬以營生之路曠故失適於體外鷃以在近而笑遠有矜伐於心內至人乘天正而高興遊無窮於放浪物物而不物於物則遙然不我得玄感不為不疾而速則逍然靡不適此所以為逍遙也若夫有欲當其所足足於所足快然有似天真猶饑者一飽渴者一盈豈忘蒸嘗於糗糧絶觴爵於醪醴哉苟非至足豈所以逍遙乎此向郭之注所未盡逍音銷亦作消遙如字亦作搖慶藩案逍遙二字說文不收作消搖者是也禮檀弓消搖於門漢書司馬相如傳消搖乎襄羊京山引太玄翕首雖欲消搖天不之茲漢開母石闕則文耀以消搖文選宋玉九辨聊消搖以相羊後漢東平憲王蒼傳消搖相羊字並從水作消從手作搖唐釋湛然止觀輔行傳弘決引王瞀夜云消搖者調暢逸豫之意夫至理內足無時不適止懷應物何往不通以斯而遊天下故曰消搖又曰理無幽隱消然而當形無巨細搖然而通故曰消搖解消搖義視諸儒為長遊如字亦作游逍遙遊者篇名義取閒放不拘怡適自得慶藩案家世父侍郎公曰天下篇莊子自言其道術充實不可以已上與造物者遊首篇曰逍遙遊者莊子用其無端崖之詞以自喻也注謂小大雖殊逍遙一也似失莊子之恉又案文選潘安仁秋興賦注引司馬彪云言逍遙無為者能遊大道也釋文闕夫小大音符之場直良反事稱尺證反各當丁浪反其分符問反北冥有魚其名為鯤鯤之大不知其幾千里也溟猶海也取其溟漠無涯故為謂古多混用今以義別後不復出之溟東方朔十洲記云溟海無風而洪波百丈巨海之內有此大魚欲明物性自然故標為章首玄中記云東方有大魚焉行者一日過魚頭七日過魚尾産三日碧海為之變紅故知大物生於大處豈獨北溟而已北冥本亦作溟覓經反北海也嵇康云取其溟漠無涯也梁簡文帝云窅冥無極故謂之冥東方朔十洲記云水黑色謂之冥海無風洪波百丈慶藩案慧琳一切經音義三十一大乘入楞伽經卷二引司馬云溟謂南北極也去日月遠故以溟為名也釋文闕鯤徐音昆李侯溫反大魚名也崔撰云鯤當為鯨簡文同慶藩案方以智曰鯤本小魚之名莊子用為大魚之名其說是也爾雅釋魚鯤魚子凡魚之子名鯤魯語魚禁鯤鮞韋昭注鯤魚子也張衡京賦摷鯤鮞薛綜注鯤魚子也說文無鯤篆段玉裁曰魚子未生者曰鯤鯤即卵字許慎作古音讀如關亦讀如昆禮內則濡魚卵醬鄭讀卵若鯤凡未出者曰卵已出者曰子鯤即魚卵故叔重以字包之莊子謂絶大之魚為鯤此則齊物之寓言所謂汪洋自恣以適己者也釋文引李頤云鯤大魚名也崔撰簡文並云鯤當為鯨皆失之其幾居豈反下同化而為鳥其名為鵬鵬鯤之實吾所未詳也夫莊子之大意在乎逍遙遊放無為而自得故極小大之致以明性分之適達觀之士宜要其會歸而遺其所寄不足事事曲與生說自不害其弘旨皆可略之耳夫四序風馳三光電卷是以負山嶽而捨故揚舟壑以趨新故化魚為鳥欲明變化之大理也鵬步登反徐音朋郭甫登反崔音鳳云鵬即古鳳字非來儀之鳳也說文云朋及鵬皆古文鳳字也朋鳥象形鳳飛群鳥從以萬數故以朋為朋黨字字林云鵬朋黨也古以為鳳字盧文弨曰以朋舊作以鵬今案文義正慶藩案廣川書跋寶和鍾銘通雅四十五並引司馬云鵬者鳳也釋文闕夫莊音符發句之端皆同性分符問反下皆同達觀古亂反宜要一遙反鵬之背不知其幾千里也怒而飛其翼若垂天之雲魚論其大以表頭尾難知鳥言其背亦示修短叵測故下文云未有知其修者也鼓怒翅翼奮迅毛衣既欲摶風方將擊水遂乃斷絶雲氣背負青天騫翥翱翔淩摩霄漢垂陰布影若天涯之降行雲也垂天之雲司馬彪云若雲垂天旁崔云垂猶邊也其大如天一面雲也是鳥也海運則將徙於南冥南冥者天池也非冥海不足以運其身非九萬里不足以負其翼此豈好奇哉直以大物必自生於大處大處亦必自生此大物理固自然不患其失又何厝心於其間哉運轉也是指斥也即此鵬鳥其形重大若不海中運轉無以自致高升皆不得不然非樂然也且形既遷革情亦隨變昔日為魚涵泳北海今時作鳥騰翥南溟雖復升沈性殊逍遙一也亦猶死生聚散所遇斯適千變萬化未始非吾所以化魚為鳥自北徂南者鳥是淩虛之物南即啓明之方魚乃滯溺之蟲北蓋幽冥之地欲表向明背暗捨滯求進故舉南北鳥魚以示為道之徑耳而大海洪川原夫造化非人所作故曰天池也海運司馬云運轉也向秀云非海不行故曰海運簡文云運徙也慶藩案玉篇運行也渾天儀云天運如車轂謂天之行不息也此運字亦當訓行莊子言鵬之運行不息於海則將徙天池而休息矣說文徙移也段注乍行乍止而竟止則移其所矣下文引齊諧六月息之言可證郭氏謂非冥海不足以運其身釋文引司馬向秀之說皆失之豈好呼報反下皆同大處昌慮反下同何厝七故反本又作措盧文弨曰案說文厝厲石也措置也俗多通用今莊子注作措與說文合齊諧者志怪者也諧之言曰鵬之徙於南冥也水擊三千里摶扶搖而上者九萬里夫翼大則難舉故摶扶搖而後能上九萬里乃足自勝耳既有斯翼豈得決然而起數仞而下哉此皆不得不然非樂然也姓齊名諧人姓名也亦言書名也齊國有此諧之書也志記也擊打也摶鬥也扶搖旋風也齊諧所著之書多記怪異之事莊子引以為證明己所說不虛大鵬既將適南溟不可決然而起所以舉擊兩翅動蕩三千踉蹌而行方能離水然後繚戾宛轉鼓怒徘徊風氣相扶搖動而上塗經九萬時隔半年從容志滿方言憩止適足而已豈措情乎哉齊諧戶皆反司馬及崔並云人姓名簡文云書俞樾曰按下文諧之言曰則當作人名為允若是書名不得但稱諧志怪志記也怪異也水擊崔云將飛舉翼擊水踉蹌也踉音亮蹌音七亮反摶徒端反司馬云摶飛而上也一音博崔云拊翼徘徊而上也盧文弨曰當云本一作搏音博陸氏於考工記之摶埴字依考工記改亦云劉音博不分別字體非慶藩案慧琳一切經音義七十二引司馬云擊猶動也釋文闕又文選江文通雜體詩注引司馬云摶圜也扶搖上行風也圜飛而上行者若扶搖也范彥龍古意贈王中書詩注引司馬曰摶圜也圜飛而上若扶搖也張景陽七命注御覽九及九百二十七初學記一並引司馬曰扶搖上行風也諸書所引互有異同與釋文亦小異又案說文摶以手圜之也古借作專漢書天文志騎氣卑而布卒氣摶如淳注摶專也集韻摶擅也擅亦有專義又曰聚也摶扶搖而上言專聚風力而高舉也釋文所引未得摶字之義扶搖徐音遙風名也司馬云上行風謂之扶搖爾雅云扶搖謂之飆郭璞云暴風從下上也盧文弨曰從下上倒今據爾雅注改正而上時掌反注同自勝音升下同決然喜缺反下同數仞色主反下同非樂音嶽又五孝反去以六月息者也夫大鳥一去半歲至天池而息小鳥一飛半朝搶榆枋而止此比所能則有閒矣其於適性一也搶七羊反枋音方家世父曰去以六月息猶言乘長風也與下時則不至而控於地對文莊文多不能專於字句求之以上三十八字原誤置上注文之下野馬也塵埃也生物之以息相吹也此皆鵬之所馮以飛者耳野馬者游氣也爾雅云邑外曰郊郊外曰牧牧外曰野此言青春之時陽氣發動遙望藪澤之中猶如奔馬故謂之野馬也揚土曰塵塵之細者曰埃天地之閒生物氣息更相吹動以舉於鵬者也夫四生雜沓萬物參差形性不同資待宜異故鵬鼓垂天之翼託風氣以逍遙蜩張決起之翅搶榆枋而自得斯皆率性而動稟之造化非有情於遐邇豈措意於驕矜體斯趣者於何而語夸企乎野馬司馬云春月澤中游氣也崔云天地閒氣如野馬馳也塵埃音哀崔云天地閒氣蓊鬱似塵埃揚也相吹如字崔本作炊慶藩案吹炊二字古通用集韻炊纍動而升也荀子仲尼篇可炊而也本書在宥篇從容無為而萬物炊纍焉注並云炊與吹同又案莊生既言鵬之飛與息各適其性又申言野馬塵埃皆生物之以息相吹蓋喻鵬之純任自然亦猶野馬塵埃之纍動而升無成心也郭氏謂鵬之所馮以飛者疑誤所馮皮冰反本亦作憑盧文弨曰今注作憑改正天之蒼蒼其正色邪其遠而無所至極邪其視下也亦闕誤云文如海本亦作則若是則闕誤則作而已矣今觀天之蒼蒼竟未知便是天之正色邪天之為遠而無極邪鵬之自上以視地亦若人之自地字依續古逸叢書本改視天則止而圖南矣趙本無矣字言鵬不知道里之遠近趣足以自勝而逝仰視圓穹甚為迢遞碧空高遠算數無窮蒼蒼茫味豈天正色然鵬處中天人居下地而鵬之俯視不異人之仰觀人既不辨天之正色鵬亦詎知地之遠近自勝取足適至南溟鵬之圖度止在於是矣色邪餘嗟反助句不定之辭後放此盧文弨曰舊也嗟反今據易釋文正且夫水之積也不厚則其負大舟也無力覆杯水於坳堂之上則芥為之舟置杯焉則膠水淺而舟大也此皆明鵬之所以高飛者翼大故耳夫質小者所資不待大則質大者所用不得小矣故理有至分物有定極各足稱事其濟一也若乃失乎忘生之生字依釋文及世德堂本改而營生於至當之外事不任力動不稱情則雖垂天之翼不能無窮決起之飛不能無困矣且者假借是聊略之辭夫者開發在語之端緒積聚也厚深也杯小器也坳污陷也謂堂庭坳陷之地也芥草也膠黏也此起譬也夫翻覆一杯之水於坳污堂地之間將草葉為舟則浮泛靡滯若還用杯為舟理必不可何者水淺舟大則黏地不行故也是以大舟必須深水小芥不待洪流苟其大小得宜則物皆逍遙且夫音符覆芳服反杯崔本作杯坳堂於交反又烏了反李又伊九反崔云堂道謂之坳司馬云塗地令平支遁云謂有坳垤形也芥吉邁反徐古邁反一音古黠反李云小草也則膠徐李古孝反一音如字崔云膠著地也李云黏也稱事尺證反後同其濟子細反本又作齊如字之生本亦作主字至當丁浪反後皆同風之積也不厚則其負大翼也無力故九萬里則風斯在下矣此合喻也夫水不深厚則大舟不可載浮風不崇高大翼無由淩霄漢是是字依劉文典補正本補以小鳥半朝決起搶榆枋依下疏文小鳥決起榆枋句改之上大鵬九萬飄風鼓扇其下也而後乃今培風背負青天而莫之夭閼者而後乃今將圖南夫所以乃今將圖南者非其好高而慕遠也風不積則夭閼不通故耳此大鵬之逍遙也培重也夭折也閼塞也初賴扶搖故能升翥重積風吹然後飛行既而上負青天下乘風脊一淩霄漢六月方止網羅不逮畢弋無侵折塞之禍於何而至良由資待合宜自致得所逍遙南海不亦宜乎而後乃今培音裴重也徐扶杯反又父宰反三音扶北反本或作陪盧文弨曰今本三作一非風絶句慶藩案王念孫曰培之言馮也馮乘也見周官馮相氏注風在鵬下故言負鵬在風上故言馮必九萬里而後在風之上在風之上而後能馮風故曰而後乃今培風若訓培為重則與上文了不相涉矣馮與培聲相近故義亦相通漢書周傳更封為字依漢書改城侯顏師古曰呂忱音陪而楚漢春秋作馮城侯陪馮聲相近是其證也馮字古音在蒸部陪字古音在之部之部之音與蒸部相近故陪馮聲亦相近說文曰陪滿也王注離騷曰馮滿也陪馮聲相近故皆訓為滿文穎注漢書文帝紀曰陪輔也張晏注百官公卿表曰馮輔也說文曰倗輔也陪馮倗聲並相近故皆訓為輔說文曰倗從人朋聲讀若陪位從邑崩聲讀若陪漢書王尊傳南山群盜傰宗等蘇林曰傰音朋晉灼曰音倍墨子尚賢篇守城則倍畔非命篇倍作崩皆其例也今案說文培益也培風者以風益大翼之力助其高飛也陸氏訓重未明當從王氏為允背負青天一讀以背字屬上句夭於表反司馬云折也閼徐於葛反一音謁司馬云止也李云塞也慶藩案文選劉孝標辨命論注引司馬云夭折閼止也言無有夭止使不通者也視釋文所引為詳蜩與學鳩笑之曰我決起而飛榆枋時則不至而控於地而已矣奚以之九萬里而南為適莽蒼者三餐而反腹猶果然適百里者宿舂糧適千里者三月聚糧之二蟲又何知苟足於其性則雖大鵬無以自貴於小鳥小鳥無羡於天池而榮願有餘矣故小大雖殊逍遙一也蜩蟬也生七八月紫青色一名蛁蟟鸒鳩鶻鳩也即今之班鳩是也決卒疾之貌集也亦突也枋檀木也控投也引也窮也奚何也之適也蜩鳩聞鵬鳥之弘大資風水以高飛故嗤彼形大而劬勞欣我質小而逸豫且騰躍不過數仞突榆檀而栖集時困不到前林投地息而更起逍遙適性樂在其中何須時經六月途遙九萬跋涉辛苦南適胡為以小笑大夸企自息而不逍遙者未之有也蜩音條司馬云蟬學鳩如字一音於角反本又作鷽音同本或作鸒音預崔云學讀為滑滑鳩一名滑雕司馬云學鳩小鳩也李云鶻鵰也毛詩草木疏云鶻鳩班鳩也簡文云月令云鳴鳩拂其羽是也慶藩案俞樾曰釋文曰學本或作鸒音預據文選江文通雜體詩鸒斯蒿下飛李善注即以莊子此文說之又引司馬云鸒鳩小鳥毛萇詩傳曰鸒斯鵯居鵯居鴉烏也音豫然則李氏所據本固作鸒不作學也今釋文引司馬云學鳩小鳩也此經後人竄改非其原文矣今案釋文學作鷽說文鷽雗鷽山鵲知來事鳥或作爾雅釋鳥鷽山鵲作學者蓋鷽假借字鳩為五鳩之總名鷽鳩當是兩物釋文引諸說似未分曉我決向徐喜缺反李呼穴反李頤云疾貌七良反司馬李云猶集也崔云著也支遁云突也俞樾曰王氏引之經傳釋詞曰則猶或也引史記陳丞相世家則恐後悔為證此文則字亦當訓為或榆徐音踰木名也枋徐音方李云檀木也崔云本也或曰木名盧文弨曰今本作崔云木也與下復係字誤控苦貢反司馬云投也又云引也崔云叩也俞樾曰而字下當有圖字上文而後乃今將圖南此即承上文而言也文選注引此正作奚以之九萬里而圖南為所適彌遠則聚糧彌多故其翼彌大則積氣彌厚也適往也莽蒼郊野之色遙望之不甚分明也果然飽貌也往於郊野來去三食路既非遙腹猶充飽百里之行路程稍遠舂搗糧食為一宿之借適於千里之途路既迢遙聚積三月之糧方充往來之食故郭注云所適彌遠則聚糧彌多故其翼彌大則積氣彌厚者也莽莫浪反或莫郎反蒼七蕩反或如字司馬云莽蒼近郊之色也李云近野也支遁云冢閒也崔云草野之色三餐七丹反果然徐如字又苦火反衆家皆云飽貌舂束容反糧音良二蟲謂鵬蜩也對大於小所以均異趣也夫趣之所以異豈知異而異哉皆不知所以然而自然耳自然耳不為也此逍遙之大意郭注云二蟲鵬蜩也對大於小所以均異趣也且大鵬摶風九萬小鳥決起榆枋雖復遠近不同適性均也咸不知道里之遠近各取足而自勝天機自張不知所以既無意於高卑豈有情於優劣逍遙之致其在茲乎而呼鵬為蟲者大戴禮云東方鱗蟲三百六十應龍為其長南方羽蟲三百六十鳳皇為其長西方毛蟲三百六十麒麟為其長北方甲蟲三百六十靈龜為其長中央裸蟲三百六十聖人為其長通而為語故名鵬為蟲也俞樾曰二蟲即承上文蜩鳩之笑而言謂蜩鳩至小不足以知鵬之大也郭注云二蟲謂鵬蜩也失之搶字依釋文原本改下並同闕誤引文本及江南舊本枋下有而止二字闕誤引文本果作顆闕誤引文本此句上下有彼也二字小知不及大知小年不及大年奚以知其然也朝菌不知晦朔蟪蛄不知春秋此小年也楚之南有冥靈者以五百歲為春五百歲為秋上古有大椿者以八千歲為春八千歲為秋而彭祖乃今以久特聞衆人匹之不亦悲乎物各有性性各有極皆如年知豈跂尚之所及哉自此已下至於列子歷舉年知之大小各信其一方未有足以相傾者也然後統以無待之人遺彼忘我冥此群異異方同得而我無功名是故統小大者無小無大者也苟有乎大小則雖大鵬之與斥鷃宰官之與御風同為纍物耳齊死生者無死無生者也苟有乎死生則雖大椿之與蟪蛄彭祖之與朝菌均於短折耳故遊於無小無大者無窮者也冥乎不死不生者無極者也若夫逍遙而繫於有方則雖放之使遊而有所窮矣未能無待也夫物受氣不同稟分各異智則有明有暗年則或短或長故舉朝菌冥靈宰官榮子皆如年知豈企尚之所及哉故知物性不同不可強相希效也小知音智本亦作智下大知並注同下年知放此跂尚丘豉反後同纍物劣僞反下皆同奚何也然如此也此何以知年知不相及若此之縣解耶假設其問以生後答此答前問也朝菌者謂天時滯雨於糞堆之上熱蒸而生陰溼則生見日便死亦謂之大芝生於朝而死於暮故曰朝菌月終謂之晦月旦謂之朔假令逢陰數日便萎終不涉三旬故不知晦朔也蟪蛄夏蟬也生於麥梗亦謂之麥節夏生秋死故不知春秋也菌則朝生暮死蟬則夏長秋殂斯言齡命短促故謂之小年也朝菌徐其隕反司馬云大芝也天陰生糞上見日則死一名日及故不知月之終始也崔云糞上芝朝生暮死晦者不及朔朔者不及晦支遁云一名舜英朝生暮落潘尼云木槿也簡文云欻生之芝也欻音況物反盧文弨曰案菌芝類故字從草支遁潘尼以木槿當之說殊誤慶藩案慧琳一切經音義八十四集古今佛道論衡卷三引司馬云朝菌大芝也江東呼為土菌一曰道廚又御覽九百九十八引司馬云朝菌大芝也天陰時生糞上見陽則萎故不知月之始終與釋文所引小異又案王引之曰案淮南道應篇引此朝菌作朝秀今本淮南作朝菌乃後人據莊子改之文選辨命論注及太平御覽蟲豸部六引淮南並作朝秀今據改高注曰朝秀朝生暮死之蟲也生水上狀似蠶蛾一名孳母據此則朝秀與蟪蛄皆蟲名也朝菌朝秀語之轉耳非謂芝菌亦非謂木槿也上文云之二蟲又何知謂蜩與學鳩此云不知晦朔亦必謂朝菌之蟲蟲者微有知之物故以知不知言之若草木無知之物何須言不知乎今案王說是也廣雅正作朝以其為蟲故字從蟲耳晦朔晦冥也朔旦也盧文弨曰此以一日之蚤莫言不若以一月之終始言蓋朝生者不及暮然固知朝矣暮生者不及朝然固知暮矣故晦朔不當從日為解惠本亦作蟪同盧文弨曰今本作蟪係說文新附字蛄音姑司馬云惠蛄寒蟬也一名蝭蟧春生夏死夏生秋死崔云蛁蟧也或曰山蟬秋鳴者不及春春鳴者不及秋廣雅云蟪蛄蛁也案即楚辭所云寒螿者也蝭音提蟧音勞又音遼蛁音雕螿音將慶藩案御覽九百四十九引司馬云惠蛄亦名蝭蟧春生夏死夏生秋死故不知歲有春秋也與釋文所引小異冥靈大椿並木名也以葉生為春以葉落為秋冥靈生於楚之南以二千歲為一年也而言上古者伏犧時也大椿之木長於上古以三萬二千歲為一年也冥靈五百歲而花生大椿八千歲而葉落並以春秋賒永故謂之大年也冥本或作榠同靈李頤云冥靈木名也江南生以葉生為春葉落為秋此木以二千歲為一年盧文弨曰案說文云以五百歲為春以五百歲為秋言春秋則包乎冬夏矣則當云以千歲為一年下大椿亦當云此木萬六千歲為一年不當云三萬二千歲慶藩案齊民要術靈作泠引司馬云木生江南千歲為一年釋文漏引大椿丑倫反司馬云木一名也木槿也崔音華同李云生江南一云生北戶南此木三萬二千歲為一年慶藩案齊民要術引司馬云木槿也以萬六千歲為一年一名蕣椿與釋文所引小異夫年知不相及若此之懸也比於衆人之所悲亦可悲矣而衆人未嘗悲此者以其性各有極也苟知其極則毫分不可相跂天下又何所悲乎哉夫物未嘗以大欲小而必以小羡大故舉小大之殊各有定分非羡欲所及則羡欲之纍可以絶矣夫悲生於纍纍絶則悲去悲去而性命不安者未之有也彭祖者姓籛名鏗帝顓頊之玄孫也善養性能調鼎進雉羹於堯堯封於彭城其道可祖故謂之彭祖歷夏經殷至周年八百歲矣特獨也以其年長壽所以聲名獨聞於世而世人比匹彭祖深可悲傷而不悲者為彭祖稟性遐壽非我氣類置之言外不敢嗟傷故知生也有涯豈唯彭祖去己一毫不可企及於是均椿菌混彭殤各止其分而性命安矣彭祖李云名鏗堯臣封於彭城歷虞夏至商年七百歲故以久壽見聞世本云姓籛名鏗在商為守藏史在周為柱下史年八百歲籛音翦一云即老子也崔云堯臣仕殷世其人甫壽七百年王逸注楚辭天問云彭鏗即彭祖事帝堯彭祖至七百歲猶曰悔不壽恨而唾遠云帝嚳之玄孫盧文弨曰玉篇籛子踐切姓也與此正合是古讀皆然或據廣韻改作音箋非是慶藩案神仙傳曰彭祖諱鏗帝顓頊之玄孫至殷末年七百六十七歲而不衰老遂往流沙之西非壽終也今案史記楚世家顓頊生稱稱生卷章卷章生重黎重黎為帝嚳所殺以其弟吳回後重黎為火正吳回生陸終陸終生彭祖以世系推之彭祖乃顓頊玄孫陸終之子禮所謂來孫也成疏緣神仙傳作顓頊之玄孫誤釋文引王逸楚辭章句以為帝嚳之玄孫亦非帝嚳為顓頊之姪名彭祖乃顓頊子稱之玄孫帝嚳之姪玄孫也特聞如字崔本作待問之懸音玄豪分符問反又方云反闕誤引成玄英本秋下有此大年也句解字依下注文刪枕高釋文原本亦誤依楚辭王逸注改湯之問棘也是已窮髮之北有冥海者天池也有魚焉其廣數千里未有知其修者其名為鯤有鳥焉其名為鵬背若太山翼若垂天之雲摶扶搖羊角而上者九萬里絶雲氣負青天然後圖南且適南冥也斥鴳笑之曰彼且奚適也我騰躍而上不過數仞而下翱翔蓬蒿之間此亦飛之至也而彼且奚適也此小大之辨也湯之問棘亦云物各有極任之則條暢故莊子以所問為是也湯是帝嚳之後契之苗裔姓子名履字天乙母氏扶都見白氣貫月感而生湯豐下兌上身長九尺仕夏為諸侯有聖德諸侯歸之遭桀無道囚於夏臺後得免乃與諸侯同盟於景亳之地會桀於昆吾之墟大戰於鳴條之野桀奔於南巢湯既克桀讓天下於務光務光不受湯即位乃都於亳後改為商殷開基之主也棘者湯時賢人亦云湯之博士列子謂之夏革革棘聲類蓋字之誤也而棘既是賢人湯師事之故湯問於棘詢其至道云物性不同各有素分循而直往因而任之殷湯請益深有玄趣莊子許其所問故云是已棘李云湯時賢人又云是棘子崔云齊諧之徒識冥靈大椿者名也簡文云一曰湯廣大也棘狹小也俞樾曰李云湯時賢人是簡文云湯大也棘狹小也以湯棘為寓名殆未讀列子者此篇全本列子上文所說鯤鵬及冥靈大椿皆湯問篇文慶藩案列子湯問篇殷湯問夏革張注夏革即夏棘字子棘湯時賢大夫革棘古同聲通用論語棘子成漢書古今人表作革子成詩匪棘其欲禮坊記引作匪革其猶漢書煮棗侯革朱史記索隱革音棘皆其證修長也地以草為毛髮北方寒沍之地草木不生故名窮髮所謂不毛之地鯤魚廣闊數千未有知其長者明其大也然冥海鯤鵬前文已出如今重顯者正言前引齊諧足為典實今牽列子再證非虛鄭重殷勤以成其義者也窮髮李云髮猶毛也司馬云北極之下無毛之地也崔云北方無毛地也案毛草也地理書云山以草木為髮慶藩案窮髮之北列子作窮髮北之北北史蠕蠕傳蠕蠕者胸奴之裔根本莫尋翦之窮髮之野逐之無人之鄉窮髮言極荒遠之地也其廣古曠反數千色主反下同鵬背弘巨狀若嵩華旋風曲戾猶如羊角既而淩摩蒼昊遏絶雲霄鼓怒放暢圖度南海故禦寇湯問篇云世豈知有此物哉大禹行而見之伯益知而名之夷堅聞而志之是也羊角司馬云風曲上行若羊角而上時掌反下同各以得性為至自盡為極也向言二蟲殊翼故所至不同或翱翔天池或畢志榆枋直各稱體而足不知所以然也今言小大之辨各有自然之素既非跂慕之所及亦各安其天性不悲所以異故再出之且將也亦語助也斥小澤也鴳雀也八尺曰仞翱翔猶嬉戲也而鴳雀小鳥縱任斥澤之中騰舉踴躍自得蓬蒿之內故能嗤九萬之遠適欣數仞之近飛斯蓋辨小大之性殊論各足之不二也且適如字舊子餘反下同斥如字司馬云小澤也本亦作尺崔本同簡文云作尺非鴳於諫反字亦作鷃司馬云鴳鴳雀也慶藩案斥鴳釋文引崔本作尺鴳是也說文鴳鴳雇也犍為舍人李巡孫炎爾雅注皆云一名鴳鴳雀也郭注同斥尺古字通文選曹植七啓注鷃雀飛不過一尺言其劣弱也正釋尺字之義淮南高注斥澤之鷃為飛不出頃畝喻弱也文選宋玉對楚王問尺澤之鯢注尺澤言小也夏侯湛抵疑尺鷃不能陵桑榆字正作尺一切經音義尺鷃下云鷃長惟尺即以尺名釋文引簡文云作尺非失之騰躍若反翱翔五刀反蓬蒿好刀反太山趙諫議本作大山世德堂本作泰山由字依世德堂本改故夫知效一官行比一鄉德合一君而徵一國者其自視也亦若此矣而宋榮子猶然笑之且舉世而譽之而不加勸舉世而非之而不加沮定乎內外之分辨乎榮辱之境斯已矣彼其於世未數數然也雖然猶有未樹也夫列子御風而行泠然善也旬有五日而後反彼於致福者未數數然也此雖免乎行猶有所待者也若夫乘天地之正而御六氣之辨以遊無窮者彼且惡乎待哉故曰至人無己神人無功聖人無名亦猶鳥之自得於一方也故是仍前之語夫是生後之詞國是五等之邦鄉是萬二千五百家也自有智數功效堪蒞一官自有名譽著聞比周鄉黨自有道德弘博可使南面徵成邦國安育黎元此三者稟分不同優劣斯異其於各足未始不齊視己所能亦猶鳥之自得於一方知效音智下戶教反行下孟反比毗至反徐扶至反李云合也而徵如字司馬云信也崔支云成也慶藩案而徵一國釋文及郭注無訓成疏讀而為轉語非也而字當讀為能能而古聲近通用也官鄉君國相對知仁德能亦相對則而字非轉語詞明矣淮南原道篇而以少正多高注而能也呂覽去私不屈諸篇注皆曰而能也墨子尚同篇故古者聖王唯而審以尚同以為正長又曰天下所以治者何也唯而以尚同一義為政故也非命篇不而矯其耳目之欲楚辭九章世孰云而知之齊策子孰而與我赴諸侯乎而並與能同堯典柔遠能邇漢督郵班碑作而邇皋陶謨能哲而惠衛尉衡方碑作能哲能惠史記夏本記作能智能惠禮運正義曰劉向說苑能字皆作而是其例未能齊故有笑子者有德之稱姓榮氏宋人也猶然如是榮子雖能忘有未能遣無故笑宰官之徒滯於爵祿虛淡之人猶懷嗤笑見如是所以不齊前既以小笑大示大者不夸今則以大笑小小者不企而性命不安者理未之聞也宋榮子司馬李云宋國人也崔云賢者也猶然笑之崔李云猶笑貌案謂猶以為笑審自得也舉皆也勸勵勉也沮怨喪也榮子率性懷道謷然超俗假令世皆譽讚亦不增其勸獎率土非毀亦不加其沮喪審自得也譽之音餘加沮慈呂反敗也內我而外物榮子知內既非我外亦非物內外雙遣物我兩忘故於內外之分定而不忒也榮己而辱人忘勸沮於非譽混窮通於榮辱故能返照明乎心智玄鑒辨於物境不復內我而外物榮己而辱人也之竟居領反慶藩案釋文作竟古竟境字通亦不能復過此斯此也已止也宋榮子智德止盡於斯也能復扶又反足於身故閒於世也數數猶汲汲也宋榮子率性虛淡任理直前未嘗運智推求役心為道栖身物外故不汲汲然者也數數音朔下同徐所祿反一音桑縷反司馬云猶汲汲也崔云迫促意也簡文所喻反謂計數故閒音間本亦作間唯能自是耳未能無所不可也樹立也榮子捨有證無溺在偏滯故於無待之心未立逍遙之趣智尚虧也未樹司馬云樹立也未立至德也泠然輕妙之貌姓列名禦寇鄭人也與鄭繻公同時師於壺丘子林著書八卷得風仙之道乘風遊行泠然輕舉所以稱善也列子李云鄭人名禦寇得風仙乘風而行與鄭穆公同時泠音零慶藩案初學記太平御覽九引司馬云列子鄭人列禦寇也泠然涼貌也文選江文通雜體詩注引同釋文闕苟有待焉則雖御風而行不能以一時而周也旬十日也既得風仙遊行天下每經一十五日回反歸家未能無所不乘故不可一時周也自然御風行耳非數數然求之也致得也彼列禦寇得於風仙之福者蓋由炎涼無心虛懷任運非關役情取捨汲汲求之欲明為道之要要在忘心若運役智慮去之遠矣家世父曰未數數然也猶戴記之云天下一人而已致福謂備致自然之休御風而行猶待天機之動焉郭象云自然御風行非數數然求之誤非風則不得行斯必有待也唯無所不乘者無待耳乘風輕舉雖免步行非風不進猶有須待自宰官已下及宋榮禦寇歷舉智德優劣不同既未洞忘咸歸有待唯當順萬物之性遊變化之塗而能無所不成者方盡逍遙之妙致者也天地者萬物之總名也天地以萬物為體而萬物必以自然為正自然者不為而自然者也故大鵬之能高斥鴳之能下椿木之能長朝菌之能短凡此皆自然之所能非為之所能也不為而自能所以為正也故乘天地之正者即是順萬物之性也御六氣之辨者即是遊變化之塗也如斯以往則何往而有窮哉所遇斯乘又將惡乎待哉此乃至德之人玄同彼我者之逍遙也苟有待焉則雖列子之輕妙猶不能以無風而行故必得其所待然後逍遙耳而況大鵬乎夫唯與物冥而循大變者為能無待而常通豈獨自通而已哉又順有待者使不失其所待所待不失則同於大通矣故有待無待吾所不能齊也至於各安其性天機自張受而不知則吾所不能殊也夫無待猶不足以殊有待況有待者之巨細乎天地者萬物之總名萬物者自然之別稱六氣者李頤云平旦朝霞日午正陽日入飛泉夜半沆瀣並天地二氣為六氣也又杜預云六氣者陰陽風雨晦明也又支道林云六氣天地四時也辨者變也惡乎猶於何也言無待聖人虛懷體道故能乘兩儀之正理順萬物之自然御六氣以逍遙混群靈以變化苟無物而不順亦何往而不通哉明徹於無窮將於何而有待者也六氣司馬云陰陽風雨晦明也李云平旦為朝霞日中為正陽日入為飛泉夜半為沆瀣天玄地黃為六氣王逸注楚辭云陵陽子明經言春食朝霞朝霞者日欲出時黃氣也秋食淪陰淪陰者日沒已後赤黃氣也冬食沆瀣沆瀣者北方夜半氣也夏食正陽正陽者南方日中氣也並天玄地黃之氣是為六氣沆音戶黨反瀣音下界反支云天地四時之氣慶藩案釋文引諸家訓六氣各有不同司馬以陰陽風雨晦為六氣其說最古李氏以平旦日中日入夜半並天玄地黃為六氣頗近牽強王逸支遁以天地四時為六氣夫天地之氣大莫與京四時皆承天地之氣以為氣似不得以四時與天地並列為六王應麟云六氣少陰君火太陰溼土少陽相火陽明燥金太陽寒水厥陰風木而火獨有二天以六為節故氣以六期為一備左傳述醫和之言天有六氣注云陰陽風雨晦也降生五味即素問五六之數全祖望云天五地見於大易天六地五見於國語故漢志云五六天地之中合然左氏之說又與素問不同沈括筆談六氣方家以配六神所謂青龍者東方厥陰之氣也其他取象皆如是唯北方有二曰玄武太陽寒水之氣也曰螣蛇少陽相火之氣也其在人為腎腎有二左太陽寒水右少陽相火此坎離之交也中央太陽陰土為句陳配脾也六氣之說聚訟棼如莫衷一是愚謂有二說焉一洪範雨暘燠寒風時為六氣也雨木也暘金也燠火也寒水也風土也是為五氣五氣得時是為五行之和氣合之則為六氣氣有和有乖乖則變也變則宜有以御之故曰御六氣之變一六氣即六情也漢書翼奉傳奉又引師說六情云北方之情好也好行貪狼申子主之東方之情怒也怒行陰亥卯主之南方之情惡也惡行廉貞寅午主之西方之情喜也喜行寬大己酉主之上方之情樂也樂行姦邪辰未主之下方之情哀也哀行公正戌丑主之此二說似亦可備參證之辨如字變也崔本作和慶藩案辨與正對文辨讀為變廣雅辨變也易坤文言辨之不早辨也荀本作變辨變古通用崔訓和失之惡乎音烏注同無己故順物順物而至矣無己音紀注同盧文弨曰今本無作無下並同而王于況反本亦作至夫物未嘗有謝生於自然者而必欣賴於針石故理至則跡滅矣今順而不助與至理為一故無功於針之反或之林反聖人者物得性之名耳未足以名其所以得也至言其體神言其用聖言其名故就體語至就用語神就名語聖其實一也詣於靈極故謂之至陰陽不測故謂之神正名百物故謂之聖也一人之上其有此三欲顯功用名殊故有三人之別此三人者則是前文乘天地之正御六氣之辨人也欲結此人無待之德彰其體用乃言故曰耳慶藩案文選任彥升到大司馬記室箋注引司馬云神人無功言修自然不立功也聖人無名不立名也釋文闕世德堂本境作竟與釋文同趙諫議本作境唐寫本無而字獨字依王叔岷說補六字依困學紀聞改故字依困學紀聞補陰字依夢溪筆談改賊字依漢書改世德堂本至作王與釋文同鴆字依釋文改堯讓天下於許由曰日月出矣而爝火不息其於光也不亦難乎時雨降矣而猶浸灌其於澤也不亦勞乎夫子立而天下治而我猶尸之吾自視缺然請致天下堯者帝嚳之子姓伊祁字放勛母慶都嚳感赤龍而生身長一丈兌上而豐下眉有八彩足履翼星有聖德年十五封唐侯二十一代兄登帝位都平陽號曰陶唐在位七十二年乃授舜年百二十八歲崩葬於陽城諡曰堯依諡法翼善傳聖曰堯言其有傳舜之功也許由隱者也姓許名由字仲武潁川陽城人也隱於箕山師於齧缺依山而食就河而飲堯知其賢讓以帝位許由聞之乃臨河洗耳巢父飲犢牽而避之曰惡吾水也死後堯封其墓諡曰箕公即堯之師也堯唐帝也許由隱人也隱於箕山司馬云潁川陽城人簡文云陽城槐里人李云字仲武爝火猶炬火也亦小火也神農時十五日一雨謂之時雨也且以日月照燭詎假炬火之光時雨滂沱無勞浸灌之澤堯既撝謙克讓退己進人所以致此之辭盛推仲武也爝本亦作燋音爵郭祖繳反司馬云然也向云人所然火也一云燋火謂小火也字林云爝炬火也子召反燋所以然持火者子約反慶藩案說文爝苣火也呂不韋曰湯伊尹爝以爟火釁以犧豭案苣束葦燒之也祓除惡之祭也燋所以然持火也段玉裁注持火者人所持之火也禮少儀執燭抱燋凡執之曰燭未曰燋燋即燭也細繹許說則燋本為未之燭未則不得云不息釋文引司馬氏李氏本亦作燋非廣韻燋傷火也與焦通別一義浸子鴆反灌古亂反慶藩案正韻浸漬也又漸也陰符經云天地之道浸故陰陽勝易之臨曰剛浸而長浸者漸也博雅灌聚也又溉也浸灌蓋浸潤漸漬之謂治正也尸主也致與也堯既師於許由故謂之為夫子若仲武立為天子宇內必致太平而我猶為物主自視缺然不足請將帝位讓與賢人天下治直吏反下已治注天下治而治者也既治而治實而治者得以治者皆同祓字得字並依說文原本改許由曰子治天下天下既已治也而我猶代子吾將為名乎名者實之賓也吾將為賓乎鷦鷯巢於深林不過一枝偃鼠飲河不過滿腹歸休乎君豫無所用天下為庖人雖不治庖尸祝不越樽俎而代之矣夫能令天下治不治天下者也故堯以不治治之非治之而治者也今許由方明既治則無所代之而治實由堯故有子治之言宜忘言以尋其所況而或者遂云治之而治者堯也不治而堯得以治者許由也斯失之遠矣夫治之由乎不治為之出乎無為也取於堯而足豈借之許由哉若謂拱默乎山林之中而後得稱無為者此莊老之談所以見棄於當塗當塗者自必於有為之域而不反者斯之由也治謂理也既盡也言堯治天下久以升平四海八荒盡皆清謐何勞讓我過為辭費然睹莊文則貶堯而推許尋郭注乃劣許而優堯者何邪欲明放勛大聖仲武大賢賢聖二塗相去遠矣故堯負扆汾陽而喪天下許由不夷其俗而獨立高山圓照偏溺斷可知矣是以莊子援禪讓之跡故有爝火之談郭生察無待之心更致不治之說可謂探微索隱了文合義尋其旨況無所稍嫌也能令力呈反下同夫自任者對物而順物者與物無對故堯無對於天下而許由與稷契為匹矣何以言其然邪夫與物冥者故群物之所不能離也是以無心玄應唯感之從泛乎若不繫之舟東西之非己也故無行而不與百姓共者亦無往而不為天下之君矣以此為君若天之自高實君之德也若獨亢然立乎高山之頂非夫人有情於自守守一家之偏尚何得專此此故俗中之一物而為堯之外臣耳若以外臣代乎內主斯有為君之名而無任君之實也許由偃蹇箕山逍遙潁水膻臊榮利厭穢聲名而堯殷勤致請猶希代己許由若高九五將為萬乘之名然實以生名名從實起實則是內是主名便是外是賓捨主取賓喪內求外既非隱者所尚故云吾將為賓也稷契息列反皆唐虞臣也稷周之始祖名棄契殷之始祖名能離力智反玄應應對之應乎芳劍反非夫音扶下明夫同性各有極苟足其極則餘天下之財也鷦鷯巧婦鳥也一名工雀一名女匠亦名桃蟲好深處而巧為巢也偃鼠形大小如牛赤黑色獐腳腳有三甲耳似象耳尾端白好入河飲水而鳥巢一枝之外不假茂林獸飲滿腹之餘無勞浩汗況許由安茲蓬蓽不顧金闈樂彼疏食詎勞玉食也鷦子遙反鷯音遼李云鷦鷯小鳥也郭璞云鷦鷯桃雀偃鼠如字李云鼷鼠也說文蚡鼠一曰偃鼠蚡音扶問反盧文弨曰舊無音字今案凡不見正文及注之字而加音者例有音字今依前後例增慶藩案李楨曰偃鼠李云鼷鼠也案說文蚡下云地行鼠伯勞所化也一曰偃鼠偃或作俗作玉篇鼴大鼠也廣雅鼠蚡鼠本草鼠在土中行陶注俗一名隱鼠一名蚡鼠常穿耕地中行討掘即得說文鼷下云鼷小鼠也爾雅鼷鼠有螫毒者公羊成七年傳注云鼷鼠鼠中之微者博物志鼷鼠鼠之類最小者食物當時不覺痛或名甘鼠據此知偃鼠鼷鼠判然為二李說誤均之無用而堯獨有之明夫懷豁者無方故天下樂推而不厭豫我也許由寡欲清廉不受堯讓故謂堯云君宜速還黃屋歸反紫微禪讓之辭宜其休息四海之尊於我無用九五之貴豫何用為歸休乎君絶句一讀至乎字絶句君別讀懷豁呼活反樂推音洛不厭於豔反庖人尸祝各安其所司鳥獸萬物各足於所受帝堯許由各靜其所遇此乃天下之至實也各得其實又何所為乎哉自得而已矣故堯許之行雖異其於逍遙一也庖人謂掌庖廚之人則今之太官供膳是也尸者太廟中神主也祝者則今太常太祝是也執祭版對尸而祝之故謂之尸祝也樽酒器也俎肉器也而庖人尸祝者各有司存假令膳夫懈怠不肯治庖尸祝之人終不越局濫職棄於樽俎而代之宰烹亦猶帝堯禪讓不治天下許由亦不去彼山林就茲帝位故注云帝堯許由各靜於所遇也已庖人鮑交反徐扶交反掌廚人也周禮有庖人職慶藩案說文庖廚也禮王制三為充君之庖注庖今之廚也周禮庖人注庖之為言苞也苞裹肉曰苞苴裹之曰苞藉之曰苴釋文一本庖下無人字非是尸祝之六反傳鬼神辭曰祝樽子存反本亦作尊盧文弨曰案尊乃正體俎徐側呂反俞樾云此本作吾將為實乎與上吾將為名乎相對成文實與賓形似又涉上句實之賓也而誤當塗二字依世德堂本補之行二字趙諫議本作之地世德堂本作天地肩吾問於連叔曰吾聞言於接輿大而無當往而不返吾驚怖其言猶河漢而無極也大有徑庭不近人情焉肩吾連叔並古之懷道人也接輿者姓陸名通字接輿楚之賢人隱者也與孔子同時而佯狂不仕常以躬耕為務楚王知其賢聘以黃金百鎰車駟二乘並不受於是夫負妻戴以遊山海莫知所終肩吾聞接輿之言過無準的故問連叔詢其義旨而言吾聞言於接輿者聞接輿之言也莊生寄三賢以明堯之一聖所聞之狀具列於下文也肩吾李云賢人也司馬云神名連叔李云懷道人也接輿本又作與同音餘接輿楚人也姓陸名通皇甫謐曰接輿躬耕楚王遣使以黃金百鎰車二駟聘之不應所聞接輿之言弘而無的當一往而陳梗概曾無反覆可尋吾竊聞之驚疑怖恐猶如上天河漢迢遞清高尋其源流略無窮極也無當丁浪反司馬云言語弘大無隱當也驚怖普布反廣雅云懼也徑庭猶過差亦是直往不顧之貌也謂接輿之言不偶於俗多有過差不附世情故大言不合於里耳也大有音泰徐敕佐反徑徐古定反司馬本作莖庭敕定反李云徑庭謂激過也慶藩案文選劉孝標辨命論注引司馬云極崖也言廣若河漢無有崖也徑庭激過之辭也釋文闕不近附近之近連叔曰其言謂何哉陸通之說其若何此則反質肩吾所聞意謂曰藐姑射之山有神人居焉肌膚若冰雪約若處子不食五穀吸風飲露乘雲氣御飛龍而遊乎四海之外其神凝使物不疵癘而年穀熟吾以是狂而不信也此皆寄言耳夫神人即今所謂聖人也夫聖人雖在廟堂之上然其心無異於山林之中世豈識之哉徒見其戴黃屋佩玉璽便謂足以纓紱其心矣見其歷山川同民事便謂足以憔悴其神矣豈知至至者之不虧哉今言王德之人而寄之此山將明世所無由識故乃託之於絶垠之外而推之於視聽之表耳處子者不以外傷內藐遠也山海經云姑射山在寰海之外有神聖之人戢機應物時須揖讓即為堯舜時須干戈即為湯武綽約柔弱也處子未嫁女也言聖人動寂相應則空有並照雖居廊廟無異山林和光同塵在染不染冰雪取其潔淨綽約譬以柔和處子不為物傷姑射語其絶遠此明堯之盛德窈冥玄妙故託之絶垠之外推之視聽之表斯蓋寓言耳亦何必有姑射之實乎宜忘言以尋其所況此即肩吾述己昔聞以答連叔之辭者也藐音邈又妙紹反簡文云遠也姑射徐音夜又食亦反李實夜反山名在北海中李楨曰姑射山釋文云在北海中下文姑射在汾水之陽考山海經本有兩姑射東山經盧其之山又南三百八十里曰姑射之山無草木多水又南水行三百里流沙百里曰北姑射之山無草木多水又南三百里曰南姑射之山無草木多水海內北經列姑射在海河洲中姑射國在海中屬列姑射西南山環之列子黃帝篇列姑射在海河洲中與海內北經同下文山上有神人云云大致與莊子同足證音義云姑射在北海中不誤唐殷敬順列子釋文引山海經曰姑射國在海中西南山環之從國南水行百里曰姑射之山又西南行三百八十里曰姑射山郭云河水所經海上也言遙望諸姑射山行列在海河之閒也與今本山海經不同隋書地理志臨汾有姑射山此即東山經之姑射莊子所謂姑射之山汾水之陽是也據秦氏恩復列子補注云臨汾姑射即今平陽府西之九孔山前後左右並無所謂南北姑射者證之殷氏釋文則東山經北姑射南姑射兩條當在海內北經西南山環之之下蓋必有諸姑射環列而後可以列姑射名之也且殷所據山海經為唐時本度古本元如此不知何時脫寫羼入東山經姑射山一條之後遂成今本賴有列子釋文可以正山海經之誤而莊子兩言姑射一在北海一在臨汾亦免混合為一畢氏沅注山海經引莊子誤混為一雖其文並屬寓言而山名所在既皆確有可據要無妨辨證及之耳肌居其反慶藩案冰古凝字肌膚若冰雪即詩所謂膚如凝脂也風俗通義引詩云既白且滑說文冰正字凝俗字爾雅冰脂也孫炎本作凝冰脂以滑白言冰雪以潔白言也淖郭昌略反又徒學反字林丈卓反蘇林漢書音火也約如字李云淖約柔弱貌司馬云好貌處子在室女也黃屋車蓋以黃為裹一云冕裹黃也玉璽音徙纓字或作嬰紱方物反字或作紼盧文弨曰今注本作纓紼案說文紼亂系也此纓紼當作嬰拂解不當以為冠紱紱亦俗字說文本作巿重文作韍憔悴在遙反下在醉反至至者本亦作至足者王德于況反本亦作至絶垠音銀又五根反本又作限俱食五穀而獨為神人明神人者非五穀所為而特稟自然之妙氣五穀者黍稷麻菽麥也言神聖之人降生應物挺淳粹之精靈稟陰陽之秀氣雖順物以資待非五穀之所為託風露以清虛豈四時之能變也吸許及反智照靈通無心順物故曰乘雲氣不疾而速變現無常故曰御飛龍寄生萬物之上而神超六合之表故曰遊乎四海之外也夫體神居靈而窮理極妙者雖靜默閒堂之裏而玄同四海之表故乘兩儀而御六氣同人群而驅萬物苟無物而不順則浮雲斯乘矣無形而不載則飛龍斯御矣遺身而自得雖淡然而不待坐忘行忘忘而為之故行若曳枯木止若聚死灰是以云其神凝也其神凝則不凝者自得矣世皆齊其所見而斷之豈嘗信此哉凝靜也疵癘疾病也五穀熟謂有年也聖人形同枯木心若死灰本跡一時動寂俱妙凝照潛通虛懷利物遂使四時順序五穀豐登人無災害物無夭枉聖人之處世有此功能肩吾未悟至言謂為狂而不信神凝魚升反疵在斯反病也司馬云毀也一音子爾反癘音厲李音賴惡病也本或作厲狂求匡反李云癡也李又九況反閒音間淡然徒暫反恬靜也皆齊才細反又如字而斷丁亂反淖字依釋文及世德堂本改世德堂本紱作紼連叔曰然瞽者無以與乎文章之觀聾者無以與乎鐘鼓之聲豈唯形骸有聾盲哉夫知亦有之是其言也猶時女也之人也之德也將旁礡萬物以為一世蘄乎亂孰弊弊焉以天下為事之人也物莫之傷大浸稽天而不溺大旱金石流土山焦而不熱是其塵垢將猶陶鑄堯舜者也孰肯以物為事宋人資章甫而適諸越越人斷髮文身無所用之堯治天下之民平海內之政往見四子藐姑射之山汾水之陽窅然喪其天下焉不知至言之極妙而以為狂而不信此知之聾盲也瞽者謂眼無眹縫冥冥如鼓皮也聾者耳病也盲者眼根敗也夫目視耳聽蓋有物之常情也既瞽既聾不可示之以聲色也亦猶至言妙道唯懸解者能知愚惑之徒終身未悟良由智障盲暗不能照察豈唯形質獨有之耶是以聞接輿之言謂為狂而不信自此以下是連叔答肩吾之辭也瞽音古盲者無目如鼓皮也與乎徐音豫下同之觀古亂反聾鹿工反不聞也之聲崔向司馬本此下更有眇者無以與乎眉目之好夫刖者不自為假文屨夫知音智注知之同謂此接輿之所言者自然為物所求但知之聾盲者謂無此理是者指斥之言也時女少年處室之女也指此接輿之言猶如窈窕之女綽約凝潔為君子所求但知之聾盲者謂無此理也時女司馬云猶處女也向云時女虛靜柔順和而不喧未嘗求人而為人所求也慶藩案時是也猶時女也謂猶是女也猶時二字連讀易女子貞不字女即處女也司馬訓時女猶處女疑誤詩大雅綿篇曰止曰時箋曰時是也是其證夫聖人之心極兩儀之至會窮萬物之妙數故能體化合變無往不可旁礡萬物無物不然世以亂故求我我無心也我苟無心亦何為不應世哉然則體玄而極妙者其所以會通萬物之性而陶鑄天下之化以成堯舜之名者常以不為為之耳孰弊弊焉勞神苦思以事為事然後能乎之是語助亦歎美也旁礡猶混同也蘄求也孰誰也之人者歎堯是聖人之德者歎堯之盛德也言聖人德合二儀道齊群品混同萬物制馭百靈世道荒淫蒼生離亂故求大聖君臨安撫而虛舟懸鏡應感無心誰肯勞形弊智經營區宇以事為事然後能事故老子云為無為事無事又云取天下常以無事及其有事不足以取天下也旁薄剛反李鋪剛反字又作磅同礡薄博反李普各反司馬云旁礡猶混同也李楨曰漢司馬相如傳旁魄四塞注旁魄廣被也魄與礡通揚雄傳旁薄群生注旁薄猶言蕩薄也蕩薄即廣被之意旁礡萬物承上之德也三字言其德將廣被萬物以為一世蘄乎亂亂治也猶虞書亂而敬之亂舉世望治德握其符神人無功豈肯有勞天下之跡老子云我無為而民自化此之謂也世蘄徐音祈李云求也盧文弨曰舊蘄作鄿訛今從宋本正弊弊李扶世反徐扶計反簡文云弊弊經營貌司馬本作蔽蔽不應應對之應苦思息嗣反夫安於所傷則傷不能傷傷不能傷而物亦不傷之也無往而不安則所在皆適死生無變於己況溺熱之間哉故至人之不嬰乎禍難非避之也推理直前而自然與吉會稽至也夫達於生死則無死無生宜於水火則不溺不熱假令陽九流金之災百六滔天之禍紛紜自彼於我何為故郭注云死生無變於己何況溺熱之間也哉大浸子鴆反稽天音雞徐李音啓司馬云至也不溺奴歷反或奴學反禍難乃旦反非辟音避堯舜者世事之名耳為名者非名也故夫堯舜者豈直堯舜而已哉必有神人之實焉今所稱堯舜者徒名其塵垢耳散為塵膩為垢穀不熟為秕穀皮曰糠皆猥物也鎔金曰鑄範土曰陶諡法翼善傳聖曰堯仁聖盛明曰舜夫堯至妙絶形名混跡同塵物甘其德故立名諡以彰聖體然名者粗法不異秕糠諡者世事何殊塵垢既而矯諂佞妄將彼塵垢鍛鑄為堯用此秕糠埏埴作舜豈知妙體胡可言邪是以誰肯以物為事者也塵垢古口反塵垢猶染污本又作秕徐甫姊反又悲矣反盧文弨曰案說文作秕字亦作糠音康秕糠猶煩碎盧文弨曰舊本糠作康今依注本改糠亦俗字似當云音康字亦作康為是疑後人亂之而又妄改也康已從米何必又贅米旁陶徒刀反李移昭反本亦作鋾音同鑄之樹反此起譬也資貨也越國逼近江湖斷髮文身以避蛟龍之難也章甫冠名也故孔子生於魯衣縫掖長於宋冠章甫而宋實微子之裔越乃太伯之苗二國貿遷往來乃以章甫為貨且章甫本充首飾必須雲鬟承冠越人斷髮文身資貨便成無用亦如榮華本猶滯著富貴起自驕矜堯既體道洞忘故能無用天下故郭注云夫堯之無所用天下為亦猶越人無所用章甫耳宋人宋今梁國睢陽縣殷後微子所封資章甫李云資貨也章甫殷冠也以冠為貨越今會稽山陰縣慶藩案文選張景陽雜詩注引司馬云資取也章甫冠名也嵇叔夜與山巨源絶交書注引同諸於也釋文闕李楨曰諸越猶云於越春秋定五年經於越入吳杜注於發聲也公羊傳於越者未能以其名通也何休注越人自名於越此作諸者廣雅釋言諸於也禮記射義注諸猶於也是疊韻假借斷丁管反李徒短反司馬本作敦云敦斷也夫堯之無用天下為亦猶越人之無所用章甫耳然遺天下者固天下之所宗天下雖宗堯而堯未嘗有天下也故窅然喪之而嘗遊心於絶冥之境雖寄坐萬物之上而未始不逍遙也四子者蓋寄言以明堯之不一於堯耳夫堯實冥矣其跡則堯也自跡觀冥內外異域未足怪也世徒見堯之為堯豈識其冥哉故將求四子於海外而據堯於所見因謂與物同波者失其所以逍遙也然未知至遠之順者更近而至高之所會者反下也若乃厲然以獨高為至而不夷乎俗纍斯山谷之士非無待者也奚足以語至極而遊無窮哉治言緝理政言風教此合喻也汾水出自太原西入於河水北曰陽則今之晉州平陽縣在汾水北昔堯都也窅然者寂寥是深遠之名喪之言忘是遣蕩之義而四子者四德也一本二跡三非本非跡四非非本跡也言堯反照心源洞見道境超茲四句故言往見四子也夫聖人無心有感斯應故能緝理萬邦和平九土雖復凝神四子端拱而坐汾陽統御萬機窅然而喪天下斯蓋即本即跡即體即用空有雙照動寂一時是以姑射不異汾陽山林豈殊黃屋世人齊其所見曷嘗信此邪而馬彪將四子為齧缺便未達於遠理劉璋推汾水於射山更迷惑於近事今所解釋稍異於斯故郭注云四子者蓋寄言明堯之不一於堯耳世徒見堯之跡豈識其哉四子司馬李云王倪齧缺被衣許由汾水徐扶云反郭方聞反案汾水出太原今莊生寓言也司馬崔本作盆水李楨曰東山經之姑射是否為冀州域內之山經文究無可考隋志以屬之臨汾或後世據此篇汾水之陽一語以名其地之山亦未可知上文所稱姑射遠在北海中故曰藐藐者遠也汾陽堯所居若有姑射何為亦云藐哉蓋堯之心未嘗有天下其心即姑射神人之心其身亦如姑射神人之身雖垂衣廟堂如逍遙海外是以彼山藐遠無殊近在帝都四子本無其人徵名以實之則鑿矣注疏推闡並極精妙余前辨證一條謂山名不可混合為一然恐有失莊生玄旨故復論及之汾水司馬崔本並作盆水古讀汾如盆非別一水說見錢氏大昕養新録窅然徐烏了反郭武駢反李云窅然猶悵然盧文弨曰郭必以為四字故如此音喪其息浪反注同絶冥亡丁反之竟音境本亦作境盧文弨曰今注作境闕誤引天台山方瀛觀古藏本盲作瞽所字依宋本改冥字依注文改填字依抱經堂原本改按原刻本似亦有誤說文填塞也從穴真聲徐待年切即今填字武駢與待年同韻異攝殆非其字以填然狀喪天下語亦不倫疑郭本作冥釋文郭下脫作冥二字冥字古與瞑眠通列禦寇篇而甘冥乎無何有之鄉釋文云本又作瞑音眠俞樾謂淮南子俶真篇甘瞑乎溷澖之域即本此甘瞑即甘眠說文瞑翕目也從目冥冥亦聲徐鉉曰今俗別作眠非是武延切漢書揚雄傳目冥眴而無見冥眴即孟子滕文公之瞑眩並韻連詞又作眩眠或眩湣如史記司馬相如傳視眩眠而無見兮及紅杳渺而眩湣兮皆是諸字並義近音同陸冥武駢切與徐瞑武延切而漢書顏注冥莫見反孫奭孟子音義瞑莫甸切史記索隱引蘇林湣音韻攝皆同古無輕脣音武莫聲同惟平仄異耳冥與窅義亦相通故常連用逍遙遊篇北冥有魚釋文引簡文云窅冥無極故謂之冥是也二字又形近故今本作窅郭本作冥郭於此注連用四冥字皆就冥然立言足為的證上句故窅然喪之之窅疑本亦作冥後人依今本正文改之耳惠子謂莊子曰魏王貽我大瓠之種我樹之成而實五石以盛水漿其堅不能自舉也剖之以為瓢則瓠落無所容非不呺然大也吾為其無用而掊之姓惠名施宋人也為梁國相謂語也貽遺也瓠匏之類也魏王即梁惠王也昔居安邑國號為魏後為強秦所逼徙於大梁復改為梁僭號稱王也惠子所以起此大匏之譬以譏莊子之書雖復詞旨恢弘而不切機務故致此詞而更相激發者也惠子司馬云姓惠名施為梁相魏王司馬云梁惠王也案魏自河東遷大梁故謂之魏或謂之梁也貽徐音怡郭與志反遺也大瓠徐音護之種章勇反樹者藝植之謂也實者子也惠施既得瓠種藝之成就生子甚大容受五石仍持此瓠以盛水漿虛脆不堅故不能自勝舉也而實五石司馬云實中容五石以盛音成剖分割之也瓢勺也瓠落平淺也呺然虛大也掊打破也用而盛水虛脆不能自勝分剖為瓢平淺不容多物衆謂無用打破棄之刺莊子之言不救時要有同此應須屏削也剖之普口反為瓢毗遙反徐扶堯反則瓠戶郭反司馬音護下同落簡文云瓠落猶廓落也司馬云瓠布護也落零落也言其形平而淺受水則零落而不容也呺然本亦作徐許憍反李云然虛大貌崔作簡文同吾為于僞反掊之徐方垢反司馬云擊破也慶藩案文選謝靈運之郡初發都詩注引司馬云瓠布護落零落也枵然大貌掊謂擊破之也喻莊子之言大也若巨瓠之無施也較釋文引為詳俞樾曰說文痛聲也呺說文所無蓋皆之俗體施之於此義不可通文選謝靈運初發都詩李善注引此文作枵當從之爾雅釋天玄枵虛也虛則有大義故曰枵然大也釋文引李云然虛大貌是固以枵字之義說之莊子曰夫子固拙於用大矣宋人有善為不龜手之藥者世世以洴澼絖為事客聞之請買其方百金聚族而謀曰我世世為洴澼絖不過數金今一朝而鬻技百金請與之客得之以說吳王越有難吳王使之將冬與越人水戰大敗越人裂地而封之能不龜手一也或以封或不免於洴澼絖則所用之異也今子有五石之瓠何不慮以為大樽而浮乎江湖而憂其瓠落無所容則夫子猶有蓬之心也夫其藥能令手不拘坼故常漂絮於水中也洴浮澼漂也絖絮也世世年也宋人隆冬涉水漂絮以作牽離手指生瘡拘坼有同龜背故世世相承家傳此藥令其手不拘坼常得漂絮水中保斯事業永無虧替又云澼劈也絖也謂劈於水中之故也龜手愧悲反徐舉倫反李居危反向云拘坼也司馬云文坼如龜文也又云如龜攣縮也俞樾曰釋文引司馬云文坼如龜文也又云如龜攣縮也義皆未安向云如拘坼也郭注亦云能令手不拘坼然則龜字宜即讀如拘蓋龜有丘音後漢西域傳龜茲讀曰丘慈是也古丘音與區同故亦得讀如拘矣拘拘攣也不龜者不拘攣也龜文之說雖非攣縮之說則是但不必以如龜為說耳李楨曰龜手釋文云徐舉倫反蓋以龜為皸之假借按龜皸雙聲衆經音義卷十一皸居雲去雲二反通俗文手足坼裂曰皸經文或作龜坼下引莊此文及郭注為證是玄應以龜皸音義互通集韻十八諄皸區倫切皴也漢書趙充國傳將軍士寒手足皸瘃文穎曰皸坼裂也瘃寒創也唐書李甘傳凍膚皸瘃不龜手猶言不皸手耳皸說文作鈕氏樹玉鄭氏珍以韗下或體為皸字不足據洴徐扶經反澼普歷反徐敷歷反郭李恪歷反澼聲盧文弨曰案今本書作澼聲疑洴澼是擊絮之聲洴澼二字本雙聲蓋亦象其聲也絖音曠小爾雅云絮細者謂之絖李云洴澼絖者漂絮於水上絖絮也能令力呈反不拘紀于反依字宜作紀于求于二反周書云天寒足是也坼敕白反盧文弨曰坼俗本多從手非漂匹妙反韋昭云以水擊絮為漂說文作潎豐市反又匹例反盧文弨曰潎舊訛作敝今改正絮胥慮反金方一寸重一斤為一金也他國遊客偶爾聞之請買手瘡一術遂費百金之價者也百金李云金方寸重一斤為一金百金百斤也鬻賣也估價既高聚族謀議世世洴澼為利蓋寡一朝賣術資貨極多異口同音僉曰請與數金色主反鬻音育司馬云賣也技本或作伎竭彼反吳越比鄰地帶江海兵戈相接必用艫船戰士隆冬手多拘坼而客素稟雄才天生睿智既得方術遂說吳王越國兵難侵吳吳王使為將帥賴此名藥而兵手不拘坼旌旗才舉越人亂轍獲此大捷獻凱而旋勳庸克著胙之茆土以說始鋭反又如字有難乃旦反之將子匠反大敗必邁反或不定也方藥無工拙而用者有殊故行客得之以封侯宋人用之以洴澼此則所用工拙之異蓬非直達者也此章言物各有宜苟得其宜安往而不逍遙也慮者繩絡之也樽者漆之如酒以繩結縛用渡江湖南人所謂腰舟者也蓬草名拳曲不直也夫歎也言大瓠浮泛江湖可以舟船淪溺至教興行世境可以濟渡群迷而惠生既有蓬心未能直達玄理故妄起掊擊之譬譏刺莊子之書為用失宜深可歎之不慮以為大樽本亦作尊司馬云樽如酒器縛之於身浮於江湖可以自渡慮猶結綴也案所謂腰舟盧文弨曰縳舊作縛今從宋本正蓬之心郭云蓬生非直達者向云蓬者短不暢曲士之謂盧文弨曰士舊訛土今改正闕誤引江南古藏本方下有以字龜字依諸子平議補拙字依下文補按盧說非是說文縛束也縳白鮮色也段注改色為卮云聲類以為今正絹字據許則縳與絹各物若羽人十摶為縳左傳縳一如瑱又皆卷縛之義非字之本義朱珔假借義證謂縛與縳音隔疑以形近而誤其說是也是束縛字正當作縛宋本誤惠子謂莊子曰吾有大樹人謂之樗其大本擁腫而不中繩墨其小枝卷曲而不中規矩立之塗匠者不顧今子之言大而無用衆所同去也樗栲漆之類嗅之甚臭惡木者也世間名字例皆虛假相與嗅之未知的當故言人謂之樗也樗敕魚反木名擁腫槃癭也卷曲不端直也規圓而矩方塗道也樗栲之樹不材之木根本擁腫枝幹攣卷繩墨不加方圓無取立之行路之旁匠人曾不顧盼也擁腫章勇反李云擁腫猶盤癭不中丁仲反下同卷曲本又作拳同音權徐紀阮反李丘圓反樹既擁腫不材匠人不顧言迂誕無用衆所不歸此合喻者也同去如字李羌呂反慶藩案大而無用猶言迂遠無當於事情也禮文王世子況于其身以善其君乎鄭注曰于讀為迂猶廣也大也是大與迂同義老子道德經云天下皆謂道大似不肖亦此大字之義莊子曰子獨不見狸狌乎卑身而伏以候敖者東西跳梁不辟高下中於機辟死於罔罟今夫斄牛其大若垂天之雲此能為大矣而不能執鼠今子有大樹患其無用何不樹之於無何有之鄉廣莫之野倣徨乎無為其側逍遙乎寢臥其下不夭斤斧物無害者無所可用安所困苦哉狌野貓也跳梁猶走躑也辟法也謂機關之類也罔罟罝罘也子獨不見狸狌捕鼠之狀乎卑伏其身伺候傲慢之鼠東西跳躑不避高下之地而中於機關之法身死罔罟之中皆以利惑其小不謀大故也亦猶擎跪曲拳執持聖跡僞情矯性以要時利前雖遂意後必危亡而商鞅蘇張即是其事此何異乎捕鼠狸狌死於罔罟也狸力之反狌徐音姓郭音生又音星司馬云也音由救反敖者徐李五到反支云伺彼怠敖謂承夫閒殆也本又作傲同司馬音遨謂伺遨翔之物而食之雞鼠之屬也跳音條不辟音避今本多作避下放此機辟毗赤反司馬云罔也盧文弨曰案當作毗亦反慶藩案辟疑為繴之借字爾雅繴謂之罿罿罬也罬謂之罦罦覆車也郭璞曰今之翻車也有兩轅中施罥以捕鳥司馬曰辟罔也誤辟若訓罔則下文死於罔罟為贅矣楚辭九章設張辟以娛君兮王逸注辟法也言讒人設張峻法以娛樂君王念孫曰楚辭九章以張辟連讀非以設張連讀張讀弧張之張周官冥氏掌弧張鄭注弧張罿罦之屬所以扃絹禽獸頗費解義墨子非儒篇盜賊將作若機辟將發也鹽鐵論刑法篇曰辟陷設而當其蹊皆當作繴楚辭哀時命外迫脅於機臂兮機臂與機辟同玉篇王注以為弩身亦失之罟徐音古斄牛猶旄牛也出西南夷其形甚大山中遠望如天際之雲藪澤之中逍遙養性跳梁投鼠不及野狸亦猶莊子之言不狎流俗可以理國治身且長且久者也斄牛郭呂之反徐李音來又音離司馬云旄牛無何有猶無有也莫無也謂寬曠無人之處不問何物悉皆無有故曰無何有之鄉也無何有之鄉廣莫之野謂寂絶無為之地也簡文云莫大也倣徨縱任之名逍遙自得之稱亦是異言一致互其文耳不材之木枝葉茂盛婆娑蔭映蔽日來風故行李經過徘徊憩息徙倚顧步寢臥其下亦猶莊子之言無為虛淡可以逍遙適性蔭庇蒼生也倣薄剛反又音房徨音皇倣徨猶翱翔也崔本作方羊簡文同廣雅云倣徉徙倚也夫小大之物苟失其極則利害之理均用得其所則物皆逍遙也擁腫不材拳曲無取匠人不顧斤斧無加夭折之災何從而至故得終其天年盡其生理無用之用何所困苦哉亦猶莊子之言乖俗會道可以攝衛可以全真既不夭枉於世途詎肯困苦於生分也闕誤引文本困苦作窮困世德堂本閒作隕
