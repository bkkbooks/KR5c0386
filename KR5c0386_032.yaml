body:
  text: 雜篇盜跖第二十九以人名篇孔子與柳下季為友柳下季之弟名曰盜跖盜跖從卒九千人橫行天下侵暴諸侯穴室樞戶驅人牛馬取人婦女貪得忘親不顧父母兄弟不祭先祖所過之邑大國守城小國入保萬民苦之姓展名禽字季食采柳下故謂之柳下季亦言居柳樹之下故以為號展禽是魯莊公時孔子相去百餘歲而言友者蓋寓言也跖者禽之弟名也常為巨盜故名盜跖穿穴屋室解脫門樞而取人牛馬也亦有作空字驅字者保小城也為害既巨故百姓困之孔子與柳下季為友柳下惠姓展名獲字季禽一云字子禽居柳下而施德惠一云惠諡也一云柳下邑名案左傳云展禽是魯僖公時人至孔子生八十餘年若至子路之死百五六十歲不得為友是寄言也盜跖之石反李奇注漢書云跖秦之大盜也俞樾曰史記伯夷傳正義又云跖者黃帝時大盜之名是跖之為何時人竟無定說孔子與柳下惠不同時柳下惠與盜跖亦不同時讀者勿以寓言為實也從才用反卒尊忽反下同樞戶尺朱反徐苦溝反司馬云破人戶樞而取物也入保鄭注禮記曰小城曰保闕誤引劉得一本樞作摳孔子謂柳下季曰夫為人父者必能詔其子為人兄者必能教其弟若父不能詔其子兄不能教其弟則無貴父子兄弟之親矣今先生世之才士也弟為盜跖為天下害而弗能教也丘竊為先生羞之丘請為先生往說之柳下季曰先生言為人父者必能詔其子為人兄者必能教其弟若子不聽父之詔弟不受兄之教雖今先生之辨將奈之何哉且跖之為人也心如涌泉意如飄風強足以距敵辨足以飾非順其心則喜逆其心則怒易辱人以言先生必無往孔子不聽顏回為馭子貢為右往見盜跖盜跖乃方休卒徒大山之陽膾人肝而餔之孔子下車而前見謁者曰魯人孔丘聞將軍高義敬再拜謁者餔食也子貢驂乘在車之右也能詔如字教也竊為于僞反下請為為我竊為使為皆同說之始鋭反飄風婢遙反徐扶遙反易辱以豉反大山音太膾古外反餔布吳反徐甫吳反字林云日申時食也世德堂本距作拒闕誤引江南古藏本徒下有於字趙諫議本大作太闕誤同謁者入通盜跖聞之大怒目如明星髮上指冠曰此夫魯國之巧僞人孔丘非邪為我告之爾作言造語妄稱文武冠枝木之冠帶死牛之脅多辭繆說不耕而食不織而衣搖脣鼓舌擅生是非以迷天下之主使天下學士不反其本妄作孝弟而僥幸於封侯富貴者也子之罪大極重疾走歸不然我將以子肝益晝餔之膳言孔子憲章文武祖述堯舜刊定禮樂遺跡將來也髮上時掌反此夫音符又如字脅肋也言尼父所戴冕浮華雕飾華葉繁茂有類樹枝又將牛皮用為革帶既闊且堅又如牛肋也冠古亂反枝木之冠如字司馬云冠多華飾如木之枝繁帶死牛之脅許劫反司馬云取牛皮為大革帶僥幸冀望也夫作孝弟序人倫意在乎富貴封侯者也故歷聘不已接輿有鳳兮之譏棄本滯跡師金致芻狗之誚也繆說音謬孝弟音悌本亦作悌而僥古堯反俞樾曰極當作殛爾雅釋言殛誅也言罪大而誅重也極殛古字通書洪範篇鯀則殛死多士篇大罰殛之僖二十八年左傳明神殛之昭七年傳昔堯殛鯀於羽山釋文並曰殛本作極趙諫議本弟作悌趙本餔作脯孔子復通曰丘得幸於季願望履幕下言丘幸其得與賢兄朋友不敢正睹儀容願履帳幕之下亦有作綦字者綦履跡也願履綦跡猶看足下復通扶又反下同願望履幕下司馬本幕作綦云言視不敢望跖面望履結而還也趙諫議本幸下有然字謁者復通盜跖曰使來前孔子趨而進避席反走再拜盜跖盜跖大怒兩展其足案劍瞋目聲如乳虎曰丘來前若所言順吾意則生逆吾心則死趨疾行也反走卻退兩展其足伸兩腳也反走小卻行也慶藩案文選謝靈運從斤澗越嶺溪行注引司馬云展申也釋文闕瞋赤真反徐赤夷反廣雅云張也如乳如樹反孔子曰丘聞之凡天下有三德生而長大美好無雙少長貴賤見而皆說之此上德也知維天地能辨諸物此中德也勇悍果敢聚衆率兵此下德也凡人有此一德者足以南面稱孤矣今將軍兼此三者身長八尺二寸面目有光脣如激丹齒如齊貝音中黃鍾而名曰盜跖丘竊為將軍恥不取焉將軍有意聽臣臣請南使吳越北使齊魯東使宋衛西使晉楚使為將軍造大城數百里立數十萬戶之邑尊將軍為諸侯與天下更始罷兵休卒收養昆弟共祭先祖此聖人才士之行而天下之願也激明也貝珠也黃鍾六律聲也少長詩召反下丁丈反皆說音悅下同知維音智勇悍戶旦反激丹古歷反司馬云明也齊貝一本作含貝音中丁仲反南使所吏反下三字同數百所主反下同罷兵如字徐扶彼反共祭音恭之行下孟反下同張君房本有人字盜跖大怒曰丘來前夫可規以利而可諫以言者皆愚陋恆民之謂耳今長大美好人見而悅之者此吾父母之遺德也丘雖不吾譽吾獨不自知邪且吾聞之好面譽人者亦好背而毀之今丘告我以大城衆民是欲規我以利而恆民畜我也安可久長也城之大者莫大乎天下矣堯舜有天下子孫無置錐之地湯武立為天子而後世絶滅非以其利大故邪言大城衆民不可長久也恆民一本作順民後亦爾吾譽音餘下同好面呼報反下同背音佩下同堯讓舜不授丹朱舜讓禹而商均不嗣故無置錐之地也殷湯周武總統萬機後世子孫咸遭篡弒豈非四海利重所以致之且吾聞之古者禽獸多而人少於是民皆巢居以避之晝拾橡栗暮栖木上故命之曰有巢氏之民古者民不知衣服夏多積薪冬則煬之故命之曰知生之民神農之世臥則居居起則于于民知其母不知其父與麋鹿共處耕而食織而衣無有相害之心此至德之隆也然而黃帝不能致德與蚩尤戰於涿鹿之野流血百里堯舜作立群臣湯放其主武王殺紂自是之後以強陵弱以衆暴寡湯武以來皆亂人之徒也居居安靜之容于于自得之貌橡音象煬羊亮反慶藩案于于廣大之意也方言于大也禮文王世子于其身以善其君鄭注曰于讀為迂迂猶廣也大也檀弓于則于正義亦訓于為廣大于于重言也至致也蚩尤諸侯也涿鹿地名今幽州涿郡是也蚩尤造五兵與黃帝戰故流血百里也蚩尤神農時諸侯始造兵者也神農之後第八帝曰榆罔世蚩尤氏強與榆罔爭王逐榆罔榆罔與黃帝合謀擊殺蚩尤漢書音義云蚩尤古之天子一曰庶人貪者涿鹿音卓本又作濁司馬云涿鹿地名故城今在上谷郡西南八十里置百官也放桀於南巢也朝歌之戰武王殺音試下同征伐篡弒湯武最甚今子修文武之道掌天下之辨以教後世縫衣淺帶矯言僞行以迷惑天下之主而欲求富貴焉盜莫大於子天下何故不謂子為盜丘而乃謂我為盜跖孔子憲章文武辨說仁義為後世之教也制縫掖之衣淺薄之帶矯飾言行誑惑諸侯其為賊害甚於盜跖摓衣本又作縫扶恭反徐扶公反又音馮盧文弨曰今書作縫衣慶藩案摓衣淺帶向秀注曰儒服寬而長大見列子黃帝篇注釋文摓又作縫縫衣大衣也或作逢書洪範子孫其逢吉馬注曰逢大也禮儒行逢掖之衣鄭注逢猶大也荀子非十二子篇其衣逢儒效篇逢衣淺帶楊注並曰逢大也亦省作墨子公孟篇衣博袍博皆大也集韻縫或省作漢丹陽太守郭旻碑彌袞口即縫字淺帶縫帶使淺狹矯言紀表反子以甘辭說子路而使從之使子路去其危冠解其長劍而受教於子天下皆曰孔丘能止暴禁非其卒之也子路欲殺衛君而事不成身菹於衛東門之上是子教之不至也高危之冠長大之劍勇者之服也既伏膺孔氏故解去之說子路始鋭反又如字去其起呂反危冠李云危高也子路好勇冠似雄雞形背負豭用表己強也盧文弨曰今書音義作豭斗案史記作佩豭豚仲由疾惡情深殺衛君蒯瞶事既不逮身遭菹醯盜跖故以此相譏也其卒子恤反身菹莊居反斗字依世德堂本及釋文考證改子自謂才士聖人邪則再逐於魯削跡於衛窮於齊圍於陳蔡不容身於天下子教子路菹此患上無以為身下無以為人子之道豈足貴邪世之所高莫若黃帝黃帝尚不能全德而戰涿鹿之野流血百里堯不慈舜不孝禹偏枯湯放其主武王伐紂文王拘羑里此六子者世之所高也孰論之皆以利惑其真而強反其情性其行乃甚可羞也謂不與丹朱天下以為于僞反下同堯不慈不授子也為父所疾也治水勤勞風櫛雨沐致偏枯之疾半身不遂也羑里殷獄名文王遭紂之難於囹圄凡經七年方得免脫文王拘羑里紂之二十年囚文王六子者謂黃帝堯舜禹湯文王也皆以利於萬乘是以迷於真道而不反於自然故可恥也而強其丈反可羞如字本又作惡烏路反闕誤引江南古藏本六作七世之所謂賢士伯夷叔齊伯夷叔齊辭孤竹之君而餓死於首陽之山骨肉不葬鮑焦飾行非世抱木而死申徒狄諫而不聽負石自投於河為魚所食介子推至忠也自割其股以食文公文公後背之子推怒而去抱木而燔死尾生與女子期於梁下女子不來水至不去抱梁柱而死此六子者無異於磔犬流豕操瓢而乞者皆離名輕死不念本養壽命者也二人窮死首山復無子胤收葬也姓鮑名焦周時隱者也飾行非世廉潔自守荷擔採樵拾橡充食故無子胤不臣天子不友諸侯子貢遇之謂之曰吾聞非其政者不履其地汙其君者不受其利今子履其地食其利其可乎鮑焦曰吾聞廉士重進而輕退賢人易愧而輕死遂抱木立枯焉申徒自沈前篇已釋諫而不聽未詳所據崔嘉雖解無的諫辭負石自投於河申徒狄將投於河崔嘉止之曰吾聞聖人仁士民父母若濡足故不救溺人可乎申徒狄曰不然昔桀殺龍逢紂殺比干而亡天下吳殺子胥陳殺泄治而滅其國非聖人不仁不用故也遂沈河而死晉文公重耳也遭驪姬之難出奔他國在路困乏推割股肉以飴之公後還三日封於從者遂忘子推子推作龍蛇之歌書其營門怒而逃公後慚謝追子推於介山子推隱避公因放火燒山庶其走出火至子推遂抱樹而焚死焉以食音嗣燔死音煩燒也慶藩案左傳介之推不言祿祿亦弗及又曰晉侯求之不得以綿上為之田曰以志吾過且旌善人呂覽曰介推負釜蓋簦終身不見史記曰使人召之則亡聞其入綿上山中於是環綿上之山中而封之以為介推田號曰介山遍查經傳并無介推燔死之事自屈子為立枯之說楚辭九章惜往日介子推而立枯兮莊生有燔死之文容齊三筆云始自新序非也而東方朔七諫漢書丙吉傳皆承其誤今當以左傳呂覽正之六子者謂伯夷叔齊鮑焦申徒介推尾生言此六人不合玄道矯情飾行苟異俗中用此聲名傳之後世亦何異乎張磔死狗流在水中貧病之人操瓢乞告此閒人物不許見聞六子之行事同於此皆為重名輕死不念歸本養生壽盡天命者也豕字有作死字者乞字有作走字者隨字讀之豕豬也尾生一本作微生戰國策作尾生高高誘以為魯人磔竹客反廣雅云張也操七曹反瓢婢遙反而乞者李云言上四人不得其死猶豬狗乞兒流轉溝中者也乞或作走離名力智反念本本或作卒世德堂本伯夷叔齊四字不重闕誤六作四引江南古藏本云四作六闕誤引張君房本離作利世之所謂忠臣者莫若王子比干伍子胥子胥沈江比干剖心此二子者世謂忠臣也然卒為天下笑自上觀之至于子胥比干皆不足貴也為達道者之所嗤也剖心普口反丘之所以說我者若告我以鬼事則我不能知也若告我以人事者不過此矣皆吾所聞知也今吾告子以人之情目欲視色耳欲聽聲口欲察味志氣欲盈人上壽百歲中壽八十下壽六十除病瘦死喪憂患其中開口而笑者一月之中不過四五日而已矣天與地無窮人死者有時操有時之具而託於無窮之閒忽然無異騏驥之馳過隙也不能說其志意養其壽命者皆非通道者也丘之所言皆吾之所棄也亟去走歸無復言之子之道狂狂汲汲詐巧虛僞事也非可以全真也奚足論哉夫目視耳聽口察志盈率性而動稟之造物豈矯情而為之哉分內為之道在其中矣以說如字又始鋭反夫天長地久窮境稍賒人之死生時限迫促以有限之身寄無窮之境何異乎騏驥馳走過隙穴也上壽音受又如字下同瘦色又反王念孫曰釋文瘦色又反案瘦當為瘐字之誤也瘐亦病也病瘐為一類死喪為一類憂患為一類瘐字本作愈爾雅曰愈病也小雅正月篇胡俾我愈毛傳與爾雅同漢書宣帝紀今繫者或以掠辜若飢寒瘐死獄中蘇林曰瘐病也囚徒病律名為瘐師古曰瘐音庾字或作愈王子侯表曰富侯龍下獄庾瘐死亟急也狂狂失性也伋伋不足也夫聖跡之道仁義之行譬彼蘧廬方茲芻狗執而不遣惟增其弊狂狂失真伋伋不足虛僞之事何足論哉能說音悅亟去紀力反急也本或作極無復扶又反狂狂如字又九況反汲汲本亦作伋音急又音及詐巧苦孝反又如字趙諫議本作伋伋瘐字依漢書改孔子再拜趨走出門上車執轡三失目芒然無見色若死灰據軾低頭不能出氣歸到魯東門外適遇柳下季柳下季曰今者闕然數日不見車馬有行色得微往見跖邪軾車前橫木憑之而坐者也盜跖英雄盛談物理孔子懾懼遂至於斯微無也上車時掌反三失息暫反又如字芒然莫剛反有行如字孔子仰天而歎曰然然如此也柳下季曰跖得無逆汝意若前乎孔子曰然丘所謂無病而自灸也疾走料虎頭編虎須幾不免虎口哉若前乎者則是篇首柳下云逆其心則怒無乃逆汝意如我前言乎孔子答云實如所言也此篇寄明因衆之所欲亡而亡之雖王紂可去也不因衆而獨用己雖盜跖不可御也幾近也夫料觸虎頭而編虎須者近遭於虎食之也今仲尼往說盜跖履其危險不異於斯也而言此章大意排擯聖跡嗤鄙名利是以排聖跡則訶責堯舜鄙名利則輕忽夷齊故寄孔跖以摸之意也即郭注意失之遠矣自灸久又反疾走料音聊扁虎音鞭又蒲顯反徐扶顯反本或作編音同一本作料頭編虎須盧文弨曰今書作編虎須舊亦作須今從宋本作幾不音祈可去起呂反子張問於滿苟得曰盍不為行無行則不信不信則不任不任則不利故觀之名計之利而義真是也若棄名利反之於心則夫士之為行不可一日不為乎子張孔子弟子也姓顓孫名師字子張行聖跡之人也姓滿名苟得假託為姓名曰苟且貪得以滿其心求利之人也盍何不也何不為仁義之行乎勸其捨求名利也滿苟得人姓名盍胡臘反為行下孟反下注同盍何不也勸何不為德行若不行仁義之行則不被信用不被信用則無職任無職任則無利祿故有行則有名有名則有利觀察計當仁義真是好事宜行之也反乖逆也若棄名利則乖逆我心故士之立身不可一日不行仁義滿苟得曰無恥者富多信者顯夫名利之大者幾在無恥而信故觀之名計之利而信真是也若棄名利反之於心則夫士之為行抱其天乎多信猶多言也夫識廉知讓則貧無恥貪殘則富謙柔靜退則沈多言夸伐則顯故觀名計利而莫先於多言多言則是名利之本也抱守也天自然也夫修道之士立身為行棄擲名利乃乖俗心抱守天真翻合虛玄之道也子張曰昔者桀紂貴為天子富有天下今謂臧聚曰汝行如桀紂則有怍色有不服之心者小人所賤也仲尼墨翟窮為匹夫今謂宰相曰子行如仲尼墨翟則變容易色稱不足者士誠貴也故勢為天子未必貴也窮為匹夫未必賤也貴賤之分在行之美惡桀紂孔墨並釋於前臧謂臧獲也聚謂竊即盜賊小人也以臧獲比子則慚怍而不服以宰相比匹夫則變容而歡慰故知所貴在行不在乎位臧聚司馬云謂臧獲盜濫竊聚之人有怍音昨宰相息亮反下相而同此復釋前義也高山寺本作則作色闕誤引張君房本作則有作色滿苟得曰小盜者拘大盜者為諸侯諸侯之門義士存焉昔者桓公小白殺兄入嫂而管仲為臣田成子常殺君竊國而孔子受幣論則賤之行則下之則是言行之情悖戰於胸中也不亦拂乎故書曰孰惡孰美成者為首不成者為尾悖逆也拂戾也齊桓公名小白殺其兄子糾納其嫂焉管仲賢人臣而輔之卒能九合諸侯一匡天下田成子常殺齊簡公孔子沐浴而朝受其幣帛夫殺兄入嫂弒君竊國人倫之惡莫甚於斯而夷吾為臣尼父受幣言議則以為鄙賤情行則下而事之豈非戰爭於心胸言行相反戾耶入嫂先早反司馬云以嫂為室家為臣臣或作相殺君申志反論則力頓反悖戰布內反亦拂扶弗反成者為首君而事之不成者為尾非而毀之以此而言只論成與不成豈關行無行故不知美惡的在誰也所引之書並遭燒滅今並無本也子張曰子不為行即將疏戚無倫貴賤無義長幼無序五紀六位將何以為別乎戚親也倫理也五紀祖父也身子孫也亦言金木水火土五行也仁義禮智信五德也六位君臣父子夫婦也亦言父母兄弟夫妻子張云若不行仁義之行則親疏無理貴賤無義長幼無次敘五紀六位無可分別也長幼丁丈反五紀司馬云歲日月星辰曆數六位君臣父子夫婦俞樾曰五紀司馬云歲日月星辰曆數然與疏戚貴賤長幼之義不相應殆非也今案五紀即五倫也六位即六紀也白虎通三綱六紀篇曰六紀者謂諸父兄弟族人諸舅師長朋友也此皆所以為疏戚貴賤長幼之別不曰五倫而曰五紀不曰六紀而曰六位古人之語異耳家語入官篇群僕之倫也王肅注曰倫紀也然則倫紀得通稱矣為別彼列反下同滿苟得曰堯殺長子舜流母弟疏戚有倫乎湯放桀武王殺紂貴賤有義乎王季為適周公殺兄長幼有序乎儒者僞辭墨者兼愛五紀六位將有別乎堯廢長子丹朱不與天位言殺也舜封同母弟象於有庳之國令天下吏治其國收納貢稅故言流放也廢子流弟何有親疏之理乎堯殺長子崔云堯殺長子考監明舜流母弟弟謂象也流放也孟子云舜封象於有庳不得有為於其國天子使吏治其國而封納其貢稅焉故謂之放也殷湯放夏桀於南巢周武殺殷紂於汲郡君臣貴賤其義安在王季周大王之庶子季歷即文王之父也太伯仲雍讓位不立故以小兒季歷為適管蔡周公之兄泣而誅之故云殺廢適立庶弟殺其兄尊卑長幼有次序乎為適丁歷反夫儒者多言強為名位墨者兼愛周普無私五紀六位有何分別故字依下文改納其依孟子及世德堂本改兄字依正文改且子正為名我正為利名利之實不順於理不監於道吾日與子訟於無約曰小人殉財君子殉名其所以變其情易其性則異矣乃至於棄其所為而殉其所不為則一也故曰無為小人反殉而天無為君子從天之理若枉若直相而天極面觀四方與時消息若是若非執而圓機獨成而意與道徘徊無轉而行無成而義將失而所為無赴而富無殉而成將棄而天監明也見也子張心之所為正在於名苟得心之所為正在於利且名利二途皆非真實既乖至理豈明見於玄道且子正為名假設之辭也為音于僞反下為利同不監本亦作鑑同訟謂論說也約謂契誓也棄其所為捨己殉其所不為逐物也夫殉利謂之小人殉名謂之君子名利不同所殉一也子張苟得皆共談玄言於無為之理敦於莫逆之契也吾日人實反無約如字徐於妙反而爾也既不逐利又不殉名故能率性歸根合於自然之道也相助也無問枉直順自然之道觀照四方隨四時而消息徘徊猶轉變意也圓機猶環中也執於環中之道以應是非用於獨化之心以成其意故能冥其虛通之理轉變無窮者也所為真性也無轉汝志為聖跡之行無成爾心學仁義之道捨己效他將喪爾真性也王念孫曰無轉而行轉讀為專山木篇云一龍一蛇與時俱化而無肯專為即此所謂無專而行也此承上文與時消息與道徘徊而言言當隨時順道而不可專行仁義若專而行成而義則將失其所為矣故下文云正其言必其行故服其殃離其患也必其行即此所謂專而行也秋水篇無一而行與道參差一亦專也無專而行猶言無一而行也專與轉古字通又通作摶史記吳王濞傳燕王摶胡衆入蕭關索隱曰摶音專謂專統領胡兵也漢書摶作轉莫奔赴於富貴無殉逐於成功必赴必殉則背於天然之性也闕誤引張君房本日作昔比干剖心子胥抉眼忠之禍也直躬證父尾生溺死信之患也鮑子立乾申子不自理廉之害也孔子不見母匡子不見父義之失也此上世之所傳下世之所語以為士者正其言必其行故服其殃離其患也比干忠諫於紂紂云聞聖人之心有九竅遂剖其心而視之子胥忠諫夫差夫差殺之子胥曰吾死後抉眼縣於吳門東以觀越之滅吳也斯皆至忠而遭其禍也抉眼烏穴反躬父盜羊而子證之尾生以女子為期抱梁而死此皆守信而致其患也鮑焦廉貞遭子貢譏之抱樹立乾而死申子晉獻公太子申生也遭麗姬之難枉被讒謗不自申理自縊而死矣鮑子立乾司馬云鮑子名焦周末人汙時君不仕採蔬而食子貢見之謂曰何為不仕食祿答曰無可仕者子貢曰汙時君不食其祿惡其政不踐其土今子惡其君處其土食其蔬何志行之相違乎鮑焦遂棄其蔬而餓死韓詩外傳同又云槁洛水之上也勝子自理一本理作俚本又作申子自埋或云謂申徒狄抱甕之河也一本作申子不自理謂申生也孔子滯耽聖跡歷國應聘其母臨終孔子不見姓匡名章齊人也諫諍其父其父不從被父憎嫌遂游他邑亦耽仁義學讀忘歸其父臨終而章不見此皆滯溺仁義有斯過矣孔子不見母李云未聞匡子不見父司馬云匡子名章齊人諫其父為父所逐終身不見父案此事見孟子盧文弨曰疑父母二字當互易此章言尚行則行矯貴士則士僞故蔑行賤士以全其內然後行高而士貴耳自比干已下匡子已上皆為忠信廉貞而遭其禍斯皆古昔相傳下世語之也是以忠誠之士廉信之人正其言以諫君必其行以事主莫不遭罹其患服從其殃為道之人深宜戒慎也所傳丈專反世德堂本申作勝釋文亦作勝世德堂本子下有不字趙本尚作上無足問於知和曰人卒未有不興名就利者彼富則人歸之歸則下之下則貴之夫見下貴者所以長生安體樂意之道也今子獨無意焉知不足邪意知而力不能行邪故推正不忘邪無足謂貪婪之人不止足者也知和謂體知中和之道守分清廉之人也假設二人以明貪廉之禍福也無足云世人卒竟未有不興起名譽而從就利祿者若財富則人歸湊之歸湊則謙下而尊貴之夫得人謙下尊貴者則說其情適其性體質安而長壽矣子獨無貪富貴之意乎為運知不足不求邪為心意能知力不能行故推於正理志念不忘以遣貪求之心而不取邪無足一本作無知則下遐嫁反下同樂意音洛下同知不音智下知謀同慶藩案意語詞也讀若抑抑意古字通論語學而篇抑與之與漢石經抑作意墨子明鬼篇豈女為之與意鮑為之與皆其證故推正不忘邪忘或作妄言君臣但推尋正道不忘故不用富貴邪為智力不足故不用邪知和曰今夫此人以為與己同時而生同鄉而處者以為夫絶俗過世之士焉是專無主正所以覽古今之時是非之分也與俗化世去至重棄至尊以為其所為也此其所以論長生安體樂意之道不亦遠乎慘怛之疾恬愈之安不監於體怵惕之恐欣歡之喜不監於心知為為而不知所以為是以貴為天子富有天下而不免於患也此人謂富貴之人也俗人謂無知貪利情切與貴人同時而生共富人同鄉而住者猶將己為超絶流俗過越世人況己之自享於富貴乎斯乃專愚之人內心無主不履正道不覺古今之時代不察是非之涯分而與塵俗紛競隨末而遷化者也豈能識禍福之歸趣者哉過世之士焉言人心易動但人與賢人俱生便自謂過於世人況親自為富貴者乎至重生也至尊道也流俗之人捐生背道其所為每事如斯其於長生之道去之遠矣慘怛悲也恬愈樂也夫悲樂喜懼者並身外之事也故不能監明於聖質照入於心靈而愚者妄為之也慘七感反怛丹曷反之恐丘勇反為為者有為也所以為者無為也但知為於有為不知為之所以出自無為也如斯之人雖貴總萬機富贍四海而不免於怵惕等患也無足曰夫富之於人無所不利窮美究藝至人之所不得逮賢人之所不能及俠人之勇力而以為威強秉人之知謀以為明察因人之德以為賢良非享國而嚴若君父且夫聲色滋味權勢之於人心不待學而樂之體不待象而安之夫欲惡避就固不待師此人之性也天下雖非我孰能辭之窮盡也夫能窮天下善美盡人間威勢者其惟富貴乎故至德之人賢哲之士亦不能遠及也窮美窮猶盡也究藝音勢本亦作勢一音藝究竟也夫富貴之人人多依附故勇者為之捍智者為之謀德者為之助雖不臨享邦國而威嚴有同君父焉斯皆財利致其然矣俠人音協夫耳悅於聲眼愛於色口嗛於味威權形勢以適其情者不待教學而心悅樂豈服法象而身安乎蓋性之然耳夫欲之則就惡之則避斯乃人物之常情不待師教而後為之故天下雖非無足誰獨辨辭於此事者也欲惡烏路反世德堂本賢作聖知和曰知者之為故動以百姓不違其度是以足而不爭無以為故不求不足故求之爭四處而不自以為貪有餘故辭之棄天下而不自以為廉廉貪之實非以迫外也反監之度勢為天子而不以貴驕人富有天下而不以財戲人計其患慮其反以為害於性故辭而不受也非以要名譽也堯舜為帝而雍非仁天下也不以美害生也善卷許由得帝而不受非虛辭讓也不以事害己此皆就其利辭其害而天下稱賢焉則可以有之彼非以興名譽也夫知慧之人虛懷應物故能施為舉動以百姓心為心百姓順之亦不違其法度也內心至之所以不爭無用無為故不求不覺也四處猶四方也夫凡聖區分貪廉斯隔是以爭貪四方馳騁八極不自覺其貪婪棄捨萬乘辭於九五而不自覺其廉儉監照也夫廉貪實性非過迫於外物也而反照於內心各稟度量不同也夫不以高貴為驕矜不以錢財為娛玩者計其災患憂慮傷害於真性故也是以辭大寶而不受非謂要求名譽者也要名一遙反雍和也夫唐虞之化宇內和平者非有情於仁惠不以美麗害生也善卷許由被禪而不受非是矯情於辭讓不以世事害己也斯皆就其長生之利辭其篡弒之害故天下稱其賢能則可謂有此避害之心實無彼興名之意無足曰必持其名苦體絶甘約養以持生則亦久病長厄而不死者也必固將欲修進名譽苦其形體絶其甘美窮約攝養矜持其生者亦何異乎久病固疾長厄不死雖生之日猶死之年此無足之辭以難知和也長厄音厄又烏賣反闕誤引江南古藏本亦下有猶字知和曰平為福有餘為害者物莫不然而財其甚者也今富人耳營鐘鼓管籥之聲口嗛於芻豢醪醴之味以感其意遺忘其業可謂亂矣賅溺於馮氣若負重行而上可謂苦矣貪財而取慰貪權而取竭靜居則溺體澤則馮可謂疾矣為欲富就利故滿若堵耳而不知避且馮而不舍可謂辱矣財積而無用服膺而不舍滿心戚醮求益而不止可謂憂矣內則疑請之賊外則畏寇盜之害內周樓疏外不敢獨行可謂畏矣此六者天下之至害也皆遺忘而不知察及其患至求盡性竭財單以反一日之無故而不可得也故觀之名則不見求之利則不得繚意體而爭此不亦惑乎夫平等被其福善有餘招其禍害者天理自然也物皆如是而財最甚也嗛稱適也管籥簫笛之流也夫富室之人恣情淫勃口爽醪醴耳聒宮商取捨滑心觸類感動性之昏爽事業忘焉無所覺知豈非亂也管音管本亦作管籥音藥一本管籥作塤口嗛苦簟反慶藩案嗛快也說文嗛口有所趙策膳啖之嗛於魏齊桓公夜半不嗛易牙高注並曰嗛快也荀子榮辱篇彼臭之而無嗛於鼻楊倞讀嗛為慊云厭也失之醪力刀反馮氣猶憤悶也夫貪欲既多勞役困弊心中賅塞沈溺憤悶猶如負重上阪而行此之委頓豈非苦困也哉賅溺徐音礙五代反又戶該反飲食至咽為賅一云遍也家世父曰釋文飲食至咽為賅未免強以意通之說文奇賅非常也揚子方言非常曰賅事賅溺猶言沉溺之深也於馮氣馮音憤憤滿也下同言憤畜不通之氣也王念孫曰釋文曰馮氣馮音憤憤滿也言憤畜不通之氣也案馮氣盛氣也昭五年左傳今君奮焉震電馮怒杜注曰馮盛也楚辭離騷馮不厭乎求索王注曰馮滿也楚人名滿曰馮是馮為盛滿之義無煩改讀為憤也而上時掌反貪取財寶以慰其心誘諂威權以竭情慮安靜閒居則其體沈溺體氣悅澤則憤悶斯生動靜困苦豈非疾也取慰慰亦作畏慶藩案慰當與蔚通淮南俶真篇五藏無蔚氣高注曰蔚病也繆稱篇侏儒瞽師人之困慰者也高注曰慰病也是蔚慰二字古訓通用堵牆也夫欲富就利情同壑壁譬彼堵牆版築滿盈心中憤悶貪婪不舍不知避害豈非恥辱耶不舍音捨下同戚醮煩惱也夫積而不散馮而不舍貪求無足煩惱盈懷而論之豈非憂患慶藩案服膺而不舍即上文馮而不舍之義服膺即憑也文選漢高祖功臣頌有馮膺而尚缺文選膺誤作應李善注誤以為憑依瑞應失之古應與膺同聲通用康誥應保殷民周誥膺保民德詩閟宮篇戎狄是膺史記建元以來侯者年表膺作應孟子滕文公篇戎狄是膺音義曰丁本膺作應服膺之為憑膺猶伏軾之為憑軾史記酈生傳伏軾下齊七十餘城漢書作馮軾伏琴之為憑琴史記魏世家中期憑琴索隱曰春秋後語作伏琴茵伏之為茵憑也史記酷吏傳未嘗敢均茵伏漢書作茵馮戚醮在遙反李云也又音子妙反疑恐也請求也匹夫無罪懷璧其罪故在家則恐求財盜賊之災外行則畏寇盜濫竊之害是以舍院周回起疏窗樓敞出內外來往怖懼不敢獨行如此艱辛豈非畏哉疑許業反又曲業反內周樓疏李云重樓內匝疏軒外通謂設備守具六者謂亂苦疾辱憂畏也殫盡也天下至害遺忘不察及其巨盜忽至性命惙然平生貪求一朝頓盡所有財寶當時並罄欲反一日貧素其可得之乎財單音丹本或作蘄音祁家世父曰釋文單本作蘄音祁今案釋文非也單當作為亶史記曆書單閼崔駰注單閼一作亶安單亶字通漢書但字多作亶賈誼傳非亶倒懸而已揚雄傳亶費精神於此說文但裼也是但自為袒而儃為但單以反一日之無故猶言但以反一日之無故玉篇單一也一猶單獨也與但字義亦近此章言知足者常足繚纏繞也巨盜既至身非己有當爾之際豈見有名利耶而流俗之夫倒置之甚情纏繞於名利心決絶於爭求以此而言豈非大惑之甚也繚音了又魚弔反理也趙諫議本管作管阪字依成疏改闕誤引張君房本作阪與阪同張君房本慰作辱銜也二字依國策高注改
