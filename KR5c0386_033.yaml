body:
  text: 雜篇說劍第三十以事名篇昔趙文王喜劍劍士夾門而客三千餘人日夜相擊於前死傷者歲百餘人好之不厭如是三年國衰諸侯謀之趙惠王名何趙武靈王之子也好擊劍之士養客三千好無厭足其國衰敝故諸侯知其無道共相謀議欲將伐之也趙文王司馬云惠文王也名何武靈王子後莊子三百五十年洞紀云周赧王十七年趙惠文王之元年一云案長曆推惠文王與莊子相值恐彪之言誤喜劍許紀反下同夾門郭李音協又古洽反好之呼報反下同無厭於鹽反又於豔反盧文弨曰今書作不厭太子悝患之募左右曰孰能說王之意止劍士者賜之千金左右曰莊子當能悝趙太子名也厭患其父喜好干戈故欲千金以募說士莊子大賢當能止劍也悝苦回反太子名俞樾曰惠文王之後為孝成王丹則此太子蓋不立募音慕又音務說王如字解也又音悅太子乃使人以千金奉莊子莊子弗受與使者俱往見太子曰太子何以教周賜周千金太子曰聞夫子明聖謹奉千金以幣從者夫子弗受悝尚何敢言欲教我何事乃賜千金既見金多故問太子曰聞子賢哲聖明故所以贈金以充從之幣帛也與使所吏反以幣從才用反一本作以幣從者盧文弨曰舊者訛軍今改正今書有者字闕誤引張君房本尚作當莊子曰聞太子所欲用周者欲絕王之喜好也使臣上說大王而逆王意下不當太子則身刑而死周尚安所事金乎使臣上說大王下當太子趙國何求而不得也太子曰然吾王所見唯劍士也莊子曰諾周善為劍太子曰然吾王所見劍士皆蓬頭突鬢垂冠曼胡之纓短後之衣瞋目而語難王乃說之今夫子必儒服而見王事必大逆髮亂如蓬鬢毛突出鐵為冠垂下露面曼胡之纓謂屯項抹額也短後之衣便於武事瞋目怒眼勇者之容憤然窴胸故語聲難澀斯劍士之形服也上說如字又始銳反下同蓬步公反本或作同頭蓬頭謂著兜鉾也有毛故如蓬突鬢必刃反司馬本作賓云賓讀為鬢垂冠將欲鬥故冠低傾也曼胡莫干反司馬云曼胡之纓謂麤纓無文理也短後之衣為便於事也瞋目赤夷赤真二反語難如字艱難也勇士憤氣積於心胸言不流利也又乃旦反既怒而語為人所畏難司馬云說相擊也乃說音悅下大說同莊子曰請治劍服治劍服三日乃見太子太子乃與見王王脫白刃待之莊子入殿門不趨見王不拜王曰子欲何以教寡人使太子先夫自得者內無懼心故不趨走也與見賢遍反下劍見同又如字王脫一本作說同土活反汝欲用何術以教諫於我而使太子先言於我乎曰臣聞大王喜劍故以劍見王王曰子之劍何能禁制曰臣之劍十步一人千里不留行王大悅之曰天下無敵矣其劍十步殺一人一去千里行不留住銳快如是寧有敵乎千里不留行司馬云十步與一人相擊輒殺之故千里不留於行也俞樾曰十步之內輒殺一人則歷千里之遠所殺多矣而劍鋒不缺所當無撓者是謂十步一人千里不留行極言其劍之利也行以劍言非以人言下文所謂行以秋冬是也司馬云十步與一人相擊輒殺之故千里不留於行也未得其義莊子曰夫為劍者示之以虛開之以利後之以發先之以至願得試之夫為劍者道也是以忘己虛心開通利物感而後應機照物先莊子之用劍也王曰夫子休就舍待命令設戲請夫子詞旨清遠感動王心故令休息屈就館舍待設劍戲然後邀延也張君房本無令字王乃校劍士七日死傷者六十餘人得五六人使奉劍於殿下乃召莊子王曰今日試使士敦劍敦斷也試陳劍士使考校敦斷以定勝劣乃校司馬云考校取其勝者也校本或作教士敦如字司馬云敦斷也試使用劍相擊斷截也一音丁回反家世父曰釋文引司馬云敦斷也試使用劍相擊截斷也邶風詩箋王事敦我敦猶投擲也魯頌詩箋敦商之旅敦治也敦劍即治劍之意說文敦怒也一曰誰何也誰何猶言莫我何亦即兩相比較之意兩相比較故怒也莊子曰望之久矣企望日久請早試之王曰夫子所御杖長短何如曰臣之所奉皆可然臣有三劍唯王所用請先言而後試御用也謂莊實可擊劍故問之御杖直亮反所奉司馬本作所奏王曰願聞三劍曰有天子劍有諸侯劍有庶人劍高山寺本三劍字上均有之字王曰天子之劍何如曰天子之劍以燕谿石城為鋒齊岱為鍔晉魏為脊周宋為鐔韓魏為夾包以四夷裹以四時繞以渤海帶以常山制以五行論以刑德開以陰陽持以春夏行以秋冬此劍直之無前舉之無上案之無下運之無旁上決浮雲下絕地紀此劍一用匡諸侯天下服矣此天子之劍也鋒劍端也鍔刃也燕谿在燕國石城塞外山此地居北以為劍鋒齊國岱岳在東為劍刃也燕音煙谿燕谿地名在燕國石城在塞外鍔五各反司馬云劍刃也一云劍稜也鐔環也晉魏二國近乎趙地故以為脊也周宋二國近南故以為環也鐔音淫三蒼云徒感反劍口也徐徒南反又徒各反謂劍鐶也司馬云劍珥也鋏把也韓魏二國在趙之西故以為把也為夾古協反司馬云把也一本作鋏同一云鐔從稜向背鋏從稜向刃也懷四夷以道德順四時以生化裹以音果渤海滄洲也常山北岳也造化之中以山海鎮其地也五行金木水火土刑刑罰德德化也以此五行匡制寰宇論其刑德以御群生夫陰陽開闢春夏維持秋冬肅殺自然之道也行以秋冬隨天道以行止也夫以道為劍則無所不包故上下旁通莫能礙者浮雲地紀豈足言哉既以造化為功故無不服也高山寺本魏作衛文王芒然自失曰諸侯之劍何如夫才小聞大不相承領故芒然若涉海失其所謂類魏惠王之聞韶樂也芒然莫剛反曰諸侯之劍以知勇士為鋒以清廉士為鍔以賢良士為脊以忠聖士為鐔以豪桀士為夾此劍直之亦無前舉之亦無上案之亦無下運之亦無旁上法圓天以順三光下法方地以順四時中和民意以安四鄉此劍一用如雷霆之震也四封之內無不賓服而聽從君命者矣此諸侯之劍也四鄉猶四方也夫能法象天地而知萬物之情謂諸侯所以為異也但能依用此劍而御於邦國亦宇內無敵易以震卦為諸侯故雷霆為諸侯之劍也趙諫議本賢良作賢聖世德堂本及趙本忠聖作忠勝世德堂本豪桀作豪傑王曰庶人之劍何如曰庶人之劍蓬頭突鬢垂冠曼胡之纓短後之衣瞋目而語難相擊於前上斬頸領下決肝肺此庶人之劍無異於鬥雞一旦命已絕矣無所用於國事今大王有天子之位而好庶人之劍臣竊為大王薄之莊子雄辯冠絕古今故能說化趙王去其所好而結會旨歸在於此矣肝肺芳廢反竊為于偽反王乃牽而上殿宰人上食王三環之莊子曰大王安坐定氣劍事已畢奏矣環繞也王覺己非深懷慚惡命莊子上殿以展愧情繞食三周不能安坐氣急心懣豈復能飧乎而上時掌反下同三環如字又音患繞也聞義而愧繞三周不能坐食饌字依世德堂本改於是文王不出宮三月劍士皆服斃其處也不復受賞故恨而致死也服斃婢世反司馬云忿不見禮皆自殺也高山寺本及卷子本服斃其處也並作伏斃其處矣
