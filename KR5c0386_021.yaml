body:
  text: 外篇至樂第十八以義名篇樂音洛天下有至樂無有哉有可以活身者無有哉今奚為奚據奚避奚處奚就奚去奚樂奚惡忘歡而後樂足樂足而後身存將以為有樂耶而至樂無歡將以為無樂耶而身以存而無憂此假問之辭也至極也樂歡也言寰宇之中頗有至極歡樂可以養活身命者無有哉至樂音洛篇內不出者皆同至極也樂歡也擇此八者莫足以活身唯無擇而任其所遇乃全耳奚何也今欲行至樂之道以活身者當何所為造何所依據何所避諱何所安處何所從就何所捨去何所歡樂何所嫌惡而合至樂之道乎此假設疑問下自曠顯奚惡烏路反世德堂本遇下有者字趙諫議本無夫天下之所尊者富貴壽善也所樂者身安厚味美服好色音聲也所下者貧賤夭惡也所苦者身不得安逸口不得厚味形不得美服目不得好色耳不得音聲若不得者則大憂以懼其為形也亦愚哉天下所尊重者無過富足財寶貴盛榮華壽命遐長善名令譽所歡樂者滋味爽口麗服榮身玄黃悅目宮商娛耳若得之者則為據處就樂貧窮卑賤夭折惡名世閒以為下也凡此失之無傷於形而得之有損於性今反以不得為憂故愚凡此上事無益於人而流俗以不得為苦既不適情遂憂愁懼慮如此修為形體豈不甚愚癡夫富者苦身疾作多積財而不得盡用其為形也亦外矣夫貴者夜以繼日思慮善否其為形也亦疏矣人之生也與憂俱生壽者惛惛久憂不死何苦也其為形也亦遠矣烈士為天下見善矣未足以活身吾未知善之誠善邪誠不善邪若以為善矣不足活身以為不善矣足以活人故曰忠諫不聽蹲循勿爭故夫子胥爭之以殘其形不爭名亦不成誠有善無有哉內其形者知足而已夫富豪之家勞神苦思馳騁身力多聚錢財積而不散用何能盡內其形者豈其如斯也故親其形者自得於身中而已夫位高慮遠祿重憂深是以晝夜思量獻可替否勞形怵心無時暫息其為形也不亦疏乎夫遺生然後能忘憂忘憂而後生可樂生可樂而後形是我有富是我物貴是我榮也夫稟氣頑癡生而憂戚雖復壽考而精神惛闇久憂不死翻成苦哉如此為形豈非疏遠其於至樂不亦謬乎惛惛音昏又音門善則適當故不周濟誠實也夫忠烈之士忘身徇節名傳今古見善世閒然未知此善是虛實善若實也不足以活身命善必虛也不應養活蒼生賴諫諍而太平此足以活人也為忠烈而被戮此不足以活身也唯中庸之德為然蹲循猶順從也夫為臣之法君若無道宜以忠誠之心匡諫君若不聽即須蹲循休止若逆鱗強諍必遭刑戮也蹲七旬反郭音存又趣允反循音旬又音脣勿爭爭鬥之爭下同家世父曰外物篇踆於水釋文引字林云踆古蹲字史記貨殖傳下有鴟徐廣云蹲古作踆玉篇足部踆退也部逡退也踆逡字同漢書巡行郡國作循行蹲循猶逡巡也慶藩案蹲循即逡巡廣雅逡巡卻退也管子戒篇作逡遁漢鄭固碑同小問篇作遵循荀子同晏子問篇作逡遁又作逡循漢書平傳贊作逡遁章傳作逡循三禮注作逡遁字異而義實同故當緣督以為經也吳王夫差荒淫無道子胥忠諫以遭殘戮若不諫諍忠名不成故諫與不諫善與不善誠未可定矣趙諫議本此句作厚形知足當字萭字均依漢書改今俗之所為與其所樂吾又未知樂之果樂邪果不樂邪吾觀夫俗之所樂舉群趣者誙誙然如將不得已而皆曰樂者吾未之樂也亦未之不樂也果有樂無有哉吾以無為誠樂矣又俗之所大苦也故曰至樂無樂至譽無譽果未定也流俗以貪染為心以色聲為樂未知此樂決定樂耶而倒置之心未可謂信也舉群趣其所樂乃不避死也誙誙趣死貌也已止也舉世之人群聚趣競所歡樂者無過五塵貪求至死未能止息之也誙誙戶耕反徐苦耕反又胡挺反李云趣死貌崔云以是為非以非為是誙誙本又作脛脛無懷而恣物耳而世俗之人皆用色聲為上樂而莊生體道忘淡故不見其樂亦不見其不樂也夫無為之樂無憂而已以色聲為樂者未知決定有此樂不若以莊生言之用虛淡無為為至實之樂俗以鏗鎗為樂美善為譽俗以富貴榮華鏗金鎗玉為上樂用美言佞善為令譽以無為恬淡寂寞虛夷為憂苦故知至樂以無樂為樂至譽以無譽為譽也鏗苦耕反鎗七羊反闕誤引江南古藏本未之俱作未知之趙諫議本作未知闕誤引江南古藏本誠樂作而誠者為樂天下是非果未可定也雖然無為可以定是非至樂活身唯無為幾存請嘗試言之天無為以之清地無為以之寧故兩無為相合萬物皆化芒乎芴乎而無從出乎芴乎芒乎而無有象乎萬物職職皆從無為殖故曰天地無為也而無不為也人也孰能得無為哉我無為而任天下之是非是非者各自任則定矣夫有為執滯執是競非而是非無主故不可定矣無為虛淡忘是忘非既無是非而是非定者也百姓足則吾身近乎存也幾近也存在也夫至樂無樂常適無憂可以養活身心終其天命唯彼無為近在其中者矣近乎附近之近皆自清寧耳非為之所得不為而自合故皆化若有意乎為之則有時而滯也天無心為清而自然清虛地無心為寧而自然寧靜故天地無為兩儀相合升降災福而萬物化生若有心為之即不能已皆自出耳未有為而出之也芒乎李音荒又呼晃反下同芴乎音忽下同無有為之象夫二儀造化生物無心恍惚芒昧參差難測尋其從出莫知所由視其形容竟無象貌覆論芒芴互其文耳慶藩案芴芒即忽荒也爾雅太歲在巳曰大荒落史書荒作芒三代世表帝芒索隱芒一作荒淮南原道篇游淵霧鶩忽怳高注忽怳無形之象文選七發李注引淮南正作忽荒人間篇曰翱翔乎忽荒之上賈誼鵩賦寥廓忽荒兮與道翱翔是其證皆自殖耳職職繁多貌也夫春生夏長庶物繁多孰使其然皆自生耳尋其源流從無為種植既無為種植豈有為耶萬職職司馬云職職猶祝祝也李云繁貌案爾雅職主也謂各有主而區別盧文弨曰舊殖訛淔今改正若有為則有不濟也得無為則無樂而樂至矣孰誰也夫天地清寧無為虛廓而升降生化而無不為也凡俗之人心靈暗昧耽滯有欲誰能得此無為哉言能之者乃至務也若得之者便是德合二儀冥符至樂也趙諫議本無者字趙本足作定世德堂本作殖世德堂本濟作齊莊子妻死惠子弔之莊子則方箕踞鼓盆而歌莊惠二子為淡水素交既有死亡理須往弔箕踞者垂兩腳如簸箕形也盆瓦缶也莊子知生死之不二達哀樂之為一是以妻亡不哭鼓盆而歌垂腳箕踞敖然自樂箕踞音據盆謂瓦缶也惠子曰與人居長子老身死不哭亦足矣又鼓盆而歌不亦甚乎共妻居處長養子孫妻老死亡竟不哀哭乖於人理足是無情加之鼓歌一何太甚也長子丁丈反莊子曰不然是其始死也我獨何能無概然察其始而本無生非徒無生也而本無形非徒無形也而本無氣雜乎芒芴之間變而有氣氣變而有形形變而有生今又變而之死是相與為春秋冬夏四時行也人且偃然寢於巨室而我噭噭然隨而哭之自以為不通乎命故止也然猶如是也世人皆欣生惡死哀死樂生故我初聞死之時何能獨無概然驚歎也無概古代反司馬云感也又音骨哀亂貌莊子聖人妙達根本故睹察初始本自無生未生之前亦無形質無形質之前亦復無氣從無生有假合而成是知此身不足惜也大道在恍惚之內造化芒昧之中和雜清濁變成陰陽二氣二氣凝結變而有形形既成就變而生育且從無出有變而為生自有還無變而為死而生來死往變化循環亦猶春秋冬夏四時代序是以達人觀察何哀樂之有哉未明而概已達而止斯所以誨有情者將令推至理以遣累也偃然安息貌也巨室謂天地之閒也且夫息我以死臥於天地之閒譬彼炎涼何得隨而哀慟自覺不通天命故止哭而鼓盆也巨室巨大也司馬云以天地為室也噭噭古弔反又古堯反將令力呈反闕誤作萬物皆化今又變而之死云化下有生字又作有支離叔與滑介叔觀於冥伯之丘崑崙之虛黃帝之所休俄而柳生其左肘其意蹶蹶然惡之支離謂支體離析以明忘形也滑介猶骨稽也謂骨稽挺特以遺忘智也欲顯叔世澆訛故號為叔也冥闇也伯長也崑崙人身也言神智杳冥堪為物長崑崙玄遠近在人身丘墟不平俯同世俗而黃帝聖君光臨區宇休心息智寄在凡庸是知至道幽玄其則非遠故託二叔以彰其義也支離叔與滑音骨崔本作介音界叔李云支離忘形滑介忘智言二子乃識化也冥伯之丘李云丘名喻杳冥也崑崙力門反之虛音墟所休休息也蹶蹶驚動貌柳生者易生之木木者棺槨之象此是將死之徵也二叔遊於崑崙觀於變化俄頃之間左臂生柳蹶然驚動似欲惡之也左肘竹九反司馬本作胕音趺云胕足上也家世父曰說文瘤腫也玉篇瘤瘜肉廣韻瘤肉起疾說文亦以瘜為寄肉瘤之生於身假借者也人之有生亦假借也皆塵垢之附物者也柳瘤字一聲之轉蹶蹶紀衛反動也惡之烏路反後皆同支離叔曰子惡之乎相與觀化貴在虛忘蹶然驚動似有嫌惡也滑介叔曰亡予何惡生者假借也假之而生生者塵垢也死生為晝夜且吾與子觀化而化及我我又何惡焉亡無也觀化之理理在忘懷我本無身何惡之有也夫以二氣五行四支百體假合結聚借而成身是知生者塵垢穢累非真物者也垢也音苟以生為晝以死為夜故天不能無晝夜人焉能無死生斯皆先示有情然後尋至理以遣之若云我本無情故能無憂則夫有情者遂自絕於遠曠之域而迷困於憂樂之竟矣我與子同遊觀於變化化而及我斯乃是理當待終有何嫌惡既冥死生之變故合至樂也之竟音境莊子之楚見空髑髏髐然有形撽以馬捶因而問之曰夫子貪生失理而為此乎將子有亡國之事斧鉞之誅而為此乎將子有不善之行愧遺父母妻子之醜而為此乎將子有凍餒之患而為此乎將子之春秋故及此乎之適也髐然無潤澤也撽打擊也馬捶猶馬杖也莊子適楚遇見髑髏空骨無肉朽骸無潤遂以馬杖打擊因而問之欲明死生之理均齊故寄髑髏寓言答問也髑音獨髏音樓髐苦堯反徐又許堯反李呼交反司馬李云白骨貌有枯形也撽苦弔反又古的反說文作云旁擊也馬捶拙反又之睡反馬杖也夫子貪欲資生失於道理致使夭折性命而骸骨為此乎為當有亡國征戰之事行陳斧鉞之誅而為此乎或行姦盜不善之行世閒共惡人倫所恥遺愧父母羞見妻孥慚醜而死於此乎愧遺唯季反餒餓也或遊學他鄉衣糧乏盡患於飢凍死於此乎凍丁貢反餒奴罪反春秋猶年紀也將子有黃髮之年耆艾之壽終於天命卒於此乎於是語卒援髑髏枕而臥夜半髑髏見夢曰子之談者似辯士視子所言皆生人之累也死則無此矣子欲聞死之說乎卒終也援引也初逢枯骨援馬杖而擊之問語既終引髑髏而高枕也援音袁枕而針鴆反睹於此子所言皆是生人之累患欲論死道則無此憂虞子是生人頗欲聞死人之說乎莊子睡中感於此夢也見夢賢遍反闕誤引張君房本子上有向字莊子曰然然許髑髏欲聞其死說聞字依上正文補髑髏曰死無君於上無臣於下亦無四時之事從然以天地為春秋雖南面王樂不能過也夫死者魂氣升於天骨肉歸乎土既無四時炎涼之事寧有君臣上下之累乎從容不復死生故與二儀同其年壽雖南面稱孤王侯之樂亦不能過也從然七容反從容也李徐子用反縱逸也闕誤引張君房本從作泛莊子不信曰吾使司命復生子形為子骨肉肌膚反子父母妻子閭里知識子欲之乎莊子不信髑髏之言更說生人之事欲使司命之鬼復骨肉反妻子歸閭里頗欲之乎復生音服又扶又反髑髏深矉蹙頞曰吾安能棄南面王樂而復為人閒之勞乎舊說云莊子樂死惡生斯說謬矣若然何謂齊乎所謂齊者生時安生死時安死生死之情既齊則無為當生而憂死耳此莊子之旨也深矉蹙頞憂愁之貌也既聞司命復形反於鄉里於是愁矉蹙不用此言誰能復為生人之勞而棄南面王之樂耶深矉音頻蹙本又作顣又作同子六反頞於葛反李云矉顣者愁貌而復扶又反闕誤引張君房本人閒作生人顏淵東之齊孔子有憂色子貢下席而問曰小子敢問回東之齊夫子有憂色何邪顏回自西之東從魯往於齊國欲將三皇五帝之道以教齊侯尼父恐不逗機故有憂色於是子貢避席自稱小子敢問夫子憂色所由孔子曰善哉汝問昔者管子有言丘甚善之曰褚小者不可以懷大綆短者不可以汲深夫若是者以為命有所成而形有所適也夫不可損益吾恐回與齊侯言堯舜黃帝之道而重以燧人神農之言彼將內求於己而不得不得則惑人惑則死褚容受也懷包藏也綆汲索也夫容小之器不可以藏大物短促之繩不可以引深井此言出管子之書孔丘善之故引以為譬也褚小豬許反慶藩案玉篇褚裝衣也字或作一切經音義引通俗文曰裝衣曰說文繫傳褚衣之橐也集韻囊也字或作說文也所以載盛米又曰載米也繫傳曰亦囊也左成三年傳鄭賈人有將寘於褚中以出蓋褚可以囊物亦可以囊人者也綆格猛反汲索也汲居及反故當任之而已夫人稟於天命愚智各有所成受形造化情好咸著所適方之鳧鶴不可益損故當任之而無不當也所適適或作通內求不得將求於外舍內求外非惑如何黃帝堯舜五帝也燧人神農三皇也恐顏回將三皇五帝之道以說齊侯既而步驟殊時澆淳異世執持聖跡不逗機緣齊侯聞此大言未能領悟求於己身不能得解脫不得解則心生疑惑於是忿其勝己必殺顏回皇帝謂三皇五帝也司馬本作黃帝盧文弨曰今本作黃帝案皇黃古通用陸氏謂三皇五帝非而重直用反舍內音捨載字依說文補亦字依繫傳補又字原刻均訛作今正之且女獨不聞邪昔者海鳥止於魯郊魯侯御而觴之于廟奏九韶以為樂具太牢以為膳鳥乃眩視憂悲不敢食一臠不敢飲一杯三日而死此以己養養鳥也非以鳥養養鳥也夫以鳥養養鳥者宜栖之深林遊之壇陸浮之江湖食之隨行列而止委蛇而處彼唯人言之惡聞奚以夫譊譊為乎咸池九韶之樂張之洞庭之野鳥聞之而飛獸聞之而走魚聞之而下入人卒聞之相與還而觀之魚處水而生人處水而死彼必相與異其好惡故異也故先聖不一其能不同其事名止於實義設於適是之謂條達而福持郭外曰郊御迎也九韶舜樂名也太牢牛羊豕也昔有海鳥名曰爰居形容極大頭高八尺避風而至止魯東郊實是凡鳥而妄以為瑞臧文仲祀之故有不智之名也於是奏韶樂設太牢迎於太廟之中而觴宴之也此臧文仲用為神鳥非關魯侯但飲鳥於魯廟之中故言魯侯觴之也且女音汝後同海鳥司馬云國語曰爰居也止魯東門之外三日臧文仲使國人祭之不云魯侯也爰居一名雜縣舉頭高八尺樊光注爾雅云形似鳳凰慶藩案文選江文通雜體詩注引司馬云海鳥爰居也太平御覽九百二十五引鳥下有即字爰居作鶢鶋不若釋文之詳御而音訝觴音傷于廟司馬云飲之於廟中也九韶常遙反舜樂名夫韶樂太牢乃美乃善而施之爰居非所餐聽故目眩心悲數日而死亦猶三皇五帝其道高遠施之齊侯非所聞之也眩玄遍反司馬本作玄音眩視如字徐市至反臠里轉反韶樂牢觴是養人之具非養鳥之物也亦猶顏回以己之學術以教於齊侯非所樂也壇陸湖渚也泥也白魚子也逶迆寬舒自得也夫養鳥之法宜栖茂林放洲渚食魚子浮江湖逐群飛自閒放此以鳥養之法養鳥者也亦猶齊侯率己所行逍遙自得無所企羨也壇大丹反司馬本作澶音但云水沙澶也食之音嗣音條又音攸李徒由反一音由盧文弨曰今本作又音篠隨行戶剛反委於危反蛇以支反又如字奚何也繞喧聒也咸池堯樂也洞庭之野謂天地之閒也還繞也咸池九韶惟人愛好魚鳥諸物惡聞其聲愛好則繞而觀之惡聞則高飛深入既有欣有惡八音何用為乎譊譊乃交反咸池堯樂名之樂如字人卒寸忽反司馬音子忽反云眾也還而音患又旋面反魚好水而惡陸人好陸而惡水彼之人魚稟性各別好惡不同故死生斯異豈唯二種萬物皆然也其好呼報反各隨其情先古聖人因循物性使人如器不一其能各稱其情不同其事也是知將三皇之道以說齊侯者深不可也實而適故條達性常得故福持夫因實立名而名以召實故名止於實不用實外求名而義者宜也隨宜施設適性而已不用捨己效人如是之道可謂條理通達而福德扶持者矣闕誤引江南古藏本故異也三字作好惡異世德堂本作筱此從釋文原本列子行食於道從見百歲髑髏攓蓬而指之曰唯予與汝知而未嘗死未嘗生也若果養乎予果歡乎各以所遇為樂攓拔也從傍也禦寇困於行李食於道傍仍見枯朽髑髏形色似久言百歲者舉其大數髑髏隱在蓬草之下遂拔卻蓬草因而指麾與言然髑髏以生為死以死為生列子則以生為生以死為死生死各執一方未足為定故未嘗死未嘗生也道從如字司馬云從道旁也本或作徒盧文弨曰殷敬順列子天瑞篇釋文云莊子從作徒司馬云徒道旁也本或作從與此本異慶藩案道從當為道徒之誤從徒形相似故徒誤為從列子天瑞篇正作食於道徒攓居輦反徐紀偃反又起虔反司馬云拔也或音厥蓬步東反徐扶公反慶藩案攓正字作說文拔取也攓為之借字故司馬訓為拔也亦通作搴離騷朝搴阰之木蘭說文引此正作爾雅芼搴也樊光曰搴猶拔也釋文搴九輦反漢書季布傳搴旗者數矣李奇注亦曰搴猶拔也歡養之實未有定在汝欣冥冥冥冥果有怡養乎我悅人倫人倫決可歡乎適情所遇未可定之者也若果一本作汝果元嘉本作汝過養司馬本作暮云死也予果元嘉本作子過歡乎司馬本作嚾云呼聲謂生也俞樾曰養讀為恙爾雅釋詁恙憂也若果恙乎予果歡乎恙與歡對猶憂與樂對也言若之死非憂予之生非樂也恙與養古字通詩二子乘舟篇中心養養傳訓養為憂即本雅詁矣司馬本養作暮乃字之誤趙諫議本若作汝種有幾得水則為繼得水土之際則為蠙之衣生於陵屯則為陵舄陵舄得鬱棲則為烏足烏足之根為蠐螬其葉為胡蝶胡蝶胥也化而為蟲生於灶下其狀若脫其名為鴝掇鴝掇千日為鳥其名為乾餘骨乾餘骨之沫為斯彌斯彌為食醯頤輅生乎食醯黃軦生乎九猷瞀芮生乎腐蠸羊奚比乎不筍久竹生青寧青寧生程程生馬馬生人人又反入於機萬物皆出於機皆入於機變化種數不可勝計陰陽造物轉變無窮論其種類不可深計之也種章勇反注同有幾居豈反可勝音升潤氣生物從無生有故更相繼續也得水則為繼去掉糸此古絕字徐音絕今讀音繼司馬本作繼云萬物雖有兆朕得水土氣乃相繼而生也本或作斷又作續斷盧文弨曰古絕字當作此繼去掉糸乃繼字家世父曰釋文引司馬本作繼言萬物雖有兆朕得水土乃相繼而生也本或作斷又作續斷疑作續斷者是也說文藚水舄也爾雅藚牛脣郭注引毛詩傳水蕮也如藚斷寸寸有節藚續字即本草之云續斷也蠙之衣青苔也在水中若張綿俗謂之蝦蟆衣也得水土之際則為戶媧反蠙步田反徐扶賢反郭父因反又音賓李婢軫反之衣司馬云言物根在水土際布在水中就水上視不見按之可得如張綿在水中楚人謂之蠙之衣屯阜也陵舄車前草也既生於陵阜高陸即變為車前也生於陵屯司馬音徒門反云阜也郭音純則為陵舄音昔司馬云言物因水成而陸產生於陵屯化作車前改名陵舄也一名澤舄隨燥溼變也然不知其祖言物化無常形也人之死也亦或化為草木草木之精或化為人也鬱棲糞壤也陵舄既老變為糞土也糞壤復化生烏足之草根也陵舄得鬱棲則為烏足司馬云鬱棲蟲名烏足草名生水邊也言鬱棲在陵舄之中則化為烏足也李云鬱棲糞壤也言陵舄在糞化為烏足也家世父曰爾雅芣衛馬舄郭注今車前草江東呼為蝦蟆衣爾雅蕍舄郭注今澤蕮一曰水舄一曰馬舄一曰澤舄三者同類而所生不同陸機詩疏藚澤舄葉如車前圖經亦云澤舄生淺水中則陵舄生於陵屯當別一物釋文引司馬云物因水成而陸產生於陵屯化作車前改名陵舄車前生道邊亦云不生陵屯也蠐螬蟲也胥胡蝶名也變化無恆故根為蠐螬而葉為胡蝶也烏足之根為蠐音齊螬音曹司馬本作螬蠐云蝎也慶藩案太平御覽九百四十八引司馬云烏足草名生水邊螬蠐蟲也與釋文異其葉為胡蝶音牒司馬云胡蝶蛺蝶也草化為蟲蟲化為草未始有極胡蝶胥也一名胥俞樾曰釋文曰胡蝶胥也一名胥此失其義當屬下句讀之本云胡蝶胥也化而為蟲與下文鴝掇千日為鳥兩文相對千日為鳥言其久也胥也化而為蟲言其速也列子天瑞篇釋文曰胥少也謂少時也得其義矣家世父曰釋文引司馬云胡蝶一名胥也疑胥也不當為胡蝶之名爾雅蚅鳥蝎郭注大蟲如指似蠶毛詩傳蠋桑蟲說文蠋蜀葵中蠶也廣志藿蠋有五色者槐蠋有采有角爾雅所云桑繭樗繭棘繭欒繭蕭繭皆蠋類也老而成蛹則為胡蝶胡蝶生卵就火取溫又成蠋生於灶下者就溫也埤雅云繭生蛾蛾生卵郭注爾雅羅即蠶蛾疏謂蠶蛹所變是也胡蝶與蠶蠋之屬互相化胥也云者謂互相化也博雅原蠶其蛹蚼此云鴝蓋蚼之假借字鴝掇蟲名也胥得熱氣故作此蟲狀如新脫皮毛形容雅淨也化而為蟲生於灶下司馬云得熱氣而生也其狀若脫它括反司馬音悅云新出皮悅好也慶藩案集韻十七薛引司馬云蟲新出皮悅好貌與釋文小異其名為鴝其俱反掇丁活反乾餘骨鳥口中之沫化為斯彌之蟲鴝掇千日為鳥其名為乾餘骨乾音干乾餘骨之沫音末李云口中汁也為斯彌李云蟲也酢甕中蠛蠓亦為醯雞也斯彌為食如字司馬本作蝕醯許兮反李音海司馬云蝕醯若酒上蠛蠓也蠛音眠結反蠓音無孔反家世父曰列子天瑞篇斯彌為食醯頤輅生乎食醯黃軦生乎九猷九猷生乎瞀芮瞀芮生乎腐蠸是頤輅黃軦數者皆食醯之類也方言蠀螬自閩以東謂之蝤蠀梁益之閒謂之輅當為猷當為蝤漢書王褒傳蜉蝣出乎陰皆群飛小蟲也郭注爾雅蠛蠓云小蟲似蚋喜亂飛瞀芮當為荀子醯酸而聚焉亦食醯之類也此假言小蟲自相化軦亦蟲名頤以之反輅生乎食醯輅音路一音洛黃軦音況徐李休往反司馬云頤輅黃軦皆蟲名生乎九猷音由李云九宜為久久老也猷蟲名也盧文弨曰案列子作斯彌為食醯頤輅食醯頤輅生乎食醯黃軦食醯黃軦生乎九猷九猷生乎瞀芮瞀芮蟲名腐蠸螢火蟲也亦言是粉鼠蟲瞀莫豆反又莫住反又亡角反芮如銳反徐如悅反生乎腐音輔蠸音權郭音歡司馬云亦蟲名也爾雅云一名守爪一云蚡鼠也並草名也羊奚比毗志反乎不上筍下子息尹反司馬云羊奚草名根似蕪菁與久竹比合而為物皆生於非類也羊奚比合於久竹而生青寧之蟲也久竹生青寧司馬云蟲名盧文弨曰殷敬順云莊子從羊奚至青寧連為一句司馬之說固如是郭本乃分之列子上筍下子作筍亦蟲名也青寧生程李云未聞未詳所據程生馬馬生人俗本多誤故具錄之此言一氣而萬形有變化而無死生也機者發動所謂造化也造化者無物也人既從無生有又反入歸無也豈唯在人萬物皆爾或無識變成有識或有識變為無識或無識變為無識或有識變為有識千萬變化未始有極也而出入機變謂之死生既知變化無窮寧復欣生惡死體斯趣旨謂之至樂也俞樾曰又當作久字之誤也久者老也上文黃軦生乎九猷釋文引李注曰九宜為久久老也是其義也人久反入於機者言人老復入於機也列子天瑞篇正作人久入於機闕誤引劉得一本幾字有若為鶉四字闕誤引張君房本上六句作斯彌為食醯食醯生乎頤輅頤輅生乎黃軦黃軦生乎九猷九猷生乎瞀芮瞀芮生乎腐蠸腐蠸生乎羊奚羊奚比乎不筍久竹生青寧蝎字依釋文原本改
