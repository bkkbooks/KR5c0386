body:
  text: 外篇秋水第十七借物名篇秋水時至百川灌河涇流之大兩涘渚崖之間不辯牛馬於是焉河伯欣然自喜以天下之美為盡在己順流而東行至於北海東面而視不見水端於是焉河伯始旋其面目望洋向若而歎曰野語有之曰聞道百以為莫己若者我之謂也且夫我嘗聞少仲尼之聞而輕伯夷之義者始吾弗信今我睹子之難窮也吾非至於子之門則殆矣吾長見笑於大方之家言其廣也河孟津也涇通也涘岸也涯際也渚洲也水中之可居曰洲也大水生於春而旺於秋素秋陰氣猛盛多致霖雨故秋時而水至也既而凡百川谷皆灌注黃河通流盈滿其水甚大涯岸曠闊洲渚迢遙遂使隔水遠看不辨牛之與馬也秋水李云水生於春壯於秋白虎通云水準也灌河古亂反涇流音經司馬云涇通也崔本作徑云直度曰徑又云字或作涇兩涘音俟涯也渚司馬云水中可居曰渚釋名云渚遮也體高能遮水使從旁回也崖字又作涯亦作並同不辯牛馬辯別也言廣大故望不分別也河伯河神也姓馮名夷華陰潼堤鄉人得水仙之道河既曠大故欣然懽喜謂天下榮華盛美盡在己身河伯姓馮名夷一名冰夷一名馮遲已見大宗師篇一云姓呂名公子馮夷是公子之妻慶藩案文選枚乘七發注引許慎曰馮遲河伯也釋文云河伯姓馮名夷一名馮遲遲夷二字古通用也淮南齊俗訓馮夷得道以潛大川許注馮夷河伯也華陰潼鄉隄首里人服八石得水仙詩小雅四牡篇周道倭遲韓詩作委夷顏籀匡正云古遲夷通此其證高注淮南原道篇馮夷或曰馮遲古之得道能御陰陽者也為盡津忍反北海今萊州是望洋不分明也水日相映故望洋也若海神也河伯沿流東行至於大海聊復顧眄不見水之端涯方始迴旋面目高視海若仍慨然發歎託之野語而百是萬之一誠未足以自多遂無如己者即河伯之謂也此乃鄙俚之談未為通論耳北海李云東海之北是也面目盳莫剛反又音旁又音望本一作望盧文弨曰今本盳作望洋音羊司馬崔云盳洋猶望羊仰視貌向若向徐音嚮許亮反司馬云若海神慶藩案釋文引司馬崔本作盳洋云盳洋猶望羊仰視貌今案洋羊皆假借字其正字當作陽論衡骨相篇武王望陽言望視太陽也太陽在天宜仰而觀故訓為仰視聞道百李云萬分之一也家世父曰李軌云聞道百萬分之一也今案聞字對下字為言聞道雖多而不知其無窮也以意度其然而自信其有進焉者及其無窮乃始爽然自失也百者多詞也李注非是慶藩案百古讀若搏與若韻漢書鄒陽傳鷙鳥絫百與鶚韻蔡邕獨斷蠟祝辭歲取千百與宅壑作韻知其小而不能自大則理分有素跂尚之情無為乎其間方猶道也世人皆以仲尼刪定六經為多聞博識伯夷讓國清廉其義可重復有通人達士議論高談以伯夷之義為輕仲尼之聞為寡即河伯嘗聞竊未之信今見大海之弘博浩汗難窮方覺昔之所聞諒不虛矣河伯向不至海若之門於事大成危殆既而所見狹劣則長被笑於大道之家今我睹舊音睹案說文睹今字睹古字睹見也崔本作今睹我云睹示也大方之家司馬云大道也理分扶問反後同兩睹字依下正文改北海若曰井蛙不可以語於海者拘於虛也夏蟲不可以語於冰者篤於時也曲士不可以語於道者束於教也今爾出於崖涘觀於大海乃知爾醜爾將可與語大理矣天下之水莫大於海萬川歸之不知何時止而不盈尾閭泄之不知何時已而不虛春秋不變水旱不知此其過江河之流不可為量數而吾未嘗以此自多者自以比形於天地而受氣於陰陽吾在於天地之間猶小石小木之在大山也方存乎見少又奚以自多計四海之在天地之間也不似礨空之在大澤乎計中國之在海內不似稊米之在大倉乎號物之數謂之萬人處一焉人卒九州穀食之所生舟車之所通人處一焉此其比萬物也不似豪末之在於馬體乎五帝之所連三王之所爭仁人之所憂任士之所勞盡此矣伯夷辭之以為名仲尼語之以為博此其自多也不似爾向之自多於水乎夫物之所生而安者趣各有極海若知河伯之狹劣舉三物以譬之夫坎井之蛙聞大海無風而洪波百尺必不肯信者為拘於虛域也夏生之蟲至秋便死聞玄冬之時水結為冰雨凝成霰必不肯信者心厚於夏時也曲見之士偏執之人聞說虛通至道絕聖棄智大豪末而小泰山壽殤子而夭彭祖而必不信者為束縛於名教故也而河伯不至洪川未逢海若自矜為大其義亦然以語如字下同王引之曰蛙本作魚後人改之也太平御覽時序部七鱗介部七蟲豸部一引此並云井魚不可以語於海則舊本作魚可知且釋文於此句不出蛙字直至下文井之蛙始云蛙本又作蛙戶蝸反引司馬注云蛙水蟲形似蝦則此句作魚不作蛙明矣若作蛙則戶蝸之音水蟲之注當先見於此不應至下文始見也再以二證明之鴻烈原道篇夫井魚不可與語大拘於隘也梁張綰文井魚之不識巨海夏蟲之不見冬冰水經贛水注云聊記奇聞以廣井魚之聽皆用莊子之文則莊子之作井魚益明矣井九三井谷射鮒鄭注曰所生魚無大魚但多鮒魚耳見劉逵吳都賦注困學紀聞卷十引御覽所載莊子曰用意如井魚者吾為鉤繳以投之呂氏春秋諭大篇曰井中之無大魚也此皆井魚之證後人以此篇有井蛙之語而荀子亦云坎井之蛙不可與語東海之樂見正論篇遂改井魚為井蛙不知井自有魚無煩改作蛙也自有此改世遂動稱井蛙夏蟲不復知有井魚之喻矣於虛音墟本亦作墟風俗通云墟虛也崔云拘於井中之空也王念孫曰崔注拘於虛曰拘於井中之空也案崔訓虛為空非也虛與墟同故釋文云虛本亦作墟廣雅曰墟也古居字文選西征賦注引聲類曰墟故所居也凡經傳言丘墟者皆謂故所居之地言井魚拘於所居故不知海之大也魚居於井猶河伯居於涯涘之間故下文曰今爾出於涯涘觀於大海乃知爾醜也夏蟲戶嫁反慶藩案文選孫興公天台山賦注引司馬云厚信其所見之時也釋文闕又案司馬訓篤為厚成疏心厚於夏時即用司馬義其說迂曲難通爾雅釋詁篤固也論語泰伯篇篤信好學謂信之固也禮儒行篤行而不倦謂行之固也後漢延篤字叔堅堅亦固也凡鄙陋不達謂之固夏蟲為時所蔽而不可語冰故曰篤於時篤字正與上下文拘束同義曲士司馬云鄉曲之士也以其知分故可與言理也河伯駕水乘流超於崖涘之表適逢海若仍於瀚海之中詳觀大壑之無窮方鄙小河之陋劣既悟所居之有限故可語大理之虛通也尾閭者泄海水之所也在碧海之東其處有石闊四萬里厚四萬里居百川之下尾而為閭族故曰尾閭海水沃著即焦亦名沃焦也山海經云羿射九日落為沃焦此言迂誕今不詳載春雨少而秋雨多堯遭水而湯遭旱故海之為物也萬川歸之而不盈沃焦瀉之而不虛春秋不變其多少水旱不知其增減論其大也遠過江之流優劣懸殊豈可語其量數也尾閭崔云海東川名司馬云泄海水出外者也泄之息列反又與世反慶藩案文選嵇叔夜養生論注引司馬云尾閭水之從海外出者也一名沃焦在東大海之中尾者在百川之下故稱尾閭者聚也水聚族之處故稱閭也在扶桑之東有一石方圓四萬里厚四萬里海水注者無不燋盡故曰沃燋較釋文所引加詳量數音亮注及下同窮百川之量而縣於河河縣於海海縣於天地則各有量也此發辭氣者有似乎觀大可以明小尋其意則不然夫世之所患者不夷也故體大者然謂小者為無餘質小者塊然謂大者為至足是以上下夸跂俯仰自失此乃生民之所惑也惑者求正正之者莫若先極其差而因其所謂所謂大者至足也故秋毫無以累乎天地矣所謂小者無餘也故天地無以過乎秋毫矣然後惑者有由而反各知其極物安其分逍遙者用其本步而遊乎自得之場矣此莊子之所以發德音也若如惑者之說轉以小大相傾則相傾者無窮矣若夫睹大而不安其小視少而自以為多將奔馳於勝負之竟而助天民之矜夸豈達乎莊生之旨哉存在也奚何也夫覆載萬物莫大於天地布氣生化莫大於陰陽也是以海若比形於天地則無等級以寄言受氣於陰陽則是陰陽象之一物也故託諸物以為譬猶小木小石之在太山乎而海若於天理在乎寡少物各有量亦何足以自多而縣音玄下同怏然於亮反又於良反之竟音境礨空蟻穴也稊草似稗而米甚細少也中國九州也夫四海在天地之間九州居四海之內豈不似蟻孔之居大澤稊米之在大倉乎言其大小優劣有如此之懸也礨力罪反向同崔音壘李力對反空音孔壘孔小穴也李云小封也一云蟻冢也家世父曰釋文引崔云礨空小穴也李軌云小封也一云蟻塚今案礨空自具兩義言高下之勢也礨者突然而高空者窪然而下大澤之中或墳起或洿深高下起伏自然之勢常相因也故謂之礨空司馬相如上林賦丘墟掘礨亦同此義言丘墟之勢或掘而成穴或壘而成垤也稊米徒兮反司馬云稊米小米也李云稊草也案郭注爾雅稊似稗稗音蒲賣反大倉音泰小大之辨各有階級不可相跂號名號也卒眾也夫物之數不止於萬而世間語便多稱萬物人是萬數之一物也中國九州人眾聚集百穀所生舟車來往在其萬數亦處一焉然以人比之萬物九州方之宇宙亦無異乎一豪之在馬體曾何足以介懷也人卒尊忽反司馬云眾也崔子恤反云盡也家世父曰釋文引司馬云卒眾也崔云盡也案人卒九州言極九州之人數卒者盡詞也九州之大人數之繁其在天之中要亦萬物之一而已崔說是俞樾曰人卒二字未詳何義司馬訓卒為眾崔訓卒為盡皆不可通且下云人處一焉則此不當以人言人卒疑大率二字之誤人間世篇率然拊之釋文曰率或作卒是率卒形似易誤之證率誤為卒因改大為人以合之據至樂篇人卒聞之盜跖篇人卒未有不興名就利者是人卒之文本書所有然施之於此不可通矣大率者總計之辭上云計四海之在天地之間也又云計中國之在海內計與大率其義正同不出乎一域五帝連接而揖讓三王興師而爭奪仁人殷憂於社稷任士劬勞於職務四者雖事業不同俱理盡於毫末也五常之所連司馬云謂連續仁義也崔云連續也本亦作五帝盧文弨曰今本作五帝家世父曰江南古本連作運似從運為妥所爭側耕反任士之所勞李云任能也勞服也物有定域雖至知不能出焉故起大小之差將以申明至理之無辯也伯夷讓五等以成名仲尼論六經以為博用斯輕物持此自多亦何異乎向之河伯自多於水此通合前喻並釋前事少仲尼之聞輕伯夷之義也趙諫議本作墟趙本作涯趙本無於字於字依世德堂本補闕誤引江南古藏本連作運河字依正文改怏字依釋文及世德堂本改之字依正文補河伯曰然則吾大天地而小末可乎夫形之大者無過天地質之小者莫先毫末故舉大舉小以明稟分有差河伯呈己所知詢於海若又解若以自足為大吾可大於兩儀若以無餘為小吾可小於毫末河伯既其領悟故物我均齊所以述己解心詢其可不也北海若曰否夫物量無窮時無止分無常終始無故是故大知觀於遠近故小而不寡大而不多知量無窮證曏今故故遙而不悶掇而不跂知時無止察乎盈虛故得而不喜失而不憂知分之無常也明乎坦塗故生而不說死而不禍知終始之不可故也計人之所知不若其所不知其生之時不若未生之時以其至小求窮其至大之域是故迷亂而不能自得也由此觀之又何以知末之足以定至細之倪又何以知天地之足以窮至大之域物物各有量既領所疑答曰不可夫物之器量稟分不同隨其所受各得稱適而千差萬別品類無窮稱適之處無大無小豈得率其所知抑以為定死與生皆時行新新不住得與失皆分所稟分命隨時變易日新也雖復終而復始而未嘗不新各自足也此下釋量無窮也以大聖之知視於遠理察於近事故毫末雖小當體自足無所寡少也亦無餘也天地雖大當無餘故未足以自多也不多則無夸不寡則息企也攬而觀之知遠近大小之物各有量以大人之知知於物之器量大小雖異各稱其情升降不同故無窮也此結前物量無窮也曏明也今故猶古今此下釋時無止義也曏明也既知小大非小大則證明古今無古今也證曏許亮反崔云往也向郭云明也又虛丈反遙長也掇猶短也遙長也掇短也既知古今無古今則知壽夭無壽夭是故年命延長終不厭生而悒悶稟齡夭促亦不欣企於遐壽隨變任化未始非吾掇專劣反郭云短也而不跂如字一本作企下注亦然家世父曰郭象注遙長也掇猶短也說文掇拾取也易疏患至掇也若手拾掇物然言近而可掇取也悶如老子其政悶悶不詳明跂者所以行也淮南子原道訓跂行喙息馬蹄篇蹩為仁踶跂為義謂煩勞也知時無止順謂行之而已故者非遙無漠視也今者非近無強致也郭象注未愜證明古今知變化之不止於死生也故不以長而悒悶短故為跂也此結前時無止義也此下釋分無常義也夫天道既有盈虛人事寧無得喪是以視乎盈虛之變達乎得喪之理故儻然而得時也不足為欣偶爾而失命也不足為戚也察其一盈一虛則知分之不常於得也故能忘其憂喜此結前分無常義也死生者日新之正道也此下釋終始無故義也坦平也塗道也不以死為死不以生為生死生無隔故明乎坦然平等之大道者如此坦吐但反夫明乎坦然之道者其生也不足以為欣悅其死也不足以為禍敗達死生之不二何憂樂之可論乎不說音悅明終始之日新也則知故之不可執而留矣是以涉新而不愕舍故而不驚死生之化若一此結前終始無故義不愕五各反舍故音捨所知各有限也強知者乖真不知者會道以此計之當故不如也生時各有年也未生之時無喜所以無憂既生之後有愛所以有憎莫若安於所受之分而已至小智也至大境也夫以有限之小智求無窮之大境而無窮之境未周有限之智已喪是故終身迷亂返本無由喪己企物而不自得也以小求大理終不得各安其分則大小俱足矣若毫末不求天地之功則周身之餘皆為棄物天地不見大於秋毫則顧其形象裁自足耳將何以知細之定細大之定大也夫物之稟分各自不同大小雖殊而咸得稱適若以小企大則迷亂失性各安其分則逍遙一也故毫末雖小性足可以稱大二儀雖大無餘可以稱小由此視之至小之倪何必定在於毫末至大之域豈獨理窮於天地之倪五反徐音詣郭五米反下同豪字依世德堂本改體字依上疏文改其字依下句補河伯曰世之議者皆曰至精無形至大不可圍是信情乎信實也世俗議論未辯是非僉言至精細者無復形質至廣大者不可圍繞未知此理情智虛實河伯未達故有此疑也北海若曰夫自細視大者不盡自大視細者不明夫精小之微也垺大之殷也故異便此勢之有也夫精粗者期於有形者也無形者數之所不能分也不可圍者數之所不能窮也可以言論者物之粗也可以意致者物之精也言之所不能論意之所不能察致者不期精粗焉目之所見有常極不能無窮也故於大則有所不盡於細則有所不明直是目之所不逮耳精與大皆非無也庸詎知無形而不可圍者哉夫以細小之形視於曠大之物者必不盡其弘遠故謂之不可圍又以曠大之物觀於細小之形者必不曉了分明故謂之無形質此並未出於有境豈是至無之義哉大小異故所便不得同精微小也垺殷大也欲明小中之小大中之大稟氣雖異並不離有天機自張各有便宜也垺李普回反徐音孚謂盛也郭芳尤反崔音裒之殷殷眾也慶藩案殷大也故疏云大中之大不當訓眾異便婢面反徐扶面反注皆同若無形而不可圍則無此異便之勢也大小既異宜便亦殊故知此勢未超於有之也有精粗矣故不得無形夫言及精粗者必期限於形名之域而未能超於言象之表也精粗七胡反下同無形不可圍者道也至道深玄絕於心色故不可以名數分別亦不可以數量窮盡能分如字唯無而已何精粗之有哉夫言意者有也而所言所意者無也故求之於言意之表而入乎無言無意之域而後至焉夫可以言辨論說者有物之粗法也可以心意致得者有物之精細也而神口所不能言聖心所不能察者妙理也必求之於言意之表豈期必於精粗之間哉不能論本或作諭闕誤引張君房本便下有耳字形字依下正文期於有形句改所字依上句補是故大人之行不出乎害人不多仁恩動不為利不賤門隸貨財弗爭不多辭讓事焉不借人不多食乎力不賤貪污行殊乎俗不多辟異為在從眾不賤佞諂世之爵祿不足以為勸戮恥不足以為辱知是非之不可為分細大之不可為倪聞曰道人不聞至德不得大人無己約分之至也大人者無意而任天行也舉足而投諸吉地豈出害人之塗哉夫大人應物譬彼天行運而無心故投諸吉地出言利物終不害人也無害而不自多其恩慈澤類乎春陽而不多遍行恩惠也應理而動而理自無害應機而動不域心以利物為利于偽反任其所能而位當於斯耳非由賤之故措之斯職混榮辱一窮通故守門僕隸不以為賤也故措七故反各使分定寡欲知足守分不貪故於彼貨財曾無爭競也適中而已率性謙和用捨隨物終不矯情飾辭多讓各使自任愚智率性工拙襲情終不假借於人分外求務足而已食於分內充足而已不多貪求疲勞心力理自無欲體達玄道故無情欲非關苟貴清廉賤於貪污己獨無可無不可所以與俗殊和光同塵無可不可而在染不染故行殊乎俗也行殊下孟反下堯桀之行同任理而自殊也居正體道故不多邪辟而大順群生故曾無乖異也辟異匹亦反從眾之所為也至人無心未曾專己故凡厥施為務在從眾也自然正直素性忠貞不履左道非鄙賤佞諂而後正直也家世父曰大人之行凡五事本不害人非為仁也無貴賤貨利之在其心何有辭讓也不導人以為利何有貪污也行自殊俗非為異也順從乎眾非為諂也事焉不借人如許行之云並耕而治饔而食不多食乎力如老子之云我無事而民自富我無而民自樸彼貪污者自止而無事乎賤之矣郭象注未能分明外事不接於心夫高官重祿世以為榮刑戮黜落世以為恥既而體榮枯之非我達通塞之有時寄來不足以勸勵寄去不足以羞辱也家世父曰世之爵祿不足以為勸戮恥不足以為辱承上言無為而民自化仁讓無所施貪諂無所庸又何以爵祿戮恥為也郭象云外事不棲於心誤故玄同也各執是非故是非不可為定分互為大小故細大何得有倪限即天地毫末之謂乎任物而物性自通則功名歸物矣故不聞夫體道聖人和光韜晦推功於物無功名之可聞寓諸他人故稱聞曰得者生於失也物各無失則得名去也得者不喪之名也而造極之人均於得喪既無所喪亦無所得故老經云上德不德任物而已大聖之人有感斯應方圓任物故無己也無己音紀約之以至其分故冥也夫唯極乎無形而不可圍者為然約依也分限也夫大人利物抑乃多塗要切而言莫先依分若視目所見聽耳所聞知止所知而限於分內者斯德之至者也闕誤引張君房本人下有之塗也三字趙諫議本無而字也字為字依老子原文改世德堂本作棲趙本無此句河伯曰若物之外若物之內惡至而倪貴賤惡至而倪小大若物之外若物之內謂物性分之內外也惡何也言貴賤之分小大之倪為在物性之中為在性分之外至何處所而有此耶河伯未達其源故致斯請也惡至音烏下同北海若曰以道觀之物無貴賤以物觀之自貴而相賤以俗觀之貴賤不在己以差觀之因其所大而大之則萬物莫不大因其所小而小之則萬物莫不小知天地之為稊米也知末之為丘山也則差數睹矣以功觀之因其所有而有之則萬物莫不有因其所無而無之則萬物莫不無知東西之相反而不可以相無則功分定矣以趣觀之因其所然而然之則萬物莫不然因其所非而非之則萬物莫不非知堯桀之自然而相非則趣操睹矣各自足也道者虛通之妙理物者質礙之麤事而以麤視妙故有大小以妙觀麤故無貴賤此區區者乃道之所錯綜而齊之也夫物情倒置迷惑是非皆欲貴己而賤他他亦自貴而賤彼彼此懷惑故言相也斯所謂倒置也夫榮華戮恥事出儻來而流俗之徒妄生欣戚是以寄來為貴得之所以為寵寄去為賤失之所以為辱斯乃寵辱由乎外物豈貴賤在乎己哉所大者足也所小者無餘也故因其性足以名大則毫末丘山不得異其名因其無餘以稱小則天地稊米無所殊其稱若夫觀差而不由斯道則差數相加幾微相傾不可勝察也差別也夫以自足為大則毫末之與丘山均其大矣以無餘為小則天地之與稊米均其小矣是以因毫末以為大則萬物莫不大矣因天地以為小則萬物莫不小矣故雖千差萬際數量不同而以此觀之則理可見家世父曰道者通乎人我者也物者心有所據以衡人者也俗者徇俗為貴賤者也差者萬物之等差也功者人我兩須之事功也趣者一心之旨趣也繁然殽亂而持之皆有道故言之皆有本貴賤大小辨爭反復而天下紛然多故也其稱尺證反可勝音升天下莫不相與為彼我而彼我皆欲自為斯東西之相反也然彼我相與為唇齒唇齒者未嘗相為而唇亡則齒寒故彼之自為濟我之功弘矣斯相反而不可以相無者也故因其自為而無其功則天下之功莫不皆無矣因其不可相無而有其功則天下之功莫不皆有矣若乃忘其自為之功而思夫相為之惠惠之愈勤而偽薄滋甚天下失業而情性瀾漫矣故其功分無時可定也夫東西異方其義相反也而非東無以立西斯不可以相無者也若近取諸身者眼見耳聽手捉腳行五藏六腑四肢百體各有功能咸稟定分豈眼為耳視而腳為手行哉相為之功於斯滅矣此是因其所無而無之則萬物莫不無也然足不行則四肢為之委頓目不視則百體為之否塞而所司各用無心相為濟彼之功自然成矣斯因其所有而有之則萬物莫不有也以此觀之則功用有矣分各定矣若乃忘其自為之功而思夫相為之惠則彼我失性而是非殽亂也豈莊生之意哉自為于偽反注內自為相為皆同餘如字物皆自然故無不然物皆相非故無不非無不非則無然矣無不然則無非矣無然無非者堯也有然有非者桀也然此二君各受天素不能相為故因堯桀以觀天下之趣操其不能相為也可見矣然猶是也夫物皆自是故無不是物皆相非故無不非無不非則天下無是矣無不是則天下無非矣故以物情趣而觀之因其自是則萬物莫不是因其相非則萬物莫不非矣夫天下之極相反者堯桀也故舉堯桀之二君以明是非之兩義故堯以無為為是有欲為非桀以無為為非有欲為是故曰知堯桀之自然相非因此而言則天下萬物情趣志操可以見之矣世德堂本之下有者字以字依下句補昔者堯舜讓而帝之噲讓而絕湯武爭而王白公爭而滅由此觀之爭讓之禮堯桀之行貴賤有時未可以為常也梁麗可以衝城而不可以窒穴言殊器也騏驥驊騮一日而馳千里捕鼠不如狸狌言殊技也鴟鵂夜撮蚤察毫末晝出瞋目而不見丘山言殊性也故曰蓋師是而無非師治而無亂乎是未明天地之理萬物之情者也是猶師天而無地師陰而無陽其不可行明矣然且語而不舍非愚則誣也帝王殊禪三代殊繼差其時逆其俗者謂之篡夫當其時順其俗者謂之義之徒默默乎河伯女惡知貴賤之門小大之家夫帝王異代爭讓異時既而堯知天命有歸故禪於舜舜知曆祚將改又讓於禹唐虞是五帝之數故曰讓而帝也子之燕相子之也噲燕王名也子之即蘇秦之女婿也秦弟蘇代從齊使燕以堯讓許由故事說燕王噲令讓位與子之子之遂受國人恨其受讓皆不服子之三年國亂齊宣王用蘇代計興兵伐燕於是殺燕王噲於郊斬子之於朝以絕燕國豈非效堯舜之陳跡而禍至於此乎之噲音快又古邁反又古會反之者燕相子之也噲燕王名也司馬云燕王噲拙於謀用蘇代之說效堯舜讓位與子之三年而國亂夫順天應人而受天下者其跡則爭讓之跡也尋其跡者失其所以跡矣故絕滅也殷湯伐桀周武克紂此之二君皆受天命故致六合清泰萬國來朝是以時繼三王故云爭而王也而時須干戈應以湯武時須揖讓應以堯舜故千變萬化接物隨時讓爭之跡不可執留也白公名勝楚平王之孫太子建之子也平王用費無忌之言納秦女而疏太子太子奔鄭娶鄭女而生勝太傅伍奢被殺子胥奔吳勝從奔吳與胥耕於野楚令尹子西迎勝歸國封於白邑僭號稱公勝以鄭人殺父請兵報讎頻請不允遂起兵反楚遣葉公子高伐而滅之故曰白公爭而滅而王往況反白公名勝楚平王之孫白縣尹僭稱公作亂而死事見左傳哀公十六年爭讓文武也堯桀是非也若經緯天地則賤武而貴文若克定禍亂則賤文而貴武是以文武之道貴賤有時而是非之行亦用舍何定故爭讓之禮於堯舜湯武之時則貴於之噲白公之時則賤不可常也梁屋梁也麗屋棟也衝擊也窒塞也言梁棟大可用作攻擊城隍不可用塞於鼠穴言其器用大小不同也梁麗司馬李音禮一音如字司馬云梁麗小船也崔云屋棟也慶藩案初學記二十五引司馬云麗小船也與釋文小異俞樾曰司馬云梁麗小船也崔云屋棟也然小船與屋棟皆非所以衝城詩皇矣篇與爾臨衝毛傳曰臨臨車也衝衝車也正義曰兵書有作臨車衝車之法墨子有備衝之篇知臨衝俱是車也然則此云可以衝城其為是車明矣徐無鬼篇君亦必無陳鶴列於麗譙之間郭注曰麗譙高樓也司馬曰麗譙樓觀名也此所云梁麗疑是車之有樓者若左傳所稱樓車矣文選辨亡論衝棚息於朔野李善注曰字略作樓也可為衝車有樓之證慶藩案司馬訓梁麗為小船非也俞氏以為樓車亦近附會攷列子湯問篇雍門鬻歌餘音繞梁欐三日不絕梁欐即此所云梁麗也力命篇居則連欐文選司馬長卿上林賦連捲欐佹司馬彪注欐佹支也欐者附著佹者交午欐與麗同廣韻麗著也玉篇麗偶也柱偶曰麗梁棟相附著亦曰麗正謂椽柱之屬當從崔說為勝為梁麗必材之大者故可用以衝城不當泥視窒珍悉反爾雅云塞也崔李同說文都節反騏驥驊騮並古之良馬也捕捉也狸狌野貓也夫良馬駿足日馳千里而捕捉小鼠不及狸狌是技藝不同不可一概而取者也騏音其驥音冀驊戶花反騮音留李云騏驥驊騮皆駿馬也捕音步本又作搏徐音付狸力之反狌音姓向同又音生崔本作鼬由又反殊技其綺反就其殊而任之則萬物莫不當也鴟鵂鶹也亦名隻狐是土梟之類也晝則眼暗夜則目明故夜能撮捉蚤蝨密視秋毫之末晝出瞋張其目不見丘山之形是知物性不同豈直鴟鵂而已故隨其性而安之則物無不當也鴟尺夷反崔云鴟鵂鶹與委梟同夜撮七括反崔本作最音同蚤音早說文跳蟲齧人者也淮南子鴟夜聚蚤察分毫末許慎云鴟夜聚食蚤蝨不失也司馬本作音文云鴟鵂鶹夜取食今郭本亦有作者崔本作爪云鵂鶹夜聚人爪於巢中也王引之曰鵂字涉釋文內鴟鵂鶹而衍埤雅引此已誤案釋文曰鴟尺夷反崔云鴟鵂鶹而不為鵂字作音則正文內本無鵂字明矣淮南主術篇亦云鴟夜撮蚤慶藩案爪蚤通用故崔本作爪蚤字形相近故司馬本作淮南主術篇高注鴟鴟鵂也謂之老菟夜鳴人屋上也夜則目明合聚人爪以著其巢中故曰察分秋毫晝則無所見故曰形性詭也許注曰鴟夜聚食蚤蝨不失也撮蚤之說許高異議王引之云揆之事理當以許注為雅馴瞋尺夷反向處辰反司馬云張也崔音眩又師慎反本或作瞑慶藩案釋文瞋或作瞑疑作瞑者是也說文瞋怒目也瞑合目也瞑目則無所見矣隸書或作真冥或作形相似而誤管子小問篇桓公瞋目而視祝鳧已韓子守道篇瞋目切齒傾耳淮南道應篇瞋目敝然攘臂拔劍今本瞋並誤瞑皆其例夫天地之理萬物之情以得我為是失我為非適性為治失和為亂然物無定極我無常適殊性異便是非無主若以我之所是則彼不得非此知我而不見彼者耳故以道觀者於是非無當也付之天均恣之兩行則殊方異類同焉皆得也蓋不盡之辭也師猶師心也夫物各師其心妄為偏執將己為是不知他以為非將我為治不知物以為亂故師心為是不見己上有非師心為治謂言我身無亂豈知治亂同源是非無主故治亂同源者天地之理也是非無主者萬物之情也暗於斯趣故言未明也師是或云師順也師治直吏反注皆同夫天地陰陽相對而有若使有天無地則萬物不成有陰無陽則蒼生不立是知師是而無非師治而無亂者必不可行明矣天地陰陽對生也是非治亂互有也將奚去哉若夫師是而無非師天而無地語及於此而不捨於口者若非至愚之人則是故為誣罔不舍音捨下同帝五帝也王三王三代夏殷周禪授也繼續也或宗族相承或讓與他姓故言殊禪也或父子相繼或興兵篡弒故言殊繼也或遲速差互不合天時或氓俗未歸逆於人事是以之噲慕堯舜以絕嗣白公效湯武以滅身如此之流謂之篡奪也篡夫初患反取也下如字夫干戈揖讓事跡不同用捨有時不可常執至如湯武興兵唐虞揖讓上符天道下合人心如此之徒謂之為義也俗之所貴有時而賤物之所大世或小之故順物之跡不得不殊斯五帝三王之所以不同也河伯未能會理故海若訶使忘言默默莫聲幸勿辭費也夫小大無主貴賤無門物情顛倒妄為臧否故女於何推逐而知貴賤大小之家門乎言其不知也女惡音汝後放此下音烏闕誤引張君房本篡下有之字之字依世德堂本補重累二字依文選注改疪字依管子改河伯曰然則我何為乎何不為乎吾辭受趣舍吾終奈何奈何猶如何也河伯雖領高義而未達旨歸故更請決疑遲聞解釋我欲處涉人世攝衛修道於何事而可為乎於何事而不可為乎及辭讓受納進趣退舍眾諸物務其事云何願垂告誨終身奉遵北海若曰以道觀之何貴何賤是謂反衍無拘而志與道大蹇何少何多是謂謝施無一而行與道參差嚴乎若國之有君其無私德繇繇乎若祭之有社其無私福泛泛乎其若四方之無窮其無所畛域兼懷萬物其孰承翼是謂無方萬物一齊孰短孰長道無終始物有死生不恃其成一虛一滿不位乎其形年不可舉時不可止消息盈虛終則有始是所以語大義之方論萬物之理也物之生也若驟若馳無動而不變無時而不移何為乎何不為乎夫固將自化貴賤之道反覆相尋反衍猶反覆也夫貴賤者生乎妄執也今以虛通之理照之則貴者反賤而賤者復貴故謂之反衍也反衍如字又以戰反崔云無所貴賤乃反為美也本亦作畔衍李云猶漫衍合為一家慶藩案文選左太沖蜀都賦注引司馬作叛衍云叛衍猶漫衍也釋文闕反覆芳服反自拘執則不夷於道而汝也夫修道之人應須放任而汝乃拘執心志矜而持之故與虛通之理蹇而不夷也與道大蹇向紀輦反徐紀偃反本或作與天道蹇崔本蹇作浣云猶洽也隨其分故所施無常謝代也施用也夫物或聚少以成多或散多以為少故施用代謝無常定也謝施如字司馬云謝代也施用也崔云不代其德是謂謝施不能隨變則不齊於道夫代謝施用多少適時隨機變化故能齊物若執一為行則與理不冥者也參初林反差初宜反公當而已體道之士望之儼然端拱萬乘楷模於物群彼萬國宗仰一君亭毒黎元必無私德也嚴乎魚檢反又如字天下之所同求繇繇長之貌也若眾人之祭社稷而社稷無私福於人也繇繇音由泛泛然無所在泛泛普遍之貌也夫至人立志周普無偏接濟群生泛愛平等譬東西南北曠遠無窮量若虛空豈有畛界限域也泛泛孚劍反字又作汎畛之忍反域于逼反舊于目反掩御群生反之分內而平往者也豈扶疏而承翼哉懷藏也孰誰也言大聖慈悲兼懷庶品平往而已終無偏愛誰復有心拯赦而接承扶翼者也無方故能以萬物為方譬彼明鏡方茲幽谷逗機百變無定一方也莫不皆足萬物參差亭毒唯一鳧鶴長短分足性齊死生者無窮之變耳非終始也虛通之道無終無始執滯之物妄計死生故老經云迎不見其首隨不見其後成無常處應物無方超然獨化豈假待對而後生成也不以形為位而守之不變譬彼陰陽春生秋殺盈虛變化榮落順時豈執守形骸而拘持名位邪欲舉之令去而不能令去力呈反欲止之使停又不可夫年之夭壽時之促出乎天理蓋不由人故其來也不可舉而令去其去也不可止而令住俱當任之未始非我也變化日新未嘗守故夫陰消陽息夏盈冬虛氣序循環終而復始混成之道變化日新循理直前無勞措意也前來所辨海若之談正是語大道之義方論萬物之玄理者也但當就用耳夫生滅流謝運運不停其為迅速如馳如驟是百年倏忽何足介懷也故不可執而守夫流動變化時代遷移迅若交臂驟如過隙故未有語動而不變化言時而不遷移也若有為不為於其閒則敗其自化矣萬物紛亂同稟天然安而任之必自變化何勞措意為與不為趙諫議本作汎趙本之下有一字河伯曰然則何貴於道邪以其自化若使為與不為混一則凡聖之理均齊既任變化之自然又何貴於至道河伯更起斯問遲以所疑北海若曰知道者必達於理達於理者必明於權明於權者不以物害己至德者火弗能熱水弗能溺寒暑弗能害禽獸弗能賊非謂其薄之也言察乎安危寧於禍福謹於去就莫之能害也故曰天在內人在外德在乎天知天人之行本乎天位乎得蹢而屈伸反要而語極知道者知其無能也無能也則何能生我我自然而生耳而四支百體五藏精神已不為而自成矣又何有意乎生成之後哉達乎斯理者必能遣過分之知遺益生之情而乘變應權故不以外傷內不以物害己而常全也夫能知虛通之道者必達深玄之實理達深玄之實理者必明於應物之權智既明權實之無方故能安排而去化死生無變於己何外物之能害哉答河伯之所疑次明至道之可貴五藏才浪反夫心之所安則危不能危意無不適故苦不能苦也至德者謂得至道之人也雖復和光混世處俗同塵而不為四序所侵不為三災所害既得之於內故外不能賊此明解道之可貴也雖心所安亦不使犯之薄輕也所以水火不侵禽獸不害者惟心所安則傷不能傷也既不違避亦不輕犯之也其薄如字崔云謂以體著之知其不可逃也所以傷不能傷者正言審察乎安危順之而不可逃處之而常適也安乎命之所遇寧安也禍窮塞也福通達也至德之人唯變所適體窮通之有命達禍福之無門故所樂非窮通而所遇常安也審去就之非己謹去就之無定審取舍之有時雖復順物遷移而恆居至當者不以害為害故莫之能害一於安危冥於禍福與化俱往故物莫能傷此總結以前無害之義天然在內而天然之所順者在外故大宗師云知天人之所為者至矣明內外之分皆非為也天然之性韞之內心人事所順涉乎外跡皆非為也任之自然故物莫之害矣恣人任知則流蕩失素也至德之美在乎天然若恣人任知則流蕩天性此天然之知自行而不出乎分者也故雖行於外而常本乎天而位乎得矣此真知也位居處也運真知而行於世雖涉於物千變萬化而恆以自然為本居於虛極而不喪其性動而寂者也之行如字與機會相應者有斯變也蹢進退不定之貌也至人應世隨物污隆或屈或伸曾無定執趣冥會以逗機宜蹢丈益反又持革反丈綠反又音濁屈伸音申知雖落天地事雖接萬物而常不失其要極故天人之道全也雖復混跡人閒而心恆凝靜常居樞要而反本還源所有語言皆發乎虛極動不乖寂語不乖默也反要於妙反闕誤引江南古藏本天作乎曰何謂天何謂人河伯未達玄妙更起此疑問天人之道庶希後答北海若曰牛馬四足是謂天落馬首穿牛鼻是謂人故曰無以人滅天無以故滅命無以得殉名謹守而勿失是謂反其真人之生也可不服牛乘馬乎服牛乘馬可不穿落之乎牛馬不辭穿落者天命之固當也苟當乎天命則雖寄之人事而本在乎天也夫牛馬稟於天自然有四腳非關人事故謂之天羈勒馬頭貫穿牛鼻出自人意故謂之人然牛鼻可穿馬首可絡不知其爾莫辨所由事雖寄乎人情理終歸乎造物欲顯天人之一道故託牛馬之二獸也穿落之可也若乃走作過分驅步失節則天理滅矣夫因自然而加人事則羈絡之可也若乃穿馬絡牛乖於造化可謂逐人情之矯偽滅天理之自然不因其自為而故為之者命其安在乎夫率性乃動動不過分則千里可致而天命全矣若乃以駑勵驥而驅馳失節斯則以人情事故毀滅天理危亡旦夕命其安在乎豈唯馬牛萬物皆爾所得有常分殉名則過也夫名之可殉者無涯性之所得者有限若以有限之得殉無涯之名則天理滅而性命喪矣真在性分之內夫愚智夭壽窮通榮辱稟之自然各有其分唯當謹固守持不逐於物得於分內而不喪於道者謂反本還源復於真性者也此一句總結前玄妙之理也夔憐蚿蚿憐蛇蛇憐風風憐目目憐心憐是愛尚之名夔是一足之獸其形如足似人腳而迴踵向前也山海經云東海之內有流波之山其山有獸狀如牛蒼色無角一足而行聲音如雷名之曰夔昔黃帝伐蚩尤以夔皮冒鼓聲聞五百里也蚿百足蟲也夔則以少企多故憐蚿蚿則以有羨無故憐蛇蛇則以小企大故憐風風則以暗慕明故憐目目則以外慕內故憐心欲明天地萬物皆稟自然明暗有無無勞企羨放而任之自合玄道倒置之徒妄心希慕故舉夔等之麤事以明天機之妙理又解憐哀愍也夔以一足而跳躑憐蚿眾足之煩勞蚿以有足而安行哀蛇無足而辛苦蛇有形而適樂愍風無質而冥昧風以飄颻而自在憐目域形而滯著目以在外而明顯憐心處內而暗塞欲明物情顛倒妄起哀憐故託夔蚿以救其病者也夔求龜反一足獸也李云黃帝在位諸侯於東海流山得奇獸其狀如牛蒼色無角一足能走出入水即風雨目光如日月其音如雷名曰夔黃帝殺之取皮以冒鼓聲聞五百里憐音蓮蚿音賢又音玄司馬云馬蚿蟲也廣雅云蛆渠馬蚿蚿憐蛇蛇憐風風憐目目憐心司馬云夔一足蚿多足蛇無足風無形目形綴於此明流於彼心則質幽為神遊外夔謂蚿曰吾以一足踸踔而行予無如矣今子之使萬足獨奈何踸踔跳躑也我以一足跳躑快樂而行天下簡易無如我者今子驅馳萬足豈不劬勞如何受生獨異於物發此疑問庶顯天機也足今敕甚反郭菟減反一音初稟反卓本亦作踔同敕角反李云卓行貌盧文弨曰今本卓作踔慶藩案卓獨立也與踔聲義同漢書河間獻王傳卓爾不群說苑君道篇踔然獨立踔敕角切說文竹角切特止也徐鍇繫傳特止卓立也通作趠逴廣雅趠絕也李善西都賦注逴救角切躒猶超絕也義並同蚿曰不然子不見夫唾者乎噴則大者如珠小者如霧雜而下者不可勝數也今予動吾天機而不知其所以然夫唾而噴者實無心於大小而大小之質自分故大者如珠璣小者如濛霧散雜而下其數難舉今蚿之眾足乃是天然機關運動而行未知所以無心自張有同噴唾夔以人情起問蚿以天機直答必然之理於此自明也唾吐臥反噴普悶反又芳奔反又孚問反如霧音務郭武貢反可勝音升慶藩案文選陸士衡文賦注引司馬云天機自然也釋文闕趙諫議本無也字蚿謂蛇曰吾以眾足行而不及子之無足何也蚿以眾足而遲蛇以無足而速然遲速有無稟之造化欲明斯理故發此疑問蛇曰夫天機之所動何可易邪吾安用足哉物之生也非知生而生也則生之行也豈知行而行哉故足不知所以行目不知所以見心不知所以知俛然而自得矣遲速之節聰明之鑒或能或否皆非我也而惑者因欲有其身而矜其能所以逆其天機而傷其神器也至人知天機之不可易也故捐聰明棄知慮魄然忘其所為而任其自動故萬物無動而不逍遙也天然機關有此動用遲速有無不可改易無心任運何用足哉俛然亡本反趙諫議本無也字趙本無哉故二字趙本無也字蛇謂風曰予動吾脊脅而行則有似也今子蓬蓬然起於北海蓬蓬然入於南海而似無有何也脅肋也蓬蓬風聲也亦塵動貌也蛇既無足故行必動於脊脅也似像也蛇雖無足而有形像風無形像而鼓動無方自北徂南擊揚溟海無形有力竊有所疑故陳此問庶聞後答也蓬蓬步東反徐扶公反李云風貌家世父曰玉篇似肖也所以行者足也動吾脊脅而行無足而猶肖夫足也有形則有肖無形則亦無所肖也風曰然予蓬蓬然起於北海而入於南海也然而指我則勝我我亦勝我雖然夫折大木蜚大屋者唯我能也故以眾小不勝為大勝也為大勝者唯聖人能之恣其天機無所與爭斯小不勝者也然乘萬物御群材之所為使群材各自得萬物各自為則天下莫不逍遙矣此乃聖人所以為大勝也風雖自北徂南擊揚溟海然人以手指撝於風風即不能折指以腳踏於風風亦不能折腳此小不勝也然而飄風卒起羊角乍騰則大廈為之飛揚櫟社以之摧折此大勝也譬達觀之士穢跡揚波混愚智於群小之間泯是非於囂塵之內此眾小不勝也而亭毒蒼生造化區宇同二儀之覆載等三光之照燭此大勝也非下凡之所解唯聖人獨能之亦有作字者藉蓋也今不用此解也音秋李云藉也藉則削也本又作子六反又七六反迫也家世父曰李軌云藉也藉則削也本作指者手嚮之者足蹴之荀子強國篇巨楚縣吾前大燕吾後勁魏鉤吾右楊倞注踧也言蹴踏於後也折大之舌反蜚大音飛又扶貴反趙諫議本無者也二字趙本無莫不二字趙本無乃字蓋字依釋文刪孔子遊於匡宋人圍之數而絃歌不惙子路入見曰何夫子之娛也輟止也宋當為衛字之誤也匡衛邑也孔子自魯適衛路經匡邑而陽虎曾侵暴匡人孔子貌似陽虎又孔子弟子顏剋與陽虎同暴匡邑剋時復與孔子為御匡人既見孔子貌似陽虎復見顏剋為御謂孔子是陽虎重來所以興兵圍繞孔子達窮通之命故絃歌不止也孔子遊於匡宋人圍之數色主反子合反司馬云宋當作衛匡衛邑也衛人誤圍孔子以為陽虎虎嘗暴於匡人又孔子弟子顏剋時與虎俱後剋為孔子御至匡匡人共識剋又孔子容貌與虎相似故匡人共圍之不惙本又作輟同丁劣反娛樂也匡人既圍理須憂懼而絃歌不止何故如斯不達聖情故起此問本亦有作虞字者虞憂也怪夫子憂虞而絃歌不止入見賢遍反趙諫議本作輟孔子曰來吾語女我諱窮久矣而不免命也求通久矣而不得時也當堯舜而天下無窮人非知得也當桀紂而天下無通人非知失也時勢適然夫水行不避蛟龍者漁父之勇也陸行不避兕虎者獵夫之勇也白刃交於前視死若生者烈士之勇也知窮之有命知通之有時臨大難而不懼者聖人之勇也由處矣吾命有所制矣將明時命之固當故寄之求諱諱忌也拒也窮否塞也通泰達也夫子命仲由來語其至理云我忌於窮困而不獲免者豈非天命也求通亦久而不能得者不遇明時也夫時命者其來不可拒其去不可留故安而任之無往不適也夫子欲顯明斯理故寄之窮諱而實無窮諱也吾語魚據反無為勞心於窮通之間夫生當堯舜之時而天下太平使人如器恣其分內故無窮塞當桀紂之時而天下暴亂物皆失性故無通人但時屬夷險勢使之然非關運知有斯得失也情各有所安情有所安而忘其怖懼此起譬也蛟音交漁父音甫兕徐履反聖人則無所不安聖人知時命達窮通故勇敢於危險之中而未始不安也此合喻也大難乃旦反命非己制故無所用其心也夫安於命者無往而非逍遙矣故雖匡陳羑里無異於紫極閒堂也處安息也制分限也告敕子路令其安心我稟天命自有涯分豈由人事所能制哉閒堂音閑闕誤引江南古藏本作遇闕誤引張君房本堯舜下有之時二字下句桀紂下同無幾何將甲者進辭曰以為陽虎也故圍之今非也請辭而退無幾何俄頃之時也既知是宣尼非關陽虎故將帥甲士前進拜辭遜謝錯誤解圍而退也無幾居起反將甲如字本亦作持甲公孫龍問於魏牟曰龍少學先王之道長而明仁義之行合同異離堅白然不然可不可困百家之知窮眾口之辯吾自以為至達已今吾聞莊子之言汒焉異之不知論之不及與知之弗若與今吾無所開吾喙敢問其方姓公孫名龍趙人也魏牟魏之公子懷道抱德厭穢風塵先王堯舜禹湯之跡也仁義五德之行也孫龍稟性聰明率才弘辯著守白之論以博辯知名故能合異為同離同為異可為不可然為不然難百氏之書皆困窮眾口之辯咸屈生於衰周一時獨步弟子孔穿之徒祖而師之擅名當世莫與爭者故曰矜此學問達於至妙忽逢莊子猶若井蛙也公孫龍問於魏牟司馬云龍趙人牟魏之公子少學詩照反長而張丈反之行下孟反之知音智喙口也方道也孫龍雖善於言辯而未體虛玄是故聞莊子之言汒焉怪其奇異方覺己之學淺始悟莊子語深豈直議論不如抑亦智力不逮所以自緘其口更請益於魏牟汒焉莫剛反郭音莽論之力困反及與音余下助句放此所開如字本亦作關兩通本或作閡吾喙許穢反又昌銳反公子牟隱机大息仰天而笑曰子獨不聞夫埳井之蛙乎謂東海之鱉曰吾樂與出跳梁乎井幹之上入休乎缺甃之崖赴水則接腋持頤蹶泥則沒足滅跗還虷蟹與科斗莫吾能若也且夫擅一壑之水而跨跱埳井之樂此亦至矣夫子奚不時來入觀乎東海之鱉左足未入而右膝已縶矣於是逡巡而卻告之海曰夫千里之遠不足以舉其大千仞之高不足以極其深禹之時十年九潦而水弗為加益湯之時八年七旱而崖不為加損夫不為頃久推移不以多少進退者此亦東海之大樂也於是埳井之蛙聞之適適然驚規規然自失也公子體道清高超然物外識孫龍之淺辯鑒莊子之深言故仰天歎息而嗤笑舉蛙鱉之兩譬明二子之勝負埳井猶淺井也蛙蝦蟆也幹井欄也甃井中累塼也跗腳趺也還顧視也虷井中赤蟲也亦言是到結蟲也蟹小螃蟹也科斗蝦蟆子也腋臂下也頤口下也東海之鱉其形弘巨隨波游戲暫居平陸而蝦蟆小蟲處於淺井形容既劣居處不寬謂自得於井中見巨鱉而不懼云我出則跳躑乎井欄之上入則休息乎破磚之涯游泳則接腋持頤蹶泥則滅趺沒足顧瞻蝦蟹之類俯視科斗之徒逍遙快樂無如我者也隱機於靳反大息音泰埳井音坎郭音陷之蛙本又作蛙也戶蝸反司馬云埳井壞井也蛙水蟲形似蝦蟆慶藩案荀子正論篇注引司馬云蛙蝦蟆類也與釋文小異之鱉必滅反字亦作鱉吾樂音洛下之樂大樂同跳音條井幹古旦反司馬云井欄也褚詮之音西京賦作韓音慶藩案文選班孟堅西都賦注引司馬云井幹井欄也積木有若欄也謝元暉同謝諮議銅雀臺詩注引司馬云幹井欄然井幹臺之通稱也互有異同並視釋文所引為詳又案幹當從木作榦說文正篆作井垣也漢書枚乘傳單極之斷榦晉灼曰榦井上四交之榦甃側救反李云如闌以塼為之著井底闌也字林壯繆反云井壁也赴水如字司馬本作踣云赴也盧文弨曰赴疑是仆字蹶其月反又音厥泥則沒足滅跗方于反郭音附司馬云滅沒也跗足跗也李云言踊躍於塗中還音旋司馬云顧視也虷音寒井中赤蟲也一名蜎爾雅云蜎蠉郭注云井中小蛣赤蟲也蜎音求兗反蠉音況兗反蛣音吉厥蟹戶買反科斗苦禾反科斗蝦蟆子也此猶小鳥之自足於蓬蒿擅專也跱安也蛙呼鱉為夫子言我獨專一壑之水而安埳井之樂天下至足莫甚於斯處所雖陋可以游涉夫子何不暫時降步入觀下邑乎以此自多矜夸於鱉也夫擅市戰反專也一壑火各反明大之不游於小非樂然縶拘也埳井狹小海鱉巨大以小懷大理不可容故右膝纔下而已遭拘束也已縶豬立反司馬云拘也三蒼云絆也非樂音岳又五教反逡巡從容也七尺曰仞鱉既左足未入右膝拘於是逡巡卻退告蛙大海之狀夫世人以千里為遠者此未足以語海之寬大以千仞為高者亦不足極海之至深言海之深大非人所測度以埳井為至無乃劣乎逡七旬反頃少時也久多時也推移變改也堯遭洪水命禹治之有功故稱禹時也而堯十年之中九年遭潦殷湯八歲之間七歲遭旱而旱而崖不加損潦亦水不加益是明滄波浩汗溟渺深弘不為頃久推移豈由多少進退東海之樂其在茲乎九潦音老弗為于偽反下同頃久司馬云猶早晚也以小羨大故自失適適驚怖之容規規自失之貌蛙擅埳井之美自言天下無過忽聞海鱉之談茫然喪其所謂是以適適規規驚而自失也而公孫龍學先王之道篤仁義之行困百家之知窮眾口之辯忽聞莊子之言亦猶井蛙之逢海鱉也適適始赤反又丈革反郭菟狄反規規如字又虛役反李徐紀睡反適適規規皆驚視自失貌趙諫議本蛙作蛙世德堂本跳上無出字闕誤同引江南古藏本作出跳無梁字且夫知不知是非之竟而猶欲觀於莊子之言是猶使蚊負山商蚷馳河也必不勝任矣且夫知不知論極妙之言而自適一時之利者是非埳井之蛙與且彼方跐黃泉而登大皇無南無北奭然四解淪於不測無東無西始於玄冥反於大通子乃規規然而求之以察索之以辯是直用管闚天用錐指地也不亦小乎子往矣且子獨不聞夫壽陵餘子之學行於邯鄲與未得國能又失其故行矣直匍匐而歸耳今子不去將忘子之故失子之業物各有分不可強相希效商蚷馬蚿也亦名商距亦名且渠孫龍雖復聰明性識但是俗知非真知也故知未能窮於是非之境而欲觀察莊子至理之言者亦何異乎使蚊子負於丘山商蚷馳於河海而力微負重智小謀大故必不勝任也之竟音境後同蚊音文商蚷音渠郭音巨司馬云商蚷蟲名北燕謂之馬蚿一本作蜄徐市軫反不勝音升可強其丈反孫龍所學心知狹淺何能議論莊子窮微極妙之言耶祇可辯析是非適一時之名利耳以斯為道豈非井之蛙乎此結譬也言其無不至也跐踰也亦極也大皇天也玄冥妙本也大通應跡也夫莊子之言窮理性妙能仰登旻蒼之上俯極黃泉之下四方八極奭然無礙此智隱沒不可測量始於玄極而其道杳冥反於域中而大通於物也方跐音此郭時紫反又側買反廣雅云蹋也蹈也履也司馬云測也大皇音泰奭然音釋四解戶買反慶藩案無東無西失其韻矣今本乃後人妄改之也王念孫曰無東無西當作無西無東與通為韻案大雅皇矣篇同爾弟兄與王方為韻而今作同爾兄弟逸周書周祝篇惡姑柔剛與明陽長為韻而今作剛柔管子內業篇能無卜筮而知凶吉乎與一為韻而今作吉凶文選鵩鳥賦或趨西東與同為韻而今作東西答客難外有廩倉與享為韻而今作倉廩皆後人不達古音任意而妄改之者也夫遊無窮者非察辯所得索之所白反非其任者去之可也規規經營之貌也夫以觀察求道言辯率真雖復規規用心而去之遠矣譬猶以管闚天詎知天之闊狹用錐指地寧測地之淺深莊子道合二儀孫龍德同錐管智力優劣如此之懸既其不如宜其速去矣以此效彼兩失之壽陵燕之邑邯鄲趙之都弱齡未壯謂之餘子趙都之地其俗能行故燕國少年遠來學步既乖本性未得趙國之能捨己效人更失壽陵之故是以用手據地匍匐而還也壽陵餘子司馬云壽陵邑名未應丁夫為餘子邯音寒鄲音丹邯鄲趙國都也慶藩案餘子民之子弟周禮小司徒凡國之大事致民大故致餘子鄭司農云餘子謂羨也以其羨卒也蓋國之大事則致正卒大故則并羨卒而致之也逸周書糶匡篇成年餘子務蓺年儉餘子務穡年餘子倅務運漢書食貨志餘子亦在於序室蘇林曰未任役為餘子即司馬未應丁夫是也匍音蒲又音符匐蒲北反又音服莊子道冠重玄獨超方外孫龍雖言辯弘博而不離域中故以孫學莊談終無得理若使心生企尚躊躇不歸必當失子之學業忘子之故步此合喻也趙諫議本有也字年饑餘子倅運句依逸周書原文改公孫龍口呿而不合舌舉而不下乃逸而走呿開也逸奔也前聞莊子之談過視聽之表復見魏牟之說更超言象之外內殊外隔非孫龍所知故口開而不能合舌舉而不能下是以心神恍惚形體奔馳也口呿起據反司馬云開也李音袪又巨劫反莊子釣於濮水楚王使大夫二人往先焉曰願以境內累矣濮水名也屬東郡今濮州濮陽縣是也楚王楚威王也莊生心處無為而寄跡綸釣楚王知莊生賢達屈為卿輔是以齎持玉帛爰發使命詣於濮水先述其意願以國境之內委託賢人王事殷繁不無憂累之也濮水音卜陳地水也楚王司馬云威王也先焉先謂宣其言也莊子持竿不顧曰吾聞楚有神龜死已三千歲矣王巾笥而藏之廟堂之上此龜者寧其死為留骨而貴乎寧其生而曳尾於塗中乎龜有神異故刳之而卜可以決吉凶也盛之以笥覆之以巾藏之廟堂用占國事珍貴之也問此龜者寧全生遠害曳尾於泥塗之中豈欲刳骨留名取貴廟堂之上邪是以莊生深達斯情故敖然而不顧之矣巾笥息嗣反或音司而藏之李云藏之以笥覆之以巾二大夫曰寧生而曳尾塗中大夫率性以答莊生適可生而曳尾不能死而留骨也莊子曰往矣吾將曳尾於塗中性各有所安也莊子保高尚之遐志貴山海之逸心類澤雉之養性同泥龜之曳尾是以令使命之速往庶全我之無為也惠子相梁莊子往見之或謂惠子曰莊子來欲代子相於是惠子恐搜於國中三日三夜姓惠名施宋人為梁惠王之相惠施博識贍聞辯名析理既是莊生之友故往訪之惠子相息亮反下同梁相梁惠王梁國之人或有來者知莊子才高德大王必禮之國相之位恐有爭奪故謂惠子欲代之言相也揚兵整旅惠施聞國人之言將為實錄心靈恐怖慮有阽危故揚兵整旅三日三夜搜索國中尋訪莊子子恐丘勇反字又作搜或作廋所求反李悉溝反云索也說文云求也盧文弨曰今本作搜相字依正文改莊子往見之曰南方有鳥其名為鵷鶵子知之乎夫鵷鶵發於南海而飛於北海非梧桐不止非練實不食非醴泉不飲於是鴟得腐鼠鵷鶵過之仰而視之曰嚇今子欲以子之梁國而嚇我邪鵷鶵鸞鳳之屬亦言鳳子也練實竹食也醴泉泉甘味如醴也嚇怒而拒物聲也惠施恐莊子奪己故整旅揚兵莊子因往見之為其設譬夫鳳是南方之鳥來儀應瑞之物非梧桐不止非溟海不停非竹實不食非醴泉不飲而凡猥之鳶偶得臭鼠自美其味仰嚇鳳凰譬惠施滯溺榮華心貪國相豈知莊子清高無情爭奪鵷於袁反鶵仕俱反李云鵷鶵乃鸞鳳之屬也醴泉音禮李云泉甘如醴嚇本亦作呼同許嫁反又許伯反司馬云嚇怒其聲恐其奪己也詩箋云以口拒人曰嚇言物嗜好不同願各有極鴟以腐鼠為美仰嚇鵷鶵惠以國相為榮猜疑莊子總合前譬也嗜時志反好呼報反莊子與惠子遊於濠梁之上莊子曰儵魚出遊從容是魚之樂也濠是水名在淮南鍾離郡今見有莊子之墓亦有莊惠遨遊之所石絕水為梁亦言是濠水之橋梁莊惠清談在其上也豪梁本亦作濠音同司馬云濠水名也石絕水曰梁盧文弨曰今本豪作濠儵魚白儵也從容放逸之貌也夫魚遊於水鳥棲於陸各率其性物皆逍遙而莊子善達物情所以故知魚樂也儵魚徐音條說文直留反李音由白魚也爾雅云鮂黑郭注即白儵也一音篠謂白儵魚也盧文弨曰儵當作鯈注同此書內多混用又鮂黑也舊鮂為今據爾雅改正從容七容反魚樂音洛注下皆同惠子曰子非魚安知魚之樂惠施不體物性妄起質疑莊子非魚焉知魚樂莊子曰子非我安知我不知魚之樂欲以起明相非而不可以相知之義耳子非我尚可以知我之非魚則我非魚亦可以知魚之樂也若以我非魚不得知魚子既非我何得知我若子非我尚得知我我雖非魚何妨知魚反而質之令其無難也惠子曰我非子固不知子矣子固非魚也子之不知魚之樂全矣舍其本言而給辯以難也惠非莊子故不知莊子莊必非魚何得知魚之樂不樂不知之義於此無虧捨其本宗給辯以難以難乃旦反莊子曰請循其本子曰汝安知魚樂云者既已知吾知之而問我我知之濠上也循猶尋也惠施給辯有言無理棄初逐末失其論宗請尋其源自當無難循本之義列在下文尋惠子之本言云非魚則無緣相知耳今子非我也而云汝安知魚樂者是知我之非魚也苟知我之非魚則凡相知者果可以此知彼不待是魚然後知魚也故循子安知之云已知吾之所知矣而方復問我我正知之於濠上耳豈待入水哉夫物之所生而安者天地不能易其處陰陽不能回其業故以陸生之所安知水生之所樂未足稱妙耳子曰者莊子卻稱惠之辭也惠子云子非魚安知魚樂者足明惠子非莊子而知莊子之不知魚也且子既非我而知我知我而問我亦何妨我非魚而知魚知魚而歎魚夫物性不同水陸殊致而達其理者體其情以濠上彷徨知魚之適樂鑒照群品豈入水哉故寄莊惠之二賢以標議論之大體也方復扶又反其處昌慮反闕誤引張君房本子上有且字
