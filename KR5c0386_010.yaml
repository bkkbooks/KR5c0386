body:
  text: 內篇應帝王第七夫無心而任乎自化者應為帝王也崔云行不言之教使天下自以為牛馬應為帝王者也齧缺問於王倪四問而四不知齧缺因躍而大喜行以告蒲衣子四問而四不知則齊物篇中四問也夫帝王之道莫若忘知故以此義而為篇首老子云不以智治國國之德者也齧缺五結反下丘悅反王倪五兮反四問而四不知向云事在齊物論中蒲衣子曰而乃今知之乎有虞氏不及泰氏有虞氏其猶藏仁以要人亦得人矣而未始出於非人泰氏其臥徐徐其覺于于一以己為馬一以己為牛其知情信其德甚真而未始入於非人蒲衣子堯時賢人年八歲舜師之讓位不受即被衣子也齧缺得不知之妙旨仍踴躍而喜歡走以告於蒲衣子述王倪之深義蒲衣是方外之大賢達忘言之至道理無知而固久汝今日乃知也蒲衣子尸子云蒲衣八歲舜讓以天下崔云即被衣王倪之師也淮南子曰齧缺問道於被衣夫有虞氏之與泰氏皆世事之跡耳非所以跡者也所以跡者無跡也世孰名之哉未之嘗名何勝負之有耶然無跡者乘群變履萬世世有夷險故跡有不及也有虞氏舜也泰氏即太昊伏羲也三皇之世其俗淳和五帝之時其風澆競澆競則運知而養物淳和則任真而馭宇不及之義此可知也泰氏司馬云上古帝王也崔云帝王也李云大庭氏又云無名之君也慶藩案路史前紀七引司馬云上古之帝王無名之稱與釋文所引小異夫以所好為是人所惡為非人者唯以是非為域者也夫能出於非人之域者必入於無非人之境矣故無得無失無可無不可豈直藏仁而要人也夫舜包藏仁義要求士庶以得百姓之心未是忘懷自合天下故未出於是非之域亦有作臧字者臧善也善於仁義要求人心者也藏仁才剛反崔云懷仁心以結人也本亦作臧作剛反善也簡文同以要一遙反注同家世父曰有人之見存而要人之仁行焉無人之見存出入鳥獸之群而不亂其人也乎相遇泯泯之中而奚以要人為出於非人忘非我之分矣入於非人人我之分之兩忘者不以心應焉為馬為牛非獨忘人也亦忘己也所好呼報反所惡烏路反之竟音境徐徐寬緩之貌于于自得之貌伏犧之時淳風尚在故臥則安閒而徐緩覺則歡娛而自得也徐徐如字崔本作袪袪其覺古孝反于于如字司馬云徐徐安穩貌于于無所知貌簡文云徐徐于于寐之狀也慶藩案于于即盱盱也說文盱張目也于與盱聲近義同淮南俶真篇萬民睢睢盱盱然魯靈光殿賦鴻荒朴略厥狀睢盱張載曰睢盱質朴之形正與司馬注無所知意相合淮南覽冥篇臥倨倨興盱盱高注曰盱盱無智巧貌也又淮南盱盱作眄眄王氏讀書雜志據諸書證為盱盱之偽亦正與質朴無知同義夫如是又奚是人非人之有哉斯可謂出於非人之域忘物我遺是非或馬或牛隨人呼召人獸尚且無主何是非之有哉任其自知故情信率其真知情無虛矯故實信也任其自得故無偽以不德為德德無所德故不偽者也不入乎是非之域所以絕於有虞之世既率其情其德不偽故能超出心知之境不入是非之域者也趙諫議本藏作臧肩吾見狂接輿狂接輿曰日中始何以語女肩吾接輿已具前解日中始賢人姓名即肩吾之師也既是女師有何告示此是接輿發語以問故也日人實反中音仲亦如字始李云日中始人姓名賢者也崔本無日字云中始賢人也俞樾曰釋文引李云日中始人姓名賢者也此恐不然中始人名日猶云日者也謂日者中始何以語女也文七年左傳日衛不睦襄二十六年傳日其過此也昭七年傳日君以夫公孫段為能任其事十六年傳日起請夫環並與此日字同義李以日中始三字為人姓名失之矣崔本無日字以語魚據反女音汝後皆同肩吾曰告我君人者以己出經式義度人孰敢不聽而化諸式用也教我為君之道化物之方必須己出智以經綸用仁義以導俗則四方氓庶誰不聽從遐遠黎元敢不歸化耶出經絕句司馬云出行也經常也崔云出典法也式義度人絕句式法也崔云式用也用仁義以法度人也王念孫曰釋文曰出經絕句式義度人絕句引諸說皆未協案此當以以己出經式義度為句人孰敢不聽而化諸為句義讀為儀義與儀古字通說文義己之威儀也文侯之命父義和鄭注義讀為儀周官肆師治其禮儀鄭注故書儀為義鄭司農云義讀為儀古者書儀但為義今時所為義為誼小雅楚茨篇禮儀卒度韓詩作義周官大行人大客之儀大戴禮朝事篇作義樂記制之禮義漢書禮樂志作儀周語示民軌儀大射儀注引作義儀法也見周語注淮南精神篇注楚詞九歎注經式儀度皆謂法度也解者失之闕誤引張君房本度人作庶民狂接輿曰是欺德也其於治天下也猶涉海鑿河而使負山也夫聖人之治也治外乎正而後行確乎能其事者而已矣且鳥高飛以避矰弋之害鼷鼠深穴乎神丘之下以避熏鑿之患而曾二蟲之無知以己制物則物失其真夫以己制物物喪其真欺誑之德非實道欺德簡文云欺也夫寄當於萬物則無事而自成以一身制天下則功莫就而任不勝也夫溟海弘博深廣難窮而穿之為河必無成理猶大道遐曠玄絕難知而鑿之為義其功難克又蟲至小山岳極高令其負荷無由勝任以智經綸用仁理物能小謀大其義亦然涉海鑿待洛反下同郭粗鶴反河李云涉海必陷波鑿河無成也音文本亦作同不勝音升全其性分之內而已隨其分內而治之必不分外治物治乎外者言不治之者也各正性命之分也順其正性而後行化不為其所不能確實也順其實性於事有能者因而任之止於分內不論於外者也確乎苦學反李云堅貌崔本作橐音託慶藩案文選劉孝標辯命論注引司馬云確乎不移易釋文闕禽獸猶各有以自存故帝王任之而不為則自成也矰網也弋以繩係箭而射之也鼷鼠小鼠也神丘社壇也鳥則高飛而逃網鼠則深穴而避熏斯皆率性自然豈待教而遠害者也鳥鼠既爾在人亦然故知式義出經誣罔之甚矣矰則能反李云罔也之害崔本作菑鼷音兮熏香云反言汝曾不知此二蟲之各存而不待教乎而汝也汝不曾知此二蟲不待教令而解避害全身者乎既深穴高飛豈無知耶況在人倫而欲出經式義欺矯治物不亦妄哉世德堂本無狂字妄字依世德堂本改世德堂本知作如天根遊於殷陽至蓼水之上適遭無名人而問焉曰請問為天下天根無名並為姓字寓言問答也殷陽殷山之陽蓼水在趙國界內遭遇也天根遨遊於山水之側適遇無名人而問之請問之意在乎天下天根崔本云人姓名也遊於殷陽李云殷山名陽山之陽崔云殷陽地名司馬云殷眾也言向南遊也或作殷湯蓼水音了李云水名也本字依世德堂本及釋文原本刪無名人曰去汝鄙人也何問之不豫也予方將與造物者為人厭則又乘夫莽眇之鳥以出六極之外而遊無何有之鄉以處壙埌之野汝又何帠以治天下感予之心為問為天下則非起於大初止於玄冥也汝是鄙陋之人宜其速去所問之旨甚不悅豫我心不豫司馬云嫌不漸豫太倉卒也簡文云豫悅也盧文弨曰今本作不預俞樾曰爾雅釋詁豫厭也楚詞惜誦篇行婞直而不豫兮王逸注亦曰豫厭也是豫之訓厭乃是古義無名人深怪天根之多問故曰何問之不豫猶云何許子之不憚煩也簡文云豫悅也殊失其義大初音泰任人之自為夫造物為人素分各足何勞作法措意治之既同於大通故任而不助也莽眇群碎之謂耳乘群碎馳萬物故能出處常通而無狹滯之地莽眇深遠之謂壙埌弘博之名鳥則取其無跡輕昇六極猶六合也夫聖人馭世恬淡無為大順物情有同造化若其息用歸本厭離世間則乘深遠之大道凌虛空而滅跡超六合以放任遊無有以逍遙凝神智於射山處清虛於曠野如是則何天下之可為哉蓋無為者也乘夫音符莽莫蕩反崔本作猛眇妙小反莽眇輕虛之狀也崔云猛眇之鳥首也取其行而無跡壙徐苦廣反埌徐力黨反李音浪壙埌無滯為名也崔云猶曠蕩也無狹戶夾反言皆放之自得之場則不治而自治也夫放而任之則物皆自化有何帠術輒欲治之感動我心何為如此帠徐音藝又魚例反司馬云法也一本作寱牛世反崔本作為俞樾曰帠未詳何字以諸說參考之疑帠乃臬字之誤故有魚例反之音而司馬訓法亦即臬之義也然字雖是臬而義則非臬當讀為寱寱本從臬聲古文以聲為主故或止作臬也一本作寱者破假字而為正字耳一切經音義引通俗文曰夢語謂之寱無名人蓋謂天根所問皆夢語也故曰汝又何寱以治天下感予之心為慶藩案一切經音義四分律卷三十二引三蒼云寱歲反謊言也謊言即與夢語無異而自治直吏反下文同世德堂本作預又復問天根未達更請決疑又復扶又反無名人曰汝遊心於淡合氣於漠順物自然而無容私焉而天下治矣其任性而無所飾焉則淡矣於淡徒暫反徐大敢反漠然靜於性而止可遊汝心神於恬淡之域合汝形氣於寂寞之鄉唯形與神二皆虛靜如是則天下不待治而自化者耳於漠音莫任性自生公也心欲益之私也容私果不足以生生而順公乃全也隨造化之物情順自然之本性無容私作法術措意治之放而任之則物我全之矣陽子居見老聃曰有人於此嚮疾強梁物徹疏明學道不如是者可比明王乎姓陽名朱字子居問老子明王之道假且有人素性聰達神智捷疾猶如響應涉事理務強幹果決鑒物洞徹疏通明敏學道精勤曾無懈倦如是之人可得將明王聖帝比德否乎陽子居李云居名也子男子通稱嚮許亮反李許兩反疾強梁崔云所在疾強梁之人也李云敏疾如嚮也簡文云如嚮應聲之疾故是強梁之貌物徹疏明司馬云物事也徹通也事能通而開明也崔云無物不達無物不明不其眷反老聃曰是於聖人也胥易技係勞形怵心者也且虎豹之文來田猿狙之便執斄之狗來藉如是者可比明王乎言此功夫容身不得不足以比聖王若將彼人比聖王無異胥徒勞苦改易形容技術工巧神慮劬勞故形容變改係累故心靈怵惕也胥如字司馬云疏也簡文云相也易音亦崔以豉反云相輕易也簡文同技徐其綺反簡文云藝也係如字崔本作繫或作簡文云音繫盧文弨曰舊作繫與上複今定作見漢書慶藩案鄭注周禮胥徒民給徭役者易讀如孟子易其田疇之易胥易謂胥徒供役治事鄭注檀弓易墓謂治草木易猶治也技係若王制凡執技以事上者不貳事不移官謂為技所繫也釋文云司馬云胥疏也簡文云胥相也並誤怵心敕律反此皆以其文章技能係累其身非涉虛以御乎無方也藉繩也猿狙獮猴也虎豹之皮有文章故來田獵獮猴以跳躍便捷恆被繩拘狗以執捉狐狸每遭係頸若以響疾之人類於聖帝則此之三物可比明王乎來田李云虎豹以皮有文章見獵也田獵也猿音袁狙七餘反之便呲肩反舊扶面反斄音來李音狸崔云旄牛也來藉司馬云藉繩也由捷見結縛也崔云藉繫也也字惟覆宋本作曰今依各本改陽子居蹴然曰敢問明王之治既其失問故驚悚變容重請明王為政其義安在蹴然子六反改容之貌之治直吏反下同老聃曰明王之治功蓋天下而似不自己化貸萬物而民弗恃有莫舉名使物自喜立乎不測而遊於無有者也天下若無明王則莫能自得令之自得實明王之功也然功在無為而還任天下天下皆得自任故似非明王之功夫聖人為政功侔造化覆等玄天載周厚地而功成不處故非己為之也夫明王皆就足物性故人人皆云我自爾而莫知恃賴於明王誘化蒼生令其去惡貸借萬物與其福善而玄功潛被日用不知百姓謂我自然不賴君之能貸吐代反雖有蓋天下之功而不舉以為己名故物皆自以為得而喜莫無也舉顯也推功於物不顯其名使物各自得而懽喜適悅者也居變化之塗日新而無方者也與萬物為體則所遊者虛也不能冥物則迕物不暇何暇遊虛哉無有妙本也樹德立功神妙不測而即跡即本故常遊心於至極也世德堂本令作今鄭有神巫曰季咸知人之死生存亡禍福壽天期以歲月旬日若神鄭人見之皆棄而走列子見之而心醉歸以告壺子曰始吾以夫子之道為至矣則又有至焉者矣鄭國有神異之巫甚有靈驗從齊而至姓季名咸也神巫曰季咸李云女曰巫男曰覡季咸名不自聞死日也占候吉凶必無差失剋定時日驗若鬼神不喜預聞凶禍是以棄而走避也不許忌反列子事跡具逍遙篇今不重解壺子鄭之得道人也號壺子名林即列子之師也列子見季咸小術驗若鬼神中心羨仰恍然如醉既而歸反具告其師心醉向云迷惑於其道也壺子司馬云名林鄭人列子師謂季咸之至又過於夫子夫子壺子也至極也初始稟學先生之道為至今見季咸其道又極於夫子此是禦寇心醉之言也壺子曰吾與汝既其文未既其實而固得道與眾雌而無雄而又奚卵焉而以道與世亢必信夫故使人得而相嘗試與來以予示之與授也既盡也吾比授汝始盡文言於其妙理全未造實汝固執文字謂言得道豈知筌蹄異於魚兔耶既其文李云既盡也得道與音餘言列子之未懷道也夫眾雌無雄無由得卵既文無實亦何道之有哉眾雌而無雄而又奚卵焉司馬云言汝受訓未熟故未成若眾雌無雄則無卵也未懷道則有心有心而亢其一方以必信於世故可得而相之女用文言之道而與世間亢對既無大智必信彼小巫是故季咸得而相女者也世亢苦浪反必信崔云絕句相女息亮反注下同盧文弨曰今本作汝夫至人凝遠神妙難知本跡寂動非凡能測故召令至以我示之也示之本亦作視崔云視示之也闕誤引江南古藏本既作無汝字依世德堂本及盧校改明日列子與之見壺子出而謂列子曰嘻子之先生死矣弗活矣不以旬數矣吾見怪焉見濕灰焉嘻歎聲也子林示其寂泊之容季咸謂其將死先怪已彰不過十日弗活之兆類彼濕灰也嘻徐音熙郭許意反旬數所主反列子入泣涕沾襟以告壺子壺子曰鄉吾示之以地文萌乎不震不正是殆見吾杜德機也嘗又與來萌然不動亦不自正與枯木同其不華濕灰均於寂魄此乃至人無感之時也夫至人其動也天其靜也地其行也水流其止也淵默淵默之與水流天行之與地止其於不為而自爾一也今季咸見其尸居而坐忘即謂之將死睹其神動而天隨因謂之有生誠能應不以心而理自玄符與變化升降而以世為量然後足為物主而順時無極故非相者所測耳此應帝王之大意也文象也震動也地以無心而寧靜故以不動為地文也萌然寂泊曾不震動無心自正類傾頹此是大聖無感之時小巫謂之弗活也而壺丘示見義有四重第一示妙本虛凝寂而不動第二示垂跡應感動而不寂第三本跡相即動寂一時第四本跡兩忘動寂雙遣此則第一妙本虛凝寂而不動也鄉吾許亮反本作曏亦作向同崔本作康云向也地文與土同也崔云文猶理也不震不正並如字崔本作不誫不止云如動不動也俞樾曰列子黃帝篇作罪乎不誫不止當從之罪讀為說文山部作云山貌是也誫即震之異文不誫不止者不動不止也故以乎形容之言與山同也今罪誤作萌誤作失其義矣據釋文則崔本作不誫不止與列子同可據以訂正誠應應對之應後同德機不發曰杜殆近也杜塞也機動也至德之機開而不發示其凝淡便為濕灰小巫庸瑣近見於此矣杜德機崔云塞吾德之機前者伊妄言我死今時重命令遣更來也趙諫議本作曏闕誤引江南古藏本正作止能字依道藏本補止誤作正依諸子平議改明日又與之見壺子出而謂列子曰幸矣子之先生遇我也有瘳矣全然有生矣吾見其杜權矣此即第二垂跡應感動而不寂示以應容神氣微動既殊槁木全似生平而濫以聖功用為己力謬言遇我幸矣有瘳也有瘳丑留反權機也今乃自覺昨日之所見見其杜權故謂之將死也權機也前時一睹有類濕灰杜塞機權全無應動今日遇我方得全生小巫寡識有茲叨濫者也列子入以告壺子壺子曰鄉吾示之以天壤名實不入而機發於踵是殆見吾善者機也嘗又與來天壤之中覆載之功見矣比之地文不猶乎此應感之容也壤地也示之以天壤謂示以應動之容也譬彼兩儀覆載萬物至人應感其義亦然功見賢遍反慶藩案文選陸士衡演連珠注引司馬云壤地也釋文闕任自然而覆載則天機玄應而名利之飾皆為棄物也雖復降跡同塵和光利物而名譽真實曾不入於靈府也常在極上起踵本也雖復物感而動不失時宜而此之神機發乎妙本動而常寂機發而善於彼彼乃見之示其善機應此兩儀季咸見此形容所以謂之為善全然有生則是見善之謂也外字依宋本改明日又與之見壺子出而謂列子曰子之先生不齊吾無得而相焉試齊且復相之此是第三示本跡相即動寂一時夫至人德滿智圓虛心凝照本跡無別動靜不殊其道深玄豈小巫能測耶謂齊其心跡試相之焉不敢的定吉凶故言且復相者耳不齊側皆反本又作齋下同且復扶又反列子入以告壺子壺子曰吾鄉示之以太沖莫勝是殆見吾衡氣機也鯢桓之審為淵止水之審為淵流水之審為淵淵有九名此處三焉嘗又與來居太沖之極浩然泊心而玄同萬方故勝負莫得厝其間也沖虛也莫無也夫聖照玄凝與太虛等量本跡相即動寂一時初無優劣有何勝負哉泊心白博反又音魄得厝七故反字又作措同盧文弨曰今本作措無往不平混然一之以管闚天者莫見其涯故似不齊衡平也即跡即本無優無劣神氣平等以此應機小巫近見不能遠測心中迷亂所以請齊耳管闚去規反淵者靜默之謂耳夫水常無心委順外物故雖流之與止鯢桓之與龍躍常淵然自若未始失其靜默也夫至人用之則行捨之則止行止雖異而玄默一焉故略舉三異以明之雖波流九變治亂紛如居其極者常淡然自得泊乎忘為也此舉譬也鯢大魚也桓盤也審聚也夫水體無心動止隨物或鯨鯢盤桓或螭龍騰躍或凝湛止住或波流湍激雖復漣漪清淡多種不同而玄默無心其致一也故鯢桓以方衡氣止水以譬地文流水以喻天壤雖復三異而虛照一焉而言淵有九名者謂鯢桓止水流水水濫水沃水雍水水肥水故謂之九也並出列子彼文具載此略敘有此三焉也鯢五兮反桓司馬云鯢桓二魚名也簡文云鯢鯨魚也桓盤桓也崔本作鯢拒云魚所處之方穴也又云拒或作桓之審郭如字簡文云處也司馬云審當為蟠蟠聚也崔本作潘云回流所鍾之域也俞樾曰審司馬云當為蟠蟠聚也崔本作潘云回流所鍾之域也今以字義求之則實當為說文水部大波也從水旛聲作潘者字之省司馬彪讀為蟠誤也郭本作審則失其字矣又案列子黃帝篇云鯢旋之潘為淵止水之潘為淵流水之潘為淵濫水之潘為淵沃水之潘為淵氿水之潘為淵雍水之潘為淵水之潘為淵肥水之潘為淵是為九淵焉九淵全列然於上下文殊不相屬疑為它處之錯簡莊子所見已然雖不敢徑去而實非本篇文義所繫故聊舉其三耳家世父曰釋文引崔本審作潘云回流所鍾之域也列子黃帝篇鯢旋之潘為淵字當作潘說文淵回水也管子度地篇水出地而不流命曰淵謂水回旋而瀦為淵有物伏孕其中而成淵者有止而不流者有流而中渟為淵者水之渟滀因其自然之勢而或流或止皆積之以成淵焉故曰太沖莫朕侵尋溢非人力之所施也淵有九名淮南子云有九旋之淵許慎注云至深也治亂直吏反欲示極玄應須更召世德堂本作措氿字依列子改字依列子改明日又與之見壺子立未定自失而走壺子曰追之季咸前後虞度來相未呈玄遠猶有近見今者第四其道極深本跡兩忘動寂雙遣聖心行虛非凡所測遂使立未安定奔逸而走也失而走如字徐音逸既見奔逃命令捉取列子追之不及反以報壺子曰已滅矣已失矣吾弗及已驚迫已甚奔馳亦速滅矣失矣莫知所之也已滅崔云滅不見也壺子曰鄉吾示之以未始出吾宗吾與之虛而委蛇不知其誰何因以為弟靡因以為波流故逃也雖變化無常而常深根冥極也夫妙本玄源窈冥恍惚超茲四句離彼百非不可以心慮知安得以形名取既絕言象無的宗塗不測所由故失而走無心而隨物化委於危反蛇以支反委蛇至順之貌然無所係也委蛇隨順之貌也至人應物虛己忘懷隨順逗機不執宗本既不可名目故不知的是何誰也變化頹靡世事波流無往而不因也夫至人一耳然應世變而時動故相者無所措其目自失而走此明應帝王者無方也頹者放任靡者順從夫上德無心有感斯應放任不務順從於物而揚波塵俗隨流世間因任前機曾無執滯千變萬化非相者所知是故季咸宜其逃逸也為弟徐音頹丈回反靡弟靡不窮之貌崔云猶遜伏也盧文弨曰正字通弟作弚後來字書亦因之而於古無有也類篇弟字下有徒回反一音云弟靡不窮貌正本此列子黃帝篇作茅靡波流如字崔本作波隨云常隨從之王念孫曰郭象曰變化頹靡世事波流無往而不因釋文曰波流崔本作波隨云常隨從之案作波隨者是也蛇何靡隨為韻蛇古音徒禾反委蛇之委古音於禾反委蛇疊韻字也召南羔羊篇委蛇委蛇與皮紽為韻皮古音婆莊子庚桑楚篇與物委蛇與為波為韻為古音訛委蛇或作委佗鄘風君子偕老篇委委佗佗與珈河宜何為韻宜古音俄靡古音摩中孚九二吾與爾靡之與和為韻莊子知北遊篇安與之相靡與化多為韻成二年左傳師至於靡之下靡一音摩史記蘇秦傳期年以出揣摩鄒誕本作揣摩隨古亦音徒禾反波隨韻詩序男行而女不隨老子前後相隨管子白心篇天不始不隨呂氏春秋審應篇人先我隨韓子解老篇大姦作則小盜隨淮南泰族篇上動而下隨史記太史公自序主先而臣隨並與和為韻又呂氏春秋任數篇無先有隨與和多為韻賈子道術篇有端隨之與和宜為韻淮南原道篇禍乃相隨與多為韻說文隨從隋聲隋音佗果反史記天官書前列直斗口三星隨北端兌索隱曰隨音他果反然後列子自以為未始學而歸三年不出為其妻爨食豕如食人於事無與親彫琢復朴塊然獨以其形立紛而封哉一以是終季咸逃逸之後列子方悟己迷始覺壺丘道深神巫術淺自知未學請乞其退歸習尚無為伏膺玄業也忘貴賤也不出三年屏於俗務為妻爨火忘於榮辱食豕如人淨穢均等為其于偽反妻爨七判反食豕音嗣下同唯所遇耳悟於至理故均彼我涉於世事無親疏也去華取實彫琢華飾之務悉皆棄除直置任真復於朴素之道者也彫琢竹角反去華羌呂反外飾去也塊然無情之貌也外除彫飾內遣心智槁木之形塊然無偶也塊然徐苦怪反又苦對反雖動而真不散也封守也雖復涉世紛擾和光接物而守於真本確爾不移紛而芳云反崔云亂貌封哉崔本作戎云封戎散亂也李楨曰紛而封哉列子黃帝篇作然而封戎按封戎是也六句並韻語食豕二句人親為韻彫琢二句朴立為韻紛而二句戎終為韻哉字傳寫之訛下四亦韻語惟崔本不誤與列子同尚書公無困哉漢書兩引作公無困我此以我訛哉亦是一證使物各自終動不乖寂雖紛擾而封哉應不離真常抱一以終始闕文引張君房本下有然字又一本作而封戎無為名尸無為謀府無為事任無為知主體盡無窮而遊無朕盡其所受乎天而無見得亦虛而已至人之用心若鏡不將不迎應而不藏故能勝物而不傷因物則物各自當其名也尸主也身尚忘遺名將安寄故無復為名譽之主也使物各自謀也虛淡無心忘懷任物故無復運為謀慮於靈府耳付物使各自任各率素分恣物自為不復於事任用於己無心則物各自主其知也忘心絕慮大順群生終不運知以主於物知主音注同因天下之自為故馳萬物而無窮也體俉真源故能以智境冥會故曰皆無窮也任物故無跡朕跡也雖遨遊天下接濟蒼生而晦跡韜光故無朕也無朕直忍反崔云兆也足則止也所稟天性物物不同各盡其能未為不足者也見得則不知止夫目視之所見雖見不見得於分內之得雖得不得既不造意於見得故雖見得而無見得也不虛則不能任群實所以盡於分內而無見得者自直自虛心忘淡忘而已鑒物而無情夫懸鏡高堂物來斯照至人虛應其義亦然來即應去即止將送也夫物有去來而鏡無迎送來者即照必不隱藏亦猶聖智虛凝無幽不燭物感斯應應不以心既無將迎豈有情於隱匿哉應而不藏如字本又作臧亦依字讀物來乃鑒鑒不以心故雖天下之廣而無勞神之累夫物有生滅而鏡無隱顯故常能照物而物不能傷亦聖人德合二儀明齊三景鑒照遐廣覆載無偏用心不勞故無損害為其勝物是以不傷世德堂本作逆智字依釋文原本及世德堂本改世德堂本乃作即趙諫議本作來照南海之帝為儵北海之帝為忽中央之帝為渾沌儵與忽時相與遇於渾沌之地渾沌待之甚善儵與忽謀報渾沌之德曰人皆有七竅以視聽食息此獨無有嘗試鑿之日鑿一竅七日而渾沌死南海是顯明之方故以儵為有北是幽闇之域故以忽為無中央既非北非南故以渾沌為非無非有者也儵音叔李云喻有象也忽李云喻無形也渾胡本反沌徒本反崔云渾沌無孔竅也李云清濁未分也此喻自然簡文云儵忽取神速為名渾沌以合和為貌神速譬有為合和譬無為有無二心會於非無非有之境和二偏之心執為一中之志故云待之甚善也儵忽二人懷偏滯未能和會尚起學心妄嫌渾沌之無心而謂穿鑿之有益也為者敗之夫運四肢以滯境鑿七竅以染塵乖渾沌之至淳順有無之取舍是以不終天年中塗夭折勗哉學者幸勉之焉故郭注云為者敗之也七竅苦叫反說文云孔也七日而渾沌死崔云言不順自然強開耳目也
