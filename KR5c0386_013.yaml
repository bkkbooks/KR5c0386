body:
  text: 外篇胠篋第十舉事以名篇將為胠篋探囊發匱之盜而為守備則必攝緘縢固鐍此世俗之所謂知也然而巨盜至則負匱揭篋擔囊而趨唯恐緘縢扃鐍之不固也然則鄉之所謂知者不乃為大盜積者也胠開篋箱囊袋攝收緘結縢繩也扃關鈕也鐍鎖鑰也夫將為開箱探囊之竊發匱取財之盜此蓋小賊非巨盜者也欲為守備其法如何必須收攝箱囊緘結繩約堅固扃鐍使不慢藏此世俗之淺知也胠李起居反史記作搚徐起法反一音虛乏反司馬云從旁開為胠一云發也篋苦協反探吐南反囊乃剛反匱其位反檻也必攝如字李云結也崔云收也緘古減反縢向崔本作同徒登反崔云約也案廣雅云緘縢皆繩也扃古熒反崔李云關也鐍古穴反李云紐也崔云環舌也知也如字又音智下同知之不足恃也如此夫攝緘縢固扃鐍者以備小賊然大盜既至負揭而趨更恐繩約關鈕之不牢向之守備翻為盜資是故俗知不足可恃揭徐其謁反又音桀三蒼云舉也擔也負也擔丁甘反而趨七須反李云走也唯恐丘用反鄉之本又作向亦作曏同許亮反為大盜于偽反下及下注而為同積者如字李子賜反依世德堂本及釋文原本改以下均誤不複出趙諫議本作向故嘗試論之世俗之所謂知者有不為大盜積者乎所謂聖者有不為大盜守者乎何以知其然邪昔者齊國鄰邑相望雞狗之音相聞罔罟之所布耒耨之所刺方二千餘里闔四竟之內所以立宗廟社稷治邑屋州閭鄉曲者曷嘗不法聖人哉然而田成子一旦殺齊君而盜其國所盜者豈獨其國邪並與其聖知之法而盜之故田成子有乎盜賊之名而身處堯舜之安小國不敢非大國不敢誅十二世有齊國則是不乃竊齊國並與其聖知之法以守其盜賊之身乎夫體道大賢言無的當將欲顯忘言之理故曰試論之曰夫世俗之人知謨淺近顯跡之聖於理未深既而意在防閑更為賊之聚積雖欲官世翻為盜之守備而有不為者欲明豈有不為大盜積守乎言其必為盜積也假設疑問發明義旨齊即太公之後封於營丘之地逮桓公九合諸侯一匡天下百姓殷實無出三齊是以雞犬鳴吠相聞鄰邑棟宇相望罔罟布以事畋漁耒耨刺以修農業境土寬大二千餘里論其盛美實冠諸侯耒犁也耨耡也罔罟音古罔之通名耒力對反徐力猥反郭呂匱反李云犁也一云耜柄也耨乃豆反李云鋤也或云以木為鋤柄所刺徐七智反夫人非土不立非穀不食故邑封土祠曰社封稷祠曰稷稷五穀之長也社吐也言能吐生萬物也司馬法六尺為步步百為畝畝百為夫夫三為屋屋三為井井四為邑又云五家為比五比為閭五閭為族五族為黨五黨為州五州為鄉鄭玄云二十五家為閭二千五百家為州萬二千五百家為鄉也闔合也曷何也闔四境之內三齊之中置此宗廟等事者皆放效堯舜以下聖人立邦國之法則也闔戶臘反四竟音境下之竟同治邑直吏反屋周禮夫三為屋州五黨為州二千五百家也閭五比為閭二十五家也鄉五州為鄉萬二千五百家也法聖人者法其跡耳夫跡者已去之物非應變之具也奚足尚而執之哉執成跡以御乎無方無方至而跡滯矣所以守國而為人守之也田成子齊大夫陳恆也是敬仲七世孫初敬仲適齊食於田故改為田氏魯哀公十四年陳恆弒其君君即簡公也割安平至于郎邪自為封邑至恆曾孫太公和遷齊康公於海上乃自立為齊侯自敬仲至莊公凡九世知齊政自太公至威王三世為齊侯通計為十二世莊子宣王時人今不數宣王故言十二世也田成子齊大夫陳恆也一旦宋元嘉中本作一日殺音試齊君簡公也春秋哀公十四年陳恆殺之于舒州而盜其國司馬云謂割安邑以東至郎邪自為封邑也不盜其聖法乃無以取其國也田恆所盜豈唯齊國先盜聖智故得諸侯是知仁義陳跡適為盜本也聖知音智下同田恆篡竊齊國故有巨盜之聲名而位忝諸侯身處唐虞之安樂子男之邦不敢非毀伯侯之國詎能征伐遂胤冑相繫宗廟遐延世歷十二俱如前解十二世有齊國自敬仲至莊子九世知齊政自太公和至威王三世為齊侯故云十二世也俞樾曰釋文曰自敬仲至莊子九世知齊政自太公和至威王三世為齊侯故云十二世此說非也本文是說田成子不當追從敬仲數起疑莊子原文本作世世有齊國言自田成子之後世有齊國也古書遇重字止於字下作二字以識之應作世二有齊國傳寫者誤倒之則為二世有齊國於是其文不可通而從田成子追數至敬仲適得十二世遂臆加十字於其上耳言聖法唯人所用未足以為全當之具揭仁義以竊國資聖智以保身此則重舉前文以結其義也以守如字舊音狩闕誤引張君房本聖人作聖智下文善人不得聖人之道不立跖不得聖人之道不行則聖人之利天下也少聖人生而大盜起掊擊聖人聖人已死聖人不死雖重聖人是乃聖人之過也彼聖人者天下之利器也句內聖人並同嘗試論之世俗之所謂至知者有不為大盜積者乎所謂至聖者有不為大盜守者乎何以知其然邪昔者龍逢斬比干剖萇弘胣子胥靡故四子之賢而身不免乎戮故跖之徒問於跖曰盜亦有道乎跖曰何適而無有道邪夫妄意室中之藏聖也入先勇也出後義也知可否知也分均仁也五者不備而能成大盜者天下未之有也由是觀之善人不得聖人之道不立跖不得聖人之道不行天下之善人少而不善人多則聖人之利天下也少而害天下也多故曰脣竭則齒寒魯酒薄而邯鄲圍聖人生而大盜起掊擊聖人縱舍盜賊而天下始治矣夫川竭而谷虛丘夷而淵實聖人已死則大盜不起天下平而無故矣重結前義以發後文也假設疑問以暢其旨也言暴亂之君亦得據君人之威以戮賢人而莫之敢亢者皆聖法之由也向無聖法則桀紂焉得守斯位而放其毒使天下側目哉龍逢姓關夏桀之賢臣為桀所殺比干王子也諫紂紂剖其心而視之萇弘周靈王賢臣說苑云晉叔向之殺萇弘也萇弘數見於周因遺書萇弘謂叔向曰子起晉國之兵以攻周以廢劉氏立單氏劉子謂君曰此萇弘也乃殺之裂也亦言刳腸靡爛也碎也言子胥遭戮浮屍於江令靡爛也言此四子共有忠賢之行而不免于戮刑者為無道之人恃君人之勢賴聖跡之威故得躓頓忠良肆其毒害比干剖普口反謂割心也崔本作節云支解也萇直良反弘胣本又作徐敕紙反郭詩氏反崔云讀若拖或作施字胣裂也淮南子曰萇弘鈹裂而死司馬云胣剔也萇弘周靈王賢臣也案左傳是周景王敬王之大夫魯哀公三年六月周人殺萇弘一云刳腸曰胣子胥靡密池反司馬如字云縻也崔云爛之於江中也案子胥伍員也諫夫差夫差不從賜之屬鏤以死投之江也焉得於虔反假設跖之徒類以發問之端故跖之石反此即答前問意道無不在何往非道道之所在具列下文慶藩案何適而無有道邪當作何適其有道邪適與啻同秦策疑臣者不適三人適與啻通史記甘茂傳作疑臣者非特三人後人不知誤以為適齊適楚適秦之適故改而無二字呂氏春秋當務篇正作奚啻其有道也淮南道應篇奚適其有道也今本作無道亦後人所妄改五者所以禁盜而反為盜資也室中庫藏以貯財寶賊起妄心斟量商度有無必中其驗若神故言聖也戮力同心不避強禦並爭先入豈非勇也矢石相交不顧性命出競居後豈非義也知可則為不可則止識其安危審其吉凶往必克捷是其智也輕財重義取少讓多分物均平是其仁也五者則向之聖勇義智仁也夫為一盜必資五德五德不備盜則不成是知無聖智而成巨盜者天下未之有也之藏才浪反又如字慶藩案意度也與億同禮運聖人耐以天下為一家以中國為一人者非意之也管子小問篇君子善謀而小人善意意之也皆訓度之義韓子解老篇前識者無緣而忘意度也案忘即妄字之隸變王褒四子講德論君子執分寸而罔意度案罔即妄字之義少儀鄭注曰測意度也意本又作億論語先進篇億則屢中漢書貨殖傳作意知可如字本或作知可否盧文弨曰今本有否字分均符問反又如字聖人之道謂五德也以向如是理觀之為善之徒不履五德則無由立身行道盜跖之類不資聖智豈得行其盜竊乎信哉斯言斯言雖信而猶不可亡聖者猶天下之知未能都亡故須聖道以鎮之也群知不亡而獨亡於聖知則天下之害又多於有聖矣然則有聖之害雖多猶愈於亡聖之無治也雖愈於亡聖故未若都亡之無害也甚矣天下莫不求利而不能一亡其知何其迷而失致哉夫善惡二途皆由聖智者也伯夷守廉絜著名盜跖恣貪殘取利然盜跖之徒甚眾伯夷之類蓋寡故知聖跡利益天下也少而損害天下也多無治直吏反下文始治同夫竭脣非以寒齒而齒寒魯酒薄非以圍邯鄲而邯鄲圍聖人生非以起大盜而大盜起此自然相生必至之勢也夫聖人雖不立尚於物而亦不能使物不尚也故人無貴賤事無真偽苟效聖法則天下吞聲而闇服之斯乃盜跖之所至賴而以成其大盜者也春秋左傳云脣亡齒寒虞虢之謂也邯鄲趙城也昔楚宣王朝會諸侯魯恭公後至而酒薄宣王怒將辱之恭公曰我周公之胤行天子禮樂勳在周室今送酒已失禮方責其薄無乃太甚乎遂不辭而還宣王怒興兵伐魯梁惠王恆欲伐趙畏魯救之今楚魯有事梁遂伐趙而邯鄲圍亦聖人生非欲起大盜而大盜起勢使之然也魯酒薄而邯音寒鄲音丹邯鄲趙國都也圍楚宣王朝諸侯魯恭公後至而酒薄宣王怒欲辱之恭公不受命乃曰我周公之胤長於諸侯行天子禮樂勳在周室我送酒已失禮方責其薄無乃太甚遂不辭而還宣王怒乃發兵與齊攻魯梁惠王常欲擊趙而畏楚救楚以魯為事故梁得圍邯鄲言事相由也亦是感應宣王名熊良夫悼王之子恭公名奮穆公之子許慎注淮南云楚會諸侯魯趙俱獻酒於楚王魯酒薄而趙酒厚楚之主酒吏求酒於趙趙不與吏怒乃以趙厚酒易魯薄酒奏之楚王以趙酒薄故圍邯鄲也俞樾曰此竭字當讀為竭其尾之竭說文豕篆說解曰竭其尾故謂之豕是也蓋竭之本義為負舉竭其尾即舉其尾也此云脣竭者謂反舉其脣以向上夫聖人者天下之所尚也若乃絕其所尚而守其素朴棄其禁令而代以寡欲此所以掊擊聖人而我素朴自全縱舍盜賊而彼姦自息也故古人有言曰閑邪存誠不在善察息淫去華不在嚴刑此之謂也掊打也聖人猶聖跡也夫聖人者智周萬物道濟天下今言掊擊者亦示貶斥仁義絕聖棄智之意也不貴難得之貨故縱舍盜賊不假嚴刑而天下太平也掊普口反擊徐古歷反縱舍音捨注同閑邪似嗟反去華起呂反下注去欲去其皆同竭川非以虛谷而谷虛夷丘非以實淵而淵實絕聖非以止盜而盜止故止盜在去欲不在彰聖知夫智惠出則姦偽生聖跡亡則大盜息猶如川竭谷虛丘夷淵實豈得措意必至之宜死息也聖人已死則大盜不起向云事業日新新者為生故者為死故曰聖人已死也乘天地之正御日新之變得實而損其名歸真而忘其塗則大盜息矣非唯息盜爭尚之跡故都去矣故事也絕聖棄智天下太平人歌擊壤故無有為之事爭尚爭鬥之爭後皆同佯字而字依說苑原文改臣字依管子原文改俞注原誤置疏文下今依例改正聖人不死大盜不止雖重聖人而治天下則是重利盜跖也為之斗斛以量之則並與斗斛而竊之為之權衡以稱之則並與權衡而竊之為之符璽以信之則並與符璽而竊之為之仁義以矯之則並與仁義而竊之何以知其然邪彼竊鉤者誅竊國者為諸侯諸侯之門而仁義存焉則是非竊仁義聖知邪故逐於大盜揭諸侯竊仁義並斗斛權衡符璽之利者雖有軒冕之賞弗能勸斧鉞之威弗能禁此重利盜跖而使不可禁者是乃聖人之過也將重聖人以治天下而桀跖之徒亦資其法所資者重故所利不得輕也若夫淳樸之世恬淡無為物各歸根人皆復命豈待教跡而後冥乎及至聖智不忘大盜斯起雖復貴聖法治天下無異重利盜跖何者所以夏桀肆其害毒盜跖肆其貪殘者由資乎聖跡故也向無聖跡夏桀豈得居其九五毒流黎庶盜跖何能擁卒數千橫行天下所資既重所利不輕以此而推過由聖智也聖人不死大盜不止向云聖人不死言守故而不日新牽名而不造實也大盜不止不亦宜乎小盜之所困乃大盜之所資而利也斛者今之函所以量物之多少權稱鎚也衡稱梁也所以平物之輕重也符者分為兩片合而成一即今之銅魚木契也璽者是王者之玉印握之所以攝召天下也仁恩也義宜也王者恩被蒼生循宜作則所以育養黔黎也此八者天下之利器也不可相無也夫聖人立教以正邦家田成用之以竊齊國豈非害於小賊而利大盜者乎為之斗斛以量之向云自此以下皆所以明苟非其人雖法無益權衡李云權稱鎚衡稱衡也鎚音直偽反符璽音徙矯之居表反鉤者腰帶鉤也夫聖跡之興本懲惡勸善今私竊鉤帶必遭刑戮公劫齊國獲諸侯仁義不存無由率眾以此而言豈非竊聖跡而盜國邪何以知其然者假問也彼竊以下假答也竊鉤鉤謂帶也王引之曰存焉當為焉存焉於是也言仁義於是乎存也呂氏春秋季春篇注曰焉猶於此也聘禮記曰及享發氣焉盈容言發氣於是盈容也月令曰天子焉始乘舟今本焉字在上句乃告舟偕具於天子之下此後人不曉文義而妄改之今據呂氏春秋季春篇淮南時則篇訂正言天子於是始乘舟也晉語曰焉始為令言於是始為令也三年問曰故先王焉為之立中制節言先王於是為之立中制節也荀子禮論篇焉作安楊倞曰安語助或作安或作案荀子多用此字焉安案三字同義詳見釋詞大荒南經曰雲雨之山有木名曰欒群帝焉取藥言群帝於是取藥也管子揆度篇曰民財足則君賦斂焉不窮言賦斂於是不窮也墨子非攻篇曰天乃命湯於鑣宮用受夏之大命湯焉敢奉率其眾以鄉有夏之境言湯於是敢伐夏也楚辭九章曰焉洋洋而為客又曰焉舒情而抽信兮言於是洋洋而為客於是舒情而抽信也又僖十五年左傳晉於是乎作爰田晉於是乎作州兵晉語作焉作轅田焉作州兵西周策君何患焉史記周本紀作君何患於是是焉與於是同義莊八年公羊傳吾將以甲午之日然後祠兵於是管子小問篇且臣觀小國諸侯之不服者唯莒於是是於是與焉同義此四句以誅侯為韻門存為韻其韻皆在句末史記游俠傳作竊鉤者誅竊國者侯侯之門仁義存是其明證也夫軒冕斧鉞賞罰之重者也重賞罰以禁盜然大盜者又逐而竊之則反為盜用矣所用者重乃所以成其大盜也大盜也者必行以仁義平以權衡信以符璽勸以軒冕威以斧鉞盜此公器然後諸侯可得而揭也是故仁義賞罰者適足以誅竊鉤者也逐隨也勸勉也禁止也軒車也冕冠也夫聖跡之設本息姦邪而田恆遂用其道而竊齊國權衡符璽悉共有之誓揭諸侯安然南面胡可勸之以軒冕威之以斧鉞者哉小曰斧大曰鉞又曰黃金飾斧鉞揭其謁其列二反斧鉞音越慶藩案慧琳一切經音義卷九十五正誣論三引司馬云夏執黃戉殷執白戚周左仗黃戉右秉白旄釋文闕能禁音今又居鴆反下不可禁同夫跖之不可禁由所盜之利重也利之所以重由聖人之不輕也故絕盜在賤貨不在重聖也盜跖所以擁卒九千橫行天下者亦賴於五德故也向無聖智豈得爾乎是知驅馬掠人不可禁制者原乎聖人作法之過也故曰魚不可脫於淵國之利器不可以示人彼聖人者天下之利器也非所以明天下也故絕聖棄知大盜乃止擿玉毀珠小盜不起焚符破璽而民朴鄙掊斗折衡而民不爭殫殘天下之聖法而民始可與論議擢亂六律鑠絕竽瑟塞瞽曠之耳而天下始人含其聰矣滅文章散五采膠離朱之目而天下始人含其明矣毀絕鉤繩而棄規矩攦工倕之指而天下始人有其巧矣故曰大巧若拙削曾史之行鉗楊墨之口攘棄仁義而天下之德始玄同矣彼人含其明則天下不鑠矣人含其聰則天下不累矣人含其知則天下不惑矣人含其德則天下不僻矣彼曾史楊墨師曠工倕離朱皆外立其德而以爚亂天下者也法之所無用也魚失淵則為人禽利器明則為盜資故不可示人脫失也利器聖跡也示明也魚失水則為物所禽利器明則為人所執故不可也夫聖人者誠能絕聖棄知而反冥物極物極各冥則其跡利物之跡也器猶跡耳可執而用曰器也聖人則堯舜文武等是也家世父曰假聖人之知而收其利天下皆假而用之則固天下之利器矣天下假聖人以為利器而惟懼人之發其覆也無有能明之者也示利器於天下所以資其盜賊夫聖人馭世應物隨時揖讓干戈行藏匪一不可執固明示天下若執而行者必致其弊即燕噲白公之類是也去其所資則未施禁而自止也棄絕聖知天下之物各守其分則盜自息賤其所寶則不加刑而自息也藏玉於山藏珠於川不貴珠寶豈有盜濫擿玉持赤反義與擲字同崔云猶投棄之也郭都革反李云刻也除矯詐之所賴者則無以行其姦巧符璽者表誠信也矯詐之徒賴而用之故焚燒毀破可以反樸還淳而歸鄙野矣夫小平乃大不平之所用也斗衡者所以量多少稱輕重也既遭竊翻為盜資掊擊破壞合於古人之智守故無忿爭外無所矯則內全我朴而無自失之言也殫盡也殘毀也聖法謂五德也既殘三王又毀五帝蘧廬咸盡芻狗不陳忘筌忘蹄物我冥極然後始可與論重妙之境議道德之遐也殫音丹盡也夫聲色離曠有耳目者之所貴也受生有分而以所貴引之則性命喪矣若乃毀其所貴棄彼任我則聰明各全人含其真也擢拔也鑠消也竽形與笙相似並布管於匏內施簧於管端瑟長八尺一寸闊一尺八寸二十七絃伏犧造也夫耳淫宮徵慕師曠之聰目滯玄黃希離朱之視所以心神奔馳耳目竭喪既而拔管絕絃銷經絕緯毀黃華之曲棄白雪之歌滅黼黻之文散紅紫之采故膠離朱之目除矯效之端塞瞽曠之耳去亂群之帥然後人皆自得物無喪我極耳之所聽而反聽無聲恣目之能視而內視無色天機自張無為之至也豈有明暗優劣於其間哉是以天下和平萬物同德率己聞見故人含其聰明含懷養也鑠絕郭李詩灼反向徐音藥崔云燒斷之也竽徐音于瑟本亦作笙塞瞽曠崔本塞作杜云塞也盧文弨曰今本無瞽字膠音交徐古孝反喪矣息浪反夫以蜘蛛蛣蜣之陋而布網轉丸不求之於工匠則萬物各有能也所能雖不同而所習不敢異則若巧而拙矣故善用人者使能方者為方能圓者為圓各任其所能人安其性不責萬民以工倕之巧故眾技以不相能似拙而天下皆自能則大巧矣夫用其自能則規矩可棄而妙匠之指可攦也鉤曲繩直規圓矩方工倕是堯工人作規矩之法亦云舜臣也攦折也割也工倕稟性機巧運用鉤繩割刻異端述作規矩遂令天下黔黎誘然放效舍己逐物實此之由若使棄規矩絕鉤繩攦割倕指則人師分內咸有其巧譬猶蜘網蜣丸豈關工匠人事若天機巧也出老經攦郭呂係反又力結反徐所綺反李云折也崔云撕之也工倕音垂堯時巧者也一音睡盧文弨曰舊本音訛名據達生篇改正蜘音知蛛音誅蛣起一反蜣音羌去其亂群之率則天下各復其所而同於玄德也削除也鉗閉也攘卻也玄原也道也曾參至孝史魚忠直楊朱墨翟稟性弘辯彼四子者素分天然遂使天下學人捨己效物由此亂群失其本性則削除忠信之行鉗閉浮辯之口攘去蹩躠之仁棄擲踶跂之義於是物不喪真人皆自得率性全理故與玄道混同也之行下孟反鉗李巨炎反又其嚴反攘如羊反之帥本又作率同所類反盧文弨曰今本作率鑠消散也累憂患也只為自衒聰明故憂患斯集彼蒼生顛仆而銷散也若能含抱聰明於內府而不衒於外者則物皆適樂而無憂患也不鑠灼反崔云不消壞也向音燿若能知於分內養德而不蕩者固當履環中之正道游宇內而不惑豈有倒置邪僻於其間哉不僻匹亦反此數人者所稟多方故使天下躍而效之效之則失我我失由彼則彼為亂主矣夫天下之大患者失我也以前數子皆稟分過人不能韜光匿燿而揚波激俗標名於外引物從己炫燿群生天下亡德而不反本失我之原斯之由也爚徐音藥三蒼云火光銷也司馬崔云散也此數所主反若夫法之所用者視不過於所見故眾目無不明聽不過於所聞故眾耳無不聰事不過於所能故眾技無不巧知不過於所知故群性無不適德不過於所得故群德無不當安用立所不逮於性分之表使天下奔馳而不能自反哉夫率性而動動必由性此法之妙也而曾史之徒以己引物既無益於當世翻有損於將來雖設此法終無所用也世德堂本無瞽字本書依釋文補趙諫議本無也字失字依世德堂本及釋文原本改子獨不知至德之世乎昔者容成氏大庭氏伯皇氏中央氏栗陸氏驪畜氏軒轅氏赫胥氏尊盧氏祝融氏伏犧氏神農氏當是時也民結繩而用之甘其食美其服樂其俗安其居鄰國相望雞狗之音相聞民至老死而不相往來若此之時則至治已今遂至使民延頸舉踵曰某所有賢者贏糧而趣之則內棄其親而外去其主之事足跡接乎諸侯之境車軌結乎千里之外則是上好知過也足以紀要而已已上十二氏並上古帝王也當時既未有史籍亦不知其次第前後刻木為契結繩表信上下和平人心淳樸故易云上古結繩而治後世聖人易之以書契容成氏司馬云此十二氏皆古帝王驪徐力池反李音犁畜徐敕六反伏戲音羲適故常甘當故常美若思侈靡則無時慊矣慊口簟反止分故甘去華故美混同故樂恬淡故安居也樂其音洛無求之至境邑相比相去不遠雞犬吠聲相聞相接而性各自足無求於世卒於天命不相往來無為之至而不相往來一本作不相與往來檢元嘉中郭注本及崔向永和中本並無與字無欲無求懷道抱德如此時也豈非至哉至治直吏反注同至治之跡猶致斯弊贏裹也亦是至理之風播而為教貴此文跡使物學之尚賢路開尋師訪道引頸舉足遠適他方軌轍交行足跡所接裹糧負戴不憚千里內則棄親而不孝外則去主而不忠至治之跡遂致斯弊也頸如字李巨盈反贏音盈崔云裹也廣雅云負也糧音良而趣七于反徐七喻反慶藩案軌徹跡也說文軌車徹也從車九聲案徹者通也中空而通也經傳多訓軌為車頭蓋軓字之訛說文軓車軾前也從車凡聲車軌與足跡對文則軌之為車跡明矣攷工記匠人皆容力九軌鄭注軌徹廣也結交也車跡可並列亦可邪交邪交則相接結軌即結徹也管子小匡篇車不結徹徹跡也高注結交也車輪之跡往來縱橫彼此交錯故曰結交也史記司馬相如傳結軌適轅東鄉將報索隱引張揖注結屈也軌車跡也本西行折而東之則跡亦曲而東也上謂好知之君知而好之則有斯過矣尚至治之跡好治物之智故致斯也上好呼報反注下皆同之字依世德堂本改夫字依世德堂本改上誠好知而無道則天下大亂矣何以知其然邪夫弓弩畢弋機變之知多則鳥亂於上矣鉤餌罔罟笱之知多則魚亂於水矣削格羅落罝罘之知多則獸亂於澤矣知詐漸毒頡滑堅白解垢同異之變多則俗惑於辯矣故天下每每大亂罪在於好知故天下皆知求其所不知而莫知求其所已知者皆知非其所不善而莫知非其所已善者是以大亂故上悖日月之明下爍山川之精中墮四時之施惴耎之蟲肖翹之物莫不失其性甚矣夫好知之亂天下也自三代以下者是已舍夫種種之民而悅夫役役之佞釋夫恬淡無為而悅夫啍啍之意啍啍已亂天下矣在上君王不能無為恬淡清虛合道而以知能治物物必弊之故大亂也老君云以知治國國之賊也假設疑問出其所由攻之愈密避之愈巧則雖禽獸猶不可圖之以知而況人哉故治天下者唯不任知任知無妙也網小而柄形似畢星故名為畢以繩繫箭射謂之弋罟皆網也笱曲梁也亦筌也削格為之即今之鹿角馬槍以繩木羅落而取獸也罝罘兔網也既以智治於物寧無沸騰之患故治國者必不可用智也弩音怒畢弋機變李云兔網曰畢繳射曰弋弩牙曰機之知音智下及注並下知詐皆同鉤餌如志反罔罟音曾盧文弨曰今本罔作網笱音鉤釣鉤也餌魚餌也廣雅云罟謂之罔魚網也爾雅云嫠婦之笱謂之王念孫曰鉤本作釣釣即鉤也今本作鉤者後人但知釣為釣魚之釣而不知其又為鉤之異名故以意改之耳今案廣雅曰釣鉤也田子方篇曰文王觀於臧見一丈夫釣而其釣莫釣非持其釣有釣者也常釣也以上六釣字惟其釣與持其釣兩釣字指鉤而言餘四釣字皆讀為釣魚之釣鬼谷子摩篇曰如操釣而臨深淵淮南說山篇曰操釣上山揭斧入淵說林篇曰一目之羅不可以得鳥無餌之釣不可以得魚東方朔七諫曰以直鍼而為釣兮又何魚之能得是古人謂鉤為釣也又案釋文云餌如志反音曾笱音苟此是釋餌笱三字之音下又云釣鉤也餌魚餌也廣雅云罟謂之网魚网也爾雅云嫠婦之笱謂之此是釋釣餌網罟笱六字之義後人既改正文釣字為鉤又改釋文笱音苟釣鉤也六字為笱音鉤釣鉤也其失甚矣又外物篇任公子為大鉤巨緇釋文鉤本亦作釣亦當以作釣者為是文選七啟注傅咸贈何劭王濟詩注謝靈運七里瀨詩注及太平御覽資產部十四引此並作釣也又列子湯問篇詹何以芒鍼為釣後人改釣為鉤不知御覽引此正作釣也又下文投綸沈釣今本釣作鉤亦是後人所改韻府群玉釣字下引列子投綸沈釣則所見本尚作釣也又齊策君不聞海大魚乎網不能止釣不能牽後人改釣為鉤不知御覽鱗介部七引此正作釣淮南人間篇亦作釣也又淮南說山篇人不愛江漢之珠而愛己之釣高注云釣鉤也後人既改正文釣字為鉤又改注文為鉤釣也則其謬滋甚蓋後人不知釣為鉤之異名故以其所知改其所不知古義寖亡矣削七妙反格古百反李云削格所以施羅網也羅落罝子斜反罘本又作罦音浮爾雅云鳥罟謂之羅兔罟謂之罝罬謂之罦罦覆車也郭璞云今翻車也家世父曰釋文引李云削格所以施羅網也說文格木長貌徐鍇曰長枝為格削格謂刮削之鄭注周禮雍氏所謂鄂也書傳費誓杜乃擭正義擭捕獸機檻左思吳都賦峭格周施峭削義通謂之格者格拒之意削格羅落皆所以遮要禽獸漢書晁錯傳為中周虎落師古注謂遮落之削格即阱擭之擭也羅落與上畢弋同文玉篇云弋橛也一作杙爾雅釋宮謂之杙郭璞注橛也畢弋謂施弋以張畢也人間世狙猴之杙則用以繫狙猴者說文率捕鳥畢也詩小雅畢之羅之鳥罟亦謂之畢李云兔網曰畢繳射曰弋均失之上之所多者下不能安其少也性少而以逐多則迷也智數詐偽漸漬毒害於物也頡滑滑稽也亦姦黠也解垢詐偽也夫滑稽堅白之智譎詭同異之談諒有虧於真理無益於世教故遠觀譬於若訥愚俗惑於小辯漸毒李云漸漬之毒不覺深也崔云漸毒猶深害慶藩案知與智同謂智故也淮南主術注曰故巧管子心術去知與故荀子非十二子知而險淮南原道偶智故並此知字之義漸詐也荀子議兵是漸之也正論上凶險則下漸詐矣皆欺詐之義李頤謂為漸漬之毒失之遠矣尚書民興胥漸王念孫曰漸詐也言小民方興為詐欺故下文曰罔中於信以覆詛盟也彼傳訓為漸化則與下文不屬頡戶結反滑干八反頡滑謂難料理也崔云纏屈也李音骨滑稽也一云頡滑不正之語也解苦懈反垢苦豆反司馬崔云解垢隔角也或云詭曲之辭每每昏昏貌也夫忘懷任物則宇內清夷執跡用智則天下大亂故知上下昏昏由乎好智每每李云猶昏昏也慶藩案每每即夢夢也爾雅釋訓夢夢訰訰亂也夢之為每猶甍之為郭注今字作甍不求所知而求所不知此乃舍己效人而不止其分也所以知者分內也所不知者分外也舍內求外非惑如何也舍己音捨下文同善其所善爭尚之所由生也所不善者桀跖也所以善者聖跡也盜跖行不善以據東陵田恆行聖跡以竊齊國故穀業異亡羊趣同或夷跖行殊損性均也愚俗之徒妄生臧否善與不善誠未足定也夫吉凶悔吝生於動者也而知之所動誠能搖蕩天地運御群生故君人者胡可以不忘其知哉是以仍上辭也只為上來用智執跡故天下大亂悖亂也爍銷也墮壞也附地之徒曰喘耎飛空之類曰肖翹皆輕小物也夫執跡用智為害必甚故能鼓動陰陽搖蕩天地日月為之薄蝕山川為之崩竭炎涼為之愆敘風雨所以不時飛走水陸失其本性好知毒物一至於此也上悖李郭云必內反又音佩司馬云薄食也下爍失約反崔云消也司馬云崩竭也崔向本作櫟同徐音藥中墮許規反毀也之施始豉反惴本亦作又作喘川兗反向音揣耎耳轉反崔云蠉動蟲也一云惴耎謂無足蟲肖翹音消下音祁饒反崔云肖翹植物也李云翾飛之屬也啍啍以己誨人也自從也三代謂夏殷周也種種淳樸之人役役輕黠之貌釋廢也啍啍以己誨人也夫上古至淳之世素朴之時像圜天而清虛法方地而安靜並萬物而為族同禽獸之無知逮乎散澆去淳離道背德而五帝聖跡已彰三代用知更甚舍淳樸之素士愛輕黠之佞夫廢無欲之自安悅有心之誨物已亂天下可不悲乎種種向章勇反李云謹貌一云淳厚也而說音悅下同盧文弨曰今本作悅役役李云鬼黠貌一云有為人也恬徒謙反淡徒暫反徐大敢反啍啍李之閏反又之純反郭音惇以己誨人之貌下同司馬云少智貌徐許彭反又許剛反向本作啍音亨崔本上句作哼哼少知而芒也一云哼哼壯健之貌盧文弨曰今本此與下俱作啍啍案從享亦可得亨音趙諫議本作喘世德堂本民作機趙本作民世德堂本作網本書依釋文改釋文原本無音字柞字依周禮鄭注改字依淮南子改字依方言改趙本止作正
