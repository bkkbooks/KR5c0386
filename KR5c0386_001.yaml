seq: 1
front:
  text: 莊子序河南郭象子玄撰夫莊子者可謂知本矣故未始藏其狂言言雖無會而獨應者也夫應而非會則雖當無用言非物事則雖高不行與夫寂然不動不得已而後起者固有間矣斯可謂知無心者也夫心無為則隨感而應應隨其時言唯謹爾故與化為體流萬代而冥物豈曾設對獨遘而遊談乎方外哉此其所以不經而為百家之冠也然莊生雖未體之言則至矣通天地之統序萬物之性達死生之變而明內聖外王之道上知造物無物下知有物之自造也其言宏綽其旨玄妙至至之道融微旨雅泰然遣放放而不敖故曰不知義之所適猖狂妄行而蹈其大方含哺而熙乎淡泊鼓腹而遊乎混芒至極乎無親孝慈終於兼忘禮樂復乎已能忠信發乎天光用其光則其朴自成是以神器獨化於玄冥之境而源流深長也故其長波之所蕩高風之所扇暢乎物宜適乎民願弘其鄙解其懸灑落之功未加而矜夸所以散故觀其書超然自以為已當經崑崙涉太虛而遊惚恍之庭矣雖復貪婪之人進躁之士暫而攬其餘芳味其溢流倣佛其音影猶足曠然有忘形自得之懷況探其遠情而玩永年者乎遂綿邈清遐去離塵埃而返冥極者也芒字宋趙諫議本作茫仁字依古逸叢書覆宋本改源流深長趙諫議本作源深流長
