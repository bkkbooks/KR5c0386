body:
  text: 外篇天運第十四以義名篇天運司馬作天員天其運乎地其處乎日月其爭於所乎孰主張是孰維綱是孰居無事推而行是意者其有機緘而不得已邪意者其運轉而不能自止邪雲者為雨乎雨者為雲乎孰隆施是孰居無事淫樂而勸是風起北方一西一東有上彷徨孰噓吸是孰居無事而披拂是敢問何故不運而自行也言天稟陽氣清浮在上無心運行而自動其運爾雅云運徙也廣雅云轉也慶藩案運釋文司馬本作員運員二字古通用也越語廣運百里韋注曰東西為廣南北為運西山經作廣員百里墨子非命上篇譬猶運鈞之上而立朝夕者也中篇運作員運古又讀若云云與員通管子戒篇四時云下而萬物化云即運字說文鴆一名運日劉逵吳都賦注運日作云日云即員也書泰誓雖則云然漢書韋賢傳注作員然詩出其東門聊樂我員釋文員本作云商頌景員維何鄭箋員古文作云皆其證不處而自止也地稟陰氣濁沈在下亦無心寧靜而自止不爭所而自代謝也晝夜照臨出沒往來自然如是既無情於代謝豈有心於爭處孰誰也是者指斥前文也言四時八節雲行雨施覆育蒼生亭毒群品誰為主宰而施張乎此一句解天運也皆自爾山岳產育川源流注包容萬物運載無窮春生夏長必無差忒是誰維持綱紀故得如斯此一句解地處也無則無所能推有則各自有事然則無事而推行是者誰乎哉各自行耳夫日月代謝星辰朗耀各有度數咸由自然誰安居無事推算而行之乎此一句解日月爭所已前三者並假設疑問顯發幽微故知皆自爾耳無物使之然也推而如字一音吐回反司馬本作誰機關也緘閉也玄冬肅殺夜暗昧以意億度謂有主司關閉事不得已致令如此以理推者皆自爾也方地不動其義亦然也緘古咸反徐古陷反司馬本作咸云引也自爾故不可知也至如青春氣發萬物皆生晝夜開明六合俱照氣序運轉致茲生育尋其理趣無物使然圓天運行其義亦爾也二者俱不能相為各自爾也夫氣騰而上所以為雲雲散而下流潤成雨然推尋始末皆無攸肇故知二者不能相為為雨于偽反下及注同隆興也施廢也言誰興雲雨而洪注滂沱誰廢甘澤而致茲亢旱也隆施音弛式氏反俞樾曰此承上雲雨而言隆當作降謂降施此雲雨也書大傳隆谷鄭注曰隆讀如龐降之降蓋隆從降聲古音本同荀子天論篇隆禮尊賢而王韓詩外傳隆作降齊策歲八月降雨下風俗通義祀典篇降作隆是古字通用之證誰安居無事自勵勸彼作此淫雨而快樂邪司馬本作倦字淫樂音洛又音嶽而勸司馬本勸作倦云讀曰隨言誰無所作在隨天往來運轉無已也彷徨迴轉之貌也噓吸猶吐納也披拂猶扇動也北方陰氣起風之所故云北方夫風吹無心東西任適或彷徨而居空裏或噓吸而在山中拂披升降略無定準孰居無事而為此乎蓋自然也有上時掌反彷薄皇反徨音皇司馬本作旁皇云旁皇飆風也噓音虛吸許急反披芳皮反拂芳弗反郭扶弗反披拂風貌司馬本作翇設問所以自爾之故此句總問以前有何意故也闕誤引李氏本施作弛闕誤引張君房本有作在巫咸祒曰來吾語女天有六極五常帝王順之則治逆之則凶九洛之事治成德備監照下土天下戴之此謂上皇夫物事之近或知其故然尋其原以至乎極則無故而自爾也自爾則無所稍問其故也但當順之巫咸神巫也為殷中宗相祒名也六極謂六合四方上下也五常謂五行金木水火土人倫之常性也言自然之理有此六極五常至於日月風雲例皆如此但當任之自然具足何為措意於其間哉巫咸祒赤遙反郭音條又音紹李云巫咸殷相也祒寄名也吾語魚據反女音汝後皆同六極司馬云四方上下也俞樾曰六極五常疑即洪範之五福六極也常與祥古字通儀禮士虞禮記薦此常事鄭注曰古文常為祥是其證也說文示部祥福也然則五常即五福也下文曰九洛之事治成德備其即謂禹所受之洛書九類乎夫假學可變而天性不可逆也夫帝王者上符天道下順蒼生垂拱無為因循任物則天下治矣而逆萬國之歡心乖二儀之和氣所作凶則禍亂生也九洛之事者九州聚落之事也言王者應天順物馭用無心故致天下太平人歌擊壤九州聚落之地治定功成八荒夷狄之邦道圓德備既合二儀覆載萬物又齊三景照臨下土家世父曰此言天之運自然而已帝王順其自然以道應之天地亦受裁成焉而風雨調四時序九洛之事即禹所受之九疇也莊子言道有不詭於聖人者此類是也順其自爾故也道合自然德均造化故眾生樂推而不厭百姓荷戴而不辭可謂返樸還淳上皇之治也商大宰蕩問仁於莊子莊子曰虎狼仁也宋承殷後故商即宋國也大宰官號名盈字蕩方欲決己所疑故問仁於莊子商大音泰下文大息同宰蕩司馬云商宋也大宰官也蕩字也仁者親愛之跡夫虎狼猛獸猶解相親足明萬類皆有仁性也曰何謂也大宰未達深情重問有何意謂莊子曰父子相親何為不仁父子親愛出自天然此乃真仁何勞再問曰請問至仁虎狼親愛厥義未弘故請至仁庶聞深旨莊子曰至仁無親無親者非薄德之謂也夫人之一體非有親也而首自在上足自處下府藏居內皮毛在外外內上下尊卑貴賤於其體中各任其極而未有親愛於其間也然至仁足矣故五親六族賢愚遠近不失分於天下者理自然也又奚取於有親哉夫至仁者忘懷絕慮與大虛而同體混萬物而為一何親疏之可論乎泊然無心而順天下之親疏也府藏才浪反大宰曰蕩聞之無親則不愛不愛則不孝謂至仁不孝可乎夫無愛無親便是不孝謂至仁不孝於理可乎商蕩不悟深旨遂生淺惑莊生為其顯折義列下文蕩聞之一本蕩作盈崔本同或云盈大宰字莊子曰不然夫至仁尚矣孝固不足以言之此非過孝之言也不及孝之言也夫南行者至於郢北面而不見冥山是何也則去之遠也故曰以敬孝易以愛孝難以愛孝易以忘親難忘親易使親忘我難使親忘我易兼忘天下難兼忘天下易使天下兼忘我難夫德遺堯舜而不為也利澤施於萬世天下莫知也豈直大息而言仁孝乎哉夫孝悌仁義忠信貞廉此皆自勉以役其德者也不足多也故曰至貴國爵并焉至富國財并焉至願名譽并焉是以道不渝必言之於忘仁忘孝之地然後至耳至仁者忘義忘仁可貴可尚豈得將愛敬近跡以語其心哉固不足以言也凡名生於不及者故過仁孝之名而涉乎無名之境然後至焉商蕩之問近滯域中莊生之答遠超方外故知親愛之旨非過孝之談封執名教不及孝之言也冥山在乎北極而南行以觀之至仁在乎無親而仁愛以言之故郢雖見而愈遠冥山仁孝雖彰而愈非至理也郢地居南冥山在北故郭注云冥山在乎北極南行以觀之至仁在乎無親而仁愛以言之故郢雖見而愈遠冥山仁孝雖彰而愈非至道此注甚明不勞更解郢以井反又以政反楚都也在江陵北冥山司馬云北海山名慶藩案史記蘇秦列傳索隱引司馬云冥山在朔州北與釋文異愈遠于萬反夫敬在形跡愛率本心心由天性故難跡關人情故易也孝易以豉反下皆同夫愛孝雖難猶滯域中未若忘親澹然無係忘既勝愛有優有劣以此格量難易明之矣夫騰蝯斷腸老牛舐犢恩慈下流物之恆性故子忘親易親忘子難自非達道孰能行之夫至仁者百節皆適則終日不自識也聖人在上非有為也恣之使各自得而已耳自得其為則眾務自適群生自足天下安得不各自忘我哉各自忘矣主其安在乎斯所謂兼忘也夫兼忘天下者棄萬乘如脫屣也使天下兼忘我者謂百姓日用而不知也夫垂拱汾陽而游心姑射揖讓之美貴在虛忘此兼忘天下者也方前則難比後便易未若忘懷至道息智自然將造化而同功與天地而合德者故能恣萬物之性分順百姓之所為大小咸得飛沈不喪利澤潛被物皆自然上如標枝民如野鹿當是時也主其安在乎此使天下兼忘我者也可謂軒頊之前淳古之君耳其德不見故天下忘之斯則從劣向優自粗入妙遣之又遣玄之又玄也遺堯舜然後堯舜之德全耳若係之在心則非自得也遺忘棄也言堯舜二君盛德深遠而又忘其德任物不為斯解兼忘天下難泯然常適有利益恩澤惠潤群生萬世之後其德不替而至德潛被日用不知斯解使天下兼忘我難也失於江湖乃思濡沫大息猶嗟歎也夫盛德同於堯舜尚能遺忘而不自顯豈復太息言於仁孝嗟歎於陳跡乎濡沫音末悌順也德者真性也以此上八事皆矯性偽情勉強勵力捨己效人勞役其性故不足多也孝弟音悌盧文弨曰舊本作孝悌音弟此因今本作悌而妄改也若作悌字則更無兩讀又何用音此如他卷道音導亦有倒作導音道者皆出後人所變亂今正之并除棄之謂也夫貴在於身身猶忘之況國爵乎斯貴之至也并者除棄之謂也夫貴爵祿者本為身也身猶忘之況爵祿乎斯至貴者也并焉必領反棄除也注同至富者自足而已故除天下之財者也至富者知足者也知足之人以不貪為寶縱令傾國資財亦棄而不用故老經云知足者富斯之謂也所至願者適也得適而仁孝之名都去矣夫至願者莫過適性也既一毀譽混榮辱忘物我泯是非故令聞聲名視之如涕唾也去華取實故也渝變也薄也既忘富貴又遺名譽是以道德淳厚不隨物變也去華起呂反世德堂本耳作矣北門成問於黃帝曰帝張咸池之樂於洞庭之野吾始聞之懼復聞之怠卒聞之而惑蕩蕩默默乃不自得姓北門名成黃帝臣也欲明至樂之道故寄此二人更相發起也咸池樂名張施也咸和也洞庭之野天之閒非太湖之洞庭也北門成人姓名也洞庭徒送反怠退息也卒終也復重也惑闇也不悟至樂初聞之時懼然驚悚再聞其聲稍悟音旨故懼心退息最後聞之知至樂與二儀合德視之不見聽之不聞故心無分別有同暗惑者也之懼如字或音句下同一本作戄音況縛反案說文懼是正字戄是古文盧文弨曰說文古文懼字有愯字與聳同非懼字重文並無戄字不知陸氏所據復聞扶又反下注同不自得坐忘之謂也蕩蕩平易之容默默無知之貌第三聞之體悟玄理故蕩蕩而無偏默默而無知芒然坐忘物我俱喪乃不自得帝曰汝殆其然哉吾奏之以人徵之以天行之以禮義建之以大清夫至樂者先應之以人事順之以天理行之以五德應之以自然然後調理四時太和萬物四時迭起萬物循生一盛一衰文武倫經一清一濁陰陽調和流光其聲蟄蟲始作吾驚之以雷霆其卒無尾其始無首一死一生一僨一起所常無窮而一不可待汝故懼也由此觀之知夫至樂者非音聲之謂也必先順乎天應乎人得於心而適於性然後發之以聲奏之以曲耳故咸池之樂必待黃帝之化而後成焉殆近也奏應也徽順也禮義五德也太清天道也黃帝既允北門成第三聞樂體悟玄道忘知息慮是以許其所解故云汝近於自然也徵之如字古本多作徽大清音泰雖復行於禮義之跡而忘自然之本者也此是第一奏也循順倫理經常也言春夏秋冬更迭而起一切物類順序而生夏盛冬衰春文秋武生殺之理天道之常但常任之斯至樂矣迭起大節反一本作遞大計反循生似倫反自然律呂以滿天地之閒但當順而不奪則至樂全清天也濁地也陰升陽降二氣調和故施生萬物和氣流布三光照燭此謂至樂無聲之聲家世父曰樂記禮減而進以進為文樂盈而反以反為文故樂闋而後作衰者闋之餘聲也始奏以文復亂以武以文武紀其盛衰倫經猶言經綸比和分合所謂經綸也因其自作而用其所以動仲春之月蟄蟲始啟自然之理驚之雷霆所謂動靜順時因物或作至樂具合斯道也蟄蟲沈執反郭音執爾雅云靜也霆音廷又音挺徒佞反電也家世父曰雷霆之起莫知其所自起莫知其所自竟其所自起首也生之端也其所自竟尾也死之歸也死生者萬物之大常與天為無窮而忽一至焉則亦物之所不能待也以喻樂之變化動於自然運轉無極尋求自然之理無始無終討論至樂之聲無首無尾故老經云迎之不見其首隨之不見其後也以變化為常則所常者無窮也僨仆也夫盛衰生死虛盈起僨變化之道理之常數若以變化為常則所謂常者無窮也一僨方問反司馬云仆也初聞無窮之變不能待之以一故懼然悚聽也至一之理絕視絕聽不可待之以聲色故初聞懼然也俞樾曰一不可待者皆不可待也大戴記衛將軍文子篇則一諸侯之相也盧注曰一皆也荀子勸學篇一可以為法則君子篇一皆善也謂之聖楊注曰一皆也是一有皆義郭注曰不能待之以一與語意未合趙諫議本徵作徽趙本全下有矣字吾又奏之以陰陽之和燭之以日月之明其聲能短能長能柔能剛變化齊一不主故常在谷滿谷在阬滿阬塗卻守神以物為量其聲揮綽其名高明是故鬼神守其幽日月星辰行其紀吾止之於有窮流之於無止予欲慮之而不能知也望之而不能見也逐之而不能及也儻然立於四虛之道倚於槁梧而吟目知窮乎所欲見力屈乎所欲逐吾既不及已夫形充空虛乃至委蛇汝委蛇故怠所謂用天之道言至樂之聲將陰陽合其序所通生物與日月齊其明此第二奏也齊一於變化故不主故常順群生之修短任萬物之柔剛齊變化之一理豈守故而執常至樂之道無不周也至樂之道無所不遍乃谷乃阬悉皆盈滿所謂道無不在所在皆無也在阬苦庚反爾雅云虛也塞其兌也塗塞也卻孔也閉心知之孔卻守凝寂之精神郭注云塞其兌也塗卻去逆反與隙義同其兌徒外反大制不割量音亮大小修短隨物器量終不制割而從己也為量音亮所謂闡諧揮動也綽寬也同雷霆之震動其聲寬也名當其實則高明也高如上天明如日月聲既廣大名亦高明不離其所人物居其顯明鬼神守其幽昧各得其所而不相撓故老經云以道利天下其鬼不神也不離力智反不失其度三光朗耀依分而行綱紀上玄必無差忒也常在極住也止住也窮極也雖復千變萬化而常居玄極不離妙本動而常寂也隨變而往也流動也應感無方隨時適變未嘗執守故寂而動也故闇然恣使化去夫至樂者真道也欲明道非心識故謀慮而不能知道非聲色故瞻望而不能見道非形質故追逐而不能逮也弘敞無偏之謂儻然無心貌也四虛謂四方空大道也言聖人無心與至樂同體立志弘敞接物無偏包容萬有與虛空而合德儻敕黨反一音敞無所復為也弘敞虛容忘知絕慮故形同槁木心若死灰逍遙無為且吟且詠也倚於於綺反槁古老反言物之知力各有所齊限夫目知所見蓋有涯限所以稱窮力所馳逐亦有分齊所以稱屈至樂非心色等法不可以限窮故吾知盡其不及故止而不逐也心既有限故知愛無名此覆前予欲慮之等文也目知音智齊限才細反夫形充空虛無身也無身故能委蛇委蛇任性而悚懼之情怠也夫形充虛空則與虛空而等量委蛇任性故順萬境而無心所謂隳體黜聰離形去智者也只為委蛇任性故悚懼之情怠息此解第二聞樂也委於危反徐如字蛇以支反又作施徐音絁趙諫議本夫作矣上字依世德堂本改世德堂本古作枯吾又奏之以無怠之聲調之以自然之命故若混逐叢生林樂而無形布揮而不曳幽昏而無聲動於無方居於窈冥或謂之死或謂之生或謂之實或謂之榮行流散徙不主常聲世疑之稽於聖人聖也者達於情而遂於命也天機不張而五官皆備此之謂天樂無言而心說故有焱氏為之頌曰聽之不聞其聲視之不見其形充滿天地苞裹六極汝欲聽之而無接焉而故惑也意既怠矣乃復無怠此其至也再聞至樂任性逶迤悚懼之心於焉怠息雖復賢於初聞猶自不及後聞故奏無怠之聲斯則以無遣怠故郭注云意既怠矣乃復無怠此其至者也此是第三奏也命之所有者非為也皆自然耳調和也凡百蒼生皆以自然為其性命所以奏此咸池之樂者方欲調造化之心靈和自然之性命也已混然無係隨叢而生混同也生出也同風物之動吹隨叢林之出聲也叢生才公反至樂者適而已適在體中故無別形夫叢林地籟之聲無心而成至樂適於性命而已豈復有形也林樂音洛亦如字自布耳揮動四時布散萬物各得其所非由牽曳布揮音輝廣雅云振也所謂至樂言至樂寂寥超於視聽故幽冥昏暗而無聲響矣家世父曰說文叢木曰林林樂者相與群樂之五音繁會不辨聲之所從出故曰無形揮者振而揚之若布之曳而愈長而亦無有曳之者林樂而無形其聲聚也布揮而不曳其聲悠也幽昏而無聲其聲淡也夫動者豈有方而後動哉夫至樂之本雖復無聲而應動隨時實無方所斯寂而動之也所謂寧極雖復應物隨機千變萬化而深根寧極恆處窈冥斯動而寂也於窈烏了反隨物變化夫春生冬死秋實夏榮雲行雨散水流風從自然之理日新其變至樂之道豈常主常聲也明聖人應世非唱也稽留也夫聖人者譬幽谷之響明鏡之象對之不知其所以來絕之不知其所以往物來斯應應而忘懷豈預前作法而留心應世故行留散徙不主常聲而世俗之人妄生疑惑也稽於古兮反故有情有命者莫不資焉所言聖者更無他義也通有物之情順自然之命故謂之聖忘樂而樂足非張而後備天機自然之樞機五官五藏也言五藏各有主司故謂之官夫目視耳聽手把腳行布網轉丸飛空走地非由倣效稟之造物豈措意而後能為故五藏職司素分備足天樂之美其在茲也心說在適不在言也體此天和非由措意故心靈適悅而妙絕名言也心說音悅注同此乃無樂之樂樂之至也焱氏神農也美此至樂為之章頌大音希聲故聽之不聞大象無形故視之不見道無不在故充滿天地二儀大無不包故囊括六極六極六合也假欲留意聽之亦不可以耳根承接是故體茲至樂理趣幽微心無分別事同愚惑也焱氏必遙反本亦作炎苞裹音包本或作包常聲依正文改故字依上下文補樂也者始於懼懼故祟吾又次之以怠怠故遁卒之於惑惑故愚愚故道道可載而與之俱也懼然悚聽故是祟耳未大和也以下重釋三奏三聽之意結成至樂之道初聞至樂未悟大和心生悚懼不能放釋是故禍祟之也祟雖遂反跡稍滅也再聞之後情意稍悟故懼心怠退其跡遁滅也以無知為愚愚乃至也最後聞樂靈府淳和心無分別有同闇惑蕩蕩默默類彼愚迷不怠不懼雅符真道既而運載無心與物俱至也孔子西遊於衛顏淵問師金曰以夫子之行為奚如衛本昆吾之邑又是康叔之封自魯適衛故曰西遊師金魯太師名金也奚何也言夫子行仁義之道以化衛侯未知此術行用可否邪師金李云師魯太師也金其名也之行下孟反師金曰惜乎而夫子其窮哉言仲尼叡哲明敏才智可惜守先王之聖跡執堯舜之古道所以頻遭辛苦屢致困窮顏淵曰何也問窮之所以也師金曰夫芻狗之未陳也盛以篋衍巾以文繡尸祝齊戒以將之及其已陳也行者踐其首脊蘇者取而爨之而已將復取而盛以篋衍巾以文繡遊居寢臥其下彼不得夢必且數眯焉今而夫子亦取先王已陳芻狗聚弟子游居寢臥其下故伐樹於宋削跡於衛窮於商周是非其夢邪圍於陳蔡之間七日不火食死生相與鄰是非其眯邪此下譬喻凡有六條第一芻狗第二舟車第三桔槔第四樝梨第五猿狙第六妍醜芻狗草也謂結草為狗以解除也衍笥也尸祝巫師也將送也言芻狗未陳盛以篋笥之器覆以文繡之巾致齊絜以表誠展如在之將送庶其福祉貴之如是芻狗李云結芻為狗巫祝用之盛音成下同篋苦牒反本或作筐衍延善反郭怡面反李云笥也盛狗之物也司馬云合也慶藩案巾字疑飾字之誤太平御覽引淮南絹以綺繡作飾以綺繡齊戒側皆反本亦作齋廢棄之物於時無用則更致他妖也踐履也首頭也脊背也取草曰蘇爨炊也眯魘也言芻狗未陳致斯肅敬既祭之後棄之路中故行人履踐其頭脊蘇者取供其炊爨方將復取而貴之盛於筐衍之中覆於文繡之下遨遊居處寢臥其旁假令不致惡夢必當數數遭魘故郭注云廢棄之物於時無用則更致他妖也蘇者李云蘇草也取草者得以炊也案方言云江淮南楚之間謂之蘇史記云樵蘇後爨注云蘇取草也爨之七丸反將復扶又反必且如字徐子餘反數音朔眯李音米又音美字林云物入眼為病也司馬云厭也音一琰反此合芻狗之譬並合孔子窮義也先王謂堯舜禹湯先代之帝王也憲章文武祖述堯舜而為教跡故集聚弟子遨遊於仁義之域臥寢於禮信之鄉古法不可執留事同已陳芻狗伐樹於宋者孔子曾遊於宋與門人講說於大樹之下司馬桓魋欲殺夫子夫子去後桓魋惡其坐處因伐樹焉削也夫子嘗遊於衛衛人疾之故削其跡不見用也商是殷地周是東周孔子歷聘曾困於此良由執於聖跡故致斯弊狼狽如是豈非惡夢耶俞樾曰上取字如字下取字當讀為聚周易萃象傳聚以正也釋文曰聚荀作取漢書五行志內取茲師古曰取讀如禮記聚麀之聚是聚取古通用此皆絕聖棄知之意耳無所稍嫌也夫先王典禮所以適時用也時過而不棄即為民妖所以興矯效之端也當時楚昭王聘夫子夫子領徒宿於陳蔡之地蔡人見徒眾極多謂之為賊故興兵圍繞經乎七日糧食罄盡無復炊爨從者餓病莫之能興憂悲困苦鄰乎死地豈非遭於已陳芻狗而魘耶世德堂本聚作取夫水行莫如用舟而陸行莫如用車以舟之可行於水也而求推之於陸則沒世不行尋常古今非水陸與周魯非舟車與今蘄行周於魯是猶推舟於陸也勞而無功身必有殃彼未知夫無方之傳應物而不窮者也夫舟行於水車行於陸至於千里未足為難若推舟於陸求其運載終沒一世不可數尺推之郭吐回反又如字下同此合也蘄求也亦今古代殊豈異乎水陸周魯地異何異乎舟車陸與音餘下同今蘄音祈求也時移世異禮亦宜變故因物而無所係焉斯不勞而有功也方猶常也傳轉也言夫子執先王之跡行衰周之世徒勞心力卒不成功故削跡伐樹身遭殃禍也夫聖人之智接濟無方千轉萬變隨機應物未知此道故嬰斯禍也無方之傳直專反下注同司馬云方常也慶藩案傳讀若轉言無方之轉動也呂氏春秋必己篇若夫萬物之情人倫之傳高注傳猶轉也漢書劉向傳禹稷與咎繇傳相汲引猶轉相汲引也淮南主術篇生無乏用死無轉尸逸周書大聚篇作傳尸襄二十五年左傳注傳寫失之釋文傳一本作轉且子獨不見夫桔槔者乎引之則俯舍之則仰彼人之所引非引人也故俯仰而不得罪於人故夫三皇五帝之禮義法度不矜於同而矜於治故譬三皇五帝之禮義法度其猶柤梨橘柚邪其味相反而皆可於口桔槔挈水木也人牽引之則俯下捨放之則仰上俯仰上下引捨以人委順無心故無罪夫人能虛己其義亦然也桔音結槔音羔慶藩案文穎說烽火云櫓上有桔槔以薪置其中有寇則然之字從木通俗文機汲謂之字從手然則從木者櫓上之物從手者汲水之物也據莊子文義當從通俗文為正期於合時宜應治體而已矜美也夫三皇五帝步驟殊時禮樂威儀不相沿襲美在逗機不治以定不貴率今以同古於治直吏反注同夫柤梨橘柚甘苦味殊至於噉嚼而皆可於口譬三皇五帝澆淳異世至於為政咸適機宜也柤側加反柚由救反故禮義法度者應時而變者也今取猿狙而衣以周公之服彼必齕齧挽裂盡去而後慊觀古今之異猶猿狙之異乎周公也故西施病心而矉其里其里之醜人見之而美之歸亦捧心而矉其里其里之富人見之堅閉門而不出貧人見之挈妻子而去走彼知矉美而不知矉之所以美惜乎而夫子其窮哉彼以為美而此或以為惡故當應時而變然後皆適也帝王之跡蓋無常準應時而變不可執留豈得膠柱刻船居今行古也慊足也周公聖人譬淳古之世狙猿狡獸喻澆競之時是以禮服雖華猿狙不以為美聖跡乃貴末代不以為尊故毀禮服猿狙始慊其心棄聖跡蒼生方適其性猿狙上音袁下七餘反而衣於既反齕音紇挽音晚盡去起呂反慊苦牒反李云足也本亦作嗛音同西施越之美女也貌極妍麗既病心痛嚬眉苦之而端正之人體多宜便因其嚬蹙更益其美是以閭里見之彌加愛重鄰里醜人見而學之不病強嚬倍增其陋故富者惡之而不出貧人棄之而遠走捨己效物其義例然削跡伐樹皆學嚬之過也而矉徐扶真反又扶人反通俗文云蹙額曰矉其里絕句捧心敷勇反郭音奉挈苦結反況夫禮義當其時而用之則西施也時過而不棄則醜人也所以猶所由也嚬之所以美者出乎西施之好也彼之醜人但美嚬之麗雅而不知由西施之姝好也總會後文結成其旨窮之事跡章中具載矣趙諫議本無況夫及二則字孔子行年五十有一而不聞道乃南之沛見老聃仲尼雖領徒三千號素王而盛行五德未聞大道故從魯之沛自北徂南而見老君以詢玄極故也之沛音貝司馬云老子陳國相人相今屬苦縣與沛相近老聃曰子來乎吾聞子北方之賢者也子亦得道乎孔子曰未得也聞仲尼有當世賢能未知頗得至道不答言未得自楚望魯故曰北也老子曰子惡乎求之哉問於何處尋求至道惡乎音烏下同曰吾求之於度數五年而未得也數算術也三年一閏天道小成五年再閏天道大成故言五年也道非術數故未得之也老子曰子又惡乎求之哉更問求道用何方法曰吾求之於陰陽十有二年而未得此皆寄孔老以明絕學之義也十二年陰陽之一周也而未得者明以陰陽取道而道非陰陽故下文云中國有人非陰非陽老子曰然使道而可獻則人莫不獻之於其君使道而可進則人莫不進之於其親使道而可以告人則人莫不告其兄弟使道而可以與人則人莫不與其子孫然而不可者無佗也中無主而不止外無正而不行由中出者不受於外聖人不出由外入者無主於中聖人不隱名公器也不可多取仁義先王之蘧廬也止可以一宿而不可久處覯而多責夫至道深玄妙絕言象非無非有不自不佗是以不進獻於君親豈得告於子弟所以然者無佗由也故託孔老二聖以明玄中之玄也心中無受道之質則雖聞道而過去也若使中心無受道之主假令聞於聖說亦不能止住於胸懷故知無佗也中無主則外物亦無正己者也故未嘗通也中既無受道之心故外亦無能正於己者故不可行也俞樾曰正乃匹字之誤禮記緇衣篇唯君子能好其正鄭注曰正當為匹字之誤也是其例矣此云中無主而不止外無匹而不行與宣三年公羊傳自內出者無匹不行自外至者無主不止文義相似自外至者無主不止故此言中無主而不止也自內出者無匹不行故此言外無匹而不行也因匹誤為正郭注遂以正己為說殊非其義則陽篇自外入者有主而不執由中出者有正而不距正亦當為匹誤與此同由中出者聖人之道也外有能受之者乃出耳由從也從內出者聖人垂跡顯教也良由物能感聖故聖人顯應若使外物不能稟受聖人亦終不出教由外入者假學以成性者也雖性可學成然要當內有其質若無主於中則無以藏聖道也隱藏也由外入者習學而成性也由其外稟聖教宜在心中若使素無受入之心則無藏於聖道家世父曰由中出者師其成心者也由外入者學一先生言暖暖姝姝而私自說者也師其成心則外有所不能受聖人不能出而強之使受也學一先生之言而私自說則中莫得所主聖人不能隱於其心而為之主也夫名者天下之所共用名鳴也公平也器用也名有二種一是命物二是毀譽今之所言是毀譽名也名公器也釋名云名鳴也公平也器用也尹文子云名有三科一曰命物之名方圜是也二曰毀譽之名善惡是也三曰況謂之名愛憎是也今此是毀譽之名也矯飾過實多取者也多取而天下亂也夫令譽善名天下共用必其多取則矯飾過實而爭競斯起也猶傳舍也蘧音渠司馬郭云蘧廬猶傳舍也夫仁義者人之性也人性有變古今不同也故游寄而過去則冥若滯而係於一方則見見則偽生偽生而責多矣蘧廬逆旅傳舍也覯見也亦久也夫蘧廬客舍不可久停仁義禮智用訖宜廢客停久疵釁生聖跡留過責起覯古豆反見也遇也闕誤引張君房本名下有者字也字依趙諫議本刪世德堂本性可作由假古之至人假道於仁託宿於義以遊逍遙之虛食於苟簡之田立於不貸之圃逍遙無為也苟簡易養也不貸無出也古者謂是采真之遊隨時而變無常跡也古之真人和光降跡逗機而行博愛應物而用人群何異乎假借塗路寄託宿止暫時遊寓蓋非真實而動不傷寂應不離真故恆逍遙乎自得之場彷徨乎無為之境之虛音墟本亦作墟苟且也簡略也貸施與也知止知足食於苟簡之田不損己物立於不貸之圃而言田圃者明是聖人養生之地苟簡王云苟且也簡略也司馬本簡作閒云分別也慶藩案簡司馬本作閒案閒與簡同也淮南要略篇故節財薄葬閒服生焉閒服簡服也閒服謂三月之服也文選潘安仁夏侯常侍誄注及路史後紀引淮南並作簡服不貸敕代反司馬云施與也之圃音補有為則非仁義且從其簡故易養也只為逍遙累盡故能無為恬淡苟簡苟且簡素自足而已故易養也易養以豉反注同不貸者不損己以為物也不損我以益彼故無所出此三句覆釋前義也以為物于偽反遊而任之斯真采也真采真則色不偽矣古者聖人行苟簡等法謂是神采真實而無假偽逍遙任適而隨化遨遊也趙諫議本虛作墟世德堂本斯作則采真依世德堂本改以富為是者不能讓祿以顯為是者不能讓名親權者不能與人柄操之則慄舍之則悲而一無所鑒以闚其所不休者是天之戮民也怨恩取與諫教生殺八者正之器也唯循大變無所湮者為能用之故曰正者正也其心以為不然者天門弗開矣天下未有以所非自累者而各沒命於所是所是而以沒其命者非立乎不貸之圃也夫是富非貧貪於貨賄者豈能讓人財祿是顯非隱滯於榮位者何能與人名譽親愛權勢矜夸於物者何能與人之柄柄權也唯厭穢風塵羶臊榮利者故能棄之如遺舍之悲者操之不能不慄也操執權柄恐失所以戰慄舍去威力哀去所以憂悲操之七刀反舍之音捨注同言其知進而不知止則性命喪矣所以為戮是富好權之人心靈愚暗唯滯名利一無鑒識豈能窺見玄理而休心息智者乎如是之人雖復楚戮未加而情性以困故是自然刑戮之民喪息浪反夫怨敵必殺恩惠須償分內自取分外與佗臣子諫上君父教下應青春以生長順素秋以殺罰此八者治正之器不得不用之也守故不變則失正矣循順也湮塞也唯當順於人理隨於變化達於物情而無滯塞者故能用八事治之正變合於天理故曰正者正也其心之不能如是者天機之門擁而弗開天門心也湮者音因李云塞也亦滯也郭音煙又烏節反司馬本作歅疑也簡文作甄云隔也天門一云謂心也一云大道也趙諫議本無則字孔子見老聃而語仁義老聃曰夫播眯目則天地四方易位矣蚊虻噆膚則通昔不寐矣夫仁義憯然乃憤吾心亂莫大焉吾子使天下無失其朴吾子亦放風而動總德而立矣又奚傑然若負建鼓而求亡子者邪夫鵠不日浴而白烏不日黔而黑黑白之朴不足以為辯名譽之觀不足以為廣泉涸魚相與處於陸相呴以溼相濡以沫不若相忘於江湖外物加之雖小而傷性已大也仲尼滯於聖跡故發辭則語仁義夫播眯目目暗故不能辯東西蚊虻噆膚膚痛則徹宵不睡是以外物雖微為害必巨況夫仁非天理義不率性捨己效佗喪其本性其為害也豈眯目噆膚而已哉噆齧也播甫佐反又波我反音康字亦作康蚊音文字亦作虻音盲字亦作噆子盍反郭子合反司馬云齧也通昔昔夜也慶藩案昔猶夕通昔猶通宵也呂氏春秋任地篇曰孟夏之昔殺三葉而穫大麥淮南天文篇以至於仲春之夕乃收其藏而閉其寒正作夕書大傳曰月之朝月之中月之夕鄭注曰上旬為朝中旬為中下旬為夕字亦作昔尚之以加其性故亂仁義憯毒甚於蚊虻憤憒吾心令人煩悶擾亂物性莫大於此本亦作憒字者不審憯然七感反乃憤扶粉反本又作憒古內反慶藩案憤釋文本又作憒當從之賁貴形相近故從賁從貴之字常相混潛夫論浮侈篇懷憂憒憒後漢書王符傳作即其證也質全而仁義著風自動而依之德自立而秉之斯易持易行之道也放縱任也欲使蒼生喪其淳樸之性者莫若絕仁棄義則反冥我極也仲尼亦宜放無為之風教隨機務而應物總虛妄之至德立不測之神功亦有作放方往反放依也亦放方往反風而動司馬云放依也依無為之風而動也易持易行並以豉反言夫揭仁義以趨道德之鄉其猶擊鼓而求逃者無由得也建擊傑然用力貌夫揭仁義以趨道德之鄉何異乎打大鼓以求逃亡之子故鼓聲大而亡子遠仁義彰而道德廢也傑然郭居竭反又居謁反巨竭反夫揭其列其謁二反自然各已足鵠本又作鶴同胡洛反日黔巨淹反徐其金反司馬云黑也俱自然耳無所偏尚浴灑也染緇曰黔黔黑也辯者別其勝負也夫鵠白烏黑稟之自然豈須日日浴染方得如是以言物性其義例然黑白素樸各足於分所遇斯適故不足於分所以論勝負亦言辯變也黑白分定不可變白為黑也夫至足者忘名譽忘名譽乃廣耳修名立譽招物觀視如此劣何足自多唯忘遺名譽方可稱大耳之觀古亂反司馬本作讙言仁義之譽皆生於不足泉涸胡洛反相呴況付反又況于反相濡如主反又如瑜反以沫音末斯乃忘仁而仁者也此總結前文斥仁義之弊夫泉源枯竭魚傳沫以相濡樸散淳離行仁義以濟物及其江湖浩蕩各足所以相忘道德深玄得性所以虛淡既江湖比於道德濡沫方於仁義以此格量故不同日而語矣相忘並如字闕誤引張君房本重傑字趙諫議本同憤憤依後漢書改趙諫議本秉作乘放疑當作倣孔子見老聃歸三日不談弟子問曰夫子見老聃亦將何規哉老子方外大聖變化無常不可測量故無所談說也不談本亦作不言不的姓名直云弟子當是升堂之類共發此疑既見老子應有規誨何所聞而三日不談說孔子曰吾乃今於是乎見龍龍合而成體散而成章乘雲氣而養乎陰陽予口張而不能嗋予又何規老聃哉謂老聃能變化夫龍之德變化不恆以況至人隱顯無定故本合而成妙體妙體窈冥跡散而起文章文章煥爛言其因御無方自然已足言至人乘雲氣而無心順陰陽而養物也嗋合也心懼不定口開不合復何容暇聞規訓之言乎嗋許劫反合也闕誤引江南古藏本嗋下有舌舉而不能訒六字子貢曰然則人固有尸居而龍見雷聲而淵默發動如天地者乎賜亦可得而觀乎遂以孔子聲見老聃言至人其處也若死尸之安居其出也似龍神之變見其語也如雷霆之振響其默也類玄理之無聲是以奮發機動同二儀之生物者也既而或處或出或語或默豈有出處語默之異而異之哉然則至人必有出處默語不言之能故仲尼見之口開而不能合龍見賢遍反賜子貢名也子貢欲至觀至人龍德之相遂以孔子聲教而往見之賜亦本亦作賜也關誤引江南古藏本人上有至字闕誤引張君房本乎作哉老聃方將倨堂而應微曰予年運而往矣子將何以戒我乎倨踞也運時也老子自得從容故踞堂敖誕物感斯應微發其言予年衰邁何以教戒我乎倨堂居慮反跂也子貢曰夫三王五帝之治天下不同其係聲名一也而先生獨以為非聖人如何哉澆淳漸異步驟有殊用力用兵逆順斯異故云不同聲名令聞相係一也先生乃排三王為非聖有何意旨可得聞乎夫三王本或作三皇依注作王是也餘皆作三皇闕誤王作皇闕誤引江南古藏本天下下有也字老聃曰小子少進子何以謂不同汝少進前說不同所由對曰堯授舜舜授禹禹用力而湯用兵文王順紂而不敢逆武王逆紂而不肯順故曰不同堯舜二人既是五帝之數自夏禹以降便是三王堯讓舜舜讓禹禹治水而用力湯伐桀而用兵文王拘羑里而順商辛武王渡孟津而逆殷紂不同之狀可略言焉敦煌本此六字作堯與而舜受老聃曰小子少進余語汝三皇五帝之治天下黃帝之治天下使民心一民有其親死不哭而民不非也堯之治天下使民心親民有為其親殺其殺而民不非也舜之治天下使民心競民孕婦十月生子子生五月而能言不至乎孩而始誰則人始有夭矣禹之治天下使民心變人有心而兵有順殺盜非殺人自為種而天下耳是以天下大駭儒墨皆起其作始有倫而今乎婦女何言哉余語汝三皇五帝之治天下名曰治之而亂莫甚焉三皇之知上悖日月之明下睽山川之精中墮四時之施其知憯於蠣蠆之尾鮮規之獸莫得安其性命之情者而猶自以為聖人不可恥乎其無恥也三皇者伏羲神農黃帝也五帝少昊顓頊高辛唐虞也治天下之列在下文余語魚據反下同若非之則強哭三皇行道人心淳一不獨親其親不獨子其子故親死不哭而世俗不非必也非之則強哭者眾則強其丈反殺降也言親疏者降殺五帝行德不及三皇使父子兄弟更相親愛為降殺之服以別親疏既順人心亦不非毀為其于偽反殺其殺並所戒反降也注同家世父曰殺其殺者意主於相親定省之儀拜跪之節凡出於儀文之末者皆可以從殺也郭象云親疏有降殺誤教之速也舜是五帝之末其俗漸澆樸散淳離民心浮競遂使懷孕之婦十月生子五月能言古者懷孕之婦十四月而誕育生子兩歲方始能言澆淳既革故與古之乖異也孕以證反誰者別人之意也未孩已擇人言其競教速成也未解孩笑已識是非分別之心自此而始矣孩亥才反說文云笑也別人彼列反下同不能同彼我則心競於親疏故不終其天年也分別既甚不終天年夭折之始起自虞舜此言兵有順則天下已有不順故也去道既遠澆偽日興遂使蠢爾之民好為禍變廢無為之跡興有為之心賞善罰惡以此為化而禹懷慈愛猶解泣辜兵刃所加必順天道也盜自應死殺之順也故非殺盜賊有罪理合其誅順乎素秋雖殺非殺此則兵有順義也不能大齊萬物而人人自別斯人自為種也承百代之流而會乎當今之變其弊至於斯者非禹也故曰天下耳言聖知之跡非亂天下而天下必有斯亂夫澆浪既興分別日甚人人自為種見不能大齊萬物此則解人有心也聖智之跡使其如是非禹之過也故曰天下耳矣為種章勇反注同家世父曰人自為種類以成乎天下於是乎有善惡之分是非之辨兵者逆人之性而制其死生者也既有善惡之分是非之辨而兵之用繁矣於是據之以為順而殺盜者謂之當然因乎人心之變而兵以施焉而人之心乃日變而不可窮矣此乃百代之弊此總論三皇五帝之跡驚天下蒼生致使儒崇堯舜以飾非墨遵禹道而自是既而百家競起九流爭後代之弊實此之由也大駭胡楷反今之以女為婦而上下悖逆者非作始之無理但至理之弊遂至於此倫理也當莊子之世六國競興淫風大行以女為婦乖禮悖德莫甚於茲故知聖跡始興故有倫理及其末也例同斯弊也家世父曰荀子樂論亂世之徵其服組其容婦楊倞注婦好貌此而今乎婦女言諸子之興其言皆有倫要而終相與為諧好以悅人也弊生於理故無所復言從理生教遂至於此世澆俗薄何可稍言論主發憤而傷歎也復言扶又反必弊故也夫三皇之治實自無為無為之跡跡生於弊故百代之後亂莫甚焉弊亂之狀列在下文悖逆也睽離也墮廢壞也施澤也運無為之智以立治方後世執跡遂成其弊致星辰悖彗日月為之不明山川乖離岳瀆為之崩竭廢壞四時寒暑為之敘之知音智下同上悖補對反下睽苦圭反又音圭乖也中墮許規反之施式豉反僭毒也蠣蠆尾端有毒也鮮規小貌言三皇之智損害蒼生其為毒也甚於蠣蠆是故細小蟲獸能遭擾動況乎黔首如何得安以斯為聖於理未可毒害既多深可羞媿也憯於七感反蠣敕邁反又音例本亦作厲郭音賴又敕介反蠆許謁反或敕邁反或云依字上當作蠆下當作蠍通俗文云長尾為蠆短尾為蠍王引之曰釋文云蠣敕邁反又音例本亦作厲郭音賴又敕介反蠆許謁反或敕邁反或云依字上當作蠆下當作蠍案陸讀蠣為蠆讀蠆為蠍皆非也音賴又音例陸云本亦作厲即其證也蠆音敕邁反蠍音許謁反蠆皆蠍之異名也廣雅曰蠆蠍也今本廣雅脫字一切經音義卷五引廣雅蠆蠍也集韻引廣雅蠆也今據補音盧達反蠆皆毒螫傷人之名蠆之言音哲一切經音義卷十引字林曰螫也僖二十二年左傳正義引通俗文曰蠍毒傷人曰之言瘌也瘌音盧達反郭璞注方言曰瘌辛螫也字或作刺左思魏都賦曰蔡莽螫刺昆蟲毒噬也是也廣雅釋詁云毒瘌痛也是其義矣與古同聲莊子作廣雅作其實一字也史記秦本紀厲共公始皇紀作剌龔公剌之通作厲猶之通作矣鮮規之獸李云鮮規明貌一云小蟲也一云小獸也世德堂本皇作王闕誤引江南古藏本黃上有昔字唐寫本其殺作其服子貢蹴蹴然立不安子貢本謂老子獨絕三王故欲同三王於五帝耳今又見老子通毀五帝上及三皇則失其所以為談矣蹴蹴驚悚貌也子貢欲三王同五帝今見老子詞調高邈排擯五帝指斥三皇心形驚悚失其所謂故蹴蹴然形容雖立心神不安蹴蹴子六反孔子謂老聃曰丘治詩書禮樂易春秋六經自以為久矣孰知其故矣以奸者七十二君論先王之道而明周召之跡一君無所鉤用甚矣夫人之難說也道之難明邪老子曰幸矣子之不遇治世之君也夫六經先王之陳跡也豈其所以跡哉今子之所言猶跡也夫跡履之所出而跡豈履哉夫白鶂之相視眸子不運而風化蟲雄鳴於上風雌應於下風而風化類自為雌雄故風化性不可易命不可變時不可止道不可壅苟得於道無自而不可失焉者無自而可所以跡者真性也夫任物之真性者其跡則六經也奸音干三蒼云犯也鉤用鉤取也甚矣夫音符篇末同難說始銳反治世直吏反況今之人事則以自然為履六經為跡鶂以眸子相視蟲以鳴聲相應俱不待合而便生子故曰風化白鶂五歷反三蒼云鶬鶂也司馬云鳥子也之相視眸茂侯反子不運而風化司馬云相待風氣而化生也又云相視而成陰陽蟲雄鳴於上風雌應於下風而化一本作而風化司馬云雄者黿類雌者鱉類夫同類之雌雄各自有以相感相感之異不可勝極苟得其類其化不難故乃有遙感而風化也類自為雌雄故風化或說云方之物類猶如草木異種而同類也山海經云亶爰之山有獸焉其狀如狸而有髮其名曰師類帶山有鳥其狀如鳳五采文其名曰奇類皆自牝牡也可勝音升故至人皆順而通之可壅於勇反雖化者無方而皆可也所在皆不可也闕誤引張君房本而下有感字下句而下同闕誤引張君房本故下有曰字今書而化作而風化孔子不出三月復見曰丘得之矣烏鵲孺魚傅沫細要者化有弟而兄啼久矣夫丘不與化為人不與化為人安能化人言物之自然各有性也鵲居巢內交尾而表陰陽魚在水中傅沫而為牝牡蜂取桑蟲祝為己子是知物性不同稟之大道物之自然各有性也復見扶又反下賢遍反又如字烏鵲孺如喻反李云孚乳而生也魚傅音附又音付本亦作傳直專反沫音末司馬云傳沫者以沫相育也一云傅口中沫相與而生子也細要一遙反者化蜂之屬也司馬云取桑蟲祝使似己也案即詩所謂螟蛉有子果蠃負之是慶藩案列子釋文上引司馬云稚蜂細要者取桑蟲祝之使似己之子也視釋文所引為詳言人之性舍長而幼故啼也有弟而兄失愛舍長憐幼故啼是知陳跡不可執留但當順之物我無累郭云言人性舍長視幼故啼也舍音捨長張丈反夫與化為人者任其自化者也若播六經以說則疏也親字依道藏本改老子曰可丘得之矣
