body:
  text: 外篇駢拇第八舉事以名篇駢拇枝指出乎性哉而侈於德附贅縣疣出乎形哉而侈於性多方乎仁義而用之者列於五藏哉而非道德之正也是故駢於足者連無用之肉也枝於手者樹無用之指也多方駢枝於五藏之情者淫僻於仁義之行而多方於聰明之用也駢合也拇足大指也謂足大拇指與第二指相連合為一指也枝指者謂手大拇指傍枝生一指成六指也出乎性者謂此駢枝二指並稟自然性命生分中有之侈多也德謂仁義禮智信五德也言曾史稟性有五德蘊之五藏於性中非剩也駢步田反廣雅云並也李云併也拇音母足大指也司馬云駢拇謂足拇指連第二指也崔云諸指連大指也枝指如字三蒼云枝指手有六指也崔云音歧謂指有歧也盧文弨曰歧當作岐後人強分之而侈昌是反徐處豉反郭云多貌司馬云溢也崔云過也於德崔云德猶容也夫長者不為有餘短者不為不足此則駢贅皆出於形性非假物也然駢與不駢其性各足而此獨駢枝則於眾以為多故曰侈耳而惑者或云非性因欲割而棄之是道有所不存德有所不載而人有棄才物有棄用也豈是至治之意哉夫物有小大能有少多所大即駢所多即贅駢贅之分物皆有之若莫之任是都棄萬物之性也附生之贅肉縣係之小疣並稟形以後方有故出乎形哉而侈性者譬離曠稟性聰明列之藏府非關假學故無侈性也附贅章銳反廣雅云疣也釋名云橫生一肉屬著體也一云瘤結也縣音玄疣音尤而侈於性司馬云性人之本體也駢拇枝指附贅縣疣此四者各出於形性而非形性之正於眾人為侈耳於形為侈於性為多故在手為莫用之肉於足為無施之指也王云性者受生之質德者全生之本駢枝受生而有不可多於德贅疣形後而生不可多於性此四者以況才智德行俞樾曰性之言生也駢拇枝指生而已然者也故曰出乎性附贅縣疣成形之後而始有者也故曰出乎形德者所以生者也天地篇曰物得以生謂之德是也駢拇枝指出乎性而以德言之則侈矣附贅縣疣出乎形而以性言之則侈矣崔云德猶容也司馬云性人之本體也混性與德與形而一之殊失其旨家世父曰釋文引王云性者受生之質德者全生之本駢拇枝指與生俱來故曰出於性附贄縣疣形既具而後附焉故曰出於形夫音符發句之端放此至治直吏反之分符問反後可以意求物皆有之之或作定夫與物冥者無多也故多方於仁義者雖列於五藏然自一家之正耳未能與物無方而各正性命故曰非道德之正夫方之少多天下未之有限然少多之差各有定分毫芒之際即不可以相跂故各守其方則少多無不自得而惑者聞多之不足以正少因欲棄多而任少是舉天下而棄之不亦妄乎方道術也言曾史之德性多仁義羅列藏府而施用之此直一家之知未能大冥萬物天能與物冥者故當非仁非義而應夫仁義不多不少而應夫多少千變萬化與物無窮無所偏執故是道德之正五藏才浪反後皆同黃帝素問云肝心脾肺腎為五藏直自性命不得不然非以有用故然也夫駢合之拇無益於行步故雖有此連終成無用之肉枝生於手指者既不益操捉故雖樹立此肉終是無用之指也欲明稟自然天性有之非關助用而生也五藏之情直自多方耳而少者橫復尚之以至淫僻而失至當於體中也夫曾史之徒性多仁義以此情性駢於藏府性少之類矯情慕之務此為行求於天理既非率性遂成淫僻淫者耽滯僻者不正之貌淫僻本又作辟匹亦反徐敷赤反注及篇末同於仁義之行下孟反崔云駢枝贅疣雖非性之正亦出於形不可去也五藏之情雖非道德之正亦列於性不可治也今設仁義之教以治五藏之情猶削駢枝贅疣也既傷自然之理更益其疾也橫復扶又反篇末注皆同至當丁浪反後皆倣此聰明之用各有本分故多方不為有餘少方不為不足然情欲之所蕩未嘗不賤少而貴多也見夫可貴而矯以尚之則自多於本用而困其自然之性若乃忘其所貴而保其素分則與性無多而異方俱全矣言離曠素分足於聰明性少之徒矯情為尚以此為用不亦謬乎闕誤引張君房本方作三字依釋文補世德堂本性作於是故駢於明者亂五色淫文章青黃黼黻之煌煌非乎而離朱是已多於聰者亂五聲淫六律金石絲竹黃鐘大呂之聲非乎而師曠是已枝於仁者擢德塞性以收名聲使天下簧鼓以奉不及之法非乎而曾史是已駢於辯者纍瓦結繩竄句遊心於堅白同異之閒而敝跬譽無用之言非乎而楊墨是已故此皆多駢旁枝之道非天下之至正也斧形謂之黼兩己相背謂之黻五色青黃赤白黑也青與赤為文赤與白為章煌煌眩目貌也豈非離朱乎是也已助聲也離朱一名離婁黃帝時明目人百里察毫毛也黼黻音甫下音弗周禮云白與黑謂之黼黑與青謂之黻煌煌音皇廣雅云光也向崔本作向云馬氏音煌毛詩傳云皇皇猶煌煌也煌又音晃盧文弨曰舊作光光也今據本書刪一光字非乎向云非乎言是也離朱司馬云黃帝時人百步見秋毫之末一云見千里針鋒孟子作離婁是已向云猶是也夫有耳目者未嘗以慕聾盲自困也所困常在於希離慕曠則離曠雖性聰明乃是亂耳目之主也五聲謂宮商角徵羽也六律黃鐘大呂姑洗蕤賓無射夾鐘之徒是也六律陽六呂陰總十二也金石絲竹匏土革木此八音也非乎言滯著此聲音豈非是師曠乎師曠字子野晉平公樂師極知音律言離曠二子素分聰明庸昧之徒橫生希慕既失本性寧不困乎然則離曠聰明乃是亂耳目之主也五聲本亦作五音師曠司馬云晉賢大夫也善音律能致鬼神史記云冀州南和人生而無目夫曾史性長於仁耳而性不長者橫復慕之慕之而仁仁已偽矣天下未嘗慕桀跖而必慕曾史則曾史之簧鼓天下使失其真性甚於桀跖也枝於仁者謂素分枝多仁義如生分中枝生一指也擢用五德既偏滯邪淫仍閉塞正性用斯接物以收聚名聲遂使蒼生馳動奔競如笙簧鼓吹能感動於物欣企也然曾史性長於仁義而不長者橫復慕之捨短效長故言奉不及之法也擢拔謂拔擢偽德塞其真性也曾者姓曾名參字子輿仲尼之弟子史者姓史名字子魚衛靈公臣此二人並稟性仁孝故舉之擢德音濯司馬云拔也王念孫曰塞與擢義不相類塞當為搴擢搴皆謂拔取之也廣雅云搴取也楚詞離騷注及史記叔孫通傳索隱引許慎並與廣雅同方言作攓云取也南楚曰攓說文作云拔取也拔也樊光注爾雅及李奇注漢書季布欒布田叔傳贊並與廣雅同此言世之人皆擢其德搴其性務為仁義以收名聲非謂塞其性也淮南俶真篇曰俗世之學擢德攓性內愁五藏外勞耳目乃始招蟯振繾物之毫芒搖消掉捎仁義禮樂暴行越智於天下以招號名聲於世又曰今萬物之來擢拔吾性攓取吾情皆其證也隸書手字或作若字作舉字作奉之類故搴字或作形與塞相似因訛而為塞矣簧鼓音黃謂笙簧也鼓動也曾史曾參史也曾參行仁史行義跖之石反夫騁其奇辯致其危辭者未曾容思於檮杌之口而必競辯於楊墨之閒則楊墨乃亂群言之主也楊者姓楊名朱字子居宋人也墨者姓墨名翟亦宋人也為宋大夫以其行墨之道故稱為墨此二人並墨之徒稟性多辯咸能致高談危險之辭鼓動物性固執是非如緘結藏匿文句使人難解其游心學處惟在堅執守白之論是非同異之閒未始出非人之域也蹩自持也亦用力之貌譽光贊也楊墨之徒並矜其小學炫燿眾人誇無用之言惑於群物然則楊墨豈非亂群之師乎言即此楊墨而已也纍劣彼反瓦危委反向同崔如字一云瓦當作丸結繩云言小辯危詞若結繩之纍瓦也崔云聚無用之語如瓦之纍繩之結也竄七亂反爾雅云微也一云藏也句紀具反司馬云竄句謂邪說微隱穿鑿文句也一音鉤敝本亦作蹩徐音婢郭父結反李步計反司馬云罷也跬徐丘婢反郭音屑向崔本作向丘氏反云近也司馬同李卻垂反一云敝跬分外用力之貌譽音餘家世父曰釋文敝跬分外用力之貌今案跬譽猶云咫言方言半步為跬司馬法一舉足曰跬跬三尺也跬譽者邀一時之近譽也敝如周禮弓人筋欲敝之敝謂勞敝也敝精罷神於近名而無實用之言故謂之駢於辯楊墨崔李云楊朱墨翟也容思息嗣反檮杌上徒刀反下音兀此數子皆師其天性直自多駢旁枝各自是一家之正耳然以一正萬則萬不正矣故至正者不以己正天下使天下各得其正而已言此數子皆自天然聰明仁辯如合駢之拇傍生枝指稟之素分豈由人為故知率性多仁乃是多駢傍枝之道也而愚惑之徒捨己效物求之分外由而不已然搖動物性由此數人以一正萬故非天下至道正理也此數色主反下文此數音同趙諫議本鐘作鍾李字依世德堂本及釋文原本改彼正正者不失其性命之情故合者不為駢而枝者不為跂長者不為有餘短者不為不足是故鳧脛雖短續之則憂鶴脛雖長斷之則悲故性長非所斷性短非所續無所去憂也意仁義其非人情乎彼仁人何其多憂也物各任性乃正正也自此已下觀之至正可見矣以自然之正理正蒼生之性命故言正也物各自得故言不失也言自然者即我之自然所言性命者亦我之性命也豈遠哉故言正正者以不正而正正而不正之無言之也自此以上明矯性之失自此以下顯率性之得也俞樾曰上正字乃至字之誤上文云故此皆多駢旁枝之道非天下之至正也此云彼至正者不失其性命之情兩文相承今誤作正正義不可通郭曲為之說非是以枝正合乃謂合為駢以合正枝乃謂枝為跂以枝望合乃謂合為駢而合實非駢以合望枝乃謂枝為跂而枝實非跂也不為跂其知反崔本作枝音同或渠支反以短正長乃謂長有餘以長正短乃謂短不足長者謂曾史離曠楊墨並稟之天性蘊蓄仁義聰明俊辯比之群小故謂之長率性而動故非有餘短者眾人比曾史等不及故謂之短然亦天機自張故非為不足各自有正不可以此正彼而損益之鳧小鴨也鶴鶬之類也脛腳也自然之理亭毒眾形雖復脩短不同而形體各足稱事咸得逍遙而惑者方欲截鶴之長續鳧之短以為齊深乖造化違失本性所以憂悲鳧音符脛形定反釋名云莖也直而長如物莖也本又作鶴戶各反斷之丁管反下及注同知其性分非所斷續而任之則無所去憂而憂自去也夫稟性受形僉有崖量脩短明暗素分不同此如鳧鶴非所斷續如此即各守分內雖為無勞去憂憂自去也去憂起呂反注去憂去也同夫仁義自是人之情性但當任之耳意如字下同亦作醫恐仁義非人情而憂之者真可謂多憂也噫嗟歎之聲也夫仁義之情出自天理率性有之非由放效彼仁人者則是曾史之徒不體真趣橫生勸獎謂仁義之道可學而成莊生深嗟此迷故發噫歎分外引物故謂多憂也非其非人情乎者是人之情性者也闕誤引江南古藏本云岐作跂今本作跂疑釋文云崔本作枝之枝係岐字之誤故云或渠支反之無二字依劉文典補正本刪並以之字屬言字下其非依正文改且夫駢於拇者決之則泣枝於手者齕之則啼二者或有餘於數或不足於數其於憂一也今世之仁人蒿目而憂世之患不仁之人決性命之情而饕貴富故意仁義其非人情乎自三代以下者天下何其囂囂也謂之不足故泣而決之以為有餘故啼而齕之夫如此雖群品萬殊無釋憂之地矣唯各安其天性不決駢而齕枝則曲成而無傷又何憂哉齕者齧斷也決者離析也有餘於數謂枝生六指也不足於數謂駢為四指也夫駢枝二物自出天然但當任置未為多少而惑者不能忘淡固執是非謂枝為有餘駢為不足橫欲決駢齕枝成於五數既傷造化所以泣啼故決齕雖殊其憂一也齕李音紇恨發反齒斷也徐胡勿反郭又胡突反啼音提崔本作諦兼愛之跡可尚則天下之目亂矣以可尚之跡蒿令有患而遂憂之此為陷人於難而後拯之也然今世正謂此為仁也蒿目亂也仁兼愛之跡也今世猶末代言曾史之徒行此兼愛遂令惑者捨己效人希幸之路既開耳目之用亂矣耳目亂則患難生於是憂其紛擾還救以仁義不知患難之所興興乎聖跡也蒿目好羔反司馬云亂也李云蒿目快性之貌盧文弨曰今本快作決俞樾曰司馬與郭注共以蒿目二字為句解為亂天下之目義殊未安蒿乃之假字玉篇目部庾鞠切目明又望也是為望視之貌仁人之憂天下必為之然遠望故曰目而憂世之患與蒿古音相近故得通用詩靈臺篇白鳥翯翯孟子梁惠王篇作鶴鶴文選景福殿賦作然則蒿之通作猶翯之通作鶴與矣周易文言傳確乎其不可拔說文土部曰塙堅不可拔也即本易義是確與塙通亦其例也蒿令力呈反下同於難乃旦反後拯拯救之拯夫貴富所以可饕由有蒿之者也若乃無可尚之跡則人安其分將量力受任豈有決己效彼以饕竊非望哉饕貪財也素分不懷仁義者謂之不仁之人也意在貪求利祿偷竊貴富故絕己之天性亡失分命真情而矯性偽情舍我逐物良由聖跡可尚故有斯弊者也是知抱樸還淳必須絕仁棄義饕吐刀反杜預注左傳云貪財曰饕此重結前旨也慶藩案意讀為抑抑或作意語詞也論語學而篇抑與之與漢石經作意墨子非命篇意將以為利天下乎晏子春秋雜篇意者非臣之罪乎漢書敘傳曰其抑者從橫之事復起於今乎抑者與意者同並與此句法一例或言意者或單言意義亦同也夫仁義自是人情也而三代以下橫共囂囂棄情逐跡如將不及不亦多憂乎自從也三代夏殷周也囂囂猶讙聒也夫仁義者出自性情而三代以下棄情徇跡囂囂競逐何愚之甚是以夏行仁殷行義周行禮即此囂囂之狀也囂囂許橋反又五羔反字林云聲也崔云憂世之貌世德堂本雖作舉釋文原刻作快世德堂本作決世德堂本棄作乘且夫待鉤繩規矩而正者是削其性者也待繩約膠漆而固者是侵其德者也屈折禮樂呴俞仁義以慰天下之心者此失其常然也天下有常然常然者曲者不以鉤直者不以繩圓者不以規方者不以矩附離不以膠漆約束不以纆索故天下誘然皆生而不知其所以生同焉皆得而不知其所以得故古今不二不可虧也則仁義又奚連連如膠漆纆索而遊乎道德之間為哉使天下惑也鉤曲繩直規圓矩方也夫物賴鉤繩規矩而後曲直方圓也此非天性也人待教跡而後仁義者非真性也夫真率性而動非假學也故矯性偽情舍己效物而行仁義者是減削毀損於天性也約束縛也固牢也侵傷也德真智也夫待繩索約束膠漆堅固者斯假外物非真牢者也喻學曾史而行仁者此矯偽非實性也既乖本性所以侵傷其德也屈曲也折截也呴俞猶嫗撫也揉直為曲施節文之禮折長就短行漫澶之樂嫗撫偏愛之仁呴俞執跡之義以此偽真以慰物心遂使物喪其真人亡其本既而棄本逐末故失其真常自然之性者也此則總結前文之失以生後文之得也屈崔本作詘折之熱反謂屈折支體為禮樂也呴況於反李況付反本又作傴於禹反俞音臾李音喻本又作呴音詡謂呴喻顏色為仁義之貌夫天下萬物各有常分至如蓬曲麻直首圓足方也水則冬凝而夏釋魚則春聚而秋散斯出自天然非假諸物豈有鉤繩規矩膠漆纆索之可加乎在形既然於性亦爾故知禮樂仁義者亂天之經者也又解附離離依也故漢書云哀帝時附離董氏者皆起家至二千石注云離依之也纆音墨廣雅云索也索悉各反下同夫物有常然任而不助則泯然自得而不自覺也誘然生物稟氣受形或方或圓乍曲乍直亭之毒之各足於性悉莫辨其然皆不知所以生豈措意於緣慮情係於得失者乎是知屈折呴俞失其常也同物故與物無二而常全夫見始終以不一者凡情之闇惑也睹古今之不二者聖智之明照也是以不生而生不知所以生不得而得不知所以得雖復時有古今而法無虧損千變萬化常唯一也任道而得則抱朴獨往連連假物無為其閒也奚何也連連猶接續也夫道德者非有非無不生不滅不可以聖智求安得以形名取而曾史之類性多於仁以己率物滯於名教束縛既似緘繩執固又如膠漆心心相續連連不斷懷挾此行遨遊道德之鄉者譬猶以圓學方以魚慕鳥徒希企尚之名終無功用之實筌蹄不忘魚兔又喪已陳芻狗貴此何為也連連司馬云謂連續仁義遊道德間也仁義連連祇足以惑物使喪其真仁義之教聰明之跡乖自然之道亂天下之心祇足音支使喪息浪反下已喪同夫小惑易方大惑易性何以知其然邪自虞氏招仁義以撓天下也天下莫不奔命於仁義是非以仁義易其性與故嘗試論之自三代以下者天下莫不以物易其性矣小人則以身殉利士則以身殉名大夫則以身殉家聖人則以身殉天下故此數子者事業不同名聲異號其於傷性以身為殉一也臧與穀二人相與牧羊而俱亡其羊問臧奚事則挾筴讀書問穀奚事則博塞以遊二人者事業不同其於亡羊均也伯夷死名於首陽之下盜跖死利於東陵之上二人者所死不同其於殘生傷性均也奚必伯夷之是而盜跖之非乎天下盡殉也彼其所殉仁義也則俗謂之君子其所殉貨財也則俗謂之小人其殉一也則有君子焉有小人焉若其殘生損性則盜跖亦伯夷已又惡取君子小人於其間哉夫東西易方於體未虧矜仁尚義失其常然以之死地乃大惑也夫指南為北其迷尚小滯跡喪真為惑更大然如是也此即假設疑問以出後文夫與物無傷者非為仁也而仁跡行焉令萬理皆當者非為義也而義功見焉故當而無傷者非仁義之招也然而天下奔馳棄我徇彼以失其常然故亂心不由於醜而恆在美色撓世不由於惡而恆由仁義則仁義者撓天下之具也虞氏舜也招取也撓亂也自唐堯以前猶懷質朴虞舜以後淳風漸散故以仁義聖跡招慰蒼生遂使宇宙黎元荒迷奔走喪於性命逐於聖跡以撓而小反郭呼堯反又許羔反廣雅云亂也又奴爪反俞樾曰國語周語好盡言以招人過韋注曰招舉也舊音曰招音翹漢書陳勝傳贊招八州而朝同列鄧展曰招舉也蘇林曰招音翹此文招字亦當訓舉而讀為翹言舉仁義以撓天下也郭注曰故當而無傷者非仁義之招也然而天下奔馳棄我殉彼以失其常然是讀如本字然以仁義招人不得反云招仁義可知其非矣功見賢遍反雖虞氏無易之之情而天下之性固以易矣由是觀之豈非用仁義聖跡撓亂天下使天下蒼生棄本逐末而改其天性耶性與音餘此可以意消息後皆倣此自三代以上實有無為之跡無為之跡亦有為者之所尚也尚之則失其自然之素故雖聖人有不得已或以槃夷之事易垂拱之性而況悠悠者哉五帝以上猶扇無為之風三代以下漸興有為之教澆淳異世步驟殊時遂使捨己效人易奪真性殉物不及不亦悲乎注云或以槃夷之事易垂拱之性者槃夷猶創傷也言夏禹以風櫛雨沐手足胼胝以此辛苦之事易於無為之業居上既爾下民亦然也三代夏殷周也以上時掌反槃夷並如字謂創傷也依字應作瘢痍夫鶉居而鷇食鳥行而無章者何惜而不殉哉故與世常冥唯變所適其跡則殉世之跡也所遇者或時有槃夷禿脛之變其跡則傷性之跡也然而雖揮斥八極而神氣無變手足槃夷而居形者不擾則奚殉哉無殉也故乃不殉其所殉而跡與世同殉也殉從也營也求也逐也謂身所以從之也夫小人貪利廉士重名大夫殉為一家帝王營於四海所殉雖異易性則同然聖人與世常冥其跡則殉故有瘢痍禿脛之變而未始累其神者也殉辭俊反徐辭倫反司馬云營也崔云殺身從之曰殉鶉音純又音敦鷇口豆反禿吐木反揮斥上音揮下音赤數子者則前之三世以下四人也事業者謂利名家天下不同也名聲者謂小人士大夫聖人異號也言此四人事業雖復不同名聲異號也其於殘生以身逐物未始不均也此仍前舉譬以生後文也孟子云臧善學人穀孺子也揚雄云男婿婢曰臧穀良家子也牧養也亡失也言此二人各耽事業俱失其羊也臧作郎反崔云好書曰臧方言云齊之北鄙燕之北郊凡民男而婿婢謂之臧女而婦奴謂之獲張揖云婿婢之子謂之臧婦奴之子謂之獲與穀如字爾雅云善也崔本作云孺子曰牧羊牧養之牧奚何也冊簡也古人無紙皆以簡冊寫書行五道而投瓊曰博不投瓊曰塞問臧問穀乃有書塞之殊牧羊亡羊實無復異也挾音協筴字又作策初革反李云竹簡也古以寫書長二尺四寸博塞悉代反塞博之類也漢書云吾丘壽王以善格五待詔謂博塞也此下合譬也伯夷叔齊並孤竹君之子也孤竹神農氏之後也姜姓伯夷名允字公信叔齊名致字公遠夷長而庶齊幼而嫡父常愛齊數稱之於夷及其父薨兄弟相讓不襲先封聞文王有德乃往於周遇武王伐紂扣馬而諫諫不從走入首陽山採薇為糧不食周粟遂餓死首陽山山在蒲州河東縣蒲州城南三十里見有夷齊廟墓林木森盜跖者柳下惠之從弟名跖徒卒九千常為巨盜故以盜為名東陵者山名又云即太山也在齊州界去東平十五里跖死其上也首陽山名在河東蒲阪縣死謂餓而死東陵李云謂泰山也一云陵名今名東平陵屬濟南郡慶藩案文選任彥昇王文憲集注引司馬云東陵陵名今屬濟南也釋文闕伯夷殉名死於首陽之下盜跖貪利殞於東陵之上乃名利所殉不同其於殘傷未能相異也天下之所惜者生也今殉之太甚俱殘其生則所殉是非不足復論據俗而言有美有惡以道觀者何是何非故盜跖不必非伯夷豈獨是慶藩案慧琳一切經音義卷八十九梁高僧傳四引司馬云盜跖兇惡人也釋文闕此總結前文以成後義但道喪日久並非適當今俗中盡殉豈獨夷跖從於仁義未始離名逐於貨財固當走利唯名與利殘生之本即非天理近出俗情君子小人未可正據也天下皆以不殘為善今均於殘生則雖所殉不同不足復計也夫生奚為殘性奚為易哉皆由乎尚無為之跡也若知跡之由乎無為而成則絕尚去甚而反冥我極矣堯桀將均於自得君子小人奚哉惡何也其所殉名利則有君子小人之殊若殘生損性曾無盜跖伯夷之異此蓋俗中倒置非關真極於何而取君子於何而辨小人哉言無別也又惡音烏取君子小人於其間哉崔本無小人於三字之字依王叔岷說補家字依正文補序字依文選改辨字依世德堂本改且夫屬其性乎仁義者雖通如曾史非吾所謂臧也屬其性於五味雖通如俞兒非吾所謂臧也屬其性乎五聲雖通如師曠非吾所謂聰也屬其性乎五色雖通如離朱非吾所謂明也吾所謂臧者非仁義之謂也臧於其德而已矣吾所謂臧者非所謂仁義之謂也任其性命之情而已矣吾所謂聰者非謂其聞彼也自聞而已矣吾所謂明者非謂其見彼也自見而已矣夫不自見而見彼不自得而得彼者是得人之得而不自得其得者也適人之適而不自適其適者也夫適人之適而不自適其適雖盜跖與伯夷是同為淫僻也余愧乎道德是以上不敢為仁義之操而下不敢為淫僻之行也以此係彼為屬屬性於仁殉仁者耳故不善也屬係也臧善也吾莊生自稱也夫捨己效人得物喪我者流俗之偽情也故係我天性學彼仁義雖通達聖跡如曾參史魚乖於本性故非論生之所善也屬其郭時欲反謂係屬也徐音燭屬著也下皆同率性通味乃善孟子云俞兒齊之識味人也尸子云俞兒和薑桂為人主上食夫自無天素效物得知假令通似俞兒非其善故也雖通如楊墨一本無此句俞兒音榆李式榆反司馬云古之善識味人也崔云尸子曰膳俞兒和之以薑桂為人主上食淮南云俞兒狄牙嘗淄澠之水而別之一云俞兒黃帝時人狄牙則易牙齊桓公時識味人也一云俞兒亦齊人淮南子一本作申兒疑申當為臾不付之於我而屬之於彼則雖通之如彼而我己喪矣故各任其耳目之用而不係於離曠乃聰明也夫離朱師曠稟分聰明率性而能非關學致今乃矯性偽情捨己效物雖然通達未足稱善也善於自得忘仁而仁德得也夫達於玄道者不易性以殉者也豈復執已陳之芻狗滯先王之蘧廬者哉故當知其自知得其自得以斯為善不亦宜乎謂仁義為善則損身以殉之此於性命還自不仁也身且不仁其如人何故任其性命乃能及人及人而不累於己彼我同於自得斯可謂善也夫曾參史魚楊朱墨翟此四子行仁義者蓋率性任情稟之天命譬彼駢枝非由學得而惑者睹曾史之仁義言放效之可成聞離曠之聰明謂庶幾之必致豈知造物而亭毒之乎故王弼注易云不性其情焉能久行其致斯之謂也不累劣偽反後皆倣此夫絕離棄曠自任聞見則萬方之聰明莫不皆全也夫希離慕曠見彼聞他心神馳奔耳目竭喪此乃愚闇豈曰聰明若聽耳之所聞視目之所見保分任真不蕩於外者即物皆聰明也此舍己效人者也雖效之若人而己已亡矣夫不能視見之所見而見目以求離之明不能知知之所知而役知以慕史魚之義者斯乃偽情學人之得非謂率性自得己得也既而偽學外顯效彼悅人作偽心勞故不自適其適也舍己音捨苟以失性為淫僻則雖所失之塗異其於失之一也淫滯也僻邪也夫保分率性正道也尚名好勝邪淫也是以捨己逐物開希幸之路者雖伯夷之善盜跖之惡亦同為邪僻也重舉適人之適者此疊前生後以起文勢故也愧道德之不為謝冥復之無跡故絕操行忘名利從容吹累遺我忘彼若斯而已矣夫虛通之道至忘之德絕仁絕義無利無名而莊生妙體環中遊心物表志操絕乎仁義心行忘乎是非體自然之無有愧道德之不為而言上下者顯仁義淫僻之優劣也而云余愧不敢者示謙也郭注云從容吹累者從容猶閒放而吹累動而無心也吹風也累塵猶清風之動微塵輕舉也愧乎崔本作云愧同之行下孟反注同冥復音服從容七容反吹如字又昌偽反字亦作炊
