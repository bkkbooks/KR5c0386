body:
  text: 內篇養生主第三夫生以養存則養生者理之極也若乃養過其極以養傷生非養生之主也養生以此為主也吾生也有涯而知也無涯以有涯隨無涯殆已已而為知者殆而已矣為善無近名為惡無近刑緣督以為經可以保身可以全生可以養親可以盡年所稟之分各有極也涯分也夫生也受形之載稟之自然愚智脩短各有涯分而知止守分不蕩於外者養生之妙也然黔首之類莫不稱吾則凡稱吾者皆有極者也有涯本亦作崖魚佳反夫舉重攜輕而神氣自若此力之所限也而尚名好勝者雖復絕膂猶未足以慊其願此知之無涯也故知之為名生於失當而滅於冥極冥極者任其至分而無毫銖之加是故雖負萬鈞苟當其所能則忽然不知重之在身雖應萬機泯然不覺事之在己此養生之主也所形性各有限極而分別之智徇物無涯遂使心困形勞未慊其願不能止分非養生之主也而知音智注下同好勝呼報反下升證反雖復扶又反下皆同絕膂音旅以慊苦簟反足也盧文弨曰古與慊恨之慊同一聲並不以音愜者為足之正詁以有限之性尋無極之知安得而不困哉夫生也有限知也無涯是以用有限之生逐無涯之知故形勞神弊而危殆者也殆已向云疲困之謂已困於知而不知止又為知以救之斯養而傷之者真大殆也無涯之知已用於前有為之學救之於後欲不危殆其可得乎家世父曰營營以求知而極乎無涯終乎殆矣而此營營之知存於心足以累性而害心冥然而物化寂然而神凝使其知不生於心成性存存泯知以全生故曰已而為知者殆而已矣忘善惡而居中任萬物之自為悶然與至當為一故刑名遠己而全理在身也夫有為俗學抑乃多徒要切而言莫先善惡故為善也無不近乎名譽為惡也無不鄰乎刑戮是知俗智俗學未足以救前知適有疲役心靈更增危殆無近附近之近下同慶藩案文選嵇叔夜幽憤詩注引司馬云勿修名也被褐懷玉穢惡其身以無陋於形也釋文闕家世父曰船山云聲色之類不可名之為善者即惡也悶然亡本反又音門遠己于萬反順中以為常也緣順也督中也經常也夫善惡兩忘刑名雙遣故能順一中之道處真常之德虛夷任物與世推遷養生之妙在乎茲矣緣督以為經李云緣順也督中也經常也郭崔同慶藩案文選左太沖魏都賦注引司馬云緣順也督中也順守道中以為常也釋文闕李楨曰素問骨空論督者起於少腹以下骨中央靈樞本輸篇七次脈頸中央之脈督脈也人身惟脊居中督脈並脊裏而上故訓中督為奇經之一脈莊子正是假脈為喻故下為保身全生等語家世父曰船山云奇經八脈以任督主呼吸之息身前之中脈曰任身後之中脈曰督督者居靜而不倚於左右有脈之位而無形質緣督者以清微纖妙之氣循虛而行止於所不可行而行自順以適得其中養親以適以養羊尚反注同苟得中而冥度則事事無不可也夫養生非求過分蓋全理盡年而已矣夫惟妙捨二偏而處於中一者故能保守身形全其生道外可以孝養父母大順人倫內可以攝衛生靈盡其天命趙諫議本而作其脈字依素問原文改庖丁為文惠君解牛手之所觸肩之所倚足之所履膝之所踦砉然嚮然奏刀騞然莫不中音合於桑林之舞乃中經首之會庖丁謂掌廚丁役之人今之供膳是也亦言丁名也文惠君即梁惠王也解宰割之也踦下角刺也言庖丁善能宰牛見其閒理故以其手觸以肩倚著用腳蹋履用膝刺築遂使皮肉離析砉然嚮應進奏鸞刀騞然大解此蓋寄庖丁以明養生之術者也庖丁崔本作胞同白交反庖人丁其名也管子有屠牛坦一朝解九牛刀可剃毛盧文弨曰禮記祭統煇胞亦與庖同為于偽反文惠君崔司馬云梁惠王也所倚徐於綺反向偃彼反徐又於佇反李音妖所踦徐居彼反向魚彼反李云刺也砉然向呼鶪反徐許鶪反崔音畫又古鶪反李又呼歷反司馬云皮骨相離聲盧文弨曰舊鶪皆從貝非今正從狊下並同嚮然許丈反郭許亮反本或無然字奏如字崔云聞也騞呼獲反徐許嬖反向他亦反又音麥崔云音近獲聲大於砉也言其因便施巧無不閑解盡理之甚既適牛理又合音節桑林殷湯樂名也經首咸池樂章名則堯樂也庖丁神彩從容妙盡牛理既而割聲嚮雅合宮商所以音中桑林韻符經首也中音丁仲反下皆同桑林司馬云湯樂名崔云宋舞樂名案即左傳舞師題以旌夏是也經首向司馬云咸池樂章也崔云樂章名也或云奏樂名因便婢面反閑解音蟹文惠君曰譆善哉技蓋至此乎譆歎聲也惠君既見庖丁因便施巧奏刀音節遠合樂章故美其技術一至於此者也譆徐音熙李云歎聲也技具綺反下同庖丁釋刀對曰臣之所好者道也進乎技矣始臣之解牛之時所見無非全牛者三年之後未嘗見全牛也方今之時臣以神遇而不以目視官知止而神欲行依乎天理批大卻導大窾因其固然技經肯綮之未嘗而況大軱乎良庖歲更刀割也族庖月更刀折也今臣之刀十九年矣所解數千牛矣而刀刃若新發於硎彼節者有閒而刀刃者無厚以無厚入有閒恢恢乎其於遊刃必有餘地矣是以十九年而刀刃若新發於硎雖然每至於族吾見其難為怵然為戒視為止行為遲動刀甚微謋然已解如土委地提刀而立為之四顧為之躊躇滿志善刀而藏之直寄道理於技耳所好者非技也捨釋鸞刀對荅養生之道故倚技術進獻於君又解進過也所好者養生之道過於解牛之技耳所好呼報反注同未能見其理閒始學屠宰未見閒理所睹惟牛亦猶初學養生未照真境是以觸途皆礙但見其理閒也操刀既久頓見理閒所以纔睹有牛已知空卻亦猶服道日久智照漸明所見塵境無非虛幻闇與理會遇會也經乎一十九年合陰陽之妙數率精神以會理豈假目以看之亦猶學道之人妙契至極推心靈以虛照豈用眼以取塵也神遇向云暗與理會謂之神遇司察之官廢縱心而順理順官者主司之謂也謂目主於色耳司於聲之類是也既而神遇不用目視故眼等主司悉皆停廢從心所欲順理而行善養生者其義亦然官知止如字崔云官知謂有所掌在也向音智專所司察而後動謂之官智而神欲行如字向云從手放意無心而得謂之神欲不橫截也依天然之腠理終不橫截以傷牛亦猶養生之妙道依自然之涯分必不貪生以夭折也有際之處因而批之令離閒卻交際之處用刀而批戾之令其筋骨各相離異亦猶學道之人生死窮通之際用心觀照令其解脫批備結反一音鋪迷反字林云擊也父迷父節二反大卻徐去逆反郭音卻崔李云閒也盧文弨曰從谷從舊從谷從非今改正令離力呈反下同下力智反節解窾空就導令殊窾空也骨節空處導令殊亦猶學人以有資空將空導有道音導注同大窾徐苦管反又苦禾反崔郭司馬云空也向音空盧文弨曰今本道作導窾與科通故亦同音慶藩案說文無窾字當作款史記太史公自序實不中其身者謂之窾漢書司馬遷傳窾正作款服虔注款空也爾雅釋器鼎款足者謂之鬲注款空也淮南說山見款木浮而知為舟高注款空也管子國蓄大國內款楊注內款內空也是其證節解戶賣反刀不妄加因其空卻之處然後運刀亦因其眼見耳聞必不妄加分別也技之妙也常遊刃於空未嘗經概於微礙也技經本或作猗其綺反徐音技俞樾曰郭注以技經為技之所經殊不成義技經肯綮四字必當平列釋文曰肯說文作字林同著骨肉也一曰骨無肉也綮司馬云猶結處也是肯綮並就牛身言技經亦當同之技疑枝字之誤素問三部九候論治其經絡王注引靈樞經曰經脈為裏支而橫者為絡古字支與枝通枝謂枝脈經謂經脈枝經猶言經絡也經絡相連之處亦必有礙於游刃庖丁惟因其固然故未嘗礙也李楨曰俞氏改技為枝訓為經絡說信塙矣未嘗二字須補訓義依俞說嘗當訓試說文試用也言於經絡肯綮之微礙未肯以刀刃嘗試之所謂因其固然者肯徐苦等反說文作肯字林同口乃反云著骨肉也一曰骨無肉也崔云許叔重曰骨間肉肯肯著也綮苦挺反崔向徐並音啟李烏係反又一音罄司馬云猶結處也經概古代反微礙五代反軱戾大骨衄刀刃也肯綮肉著骨處也軱大骨也夫伎術之妙遊刃於空微礙尚未曾經大骨理當不犯況養生運智妙體真空細惑尚不染心塵豈能累德大軱音孤向郭云觚戾大骨也崔云槃結骨衄刀女六反不中其理閒也良善之庖猶未中理經乎一歲更易其刀況小學之人未體真道證空捨有易奪之心者矣良庖司馬云良善也割也司馬云以刀割肉故歲歲更作崔云歲一易刀猶堪割也中骨而折刀也況凡鄙之夫心靈闇塞觸境皆礙必損智傷神族庖司馬云族雜也崔云族眾也俞樾曰郭注曰中骨而折刀也此於文義未合上文云良庖歲更刀割也割以用刀言則折亦以用刀言折謂折骨非謂刀折也哀元年左傳曰無折骨硎砥石也硎砥礪石也陰數也九陽數也故十九年極陰陽之妙也是以年經十九牛解數千遊空涉虛不損鋒刃故其刀銳利猶若新磨者也況善養生人智窮空有和光處世妙盡陰陽雖復千變萬化而自新其德參涉萬境而常湛凝然矣硎音刑磨石也崔本作形云新所受形也砥石音脂又之履反尚書傳云砥細於礪皆磨石也彼牛骨節素有閒卻而刀刃鋒銳薄而不厚用無厚之刃入有閒之牛故遊刃恢恢必寬大有餘矣況養生之士體道之人運至忘之妙智遊虛空之物境是以安排造適閒暇有餘境智相冥不一不異重疊前文結成其義交錯聚結為族不復屬目於他物也為戒于偽反下皆同屬目意章欲反徐其手也節骨交聚磐結之處名為族也雖復遊刃於空善見其卻每至交錯之處未嘗不留意艱難為其怵惕戒慎專視徐手況體道之人雖復達彼虛幻至於境智交涉必須戒慎艱難不得輕染根塵動傷於寂者也得其宜則用力少謋然化百反徐又許百反已解音蟹下皆同理解而無刀跡若聚土也謋化百反謋然骨肉離之聲也運動鸞刀甚自微妙依於天理所以不難如土委地有何蹤跡況運用神智明照精微涉於塵境曾無罣礙境智冥合能所泯然逸足容豫自得之謂解牛事訖閒放從容提挈鸞刀彷徨徙倚既而風韻清遠所以高視四方志氣盈滿為之躊躇自得養生會理其義亦然提刀徐徒嵇反躊直留反躇直於反拭刀而弢之也善能保愛故拭而弢之況攝生人光而不耀善刀善猶拭也拭音式弢之他刀反盧文弨曰弢從得聲舊本山下又訛今改正全字依趙諫議本補闕誤引文如海劉得一本此句下有牛不知其死也六字趙本無其字閒字理順依趙本改就字依注文改章字依釋文原本改文惠君曰善哉吾聞庖丁之言得養生焉以刀可養故知生亦可養魏侯聞庖丁之言遂悟養生之道也美其神妙故歎以善哉公文軒見右師而驚曰是何人也惡乎介也天與其人與曰天也非人也天之生是使獨也人之貌有與也以是知其天也非人也介偏刖之名姓公文名軒宋人也右師官名也介刖也公文見右師刖足故驚問所由於何犯忤而致此殘刖足者也公文軒司馬云姓公文氏名軒宋人也右師司馬云宋人也簡文云官名惡乎音烏介音戒一音兀司馬云刖也向郭云偏刖也崔本作兀又作云斷足也家世父曰善養生者養以神神全則生全形雖介可也樊中之雉神固王矣而固不得其養則神者淡然泊然怡然渙然無為為之優遊自得之神也可以外形骸齊生死而何有於介哉偏刖音月又五刮反知之所無柰何天也犯其所知人也為稟自天然少茲一足為犯於人事故被虧殘此是公文致問之辭故也天與其人與並音餘又皆如字司馬云為天命為人事也偏刖曰獨夫師一家之知而不能兩存其足則是知之無所無柰何若以右師之知而必求兩全則心神內困而形骸外弊矣豈直偏刖而已哉夫智之明闇形之虧全並稟自天然非關人事假使犯於王憲致此形殘亦是天生頑愚謀身不足直知由人以虧其形不知由天以暗其智是知有與獨無非命也使獨司馬云一足曰獨之知音智下之知同兩足共行曰有與有與之貌未有疑其非命也以有與者命也故知獨者亦非我也是以達生之情者不務生之所無以為達命之情者不務命之所無柰何也全其自然而已與共也凡人之貌皆有兩足共行稟之造物故知我之一腳遭此形殘亦無非命也欲明窮通否泰愚智虧全定乎冥兆非由巧拙達斯理趣者方可全生所無依道藏褚伯秀本改澤雉十步一啄百步一飲不蘄畜乎樊中神雖王不善也蘄求也樊所以籠雉也夫俯仰乎天地之間逍遙乎自得之場固養生之妙處也又何求於入籠而服養哉蘄求也樊中雉籠也夫澤中之雉任於野性飲啄自在放曠逍遙豈欲入樊籠而求服養譬養生之人蕭然嘉遁唯適情於林籟豈企羨於榮華又解澤似雉而非澤尾長而雉尾短澤雉之類是也一啄涉角反不蘄音祈求也樊中音煩李云藩也所以籠雉也向郭同崔以為園中也妙處昌慮反夫始乎適而未嘗不適者忘適也雉心神長王志氣盈豫而自放於清曠之地忽然不覺善為之為善也雉居山澤飲啄自在心神長王志氣盈豫當此時也忽然不覺善之為善既遭樊籠性情不適方思昔日甚為清暢鳥既如此人亦宜然欲明至適忘適至善忘善雖王于況反注同長王丁亮反又直良反之為二字依世德堂本改老聃死秦失弔之三號而出人弔亦弔人號亦號老君即老子也姓李名耳字伯陽外字老聃大聖人也降生陳國苦縣當周平王時去周西度流沙適之罽賓而內外經書竟無其跡而此獨云死者欲明死生之理泯一凡聖之道均齊此蓋莊生寓言耳而老君為大道之祖為天地萬物之宗豈有生死哉故託此言聖人亦有死生以明死生之理也故老君降生行教昇天備載諸經不具言也秦失者姓秦名失懷道之士不知何許人也既死且弔奚洎三號而俯跡同凡事終而出也老聃吐藍反司馬云老子也秦失本又作佚各依字讀亦皆音逸三號戶羔反注同弟子曰非夫子之友邪怪其不倚戶觀化乃至三號也秦失老君俱遊方外既號且弔豈曰清高故門人驚疑起非友之問倚戶於綺反曰然然猶是也秦失答弟子云是我方外之友然則弔焉若此可乎方外之人行方內之禮號弔如此於理可乎未解和光更致斯問者也曰然始也吾以為其人也而今非也向吾入而弔焉有老者哭之如哭其子少者哭之如哭其母彼其所以會之必有不蘄言而言不蘄哭而哭者是天倍情忘其所受古者謂之遁天之刑適來夫子時也適去夫子順也安時而處順哀樂不能入也古者謂是帝之縣解至人無情與眾號耳故若斯可也然猶可也動寂相即內外冥符故若斯可也秦失初始入弔謂哭者是方外門人及見哀痛過知非老君弟子也嫌其先物施惠不在理上往故致此甚愛也蘄求也彼眾人也夫聖人虛懷物感斯應哀憐兆庶愍念蒼生不待勤求為其演說故其死也眾來聚會號哭悲痛如於母子斯乃凡情執滯妄見死生感於聖恩致此哀悼以此而測故知非老君門人也少者詩照反先物悉薦反又如字理上往一本往作住天性所受各有本分不可逃亦不可加是指斥哭人也倍加也言逃遯天然之性加添流俗之情妄見死之可哀故忘失所受之分也遯天徒遜反又作遁倍情音裴加也又布對反本又作背感物大深不止於當遁天者也將馳騖於憂樂之境雖楚戮未加而性情已困庸非刑哉夫逃遁天理倍加俗情哀樂經懷心靈困苦有同捶楚寧非刑戮古之達人有如此議大深音泰憂樂音洛下文注同時自生也理當死也夫子者是老君也秦失歎老君大聖妙達本源故適爾生來皆應時而降誕蕭然死去亦順理而返真耳夫哀樂生於失得者也今玄通合變之士無時而不安無順而不處冥然與造化為一則無往而非我矣將何得何失孰死孰生哉故任其所受而哀樂無所錯其閒矣安於生時則不厭於生處於死順則不惡於死千變萬化未始非吾所適斯適故憂樂無錯其懷矣所錯七路反以有係者為縣則無係者縣解也縣解而性命之情得矣此養生之要也帝者天也為生死所係者為縣則無死無生者縣解也夫死生不能係憂樂不能入者而遠古聖人謂是天然之解脫也且老君大聖冥一死生豈復逃遁天刑馳騖憂樂子玄此注失之遠矣若然者何謂安時處順帝之縣解乎文勢前後自相鉾楯是知遁天之刑屬在哀慟之徒非關老君也縣音玄解音蟹注同崔云以生為縣以死為解闕誤引文如海本其作至遁字依世德堂本改趙諫議本作住指窮於為薪火傳也不知其盡也窮盡也為薪猶前薪也前薪以指指盡前薪之理故火傳而不滅心得納養之中故命續而不絕明夫養生乃生之所以生也窮盡也薪柴樵也為前也言人然火用手前之能盡然火之理者前薪雖盡後薪以續前後相繼故火不滅也亦猶善養生者隨變任化與物俱遷故吾新吾曾無係戀未始非我故續而不絕者也指窮於為薪如字絕句為猶前也火傳也直專反注同傳者相傳繼續也崔云薪火爝火也傳延也俞樾曰郭注曰為薪猶前薪也前薪以指指盡前薪之理故火傳不滅此說殊未明了且為之訓前亦未知何義郭注非也廣雅釋詁取為也然則為亦猶取也指窮於為薪者指窮於取薪也以指取薪而然之則有所不給矣若聽火之自傳則忽然而不知其薪之盡也郭得其讀未得其義釋文引崔云薪火爝火也則並失其讀矣家世父曰薪盡而火傳有不盡者存也太虛來往之氣人得之以生猶薪之傳火也其來也無與拒其去也無與留極乎薪而止矣而薪自火也火自傳也取以為無盡也執薪以求火執火以求傳奚當哉之中丁仲反夫時不再來今不一停故人之生也一息一得耳向息非今息故納養而命續前火非後火故為薪而火傳火傳而命續由夫養得其極也世豈知其盡而更生哉夫迷忘之徒役情執固豈知新新不住念念遷流昨日之我於今已盡今日之我更生於後耶舊來分此一篇為七章明義觀其文勢過為繁冗今將為善合於第一指窮合於老君總成五章無所猜嫌也趙諫議本火傳二字不重
