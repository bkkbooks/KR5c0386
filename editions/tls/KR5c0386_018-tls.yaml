body:
  text: 外篇刻意第十五以義名篇刻意尚行離世異俗高論怨誹為亢而已矣此山谷之士非世之人枯槁赴淵者之所好也語仁義忠信恭儉推讓為修而已矣此平世之士教誨之人遊居學者之所好也語大功立大名禮君臣正上下為治而已矣此朝廷之士尊主強國之人致功并兼者之所好也就藪澤處閒曠釣魚閒處無為而已矣此江海之士避世之人閒暇者之所好也吹呴呼吸吐故納新熊經鳥申為壽而已矣此道引之士養形之人彭祖壽考者之所好也刻削也意志也亢窮也言偏滯之人未能會理刻勵身心高尚其行離世異俗卓爾不群清談五帝之風高論三皇之教怨有才而不遇誹無道而荒淫亢志林籟之中削跡岩崖之下斯乃隱處山谷之士非毀時世之人枯槁則鮑焦介推之流赴淵則申狄卞隨之類蓋是一曲之士何足以語至道哉已止也其術止於此矣刻意司馬云刻削也峻其意也案謂削意令峻也廣雅云意志也尚行下孟反離世力智反高論力困反怨誹非謂反徐音非李云非世無道怨己不遇也為亢苦浪反李云窮高曰亢枯槁苦老反赴淵司馬云枯槁若鮑焦介推赴淵若申徒狄發辭吐氣則語及仁義用茲等法為修身之本此乃平時治世之士施教誨物之人斯乃子夏之在西河宣尼之居洙泗或遊行而議論或安居而講說蓋是學人之所好良非道士之所先所好呼報反下及注皆同建海內之功績立今古之鴻名致君臣之盛禮主上下之大義寧安社稷緝熙常道既而尊君主而服遐荒強本邦而兼并敵國豈非朝廷之士廊廟之臣乎即皋陶伊尹呂望之徒是也為治直吏反下同此朝直遙反栖隱山藪放曠皋澤閒居而事綸釣避世而處無為天子不得臣諸侯不得友斯乃從容閒暇之人即巢父許由公閱休之類藪素口反處閒音閑下同魡魚本亦作釣同彫叫反盧文弨曰今本魡作釣此數子者所好不同恣其所好各之其方亦所以為逍遙也然此僅各自得焉能靡所不樹哉若夫使萬物各得其分而不自失者故當付之無所執為也吹冷呼而吐故呴暖吸而納新如熊攀樹而自經類鳥飛空而伸腳斯皆導引神氣以養形魂延年之道駐形之術故彭祖八百歲白石三千年壽考之人即此之類以前數子志尚不同各滯一方未為通美自不刻意而下方會玄玄之妙致也吹呴況于反字亦作喣呼吸許及反吐故納新李云吐故氣納新氣也熊經如字李古定反司馬云若熊之攀樹而引氣也鳥申如字郭音信司馬云若鳥之嚬呻也道引音導下同李云導氣令和引體令柔此數所主反僅其靳反焉能如虔反趙諫議本道作導下同若夫不刻意而高無仁義而修無功名而治無江海而閒不道引而壽無不忘也無不有也澹然無極而眾美從之此天地之道聖人之德也所謂自然忘故能有若有之則不能救其忘矣故有者非有之而有也忘而有之也夫玄通合變之士冥真契理之人不刻意而其道彌高無仁義而恆自修習忘功名而天下大治去江海而淡爾清閒不導引而壽命無極者故能唯物與我無不盡忘而萬物歸之故無不有也斯乃忘而有之非有之而有也家世父曰仁義者人與人相接而見焉者也愛焉之謂仁因乎人而愛之是固有人之見存也宜焉之謂義因乎人而宜之是仍有己之見存也無人己之見存則仁義之名可以不立而所修者乃真修也慶藩案忘乃亡之借字亡猶已也管子乘馬篇今日為明日忘貨史記孟嘗君傳所期勿忘其中並與亡同漢書武五子傳臣聞子胥於忠而忘其號師古注忘亡也淮南修務篇南榮疇恥聖道之獨亡於己賈子勸學篇亡作忘皆其例若厲己以為之則不能無極而眾惡生心不滯於一方跡冥符於五行是以澹然虛曠而其道無窮萬德之美皆從於己也澹大暫反徐音談然一本作澹而不為萬物而萬物自生者天地也不為百行而百行自成者聖人也天地無心於亭毒而萬物生聖人無心於化育而百行成是以天地以無生生而為道聖人以無為為而成德故老經云天地不仁聖人不仁百行下孟反下及篇末百行同故曰夫恬惔寂漠虛無無為此天地之平而道德之質也故曰聖人休休焉則平易矣平易則恬惔矣平易恬惔則憂患不能入邪氣不能襲故其德全而神不虧非夫寂漠無為也則危其平而喪其質也恬惔寂漠是凝湛之心虛無無為是寂用之智天地以此法為平均之源道德以此法為質實之本也恬惔大暫反徐音談下皆同質也質正也而喪息浪反下同休乎恬惔寂漠息乎虛無無為則雖歷乎阻險之變常平夷而無難休心於恬惔之鄉息智於虛無之境則履艱難而簡易涉危險而平夷也人休虛求反息也下及注同平易以豉反下及注皆同俞樾曰休焉二字傳寫誤倒此本作故曰聖人休焉休則平易矣天道篇故帝王聖人休焉休則虛與此文法相似可據訂正無難乃旦反下同患難生於有為有為亦生於患難故平易恬惔交相成也豈唯休心恬惔故平易抑乃平易而恬矣是知平易恬惔交相成也泯然與正理俱往心既恬惔跡又平易唯心與跡一種無為故慇憂患累不能入其靈臺邪氣妖氛不能襲其藏府襲猶入也互其文也邪氣似嗟反下同夫不平不惔者豈唯傷其形哉神德並喪於內也夫恬惔無為者豈唯外形無毀亦乃內德圓全形德既安則精神無損虧矣闕誤引張君房本休休焉作休焉休唐寫本入下襲下均有也字唐寫本虧下有矣字世德堂本作險阻故曰聖人之生也天行其死也物化靜而與陰同德動而與陽同波不為福先不為禍始感而後應迫而後動不得已而後起去知與故循天之理故無天災無物累無人非無鬼責其生若浮其死若休不思慮不豫謀光矣而不燿信矣而不期其寢不夢其覺無憂其神純粹其魂不罷虛無恬惔乃合天德任自然而運動蛻然無所係聖人體勞息之不二達去來之為一故其生也如天道之運行其死也類萬物之變化任鑪冶之陶鑄無纖介於胸中也蛻然音帨又始銳反動靜無心而付之陰陽也凝神靜慮與大陰同其盛德應感而動與陽氣同其波瀾動靜順時無心者也無所唱也夫善為福先惡為禍始既善惡雙遣亦禍福兩忘感而後應豈為先始者也會至乃動迫至也逼也動應也和而不唱赴機而應任理而起吾不得已也已止也機感至事不得止而後起應非預謀天理自然知故無為乎其間循順也內去心知外忘事故如混沌之無為順自然之妙理也去知起呂反慶藩案故詐也晉語多為之故以變其志韋注曰謂多作計術以變易其志呂覽論人篇去巧故高注巧故偽詐也淮南主術篇上多故則下多詐高注故巧也皆其例管子心術篇去智與故尹知章注故事也失之災生於違天合天故無災也累生於逆物順物故無累也與人同者眾必是焉同人故無非也同於自得故無責汎然無所惜也夫聖人動靜無心死生一貫故其生也如浮漚之蹔起變化俄然其死也若疲勞休息曾無繫戀也付之天理心若死灰絕於緣念理至而應譬懸鏡高堂物來斯照終不預前謀度而待機務者也用天下之自光非吾燿也智照之光明逾日月而韜光晦跡故不炫燿於物也用天下之自信非吾期也逗機赴感如影隨形信若四時必無差忒機來方應不預期也契真故凝寂而不夢累盡故常適而無憂也其覺古孝反一無所欲純粹者不雜也既無夢無憂契真合道故其心神純粹而無閒雜也粹雖遂反有欲乃疲恬惔無為心神閒逸故其精魂應用終不疲勞不罷音皮乃與天地合其恬惔之德也歎此虛無與天地合其德逼字依上句疏文改上正文迫而後動疏謂迫至也逼也逼與通形近而誤世德堂本無其字故曰悲樂者德之邪喜怒者道之過好惡者德之失故心不憂樂德之至也一而不變靜之至也無所於忤虛之至也不與物交惔之至也無所於逆粹之至也故曰形勞而不休則弊精用而不已則勞勞則竭違心則悲順意則樂不達違從是德之邪妄悲樂音洛下同稱心則喜乖情則怒喜怒不忘是道之罪過無好為好無惡為惡此之心是德之愆咎也好惡烏路反至德常適故情無所概不喜不怒無憂無樂恬惔虛夷至德之人也靜而一者不可變也抱真一之玄道混囂塵而不變自非至靜孰能如斯其心豁然確盡乃無纖介之違忤逆也大順群生無所乖逆自非虛豁之極其孰能然也於忤五故反確苦角反纖介音界物自來耳至惔者無交物之情守分情高不交於物無所須待恬惔之至也若雜乎濁欲則有所不順智照精明至純無雜故能混同萬物大順蒼生論忤之與逆厥理不殊顯虛粹兩義故再言耳物皆有當不可失也夫形體精神稟之有限而役用無涯必之死地故分外勞形不知休息則困弊斯生精神逐物而不知止必當勞損損則精氣枯竭矣唐寫本邪字過字失字下均有也字水之性不雜則清莫動則平鬱閉而不流亦不能清天德之象也故曰純粹而不雜靜一而不變惔而無為動而以天行此養神之道也夫有干越之劍者柙而藏之不敢用也寶之至也精神四達並流無所不極上際於天下蟠於地化育萬物不可為象其名為同帝象天德者無心而偕會也象者法效也言水性清平善鑑於物若混而雜之擁鬱而閉塞之則乖於常性既不能漣漪流注亦不能鑒照於物也唯當不動不閉則清而且平洞照無私為物準的者天德之象也以況聖人心靈皎絜鑑照無私法象自然與玄天合德故老經云上善若水也無非至當之事也雖復和光同塵而精神凝湛此覆釋前其神純粹也常在當上住縱使千變萬化而心恆靜一此重釋一而不變與會俱而已矣假令混俗揚波而無妨虛惔與物交接亦不廢無為此釋前恬惔之至也若夫逐欲而動人行也感物而動應而無心同於天道之運行無心而生萬物總結以前天行等法是治身之術養神之道也況敢輕用其神乎干溪名也越山名也干溪越山俱出良劍也又云吳也言吳越二國並出名劍因以為名也夫有此干越之寶劍柙中而藏之自非敵國大事不敢輕用寶而重之遂至於此而況寶愛精神者乎干越之劍司馬云干吳也吳越出善劍也李云干溪越山出名劍案吳有溪名干溪越有山名若耶並出善鐵鑄為名劍也慶藩案王念孫曰干越猶言吳越漢書貨殖傳辟猶戎翟之與于越不相入矣于亦干之誤干越皆國名故言戎翟之與干越顏師古以為春秋之於越又因于而誤於當從司馬說為是淮南原道篇干越生葛絺高注曰干吳也劉本改干為于云于越一作於越非柙而戶甲反夫體天地之極應萬物之數以為精神者故若是矣若是而有落天地之功者任天行耳非輕用也流通也夫愛養精神者故能通達四方並流無滯既而下蟠薄於厚地上際逮於玄天四維上下無所不極動而常寂非輕用之者也下蟠音盤郭音煩所育無方化導蒼生含育萬物隨機俯應不守一方故不可以形象而域之也同天帝之不為帝審也總結以前名為審實之道也亦言同天帝之不為也已郭注及成玄瑛本敢下均有輕字唐寫本無同字純素之道唯神是守守而勿失與神為一一之精通合於天倫野語有之曰眾人重利廉士重名賢人尚志聖人貴精故素也者謂其無所與雜也純也者謂其不虧其神也能體純素謂之真人常以純素守乎至寂而不蕩於外則冥也純精素質之道唯在守神守神而不喪則精神凝靜既而形同枯木心若死灰物我兩忘身神為一也精者物之真也倫理也既與神為一則精智無礙故冥乎自然之理與神為一非守神也不遠其精非貴精也然其跡則貴守之也莊生欲格量人物志尚不同故汎舉大綱略為四品仍寄野逸之人以明言無的當且世俗眾多之人咸重財利則盜跖之徒是也貞廉純素之士皆重聲名則伯夷介推是也賢人君子高尚志節不屈於世則許由子州支伯是也唯體道聖人無所偏滯故能寶貴精神不蕩於物雖復應變隨時而不喪其純素也苟以不虧為純則雖百行同舉萬變參備乃至純也苟以不雜為素則雖龍章鳳姿倩乎有非常之觀乃至素也若不能保其自然之質而雜乎外飾則雖犬羊之鞹庸得謂之純素哉夫混跡世物之中而與物無雜者至素者也參變囂塵之內而其神不虧者至純者也豈復獨立於高山之頂拱手於林籟之閒而稱純素哉蓋不然乎此結釋前純素之道義也倩乎七練反之觀古喚反鞹苦郭反體悟解也妙契純素之理則所在皆真道也故可謂之得真道之人也趙諫議本之作跡
