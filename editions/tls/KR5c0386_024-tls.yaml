body:
  text: 外篇田子方第二十一以人名篇田子方侍坐於魏文侯數稱谿工姓田名無擇字子方魏之賢人也文侯師也文侯是畢萬七世孫武侯之父也姓谿名工亦魏之賢人田子方李云魏文侯師也名無擇慶藩案釋文引李云田子方名無擇無擇當作無斁擇皆從睪聲古通用字詩大雅思齊古之人無斁鄭箋作無擇說文斁厭也一曰終也無厭則有常故字曰子方禮檀弓鄭注云方常也數稱雙角反又所主反下同谿音溪又音兮司馬本作雞工李云谿工賢人也文侯曰谿工子之師邪子方曰非也無擇之里人也稱道數當故無擇稱之谿工是子方鄉里人也稱說言道頻當於理故無擇稱之不是師文侯曰然則子無師邪子方曰有曰子之師誰邪子方曰東郭順子文侯曰然則夫子何故未嘗稱之居在郭東因以為氏名順子子方之師也既是先生之師何故不稱說之子方曰其為人也真人貌而天虛緣而葆真清而容物物無道正容以悟之使人之意也消無擇何足以稱之無假也所謂真道人也雖貌與人同而獨任自然雖復貌同人理而心契自然也虛而順物故真不失緣順也虛心順物而恆守真宗動而常寂葆真音保本亦作保夫清者患於大絜今清而容物與天同也郭注云清者患於大絜今清而容物與天同也大絜音泰俞樾曰郭注以人貌而天四字為句殆失其讀也此當以人貌而天虛為句人貌天虛相對成義緣而保真為句與清而容物相對成義虛者孔竅也淮南子氾論篇若循虛而出入高注曰虛孔竅也訓孔竅故亦訓心俶真篇虛室生白注曰虛心也太玄斷初一曰斷心滅斧失初一曰刺虛滅刃滅刃與滅斧同刺虛與斷心同故毅初一曰懷威滿虛猶言滿心也說詳太玄經此云人貌而天虛即人貌而天心言其貌則人其心則天也學者不達虛字之義誤屬下讀則人貌而天句文義不完下兩句本相儷者亦參差不齊矣養生主篇緣督以為經釋文引李云緣順也緣而葆真者順而葆真也上綴虛字亦為無義曠然清虛正己而已而物邪自消世間無道之物斜僻之人東郭自正容儀令其曉悟使惑亂之意自然消除也物邪似嗟反師之盛德深玄若是無擇庸鄙何足稱揚也子方出文侯儻然終日不言召前立臣而語之曰遠矣全德之君子始吾以聖知之言仁義之行為至矣吾聞子方之師吾形解而不欲動口鉗而不欲言吾所學者直土梗耳夫魏真為我累耳儻然自失之貌聞談順子之德儻然靡據自然失所謂故終日不言於是召前立侍之臣與之語話歎東郭子之道深遠難知諒全德之人可以君子萬物也儻然敕蕩反司馬云失志貌而語魚據反自覺其近聖知音智之行下孟反形解戶買反口鉗其炎反其嚴反非真物也我初昔修學用先王聖智之言周孔仁義之行為窮理至極今聞說子方之師其道弘博遂使吾形解散不能動止口舌鉗困無可言語自覺所學土人而已逢雨則壞並非真物土梗者土人也直如字本亦作真下句同元嘉本此作真下句作直盧文弨曰今本作真土梗更猛反司馬云土梗土人也遭雨則壞慶藩案文選劉孝標廣絕交論注引司馬云梗土之榛梗也一切經音義二十引司馬云土梗土之木梗亦木人也土木相偶謂以物像人形皆曰偶耳與釋文異知至貴者以人爵為累也既聞真道隳體坐忘故知爵位壇土適為憂累耳徐字依世德堂本改溫伯雪子適齊舍於魯魯人有請見之者溫伯雪子曰不可吾聞中國之君子明乎禮義而陋於知人心吾不欲見也姓溫名伯字雪子楚之懷道人也中國魯國也陋拙也自楚往齊途經於魯止於主人之舍魯人是孔子門人聞溫伯雪賢人請欲相見溫伯不許云我聞中國之人明於禮義聖跡而拙於知人心是故不欲見也溫伯雪子李云南國賢人也至於齊反舍於魯是人也又請見溫伯雪子曰往也蘄見我今也又蘄見我是必有以振我也溫伯至齊反還舍魯是前之人復欲請見蘄求也振動也昔我往齊求見於我我今還魯復來求見必當別有所以故欲感動我來蘄音祈出而見客入而歎明日見客又入而歎其僕曰每見之客也必入而歎何耶前後見客頻自嗟嘆溫伯僕隸怪而問之曰吾固告子矣中國之民明乎禮義而陋乎知人心昔之見我者進退一成規一成矩從容一若龍一若虎其諫我也似子其道我也似父是以歎也槃辟其步逶蛇其跡擎跪揖讓前卻方圓逶迤若龍槃辟如虎從容七容反槃辟婢亦反遺如字本又作逶於危反盧文弨曰今本遺作逶蛇以支反禮義之弊有斯飾也其道音導匡諫我也如子之事父訓導我也似父之教子夫遠近尊卑自有情義既非天性何事殷勤是知聖跡之弊遂有斯矯是以歎之也闕誤引江南古藏本道作導仲尼見之而不言子路曰吾子欲見溫伯雪子久矣見之而不言何邪已知其心矣二人得意所以忘言仲由怪之是故起問仲尼曰若夫人者目擊而道存矣亦不可以容聲矣目裁往意已達無所容其德音也擊動也夫體悟之人忘言得理目裁運動而玄道存焉無勞更事辭費容其聲說也夫人音符目擊而道存矣司馬云見其目動而神實已著也擊動也郭云目裁往意已達顏淵問於仲尼曰夫子步亦步夫子趨亦趨夫子馳亦馳夫子奔逸絕塵而回瞠若乎後矣夫子曰回何謂邪曰夫子步亦步也夫子言亦言也夫子趨亦趨也夫子辯亦辯也夫子馳亦馳也夫子言道回亦言道也及奔逸絕塵而回瞠若乎後者夫子不言而信不比而周無器而民滔乎前而不知所以然而已矣奔逸絕塵急走也瞠直目貌也滅塵迅速不可追趁故直視而在後也器爵位也夫子不言而為人所信未曾親比而與物周旋實無人君之位而民足蹈乎前而眾聚也不知所然而然直置而已矣所謂奔逸絕塵也奔逸司馬本又本作徹瞠敕庚反又郎反字林云直視貌一音杜哽反又敕孟反慶藩案後漢書逸民傳注文選范蔚宗逸民傳論注並引司馬云言不可及也釋文闕不比而周毗志反滔乎前吐刀反謂無人君之器滔聚其前也又杜高反本又及丑字依世德堂本改仲尼曰惡可不察與夫哀莫大於心死而人死亦次之日出東方而入於西極萬物莫不比方有目有趾者待是而後成功是出則存是入則亡萬物亦然有待也而死有待也而生吾一受其成形而不化以待盡效物而動日夜無隙而不知其所終薰然其成形知命不能規乎其前丘以是日徂夫心以死為死乃更速其死其死之速由哀以自喪也無哀則已有哀則心死者乃哀之大也夫不比而周不言而信蓋由虛心順物豈徒然哉何可不忘懷鑒照夷心審察耶夫情之累者莫過心之變易變易生滅深可哀傷而以生死哀之次也惡可音烏察與音餘下哀與同自喪息浪反下章同皆可見也夫夜暗晝明東出西入亦人入幽出顯死去生來故知人之死生譬天之晝夜以斯寓比亦何惜哉家世父曰日之出也乘之以動焉其入也人斯息焉惟其明也物之待明而動者莫能外也待明而動待氣而生順之而已矣不能御氣而為生則亦不能強致其明而為動昔日之明今日之明也而固不能執今日之明一一以規合夫昔執今之明以規合夫昔是交臂而失之也彼有彼之步趨此有此之步趨肖者步趨也所以肖者非步趨也兩相忘於步趨之中而後與道大適惟能忘也而後所以不忘者於是乎存於人之步趨無所待焉是乘日之明而不知動者也謂之人死於人之步趨強致以求焉是忘今日之明而求之昔也是之謂心死死者襲焉而不化執焉而不移者也莊子語妙惟當以神悟之目成見功足成行功也趾足也夫人百體稟自陰陽目見足行資乎造化若不待此何以成功故知死生非關人也直以不見為亡耳竟不亡見日出謂之存睹日入謂之亡此蓋凡情之浪執非通聖人之達觀待隱謂之死待顯謂之生竟無死生也夫物之隱顯皆待造化隱謂之死顯謂之生日出入既無存亡物隱顯豈有生死耶夫有不得變而為無故一受成形則化盡無期也夫我之形性稟之造化明闇妍醜崖分已成一定已後更無變化唯常端然待盡以此終年妍醜既不自由生死理亦當任也自無心也夫至聖虛凝感來斯應物動而動自無心者也恆化新也變化日新泯然而無閒隙不以死為死也隨之不見其後薰然自成又奚為哉薰然自動之貌薰然稟氣成形無物使之然也薰然許云反不係於前與變俱往故日徂徂往也達於時變不能預作規模體於日新是故與化俱往也日徂如字司馬本作疽云病也吾終身與汝交一臂而失之可不哀與女殆著乎吾所以著也彼已盡矣而女求之以為有是求馬於唐肆也吾服女也甚忘女服吾也亦甚忘雖然女奚患焉雖忘乎故吾吾有不忘者存夫變化不可執而留也故雖執臂相守而不能令停若哀死者則此亦可哀也今人未嘗以此為哀奚獨哀死耶孔丘顏子賢聖二人共修一身各如交臂而變化日新遷流迅速牢執固守不能暫停把臂之間欻然已謝新既行矣故以失焉若以失故而悲此深可哀也能令力呈反下章注同唐肆非停馬處也言求向者之有不可復得也人之生若馬之過肆耳恆無駐須臾新故之相續不舍晝夜也著見也言汝殆見吾所以見者耳吾所以見者日新也故已盡矣汝安得有之殆近也著見也唐道肆市也吾所見者變故日新者也顏回孔子對面清談向者之言其則非遠故言殆著也彼之故事於今已滅汝仍求向時之有謂在於今者耳所謂求馬於唐肆也唐肆非停馬之處也向者見馬市道而行今時覆尋馬已過去亦猶向者之跡已滅於前求之於今物已變矣故知新新不住運運遷移耳女音汝殆著乎吾所以著也郭著音張慮反注同又一音張略反司馬云吾所以著者外化也汝殆庶於此耳吾一不化者則非汝所及也是求馬於唐肆也郭云唐肆非停馬處也李同又云唐亭也司馬本作廣肆云廣庭也求馬於市肆廣庭非其所也馬處昌慮反可復扶又反不舍音捨服者思存之謂也甚忘謂過去之速也言汝去忽然思之恆欲不及復者尋思之謂也向者之汝於今已謝吾復思之亦竟忘失俱爾耳不問賢之與聖未有得停者變化日新不簡賢聖豈唯於汝抑亦在吾汝之思吾故事亦滅不忘者存謂繼之以日新也雖忘故吾而新吾已至未始非吾吾何患焉故能離俗絕塵而與物無不冥也夫變化之道無時暫停雖失故吾而新吾尚在斯有不忘者存也故未始非吾汝何患也離俗力智反下章文同唐寫本無故字王叔岷云執臂當作交臂劉文典云復當依正文作服孔子見老聃老聃新沐方將被髮而乾慹然似非人孔子便而待之少焉見曰丘也眩與其信然與向者先生形體掘若槁木似遺物離人而立於獨也寂泊之至被髮皮寄反而干本或作乾盧文弨曰今本作乾慹乃牒反又丁立反司馬云不動貌說文云怖也泊步各反既新沐髮曝之令乾凝神寂泊慹然不動若槁木故似非人孔子見之不敢往觸遂便徙所消息待之便而待待或作侍無其心身而後外物去也俄頃之間入見老子云丘見先生眼為眩燿忘遣形智信是聖人既而離異於人遺棄萬物亡於不測而冥於獨化也見曰賢遍反眩玄遍反與音餘下同掘若徐音屈槁木苦老反掘字依正文改老聃曰吾遊心於物之初初未有而欻有故遊於物初然後明有物之不為而自有也初本也夫道通生萬物故名道為物之初也遊心物初則是凝神妙本所以形同槁木心若死灰也而欻訓弗反孔子曰何謂邪雖聞聖言未識意謂曰心困焉而不能知口辟焉而不能言嘗為汝議乎其將至陰肅肅至陽赫赫肅肅出乎天赫赫發乎地兩者交通成和而物生焉或為之紀而莫見其形消息滿虛一晦一明日改月化日有所為而莫見其功生有所乎萌死有所乎歸始終相反乎無端而莫知乎其所窮非是也且孰為之宗欲令仲尼必求於言意之表也辟者口開不合也夫聖心非不能知為其無法可知口非不能辯為其無法可辯辯之則乖其體知之則喪其真是知至道深玄超言意之表故困焉辟焉口辟必亦反司馬云辟卷不開也又婢亦反徐敷赤反試議陰陽以擬向之無形耳未之敢必夫至理玄妙非言意能詳試為汝議論陰陽將擬議大道雖即仿象未即是真矣嘗為于偽反言其交也肅肅陰氣寒也赫赫陽氣熱也近陰中之陽陽中之陰言其交泰也莫見為紀之形明其自爾陽氣下降陰氣上昇二氣交通遂成和合因此和氣而物生焉雖復四序炎涼紀綱庶物而各自化故莫見綱紀之形未嘗守故陰消陽息夏滿冬虛夜晦晝明日遷月徙新新不住故日有所為也自爾故無功玄功冥濟故莫見為之者也萌於未聚也萌於無物歸於散也歸於未生所謂迎之不見其首隨之不見其後死生終始反覆往來既無端緒誰知窮極故至人體達任其變也若非是虛通生化之道誰為萬物之宗本乎夫物云云必資於道也且孰如字舊子餘反孔子曰請問遊是請問遊心是道其術如何必得遊是復有何功力也老聃曰夫得是至美至樂也得至美而遊乎至樂謂之至人至美無美至樂無樂故也夫證於玄道美而歡暢既得無美之美而遊心無樂之樂者可謂至極之人也至樂音洛下及注同孔子曰願聞其方方猶道也請說至美至樂之道曰草食之獸不疾易藪水生之蟲不疾易水行小變而不失其大常也喜怒哀樂不入於胸次夫天下也者萬物之所一也得其所一而同焉則四支百體將為塵垢而死生終始將為晝夜而莫之能滑而況得喪禍福之所介乎棄隸者若棄泥塗知身貴於隸也貴在於我而不失於變且萬化而未始有極也夫孰足以患心已為道者解乎此死生亦小變也疾患也易移也夫食草之獸不患移易藪澤水生之蟲不患改易池沼但有草有水則不失大常從東從西蓋小變耳亦猶人處於大道之中隨變任化未始非我此則不失大常生死之變蓋亦小耳行小下孟反又如字知其小變而不失大常喜順怒逆樂生哀死夫四者生崖之事也而死生無變於己喜怒豈入於懷中也胸次李云次中也愈不足患夫天地萬物其體不二達斯趣者故能混同是以物我皆空百體將為塵垢死生虛幻終始均乎晝夜死生不能滑亂而況得喪禍福生崖之事乎愈不足以介懷也能滑古沒反所介音界知身之貴於隸故棄之若遺土耳苟知死生之變所在皆我則貴者常在也所貴者我也而我與變俱故無失也夫舍棄僕隸事等泥塗故知貴在於我不在外物我將變俱故無所喪也所謂縣解夫世物遷流未嘗有極而隨變任化誰復累心唯當修道達人方能解此解乎戶買反注同也字依趙諫議本改孔子曰夫子德配天地而猶假至言以修心古之君子孰能脫焉配合也脫免也老子德合二儀明齊三景故應忘言歸理聖智自然今乃盛談至言以修心術然則古之君子誰能遺於言說而免於修為者乎老聃曰不然夫水之於汋也無為而才自然矣至人之於德也不修而物不能離焉若天之自高地之自厚日月之自明夫何脩焉不脩不為而自得也汋水也澄湛也言水之澄湛其性自然汲取利潤非由修學至人玄德其義亦然端拱巖廊而物不能離澤被群品日用不知若天高地厚日月照明夫何修為自然而已矣汋音灼又上若反李以略反李云取也家世父曰說汋激水聲也井一有水一無水謂之瀱汋所引爾雅釋水文郭璞注爾雅引山海經天井夏有水冬無水即此類汋者水自然涌出非若泉之有源而溪澗之交匯以流行也說文激水礙邪疾波也謂有所礙而邪出疾行故有聲水之涌出亦若激而有聲無為而才自然言無有疏導之者釋文引李云汋取也誤孔子出以告顏回曰丘之於道也其猶醯雞與微夫子之發吾覆也吾不知天地之大全也醯雞者甕中之蠛蠓醯雞許西反郭云醯雞甕中之蠛蠓也司馬云若酒上蠛蠓也慶藩案太平御覽三百九十五引司馬云醯雞酒上飛蚋與釋文小異甕中烏弄反蠛亡結反蠓無孔反比吾全於老聃猶甕中之與天地矣醯雞醋甕中之蠛蠓每遭物蓋甕頭故不見二儀也亦猶仲尼遭聖跡蔽覆不見事理若無老子為發覆蓋則終身不知天地之大全虛通之妙道也莊子見魯哀公哀公曰魯多儒士少為先生方者方術也莊子是六國時人與魏惠王齊威王同時去魯哀公一百二十年如此言見魯哀公者蓋寓言耳然魯則是周公之後應是衣冠之國又孔子生於魯盛行五德之教是以門徒三千服膺儒服長裾廣袖魯地必多無為之學其人鮮矣莊子見賢遍反亦如字魯哀公司馬云莊子與魏惠王齊威王同時在哀公後百二十年莊子曰魯少儒夫服以象德不易其人莊子體知故譏儒少哀公曰舉魯國而儒服何謂少乎哀公庸暗不察其道直據衣冠謬稱多儒莊子曰周聞之儒者冠圜冠者知天時履句屨者知地形緩佩玦者事至而斷君子有其道者未必為其服也為其服者未必知其道也公固以為不然何不號於國中曰無此道而為此服者其罪死句方也緩者五色絛繩穿玉玦以飾佩也玦決也本亦有作綬字者夫天員地方服以象德故戴圓冠以象天者則知三象之吉凶履方屨以法地者則知九州之水陸曳綬佩玦者事到而決斷是以懷道之人不必為服為服之者不必懷道彼己之子今古有之是故莊生寓言辯說也冠古亂反圜冠音圓履句音矩徐其俱反李云方也屨徐居具反緩戶管反司馬本作綬佩玦古穴反慶藩案說文二字互訓緩者寬綽之意晉書緩帶輕裘緩帶猶博帶也緩佩玦言所佩者玦而繫之帶間寬綽有餘也釋文引司馬本作綬誤而斷丁亂反於是哀公號之五日而魯國無敢儒服者獨有一丈夫儒服而立乎公門公即召而問以國事千轉萬變而不窮有服無道罪合極刑法令既嚴不敢犯者號經五日無復一儒也號於國號號令也莊子曰以魯國而儒者一人耳可謂多乎德充於內者不脩飾於外一人謂孔子孔子聖人觀機吐智若鏡之照轉變無窮舉國一人未足多也百里奚爵祿不入於心故飯牛而牛肥使秦穆公忘其賤與之政也有虞氏死生不入於心故足以動人姓孟字百里奚秦之賢人也本是虞人虞被亡遂入秦國初未遭用貧賤飯牛安於飯牛身甚肥悅忘於富貴故爵祿不入於心後穆公知其賢委以國事都不猜疑故云忘其賤矣故飯煩晚反忘其賤與之政也謂忘其飯牛之賤也內自得者外事全也有虞舜也姓媯氏字重華遭後母之難頻被躓頓而不以死生經心至孝有聞感動天地於是堯妻以二女委以萬乘故足以動人也宋元君將畫圖眾史皆至受揖而立舐筆和墨在外者半有一史後至者儃儃然不趨受揖不立因之舍公使人視之則解衣般礡臝君曰可矣是真畫者也宋國之君欲畫國中山川地土圖樣而畫師並至受君令命拜揖而立調朱和墨爭競功能除其受揖在外者半言其趨競者多受揖而立司馬云受命揖而立也舐本或作食紙反內足者神閒而意定儃儃寬閒之貌也內既自得故外不矜持徐行不趨受命不立直入就舍解衣箕坐露赤身曾無懼憚元君見其神彩可謂真畫者也儃儃吐袒反徐音但李云舒閒之貌般字又作褩礡傍各反徐敷各反司馬云般礡謂箕坐也臝本又作羸同力果反司馬云將畫故解衣見形神閒音閑趙諫議本般作槃釋文原本作字當作說文作云以舌取食也從舌易聲神旨切或從也文王觀於臧見一丈夫釣而其釣莫釣非持其釣有釣者也常釣也聊以卒歲臧者近渭水地名也丈夫者寓言於太公也呂望未遭文王之前綸釣於臧地無心施餌聊自寄此逍遙文王觀於臧李云臧地名也司馬本作文王微服而觀於臧丈夫本或作丈人竟無所求不以得失經意其於假釣而已非執持其釣有意羨魚常遊渭濱卒歲而已文王欲舉而授之政而恐大臣父兄之弗安也欲終而釋之而不忍百姓之無天也於是旦而屬之大夫曰昔者寡人夢見良人黑色而乘駁馬而偏朱蹄號曰寓而政於臧丈人庶幾乎民有瘳乎文王既見賢人欲委之國政復恐皇親宰輔猜而忌之既欲捨而釋之不忍蒼生失於覆蔭故言無天也既欲任賢故託諸夢想乃屬語臣佐云我昨夜夢見賢良之人黑色而有鬚髯乘駁馬而蹄偏赤號令我云寄汝國政於臧丈人慕賢進隱則民之荒亂病必瘳差矣駁亦有作騂字者隨字讀之也旦而屬音燭之夫夫皆方于反司馬云夫夫大夫也一云夫夫古讀為大夫慶藩案昔者夜者也古謂夜為昔或為昔者晏子春秋雜下篇有梟昔者鳴說苑辨物篇亦作昔者王念孫云古謂夜為昔或為夜者晏子春秋外篇寡人夜者聞西方有男子哭夜曰夜者故晝亦曰晝者晏子春秋雜上篇晝者進膳是也或曰夕者晏子春秋下篇夕者瞢與二日鬥皆其證而占反郭李而兼反又而銜反駁馬邦角反偏朱蹄李云一蹄偏赤也瘳乎敕留反夫夫今書作大夫諸大夫蹴然曰先君王也文王之父季歷生存之日黑色多髯好乘駁馬駁馬蹄偏赤王之所夢乃是先君教令於王是以蹴然驚懼也蹴然子六反本或作愀在久七小二反先君王也司馬云言先君王靈神之所致俞樾曰先君下疑奪命字此本作先君命王也故下文曰先君之命王其無他文王曰然則卜之諸大夫曰先君之命王其無它又何卜焉此是先君令命決定無疑卜以決疑不疑何卜也之令本或作命盧文弨曰今本作命王其無它司馬云無違令遂迎臧丈人而授之政典法無更偏令無出三年文王觀於國則列士壞植散群長官者不成德斔斛不敢入於四竟列士壞植散群則尚同也長官者不成德則同務也斔斛不敢入於四竟則諸侯無二心也君臣契協遂迎丈人拜為卿輔授其國政於是典憲刑法一施無改偏曲敕令無復出行也植行列也亦言境界列舍以受諫書也亦言是諫士之館也庾六斗四升也為政三年移風易俗君臣履道無可箴規散卻列士之爵打破諫書之館上下咸亨長官不顯其德遐邇同軌度量不入四境列士壞音怪下同植音直散群司馬云植行列也散群言不養徒眾也一云植者疆界頭造群屋以待諫者也俞樾曰司馬兩說並未得植字之義宣二年左傳華元為植杜注曰植將主也列士必先有主而後得有徒眾故欲散其群必先壞其植也長丁丈反下同官者不成德司馬云不利功名也斔斛音庾李云六斛四斗曰斔司馬本作斔斞云斔讀曰鍾斞讀曰臾四竟音境下同所謂和其光同其塵絜然自成則與眾務異也天下相信故能同律度量衡也天下大同不競忠諫事無隔異則德不彰五等守分則四方寧謐也文王於是焉以為大師北面而問曰政可以及天下乎臧丈人昧然而不應泛然而辭朝令而夜遁終身無聞為功者非己故功成而身不得不退事遂而名不得不去名去身退乃可以及天下也俄頃之間拜為師傅北面事之問其政術無心榮寵故泛然而辭意消聲故昧然不應由名成身退推功於物不欲及於天下故逃遁無聞然呂佐周室受封於齊檢於史傳竟無逃跡而云夜遁者蓋莊生之寓言也大師音泰昧然音妹泛然徐敷劍反夜遁困反趙諫議本無也字顏淵問於仲尼曰文王其猶未邪又何以夢為乎顏子疑於文王未極至人之德真人不夢何以夢乎仲尼曰默汝無言夫文王盡之也而又何論刺焉彼直以循斯須也任諸大夫而不自任斯盡之也斯須者百姓之情當悟未悟之頃故文王循而發之以合其大情也斯須須臾也循順也夫文王聖人盡於妙理汝宜寢默不勞譏刺彼直隨任物性順蒼生之望欲悟未悟之頃進退須臾之間故託夢以發其性耳未足怪也刺焉七賜反列禦寇為伯昏無人射引之盈貫措杯水其肘上發之適矢復沓方矢復寓當是時猶象人也盈貫謂溢鏑也為伯昏于偽反盈貫古亂反司馬云鏑也鏑丁歷反左手如拒石右手如附枝右手放發而左手不知故可措之杯水也禦寇無人內篇具釋盈貫滿鏃也措置也禦寇風仙之善射右手引弦如附枝而滿鏑左手如拒石置杯水於肘上言其停審敏捷之至也措七故反其肘竹九反如拒音矩本亦作矩字矢去也箭適去復歃沓也適矢丁歷反復沓扶又反注及下同歃色洽反又初洽反箭方去未至的也復寄杯於肘上言其敏捷之妙也適往也沓重也寓寄也弦發矢往復重沓前箭所謂擘括而入者箭方適未至於的復寄杯水言其敏捷寓字亦作隅者言圓鏑重沓破括方全插孔復於隅角也不動之至象人木偶土梗人也言禦寇當射之時掘然不動猶土木之人也家世父曰適矢復沓狀矢之發方矢復寓狀矢之彀說文多言沓沓如水之流言一矢適發一矢復涌出也寓寄也言一矢方釋一矢復在彀也象人猶鄭康成之云相人偶伯昏無人曰是射之射非不射之射也嘗與汝登高山履危石臨百仞之淵若能射乎言汝雖巧仍是有心之射非忘懷無心不射之射也七尺曰仞深七百尺也若汝也此是不射之射也於是無人遂登高山履危石臨百仞之淵背逡巡足二分垂在外揖禦寇而進之禦寇伏地汗流至踵前略陳射意此直欲彎弓逡巡猶卻行也進讓也登峻聳高山履危懸之石臨極險之淵仍背淵卻行足垂二分在外空裏控弦自若揖禦寇而讓之禦寇怖懼不能舉頭於是冥目伏地汗流至腳也逡巡七旬反汗流戶旦反伯昏無人曰夫至人者上闚青天下潛黃泉揮斥八極神氣不變今汝怵然有恂目之志爾於中也殆矣夫揮斥猶縱放也夫德充於內則神滿於外無遠近幽深所在皆明故審安危之機而泊然自得也慶藩案潛與闚對文潛測也與闚之意相近古訓潛為測見爾雅揮音輝斥音尺李音託郭云揮斥猶放縱不能明至分故有懼有懼而所喪多矣豈唯射乎揮斥猶縱放也恂懼也夫至德之人與大空等量故能上闚青天下隱黃泉譬彼神龍升沈無定縱放八方精神不改臨彼萬仞何足介懷今我觀汝有怵惕之心眼目眩惑懷恂懼之志汝於射之中危殆矣夫怵然敕律反有恂李又作眴音荀爾雅云恂慄也目之志恂謂眩也欲以眩悅人之目故怵也於中丁仲反又如字中精神也所喪息浪反後章同趙諫議本無也字中字依正文改肩吾問於孫叔敖曰子三為令尹而不榮華三去之而無憂色吾始也疑子今視子之鼻間栩栩然子之用心獨柰何肩吾隱者也叔敖楚之賢人也栩栩歡暢之貌也夫達者毀譽不動寵辱莫驚故孫敖三仕而不榮華三黜而無憂色肩吾始聞其言猶懷疑惑復察其貌栩栩自懽若為用心獨得如此也栩栩況甫反孫叔敖曰吾何以過人哉吾以其來不可卻也其去不可止也吾以為得失之非我也而無憂色而已矣我何以過人哉且不知其在彼乎其在我乎其在彼邪亡乎我在我邪亡乎彼方將躊躇方將四顧何暇至乎人貴人賤哉夫軒冕榮華物來儻寄耳故其來不可遣卻其去不可禁止窮通得喪豈由我哉達此去來故無憂色何有藝術能過人耶曠然無係玄同彼我則在彼非獨亡在我非獨存也亡失也且不知榮華定在彼人定在我己若在彼邪則於我為失若在我邪則於彼為失而彼我既其玄同得喪於乎自泯也慶藩案彼我皆亡言不在我不在彼也淮南詮言篇亡乎萬物之中高注曰不在萬物之中也即此義躊躇四顧謂無可無不可躊躇是逸豫自得四顧是高視八方方將磅礡萬物揮斥宇宙有何容暇至於人世留心貴賤之間乎故去之而無憂色也躊直留反躇直於反仲尼聞之曰古之真人知者不得說美人不得濫盜人不得劫伏戲黃帝不得友死生亦大矣而無變乎己況爵祿乎若然者其神經乎大山而無介入乎淵泉而不濡處卑細而不憊充滿天地既以與人己愈有伏戲黃帝者功號耳非所以功者也故況功號於所以功相去遠矣故其名不足以友其人也仲尼聞孫叔敖之言而美其德故引遠古以證斯人古之真人窮微極妙縱有智言之人不得辯說美色之姿不得淫濫盜賊之徒何能劫剝三皇五帝未足交友也得劫居業反元嘉本作卻伏戲音羲人雖日新死生大矣而不變於己況於爵祿豈復栖心割肌膚以為天下者彼我俱失也使人人自得而已者與人而不損於己也其神明充滿天地故所在皆可所在皆可故不損己為物而放於自得之地也介礙也既盡也夫真人入火不熱入水不濡經乎大山而神無障礙屈處卑賤其道不虧德合二儀故充滿天地不損己為物故愈有也大山音泰無介音界不憊皮拜反以為于偽反下同其字元纂圖互注本明世德堂本及道藏焦竑本並作於宋本作其王叔岷云當作於楚王與凡君坐少焉楚王左右曰凡亡者三凡君曰凡之亡也不足以喪吾存夫凡之亡不足以喪吾存則楚之存不足以存存由是觀之則凡未始亡而楚未始存也言有三亡徵也楚文王共凡僖侯同坐論合從會盟之事凡是國名周公之後國在汲郡界今有凡城是也三者不敬鬼尊賢養民也而楚大凡小楚有吞夷之意故使從者以言感也俞樾曰楚王左右言凡亡者三人也郭注曰言有三亡徵也非是凡君如字司馬云凡國名在汲郡共縣案左傳凡周公之後也隱七年天王使凡伯來聘俗本此後有孔子窮於陳蔡及孔子謂顏回二章與讓王篇同眾家并於讓王篇音之檢此二章無郭注似如重出古本皆無謂無者是也遺凡故也自得造化怡然不懼可謂周公之後世不乏賢也夫遺之者不以亡為亡則存亦不足以為存矣曠然無矜乃常存也存亡更在於心之所耳天下竟無存亡夫存亡者有心之得喪也既冥於得喪故亡者未必亡而亡者更存存者不獨存而存者更亡也措字依明世德堂本改
