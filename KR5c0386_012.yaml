body:
  text: 外篇馬蹄第九舉事以名篇馬蹄可以踐霜雪毛可以禦風寒齕草飲水翹足而陸此馬之真性也雖有義臺路寢無所用之及至伯樂曰我善治馬燒之剔之刻之雒之連之以羈馽編之以皂棧馬之死者十二三矣飢之渴之馳之驟之整之齊之前有橛飾之患而後有鞭策之威而馬之死者已過半矣陶者曰我善治埴圓者中規方者中矩匠人曰我善治木曲者中鉤直者應繩夫埴木之性豈欲中規矩鉤繩哉然且世世稱之曰伯樂善治馬而陶匠善治埴木此亦治天下者之過也駑驥各適於身而足齕齧也踐履禦捍翹舉也夫蹄踐霜雪毛禦風寒飢即齕草渴即飲水逸豫適性即舉足而跳躑求稟乎造物故真性豈願羈馽皂棧而為服養之乎況萬有參差咸資素分安排任性各得逍遙不矜不企即生涯可保馬釋名云武也王弼注易云在下而行者也蹄音提司馬云馬足甲也禦魚呂反廣雅云敵也崔本作辟齕恨發反又胡切反翹祁饒反足崔本作尾而陸司馬云陸跳也字書作馬健也慶藩案釋文崔本作翹尾引司馬云陸跳也字書作馬健也今案足作尾是也文選郭景純江賦注引莊子正作尾陸作踛云踛音六廣韻踛力竹切翹踛也踛依字當作説文曲脛也讀若逵是踛即之異體逵從坴踛從足坴古足之字多互用形相似也據選注所引知陸乃踛之訛駑音奴惡馬也驥音冀千里善馬也馬之真性非辭鞍而惡乘但無羡於榮華義養也謂是貴人養衛之臺觀也亦言義臺猶靈臺也路大也正也即正寢之大殿也言馬之為性欣於原野雖有高臺大殿無所用之況清虛之士淳朴之民樂彼茅茨安茲甕牖假使丹楹刻桷於我何為義許宜反又如字徐音儀崔本同一本作羲臺崔云義臺猶靈臺也路寢路正也大也崔云路寢正室慶藩案史記魏世家索隱引司馬云義臺臺名釋文闕俞樾曰義徐音儀當從之周官肆師職鄭注曰故書儀為義是義即古儀字也儀臺猶言容臺淮南子覽冥篇容臺振而掩覆高注曰容臺行禮容之臺儀與容異名同實蓋是行禮儀之臺故曰儀臺也而惡烏路反有意治之則不治矣治之為善斯不善也列子云姓孫名陽字伯樂秦穆公時善治馬人燒鐵炙之也剔謂翦其毛刻謂削其蹄雒謂著籠頭也羈謂連枝絆也馽謂約前兩腳也皂謂槽櫪也棧編木為碇安馬腳下以去其濕所謂馬床也夫不能任馬真性而橫見燒剔既乖天理而死者已多況無心徇物性命所以安全有意治之天年於焉夭折伯樂音洛下同伯樂姓孫名陽善馭馬石氏星經云伯樂天星名主典天馬孫陽善馭故以為名剔之敕歷反字林云剃也徐詩赤反向崔本作鬄向音郝雒之音洛司馬云燒謂燒鐵以爍之剔謂翦其毛刻謂削其甲雒謂羈雒其頭也王念孫曰司馬彪曰雒謂羈絡其頭也案雒讀為鉻音落字或作通作雒又通作落鉻之言落也剔去毛鬣爪甲謂之鉻説文曰鉻也廣雅曰雒剔也吳子治兵篇説畜馬之法云刻剔毛鬣謹落四下此云燒之剔之刻之雒之語意略相似司馬以鉻為羈絡非也下文連之以羈馽乃始言羈絡耳家世父曰司馬云刻謂削其甲雒謂羈雒其頭也是通雒為絡疑上四者專就馬身言之下文羈馽皂棧始及銜勒之事雒當為烙所謂火針曰烙也杜甫詩細看六印帶官字六印亦作火印刻謂鑿蹄雒謂印烙燒之剔之以理其毛色刻之雒之以存其表識作絡者非也俞樾曰司馬彪解雒之曰謂羈雒其頭也是以雒為絡之假字然下文連之以羈馽乃始言羈絡之事此恐非也雒疑當為烙説文火部新附有烙字曰灼也今官馬以火烙其皮毛為識即其事矣羈居宜反廣雅云勒也馽丁邑反徐丁立反絆也李音述本或作馵非也馵音之樹反司馬向崔本並作馽向云馬氏音竦崔云絆前兩足也盧文弨曰舊本無音字案例當有今增編之必然反皂才老反櫪也一云槽也崔云馬間也棧板反徐在簡反又士諫反編木作靈似靈床曰棧以禦濕也崔云木棚也盧文弨曰靈即櫺字濕當作溼後人多混用棚疑當作柵慶藩案文選顏延年赭白馬賦注潘安仁馬汧督誄注引司馬云皂櫪也棧若櫺床施之溼地也釋文闕不治直吏反夫善御者將以盡其能也盡能在於自任而乃走作馳步求其過能之用故有不堪而多死焉若乃任駑驥之力適遲疾之分雖則足迹接乎八荒之表而衆馬之性全矣而惑者聞任馬之性乃謂放而不乘聞無為之風遂云行不如臥何其往而不返哉斯失乎莊生之旨遠矣橛銜也謂以寶物飾於鑣也帶皮曰鞭無皮曰策俱是馬杖也夫馳驟過分飢渴失常整之以衡扼齊之以鑣轡威之以鞭策而求其以分外之能故駑駘不堪而凡已過半聖智治物其損亦然驟士救反橛向徐其月反司馬云銜也崔云鑣也飾徐音式司馬云排銜也謂加飾於馬鑣也慶藩案文選潘安仁西征賦注引司馬云橛騑馬口中長銜也與釋文異又案橛一作橛説文齺下曰齺馬口中橛也史記索隱引周輿服志云鉤逆上者為橛橛在銜中以鐵為之大如雞子漢書司馬相如傳張揖注曰銜馬勒銜也橛騑馬口長銜也韓子姦劫弒臣篇無垂策之威銜橛之備雖造父不能以服馬鹽鐵論刑德篇猶無銜橛而禦捍馬也是銜與橛皆所以制馬者鞭必然反策初革反杜注左傳云馬檛也檛音竹瓜反範土曰陶陶化也亦也埴黏也亦土也謂陶者善能調和水土而為瓦器運用方圓必中規矩也陶道刀反謂也音弋消反埴徐時力反崔云土也司馬云埴土可以為陶器尚書傳云土黏曰埴釋名云埴膱也膱音之食反中規丁仲反下皆同鉤曲也繩直也謂匠人機巧善能治木木之曲直必中鉤繩應繩應對之應後不音者倣此土木之性稟之造物不求曲直豈慕方圓陶者匠人浪為臧否世以任自然而不加巧者為不善於治也揉曲為直厲駑習驥能為規矩以矯拂其性使死而後已乃謂之善治也不亦過乎此總舉前文以合其譬然世情愚惑以治為善不治之為偽偽莫大焉揉曲汝久反矯居兆反拂房弗反士字依世德堂本及釋文原本改世德堂本惑作或吾意善治天下者不然彼民有常性織而衣耕而食是謂同德一而不黨命曰天放故至德之世其行填填其視顛顛當是時也山無蹊隧澤無舟梁萬物群生連屬其鄉禽獸成群草木遂長是故禽獸可係羈而遊鳥鵲之巢可攀援而窺以不治治之乃善治也然猶如此也莊子云我意謂善治天下不如向來陶匠等也善治之術列在下文夫民之德小異而大同故性之不可去者衣食也事之不可廢者耕織也此天下之所同而為本者也守斯道者無為之至也彼民黎首也言蒼生皆有真常之性而不假於物也德者得也率其真常之性物各自足故同德郭象云性之不可去者衣食事之不可廢者耕織此天下之所同而為本也守斯道也無為至矣去者羌呂反放之而自一耳非黨也故謂之天放黨偏也命名也天自然也夫虛通一道亭毒群生長之育之無偏無黨若有心治物則乖彼天然直置放任則物皆自足故名曰天放也天放如字崔本作牧云養也此自足於內無所求及之貌填填滿足之心顛顛高直之貌夫太上淳和之世遂初至德之時心既遣於是非行亦忘乎物我所以守真內足填填而處無為自不外求顛顛而遊於虛淡填填徐音田又徒偃反質重貌崔云重遲也一云詳徐貌淮南作莫莫顛顛丁田反崔云專一也淮南作瞑瞑不求非望之利故止於一家而足蹊徑隧道也舟船也當是時即至德之世也人知守分物皆淳朴不伐不奪徑道所以可遺莫往莫來船橋於是乎廢蹊徐音兮李云徑也隧徐音遂崔云道也混茫而同得也則與一世而淡漠焉豈國異而家殊哉夫混茫之世淳和淡漠故無情萬物連接而共里閭有識群生係屬而同鄉縣豈國異政而家殊俗哉連屬其鄉王云既無國異家殊故其鄉連屬混胡本反茫莫剛反淡徒暫反漠音莫足性而止無吞夷之欲故物全飛禽走獸不害所以成群蔬草果木不伐遂其盛茂遂長丁丈反又直良反無吞敦恩反又音天與物無害故物馴也人無害物之心物無畏人之慮故山禽野獸可羈係而遨遊鳥鵲巢窠可攀援而窺望也攀本又作扳普班反援音袁廣雅云牽也引也窺去規反物馴似遵反或音純夫至德之世同與禽獸居族與萬物並惡乎知君子小人哉同乎無知其德不離同乎無欲是謂素朴素朴而民性得矣及至聖人蹩躠為仁踶跂為義而天下始疑矣澶漫為樂摘僻為禮而天下始分矣故純朴不殘孰為犧尊白玉不毀孰為圭璋道德不廢安取仁義性情不離安用禮樂五色不亂孰為文采五聲不亂孰應六律夫殘朴以為器工匠之罪也毀道德以為仁義聖人之過也夫殉物邪僻為小人履道方正為君子既而巢居穴處將鳥獸而不分含哺鼓腹混群物而無異於何而知君子於何而辨小人哉惡乎音烏知則離道以善也既無分別之心故同乎無知之理又不以險德以求行故抱一而不離也不離力智反注皆同欲則離性以飾也同遂初之無欲物各清廉異末代之浮華人皆淳朴素朴普剝反無煩乎知欲也夫蒼生所以失性者皆由滯欲故也既而無欲素朴真性不喪故稱得也此一句總結已前至德之美者也聖人者民得性之迹耳非所以迹也此云及至聖人猶云及至其迹也夫聖迹既彰則仁義不真而禮樂離性徒得形表而已矣有聖人即有斯弊吾若是何哉自此以上明淳素之德自此以下斥聖迹之失及至聖人即五帝已下行聖迹之人也蹩躠用力之貌踶跂矜恃之容澶漫是縱逸之心摘僻是曲拳之行夫淳素道消澆偽斯起踶跂恃裁非之義蹩躠夸偏愛之仁澶漫貴奢淫之樂摘僻尚浮華之禮於是宇內分離蒼生疑惑亂天之經自斯而始矣蹩步結反向崔本作弊音同躠本又作薛悉結反向崔本作殺音同一音素葛反踶直氏反向同崔音緹跂丘氏反一音呂氏反崔音技李云蹩躠踶跂皆用心為仁義之貌慶藩案踶各本無訓説文踶躗也躗踶躗也段注舊本訛作衛今據踶字注及牛部字注改正澶本又作儃徒旦反又吐旦反向崔本作但音燀漫武半反向崔本作曼音同李云澶漫猶縱逸也崔云但曼淫衍也一云澶漫牽引也摘敕歷反又涉革反辟匹壁反向音檗徐敷歷反李父歷反本或作僻音同李云糾擲邪辟而為禮也一音婦赤反法也崔云擲辟多節盧文弨曰今本作僻家世父曰釋文引李曰糾擲邪辟而為禮也崔云擲辟多節擲辟當作摘劈王逸注楚詞劈析也摘者摘取之劈者分之謂其煩碎也始分如字下分皆同純朴全木也不殘未雕也孰誰也犧尊酒器刻為牛首以祭宗廟也止鋭下方曰圭半圭曰璋此略舉譬喻以明澆競之治也犧尊音羲尊或作樽司馬云畫犧牛象以飾樽也王肅云刻為牛頭鄭玄云畫鳳皇羽飾尊婆娑然也音先河反盧文弨曰今本作樽俗圭璋音章李云皆器名也鋭上方下曰圭半圭曰璋此合譬也夫大道之世不辨是非至德之時未論憎愛無愛則人心自息無非則本迹斯忘故老經云大道廢有仁義矣禮以檢迹樂以和心情苟不散安用和心性苟不離何勞檢迹是知和心檢迹由乎道喪也情性不離如字別離也盧文弨曰今本情性作性情凡此皆變朴為華棄本崇末於其天素有殘廢矣世雖貴之非其貴也夫文采本由相間音樂貴在相和若各色各聲不相顯發則宮商黼黻無由成用此重起譬卻證前旨工匠則有規矩之制聖人則有可尚之迹此總結前義夫工匠以犧尊之器殘淳朴之本聖人以仁義之迹毀無為之道為弊既一獲罪宜均趙諫議本無矣字及注首夫字躗字依説文刪世德堂本作樽本書依釋文改夫馬陸居則食草飲水喜則交頸相靡怒則分背相踶馬知已此矣夫加之以衡扼齊之以月題而馬知介倪闉扼鷙曼詭銜竊轡故馬之知而態至盜者伯樂之罪也御其真知乘其自則萬里之路可致而群馬之性不失靡摩也順也踶蹈也已止也夫物之喜怒稟自天然率性而動非由矯偽故喜則交頸而摩順怒則分背而踶蹈而馬之知解適盡於此食草飲水樂在其中矣交頸頸領也居郢反又祁盈反相靡如字李云摩也一云愛也慶藩案靡古讀若摩故與摩通見唐韻正漢書淮南衡山王傳亦其俗薄臣下漸靡使然也漸靡即漸摩荀子性惡篇身日進於仁義而不自知也者靡使然也靡即摩也禮學記相觀而善之謂摩鄭注摩相切磋也成二年左傳師至於靡笄之下靡一音摩史記蘇秦傳以出揣摩鄒誕本作揣靡靡讀為摩元戴侗六書故靡與摩通本書凡交近則相靡以信亦讀靡為摩相踶大計反又徒兮反又徒祁反李云踶踏也廣雅字韻聲類並同通俗文云小踏謂之踶馬知李音智下同衡轅前橫木也扼馬頸木也月題額上當顱形似月者也介獨也倪睥睨也闉曲也鷙抵也曼突也詭詐也竊盜也夫馬之真知唯欣放逸不求服飾豈慕榮華既而加以月題齊以衡扼乖乎天性不任困苦是以譎詐萌出睥睨曲頭綟扼抵突御人竊轡即盜脫籠頭詭銜乃吐出其勒良由乖損真性所以矯偽百端者矣衡扼於革反衡轅前橫木縛軛者也扼馬頸者也月題徒兮反司馬崔云馬上當顱如月形者也介徐古八反倪徐五圭反郭五第反李云介倪猶睥睨也崔云介出俾倪也闉音因鷙徐敕二反郭音躓曼武半反郭武諫反李云闉曲也鷙抵也曼突也崔云闉扼鷙曼距扼頓遲也司馬云言曲頸於扼以抵突也一云鷙曼旁出也家世父曰釋文引李云介倪猶睥睨也闉曲也鷙抵也曼突也崔云闉扼鷙曼距扼頓遲也司馬云言曲頸於扼以抵突也一云鷙曼旁出也今案成二年左傳不介馬而馳之杜預注介馬甲也説文俾益也倪俾也言馬知甲之加其身史記晉世家馬鷙不能行説文鷙馬重貌闉扼猶言困扼鷙曼猶言遲重言馬被介而氣塞行滯有決銜絶轡之憂李云睥睨者失之詭九彼反銜口中勒也或云詭銜吐出銜也竊轡齧轡也崔云詭銜竊轡戾銜橛盜鞎轡也盧文弨曰舊鞎訛艱今改正説文車前革曰鞎馬性不同而齊求其用故有力竭而態作者態姦詐也夫馬之真知適於原野馳驟過分即矯詐心生詭竊之態罪歸伯樂也態作吐代反然字依王叔岷説改夫赫胥氏之時民居不知所為行不知所之含哺而熙鼓腹而遊民能以此矣及至聖人屈折禮樂以匡天下之形縣跂仁義以慰天下之心而民乃始踶跂好知爭歸於利不可止也此亦聖人之過也此民之真能也之適也赫胥上古帝王也亦言有赫然之德使民胥附故曰赫胥蓋炎帝也夫行道之時無為之世心絶緣慮安居而無所為率性而動遊行而無所往既而含哺而熙戲與嬰兒而不殊鼓腹而遨遊將童子而無別此至淳之世民能如此也赫本或作呼白反胥氏司馬云赫胥氏上古帝王也一云有赫然之德使民胥附故曰赫胥蓋炎帝也俞樾曰釋文引司馬云赫胥氏上古帝王也此為允當又曰一云有赫然之德使民胥附故曰赫胥蓋炎帝也此望文生訓殊不足據炎帝即神農也胠篋篇既云赫胥氏又云神農氏其非一人明矣赫胥疑即列子書所稱華胥氏華與赫一聲之轉耳廣雅釋器赫赤也而古人名赤者多字華羊舌赤字伯華公西赤字子華是也是華亦赤也赤謂之赫亦謂之華可證赫胥之即華胥矣含哺音步其過皆由乎迹之可尚也夫屈曲折旋行禮樂以正形體高縣仁義令企慕以慰心靈於是始踶跂自矜好知而興矯詐經營利祿爭歸而不知止噫聖迹之過者也縣企音玄盧文弨曰今本作跂慶藩案文選傅長虞贈何劭王濟詩注引司馬云企望也釋文闕踶直氏反跂丘氏反好知呼報反下音智
