seq: 3
body:
  text: 莊子集釋序郭君子為莊子集釋成以授先謙讀之而其年適有東夷之亂作而歎曰莊子其有不得已於中乎夫其遭世否塞拯之末由神倣徨乎馮閎驗小大之無垠究天地之終始懼然而為是言也騶衍曰儒者所謂中國於天下乃八十一分居其一分耳赤縣神州外自有九州裨海環之大瀛海環其外惠施曰我知天下之中央燕之北越之南是也而莊子稱之亦言倏與忽鑿混沌死其説若豫睹將來而推厥終極亦異人矣哉子貢為挈水之槔而漢陰丈人笑之今之機械機事倍於槔者相萬也使莊子見之奈何蠻觸氏爭地於蝸角伏尸數萬逐北旬日今之蠻觸氏不知其幾也而莊子奈何是故以黃帝為君而有蚩尤以堯為君而有叢枝宗膾胥敖黃帝堯非好事也然而欲虛其國刑其人其不能以虛靜治決矣彼莊子者求其術而不得將遂獨立於寥闊之野以幸全其身而樂其生烏足及天下且其書嘗暴著於後矣晉演為玄學無解於胡羯之氛唐尊為真經無救於安史之禍徒以藥世主淫侈淡末俗利欲庶有一二之助焉而其文又絶奇郭君愛玩之不已因有集釋之作附之以文益之以博使莊子見之得毋曰此猶吾之糟粕乎雖然無迹奚以測履無糟粕奚以觀於古美矣郭君於是書為副墨之子將群天下為洛誦之孫已夫光緒二十年歲次甲午冬十二月長沙愚弟王先謙謹撰
