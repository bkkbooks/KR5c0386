body:
  text: 外篇在宥第十一以義名篇慶藩案文選謝靈運九日從宋公戲馬臺集送孔令詩注引司馬云在察也宥寬也釋文闕聞在宥天下不聞治天下也在之也者恐天下之淫其性也宥之也者恐天下之遷其德也天下不淫其性不遷其德有治天下者哉昔堯之治天下也使天下欣欣焉人樂其性是不恬也桀之治天下也使天下瘁瘁焉人苦其性是不愈也夫不恬不愈非德也非德也而可長久者天下無之宥使自在則治治之則亂也人之生也直莫之蕩則性命不過欲惡不爽在上者不能無為上之所為而民皆赴之故有誘慕好欲而民性淫矣故所貴聖王者非貴其能治也貴其無為而任物之自為也宥寬也在自在也治統馭也寓言云聞諸賢聖任物自在寬宥即天下清謐若立教以馭蒼生物失其性如伯樂治馬也聞在宥音又寬也則治直吏反下治亂同欲惡烏路反好欲呼報反性者稟生之理德者功行之名故致在宥之言以防遷淫之過若不任性自在恐物淫僻喪性也若不宥之復恐效他其德遷改也無治乃不遷淫性正德定何勞布政治之哉有政不及無政有為不及無為有治天下者哉崔本作有治天下者材失云強治之是材之失也夫堯雖在宥天下其跡則治也治亂雖殊其於失後世之恬愈使物爭尚畏鄙而不自得則同耳故譽堯而非桀不如兩忘也恬靜也愈樂也瘁憂也堯以德臨人人歌擊壤乖其靜性也桀以殘害於物物遭憂瘁乖其愈樂也堯桀政代斯異使物失性均也人樂音洛恬徒謙反瘁瘁在季反病也廣雅云憂也崔本作醉愈音瑜徐音喻故譽音餘恬愈自得乃可長久堯以不恬人桀以不愈取物不合淳和之性欲得長久天下未之有也人大喜邪毗於陽大怒邪毗於陰陰陽並毗田時不至寒暑之和不成其反傷人之形乎使人喜怒失位居處無常思慮不自得中道不成章於是乎天下始喬詰卓鷙而後有盜跖曾史之行故舉天下以賞其善者不足舉天下以罰其惡者不給故天下之大不足以賞罰自三代以下者胸胸焉終以賞罰為事彼何暇安其性命之情哉毗助也喜出於魂怒出於魄人稟陰陽與二儀同氣堯令百姓喜毗陽暄舒桀使人怒助陰慘肅人喜怒過分則天失常盛夏不暑隆冬無霜既失和氣加之天災人多疾病豈非反傷形乎不可有為作法必致殘傷也毗於如字司馬云助也一云並也俞樾曰釋文毗如字司馬云助也一云並也然下文云陰陽並毗四時不至寒暑之和不成則訓為助已不可通若訓並更為失之矣案此毗字當讀為毗劉暴樂之毗爾雅釋詁云毗劉暴樂也合言之則曰毗劉分言之則或止曰劉詩桑柔篇捋采其劉是也或止曰毗此言毗於陽毗於陰是也暴樂毛公傳作爆爍鄭氏箋云捋采之則爆爍而疏然則爆爍猶剝落也喜屬陽怒屬陰故大喜則傷陽大怒則傷陰毗陰毗陽言傷陰陽之和也故四時不至寒暑之和不成若從司馬訓毗為助則下三句不貫矣淮南子原道篇人大怒破陰大喜墜陽正與此同義此皆堯桀之流使物喜怒大過以致斯患也人在天地之中最能以靈知喜怒擾亂群生而振蕩陰陽也故得失之間喜怒集乎百姓之懷則寒暑之和敗四時之節差百度昏亡萬事失落也為滯喜怒遂使百姓謀慮失真既乖憲章之法斯敗也已思慮息嗣反大過音泰慕賞乃善故賞不能供喬向欽消反或去夭反郭音矯李音驕詰李去吉反徐起列反崔云喬詰意不平也卓敕角反郭丁角反向音鷙敕二反李豬栗反向豬立反又敕栗反崔云卓鷙行不平也之行下孟反畏罰乃止故罰不能勝喬詐僞也詰責問也卓獨也鷙猛也於是喬僞詰責卓爾不群獨懷鷙猛輕陵於物自堯為始次後有盜跖之惡曾史之善善惡既著賞罰係焉慕賞行善懼罰止惡舉天下斧鉞不足以罰惡傾宇宙之藏不足以賞善給猶足也能勝音升若忘賞罰任真乃在足也忘賞罰而自善性命乃大足耳夫賞罰者聖王之所以當功過非以著勸畏也故理至則遺之然後至一可反也而三代以下遂尋其事跡故胸胸焉與跡競逐終以所寄為事性命之情何暇而安哉胸胸歡譁也競逐之謂也人懼斧鉞之誅又慕軒冕之賞心懷百慮事出萬端胸胸競逐而不知止夏殷已來其風漸扇賞罰攖擾終日荒忙有何容暇安其性命胸胸音凶為字依諸子平議刪趙諫議本失作夭世德堂本作失而且說明邪是淫於色也說聰邪是淫於聲也說仁邪是亂於德也說義邪是悖於理也說禮邪是相於技也說樂是相於淫也說聖邪是相於藝也說知邪是相於疵也天下將安其性命之情之八者存可也亡可也天下將不安其性命之情之八者乃始臠卷獊囊而亂天下也而天下乃始尊之惜之甚矣天下之惑也豈直過也而去之邪乃齊戒以言之跪坐以進之鼓歌以鳷之吾若是何哉說愛染也淫耽滯也希離慕曠為滯聲色而且如字徐子餘反說明音悅下同德無憎愛偏愛故亂德理無是非裁非故逆理悖逆也是悖必內反徐蒲沒反禮者擎跽曲拳節文隆殺樂者咸池大夏律呂八音說禮乃助浮華技能愛樂更助宮商淫聲是相息亮反助也下及注皆同於技其綺反李音歧崔同云不端也當理無說說之則致淫悖之患矣相助也說聖跡助世間之藝術愛智計益是非之疵病也說知音智於疵疾斯反存亡無所在任其所受之分則性命安矣八者聰明仁義禮樂聖智是也言人稟分不同性情各異離曠曾史素分有者存之可也衆人性分本無企慕乖真亡之可也必存此八者則不能縱任自然故為臠卷獊囊也臠卷不舒放之容也獊囊遽之貌也天下群生唯知分外不能安任臠卷自拘夸華人事獊囊速爭馳逐物由八者不忘致斯弊者也臠力轉反崔本作欒卷卷勉反徐居阮反司馬云臠卷不申舒之狀也崔同一云相牽引也獊音倉崔本作戕囊如字崔云戕囊猶搶攘盧文弨曰今本獊作愴不能遺之已為誤矣而乃復尊之以為貴豈不甚惑哉前八者亂天下之經不能忘遺已是大惑方復尊敬用為楷模痛惜甚也乃復扶又反非直由寄而過去也乃珍貴之如此八條之義事同芻狗過去之後不合更收誠禁致齊明言執禮君臣跪坐更相進獻鼓九韶之歌舞大章之曲珍重蘧廬一至於此莊生目擊無奈之何也而去起慮反之邪崔本唯此一字作邪餘皆作咫齊戒本又作齊同側皆反跪其詭反郭音危邪字依世德堂本改世德堂本作愴注同趙諫議本作傖故君子不得已而臨蒞天下莫若無為無為也而後安其性命之情故貴以身於為天下則可以託天下愛以身於為天下則可以寄天下故君子苟能無解其五藏無擢其聰明尸居而龍見淵默而雷聲神動而天隨從容無為而萬物炊纍焉吾又何暇治天下哉無為者非拱默之謂也直各任其自為則性命安矣不得已者非迫於威刑也直抱道懷朴任乎必然之極而天下自賓也君子聖人也不得已臨蒞天下恆自無為雖復無為非關拱默動寂無心而性命之情未始不安也蒞音利又音類家世父曰言貴其身重於所以為天下愛其身甚於所以為天下惟貴惟愛故無為若夫輕身以赴利棄我而殉物則身且不能安其如天下何貴身賤利內我外物保愛精神不蕩於世者故可寄坐萬物之上託化於天下也解擢則傷也五藏精靈之宅聰明耳目之用若分辨五藏情識顯擢聰明之用則精神奔馳於內耳目竭喪於外矣無解如字一音蟹散也出處默語常無其心而付之自然聖人寂同死尸寂泊動類飛龍在天豈有寂動理教之異哉故寂而動尸居而龍見淵默而雷聲欲明寂動動寂理教教理不一異也龍見賢遍反向崔本作睍向音見崔音睍神順物而動天隨理而行神者妙萬物而為言也即動即寂德同蒼昊隨順生物也家世父曰尸居龍見不見而章淵默雷聲不動而變神動天隨無為而成若游塵之自動纍塵也從容自在無為虛淡若風動細塵類空中浮物陽氣飄颻任運去留而已從容七容反炊昌睡反又昌規反本或作吹同纍劣僞反司馬云炊纍猶動升也向郭云如埃塵之自動也任其自然而已物我齊混俱合自然何勞功暇更為治法也崔瞿問於老聃曰不治天下安藏人心老聃曰女慎無攖人心人心排下而進上上下囚殺淖約柔乎剛彊廉劌雕琢其熱焦火其寒凝冰其疾俯仰之間而再撫四海之外其居也淵而靜其動也縣而天僨驕而不可係者其唯人心乎攖之則傷其自善也姓崔名瞿不知何許人也既問在宥不治人心何以履善答曰宥之放之自合其理作法理物則攖撓人心人心列下文云崔瞿向崔本作臞向求朱反崔瞿人姓名也老聃吐藍反女慎音汝攖於營反又於盈反司馬云引也崔云羈落也排之則下進之則上言其易搖蕩也人心排他居下進己在上皆常情也排皮皆反崔本作俳進上時掌反注及下同其易以豉反無所排進乃安全耳溺心上下為境所牽如禁之囚攖煩困苦囚殺如字徐所例反言囚殺萬物也家世父曰上下囚殺言詭上詭下使其心拘囚殺不自適也淖約者矯揉則剛可使柔廉劌者徑遂寒熱百變水火兼施攖之而遂至於不可遏郭象注恐誤言能淖約則剛彊者柔矣淖約柔弱也矯情行於柔弱欲制服於剛彊淖昌略反又直角反夫焦火之熱凝冰之寒皆喜怒並積之所生若乃不雕不琢各全其朴則何冰炭之有哉廉務名也劌傷也雕琢名行欲在物前若違情起怒寒甚凝冰順心生喜熱踰焦火廉劌居衛反司馬云傷也廣雅云利也琢丁角反風俗之所動也逐境之心一念之頃已遍十方況俯仰之間不再臨四海哉靜之可使如淵動之則係天而踊躍也有欲之心去無定準偶爾而靜如流水之遇淵潭觸境而動類高天之縣不息動之則係天踊躍縣而天音玄向本無而字云希高慕遠故曰縣天人心之變靡所不為順而放之則靜而自通治而係之則跂而僨驕僨驕者不可禁之勢也排下進上美惡喜怒僨發驕矜不可禁制者其在人心乎僨向粉問反廣雅云僵也郭音奔驕如字又居表反郭云僨驕者不可禁之勢世德堂本藏作臧世德堂本無自字昔者黃帝始以仁義攖人之心堯舜於是乎股無胈脛無毛以養天下之形愁其五藏以為仁義矜其血氣以規法度然猶有不勝也堯於是放歡兜於崇山投三苗於三峗流共工於幽都此不勝天下也夫施及三王而天下大駭矣下有桀跖上有曾史而儒墨畢起於是乎喜怒相疑愚知相欺善否相非誕信相譏而天下衰矣大德不同而性命爛漫矣天下好知而百姓求竭矣於是乎釿鋸制焉繩墨殺焉椎鑿決焉天下脊脊大亂罪在攖人心故賢者伏處大山嵁巖之下而萬乘之君憂栗乎廟堂之上夫黃帝非為仁義也直與物冥則仁義之跡自見跡自見則後世之心必自殉之是亦黃帝之跡使物攖也黃帝因宜作則慈愛養民實異偏尚之仁裁非之義後代之王執其軌轍蒼生名之為聖攖人之心自此始也弊起後王釁非黃帝自見賢遍反下同胈白肉也堯舜行黃帝之跡心形瘦弊股瘦無白肉脛禿無細毛養天下形容安萬物情性五藏憂愁於內血氣矜莊於外行仁義以為規矩立法度以為楷模尚不免流放凶族則有不勝股音古脛本曰股胈畔末反向父末反李扶蓋反云白肉也或云字當作紱紱蔽膝也崔云胈也脛刑定反慶藩案矜其血氣猶孟子言苦其心志也矜者苦也訓見爾雅釋言篇昔帝鴻氏有不才子天下謂之渾沌即歡兜也為黨共工放南裔也縉雲氏有不才子天下謂之叨餮即三苗也為堯諸侯封三苗之國國在左洞庭右彭蠡居豫章近南嶽三峗山名在西裔即秦州西羌地少昊氏有不才子天下謂之窮奇即共工也為堯水官幽都在北方即幽州之地尚書有殛鯀此文不備也四人皆包藏凶惡不遵堯化故投諸四裔是堯不勝天下之事放四凶由舜今稱堯者其時舜攝堯位故耳歡音歡兜侯反崇山南裔也堯六十年放歡兜於崇山投三苗崔本投作殺尚書作竄三苗者縉雲氏之子即叨餮也三峗音危本亦作危三危西裔之山也今屬天水堯六十六年竄三苗於三危共工音恭共工官名即窮奇也幽都李云即幽州也尚書作幽州北裔也堯六十四年流共工於幽州夫堯舜帝王之名皆其跡耳我寄斯跡而跡非我也故駭者自世世彌駭其跡愈粗粗之與妙自途之夷險耳遊者豈常改其足哉故聖人一也而有堯舜湯武之異明斯異者時世之名耳未足以名聖人之實也故夫堯舜者豈直一堯舜而已哉是以雖有矜愁之貌仁義之跡而所以跡者故全也施延也自黃帝逮乎堯舜聖跡滯物擾亂延及三王驚駭更甚施及以智反崔云延也大駭駭驚也愈粗音粗下同桀跖行小人之行為下曾史行君子之行為上謂儒墨守跡是非因之而起也喜是怒非更相疑二飾智驚愚互為欺侮愚知音智下及注同善與不善彼此相非誕虛信實自相譏誚莫能齊於自得相仍糾紛宇宙衰也立小異而不止於分喜怒是非熾然大盛故天年夭枉性命爛漫爛漫散亂也知無涯而好之故無以供其求聖人窮無涯之知百姓焉不竭哉好知呼報反注同雕琢性命遂至於此繩墨正木之曲直禮義示人之隆殺椎鑿穿木之孔竅刑法決人之身首工匠運斤鋸以殘木聖人用禮法以傷道釿音斤本亦作斤鋸音據制焉釿鋸制謂如肉刑也繩墨殺焉並如字崔云謂彈正殺之椎直追反鑿在洛反決焉古穴反又苦穴反崔云肉刑故用椎鑿若夫任自然而居當則賢愚襲情而貴賤履位君臣上下莫匪爾極而天下無患矣斯跡也遂攖天下之心使奔馳而不可止故中知以下莫不外飾其性以眩惑衆人惡直醜正蕃徒相引是以任真者失其據而崇僞者竊其柄於是主憂於上民困於下矣脊脊相踐籍也一云亂宇宙大亂罪由聖知君子道消晦跡林藪人君雖在廟堂心恆憂栗既無良輔恐國傾危也脊脊音藉在亦反相踐藉也本亦作肴肴廣雅云肴亂也大山音泰亦如字嵁苦巖反一音苦咸反又苦嚴反巖音嚴語銜反一音巖語咸及反盧文弨曰今本作岩俞樾曰釋文大山音泰亦如字當以讀如字為是此泛言山之大者不必東嶽泰山也嵁當為湛文選封禪文湛恩鴻李注曰湛深也湛巖猶深巖因其以山巖言故變從水者而從山耳山言其大巖言其深義正相應學者不達其義而音大為泰失之矣田子方篇其神經乎大山而無介入乎淵泉而不濡釋文大音泰失與此同文選風賦緣泰山之阿古詩孤生竹結根泰山阿夫風之所緣竹之所生非必泰山也其原文應並作大山泛言山之大者後人誤讀為泰並改作泰耳以眩玄遍反惡直烏路反蕃徒音煩趙諫議本大作太趙本無乎字丁字依世德堂本及釋文原本改世德堂本而作天趙本而下有天字趙本聖作至世德堂本若作故世德堂本無遂字反字依世德堂本及釋文原本改世德堂本作岩本書依釋文改今世殊死者相枕也桁楊者相推也刑戮者相望也而儒墨乃始離跂攘臂乎桎梏之間意甚矣哉其無愧而不知恥也甚矣吾未知聖知之不為桁楊椄槢也仁義之不為桎梏鑿枘也焉知曾史之不為桀跖嚆矢也故曰絶聖棄知而天下大治殊者決定當死也桁楊者械也夾腳及頸皆名桁楊六國之時及衰周之世良由聖跡黥劓五刑遂使桁楊盈衢殊死者相枕殘兀滿路相推相望明其多也殊死如字廣雅云殊斷也司馬云決也一云誅也字林云死也說文同又云漢令曰蠻夷長有罪當殊之崔本作夭死相枕之鴆反桁戶剛反司馬云腳長械也楊向音陽崔云械夾頸及脛者皆曰桁楊由腐儒守跡故致斯禍不思捐跡反一而方復攘臂用跡以治跡可謂無愧而不知恥之甚也離跂用力貌也聖跡為害物之具而儒墨方復攘臂分外用力於桎梏之間執跡封教救當世之弊何荒亂之能極哉故發噫歎息固陋不已無愧而不知恥也離力氏反又力智反跂丘氏反又丘豉反攘如羊反桎之實反梏古毒反慶藩案離跂即荀子榮辱篇離縱而跂訾之義謂自異於衆也意如字又音醫無愧崔本作腐音輔方復扶又反桁楊以椄槢為管而桎梏以鑿枘為用聖知仁義者遠於罪之跡也跡遠罪則民斯尚之尚之則矯詐生焉矯詐生而禦姦之器不具者未之有也故棄所尚則矯詐不作矯詐不作則桁楊桎梏廢矣何鑿枘椄槢之為哉椄槢械楔也鑿孔也以物內孔中曰枘械不楔不牢梏無孔無用亦猶憲章非聖跡不立桀跖無仁義不行聖跡是攖擾之原仁義是殘害之本椄李如字向徐音郭慈接反槢郭李音習向徐徒燮反司馬云椄槢械楔音息節反崔本作云讀為牒或作謵字椄槢桎梏梁也淮南曰大者為柱梁小者為椄槢也慶藩案文選何平叔景福殿賦注引司馬云槢械楔也與釋文異釋文槢上有椄字楔下無也字鑿在洛反又在報反枘人鋭反向本作內音同三蒼云柱頭枘也鑿頭廁木如柱頭枘遠於于萬反下同而禦魚呂反本又作御音同嚆矢矢之猛者言曾史為桀跖之利用也嚆箭鏃有吼猛聲也聖智是竊國之具仁義為凶暴之資曾史為桀跖利用猛箭故云然也焉知於虔反嚆矢許交反本亦作嗃向云嚆矢矢之鳴者郭云矢之猛者字林云嚆大呼也崔本作蒿云蕭蒿可以為箭或作矯矯噪也崔本此下更有有無之相生也則甚曾史與桀跖生有無也又惡得無相轂也凡二十四字去其所以攖也絶竊國之具棄凶暴之資即宇內清平言大治也大治直吏反去其起呂反世德堂本作思趙諫議本作斯趙本矯作驕世德堂本作奸妾字依世德堂本改釋文原本亦誤燮黃帝立為天子十九年令行天下聞廣成子在於空同之故往見之曰我聞吾子達於至道敢問至道之精吾欲取天地之精以佐五穀以養民人吾又欲官陰陽以遂群生為之奈何德化詔令內大行空同山涼州北界廣成即老子別號也廣成子或云即老子空同司馬云當北斗下山也爾雅云北戴斗極為空同一曰在梁國虞城東三十里五穀黍稷菽麻麥也欲取窈冥之理天地陰陽精氣助成五穀以養蒼生也遂順也欲象陰陽設官分職順群生之性問其所以山字依闕誤引張君房本及成疏改廣成子曰而所欲問者物之質也而所欲官者物之殘也自而治天下雲氣不待族而雨草木不待黃而落日月之光益以荒矣而佞人之心翦翦者又奚足以語至道問至道之精可謂質也而汝也欲播植五穀官府二儀所問粗淺不過形質乖深玄之致是詆訶也質也廣雅云質正也不任其自爾而欲官之故殘也苟欲設官分職引物從己既乖造化必致傷殘族聚也分百官於陰陽有心治萬物必致凶災雨風不調炎涼失節雲未聚而雨降木尚青而葉落欃槍薄蝕三光昏晦人心遭擾玄象荒殆雲氣不待族而雨司馬云族聚也未聚而雨言澤少草木不待黃而落司馬云言殺氣多也爾雅云落死也益以崔本作蓋以翦翦狹劣之貌也汝是諂佞之人心甚狹劣何能語至道也佞人如字郭音寧翦翦如字郭司馬云善辨也一曰佞貌李云淺短貌或云狹小之貌黃帝退捐天下築特室席白茅閒居三月復往邀之黃帝退清齊一心舍九五尊位築特室避歡囂藉白茅以潔淨閒居經時重往請道邀遇也捐悅全反閒居音間下注同復往扶又反邀之古堯反要也廣成子南首而臥黃帝順下風膝行而進再拜稽首而問曰聞吾子達於至道敢問治身奈何而可以長久廣成子蹶然而起曰善哉問乎來吾語女至道至道之精窈窈冥冥至道之極昏昏默默無視無聽抱神以靜形將自正必靜必清無勞女形無搖女精乃可以長生目無所見耳無所聞心無所知女神將守形形乃長生慎女內閉女外多知為敗我為女遂於大明之上矣至彼至陽之原也為女入於窈冥之門矣至彼至陰之原也天地有官陰陽有藏慎守女身物將自壯我守其一以處其和故我修身千二百歲矣吾形未常衰人皆自修而不治天下則天下治矣故善之也使人治物物必攖煩各各治身天下清正故善之蹶然疾起南首音狩蹶其月反又音厥驚而起也慶藩案文選張景陽七命注引司馬云蹶疾起貌釋文闕天下治直吏反窈冥昏默皆了無也夫莊老之所以屢稱無者何哉明生物者無物而物自生耳自生耳非為生也又何有為於已生乎至道精微心靈不測故寄窈冥深遠昏默玄絶吾語魚據反下同女音汝後倣此窈窈烏了反忘視而自見忘聽而自聞則神不擾而形不邪也耳目無外視聽抱守精神境不能亂心與形合自冥正道不邪似嗟反任其自動故閒靜而不夭也清神靜慮體無所勞不緣外境精神常寂心閒形逸長生久視此皆率性而動故長生也任視聽而無所見聞根塵既空心亦安靜照無知慮應機常寂神淡守形可長生久視也全其真也忘心全也守其分也絶視聽守分也知無崖故敗不慎智慮心神既困耳目竭於外何不敗哉夫極陰陽之原乃遂於大明之上入於窈冥之門也陽動也陰寂也遂出也至人應動之時智照如日月名大明也至陽之原表從本降跡故言出也無感之時深根寂然凝湛也至陰之原示攝跡歸本故曰入窈冥之門廣成示黃帝動寂兩義故託陰陽二門也我為于僞反下同但當任之天官謂日月星辰能照臨四方綱維萬物故稱官也地官謂金木水火土能維持動植運載群品亦稱官也陰陽二氣春夏秋冬各有司存如藏府也咸得隨任無不稱適何違造化更立官府也女但無為慎守女身一切萬物自然昌盛何勞措心自貽伊戚哉物將自壯側亮反謂不治天下則衆物皆自任自任而壯也取於盡性命之極極長生之致耳身不夭乃能及物也保恬淡一心處中和妙道攝衛修身雖有壽考之年終無衰老之日真字依注文改黃帝再拜稽首曰廣成子之謂天矣天無為也歎聖道之清高可與玄天合德也廣成子曰來余語女彼其物無窮而人皆以為有終彼其物無測而人皆以為有極得吾道者上為皇而下為王失吾道者上見光而下為土今夫百昌皆生於土而反於土故余將去女入無窮之門以遊無極之野吾與日月參光吾與天地為常當我緡乎遠我昏乎人其盡死而我獨存乎死生變化物理無窮俗人愚惑謂有終始徒見其一變也萬物不測千變萬化愚人迷執謂有限極慶藩案無測言無盡也說文測深所至也深所至謂深之盡極處呂氏春秋論人篇闊大淵深不可測也高注測盡極也淮南原道篇水大不可極深不可測高注測盡也無測有極正對文言之皇王之稱隨世之上下耳其於得通變之道以應無窮一也得自然之道上逢淳朴之世則作羲農下遇澆季之時應為湯武皇王跡自夷險道則一也之稱尺證反失無窮之道則自信於一變而不能均同上下故俯仰異心喪無為之道滯有欲之心生則睹於光明死則便為土壤迷執生死不能均同上下故有兩名也土無心者也生於無心故當反守無心而獨往也夫百物昌盛皆生於地及其雕落還歸於土世間萬物從無而生死歸空寂生死不二不滯一方今將去女任適也百昌司馬云猶百物也與化俱也反歸冥寂之本入無窮之門應變天地之間遊無極之野都任之也參同也與三景齊明將二儀同久豈千二百歲哉物之去來皆不覺也聖人無心若鏡機當感發即應機冥符若前機不感即昏然晦跡也當我如字緡乎武巾反郭音泯泯合也家世父曰釋文緡泯合也緡昏字通緡亦昏也當我鄉我而來遠我背我而去任人之鄉背而一以無心應之遠我于萬反昏乎如字暗也司馬云緡昏並無心之謂也以死生為一體則無往而非存一死生明變化未始非我無去無來我獨存也人執生死故憂患之雲將東遊過扶搖之枝而適遭鴻蒙鴻蒙方將拊脾雀躍而遊雲將見之倘然止贄然立曰叟何人邪叟何為此雲將雲主將也鴻蒙元氣也扶搖木神木生東海也亦云風遭遇也拊拍也爵躍跳躍也寓言也夫氣是生物之元也雲為雨澤之本也木是春陽之鄉東為仁惠之方舉此四事示君王御物以德澤為先也雲將子匠反下同李云雲主帥也扶搖扶亦作夫音符李云扶搖神木也生東海一云風也慶藩案初學記一御覽八引司馬云雲將雲之主帥釋文闕鴻蒙如字司馬云自然元氣也一云海上氣也拊孚甫反一音甫脾本又作髀音陛徐甫婢反又甫娣反雀本又作爵同將略反躍司馬云雀躍若雀浴也一云如雀之跳躍也怪其容儀殊俗動止異凡故問行李由庶為理物之道也倘驚疑貌贄不動也叟長老名也倘尺掌反一音吐郎反李吐黨反司馬云欲止貌李云自失貌贄之二反又豬立反又魚列反李云不動貌叟本又作素口反郭疏走反司馬云長者稱趙諫議本脾雀作髀爵下同神木依釋文改鴻蒙拊脾雀躍不輟對雲將曰遊乘自然變化遨遊也不輟丁劣反李云止也雲將曰朕願有問也鴻蒙仰而視雲將曰吁雲將曰天氣不和地氣鬱結六氣不調四時不節今我願合六氣之精以育群生為之奈何二氣不降不升鬱結也曰吁況于反亦作呼慶藩案釋文吁亦作呼呼吁古通用字說文吁驚語也文元年左傳呼役夫杜注呼發聲也堯典帝曰吁傳曰吁疑怪之辭驚疑之聲亦發聲也檀弓瞿然曰呼釋文呼作吁月令大雩帝鄭注雩吁嗟求雨之祭周官女巫疏引董仲舒曰雩求雨之術呼嗟之歌皆其例鬱結如字崔本作綰音結陰陽風雨晦明此六氣也春夏秋冬節令愆滯其序我欲合六氣精華以養萬物故問也語字依說文補鴻蒙拊脾雀躍掉頭曰吾弗知吾弗知萬物咸稟自然若措意治之必乖造化故掉頭不答掉徒弔反雲將不得問又三年東遊過有宋之野而適遭鴻蒙雲將大喜行趨而進曰天忘朕邪天忘朕邪再拜稽首願聞於鴻蒙如上天再言忘朕幸憶往事也有宋如字國名也本作宗者非鴻蒙曰浮遊不知所求猖狂不知所往遊者鞅掌以觀無妄朕又何知而自得所求也浮遊處世無貪取也而自得所往也無心妄行無的當也夫內足者舉目皆自正也鴻蒙遊心之處寬大涉見之物衆多能觀之智知所觀之境無妄也鞅掌衆多也鞅掌於丈反毛詩傳云鞅掌失容也今此言自得而正也以斯而已矣浮遊猖狂虛心任物物各自正我復何知雲將曰朕也自以為猖狂而民隨豫所往朕也不得已於民今則民之放也願聞一言夫乘物非為跡而跡自彰猖狂非招民而民自往故為民所放效而不得已也我同鴻蒙無心馭世不得已臨人人則隨我跡便為物放效也之放方往反效也注同願聞要旨庶決深疑趙諫議本豫作子鴻蒙曰亂天之經逆物之情玄天弗成解獸之群而鳥皆夜鳴災及草木禍及止蟲意治人之過也若夫順物性而不治則情不逆而經不亂玄默成而自然得也亂天然常道逆物真性即譎詐方起自然之化不成也離其所以靜也放效跡彰害物災起獸則驚群散起鳥則駭飛夜鳴皆坐而受害也草木未霜零落災禍及昆蟲昆明也向陽啓蟄止蟲如字本亦作昆蟲崔本作正蟲皆坐才臥反夫有治之跡亂之所由生也天治斯滅治人過也意音醫本又作噫下皆同趙諫議本止作昆趙本意作噫下同雲將曰然則吾奈何欲請不治之術鴻蒙曰意毒哉仙仙乎歸矣言治人之過深重傷禍敗屢嘆噫歎聲仙仙坐起之貌嫌不能隤然通放故遣使歸仙仙輕舉之貌嫌雲將治物為禍故示輕舉勸令息跡歸本仙仙音仙趙諫議本仙作仙雲將曰吾遇天難願聞一言鴻蒙曰意心養汝徒處無為而物自化墮爾形體吐爾聰明倫與物忘大同乎涬溟解心釋神莫然無魂萬物云云各復其根各復其根而不知渾渾沌沌終身不離若彼知之乃是離之無問其名無窺其情物固自生夫心以用傷則養心者其唯不用心乎養心之術列在下文徒但也但處心無為而物自化理與物皆不以存懷而暗付自然則無為而自化矣倫理也墮形體忘身也吐聰明忘心也身心兩忘物我雙遣是養心也墮許規反王引之曰吐當為咄咄與黜同徐無鬼篇黜耆欲司馬本作咄韋昭注周語曰黜廢也黜與墮義相近大宗師篇墮枝體黜聰明即其證也隸書出字或省作士若省作敖省作賣省作款之類故咄字或作形與吐相似因訛為吐矣咄之訛作吐猶吐之訛作咄漢書外戚傳必畏惡吐棄我漢紀吐訛作咄俞樾曰吐當作杜言杜塞其聰明也與物無際溟涬自然之氣也茫蕩身心大同自然合體也涬戶頂反又音幸溟亡頂反司馬云涬溟自然氣也坐忘任獨魂好知為也解釋遣蕩也莫然無知滌蕩心靈同死灰枯木無知魂也不知而復乃真復也云云衆多也衆多往來生滅不離自然歸根明矣豈得用知然後復根矣哉渾沌無知而任其自復乃能終身不離其本也渾沌無知而任獨千變萬化不離自然渾渾戶本反沌沌徒本反不離力智反下及注皆同知而復之與復乖矣用知慕至本乃離自然之性窺問則失其自生也道離名言理絶情慮若以名問道以情窺理不亦遠哉能遣情忘名任于獨化物得生理也世德堂本之作知雲將曰天降朕以德示朕以默躬身求之乃今也得再拜稽首起辭而行知而不默常自失也降道德之言示玄默之行立身以來方今始悟世俗之人皆喜人之同乎己而惡人之異於己也同於己而欲之異於己而不欲者以出乎衆為心也夫以出乎衆為心者曷常出乎衆哉因衆以寧所聞不如衆技衆矣而欲為人之國者此攬乎三王之利而不見其患者也此以人之國僥幸也幾何僥幸而不喪人之國乎其存人之國也無萬分之一而喪人之國也一不成而萬有餘喪矣悲夫有土者之不知也染習之人迷執日久同己喜歡異己嫌惡也而惡烏路反心欲出群為衆雋也夫是我而非彼喜同而惡異者必欲顯己功名超出群衆家世父曰出乎衆者以才智加人而人皆順之抑不知己之出乎衆乎衆之出乎己乎因衆之所同而同之因衆之所異而異之以為衆也則夫喜人之同而惡人之異猶之異同乎衆也喜與怒固不因己而因衆而一據之以為己此所以為惑也衆皆以出衆為心故所以為衆人也若我亦欲出乎衆則與衆無異而不能相出矣夫衆皆以相出為心而我獨無往而不同乃大殊於衆而為衆主也人以競先出乎衆為心此是恆物鄙情何能獨超群外同其光塵方大殊於衆而為衆傑吾一人之所聞不如衆技多故因衆則寧也若不因衆則衆之千萬皆我敵也用衆人技能因衆人聞見即無忿競所謂明者為之視智者為之謀也因衆以寧所聞因衆人之所聞見委而任之則自寧安不如衆技其綺反衆矣若役我之知達衆人衆人之技多於我矣安得而不自困哉夫欲為人之國者不因衆之自為而以己為之者此為徒求三王主物之利而不見己為之患也然則三王之所以利豈為之哉因天下之自為而任耳用一己偏執為國者徒求三王主物之利不知為喪身之大患也此攬音覽本亦作覽僥要也以皇王之國利要求非分為一身之幸會者未嘗不身遭殞敗萬不存一故云幾何也僥古堯反徐古了反字或作徼幸音幸一云僥幸求利不止之貌慶藩案僥要也求也釋文或作徼徼亦求也見呂覽頌民篇高注幾何居豈反郭巨機反不喪息浪反下及注同己與天下相因而成者也今以一己而專制天下則天下塞矣己豈通哉故一身既不成而萬方有餘喪矣以僥幸之心為帝王之主論存則固無一成語亡則有餘敗也萬分如字又扶問反此一句傷嘆君王不知僥幸為弊矣闕誤引江南古藏本此以作以此因世德堂本無此句世德堂本無衆字夫有土者有大物也有大物者不可以物物而不物故能物物明乎物物者之非物也豈獨治天下百姓而已哉出入六合遊乎九州獨往獨來是謂獨有獨有之人是謂至貴九五尊高四海弘巨是稱大物也不能用物而為物用即是物耳豈能物物哉不能物物則不足以有大物矣苟求三王之國不能任物自為翻為物用己自是物焉能物物斷不可也夫用物者不為物用也不為物用斯不物矣不物故物天下之物使各自得也不為物用而用於物者也家世父曰有物在焉而見以為物而物之終身不離乎物所見之物愈大而身愈小不見有物而物皆效命焉夫且不見有物又奚以物之大小為哉俞樾曰郭斷不可以物物五字為句失其讀矣此當讀不可以物為句物而不物為句用天下之自為故馳萬物而不窮聖人通自然達造化運百姓心知用群生耳目是知物物非物也豈獨戴黃屋坐汾陽佩玉璽治天下哉固當排六合陵太清超九州遊姑射矣人皆自異而己獨群遊斯乃獨往獨來者也獨有斯獨可謂獨有矣有注釋也夫與衆玄同非求貴於衆而衆人不能不貴斯至貴也若乃信其偏見而以獨異為心則雖同於一致故是俗中之一物耳非獨有者也未能獨有而欲叨竊軒冕冒取非分衆豈歸之哉故非至貴也人皆自異而己獨與群遊斯乃獨往獨來者也獨有斯獨可謂獨有矣人欲出衆而己獨遊衆無此能故名獨有獨有之人蒼生樂推百姓荷戴以斯為主可謂至尊至貴也叨吐刀反冒亡北反又亡報反世德堂本之下有也字人皆至有矣二十七字注文混入當刪大人之教若形之於影聲之於響有問而應之盡其所懷為天下配處乎無響行乎無方挈汝適復之撓撓以遊無端出入無旁與日無始頌論形軀合乎大同大同而無己無己惡乎得有有睹有者昔之君子睹無者天地之友百姓之心形聲也大人之教影響也大人之於天下何心哉猶影響之隨形聲耳大人聖人也無心感應應不以心故百姓之心形聲也大人之教影響也於嚮許丈反本又作響注及下同使物之所懷各得自盡也聖人心隨物感感又稱機盡物懷抱問者為主應故為配配匹也先感為主應者為匹也寂以待物處寂也無感之時心如枯木寂無影響也隨物轉化行應機也逗機不定方所也撓撓自動也提挈萬物使復歸自動之性即無為之至也撓撓自動也逗機無方還欲提挈汝等群品令歸自本性則無為至也挈苦結反廣雅云持撓撓而小反俞樾曰郭注未得其解爾雅釋詁適往也然則適復猶往復也撓撓亂也廣雅釋詁撓亂也重言之則為撓撓矣適復之撓撓此世俗之人所以不能獨往獨來也惟大人則提挈其適復之撓撓者而與之共遊於無端故曰挈汝適復之撓撓以遊無端二句本止一句郭失其解並失其讀矣與化俱故無端遊心與自然俱遊故無朕跡之端崖玄同無表出入塵埃生死之中玄同造物無邊可見與日新俱故無始也與日俱新故無終始其形容與天地無異贊頌贊論語聖人盛德軀貌與二儀大道合同外不窺乎宇宙內不有其己身也有己則不能大同也合二儀同大道則物我俱忘也天下之難無者己也己既無矣則群有不足復有之己既無矣物焉有哉惡音烏足復扶又反能美其名者耳行仁義禮君臣者不離有為君子也睹無則任其獨生也睹無為之妙理見自然之正性二儀非有萬物盡空翻有入無故稱為友矣趙諫議本作響世德堂本作嚮注同依釋文應作嚮也字依世德堂本改賤而不可不任者物也卑而不可不因者民也匿而不可不為者事也粗而不可不陳者法也遠而不可不居者義也親而不可不廣者仁也節而不可不積者禮也中而不可不高者德也一而不可不易者道也神而不可不為者天也故聖人觀於天而不助成於德而不纍出於道而不謀會於仁而不恃薄於義而不積應於禮而不諱接於事而不辭齊於法而不亂恃於民而不輕因於物而不去物者莫足為也而不可不為不明於天者不純於德不通於道者無自而可不明於道者悲夫因其性而任之則治反其性而淩之則亂夫民物之所以卑而賤者不能因任故也是以任賤者貴因卑者尊此必然之符也民雖居下各有功能物雖輕賤咸負材用物無棄材人無棄用庶咸亨也則治直吏反夫事藏於彼故匿也彼各自為故不可不為但當因任耳匿藏也事有隱顯性有工拙或顯於此或隱於彼或工於此或拙於彼但當任之悉事濟也匿而女力反法者妙事之跡也安可以跡粗而不陳妙事哉法言教也以教望理理妙法粗取諭筌蹄故順陳說故也當乃居之所以為遠義雖去道疏遠苟其合理應須取斷親則苦偏故廣乃仁耳親偏愛狹劣周普廣愛乃大仁也夫禮節者患於係一故物物體之則積而周矣積厚也節文也夫禮貴尚往來人情乖薄故外示折旋內敦積厚此真禮也事之下者雖中非德中順也修道之人和光處世卑順於物而志行清高涅而不緇其德也中而不可不高者德也中者順也順其性而高也事之難者雖一非道況不一哉妙本一氣通生萬物甚自簡易其唯道乎不易以豉反下注同執意不為雖神非天況不神哉神功不測顯晦無方逗機無滯合天然也順其自為而已聖人觀自然妙理大順群物而不助其性分此下釋前文自然與高會也能使境智冥會上德既成自無瑕纍也不謀而一所以為易顯出妙一之道豈得待顯謀而後說恃則不廣老經云為而不恃仁慈博愛貴在合宜故無恃賴率性居遠非積也先王蘧廬非可寶重已陳芻狗豈積而留自然應禮非由忌諱妙本湛然跡應於禮豈拘忌諱俞樾曰諱讀為違違諱並從韋聲故廣雅釋詁曰諱避也韋昭注周語晉語並曰違避也是二字聲近義通應於禮而不諱即不違也郭注曰自然應禮非由忌諱則失之迂曲矣事以接能否自任應動而動無所辭讓混俗揚波因事接物應機不取亦無辭讓應動憶升反御粗以妙故不亂也因於物性以法齊之故不亂也恃其自為耳不輕用也民惟邦本本固而邦寧故恃藉不敢輕用也因而就任之不去其本也順黔黎之心因庶物之性雖施於法教不令離於性本夫為者豈以足為故為哉自體此為故不可得而止也物之稟性功用萬殊如蜣蜋轉丸蜘蛛結網出自天然非關假學故素無之而不可強為性中有者不可不為也物者莫足為也分外也而不可不為分內也不明自然則有為有為而德不純也暗自然之理則澆薄之德不純也不能虛己以待物則事事失會滯虛玄道性故觸事面牆諒無從而可也暗天人之理惑君臣之義所作顛蹶深可悲傷則字依注文改世德堂本無其字理字依世德堂本改何謂道有天道有人道無為而尊者天道也有為而纍者人道也主者天道也臣者人道也天道之與人道也相去遠矣不可不察也在上而任萬物之自為也無事無為尊高在上者合自然天道也以有為為纍者不能率其自得也司職有為事纍繁擾者人倫之道同乎天之任物則自然居物上君在上任物合天道無為也各當所任君位無為而委百官百官有所司而君不與焉二者俱以不為而自得則君道逸臣道勞勞逸之際不可同日而論之也君位尊高委之宰牧臣道卑下竭誠奉上故君道逸臣道勞不可同日而語也不與音豫不察則君臣之位亂矣天道君而無為人道臣而有事尊卑有隔勞逸不同各守其分則君臣咸無為也必不能鑒理即勞逸失宜君臣亂矣夫二儀生育變化無窮形質之中最為廣大而新新變化念念推遷實為等均所謂亭之毒之也夫二儀以下三十七字係下卷天地篇首二句疏文混入當刪
