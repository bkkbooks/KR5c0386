body:
  text: 雜篇天下第三十三以義名篇天下之治方術者多矣皆以其有為不可加矣古之所謂道術者果惡乎在曰無乎不在曰神何由降明何由出聖有所生王有所成皆原於一為其所有為則真為也為其真為則無為矣又何加焉方道也自軒頊已下迄于堯舜治道藝術方法甚多皆隨有物之情順其所為之性任群品之動植曾不加之於分表是以雖教不教雖為不為矣上古三皇所行道術隨物任化淳朴無為此之方法定在何處假設疑問發明深理也惡乎音烏答曰無為玄道所在有之自古及今無處不遍神明由事感而後降出神者妙物之名明者智周為義若使虛通聖道今古有之亦何勞彼神人顯茲明智制體作樂以導物乎夫虛凝玄道物感所以誕生聖帝明王功成所以降迹豈徒然哉使物各復其根抱一而已無飾於外斯聖王所以生成也原本也一道雖復降靈接物混迹和光應物不離真常抱一而歸本者也趙諫議本其所作以其不離於宗謂之天人不離於精謂之神人不離於真謂之至人以天為宗以德為本以道為門兆於變化謂之聖人以仁為恩以義為理以禮為行以樂為和薰然慈仁謂之君子以法為分以名為表以參為驗以稽為決其數一二三四是也百官以此相齒以事為常以衣食為主蕃息畜藏老弱孤寡為意皆有以養民之理也凡此四名一人耳所自言之異冥宗契本謂之自然淳粹不雜謂之神妙嶷然不假謂之至極以自然為宗上德為本玄道為門觀於機兆隨物變化者謂之聖人己上四人只是一耳隨其功用故有四名也不離力智反下注不離離性下章離於同兆於本或作逃此四之粗迹而賢人君子之所服膺也布仁惠為恩澤施義理以裁非運節文為行首動樂音以和性慈照光乎九有仁風扇乎八方譬蘭蕙芳馨香氣薰於遐邇可謂賢矣為行下孟反章內同薰然許云反溫和貌崔云以慈仁為馨聞也之粗七奴反卷內皆同稽考也操執也法定其分名表其實操驗其行考決其能一二三四即名法等是也以參本又作操同七曹反宜也以稽音雞考也自堯舜已下置立百官用此四法更相齒次君臣物務遂以為常所謂彝倫也夫事之不可廢者耕織也聖人之不可廢者衣食也故國以民為本民以食為天是以蕃滋生息畜積藏儲者皆養民之法蕃息音煩畜敕六反又許六反藏如字又才浪反民理既然故聖賢不逆高山寺本無為意二字名字依趙諫議本改古之人其備乎配神明醇天地育萬物和天下澤及百姓明於本數係於末度六通四辟小大精粗其運無乎不在其明而在數度者舊法世傳之史尚多有之其在於詩書禮樂者鄒魯之士搢紳先生多能明之詩以道志書以道事禮以道行樂以道和易以道陰陽春秋以道名分其數散於天下而設於中國者百家之學時或稱而道之古之人即向之四名也養老哀弱矜孤恤寡五帝已下備有之焉配合也夫聖帝無心因循品物故能合神明之妙理同天地之精醇育宇內之黎元和域中之群有醇順倫反本數明故末度不離本數仁義也末度名法也夫聖心慈育恩覃黎庶故能明仁義以崇本係法名法以救末家世父曰天人神人至人聖人君子所從悟入不同而稽之名法度數以求養民之理則固不能離棄萬物以不與民生為緣故曰明本數係於末度莊子自明著書之旨而微發其意如此所以為備法也大則兩儀小則群物精則神智粗則形像通六合以遨遊法四時而變化隨機運動無所不在也四辟婢亦反本又作闢其在數度而可明者雖多有之已疏外也史者春秋尚書皆古史也數度者仁義名法等也古舊相傳顯明在世者史傳書籍尚多有之能明其迹耳豈所以迹哉鄒邑名也魯國號也搢笏也亦插也紳大帶也先生儒士也言仁義名法布在六經者鄒魯之地儒服之人能明之也鄒莊由反孔子父所封邑道達也通也夫詩道情志書道世事禮道心行樂道和適易明卦兆通達陰陽春秋褒貶定其名分道志音導下以道皆同名分扶問反皆道古人之陳迹耳尚復不能常稱六經之迹散在區中風教所覃不過華壤百家諸子依稀五德時復稱説不能大同也尚復扶又反下章不復同趙諫議本辟作闢度字依王叔岷説補天下大亂賢聖不明道德不一天下多得一察焉以自好譬如耳目鼻口皆有所明不能相通猶百家衆技也皆有所長時有所用雖然不該不遍一曲之士也判天地之美析萬物之理察古人之全寡能備於天地之美稱神明之容是故內聖外王之道暗而不明鬱而不發天下之人各為其所欲焉以自為方悲夫百家往而不反必不合矣後世之學者不幸不見天地之純古人之大體道術將為天下裂用其迹而無統故也執守陳迹故不升平能明其迹又未易也韜光晦迹未易以豉反百家穿鑿法教多端各信其偏見而不能都舉宇內學人各滯所執偏得一術豈能弘通得一偏得一術夫聖人統百姓之大情而因為之制故百姓寄情於所統而自忘其好惡故與一世而得淡漠焉亂則反之人恣其近好家用典法故國異政家殊俗不能恬淡虛忘而每運心思察隨其情好而為教方自好呼報反注及下同王念孫曰郭象斷天下多得一為句釋文曰得一偏得一術案天下多得一察焉以自好當作一句讀下文云天下之人各為其所欲焉以自為方句法正與此同一察謂察其一端而不知其全體下文云譬如耳目鼻口皆有所明不能相通即所謂一察也若以一字上屬為句察字下屬為句則文不成義矣俞樾曰郭注斷天下多得一為句釋文曰得一偏得一術王氏念孫謂天下多得一察焉以自好當作一句讀一察謂察其一端而不知其全體今案郭讀文不成義當從王讀惟以一察為察其一端義亦未安察當讀為際一際猶一邊也廣雅釋詁際邊並訓方是際與邊同義得其一際即得其一邊正不知全體之謂察際並從祭聲古音相同故得通用耳下文云不該不遍一曲之士也一際與一曲其義相近家世父曰一察謂察見其一端據之以為道而因而好之舊注以天下多得一為句誤好惡烏路反淡本又作淡徒暫反漠音莫夫目能視色不能聽聲鼻能聞香不能辨味各有所主故不能相通也所長不同不得常用夫六經五德百家諸書其於救世各有所長既未中道故時有所廢猶如鼻口有所不通也衆技其綺反故未足備任也雖復各有所長而未能該通周遍斯乃偏僻之士滯一之人非圓通合變者也不遍音遍各用其一曲故析判一曲之人各執偏僻雖著方術不能會道故分散兩儀淳和之美離析萬物虛通之理也況一曲者乎觀察古昔全德之人猶能備兩儀之亭毒稱神明之容貌況一曲之人乎稱神尺證反下章同全人難遇故也玄聖素王內也飛龍九五外也既而百家競起各私所見是非殽亂彼我紛紜遂使出處之道暗塞而不明鬱閉而不泄也心之所欲執而為之即此欲心而為方術一往逐物曾不反本欲求合理其可得也既乖物情深可悲歎大體各歸根抱一則天地之純也幸遇也天地之純無為也古人大體朴素也言後世之人屬斯澆季不見無為之道不遇淳朴之世裂分離也道術流弊遂各奮其方或以主物則物離性以從其上而性命喪矣裂分離也儒墨名法百家馳騖各私所見咸率己情道術紛紜更相倍譎遂使蒼生措心無所分離物性實此之由也慶藩案裂依字當作列説文列分解也易艮九二列其夤管子五輔篇曾子天圓篇瘞大袂列古分解字皆作列説文裂繒餘也義各不同今分列字皆作裂而列但為行列字矣哀矣如字本或作喪息浪反盧文弨曰今書作喪矣世德堂本百作有不侈於後世不靡於萬物不暉於數度以繩墨自矯而備世之急古之道術有在於是者墨翟禽滑釐聞其風而説之為之大過已之大循作為非樂命之曰節用生不歌死無服墨子泛愛兼利而非鬥其道不怒又好學而博不異不與先王同毀古之禮樂勤儉則瘁故不暉也侈奢也靡麗也暉明也教於後世不許奢華物我窮儉未綺麗既乖物性教法不行故於先王典禮不得顯明於世也不侈尺紙反又尺氏反不暉如字崔本作渾則瘁在醉反矯厲也矯厲也用仁義為繩墨以勉厲其志行也自矯居表反勤而儉則財有餘故急有備世急者謂陽九百六水火之災也勤儉節用儲積財物以備世之凶災急難也不復度衆所能也循順也古之道術禹治洪水勤儉枯稿其迹尚在故言有在於是者姓禽字滑釐墨翟弟子也墨翟循滑釐性好勤儉聞禹風教深悅愛之務為此道勤苦過甚適周己身自順未堪教被於人矣墨翟宋大夫尚儉素禽滑音骨又戶八反釐力之反又音熙禽滑釐墨翟弟子也不順五帝三王之樂嫌其奢而説音悅下注同後聞風而説皆同大過音太舊敕佐反後大過大多大少倣此大順順或作循慶藩案循或作順説文循順行也鄭注尚書中候曰循順書大傳三正若循連環白虎通義引此循作順順與循古同聲而通用也度衆徒各反非樂節用是墨子二篇書名也生不歌故非樂死無服故節用謂無衣衾棺槨等資葬之服言其窮儉惜費也非樂節用墨子二篇名夫物不足則以鬥為是今墨子令百姓皆勤儉各有餘故以鬥為非也普泛兼愛利益群生使各自足故無鬥爭以鬥爭為之非也泛芳劍反愛兼利化同己儉為泛愛兼利令百力呈反下同但自刻也克己勤儉故不怨怒於物也既自以為是則欲令萬物皆同乎己也墨子又好學博通墳典己既勤儉欲物同之也先王則恣其群異然後同焉皆得而不知所以得也嫌其侈靡禮則節文隆殺樂則鐘鼓羽毛嫌其侈靡奢華所以毀棄不用世德堂本循作順世德堂本故作而滑字依覆宋本改黃帝有咸池堯有大章舜有大韶禹有大夏湯有大濩文王有辟雍之樂武王周公作武古之喪禮貴賤有儀上下有等天子棺槨七重諸侯五重大夫三重士再重今墨子獨生不歌死不服桐棺三寸而無槨以為法式以此教人恐不愛人以此自行固不愛己未敗墨子道雖然歌而非歌哭而非哭樂而非樂是果類乎其生也勤其死也薄其道大觳使人憂使人悲其行難為也恐其不可以為聖人之道反天下之心天下不堪墨子雖獨能任奈天下何離於天下其去王也遠矣已上是五帝三王樂名也有夏戶雅反盧文弨曰今書作有大夏下有濩亦作有大濩有濩音護有辟音壁作武武樂名自天王已下至于士庶皆有儀法悉有等級斯古之禮也七重直龍反下同物皆以任力稱情為愛今以勤儉為法而為之大過雖欲饒天下更非所以為愛也師於禹迹勤儉過分上則乖於三王下則逆於萬民故生死勤窮不能養於外物形容枯稿未可愛於己身也但非道德未無也翟性尹老之意也未敗敗或作毀墨子是一家之正故不可以為敗也崔云未壞其道雖獨成墨而不類萬物之情夫生歌死哭人倫之常理凶哀吉樂世物之大情今乃反此故非徒類矣非歌生應歌而墨以歌為非也樂而音洛下及注同家世父曰墨子之意主於節用其非樂篇言厚措斂乎萬民以為大鍾鴳鼓琴瑟竽笙言今王公大人為樂虧奪民衣食之時虧奪民衣食之財其三篇言其樂逾繁其治逾寡莊子亦辨其非樂薄葬而歸本於節用言墨子之道所以未敗今之歌固非歌今之哭固非哭今之樂固非樂其與墨子之言果類乎果非類乎故以下但著其勤苦之實以明墨子之本旨觳無潤也觳無潤也生則勤苦身心死則資葬儉薄其為道乾觳無潤也觳郭苦角反徐戶角反郭李皆云無潤也家世父曰爾雅釋詁觳盡也管子地員篇淖而不韌剛而不觳其下土三十物又次曰五觳觳者薄也史記始皇本紀雖監門之養不觳於此矣言不薄於此也墨子之道自處以薄郭象注觳無潤也解似迂曲夫聖人之道悅以使民民得性之所樂則悅悅則天下無難矣夫聖人之道得百姓之歡心今乃使物憂悲行之難久又無潤澤故不可以教世也其行下孟反下注以成其行同王者必合天下之歡心而與物俱往也夫王天下者必須虛心忘己大順群生今乃毀皇王之法反黔首之性其於主物不亦遠乎能任音任趙諫議本未作末墨子稱道曰昔禹之湮洪水決江河而通四夷九州也名山三百支川三千小者無數禹親自操稿耜而九雜天下之川腓無胈脛無毛沐甚雨櫛疾風置萬國禹大聖也而形勞天下也如此使後世之墨者多以裘褐為衣以跂蹻為服日夜不休以自苦為極曰不能如此非禹之道也不足謂墨湮塞也昔堯遭洪水命禹治水填塞隄防通決川救百六之災以播種九穀也湮洪水音因又音煙塞也沒也掘地而注之海使水由地下也引禹之儉同己之道盧文弨曰舊儉訛險今改正俞樾曰名山當作名川字之誤也名川支川猶言大水小水下文曰禹親自操稿耜而九雜天下之川可見此文專以川言不當言山也若但言支川而不言名川則是舉流而遺其原於文為不備矣襄十一年左傳曰名山名川是山川並得言名學者多見名山鮮見名川故誤改之耳呂氏春秋始覽篇淮南子墬形篇並曰名川六百慶藩案名川大川也禮禮器因名山升中於天鄭注名猶大也高注淮南墬形篇亦曰名山大也王制言名山大川月令言大山名源其義一也魯語取名魚韋注名魚大魚也秦策賂之一名都高注名大也魏策大都數百名都數十也此皆訓名為大之證支川本或作支流橐盛土器也耜掘土具也禹捉耜掘地操橐負土躬自辛苦以導川原於是舟楫往來九州雜易又解古者字少以滌為蕩川為原凡經九度言九雜也又本作鳩者言鳩雜川谷以導江河也自操七曹反稿舊古考反崔郭音託字則應作橐崔云囊也司馬云盛土器也耜音似釋名耜似也似齒斷物三蒼云耒頭鐵也崔云捶也司馬云盛水器也而九音鳩本亦作鳩聚也雜本或作音同崔云所治非一故曰雜也家世父曰釋文九亦作鳩聚也雜本或作崔云所治非一故曰雜也玉篇雜同也廣韻雜集也書序決九州言雜匯諸川之水使同會於大川故曰九雜天下之川墨子徒見禹之形勞耳未睹其性之適也通導百川安置萬國聞啓之泣無暇暫看三過其門不得看子賴驟雨而灑髮假疾風而梳頭勤苦執勞形容毀悴遂使腓股無肉膝脛無毛禹之大聖尚自艱辛況我凡庸而不勤苦腓音肥又符畏反無胈步葛反又甫物反又符蓋反脛刑定反甚雨如字崔本甚作湛音淫盧文弨曰今書作沐甚風櫛疾雨此以甚雨在櫛字上當本是沐甚雨櫛疾風文義較順淮南修務篇云禹沐浴霪雨櫛扶風可以為證淮南浴字乃衍文李善注文選和王著作八公山詩引淮南作沐淫雨櫛疾風慶藩案崔本甚作湛是也湛與淫同論衡明雩篇久雨為湛湛即淫也太史公自序帝辛湛湎揚雄光祿勳針桀紂淫雨淫湛義同字亦相通考工記氏淫之以蜃杜子春云淫當為湛淮南修務篇正作禹沐淫雨禮檀弓門人後雨甚古書中少言甚雨者淮南覽冥篇東風而酒湛溢湛溢即淫溢謂酒得東風加長也春秋繁露同類相動篇水得夜長數分東風而酒湛溢皆其證櫛側筆反謂自苦為盡理之法裘褐粗衣也木曰跂草曰蹻也後世墨者翟之弟子也裘褐跂蹻儉也日夜不休力也用此自苦為理之妙極也裘褐戶葛反跂其逆反蹻紀略反李云麻曰屩木曰屐屐與跂同屩與蹻同一云鞋類也一音居玉反以藉鞋下也非其時而守其道所以為墨也墨者禹之陳迹也故不能苦勤乖於禹道者不可謂之墨也世德堂本昔下有者字趙諫議本山作川與俞説合世德堂本稿作闕誤引江南古藏本及李本雜俱作滌世德堂本風雨二字互易趙諫議本與釋文同字依考工記改相里勤之弟子五侯之徒南方之墨者苦獲已齒鄧陵子之屬俱誦墨經而倍譎不同相謂別墨以堅白同異之辨相訾以觭偶不仵之辭相應以巨子為聖人皆願為之尸冀得為其後世至今不決必其各守所見則所在無通故於墨之中又相與別也姓相里名勤南方之墨師也苦獲五侯之屬並是學墨人也譎異也俱誦墨經而更相倍異相呼為別墨相息亮反里勤司馬云墨師也姓相里名勤俞樾曰韓非子顯學篇有相里氏之墨有相夫氏之墨有陵氏之墨苦獲已齒李云二人姓字也而倍郭音佩又裴罪反譎古穴反崔云決也慶藩案倍譎諸書多作倍僪或作背譎呂氏春秋明理篇日有倍僪高注日旁之危氣也在兩旁反出為倍在上反出為僪淮南覽冥篇臣心乖則背譎見於天皆背鐍之借字漢書天文志暈適背穴孟康曰背形如北字也案吳語韋昭注北古之背字説文北乖也從二人相背則日兩旁氣外向者為背形與北相似故孟康云背如北穴讀作鐍其形如鐍也如淳曰凡氣在日上日為冠為戴在旁直對為珥在旁如半環向日為抱向外為背有氣刺日為鐍鐍抉傷也今案背鐍皆外向之名莊子蓋喻各泥一見二人相背耳以氣刺日為鐍失之巨子最能辨其所是以成其行訾毀也巨大也獨唱曰觭音奇對辨曰偶仵倫次也言鄧陵之徒蹈墨術堅執堅白各炫己能合異為同析同為異或獨唱而寡和或賓主而往來以有無是非之辨相毀用無倫次之辭相應勤儉甚者號為聖人相訾音紫以觭紀宜反又音寄不仵音誤徐音五仵同也巨子向崔本作巨向云墨家號其道理成者為巨子若儒家之碩儒尸者主也為欲係巨子之業也咸願為師主庶傳業將來對爭勝負不能決定也鄧字依諸子平議改玉字依漢書注改日上依漢書注改墨翟禽滑釐之意則是其行則非也將使後世之墨者必自苦以腓無胈脛無毛相進而已矣亂之上也治之下也雖然墨子真天下之好也將求之不得也雖枯稿不舍也才士也夫意在不侈靡而備世之急斯所以為是為之太過故也意在救物所以是也勤儉太過所以非也進過也後世學徒執墨陳迹精苦自勵意在過人也亂莫大於逆物而傷性也任衆適性為上今墨反之故為下墨子之道逆物傷性故是治化之下術荒亂之上首也治之直吏反為其真好重聖賢不逆也但不可以教人之好呼報反注同俞樾曰真天下之好謂其真好天下也即所謂墨子兼愛也下文曰將求之不得也雖枯稿不舍也此求字即心誠求之之求求之不得雖枯稿不舍即所謂摩頂放踵利天下為之也郭注未得為其于偽反無輩所以為真好也宇內好儉一人而已求其輩類竟不能得如此終不休廢率性真好非矯為也枯稿苦老反不舍也音捨下章同非有德也夫歎也逆物傷性誠非聖賢亦勤儉救世才能之士耳高山寺古鈔本好下有者字不纍於俗不飾於物不苟於人不忮於衆願天下之安寧以活民命人我之養畢足而止以此白心古之道術有在於是者宋鈃尹文聞其風而悅之作為華山之冠以自表接萬物以別宥為始語心之容命之曰心之行以聏合歡以調海內請欲置之以為主見侮不辱救民之鬥禁攻寢兵救世之戰以此周行天下上説下教雖天下不取強聒而不舍者也故曰上下見厭而強見也忮逆也於俗無患纍於物無矯飾於人無苟且於衆無逆忮立於名行以養蒼生也忮之豉反逆也司馬崔云害也字書云很也又音支韋昭音洎不敢望有餘也每願宇內清夷濟活黔首物我儉素止分知足以此教迹清白其心古術有在相傳不替矣白心崔云明白其心也白或作任姓宋名鈃姓尹名文並齊宣王時人同遊稷下宋著書一篇尹著書二篇咸師於黔首而為之名也性與教合故聞風悅愛宋鈃音形徐胡冷反郭音堅尹文崔云齊宣王時人著書一篇俞樾曰列子周穆王篇老成子學玄於尹文先生未知即其人否漢書藝文志尹文子一篇在名家師古曰劉向云與宋鈃俱遊稷下華山上下均平華山其形如削上下均平而宋尹立志清高故為冠以表德之異華山之冠華山上下均平作冠象之表己心均平也不欲令相犯錯宥區域也始本也置立名教應接人間而區別萬有用斯為本也以別彼列反又如字宥為始始首也崔云以別善惡宥不及也命名也發語吐辭每令心容萬物即名此容受而為心行強以其道聏令合調令和也聏崔本作音而郭音餌司馬云色厚貌崔郭王云和也和萬物物合則歡矣一云調也合歡以道化物和而調之合意則歡家世父曰以合歡諸本或作聏莊子闕誤引作胹説文肉部胹爛也方言胹孰也以胹合歡即軟孰之意太玄經其中其膝其哇司馬光集注字與軟同亦正此意闕誤作胹字者是也強以其丈反下皆同令合力呈反下同二子請得若此者立以為物主也聏和也用斯名教和調四海庶令同合以得歡心置立此人以為物主也其於以活民為急也所謂聏調寢息也防禁攻伐止息干戈意在調和不許戰鬥假令欺侮不以為辱意在救世所以然也聏調之理然也用斯教迹行化九州上説君王下教百姓雖復物不取用而強勸喧聒不自廢舍也上説音悅又如字下教上謂國主也悅上之教下也一云説猶教也上教教下也聒古活反謂強聒其耳而語之也所謂不辱雖復物皆厭賤猶自強見勸他所謂被人輕侮而不恥辱也見厭於豔反徐於贍反雖然其為人太多其自為太少曰請欲固置五升之飯足矣先生恐不得飽弟子雖飢不忘天下日夜不休曰我必得活哉圖傲乎救世之士哉曰君子不為苛察不以身假物以為無益於天下者明之不如已也以禁攻寢兵為外以情欲寡淺為內其小大精粗其行適至是而止不因其自化而強以慰之則其功太重也夫達道聖賢感而後應先存諸己後存諸人今乃勤強勸人被厭不已當身枯稿豈非自為太少乎為人于偽反下自為同斯明自為之太少也宋鈃尹文稱天下為先生自稱為弟子也宋尹稱黔首為先生自謂為弟子先物後己故也坦然之迹意在勤儉置五升之飯為一日之食唯恐百姓之飢不慮己身之餓不忘天下以此為心勤儉故養蒼生也用斯作法晝夜不息矣謂民當報己也揮斥高大之貌圖傲高大之貌也言其強力忍垢接濟黎元雖未合道可謂救世之人也圖傲五報反務寬恕也夫賢人君子恕己寬容終不用取捨之心苟且伺察於物也苛察音河一本作苟慶藩案苛一本作苟非也古書從句從可之字往往因隸變而訛苛作苟亦形似之誤也漢巴郡太守張納碑犴無拘紲之人拘作朐忍蠻夷朐作冀州從事郭君碑凋柯霜榮柯字作枸説文字解引酒誥曰盡執今本作拘考工記妢胡之笴注故書笴為笱杜子春云笱當作笴管子五輔篇上彌殘苛而無解舍苛今本訛作苟皆其明證必自出其力也立身求己不必假物以成名也所以為救世之士也已止也苦心勞形乖道逆物既無益於宇內明不如止而勿行為利他外行也為自利內行也未能經虛涉曠自利利他內外兩行雖復大小有異精粗稍殊而立趨維綱不過適是而已矣其行下孟反又如字必字依趙諫議本改公而不當易而無私決然無主趣物而不兩不顧於慮不謀於知於物無擇與之俱往古之道術有在於是者彭蒙田駢慎到聞其風而悅之齊萬物以為首曰天能覆之而不能載之地能載之而不能覆之大道能包之而不能辨之知萬物皆有所可有所不可故曰選則不遍教則不至道則無遺者矣各自任也公正而不阿黨平易而無偏私依理斷決無的主宰所謂法者其在於斯不當丁浪反崔本作黨云至公無黨也盧文弨曰作不黨是易而以豉反物得所趣故一意在理趣而於物無二也依理用法不顧前後斷決正直無所懼慮亦不運知法外謀謨守法而往酷而無擇於知音智下棄知同自五帝已來有以法為政術者故有可尚之迹而猶在乎世姓彭名蒙姓田名駢姓慎名到並齊之隱士俱遊稷下各著書數篇性與法合故聞風悅愛也俞樾曰據下文彭蒙當是田駢之師意林引尹文子有彭蒙曰雉兔在野衆皆逐之分未定也雞豕滿市莫有志者分定故也田駢薄田反齊人也遊稷下著書十五篇慎子云名廣俞樾曰漢書藝文志道家田子二十五篇名駢齊人遊稷下號天口駢呂覽不二篇陳駢貴齊即田駢也淮南人間篇唐子短陳駢子於齊威王云云即田駢之事實亦可見貴齊之一端矣都用乃周夫天覆地載各有所能大道包容未嘗辨説故知萬物有可不可隨其性分但當任之若欲揀選必不周遍也不遍音遍性其性乃至不至一本作不王物不同稟性各異以此教彼良非至極若率至玄道則物皆自得而無遺失矣無遺如字本又作貴趙諫議本當作黨駢字依漢書補是故慎到棄知去己而緣不得已泠汰於物以為道理曰知不知將薄知而後鄰傷之者也謑髁無任而笑天下之尚賢也縱脫無行而非天下之大聖椎拍輐斷與物宛轉舍是與非苟可以免不師知慮不知前後魏然而已矣推而後行曳而後往若飄風之還若羽之旋若磨石之隧全而無非動靜無過未嘗有罪是何故夫無知之物無建己之患無用知之纍動靜不離於理是以終身無譽故曰至於若無知之物而已無用賢聖夫塊不失道豪桀相與笑之曰慎到之道非生人之行而至死人之理適得怪焉泠汰猶聽放也泠汰猶揀鍊也息慮棄知忘身去己機不得已感而後應揀鍊是非據法斷決慎到守此用為道理俞樾曰史記孟荀列傳慎到趙人著十二論漢書藝文志法家有慎子四十二篇名到先申韓申韓稱之去己起呂反章內注同泠音零汰音泰徐徒蓋反郭云泠汰猶聽放也一云泠汰猶沙汰也謂沙汰使之泠然也皆泠汰之歸於一以此為道理也或音裔又音替謂知力淺不知任其自然故薄之而鄰傷鄰近也夫知則有所不知故薄淺其知雖復薄知而未能都忘故猶近傷於理不肯當其任而任夫衆人衆人各自能則無為橫復尚賢也謑髁不定貌也隨物順情無的任用物各自得不尚賢能故笑之也謑胡啓反又音奚又苦迷反説文云恥也五米反髁戶寡反郭勘禍反謑髁訛倪不正貌王云謂謹刻也家世父曰説文謑詬恥也謑一作賈誼治安策詬無節髁髀骨也髁通作跨廣韻跨同踝釋名踝確也居足兩旁磽確然也亦因其形踝踝然也謑髁謂堅確能忍恥辱釋文謑髁訛倪不正貌王云謹刻也均未免望文生義無任無所施任也王云雖謹刻於法而猶能不自任以事事不與衆共之則無為尚賢所以笑也橫復扶又反欲壞其迹使物不殉縱恣脫略不為仁義之德行忘遺陳迹故非宇內之聖人也無行下孟反下人之行同法家雖妙猶有椎拍故未泯合椎拍笞撻也輐斷行刑也宛轉變化也復能打拍刑戮而隨順時代故能與物變化而不固執之者也椎直追反拍普百反輐五管反又胡亂反又五亂反徐胡管反圓也斷丁管反又丁亂反方也王云椎拍輐斷皆刑截者所用家世父曰釋文輐圓也王云椎拍輐斷皆刑截者所用疑王説非也輐斷即下文斷郭象云斷無圭角也説文椎擊也拍拊也言擊拊之而已不用攻刺斷之而已不用鋒稜所以處制事物而與為宛轉也不固執是非苟且免於當世之為也不能知是之與非前之與後睧目恣性苟免當時之患也不師其成心不運用知慮亦不瞻前顧後性情直舉弘綱順物而已不師知音智任性獨立魏然不動之貌也雖復處俗同塵而魏然獨立也魏然魚威反李五回反所謂緣於不得已推而曳之緣不得已感而後應非先唱也磨磑也隧轉也如飄風之回如落羽之旋若磑石之轉三者無心故能全得是以無是無非無罪無過無情任物故致然也若飄婢遙反一音必遙反爾雅云回風為飄之還音旋一音環若磨末佐反又如字石之隧音遂回也徐絶句一讀至全字絶句全而無非磨石所剴粗細全在人言德全無見非責時言其無心也假設疑問以顯其能患生於譽譽生於有建夫物莫不耽滯身己建立功名運用心知沒溺前境今磨磑等行藏任物動靜無心恆居妙理患纍斯絶是以終於天命無咎無譽也不離力智反唯聖人然後能去知與故循天之理故愚知處宜貴賤當位賢不肖襲情而云無用聖賢所以為不知道也欲令去知如土塊也亦為凡物云云皆無緣得道道非遍物也貴尚無知情同瓦石無用賢聖暗若夜遊遂如土塊名為得理慎到之惑其例如斯夫塊苦對反或苦猥反欲令力呈反夫去知任性然後神明洞照所以為賢聖也而云土塊乃不失道人若土塊非死如何豪桀所以笑也夫得道賢聖照物無心德合二儀明齊三景今乃以土塊為道與死何殊既無神用非生人之行也是以英儒贍聞玄通豪桀知其乖理故嗤笑之未合至道故為詭怪不合至道者適為其怪也古鈔卷子本聖下有也字又焉二字依世德堂本改確也等五字依釋名原文補田駢亦然學於彭蒙得不教焉彭蒙之師曰古之道人至於莫之是莫之非而已矣其風窢然惡可而言常反人不見觀而不免於鯇斷其所謂道非道而所言之韙不免於非彭蒙田駢慎到不知道雖然概乎皆嘗有聞者也得自任之道也田駢慎到稟業彭蒙縱任放誕無所教也所謂齊萬物以為首逆風所動之聲窢然迅速貌也古者道人虛懷忘我指為天地無復是非風教窢然隨時過去何可留其聖迹執而言之也窢字亦作罭又作閾況逼反又火麥反向郭云逆風聲惡可音烏不順民望未能大順群品而每逆忤人心亦不能致蒼生之稱其瞻望也不見觀一本作不聚觀雖立法而鯇斷無圭角也鯇斷無圭角貌也雖復立法施化而未能大齊萬物故不免於鯇斷也於鯇五管反又五亂反斷丁管反郭云鯇斷無圭角也一本無斷字韙是也韙是也慎到所謂為道者非正道也所言為是者不是也故不免於非也韙于鬼反是也道無所不在而云土塊乃不失道所以為不知雖復習尚虛忘以無心為道而未得圓照故不知也但不至也彭蒙之類雖未體真而志尚無知略有梗概更相師祖皆有稟承非獨臆斷故嘗有聞之也概乎古愛反趙諫議本見作聚以本為精以物為粗以有積為不足淡然獨與神明居古之道術有在於是者關尹老聃聞其風而悅之建之以常無有主之以太一以濡弱謙下為表以空虛不毀萬物為實本無也物有也用無為妙道為精用有為事物為粗寄之天下乃有餘也貪而儲積心常不足知足止分故清廉虛淡絶待獨立而精神道無不在自古有之也淡然徒暫反姓尹名熹字公度周平王時函谷關令故之關尹也姓李名耳字伯陽外字老聃即尹熹之師老子也師資唱和與理相應故聞無為之風而悅愛之也關尹關令尹喜也或云尹喜字公度老聃他甘反即老子也為喜著書十九篇俞樾曰漢書藝文志道家有關尹子九篇注云名喜為關吏或以尹喜為姓名失之又按釋文云老子為喜著書十九篇考老子一書漢志有鄰氏經傳四篇傅氏經説三十七篇徐氏經説六篇未聞有十九篇之説呂覽不二篇關尹貴清高注關尹關正也名喜作道書九篇能相風角知將有神人而老子到喜説之請著上至經五千言上至經之名他書所未見也夫無有何所能建建之以常無有則明有物之自建也自天地以及群物皆各自得而已不兼他飾斯非主之以太一耶太者廣大之名一以不二為稱言大道曠蕩無不制圍括囊萬有通而為一故謂之太一也建立言教每以凝常無物為宗悟其指歸以虛通太一為主斯蓋好儉以勞形質未可以教他人亦無勞敗其道術也表外也以柔弱謙和為權智外行以空惠圓明為實智內德也以濡如兗反一音儒謙下遐嫁反關尹曰在己無居形物自著其動若水其靜若鏡其應若響芴乎若亡寂乎若清同焉者和得焉者失未嘗先人而常隨人物來則應應而不藏故功隨物去成功弗居推功於物用此在己而修其身也不自是而委萬物故物形各自彰著委任萬物不伐其功故彼之形性各自彰著也常無情也動若水流靜如懸鏡其逗機也似響應聲動靜無心神用故速若響許丈反常全者不知所得也芴忽也亡無也夫道非有非無不清不濁故暗忽似無體非無也靜寂如清也是已同靡清濁和蒼生之淺見也遂以此清虛無為而為德者斯喪道矣芴音忽和而不唱也老聃曰知其雄守其雌為天下溪知其白守其辱為天下谷人皆取先己獨取後曰受天下之垢人皆取實己獨取虛無藏也故有餘巋然而有餘其行身也徐而不費無為也而笑巧人皆求福己獨曲全曰苟免於咎以深為根以約為紀曰堅則毀矣鋭則挫矣常寬容於物不削於人可謂至極物各自守其分則靜默而已無雄白也夫雄白者非尚勝自顯者耶尚勝自顯豈非逐知過分以殆其生耶故古人不隨無崖之知守其分內而已故其性全其性全然後能及天下能及天下然後歸之如溪谷也夫英雄俊傑進躁所以夭年雌柔謙下退靜所以長久是以去彼顯白之榮華取此韜光之屈辱斯乃學道之樞機故為宇內之溪谷也而溪谷俱是川壑但溪小而谷大故重言耳溪苦兮反不與萬物爭鋒然後天下樂推而不厭故後其身俗人皆尚勝趨先大聖獨謙卑處後故道經云後其身而身先故也雌辱後下之類皆物之所謂垢退身居後推物在先斯受垢辱之者之垢音苟唯知有之以為利未知無之以為用貪資貨也守沖泊以待群實守沖寂也沖泊步各反付萬物使各自守故不患其少藏積也知足守分散而不積故有餘獨立自足之謂巋然獨立之謂也言清廉潔己在物至稀獨有聖人無心而已巋去軌反又去類反本或作魏因民所利而行之隨四時而成之常與道理俱故無疾無費也費損也夫達道之人無近恩惠食苟簡之田立不貸之圃從容間雅終不損己為於物耳以此為行而養其身也不費芳味反巧者有為以傷神器之自成故無為者因其自生任其自成萬物各得自為蜘蛛猶能結網則人人自有所能矣無貴於工倕也率性而動淳朴無為嗤彼俗人機心巧偽也蜘音知蛛音誅工倕音垂委順至理則常全故無所求福福已足隨物故物不得咎也咎禍也俗人愚迷所為封執但知求福不能慮禍唯大聖虛懷委曲隨物保全生道且免災殃根於大初之極不可謂之淺也大初音泰去甚泰也以深玄為德之本根以儉約為行之綱紀去甚起呂反夫至順則雖金石無堅也忤逆則雖水氣無軟也至順則全忤逆則毀斯正理也忤逆五故反無軟如兗反本或作濡音同盧文弨曰今書作無耎進躁無崖為鋭毀損堅剛之行挫止貪鋭之心故道經云挫其鋭挫作臥反各守其分則自容有餘全其性也退己謙和故寬容於物知足守分故不侵削於人也高山寺本無容字高山寺本作雖未闕誤同云江南古藏本及文李二本俱作可謂至極趙諫議本無也字埋字依宋本改世德堂本軟作耎關尹老聃乎古之博大真人哉關尹老子古之大聖窮微極妙冥真合道教則浩蕩而弘博理則廣大而深玄莊子庶幾故有斯嘆也芴漠無形變化無常死與生與天地並與神明往與芒乎何之忽乎何適萬物畢羅莫足以歸古之道術有在於是者莊周聞其風而悅之以謬悠之説荒唐之言無端崖之辭時恣縱而不儻不以觭見之也以天下為沈濁不可與莊語以卮言為曼衍以重言為真以寓言為廣獨與天地精神往來而不敖倪於萬物不譴是非以與世俗處其書雖瑰瑋而連犿無傷也其辭雖參差而諔詭可觀彼其充實不可以已上與造物者遊而下與外死生無終始者為友其於本也弘大而辟深閎而肆其於宗也可謂稠適而上遂矣雖然其應於化而解於物也其理不竭其來不蛻芒乎昧乎未之盡者隨物也妙本無形故寂漠也迹隨物化故無常也芴元嘉本作寂漠音莫任化也以死生為晝夜故將二儀並也隨造化而轉變故共神明往矣死與音餘下同無意趣也委自然而變化隨芒忽而遨遊既無情於去取亦任命而之適芒乎莫剛反下同故都任置包羅庶物囊括宇內未嘗離道何處歸根不急欲使物見其意謬虛也悠遠也荒唐廣也恣縱猶放任也觭不偶也而莊子應世挺生冥契玄道故能致虛遠深弘之説無涯無緒之談隨時放任而不偏黨和氣混俗未嘗觭介也謬悠謂若忘於情實者也荒唐謂廣大無域畔者也慶藩案無端崖猶無垠鄂也淮南原道篇無垠鄂之門許注垠鄂鍔案引注鄂誤鍔云端崖也見文選張衡西京賦注高注無形狀也説文土部垠地垠也楚辭王注垠岸崖也文選甘泉賦李善注垠堮也而儻丁蕩反徐敕蕩反盧文弨曰今書時恣縱而不儻有不字觭音羈徐起宜反纍於形名以莊語為狂而不信故不與也莊語猶大言也宇內黔黎沈滯暗濁咸溺於小辨未可與説大言也莊語並如字郭云莊莊周也一云莊端正也一本作壯側亮反端大也慶藩案莊壯古音義通用逸周書諡法篇兵甲亟作曰莊睿圉克服曰莊勝敵志強曰莊死於原野曰莊屢征殺伐曰莊莊之言壯也楚辭遠遊精粹而始壯與行鄉陽為韻詩鄘風君子偕老箋顏色之莊釋文莊本又作壯禮檀弓衛有太史曰柳莊漢書古今人表作柳壯天下不可與莊語釋文壯一本作壯皆其明證卮言不定也曼衍無心也重尊老也寓寄也夫卮滿則傾卮空則仰故以卮器以況至言而耆艾之談體多真實寄之他人其理深廣則鴻蒙雲將海若之徒是也以卮音支其言通至理正當萬物之性命敖倪猶驕矜也抱真精之智運不測之神寄迹域中生來死往謙和順物固不驕矜不敖五報反倪音詣己無是非故恣物行不譴遣戰反形群於物譴責也是非無主不可窮責故能混世揚波處於塵俗也還與物合故無傷也瑰瑋弘壯也連犿和混也莊子之書其旨高遠言猶涉俗故合物而無傷瑰古回反瑋瑰瑋奇特也連本亦作抃同芳袁反又音獾又敷晚反李云皆宛轉貌一云相從之貌謂與物相從不違故無傷也不唯應當時之務故參差參差者或虛或實不一其言也諔詭猶滑稽也雖寓言託事時代參差而諔詭滑稽甚可觀閲也參初林反注同差初宜反諔尺叔反多所有也已止也彼所著書辭清理遠括囊無實富贍無窮故不止極也乘變化而遨遊交自然而為友故能混同生死冥一始終本妙迹粗故言上下闢開也弘大也閎亦大也肆申也遂達也言至本深大申暢開通真宗調適上達玄道也而辟婢亦反深閎音宏稠適稠音調本亦作調言此莊書雖復諔詭而應機變化解釋物情莫之先也蛻脫捨也妙理虛玄應無窮竭而機來感己終不蛻而捨之也不蛻音悅徐始鋭反又敕外反莊子通以平意説己與説他人無異也案其辭明為汪汪然禹昌言亦何嫌乎此也芒昧猶窈冥也言莊子之書窈窕深遠芒昧恍忽視聽無辨若以言象徵求未窮其趣也汪汪烏黃反趙諫議本芴作寂趙本儻作黨趙本稠作調端字依世德堂本及釋文原本移上而字依世德堂本改拜字依世德堂本改惠施多方其書五車其道舛駁其言也不中曆物之意曰至大無外謂之大一至小無內謂之小一無厚不可積也其大千里天與地卑山與澤平日方中方睨物方生方死大同而與小同異此之謂小同異萬物畢同畢異此之謂大同異南方無窮而有窮今日適越而昔來連環可解也我知天下之中央燕之北越之南是也泛愛萬物天地一體也舛差殊也駁雜揉也既多方術書有五車道理殊雜而不純言辭雖辨而無當也惠施施惠子名五車尺蛇反又音居舛川兗反徐尺允反駁邦角反慶藩案司馬作踳駁文選左太沖魏都賦注引司馬云踳讀曰舛舛乖也駁色雜不同也釋文闕藩又案舛駁當作踳駁又引司馬此注作踳馳淮南俶真篇二者代謝舛馳説山篇分流舛馳玉篇引作馳泛論篇見聞舛馳於外法言敘曰諸子各以其知舛馳是其證舛踳字異而義同不中丁仲反心遊萬物曆覽辨之曆古歷字本亦作歷物之意分別歷説之囊括無外謂之大也入於無間謂之小也雖復大小異名理歸無二故曰一也至大無外謂之大一至小無內謂之小一司馬云無外不可一無內不可分故謂之一也天下所謂大小皆非形所謂一二非至名也至形無形至名無名理既精微搏之不得妙絶形色何厚之有故不可積而纍之也非但不有亦乃不無有無相生故大千里也無厚不可積也其大千里司馬云物言形為有形之外為無無形與有相為表裏故形物之厚盡於無厚無厚與有同一體也其有厚大者其無厚亦大高因廣立有因無積則其可積因不可積者苟其可積何但千里乎夫物情見者則天高而地卑山崇而澤下今以道觀之則山澤均平天地一致矣齊物云莫大於秋豪而泰山為小即其義也天與地卑如字又音婢山與澤平李云以地比天則地卑於天若宇宙之高則天地皆卑天地皆卑則山與澤平矣睨側視也居西者呼為中處東者呼為側則無中側也猶生死也生者以死為死死者以生為死日既中側不殊物亦死生無異也日方中方睨音詣物方生方死李云睨側視也謂日方中而景已復昃謂景方昃而光已復沒謂光方沒而明已復升凡中昃之與升沒若轉樞循環自相與為前後始終無別則存亡死生與之何殊也物情分別見有同異此小同異也死生交謝寒暑遞遷形性不同體理無異此大同異也大同而與小同異此之謂小同異萬物畢同畢異此之謂大同異同體異分故曰小同異死生禍福寒暑晝夜動靜變化衆辨莫同異之至也衆異同於一物同之至也則萬物之同異一矣若堅白無不合無不離也若火含陰水含陽火中之陰異於水水中之陽異於火然則水異於水火異於火至異異所同至同同所異故曰大同異知四方無窮會有物也形不盡形色不盡色形與色相盡也知不窮知物不窮物窮與物相盡也只為無厚故不可積也獨言南方舉一隅三可知也南方無窮而有窮司馬云四方無窮也李云四方無窮故無四方上下皆不能處其窮會有窮耳一云知四方之無窮是以無無窮無窮也形不盡形色不盡色形與色相盡也知不窮知物不窮物知與物相盡也獨言南方舉一隅也夫以今望昔所以有今以昔望今所以有昔而今自非今何能有昔昔自非昔豈有今哉既其無昔無今故曰今日適越而昔來可也今日適越而昔來智之適物物之適智形有所止智有所行智有所守形有所從故形智往來相為逆旅也鑒以鑒影而鑒亦有影兩鑒相鑒則重影無窮萬物入於一智而智無間萬物入於一物而物無天在心中則身在天外心在天內則天在心外也遠而思親者往也病而思親者來也智在物為物物在智為智司馬云彼日猶此日則見此猶見彼也彼猶此見則吳與越人交相見矣盧文弨曰今書作眹案與瞬同眹訓目精義皆不合似當作朕兆之朕夫環之相貫貫於空處不貫於環也是以兩環貫空不相涉入各自通轉故可解者也連環可解也司馬云夫物盡於形形盡之外則非物也連環所貫貫於無環非貫於環也若兩環不相貫則雖連環故可解也夫燕越二邦相去迢遞人情封執各是其方故燕北越南可為天中者也我知天之中央燕之北越之南是也司馬云燕之去越有數而南北之遠無窮由無窮觀有數則燕越之間未始有分也天下無方故所在為中循環無端故所在為始也萬物與我為一故泛愛之二儀與我並生故同體也泛芳劍反愛萬物天地一體也李云日月可觀而目不可見愛出於身而所愛在物天地為首足萬物為五藏故肝膽之別合於一人一人之別合於一體也高山寺本無也字趙諫議本曆作歷世德堂本無下字惠施以此為大觀於天下而曉辨者天下之辨者相與樂之卵有毛雞三足郢有天下犬可以為羊馬有卵丁子有尾火不熱山出口輪不蹍地目不見指不至至不絶龜長於蛇矩不方規不可以為圓鑿不圍枘飛鳥之景未嘗動也鏃矢之疾而有不行不止之時狗非犬黃馬驪牛三白狗黑孤駒未嘗有母一尺之捶日取其半萬世不竭辨者以此與惠施相應終身無窮惠施用斯道理自以為最觀照天下曉示辨人也為大觀古亂反於天下所謂自以為最也曉辨字林云辨慧也愛好既同情性相感故域中辨士樂而學之也樂之音洛有無二名咸歸虛寂俗情執見謂卵無毛名謂既空有毛可也卵有毛司馬云胎卵之生必有毛羽雞伏鵠卵卵不為雞則生類於鵠也毛氣成毛羽氣成羽雖胎卵未生而毛羽之性已著矣故鳶肩蜂目寄感之分也龍顏虎喙威靈之氣也神以引明氣以成質質之所剋如戶牖明暗之懸以晝夜性相近習相遠則性之明遠有習於生盧文弨曰遠舊作逮今書作遠從之慶藩案荀子不苟篇楊注引司馬云胎卵之生必有毛羽雞伏鵠卵卵不為雞則生類於鵠也毛氣成毛羽氣成羽雖胎卵未生而毛羽之性已著矣故曰卵有毛也視釋文為略數之所起自虛從無從無適有三名斯立是知二三竟無實體故雞之二足可名為三雞足既然在物可見者也雞三足司馬云雞兩足所以行而非動也故行由足發動由神御今雞雖兩足須神而行故曰三足也郢楚都也在江陵北七十里夫物之所居皆有四方是以燕北越南可謂天中故楚都於郢地方千里何妨即天下者耶郢有天下郢楚都也在江陵北七十里李云九州之內於宇宙之中未萬中之一分也故舉天下者以喻盡而名大夫非大若各指其所有而言其未足雖郢方千里亦可有天下也名無得物之功物無應名之實名實不定可呼犬為羊鄭人謂玉未理者為璞周人謂鼠未臘者亦曰璞故形在於物名在於人也犬可以為羊司馬云名以名物而非物也犬羊之名非犬羊也非羊可以名為羊則犬可以名羊鄭人謂玉未理者曰璞周人謂鼠未臘者亦曰璞故形在於物名在於人夫胎卵濕化人情分別以道觀者未始不同鳥卵既有毛獸胎何妨名卵也馬有卵李云形之所託名之所寄皆假耳非真也故犬羊無定名胎卵無定形故鳥可以有胎馬可以有卵也一云小異者大同犬羊之與胎卵無分於鳥馬也楚人呼蝦蟆為丁子也夫蝦蟆無尾天下共知此蓋物情非關至理以道觀之者無體非無非無尚得稱無何妨非有可名尾也丁子有尾李云夫萬物無定形形無定稱在上為首在下為尾世人右行曲波為尾今丁子二字雖左行曲波亦是尾也火熱水冷起自物情據理觀之非冷非熱何者南方有食火之獸聖人則入水不濡以此而言固非冷熱也又譬杖加於體而痛發於人人痛杖不痛亦猶火加體而熱發於人人熱火不熱也火不熱司馬云木生於水火生於木木以水潤火以木光金寒於水而熱於火而寒熱相兼無窮水火之性有盡謂火熱水寒是偏舉也偏舉則水熱火寒可也一云猶金木加於人有楚痛楚痛發於人而金木非楚痛也如處火之鳥火生之蟲則火不熱也盧文弨曰舊處火作處水訛今改正山本無名山名出自人口在山既爾萬法皆然也山出口司馬云形聲氣色合而成物律呂以聲兼形玄黃以色兼質呼於一山一山皆應一山之聲入於耳形與聲並行是山猶有口也夫車之運動輪轉不停前迹已過後塗未至卻前後更無蹍時是以輪雖運行竟不蹍於地也猶肇論云旋風偃嶽而常靜江河競注而不流野馬飄鼓而不動日月歷天而不周復何怪哉復何怪哉輪不蹍本又作跈女展反地司馬云地平輪圓則輪之所行者迹也夫目之見物必待於緣緣既體空故知目不能見之者也目不見司馬云水中視魚必先見水光中視物必先見光魚之濡鱗非曝鱗異於曝鱗則視濡也光之曜形異於不曜則視見於曜形非見形也目不夜見非暗晝見非明有假也所以見者明也目不假光而後明無以見光故目之於物未嘗有見也夫以指指物而非指故指不至也而自指得物故至不絶者也指不至至不絶司馬云夫指之取物不能自至要假物故至也然假物由指不絶也一云指之取火以鉗刺鼠以錐故假於物指是不至也夫長短相形則無長無短謂蛇長龜短乃是物之滯情今欲遣此昏迷故云龜長於蛇也龜長於蛇司馬云蛇形雖長而命不久龜形雖短而命甚長俞樾曰此即莫大於秋豪之末而大山為小之意司馬云蛇形雖長而命不久龜形雖短而命甚長則不以形言而以壽言真為龜長蛇短矣殊非其旨夫規圓矩方其來久矣而名謂不定方圓無實故不可也矩不方規不可以為圓司馬云矩雖為方而非方規雖為圓而非圓譬繩為直而非直也鑿者孔也枘者內孔中之木也然枘入鑿中木穿空處不關涉故不能圍此猶連環可解義也鑿曹報反不圍枘如鋭反司馬云鑿枘異質合為一形鑿積於枘則鑿枘異圍鑒枘異圍是不相圍也過去已滅未來未至過未之外更無飛時唯鳥與影嶷然不動是知世間即體皆寂故肇論云然則四象風馳璇璣電卷得意豪微雖遷不轉所謂物不遷者也飛鳥之景音影未嘗動也司馬云鳥之蔽光猶魚之蔽水魚動蔽水而水不動鳥動影生影生光亡亡非往生非來墨子曰影不徙也鏃矢專也夫機發雖速不離三時無異輪行何殊鳥影輪既不蹍不動鏃矢豈有止有行亦如利刀割三條絲其中亦有過去未來見在之者也鏃子木反郭音族徐朱角反三蒼云矢鏑也慶藩案鏃郭音族非也鏃為字之誤侯隸書作字形相似故鍭矢之字多誤為鏃亦多誤為錐隹字隸書作亦因形似而誤見淮南兵略篇疾如錐矢齊策亦誤作錐矢高注以錐矢為小矢非爾雅金鏃翦羽謂之説文同方言曰箭江淮之間謂之鍭大雅四既均周官司弓矢曰殺矢鍭矢考工記矢人曰鍭矢三分鍭字亦作翭士喪禮曰翭矢一乘故知鏃為鍭之誤也鶡冠子世兵篇發如鏃矢鏃本或作亦當以從鍭為是矢之疾而有不行不止之時司馬云形分止勢分行形分明者行遲勢分明者行疾目明無形分無所止則其疾無間矢疾而有間者中有止也質薄而可離中有無及者也狗之與犬一物兩名名字既空故狗非犬也狗犬同實異名名實合則彼謂狗此謂犬也名實離則彼謂狗異於犬也墨子曰狗犬也然狗非犬也狗非犬司馬云狗犬同實異名名實合則彼所謂狗此所謂犬也名實離則彼所謂狗異於犬也夫形非色色乃非形故一馬一牛以之為二添馬之色而可成三曰黃馬曰驪牛曰黃驪形為三也亦猶一與言為二二與一為三者也黃馬驪力智反又音梨牛三司馬云牛馬以二為三曰牛曰馬曰牛馬形之三也曰黃曰驪曰黃驪色之三也曰黃馬曰驪牛曰黃馬驪牛形與色為三也故曰一與言為二二與一為三也慶藩案文選劉孝標廣絶交論注引司馬云牛馬以二為三兼與別也曰馬曰牛形之三也曰黃曰驪色之三也曰黃馬曰驪牛形與色之三也與釋文小異夫名謂不實形色皆空欲反執情故指白為黑也白狗黑司馬云狗之目眇謂之眇狗狗之目大不曰大狗此乃一是一非然則白狗黑目亦可為黑狗捶杖也取折也問曰一尺之杖今朝折半逮乎後夕五寸存焉兩日之間捶當窮盡此事顯著豈不竭之義乎答曰夫名以應體體以應名故以名求物物不能隱也是以執名責實名曰尺捶每於尺取何有窮時若於五寸折之便虧名理乃曰半尺豈是一尺之義耶孤駒未嘗有母李云駒生有母言孤則無母孤稱立則母名去也母嘗為駒之母故孤駒未嘗有母也本亦無此句一尺一本無一字之捶章反日取其半萬世不竭司馬云捶杖也若其可析則常有兩若其不可析其一常存故曰萬世不竭世德堂本捶作捶桓團公孫龍辨者之徒飾人之心易人之意能勝人之口不能服人之心辨者之囿也惠施日以其知與人之辨特與天下之辨者為怪此其柢也姓桓名團姓公孫名龍並趙人皆辨士也客遊平原君之家而公孫龍著守白論見行於世用此上來尺捶言更相應和以斯卒歲無復窮已桓團李云人姓名徐徒丸反縱茲玄辨雕飾人心用此雅辭改易人意辨過於物故能勝人之口言未當理故不服人之心而辨者之徒用為苑囿又解囿域也惠施之言未冥於理所詮限域莫出於斯者也之囿音又特獨也字亦有作將者怪異也柢體也惠子日用分別之知共人評之獨將一己與天地殊異雖復姦狡萬端而本體莫過於此俞樾曰與人之辨義不可通蓋涉下句天下之辨者而衍之字柢與氐通史記秦始皇紀大氐盡畔秦吏正義曰氐猶略也此其柢也猶云此其略也上文卵有毛雞三足以下皆是其柢丁計反支偉成本無之字與俞説合然惠施之口談自以為最賢曰天地其壯乎施存雄而無術南方有倚人焉曰黃繚問天地所以不墜不陷風雨雷霆之故惠施不辭而應不慮而對遍為萬物説説而不休多而無已猶以為寡益之以怪以反人為實而欲以勝人為名是以與衆不適也弱於德強於物其塗隩矣由天地之道觀惠施之能其猶一一虻之勞者也其於物也何庸夫充一尚可曰愈貴道幾矣惠施不能以此自寧散於萬物而不厭卒以善辨為名惜乎惠施之才駘蕩而不得逐萬物而不反是窮響以聲形與影競走也悲夫然猶如此也言惠施解理亞乎莊生加之口談最賢於衆豈似諸人直辨而已壯大也術道也言天地與我並生不足稱大意在雄俊超世過人既不謙柔故無真道而言其壯者猶獨壯也天地其壯乎司馬云惠施唯以天地為壯於己也施存雄而無術司馬云意在勝人而無道理之術住在南方姓黃名繚不偶於俗羈異於人遊方之外賢士者也聞惠施聰辨故來致問問二儀長久風雨雷霆動靜所發起何端緒倚人本或作畸同紀宜反李云異也慶藩案倚當為奇倚人異人也王逸注九章云異也倚從奇聲故古字倚與奇通也易説卦傳參天兩地而倚數蜀才本倚作奇春官大祝奇杜子春曰奇讀為倚僖三十三年穀梁傳匹馬倚輪無反者釋文倚居宜反即奇輪也字或作畸荀子天論篇墨子有見於齊無見於畸楊注畸謂不齊也不齊即異之義也大宗師篇敢問畸人李頤曰畸奇異也黃繚音了李而小反云賢人也不墜直類反霆音廷又音挺意氣雄俊言辨縱橫是以未辭謝而應機不思慮而對答者也遍為陳説萬物根由並辨二儀雷霆之故不知休止猶嫌簡約故加奇怪以騁其能者也遍為音遍下于偽反以反人情曰為實道每欲超勝群物出衆為心意在聲名故不能和適於世者也塗道也德術甚弱化物極強自言道理異常深隩也隩烏報反李云深也謂其道深由從也庸用也從二儀生成之道觀惠施化物之能無異乎虻飛空鼓翅喧擾徒自勞倦曾何足云物之言便成無用者也一音文一虻孟庚反幾近也夫惠施之辨詮理不弘於萬物之中尚可充一數而已而欲鋭情貴道飾意近真榷而論之良未可也愈貴羊主反李云自謂所慕愈貴近於道也卒終也不能用此玄道以自安寧而乃散亂精神高談萬物竟無道存目擊卒有辨者之名耳昔吾未覽莊子嘗聞論者爭夫尺捶連環之意而皆云莊生之言遂以莊生為辨者之流案此篇較評諸子至於此章則曰其道舛駁其言不中乃知道聽塗説之傷實也吾意亦謂無經國體致真所謂無用之談也然膏之子均之戲豫或倦於典言而能辨名析理以宣其氣以係其思流於後世使性不邪淫不猶賢於博奕者乎故存而不論以貽好事也駘放也痛惜惠施有才無道放蕩辭辨不得真原馳逐萬物之末不能反歸於妙本夫得理莫若忘知反本無過息辨今惠子役心術以求道縱河瀉以索真亦何異乎欲逃響以振聲將避影而疾走者也洪才若此深可悲傷也駘李音殆蕩駘者放也放蕩不得也慶藩案文選謝元暉直中書省詩注引司馬云駘蕩猶放散也釋文闕悲夫音符論者力困反較音角評音病不中丁仲反或倦本亦作同其思息嗣反不邪似嗟反好事呼報反子玄之注論其大體真可謂得莊生之旨矣郭生前歎膏粱之塗説余亦晚睹貴遊之妄談斯所謂異代同風何可復言也或曰莊惠標濠梁之契發郢匠之模而云其書五車其言不中何也豈契若郢匠褒同寢斤而相非之言如此之甚者也答曰夫不失欲極有教之肆神明其言者豈得不善其辭而盡其喻乎莊生振徽音於七篇列斯文於後世重言盡涉玄之路從事發有辭之敘雖談無貴辨而教無虛唱然其文易覽其趣難窺造懷而未達者有過理之嫌祛斯之弊故大舉惠子之云辨也盧文弨曰案不失二字疑衍文神宋本作伸又下列斯文於後世舊脫後字今補又從事發有辭之敘今書發作展以字依下句補世德堂本無後字世德堂本發作展
