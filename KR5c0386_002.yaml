body:
  text: 莊子序唐西華法師成玄英撰夫莊子者所以申道德之深根述重玄之妙旨暢無為之恬淡明獨化之窅冥鉗揵九流括囊百氏諒區中之至教實象外之微言者也其人姓莊名周字子休生宋國睢陽蒙縣師長桑公子受號南華仙人當戰國之初降周之末歎蒼生之業薄傷道德之陵夷乃慷慨發憤爰著斯論其言大而博其旨深而遠非下士之所聞豈淺識之能究所言子者是有德之嘉號古人稱師曰子亦言子是書名非但三篇之總名亦是百家之通題所言內篇者內以待外立名篇以編簡為義古者殺青為簡以韋為編編簡成篇猶今連紙成卷也故元愷云大事書之於策小事簡牘而已內則談於理本外則語其事迹事雖彰著非理不通理既幽微非事莫顯欲先明妙理故前標內篇內篇理深故每於文外別立篇目郭象仍於題下即注解之逍遙齊物之類是也自外篇以去則取篇首二字為其題目駢拇馬蹄之類是也所言逍遙遊者古今解釋不同今泛舉紘綱略為三釋所言三者第一顧桐柏云逍者銷也遙者遠也銷盡有為纍遠見無為理以斯而遊故曰逍遙第二支道林云物物而不物於物故逍然不我待玄感不疾而速故遙然靡所不為以斯而遊天下故曰逍遙遊第三穆夜云逍遙者蓋是放狂自得之名也至德內充無時不適忘懷應物何往不通以斯而遊天下故曰逍遙遊內篇明於理本外篇語其事迹雜篇雜明於理事內篇雖明理本不無事迹外篇雖明事迹甚有妙理但立教分篇據多論耳所以逍遙建初者言達道之士智德明敏所造皆適遇物逍遙故以逍遙命物夫無待聖人照機若鏡既明權實之二智故能大齊於萬境故以齊物次之既指馬蹄天地混同庶物心靈凝淡可以攝衛養生故以養生主次之既善惡兩忘境智俱妙隨變任化可以處涉人間故以人間世次之內德圓滿故能支離其德外以接物既而隨物升降內外冥契故以德充符次之止水流鑑接物無心忘德忘形契外會內之極可以匠成庶品故以大宗師次之古之真聖知天知人與造化同功即寂即應既而驅馭群品故以應帝王次之駢拇以下皆以篇首二字為題既無別義今不復次篇也而自古高士晉漢逸人皆莫不玩為之義訓雖注述無可間然並有美辭咸能索隱玄英不揆庸昧少而習焉研精覃思三十矣依子玄所注三十篇輒為疏解總三十卷雖復詞情疏拙亦頗有心迹指歸不敢貽厥後人聊自記其遺忘耳蹄字覆宋本亦誤衍依齊物論篇天地一指也萬物一馬也義刪
