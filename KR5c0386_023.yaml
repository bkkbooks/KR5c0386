body:
  text: 外篇山木第二十舉事以名篇莊子行於山中見大木枝葉盛茂伐木者止其旁而不取也問其故曰無所可用莊子曰此木以不材得終其天年既同曲轅之樹又類商丘之木不材無用故終其天年也山中釋名云山産也産生物也説文云山宣也謂能宣散氣生萬物也大木釋名云木冒也冒地而生也字林云木衆樹之總名白虎通云木踊也夫子出於山舍於故人之家故人喜命豎子殺雁而烹之豎子請曰其一能鳴其一不能鳴請奚殺主人曰殺不能鳴者舍息也夫出如字夫者夫子謂莊子也本或即作夫子盧文弨曰今本作夫子出門人呼莊子為夫子也豎子童僕也豎市主反烹之普彭反煮也王念孫曰愚案此亨讀為享享之謂享莊子故人喜莊子之來故殺雁而享之享與饗通呂氏春秋必己篇作令豎子為殺雁饗之是其證也古書享字作亨烹字亦作亨故釋文誤讀為烹而今本遂改亨為烹矣原文作亨故釋文音普彭反若作烹則無須音釋慶藩案雁也説文鵝鵝鵝也鴈鵝也爾雅舒鴈鵝注今江東呼方言鴈自關而東謂之鵝南楚之外謂之鵝廣雅鵝鴈也即此所謂雁鵝鵝也依説文原本改明日弟子問於莊子曰昨日山中之木以不材得終其天年今主人之雁以不材死先生將何處莊子笑曰周將處乎材與不材之間材與不材之間似之而非也故未免乎纍若夫乘道德而浮遊則不然無譽無訾一龍一蛇與時俱化而無肯專為一上一下以和為量浮遊乎萬物之祖物物而不物於物則胡可得而纍邪此神農黃帝之法則也若夫萬物之情人倫之傳則不然合則離成則毀廉則挫尊則議有為則虧賢則謀不肖則欺胡可得而必乎哉悲夫弟子志之其唯道德之鄉乎設將處此耳以此未免於纍竟不處言材者有為也不材者無為也之間中道也雖復離彼二偏處茲中一既未遣中亦猶人不能理於人雁不能同於雁故似道而非真道猶有斯患纍也夫乘玄道至德而浮遊於世者則不如此也既遣二偏又忘中一則能虛通而浮遊於代爾訾毀也龍出也蛇處也言道無材與不材故毀譽之稱都失也無譽音餘無訾音紫毀也餘徐音疵此遣中也既遣二偏又忘中一遣之又遣玄之又玄言既妙遣中一遠超四句豈復諂情毀譽惑意龍蛇故當世浮沈與時俱化何肯偏滯而專為一物也言至人能隨時上下以和同為度量一上如字又時掌反為量音亮俞樾曰此本作一下一上以和為量上與量為韻今作一上一下失其韻矣古書往往倒文以協韻後人不知而誤改者甚多秋水篇無東無西始於玄冥反於大通亦後人所改莊子原文本作無西無東與通為韻也以大和而等量遊造物之祖宗物不相物則無憂患故莊子亦處焉郭注云故莊子亦處焉倫理也共俗物傳習則不如前也人倫之傳直專反司馬云事類可傳行也合則離之成者必毀清廉則被銼傷尊貴者又遭議疑世情險陂何可必固又廉則傷物物不堪化則反挫也自尊物物不堪辱反有議疑也則銼子臥反本亦作挫同盧文弨曰今本作挫慶藩案挫當為銼今本作挫後人誤改也説文銼折傷也呂覽必已篇高注銼缺傷也淮南修務篇頓兵挫鋭高注銼折辱亦後人所改銼非挫辱之義此作挫非俞樾曰議當讀為俄詩賓之初筵篇側辨之俄鄭箋云俄傾貌尊則俄謂崇高必傾側也古書俄字或以義為之説見王氏經義述聞尚書立政篇亦或以議為之管子法禁篇法制不議則民不相私議亦俄也謂法制不傾邪也又或以儀為之荀子成相篇君法儀禁不為儀亦俄也謂君法傾邪則當禁使不為也虧損也有為則損也賢以志高為人所謀言己上賢與不肖等事何必為也必則偏執名中所以有成虧也家世父曰乘道德而浮遊出世者也萬物之情人倫之傳則方以身入世合則離成則毀相待也廉則挫尊則議有為則虧互相因也賢則謀不肖則欺各相炫也不可必者莫知禍福生死之所自來也廉則挫嶢嶢者易缺尊則議位極者高危有為則虧非俊疑傑固庸態也舊注失之悲夫歎聲也志記也不可必故待之不可以一方也唯與時俱化者為能涉變而常通耳言能用中平之理其為道德之鄉也之鄉如字一音許亮反趙諫議本此句不重徐字依世德堂本改市南宜僚見魯侯魯侯有憂色市南子曰君有憂色何也姓熊名宜僚隱於市南也市南宜僚了蕭反徐力遙反司馬云熊宜僚也居市南因為號也李云姓熊名宜僚案左傳云市南有熊宜僚楚人也俞樾曰高注淮南主術篇云宜遼姓也名熊疑名姓字互誤魯侯曰吾學先王之道修先君之業吾敬鬼尊賢親而行之無須臾離居然不免於患吾是以憂先王謂王季文王先君謂周公伯禽也離散也居安居也無須臾離力智反絶句崔本無離字居然崔讀以居字連上句俞樾曰崔撰本無離字而以居字連上句讀當從之呂覽慎人篇胼胝不居高誘訓居為止無須臾居者無須臾止也正與上句行字相對成義學者不達居字之旨而習於中庸不可須臾離之文遂妄加離字而居字屬下讀失之矣下文居得行而不名處亦以居與行對言郭注曰居然自得此行非是原誤移下節今改正市南子曰君之除患之術淺矣夫豐狐文豹棲於山林伏於巖穴靜也夜行晝居戒也雖飢渴隱約猶旦胥疏於江湖之上而求食焉定也然且不免於罔羅機辟之患是何罪之有哉其皮為之災也今魯國獨非君之皮邪吾願君刳形去皮灑心去欲而遊於無人之野南越有邑焉名為建德之國其民愚而朴少私而寡欲知作而不知藏與而不求其報不知義之所適不知禮之所將猖狂妄行乃蹈乎大方其生可樂其死可葬吾願君去國捐俗與道相輔而行有其身而矜其國故雖憂懷萬端尊賢尚行而患慮愈深矣言敬鬼尊賢之法其未除也尚行下孟反豐大也以文章豐美毛衣悅澤故為人利也豐狐司馬云豐大也戒慎也隱約猶斟酌也旦明也胥皆也言雖飢渴猶斟酌明旦無人之時相命於江湖之上扶疏草木而求食也胥疏如字司馬云胥須也疏菜也李云胥相也謂相望疏草也家世父曰釋文引司馬云胥須也疏菜也李云胥相也謂相望疏草也今案江湖之上舟車之所輳也廛閈之所都也豐狐文豹未嘗求食江湖之上故曰定胥疏疏也言足迹之所未經也舊注似皆失之慶藩案胥疏二字古通用胥即疏也宣十四年左傳車及於蒲胥之市呂氏春秋行論篇作蒲疏史記蘇秦傳東有淮穎煮棗無胥魏策作無疏是其證機辟罝罘也言斟酌定計如此猶不免罝罘之患者更無餘罪直是皮色之患也機辟婢亦反欲令無其身忘其國而任其自化也刳形忘身也去皮忘國也灑心忘智也去欲息貪也無人之野謂道德之鄉也郭注云欲令無其身忘其國而任其自化刳形音枯廣雅云屠也去皮起呂反下去欲去君同灑心先典反本亦作洗音同去欲如字徐音欲欲令力呈反章末同寄之南越取其去魯之遠也言去魯既遙名建立無為之道德也作謂耕作也藏謂藏貯也君既懷道民亦還淳義宜也將行也猖狂無心也妄行混迹也各恣其本步而人人自蹈其方則萬方得矣不亦大乎方道方也猖狂恣任混迹妄行乃能蹈大方之道言可終始處之郭注云言可以終始處之也可樂音洛所謂去國捐俗謂蕩除其胸中也捐棄也言棄俗與無為至道相輔導而行也世德堂本作且唐寫本疏下有草字君曰彼其道遠而險又有江山我無舟車奈何真謂欲使之南越迷悟性殊故致魯越之隔也市南子曰君無形倨無留居以為君車形倨躓礙之謂勿恃高尊形容倨傲無形倨音據司馬云無倨傲其形躓之實反又知吏反礙五代反留居滯守之謂隨物任運無滯榮觀無留居司馬云無留安其居形與物夷心與物化斯寄物以自載也君曰彼其道幽遠而無人吾誰與為鄰吾無糧我無食安得而至焉未體獨化不能忘物也我無食一本我作餓市南子曰少君之費寡君之欲雖無糧而乃足君其涉於江而浮於海望之而不見其崖愈往而不知其所窮送君者皆自崖而反君自此遠矣故有人者纍見有於人者憂故堯非有人非見有於人也吾願去君之纍除君之憂而獨與道遊於大莫之國方舟而濟於河有虛船來觸舟雖有惼心之人不怒有一人在其上則呼張歙之一呼而不聞再呼而不聞於是三呼邪則必以惡聲隨之向也不怒而今也怒向也虛而今也實人能虛己以遊世其孰能害之所謂知足則無所不足也言道不資物成而但恬淡耳江謂智也海謂道也涉上善之江遊大道之海絶情欲之遠也寧知窮極哉君欲絶則民各反守其分送君行邁至於道德之鄉民反真自守素分崖分也超然獨立於萬物之上也自從也君從此情高道德玄遠也有人者有之以為己私也君臨魯邦富贍人物為我己有深成病纍也見有於人者為人所役用也言未能忘魯見有於人是以敬鬼尊賢矜人恤衆為民驅役寧非憂患雖有天下皆寄之百官委之萬物而不與焉斯非有人也因民任物而不役己斯非見有於人也郭注云雖有天下皆寄之百官委之萬物而不與焉斯非有人也因民任物而不役己斯非見有於人也不與音預欲令蕩然無有國之懷大莫猶大無也言天下無能雜之大莫莫無也兩舟相並曰方舟方舟司馬云方並也褊狹急也不怒者緣舟虛故也惼心必善反爾雅云急也惡聲罵辱也則呼火故反下同張歙許及反徐許輒反郭疏獵反張開也歙斂也世雖變其於虛己以免害一也虛己無心也趙諫議本惼作褊北宮奢為衛靈公賦斂以為鐘為壇乎郭門之外三月而成上下之縣姓北宮名奢居北宮因以為姓衛之大夫也北宮奢李云衛大夫居北宮因以為號奢其名也鐘樂器名也言為鐘先須設祭所以為壇也為衛于偽反賦斂力豔反為壇但丹反李云祭也禱之故為壇也上下調八音備故曰縣上下之縣音玄司馬云八音備為縣而聲高下王子慶忌見而問焉曰子何術之設慶忌周王之子周之大夫言見鐘壇極妙怪而問焉王子慶忌李云王族也慶忌周大夫也怪其簡速故問之俞樾曰論語皇疏王孫賈周靈王之孫名賈是時仕衛為大夫然則此王子慶忌疑亦周之王子而仕衛者齊亦有王子成父見文十一年左傳奢曰一之間無敢設也奢聞之既雕既琢復歸於朴侗乎其無識儻乎其怠疑萃乎芒乎其送往而迎來來者勿禁往者勿止從其強梁隨其曲因其自窮故朝夕賦斂而毫毛不挫而況有大塗者乎泊然抱一耳非敢假設以益事也郭注云泊然抱一耳非敢假設以益事也泊然步各反還用其本性也郭注云還用本性任其純朴而已侗乎無情之貌任其淳朴而已侗乎吐功敕動二反無知貌字林云大貌一音慟無所趣也儻無慮也怠退也言狐疑思慮之事並已去矣儻敕蕩反無所欣説萃聚也言物之萃聚芒然不知物之去來亦不迎送此下各任物也又芒昧恍忽心無的當隨其迎送任物往來萃乎在醉反芒乎莫郎反欣説音悅任彼也百姓懷來者未防禁而去者亦無情留止也順乎也強梁多力也無所係也傳張戀反剛強難賦者從而任之人情曲傳者隨而順之曲傅音附司馬云謂曲附己者隨之也本或作傳張戀反用其不得不爾因任百姓各窮於其所情也家世父曰賦斂以為鐘猶左傳昭公二十九年遂賦晉國一鼓鐵以鑄刑鼎名為賦斂而聽民之自致故曰因其自窮説文窮極也言殫竭所有以輸納之也惟不敢設術以求而純任自然民亦以自然應之今之賦斂任術多矣而固無如民巧遁於術何也故曰既雕既琢復歸於朴當故無損雖設賦斂而未嘗抑度各率其性是故略無挫損者也不挫子臥反泰然無執用天下之自為斯大通之塗也故曰經之營之不日成之塗道也直致任物己無挫損況資大道神化無為三月而成何怪之有傅字依釋文及世德堂本改趙諫議本毫作豪衆字依世德堂本改情字疑當作窮孔子圍於陳蔡之間七日不火食楚昭王召孔子孔子自魯聘楚塗經陳蔡二國之間尼父徒衆既多陳蔡之人謂孔子是陽虎所以起兵圍之門人飢餒七日不起火食窘迫困苦也大公任往弔之曰子幾死乎曰然子惡死乎曰然自同於好惡耳聖人無好惡也太公老者稱也任名也幾近也然猶如是也尼父既遭圍繞太公弔而問之曰子近死乎答云如是曰子嫌惡乎答云如是也大音泰公任如字李云大公大夫稱任其名俞樾曰廣韻一東公字注世本有大公叔然則大公乃復姓非大夫之稱子幾音祈又音機子惡烏路反注及下同於好呼報反章內同趙諫議本無子惡死乎曰然六字任曰豫嘗言不死之道東海有鳥焉其名曰意怠其為鳥也翂翂翐翐而似無能引援而飛迫脅而棲進不敢為前退不敢為後食不敢先嘗必取其緒是故其行列不斥而外人卒不得害是以免於患直木先伐甘井先竭子其意者飾知以驚愚修身以明汙昭昭乎如揭日月而行故不免也昔吾聞之大成之人曰自伐者無功功成者墮名成者虧孰能去功與名而還與衆人道流而不明居得行而不名處純純常常乃比於狂削迹捐勢不為功名是故無責於人人亦無責焉至人不聞子何喜哉既弘大舒緩又心無常係試言長生之道舉海鳥而譬之翂翂翐翐是舒遲不能高飛之貌也飛必援引徒侶不敢先起棲必戢其脅翼迫引於群翂翂音紛字或作翐翐音秩徐音族字或作司馬云翂翂翐翐舒遲貌一云飛不高貌李云羽翼聲迫脅而棲李云不敢獨棲迫脅在衆鳥中才足容身而宿辟害之至也常從容處中從容七容反其於隨物而已夫進退處中遠害之至飲啄隨行必依次敘其緒緒次緒也王念孫曰釋文曰緒次緒也案陸説非也緒者餘也言食不敢先嘗而但取其餘也讓王篇其緒餘以為國家司馬彪曰緒者殘也謂殘餘也楚詞九章欸秋冬之緒風王注曰緒餘也管子弟子職篇奉以為緒尹知章曰緒然燭燼也燼亦餘也見方言廣雅與群俱也行列戶剛反下亂行同不斥音尺患害生於役知以奔競為其謙柔不與物競故衆鳥行列不獨斥棄也而外人造次不得害之是以免於人間之禍患卒不子恤反終也又七忽反才之害也直木有材先遭斫伐甘井來飲其流先竭人衒才智其義亦然夫察焉小異則與衆為忤矣混然大同則無獨異於世矣故夫昭昭者乃冥冥之迹也將寄言以遺迹故因陳蔡以託謂仲尼意在裝飾才智驚異愚俗修瑩身心顯他汙染昭昭明察炫耀己能猶如揭日月而行故不免於禍患也飾知音智明汙音烏揭其列其謁二反慶藩案文選沈休文齊安陸昭王碑注引司馬云揭擔也釋文闕為忤五故反恃功名以為已成者未之嘗全大成之人即老子也言聖德弘博生成庶品故謂之大成伐取也墮敗也夫自取其能者無功績而功成不退者必墮敗名聲彰顯者不韜光必毀辱者墮許規反功自衆成故還之夫能立大功建鴻名而功成弗居推功於物者誰能如是其唯聖人乎去功起呂反昧然而自行耳道德流行遍滿天下而韜光匿耀故云不明彼皆居然自得此行耳非由名而後處之身有道德盛行於世而藏名晦迹故不處其名居得行如字又下孟反注同家世父曰得猶德也集韻德行之得也言其道周流乎天下而不顯然以居之其德之行亦不藉之為名而以自處郭象居然自得此行非由名而後處之以居得行斷句恐誤無心而動故也純純者材素常常者混物既不矜飾更類於狂人也功自彼成故勢不在我而名迹皆去削除聖迹捐棄權勢豈存情於功績以留意於名譽恣情任彼故彼各自當其責也為是義故無名譽我既不譴於人故人亦無責於我寂泊無懷乃至人也夫至德之人不顯於世子既聖哲何為喜好聲名者邪泊步各反世德堂本無其字意字依明中立四子本改孔子曰善哉辭其交遊去其弟子逃於大澤衣裘褐食杼栗入獸不亂群入鳥不亂行鳥獸不惡而況人乎取於棄人間之好也孔子既承教戒善其所言於是辭退交遊捨去弟子離析徒衆獨逃山澤之中損縫掖而服絺裘棄甘肥而食杼栗衣裘於既反褐戶割反杼食汝反又音序若草木之無心故為鳥獸所不畏蓋寄言以極推至誠之信任乎物而無受害之地也同死灰之寂泊類草木之無情群鳥獸而不驚況人倫而有惡邪孔子問子桑雽曰吾再逐於魯伐樹於宋削迹於衛窮於商周圍於陳蔡之間吾犯此數患親交益疏徒友益散何與姓桑名隱者也孔子為魯司寇齊人聞之遂選女樂文馬而遺魯君間構魯君因而被逐宋是殷後孔子在宋及周遂不被用故稱窮也遇此憂患親戚交情益甚疏遠門徒朋友益甚離散何為如此邪子桑雽音戶本又作音于李云桑姓其名隱人也或云姓桑雽名隱俞樾曰疑即大宗師之子桑戶雽音戶則固與子桑戶同矣其或作即雩字説文雩或作愚以為古今人表之采桑羽即子桑戶説在大宗師篇羽或之壞字乎伐樹於衛一本作伐樹於宋削迹於衛盧文弨曰今本衛作宋陸氏下句宋衛當互易此數所主反何與音餘下放此趙諫議本雽作雩世德堂本作呼子桑雽曰子獨不聞假人之亡與林回棄千金之璧負赤子而趨或曰為其布與赤子之布寡矣為其纍與赤子之纍多矣棄千金之璧負赤子而趨何也林回曰彼以利合此以天屬也夫以利合者迫窮禍患害相棄也以天屬者迫窮禍患害相收也夫相收之與相棄亦遠矣且君子之交淡若水小人之交甘若醴君子淡以親小人甘以絶彼無故以合者則無故以離布謂財帛也假古雅反李云國名慶藩案文選王仲寶褚淵碑文注引司馬云假國名也釋文闕林回司馬云殷之逃民之姓名慶藩案文選劉孝標廣絶交論注引司馬云林回人姓名也與釋文小異俞樾曰上文假人之亡李注假國名然則林回當是假之逃民蓋假亡而其民逃故林回負赤子而趨也殷乃假字之誤為其如字下同又皆于偽反布與布謂貨財也假國名晉下邑也姓林名回假之賢人也布財貨也假遭晉滅百姓逃亡林回棄擲寶璧負子而走或人問之謂為財布然亦以為財則少財以為纍重則多纍輕少負多不知何也寶璧利合也赤子親屬也親屬急迫猶相收利合窮禍則相棄棄收之情相去遠耳慶藩案文選王仲寶褚淵碑文注引司馬云屬連也釋文闕無利故淡道合故親淡如字又徒暫反飾利故甘利不可常故有時而絶也無利故淡道合故親有利故甘利盡故絶夫無故而自合者天屬也合不由故則故不足以離之也然則有故而合必有故而離矣不由事故而合者謂父子天屬也故無由而離之孔子説先王陳迹親於朋友非天屬也皆為求名利而來此則是有故而合也見削迹伐樹而去是則有故而離也非是天屬無故自親無故自離孔子曰敬聞命矣徐行翔佯而歸絶學捐書弟子無挹於前其愛益加進去飾任素故也的聞高命徐步而歸翱翔間放逍遙自得絶有為之學棄聖迹之書不行華藻之教故無揖讓之禮徒有敬愛日加進益焉無挹音揖李云無所執持也去飾起呂反敦煌本愛作受異日桑雽又曰舜之將死真泠禹曰汝戒之哉形莫若緣情莫若率緣則不離率則不勞不離不勞則不求文以待形不求文以待形固不待物因形率情不矯之以利也緣順也形必順物情必率中昔虞舜將終用此真教命大禹令其戒慎依語遵行故桑引來以告孔子亦有作泠字者泠曉也舜將真言曉示大禹也真司馬本作直泠音零禹司馬云泠曉也謂以真道曉語禹也泠或為命又作令命猶教也王引之曰釋文曰真司馬本作直泠音零司馬云泠曉也謂以直道曉語禹也泠或為命又作令命猶教也案直當為籀文乃字隸書作乃形似直山碑乃今皇帝乃字作形似直字故訛作直又訛作真命與令古字通周官司儀則令為壇三成覲禮注引此令作命僖九年左傳令不及魯令本又作命莊子田子方篇先君之令令本或作命周官大卜注以命龜也命亦作令作命作令者是也令禹者乃命禹也形不假故常全情不矯故常逸形順則常合於物性率則用而無弊任朴而直前也率性而動任朴直前豈復求假文迹而待用飾其形性哉朴素而足既不求文以飾形故知當分各足不待於外物也嶧字依讀書雜志改迹字依上文改莊子衣大布而補之正緳係履而過魏王魏王曰何先生之憊邪大布猶粗布也莊子家貧以粗布為服而補之緳履帶也亦言腰帶也履穿故以繩係之魏王魏惠王也憊病也衣粗布而著破履正腰帶見魏王王見其故問言先生何貧病如此耶莊子衣於既反大布司馬云粗布也正緳賢節反又苦結反司馬云帶也係履李云履穿故係家世父曰釋文引司馬云緳帶也帶之名緳別無證據正帶係履亦不得為憊也説文潔麻一專也潔與緳字通言整齊麻之一端以納束其履而係之履無絢係之以麻故曰憊而過古禾反魏王司馬云惠王也憊皮拜反又薄計反司馬本作病莊子曰貧也非憊也士有道德不能行憊也衣弊履穿貧也非憊也此所謂非遭時也王獨不見夫騰猿乎其得柟梓豫章也攬蔓其枝而王長其間雖羿蓬蒙不能眄睨也及其得柘棘枳枸之間也危行側視振動悼栗此筋骨非有加急而不柔也處勢不便未足以逞其能也今處昏上亂相之間而欲無憊奚可得邪此比干之見剖心徵也夫遭時得地則申其長技故雖古之善射莫之能害柟梓豫章皆端直好木也攬蔓猶把捉也王長猶自得也羿古之善射人逢蒙羿之弟子也睥睨猶斜視字亦有作眄字者隨字讀之言善士賢人遭時得地猶如猿得直木則跳躑自在雖有善射之人不敢舉目側視何況彎弓乎螣音騰本亦作騰盧文弨曰今本作騰柟音南木名攬舊歷敢反蔓音萬郭武半反而王往況反司馬本作往長丁亮反本又作張音同司馬直良反云兩枝相去長遠也俞樾曰郭注曰遭時得地則申其長技是讀長為長短之長然於本文之義殊為未合司馬云兩枝相去長遠也則就樹木言義更非矣此當就猿而言謂猿得柟梓豫章則率其屬居其上而自為君長也故曰王長其間釋文王往況反長丁亮反頗得其讀羿音詣或戶係反蓬蒙符恭反徐扶公反司馬云羿古之善射者蓬蒙羿之弟子眄莫練反舊莫顯反本或作睥普計反睨音詣郭五米反李云邪視長技其綺反柘棘枸枳並有刺之惡木也夫猿得有刺之木不能逞其捷巧是以心中悲悼而戰栗形貌危行而側視非謂筋骨有異於前而勢不便也士逢亂世亦須如然柘棘章夜反枳吉氏反又音紙枸音矩悼如字又直弔反慶藩案説文悼懼也陳楚謂懼曰悼呂覽論威篇敵人悼懼憚恐即此振動悼栗之意不便婢面反注同王念孫曰古者謂所居之地曰處勢史記蔡澤傳翠鵠犀象其處勢非不遠死也或曰勢居逸周書周祝篇曰勢居小者不能為大賈子過秦篇至於秦王二十餘君常為諸侯雄其勢居然也淮南原道篇形性不可易勢居不可移也或言處勢或言勢居其義皆同漢書陳湯傳曰故陵因天性據真土處高敞勢不便而強為之則受戮矣此合諭也當時周室微弱六國興盛於是主昏於上臣亂於下莊生懷道抱德莫能見用晦迹遠害故發此言昔殷紂無道比干忠諫剖心而死豈非徵驗引古證今異日明鏡亂相息亮反見心賢遍反盧文弨曰今本作見剖心強為其丈反趙諫議本作螣也字依釋文原本及世德堂本改藝字依讀書雜志及漢書改孔子窮於陳蔡之間七日不火食左據稿木右擊稿枝而歌猋氏之風有其具而無其數有其聲而無宮角木聲與人聲犁然有當於人之心焱氏神農也孔子聖人安於窮通雖遭陳蔡之困不廢無為故左手擊稿木右手憑枯枝恬然自得歌焱氏之淳風木乃八音雖擊而無曲無聲惟打木寧有於宮商然歌聲木聲犁然清淡而樂正心故有應當於人心者也稿木苦老反下同猋氏必遙反古之無為帝王也犁然力兮反又力之反司馬云犁然猶栗然有當丁浪反顏回端拱還目而窺之仲尼恐其廣己而造大也愛己而造哀也曰回無受天損易無受人益難無始而非卒也人與天一也夫今之歌者其誰乎顏生既見仲尼擊木而歌於是正身回目而視仲尼恐其未悟妄生虞度謂言仲尼廣己道德而規造大位之心愛惜己身遭窮而規造哀歎之曲慮其如是故召而誨之還目音旋而窺徐起規反造大司馬云造適也唯安之故易損易以豉反注下同物之儻來不可禁禦夫自然之理有窮塞之損達於時命安之則易人倫之道有爵祿之益儻來而寄推之即難此明仲尼雖擊木而歌無心哀怨於今為始者於昨為卒則所謂始者即是卒矣言變化之無窮卒終也於今為始者於昨為終也欲明無始無終無生無死既無死無生何窮塞之有哀乎皆自然所謂天損人益者猶是教迹之言也若至凝理處皆是自然故不二也任其自爾則歌者非我也夫大聖虛忘物我兼喪我既非我歌是誰歌我乃無身歌將安寄也爵字依下正文爵祿並至補回曰敢問無受天損易仲尼曰飢渴寒暑窮桎不行天地之行也運物之泄也言與之偕逝之謂也為人臣者不敢去之執臣之道猶若是而況乎所以待天乎不可逃也前略標名此下解義桎塞也夫命終窮塞道德不行此猶大地虛盈四時轉變運動萬物發泄氣候也窮桎之實反家世父曰窮桎不行言飢渴寒暑足以梏桎人而使不自適然而飢渴以驅之寒暑以運之不能抗而不受也與之俱逝而已矣運物司馬云運動也之泄息列反司馬云發也徐以世反所謂不識不知而順帝之則也偕俱也逝往也既體運物之無常故與變化而俱往而無欣惡於其間也言與之言我也所在皆安不以損為損斯待天而不受其損也夫為人臣者不敢逃去君命執持臣道由猶自如斯而況為變化窮通必待自然之理豈可違距者哉闕誤引江南古藏本物作化何謂無受人益難仲尼曰始用四達爵祿並至而不窮物之所利乃非己也吾命其在外者也君子不為盜賢人不為竊吾若取之何哉故曰鳥莫知於鷾鴯目之所不宜處不給視雖落其實棄之而走其畏人也而襲諸人間社稷存焉爾感應旁通為四達旁通故可以御高大也非己求而取之始本也乃宜也妙本虛寂迹用赴機傍通四方凝照九表既靡好爵財德無窮萬物利求是其宜也人之生必外有接物之命非如瓦石止於形質而已孔子聖人挺於天命運茲外德救彼蒼生非瓦石形質也盜竊者私取之謂也今賢人君子之致爵祿非私取也受之而已夫賢人君子尚不為盜竊況孔丘大聖寧肯違天乖理而私取於爵祿乎儻來而寄受之而已矣蓋無心也避禍之速鷾鴯燕也實食也智能遠害全身鳥中無過燕子飛入人舍欲作窠巢目略處所不是宜便不待周給看即遠飛出假令銜食落地急棄而走必不復收避禍之速也莫知音智鷾音意鴯音而或云鷾鴯燕也目之所不宜處昌呂反言不可止處目已羅絡知之故棄之未有自疏外於人而人存之者也畏人而入於人舍此鳥之所以稱知也襲入也燕子畏懼於人而依附人住入人舍宅寄作窠巢是故人愛而狎之故得免害亦聖人和光在世混迹人間戒慎災危不溺塵境蒼生樂推而不厭故得久視長況之至人則玄同天下故天下樂推而不厭相與社而稷之斯無受人益之所以為難也聖德遐被群品樂推社稷之存故其宜矣所謂人益此之謂乎家世父曰有土而因有社有田而因有稷社者所以居也稷者所以養也鳥亦有其居鳥亦有其養鷾鴯之襲諸人間不假人以居而因自為居不假人以養而因自為養也生字依老子改何謂無始而非卒仲尼曰化其萬物而不知其禪之者焉知其所終焉知其所始正而待之而已耳莫覺其變禪代也夫道通生萬物變化群方運轉不停新新變易日用不知故莫覺其代謝者也既無日新而變何始卒之有耶其禪市戰反司馬云授豫也日夜相代未始有極故正而待之無所為懷也夫終則是始始則是終故何能定終始既其無終與始則無死與生是以隨變任化所遇皆適抱守正真待於造物而已矣焉知於虔反下同何謂人與天一邪仲尼曰有人天也有天亦天也人之不能有天性也聖人晏然體逝而終矣凡所謂天皆明不為而自然夫人倫萬物莫不自然愛及自然也是以人天不二萬物混同言自然則自然矣人安能故有此自然哉自然耳故曰性夫自然者不知所以然而然自然耳不為也豈是能有之哉若謂所有則非自然也故知自然者性也非人有之矣此解前有天之義也晏然無矜而體與變俱也晏然安也逝往也夫聖人通始終之不二達死生之為一故能安然解體隨化而往泛乎無始任變而終家世父曰孟子口之於味也目之於色也耳之於聲也鼻之於臭也四肢之於安佚也性也有命焉莊子之云人之不能有天即孟子所謂性焉有命者也莊子以其有物有欲者為人而自然為天於是斷聲色去臭味離天與人而二之其曰人與天一猶之去人以就天也聖人盡性以知天其功不越日用飲食性也有命而固不謂之性命也有性而固不謂之命是之謂天與人一莊周遊於雕陵之樊睹一異鵲自南方來者翼廣七尺目大運寸感周之顙而集於栗林莊周曰此何鳥哉翼殷不逝目大不睹蹇裳躩步執彈而留之睹一蟬方得美蔭而忘其身螳蜋執翳而搏之見得而忘其形異鵲從而利之見利而忘其真莊周怵然曰噫物固相纍二類相召也捐彈而反走虞人逐而誶之雕陵栗園名也樊藺也謂遊於栗園藺籬之內也運員也感觸也顙額也異常之鵲從南方來翅長七尺眼圓一寸突著莊生之額仍栖栗林之中雕徐音雕本亦作雕陵之樊音煩司馬云雕陵陵名樊藩也謂遊栗園藩籬之內也樊或作野野古野字翼廣光浪反運寸司馬云可回一寸也王念孫曰司馬彪曰運寸可回一寸也案司馬以運為轉運之運非也運寸與廣七尺相對為文廣為橫則運為從也目大運寸猶言目大徑寸耳越語句踐之地廣運百里韋注曰東西為廣南北為運是運為從也西山經曰是山也廣員百里員與運同周官大司徒周知九州之地域廣輪之數士喪禮記廣尺輪二尺鄭注並曰輪從也輪與運聲近而義同廣輪即廣運也感周之顙息蕩反李云感觸也殷大也逝往也躩步猶疾行也留伺候也翅大不能遠飛目大不能遠視莊生怪其如此仍即起意規求既而舉步疾行把彈弓而伺候翼殷不逝目大不睹司馬云殷大也曲折曰逝李云翼大逝難目大視希故不見人蹇起虔反躩李驅碧反徐九縛反司馬云疾行也案即論語云足躩如也執彈徒旦反留之力救反司馬云宿留伺其便也執木葉以自翳於蟬而忘其形之見乎異鵲也螳音堂蜋音郎執翳於計反司馬云執草以自翳也搏之郭音博徐音付之見乎賢遍反目能睹翼能逝此鳥之真性也今見利故忘之搏捕也真性命也莊生執彈未放中間忽見一蟬隱於樹葉美茲蔭庇不覺有身有螳蜋執木葉以自翳意在捕蟬不覺形見異鵲異鵲從螳蜋之後利其捕蟬之便意在取利不覺性命之危所謂忘真矣其真司馬云真身也相為利者恆相為纍既睹蟬鵲徇利忘身於是怵然驚惕仍噫歎之聲故知物相利者必有纍憂怵然肇律反夫有欲於物者物亦有欲之夫有欲於物者物亦欲之也是以蟬鵲俱世物之徒利害相召必其然也誶問之也捐棄也虞人掌栗園之虞候也誶問也既覺利害相隨棄彈弓而反走虞人謂其盜栗故逐而問之誶之本又作訊音信問也司馬云以周為盜栗也闕誤作褰云張本作蹇趙諫議本相作常莊周反入三月不庭藺且從而問之夫子何為頃間甚不庭乎莊周見鵲忘身被疑盜栗歸家愧恥不出門庭姓藺名且莊子弟子怪師頃來閉戶所以從而問之三月不庭一本作三日司馬云不出坐庭中三月王念孫曰釋文曰三月不庭一本作三日司馬云不出坐庭中三月案如司馬説則庭上須加出字而其義始明下文云夫子何為頃間甚不庭乎若以甚不庭為甚不出庭則尤不成語今案庭當讀為逞不逞不快也甚不逞甚不快也忘吾身忘吾真而為虞人所辱是以不快也方言曰逞曉快也自關而東或曰曉或曰逞江淮陳楚之間曰逞桓六年左傳今民餒而君逞欲周語虢公動匱百姓以逞其違韋杜注並曰逞快也逞字古讀若呈聲與庭相近故通作庭張衡思玄賦怨素意之不逞與情名聲營平崢禎鳴榮寧為韻説文逞從呈聲僖二十三年左傳淫刑以逞釋文逞作呈方言逞解也廣雅作呈三月不庭一本作三日是也下文言夫子頃間甚不庭若三月之久不得言頃間矣藺力信反一本作且子餘反司馬云藺且莊子弟子慶藩案文選郭景純江賦注引司馬云頃久也謝靈運入華子洞是麻源第三谷詩注引司馬云頃常久也釋文闕闕誤引江南古藏本入下有宮字莊周曰吾守形而忘身觀於濁水而迷於清淵且吾聞諸夫子曰入其俗從其今吾遊於雕陵而忘吾身異鵲感吾顙遊於栗林而忘真栗林虞人以吾為戮吾所以不庭也夫身在人間世有夷險若推夷易之形於此世而不度此世之所宜斯守形而忘身者也夷易以豉反不度直落反見彼而不明即因彼以自見幾忘反鑒之道也我見利徇物愛守其形而利害相召忘身者也既睹鵲蟬歸家不出門庭疑亦自責所謂因觀濁水所以迷於清泉雖非本情合真猶存反照之道自見賢遍反不違其禁令也莊周師老聃故稱老子為夫子也夫達者同塵入俗俗有禁令從而行之今既遊彼雕陵被疑盜栗輕犯憲綱悔責之辭以見問為戮夫莊子推平於天下故每寄言以出意乃毀仲尼賤老聃上掊擊乎三皇下痛病其一身也意在異鵲遂忘栗林之禁令斯忘身也字亦作真字者隨字讀之虞人謂我偷栗是成身之恥之辱如此是故不庭夫莊子大人隱身卑位遨遊國養性漆園豈迷目於清淵留意於利害者耶蓋欲評品群性毀殘其身耳上掊普口反令字依闕誤引成玄瑛本改郭注亦作令闕誤引文如海張君房本栗林俱作趙諫議本無言以出三字陽子之宋宿於逆旅逆旅人有妾二人其一人美其一人惡惡者貴而美者賤陽子問其故逆旅小子對曰其美者自美吾不知其美也其惡者自惡吾不知其惡也姓陽名朱字子居秦人也逆旅店也往於宋國宿於中地逆旅美者恃其美故人忘其美而不知也惡者謙下自惡故人忘其惡而不知也陽子司馬云陽朱也闕誤引劉得一本人作之陽子曰弟子記之行賢而去自賢之行安往而不愛哉言自賢之道無時而可夫種德立行而去自賢輕物之心者何往而不得愛重哉故命門人記之云耳而去起呂反之行下孟反趙諫議本可下有也字
