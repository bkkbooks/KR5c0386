body:
  text: 雜篇列禦寇第三十二以人名篇或無列字列禦寇之齊中道而反遇伯昏瞀人伯昏瞀人曰奚方而反伯昏楚之賢士號曰伯昏瞀人隱者之徒也禦寇既師壺子又事伯昏方欲適齊行於化道自驚行淺中路而還適逢瞀人問其所以瞀人音茂又音務方道也奚何也汝行何道欲往何方問其所由中塗反意也奚方李云方道也曰吾驚焉自覺己非驚懼而反此略答前問意吾驚焉李云見人感己即遠驚也盧文弨曰舊感作惑訛今書音義作見人感己即違道故驚也此似有脫誤曰惡乎驚重問禦寇於何事跡而起驚心惡乎音烏曰吾嘗食於十漿而五漿先饋賣漿之家十漿水改食子祥反本亦作漿也司馬云漿水改食讀曰漿十家並賣漿也言其敬己饋遺也十漿謂有十家賣漿飲也列子因行渴於逆旅十家賣飲而五家先遺睹其容觀競起心未能冥混是以驚懼也五漿水改食先饋饋遺也謂十家中五家先見遺王云皆先饋進於己趙諫議本漿水改食作漿下同敬字依注文改伯昏瞀人曰若是則汝何為驚己更問驚由庶陳己失曰夫內誠不解形諜成光以外鎮人心使人輕乎貴老而其所患夫漿水改食人特為食羹之貨無多餘之贏其為利也薄其為權也輕而猶若是而況於萬乘之主乎身勞於國而知盡於事彼將任我以事而效我以功吾是以驚外自矜飾自覺內心實智未能懸解為物所敬是以驚而歸不解音蟹司馬音懈舉動便辟而成光儀也形諜徒協反郭云便辟也說文云閒也成光司馬云形諜於衷成光華也便辟婢亦反其內實不足以服物諜便辟貌也鎮服也儀容便辟動成光華用此外形鎮服人物若鎮物由乎內實則使人貴老之情篤也貴老謂重禦寇過於老人言以美形動物則所患亂生也亂也未能混俗同塵而為物標杓使人敬貴於己而輕老人良恐禍患方亂生矣而子兮反亂也盧文弨曰舊作訛今改正卷內同權輕利薄可無求於人為食音嗣贏音盈特獨也贏利也夫賣漿之人獨有羹食為貨所盈之物蓋亦不多為利既薄權亦非重尚能敬己競走獻漿況在君王權高利厚奔馳尊貴不亦宜乎萬乘繩證反夫君人者位總萬機威跨四海故躬疲倦於邦國心盡慮於世事則思賢若渴以代己勞必將任我以物務而驗我以功績徇外喪內逐僞忘真驚之所由具陳如是也而效如字本又作校古孝反無字依闕誤引江南古藏本及文如海張君房本補據成疏亦當有無字說文作趙諫議本無可字伯昏瞀人曰善哉觀乎女處己人將保女矣汝能觀察己身審知得喪嘉其自覺故歎善哉苟不遺形則所在見保保者聚守之謂也保守也汝安處己身不能忘我猶顯形德為物所歸門人請益聚守之矣保女司馬云保附也闕誤引江南古藏本及李氏本俱音紀無幾何而往則戶外之屨滿矣伯昏瞀人北面而立敦杖蹙之乎頤立有間不言而出無幾何謂無多時也俄頃之間伯昏往禦寇之所適見脫屨戶外跣足升堂請益者多矣無幾居豈反敦豎也以杖柱頤聽其言說倚立閒久忘言而歸也敦杖音頓司馬云豎也蹙之子六反賓者以告列子列子提屨跣而走暨乎門曰先生既來曾不發藥乎賓者謂通賓客人也禦寇聞師久立不言而歸於是竦息慚惕不暇納屨跣足馳走至門而高人既來庶蒙針艾不嘗開發藥石遺棄而還誠心欽渴有此固請也賓者本亦作儐同必刃反謂通客之人跣而先典反暨乎其器反發藥如字司馬本作廢云置也慶藩案發司馬作廢發廢古同聲通用字爾雅廢稅舍也方言發稅舍車也是發與廢同漢書貨殖傳子贛發貯鬻曹魯之間史記作廢者徐廣曰著讀音如貯荀子禮論篇大昏之未發齊也史記禮書發作廢史記扁鵲傳色廢脈亂徐廣曰一作發皆其例曰已矣吾固告汝曰人將保汝果保汝矣非汝能使人保汝而汝不能使人無保汝也而焉用之感豫出異也必且有感搖而本才又無謂也與汝遊者又莫汝告也彼所小言盡人毒也莫覺莫悟何相孰也巧者勞而知者憂無能者無所求飽食而敖遊泛若不繫之舟虛而敖遊者也已止也我已於先固告汝汝不能韜光晦跡必為物所歸依今果見汝門人滿室吾昔語汝諒非虛言宜止所請無勞辭費慶藩案保汝謂依汝也僖二年左傳保於逆旅杜注保依也史記周本紀百姓懷之多從而保歸焉保歸謂依歸也司馬訓保為附附亦依也王逸注七諫曰依保也任平而化則無感無求無感無求乃不相保顯跡於外故為人保之未能忘德故不能無守也先物施惠惠不因彼豫出則異也而汝也焉何也夫物我兩忘亦何須物來感己必有機來感而後應不勞預出異端先物施惠而焉於虔反必將有感則與本性動也搖動也必固有感迫而後起率其本性搖而應之滅跡匿端有何稱謂也搖而本才一本才作性家世父曰釋文一本才作性郭象注必將有感則與本性動也感者人心所感之者又出於感人心之心爾雅釋詁搖作也搖而本才謂舍其本心之自然而作而致之又無謂也動搖本才以致求者又非道德之謂也細巧入人為小言共汝同遊行解相類唯事浮辨細巧之言佞媚於人盡為鴆毒詎能用道以告汝也小言言不入道故曰小言人毒以其多患故曰人毒孰誰也彼此迷塗無能覺無能悟何誰獨曉以相告乎莫覺莫悟何相孰也彼不敢告汝汝又不自覺何期相孰哉王云小言為毒曾無告語也孰誰也謂誰相親愛者既無告語此不相親愛之至也家世父曰釋文引王云孰誰也謂誰相親愛也疑莊子本旨在蠲親愛之意說文孰食餘也孰食曰孰假借為詳審之義漢書本紀其孰計之賈誼傳日夜念此至孰也鄒陽傳願大王孰察之顏師古注孰審也言莫之覺悟而終不自審也夫無其能者唯聖人耳過此以下至於昆蟲未有自忘其能而任衆人者也夫物未嘗為無用憂勞而必以智巧困弊唯聖人泛然無係泊爾忘心譬彼虛舟任運逍遙而知音智食而一本作飽食而敖遊本又作遨五刀反下同泛若芳劍反趙諫議本作性依郭注及成疏似均作性鄭人緩也呻吟裘氏之地祇三年而緩為儒河潤九里澤及三族使其弟墨儒墨相與辨其父助翟十年而緩自殺其父夢之曰使而子為墨者豫也闔胡嘗視其良既為秋柏之實矣呻吟吟詠之謂緩也司馬云緩名也呻音申謂吟詠學問之聲也崔云呻誦也本或作呻吟裘氏地名崔云裘儒服也之地崔本作之地蛇云地蛇者山田荼種也盧文弨曰宋本荼字空祇適也呻吟詠讀也裘氏地名也祇適也鄭人名緩於裘地學問適經三年而成儒道祇音支郭李云適也言適三年而成也司馬云巨移反謂神祇祐之也三族謂父母妻族也能使弟成於墨教也河潤九里河從乾位來乾陽數九也使其弟墨謂使緩弟翟成墨也翟緩弟名翟緩弟名也儒則憲章文武祖述堯舜甚固吝好多言墨乃遵於禹道勤儉好施儒墨塗別志尚不同各執是非互相爭辨父黨小兒遂助於翟矣緩怨其父之助弟故感激自殺死而見夢謂己既能自化為儒又化弟令墨弟由己化而不能順己己以良師而便怨死精誠之至故為秋柏之實闔何不也秋柏徑木也父既助翟而緩恨之經由十年感激自殺仍見夢於父以申怨言云使汝子為墨者我之功力也何不看視我為賢良之師而更朋助弟我怨恨之甚化為異物秋柏子實生於墓上亦有作垠字者垠冢也云汝何不看我冢上已化為秋柏之木而生實也闔胡嘗視其良闔語助也胡何也良者良人斥緩也言何不試視緩墓上已化為秋柏之實良或作埌音浪冢也俞樾曰釋文曰良者良人謂緩也此與下句之義不屬又云良或作埌冢也此說近之埌猶壙也壙埌本韻字應帝王篇以處壙埌之野是也故壙亦得謂之埌管子度地篇郭外為之土閬閬與埌同外物篇胞有重閬郭注曰閬空曠也其義亦相近而見賢遍反令墨力呈反闕誤引文成李三本胡俱作夫造物者之報人也不報其人而報其人之天彼故使彼夫人以己為有以異於人以賤其親齊人之井飲者相捽也故曰今之世皆緩也自是有德者以不知也而況有道者乎古者謂之遁天之刑自此以下莊子辭也夫積習之功為報報其性不報其為也然則學習之功成性而已豈為之哉造物者自然之洪爐也而造物者無物也能造化萬物故謂之造物也夫物之智能稟乎造化非由從師而學成也故假於學習輔道自然報其天性不報人功也是知翟有墨性不從緩得緩言我教不亦繆乎彼有彼性故使習彼彼翟先者先有墨性故成墨若率性素無學終不成也豈唯墨翟庶物皆然言緩自美其儒謂己能有積學之功不知其性之自然也夫有功以賤物者不避其親也無其身以平者貴賤不失其倫也言緩自恃於己有學植之功異於常人故輕賤其親而汝於父也人之迷滯而至於斯乎夫穿井所以通泉吟詠所以通性無泉則無所穿無性則無所詠而世皆忘其泉性之自然徒識穿詠之末功因欲矜而有之不亦妄乎夫土下有泉人各有性天也穿之成井學以成術者人也嗟乎世人迷妄之甚徒知穿學之末事不悟泉性之自然而矜之以為己功者故世皆緩之流也齊人穿鑿得井行李汲而飲之井主護水捽頭而休莊生聞之故引為相捽才骨反言穿井之人為己有造泉之功而捽飲者不知泉之天然也喻緩不知翟天然之墨而忿之捽一音子晦反觀緩之繆以為學父故能任其自爾而知故無為其間也觀緩之迷以為己誠有德之人從是之後忘知任物不復自矜況體道之人豈視其功耶不知音智注同家世父曰彼故使彼彼者儒墨也有儒墨矣因而有儒墨之辨立夫儒墨之名所以使之辨也既成乎儒墨之辨則貴其同己者而賤其異己者因其親也亦賤之執其所辨之異而忘其受於天性之同也知儒墨之為德以自是其德謂之不知德所謂德者可而可之然而然之所謂道者無物不可無物不然俞樾曰自是二字絶句若緩之自美其儒是自是也有德者已不知有此有道者更無論矣故曰有德者以不知也而況有道者乎以讀為已郭注所說殊未明了學父本或作久仍自然之能以為己功者逃天者也故刑戮及之不知物性自爾矜為己功者逃遁天然之理也既乖造化故刑戮及之仍自而證反本又作認同性字依世德堂本改聖人安其所安不安其所不安衆人安其所不安不安其所安夫聖人無安無不安順百姓之心也安任也任群生之性不引物從己性之無者不強安之故所以為聖人也所安相與異故所以為衆人也學己所不能安其所不安也不安其素分不安其所安也莊子曰知道易勿言難知而不言所以之天也知而言之所以之人也古之人天而不人玄道窅冥言象斯絶運知則易忘言實難道易以豉反妙悟玄道無法可言故詣於自然之境雖知至極而猶存言辨斯未離於人倫矣知雖落天地未嘗開言以引物也應其至分而已復古真人知道之士天然淳素無復人情知雖音智應其如字當也闕誤引張君房本人上有至字朱泙漫學屠龍於支離益單千金之家三年技成而無所用其巧事在於適無貴於遠功姓朱名泙漫姓支離名益殫盡也罄千金之産學殺龍之術伏膺三歲其道方成技雖巧妙卒為無用屠龍之事於世稍稀欲明處涉人間貴在適中苟不當機雖大無益也朱泙李音平郭敷音反徐敷耕反慶藩案文選張景陽七命注引司馬云泙普彭反釋文闕漫末旦反又末干反司馬云朱泙漫支離益皆人姓名慶藩案文選張景陽七命注引司馬云朱姓也泙漫名也益人名也與釋文小異俞樾曰支離復姓說在人間世篇朱泙亦復姓廣韻十虞朱字注莊子有朱泙漫郭注朱泙姓也今象注無此文屠音徒單音丹盡也千金之家如字本亦作賈又作價皆音嫁三絶句崔云用千金者三也一本作三年則上句至家絶盧文弨曰今書作三年技成其綺反聖人以必不必故無兵衆人以不必必之故多兵順於兵故行有求兵恃之則亡理雖必然猶不必之斯至順矣兵其安有達道之士隨逐物情理雖必然猶不固執故無交爭也理雖未必抑而必之各必其所見則乖逆生也庸庶之類妄為封執理不必爾而固必之既忤物情則多乖矣物各順性則足足則無求心有貪求故任於執固之情也慎於兵慎或作順盧文弨曰今書慎作順不得已而用之以恬惔為上者未之亡也不能大順群命而好乖逆物情者則幾亡吾寶矣恬徒謙反惔徒暫反本亦作淡趙諫議本惔作淡小夫之知不離苞苴牘敝精神乎蹇淺而欲兼濟道物太一形虛若是者迷惑於宇宙形纍不知太初彼至人者歸精神乎無始而甘冥乎無何有之鄉水流乎無形發泄乎太清悲哉乎汝為知在毫毛而不知大寧苞苴以遺牘以問遺問之具小知所殉小夫猶匹夫也苞苴香草也竿牘竹簡也夫搴芳草以相贈折簡牘以相問者斯蓋俗中細務固非丈夫之所忍為之知音智注及下為知同不離力智反苞苴子餘反司馬云苞苴有苞裹也竿音干牘音獨司馬云謂竹簡為書以相問遺修意氣也以遺唯季反下同昏於小務所得者淺好為遺問徇於小務可謂勞精神於跛蹇淺薄之事不能遊虛涉遠矣敝精神郭婢世反一音必世反小夫之知而欲兼濟導物經虛涉遠志大神敝形為之纍則迷惑而失致也以蹇淺之知而欲兼濟群物導達群生望得虛空其形合太一之玄道者終不可也此人迷於古今形纍於六合何能照知太初之妙理耶道物音導注同盧文弨曰今書作導物無始妙本也無何有之鄉道境也至德之人動而常寂雖復兼濟道物而神凝無始故能和光混俗而恆寢道鄉也甘冥如字本亦作瞑又音眠俞樾曰釋文冥如字又云本亦作瞑又音眠當從之瞑眠古今字文選養生論達旦不瞑李善注曰瞑古眠字是也甘瞑即甘眠徐無鬼篇孫叔敖甘寢秉羽而郢人投兵司馬云言叔敖願安寢恬臥以養德於廟堂之上折衝於千里之外此云甘瞑彼云甘寢其義一也並謂安寢恬臥也釋文讀冥如字失之淮南子俶真篇曰甘瞑於溷澖之域即本之此泊然無為而任其天行也無以順物如水流行隨時適變不守形跡跡不離本故雖應動恆發泄於太清之極也發泄息列反徐以世反泊然步各反為知所得者細悲哉乎一本作悲哉悲哉為于僞反任性大寧而至苞苴竿牘何異毫毛如斯運智深可悲歎精神淺薄詎知乎至寂之道耶趙諫議本作導趙本作瞑宋人有曹商者為宋王使秦其往也得車數乘王說之益車百乘反於宋見莊子曰夫處窮閭厄巷困窘織屨槁項黃馘者商之所短也一悟萬乘之主而從車百乘者商之所長也姓曹名商宋人也為宋偃王使秦應對得所秦王愛之遂賜車百乘乘駟馬也宋王司馬云偃王也使秦所吏反數所主反乘繩證反下同王說音悅窘急也言貧窮困急織履以自供頸項枯槁而頭面黃瘦而馘厲當爾之際是商之所短也一使強秦遂使秦王驚悟遺車百乘者是商之智數長也以此自多矜夸莊子也厄於懈反慶藩案廣雅閭居也古謂里中道為巷亦謂所居之宅為巷廣雅弄也今通作居弄巷古字通閭巷皆居也故窮閭或曰窮巷窘與隕反又巨韻反槁苦老反又袪矯反本亦作矯居表反項李云槁項羸瘦貌司馬云項槁立也黃馘古獲反徐況璧反爾雅云獲也司馬云謂面黃熟也俞樾曰馘者俘馘也非所施於此馘疑之假字說文部頭痛也黃謂頭痛而色黃莊子曰秦王有病召醫破潰痤者得車一乘舐痔者得車五乘所治愈下得車愈多子豈治其痔邪何得車之多也子行矣夫事下然後功高功高然後祿重故高遠恬淡者遺榮也癢熱毒腫也痔下漏病也莊生風神俊悟志尚清遠既而縱此奇辨以挫曹商故郭注云夫事下然後功高功高然後祿重高遠恬淡者遺榮也秦王司馬云惠王也痤徂禾反舐字又作食紙反痔治紀反愈下本亦作俞同魯哀公問乎顏闔曰吾以仲尼為貞幹國其有瘳乎言仲尼有忠貞幹濟之德欲命為卿相魯邦亂病庶瘳差矣瘳敕由反曰殆哉圾乎仲尼方且飾羽而畫從事華辭以支為旨忍性以視民而不知不信受乎心宰乎神夫何足以上民彼宜女與豫頤與誤而可矣今使民離實學僞非所以視民也為後世慮不若休之難治也圾危也夫至人以民靜為安今一為貞幹則遺高跡於萬世令飾競於仁義而雕畫其毛彩百姓既危至人亦無以為安也殆近也圾危也以貞幹跡率物物既失性仲尼何以安也汲魚及反又五臘反危也令飾力呈反下同凡言方且皆謂後世飾畫非任真也方將貞幹輔相魯廷萬代奔逐修飾羽儀喪其真性也將令後世之從事者無實而意趣橫出也聖跡既彰令從政任事情僞辭華析派分流為意旨也後世人君將慕仲尼之遐軌而遂忍性自矯僞以臨民上下相習遂不自知也後代人君慕仲尼遐軌安忍情性用之臨人上下相習矯僞黔黎而不知已無信實也以華僞之跡教云蒼生稟承心靈宰割真性用此居人之上何足稱哉以視音示下同今以上民則後世百姓非直外形從之而已乃以心神受而用之不能復自得於體中也後代百姓非直外形從之乃以心神受而用之不能復自得之性以此居民上何足可安哉能復扶又反彼百姓也女哀公也彼與女各自有所宜相效則失真此即今之見驗彼百姓也女哀公也百姓與汝各有所宜若將汝所宜與百姓不可也女與音餘又如字下頤與同之見賢遍反效彼非所以養己也豫我也頤養也我與百姓怡養不同譬如魚鳥升沈各異若以汝所養衛物物我俱失也正不可也以貞幹之跡錯誤行之正不可也家世父曰彼宜汝與言仲尼之道果有宜於汝者乎豫頤與言將待我以養者乎周易序卦曰頤者養也以為宜與而待養之若謂國可以有瘳則誤矣意以哀公之所云可者誤也明不謂當時也離實性學僞法不可教示黎民慮後世荒亂不如休止也離實力智反治則僞故聖人不治也捨己效物聖人不治也趙諫議本世德堂本圾作汲注同釋文亦作汲從事二字依世德堂本改之字依世德堂本改施于人而不忘非天布也商賈不齒雖以事齒之神者弗齒布而識之非芻狗萬物也二儀布生萬物豈恩也施於始豉反下注同而識如字又申志反況士君子乎夫能施求報商客尚不齒理況君子士人乎商賈音古要能施惠故於事不得不齒以其不忘故心神忽之此百姓之大情也施而不忘未合天道能施恩惠於物事不得不齒為責求報心神輕忽不録百姓之情也事之者性情也世德堂本事作士為外刑者金與木也為內刑者動與過也宵人之離外刑者金木訊之離內刑者陰陽食之夫免乎外內之刑者唯真人能之金謂刀鋸斧鉞木謂捶楚桎梏鋸音據戉音越盧文弨曰今書作鉞捶之反桎之實反梏古毒反靜而當則外內無刑不由明坦之塗者謂之宵人宵暗夜也離罹也訊問也暗惑之人罹於憲網身遭枷杻斧鉞之刑也宵人王云非明正之徒謂之宵夜之人也俞樾曰郭注曰不由明坦之塗者謂之宵人釋文引王注云非明正之徒謂之宵夜之人也皆望文生義未為確詁宵人猶小人也禮記學記篇宵雅肄三鄭注曰宵之言小也習小雅之三謂鹿鳴四牡皇皇者華也然則宵人為小人猶宵雅為小雅矣字亦作肖方言曰小也史記太史公自序申呂肖矣徐廣曰肖音痟痟猶衰微義亦相近文選江文通雜體詩宵人重恩光李善注引春秋演孔圖曰宵人之世多飢寒宋均曰宵猶小也此說得之之本又作訊音信問也盧文弨曰說文有訊無俗字動而過分則性氣傷於內金木訊於外也若不止分則內結寒暑陰陽殘食之也自非真人未有能止其分者故必外內受刑但不問大小耳心若死灰內不滑靈府也形同槁木外不挂桎梏唯真人哉世德堂本作訊釋文同世德堂本外內作內外肖字依方言改也字依下句刪孔子曰凡人心險於山川難於知天天猶有春秋冬夏旦暮之期人者厚貌深情故有貌願而益有長若不肖有順悁而達有堅而縵有緩而釬故其就義若渴者其去義若熱故君子遠使之而觀其忠近使之而觀其敬煩使之而觀其能卒然問焉而觀其知急與之期而觀其信委之以財而觀其仁告之以危而觀其節醉之以酒而觀其側雜之以處而觀其色九徵至不肖人得矣人心難知甚於山川過於蒼昊厚深之狀列在下文願真也不肖不似也人有形如真而心益虛浮也有心實長者形如不肖也願音願廣雅云謹也俞樾曰益當作溢溢之言驕溢也荀子不苟篇以驕溢人是也謹願與驕溢義正相反有長丁丈反若不肖外如長者內不似也悁急也形順躁急而心達理也有順王作慎悁音環又許沿反徐音絹三蒼云急腹也王云研辨也外慎研辨常務質訥盧文弨曰今書音義作音儇兩研字俱作堅言人情貌之反有如此者縵緩也釬急也自有形如堅固而實散縵亦有外形寬緩心內躁急也縵武半反又武諫反李云內實堅外如縵也釬胡旦反又音干急也一云情貌相反俞樾曰縵者慢之假字釬者悍之假字堅強而又惰慢紓緩而又桀悍故為情貌相反也但為難知耳未為殊無跡人有就仁義如渴思水捨仁義若熱逃火雖復難知未為無跡徵驗具列下文也遠使忠佞斯彰咫步敬慢立明者也煩極任使察其能卒問近對觀其願智卒然寸忽反其知音智忽卒與期觀信契也仁者不貪告危亡驗節操至人酒不能昏法則男女參居貞操不易其側側不正也一云謂醉者喜傾側冠也王云側謂凡為不正也側或作則俞樾曰釋文曰側不正也一云謂醉者喜傾側冠也王云側謂凡為不正也然上文觀其忠觀其敬云云所觀者皆舉美德言之此獨觀其不正則不倫矣諸說皆非也其云側或作則當從之則者法則也國語周曰威儀有則既醉之後威儀反反威儀佖佖是無則矣故曰醉之以酒而觀其則周書官人篇作醉之酒以觀其恭與此語意相近大戴禮文王官人篇作醉之以觀其不失也不失即謂不失法則也家世父曰釋文側不正也一云謂醉者喜傾側冠也是舊皆作醉之以酒以觀其側側當為則詩曰飲酒孔嘉維其令儀所謂則也君子易觀不肖難明然視其所以觀其所由察其所安搜之有塗亦可知也九事徵驗小人君子厚貌深情必無所避易觀以豉反搜之所求反闕誤引江南古藏本順作慎徵字依下文補語字及下文字依諸子平議改正考父一命而傴再命而僂三命而俯循牆而走孰敢不軌如而夫者一命而呂巨再命而於車上鳷三命而名諸父孰協唐許言人不敢以不軌之事侮之考成也父大也有考成大德而履正道故號正考父則孔子十代祖宋大夫也士一命大夫二命卿三命也傴曲循牆並敬容極恭卑退若此誰敢將不軌之事而侮之也正考父音甫宋湣公之玄孫弗父何之曾孫而傴紆矩反而僂力矩反三命公士一命大夫再命卿三命而夫謂凡夫也唐謂堯也許謂許由也言而夫與考父者誰同於唐許之事也而夫鄙夫也諸父伯叔也凡夫篤競軒冕一命則呂巨夸華再命則援綏作舞三命善識自高下呼伯叔之名然考父謙夸各異格量勝劣誰同唐堯許由無為禪讓之風哉而夫郭云凡夫也呂巨矯貌家世父曰釋文呂巨矯貌疑此不當為矯方言呂長也東齊曰宋魯曰呂說文巨大剛也亦通作巨大也呂巨謂自高大當為矜張之意云矯非也孰協唐許協同也唐唐堯許許由皆崇讓者也言考父與而夫誰同於唐許也盧文弨曰舊作協同也今從宋本家世父曰郭象注唐謂堯許謂許由言而夫與考父誰同於唐許之事今按孰協唐許與孰敢不軌對文言如而夫者誰知比同於唐許哉郭注誤賊莫大乎德有心而心有睫及其有睫也而內視內視而敗矣凶德有五中德為首何謂中德中德也者有以自好也而其所不為者也有心於為德非真德也夫真德者忽然自得而不知所以也役智勞慮有心為德此賊害之甚也率心為德猶之可耳役心於眉睫之間則僞已甚矣睫音接俞樾曰郭注曰役心於眉睫之間則僞已甚矣然正文言心有睫非役心於眉睫之謂郭注非也心有睫謂以心為睫也人於目之所不接而以意度之謂其如是是心有睫也聖人不逆詐不意不信豈如是乎故曰賊莫大乎德有心而心有睫下文曰及其有睫也而內視內視而敗矣然則心有睫正內視之謂內視者非謂收視返聽也謂不以目視而以心視也後世儒者執一理以斷天下事近乎心有睫矣乃欲探射幽隱以深為事則心與事俱敗矣率心為役用心神於眼睫緣慮逐境不知休止致危敗甚矣探射食亦反謂心耳眼舌鼻也曰此五根禍因此謂凶德也五根禍主中德為無心也訾也夫自是而非彼則攻之者非一故為凶首也若中無自好之情則恣萬物之所是所是各不自失則天下皆思奉之矣訾也用心中所好者自以為是不同己為者訾而非之以心中自是為得故曰中德自好呼報反注同匹爾反又芳爾反郭云訾也訾也子爾反皆思奉之矣本或作皆畢事也得字依道藏本改窮有八極達有三必形有六府美髯長大壯麗勇敢八者俱過人也因以是窮緣循偃佒困畏不若人三者俱通達知慧外通勇動多怨仁義多責達生之情者傀達於知者肖達大命者隨達小命者遭八極三必窮達猶人身有六府也列下文矣窮於受役也然天下未曾窮於所短而恆以所長自困美恣媚也髯髭鬢也長高也大粗大也壯多力麗妍華勇猛敢果決也蘊此八事超過常人役既多因以窮困也美髯人鹽反未曾才能反緣循杖物而行者也偃佒不能俯執者也困畏怯弱者也此三者既不以事見任乃將接佐之故必達也循順也緣物順他不能自立也偃佒仰首不能俯執也困畏困苦怯懼也有此三事不如恆人所在通達也偃佒於丈反本亦作央同偃佒守分歸一也家世父曰郭注偃佒不能俯執者釋文偃佒守分歸一也疑偃佒當為偃仰猶言俯仰從人也大雅顒顒卬卬韓詩外傳作顒顒盎盎央卬亦一聲之轉慶藩案緣循偃佒緣緣飾也見晏子春秋內篇問下循因循也偃矢志也佒當作早知也見說文字注杖物直亮反通外則以無崖傷其內也自持智慧照物外通塵境也知慧音智怯而靜乃厚其身耳雄健躁擾必招讎隙乃厚其身耳元嘉本厚作後一本作乃後恆無怨也天下皆望其愛然愛之則有不周矣故多責仁義則不周必有多責也傀然大恬解之貌也傀郭徐呼懷反字林公回反云偉也恬解音蟹肖釋散也注云肖釋散也傀恬解也達悟之崖真性虛照傀然縣解無係戀也於知音智者肖音消郭云釋散也王念孫曰郭象曰傀然大恬解之貌肖釋散也案郭以傀為大是也以肖為釋散則非方言曰肖小也廣雅同肖與傀正相反言任天則大任智則小也肖猶宵也學記宵雅肄三鄭注曰宵之言小也宵肖古同聲故漢書刑法志肖字通作宵史記太史公自序申呂肖矣徐廣曰肖音痟痟猶衰微義亦相近也慶藩案肖司馬作胥文選謝靈運初郡詩注引司馬云傀讀曰瑰瑰大也情在故曰大也胥多智也謝靈運齊中讀書詩注江文通雜體詩注並又引云傀大也情在無故曰大釋文闕泯然與化俱也大命大年假如彭祖壽考隨而順之亦不厭其長久以為勞苦也每在節上住乃悟也小命小年也遭遇也如殤子促齡所遇斯適曾不介懷耳闕誤引劉得一本責下有六者所以相刑也七字道藏本肖作消受字依注文改去字依文選改江文通等八字因雜體詩注無此文刪人有見宋王者錫車十乘以其十乘驕稚莊子錫與也稚後也宋襄王時有庸瑣之人游宋妄說宋王錫車十乘用此驕炫排莊周於己後自矜物先也十乘繩證反下同驕直吏反又池夷反李云自驕而莊子也盧文弨曰今書作稚慶藩案稚亦驕也集韻稚陳尼切自驕矜貌管子軍令篇工以雕文刻鏤相稚尹知章注稚驕也王引之經義述聞云詩載馳篇衆稚且謂既驕且狂也狂字依毛詩改莊子曰河上有家貧恃緯蕭而食者其子沒於淵得千金之珠其父謂其子曰取石來鍛之夫千金之珠必在九重之淵而驪龍頷下子能得珠者必遭其睡也使驪龍而寤子尚奚微之有哉今宋國之深非直九重之淵也宋王之猛非直驪龍也子能得車者必遭其睡也使宋王而寤子為齏粉夫葦蘆也蕭蒿也家貧織蘆蒿為薄賣以供食鍛椎也驪黑龍也頷下有千金之珠也譬譏得車之人也緯蕭如字緯織也蕭荻蒿也織蕭以為畚而賣之本或作葦音同慶藩案文選顏延年陶徵士誄注引司馬云蕭蒿也織蒿為薄北堂書鈔簾部太平御覽七百並引云蕭蒿也織緝御覽作緯蒿為薄簾也御覽九百九十七又引云蕭蒿也緯織也織蒿為箔釋文闕鍛之丁亂反謂槌破之盧文弨曰鍛舊從訛今改正九重直龍反驪龍力馳反驪龍黑龍也頷下戶感反夫取富貴必順乎民望也若挾奇說乘天衢以嬰人主之心者明主之所不受也故如有所譽必有所試於斯民不違僉曰舉之以合萬夫之望者此三代所以直道而行之也懷忠貞以感人主者必得非常之賞而用左道使其說佞媚君王僥幸於富貴者故有驕稚之容亦何異遭驪龍睡得珠耶餘詳注意子兮反說文作粉夫音符若挾戶牒反僉曰七潛反或聘於莊子莊子應其使曰子見夫犧牛乎衣以文繡食以芻叔及其牽而入於大廟雖欲為孤犢其可得乎寓言不明聘人姓氏族故言或也犧養也君王預前三月養牛祭宗廟曰犧也其使所吏反樂生者畏犧而辭聘髑髏聞生而矉此死生之情異而各自當也芻草也菽豆也犧養豐臨祭日求為孤犢不可得也況祿食之人例多夭折嘉遁之士方足全生莊子清高笑彼名利衣以於既反食以音嗣芻叔初俱反芻草也叔大豆也大廟音太髑音獨髏音樓矉毗人反子六反趙諫議本叔作菽莊子將死弟子欲厚葬之莊子曰吾以天地為棺槨以日月為連璧星辰為珠璣萬物為齎送吾葬具豈不備邪何以加此莊子妙達玄道逆旅形骸故棺槨天地爐治兩儀珠璣星辰變化三景資送備矣門人厚葬深乖造物也珠璣音祈又音機一音其既反齎音資本或作濟子詣反弟子曰吾恐烏鳶之食夫子也莊子曰在上為烏鳶食在下為螻蟻食奪彼與此何其偏也鳶鴟也門人荷師主深恩也將欲厚葬避其烏鳶豈知厚葬還遭螻蟻情好所奪偏私之也鳶以全反螻音樓蟻魚綺反以不平平其平也不平以不徵徵其徵也不徵明者唯為之使神者徵之夫明之不勝神也久矣而愚者恃其所見入於人其功外也不亦悲乎以一家之平平萬物未若任萬物之自平也無情與奪委任均平此真平也若運情慮均平萬物欲起心已不平矣徵應也不因萬物之自應而欲以其所見應之則必有不合矣聖人無心有感則應此真應也若有心應物不能應也徵應也夫執其所見受使多矣安能使物哉自炫其明情應於務為物驅使何能役人也唯任神然後能至順故無往不應也神者無心寂然不動能無不應也明之所及不過於形骸也至順則無遠近幽深皆各自得明則有心應務為物驅役神乃無心應感無方有心不及無心存應不及忘應格量可知也夫至順則用發於彼而以藏於物若恃其所見執其自是雖欲入人其功外矣夫忘懷應物者為而不恃功成不居愚惑之徒自執其用叨人功績歸入己身雖欲矜伐其功外矣迷忘妄如此深可悲哉世德堂本作其功之外也
