body:
  text: 外篇天地第十二以事名篇天地雖大其化均也萬物雖多其治一也人卒雖衆其主君也君原於德而成於天故曰玄古之君天下無為也天德而已矣均於不為而自化也夫二儀生育覆載無窮形質之中最為廣大而新新變化其狀不殊念念遷謝實惟均等所謂亭之也故云天地與我並生天地釋名云天顯也高顯在上也又坦也坦然高遠也地底也其體底下載萬物也禮統云天地者元氣之所生萬物之祖也易説云元氣初分清輕上為天濁重下為地一以自得為治夫四生萬物其類最繁至於率性自得斯理唯一所謂毒之也故又云萬物與我為一其治直吏反注同下官治並注亦同天下異心無心者主也黔首卒隸其數雖多主而君者一人而已無心因任允當斯位人卒尊忽反以德為原無物不得得者自得故得而不謝所以成天也原本也夫君主人物必須以德為宗物各自得故全成自然之性君原原本也任自然之運動玄遠也古之君謂三皇已前帝王也言玄古聖君無為而治天下也蓋何為哉此引古證今成天德之義也趙諫議本已作止以道觀言而天下之君正以道觀分而君臣之義明以道觀能而天下之官治以道泛觀而萬物之應備故通於天地者德也行於萬物者道也上治人者事也能有所藝者技也技兼於事事兼於義義兼於德德兼於道道兼於天故曰古之畜天下者無欲而天下足無為而萬物化淵靜而百姓定記曰通於一而萬事畢無心得而鬼神服無為者自然為君非邪也以虛通之理觀應物之數而無為因任之君不用邪僻之言者故理當於正道家世父曰言者名也正其君之名天下自然聽命焉故曰名之必可言也一衷諸道而已矣非邪也似嗟反本又作為各當其分則無為位上有為位下也夫君道無為而臣道有事尊卑勞逸理固不同譬如首自居上足自居下用道觀察分義分明官各當其所能則治矣夫官有高卑能有優劣能受職則物無私得是故天下之官治也無為也則天下各以其無為應之夫大道生物性情不同率己所以悉皆備足或走或飛咸應其用不知所以豈復措心故以理遍觀則庶物之應備夫子曰夫道覆載萬物者也洋洋乎大哉君子不可以不刳心焉無為為之之謂天無為言之之謂德愛人利物之謂仁不同同之之謂大行不崖異之謂寬有萬不同之謂富故執德之謂紀德成之謂立循於道之謂備不以物挫志之謂完君子明於此十者則韜乎其事心之大也沛乎其為萬物逝也若然者藏金於山藏珠於淵不利貨財不近貴富不樂壽不哀夭不榮通不醜窮不拘一世之利以為己私分不以王天下為已處顯顯則明萬物一府死生同狀有心則纍其自然故當刳而去之夫子者老子也莊子師老君故曰夫子也刳去也灑也虛通之道包羅無外二儀待之以覆載萬物得之以化生何莫由斯最為物本歎洋洋之美大以勗當世之君王可不法道之無為洗去有心之纍者邪夫子司馬云莊子也一云老子也此兩夫子曰元嘉本皆為別章崔本亦爾覆載芳富反洋洋音洋又音詳不刳口吳反又口侯反崔本作軒云寬悅之貌而去起呂反不為此為而此為自為乃天道無為為之率性而動也天機自張故謂之天此不為為也不為此言而此言自言乃真德寂然無説而應答無方譬縣鏡高堂物來斯照語默不殊故謂之德也此不言而言者也此任其性命之情也慈若雲行愛如雨施心無偏執德澤弘普措其性命故謂之仁也萬物萬形各止其分不引彼以同我乃成大耳夫刻雕衆形而性情各異率其素分僉合自然任而不割故謂之大也玄同彼我則萬物自容故有餘夫韜光晦迹而混俗揚波若樹德不異於人立行豈殊於物而心無崖際若萬頃之波林藪蒼生可謂寬容矣我無不同故能獨有斯萬位居九五威誇萬乘任庶物之不同順蒼生之為異而群性咸得故能富有天下也德者人之綱要能持已前之德行者可謂群物之綱紀也非德而成者不可謂立德行既成方可立功而濟物也夫道非偏物也循順也能順於虛通德行方足循音旬或作修內自得也挫屈也一毀譽混榮辱不以世物屈節其德完全挫作臥反心大故事無不容也韜包容也君子賢人肆於已前十事則能包容物務心性寬大也韜吐刀反廣雅云藏也俞樾曰郭注未得事字之義事心猶立心也言其立心之大也禮記郊特牲篇鄭注曰事猶立也釋名曰事倳也倳立也並其證也如郭注則是心足以容事而非事心矣呂氏春秋論人篇事心乎自然之塗亦以事心連文義與此同足證郭注之誤德澤滂沛任萬物之自往也逝往也心性寬間德澤滂沛故為群生之所歸往也沛普貝反字林云流也物逝崔本逝作啓云開也滂沛普旁反不貴難得之物若如前行便是無為既不羡於榮華故不貴於寶貨是以珠生於水不索故藏之於淵金出於山不求故韜之於嶽也乃能忘我況貨財乎雖得珠玉尚不貪以資身常用貨財豈復將為利也自來寄耳心常去之遠也寄去寄來不哀不樂故外疏遠乎軒冕內不近乎富貴也不近附近之近所謂縣解假令壽年延永不以為樂性命夭促不以為哀不樂音洛縣解上音玄下音蟹忘壽夭於胸中況窮通之間哉富貴榮達不以為榮華貧賤窒塞不以為醜辱壽夭不以措意榮辱之情豈容介懷皆委之萬物也光臨宇宙統御天下四海珍寶總繫一人而行不利貨財委之萬國豈容拘束入己用為私分也忽然不覺榮之在身覆育黔黎王領天下而推功於物忘其富貴故不以己大而榮顯也不以王于況反下王德並同不顯則默而已明彰也雖坐汾陽喪其天下必也顯智豈曰韜光也蛻然無所在也忘於物我故萬物可以為一府冥於變化故死生同其形狀死生無變於己況窮通夭壽之間乎蛻然始鋭反又音悅闕誤引張君房本藏作沈趙諫議本已作止夫子曰夫道淵乎其居也漻乎其清也金石不得無以鳴故金石有聲不考不鳴萬物孰能定之夫王德之人素逝而恥通於事立之本原而知通於神故其德廣其心之出有物採之故形非道不生生非德不明存形窮生立德明道非王德者邪蕩蕩乎忽然出勃然動而萬物從之乎此謂王德之人視乎冥冥聽乎無聲冥冥之中獨見曉焉無聲之中獨聞和焉故深之又深而能物焉神之又神而能精焉故其與萬物接也至無而供其求時騁而要其宿大小長短修遠至理深玄譬猶淵海漻然清潔明燭眉淵則歎其居寂以深澄漻則歎其雖動而恆潔也本亦作君字者漻李良由反徐力蕭反廣雅下巧反云清貌聲由寂彰鳴由寂彰應由真起也因以喻體道者物感而後應也考擊也夫金石之內素蘊宮商若不考擊終無聲響亦至人之心實懷聖德物若不感無由顯應前託淵水以明至道此寄金石以顯聖心應感無方喻彼明鏡方茲虛谷物來斯應應而無心物既修短無窮應亦方圓無定家世父曰淵穆澄清之中而天機自動焉夫機之動也有所以動之者也而動無常金石無常矣而韶夏濩武由所動而樂生焉所以動之者物莫能定也任素而往耳非好通於事也素真也逝往也王德不驕不任真而往既抱朴以清高故羞通於物務非好呼報反本立而知不逆神者不測之用也常在理上往而應物也不測之神知通於物此之妙用必資於本欲示本能起用用不乖本義也而知音智注同任素通神而後彌廣夫清素無為任真而往神知通物而恆立本原用不乖體動不傷寂德行如是豈非大中之道耶物採之而後出耳非先物而唱也採求也夫至聖虛懷而物我斯應自非物求聖德無由顯出聖心聖心之出良由物採欲示和而不唱不為物先形者七尺之身生者百齡之命德者能澄之智道者可通之境也道能通生萬物故非道不生德能鑒照理原故非德不明老經云道生之德畜之也存任也窮盡也任形容之妍醜盡生齡之夭壽立盛德以匡時用至道以通物能如是者其唯王德乎忽勃皆無心而應之貌動出無心故萬物從之斯蕩蕩矣故能存形窮生立德明道而成王德也蕩蕩寬平之名忽勃無心之貌物感而動逗機而出因循任物物則從之具衆美故為王德也至道深玄聖心凝寂非色不可以目視絶聲不可以耳聽若夫視聽而不寄之於寂則有暗昧而不和也雖復冥冥非色而能陶甄萬象乃云寂寂無響故能諧韻八音欲明從體起用功能如是者也窮其原而後能物物即有即無即寂即應遣之又遣故深之又深既而窮理盡性故能物衆物也極至順而後能盡妙神者不測之名應寂相即有無洞遣既而非測非不測亦非非不非測乃是神之精妙我確斯而都任彼則彼求自供遣之又遣乃曰至無而接物無方隨機稱適千差萬品求者即供若縣鏡高堂物來斯照也而供音恭本亦作恭確苦學反斯音賜又如字皆恣而任之會其所極而已騁縱也宿會也若夫體故至無所以隨求稱適故能順時因任應物多方要在會歸而不滯一故或大或小乍短乍長乃至修遠恣其來者隨彼機務悉供其求應病以藥理無不當黃帝遊乎赤水之北登乎崑崙之丘而南望還歸遺其玄珠使知索之而不得使離朱索之而不得使喫詬索之而不得也乃使象罔象罔得之黃帝曰異哉象罔乃可以得之乎此寄明得真之所由赤是南方之色心是南方之藏水性流動位在北方譬迷心緣鏡暗無所照故言赤水北也崑丘身也南是顯明之方望是觀見之義玄則疏遠之目珠乃珍貴之寶欲明世間群品莫不身心迷妄馳騁耽著無所覺知暗似北方動如流水迷真喪道實此之由今欲返本還源祈真訪道是以南望示其照察還歸表其復命故先明失真之處後乃顯得道之方所顯方法列在下文赤水李云水出崑崙山下還歸音旋玄珠司馬云道真也慶藩案文選劉孝標廣絶交論注引司馬云赤水假名玄珠喻道也與釋文異言用知不足以得真索求也故絶慮不可以心求也使知音智注及下皆同索之所白反下同非色不可以目取也聰明喫詬失真愈遠喫詬言辨也離言不可以辨索喫口懈反詬口豆反司馬云喫詬多力也家世父曰廣韻喫同聲也詬怒也怒亦聲也集韻云喫詬力諍者是也知者以神索之離朱索之形影矣喫詬索之聲聞矣是以愈索而愈遠也象罔者若有形若無形故曰眸而得之即形求之不得去形求之亦不得也釋文引司馬云喫詬多力也誤罔象無心之謂離聲色絶思慮故知與離朱自涯而反喫詬言辨用力失真唯罔象無心獨得玄珠也明得真者非用心也象罔然即真也離婁迷性恃明目而喪道軒轅悟理歎罔象而得珠勗諸學生故可以不離形去智黜聰隳體也趙諫議本還作旋水字依胡刻本文選注改堯之師曰許由許由之師曰齧缺齧缺之師曰王倪王倪之師曰被衣已上四人並是堯時隱士厭穢風塵懷道抱德清廉潔己不同人世堯知其賢欲讓天下莊生示有承稟故具列其師資也王倪徐五兮反被衣音披堯問於許由曰齧缺可以配天乎吾藉王倪以要之謂為天子欲因其師以要而使之配合也藉因也堯云齧缺之賢者有合天位之德庶因王倪遙能屈致情事不決故問許由要之一遙反注同許由曰殆哉圾乎天下齧缺之為人也聰明睿知給數以敏其性過人而又乃以人受天彼審乎禁過而不知過之所由生與之配天乎彼且乘人而無天方且本身而異形方且尊知而火馳方且為緒使方且為物絯方且四顧而物應方且應衆宜方且與物化而未始有恆夫何足以配天乎雖然有族有祖可以為衆父而不可以為衆父父治亂之率也北面之禍也南面之賊也圾危也殆近也圾危也若要齧缺讓萬乘危亡之徵其則不遠也圾本又作岌五急反又五合反郭李云危也聰敏過人則使人跂之屢傷於民也睿聖也給捷也敏速也夫聖人治天下也冕旒垂目黈纊塞耳所以杜聰明不欲多聞多見今齧缺乃內懷聖知外眩聰明詞鋒捷辨計數弘遠德行性識所作過人其迹既彰必以為患危亡之狀列在已下給數音朔用知以求復其自然物之喪真其日已久乃以心智之術令復其初故自然之性失之遠矣夫過生於聰知而又役知以禁之其過彌甚矣故曰無過在去知不在於強禁過之所由生者知也言齧缺但知審禁蒼生之過患而不知患生之由智也在去起呂反於強其丈反若與之天下彼且遂使後世任知而失真若與天位令御群生必運乎心智伐乎天理則物皆喪己無復自然之性也夫以萬物為本則群變可一而異形可同斯迹也將遂使後世由己以制物則萬物乖矣方將也夫聖人無心因循任物今齧缺以己身為本引物使歸令天下異形從我之化物之失性實此之由後世之患自斯而始也方且如字凡言方且者言方將有所為也賢者當位於前則知見尊於後奔競而火馳也夫不能忘智以任物而尊知以御世遂將徇迹捨己效人馳驟奔逐其速如火矣將興後世事役之端緒端也使役也不能無為而任知御物後世勞役自此為端將遂使後世拘牽而制物絯礙也不能用道以通人方復任智以礙物也物絯徐戶隔反廣雅公才反云束也與郭義同今用廣雅音家世父曰釋文引廣雅云絯束也疑絯當為該廣韻該備也兼也漢書律曆志該藏萬物太玄經萬物該兼緒使者其緒餘足以役群倫物絯者其機緘足以包羅萬物將遂使後世指麾以動物令應務方將顧盼四方撫安萬國令彼之氓黎應我之化法令應力呈反將遂使後世不能忘善而利仁以應宜也用一己之知應衆物之宜既非無心未免危殆矣將遂使後世與物相逐而不能自得於內將我己知施與物衆令庶物從化物既失之我亦未得也此皆盡當時之宜也然今日受其德而明日承其弊矣故曰未始有恆以智理物政出多門前荷其德後遭其弊既乖淳古所以無恆其事類可得而祖效族藪也夫齧缺隱居山藪高尚其志不能混迹未足配天而混俗之中罕其輩類故志尚清遐良可效耳家世父曰族者比類之迹也祖者生物之原也從其比類而合之則萬物統於一而主宰夫物者群生之歸也從其生物之原而求之則萬物託始於無而生物者枝流之衍也未究乎生物之原而竊竊焉比類以求合而治亂繇以生君臣之禍繇以起矣衆父父者所以迹也父君也言齧缺高尚無為不夷乎俗雖其道可述適可為衆人之父而未可為父父也父父者堯也夫堯寄坐萬物之上而心馳乎姑射之山往見四子之時即在汾陽之地是以即寂而動即動而寂無為有為有為無為有有無一時動寂相即故可為君中之君父中之父所為窮理盡性玄之又玄而為衆父之父故其宜矣故郭注云衆父父者所以迹也言非但治主乃為亂率率主也若用智理物當時雖治於後必亂二塗皆以智為率治亂直吏反注同之率色類反注同又色律反夫桀紂非能殺賢臣乃賴聖知之迹以禍之桀紂賴聖知以殺賢臣故聖知是北面之禍也田桓非能殺君乃資仁義以賊之田桓資仁義以殺主故仁義南面之賊注云田桓非能殺君乃資仁義以賊之殺君音試本又作弒音同上字依宋本改堯觀乎華華封人曰嘻聖人請祝聖人華地名也今華州也封人者謂華地守封疆之人也嘻歎聲也封人見堯有聖人之德光臨天下請祝願壽富多其男子華胡化反又胡花反司馬云地名也封人司馬云守封疆人也曰嘻音熙請祝之又反又州六反使聖人壽堯曰辭使聖人富堯曰辭使聖人多男子堯曰辭夫富壽多男子實為繁撓而能體之者不廢無為故寄彼二人明茲三患辭讓之旨列在下文封人曰壽富多男子人之所欲也女獨不欲何邪前之三事人之大欲存焉女獨致辭有何意謂女獨音汝後同堯曰多男子則多懼富則多事壽則多辱是三者非所以養德也故辭夫子嗣扶疏憂懼斯重財貨殷盛則事業實繁命壽延長則貽困辱三者未足養無為之德適可以益有為之纍所以並辭封人曰始也我以女為聖人邪今然君子也天生萬民必授之職多男子而授之職則何懼之有富而使人分之則何事之有夫聖人鶉居而鷇食鳥行而無彰天下有道則與物皆昌天下無道則修德就間千歲厭世去而上仙乘彼白雲至於帝鄉三患莫至身常無殃則何辱之有我始言女有無雙照便為體道聖人今既舍有趣無適是賢人君子也物皆得所而志定也天地造化為萬物各有才能量才授官有何憂懼寄之天下故無事也百姓豐饒四海殷實寄之群有而不以私焉斯事無為也無意而期安也鶉音淳居鶉居謂無常處也又云如鶉之居猶言野處仰物而足鶉鶉也野居而無常處鷇者鳥之子食必仰母而足聖人寢處儉薄譬彼鶉供膳裁充方茲鷇鳥既無心於侈靡豈有情於滋味乎鷇口豆反食爾雅云生哺鷇鷇食者言仰物而足也盧文弨曰舊生訛主今改正率性而動非常迹也彰文迹也夫聖人灰心滅智而與物俱冥猶如鳥之飛行無蹤迹而可見也猖狂妄行而自蹈大方也運屬清夷則撫臨億兆物來感我則應時昌盛郭注云猖狂妄行恐乖文旨雖湯武之事苟順天應人未為不間也故無為而無不為者非不間也時逢擾亂則混俗韜光修德隱迹全我生道嘉遁間居逍遙遁世所謂隱顯自在用捨隨時就間音間注同夫至人極壽命之長任窮之變其生也天行其死也物化故云厭世而上仙也夫聖人達生死之不二通變化之為一故能盡天年之修短厭囂俗以消升何必鼎湖之舉獨為上仙安期之壽方稱千歲上仙音仙氣之散無不之精靈上升與太一而冥合乘雲御氣屆於天地之鄉三患前富壽多男子也夫駕造物而來往乘變化而遨遊三患本自虛無七尺來從非有殃辱之事曾何足云通字依王叔岷説改封人去之堯隨之曰請問請言既訖封人於是去之堯方悟其非所以請問封人曰退已所疑已決宜速退歸闕誤引江南古藏本已作紀堯治天下伯成子高立為諸侯堯授舜舜授禹伯成子高辭為諸侯而耕禹往見之則耕在野禹趨就下風立而問焉曰昔堯治天下吾子立為諸侯堯授舜舜授豫而吾子辭為諸侯而耕敢問其故何也伯成子高不知何許人也蓋有道之士伯成子高通變經云老子從此天地開闢以來吾身一千二百變後世得道伯成子高是也唐虞之世南面稱孤逮乎有夏退耕於野出處頓殊有何意謂子高曰昔堯治天下不賞而民勸不罰而民畏今子賞罰而民且不仁德自此衰刑自此立後世之亂自此始矣夫子闔行邪無落吾事俋俋乎耕而不顧夫賞罰者所以著勸畏也而堯以無為為治物物從其化故百姓不待其褒賞而自勉行善無勞刑罰而畏惡不為此顯堯之聖明其德如是盛行賞罰百姓猶不仁至德既衰是以刑書滋起故知將來之亂從此始矣夫禹時三聖相承治成德備功美漸去故史籍無所載仲尼不能間是以雖有天下而不與焉斯乃有而無之也故考其時而禹為最優計其人則雖三聖故一堯耳時無聖人故天下之心俄然歸啓夫至公而居當者付天下於百姓取與之非己故失之不求得之不辭忽然而往侗然而來是以受非毀於廉節之士而名列於三王未足怪也莊子因斯以明堯之弊弊起於堯而釁成於禹況後世之無聖乎寄遠迹於子高便棄而不治將以絶聖而反一遺知而寧極耳其實則未聞也夫莊子之言不可以一途詰或以黃帝之迹禿堯舜之脛豈獨貴堯而賤禹哉故當遺其所寄而録其絶聖棄智之意焉闔何不也落廢也俋俋耕地之貌伯成謂禹為夫子夫子何不行去耶莫廢我農事於是用力而耕不復顧盼也夫三聖相承蓋無優劣但澆淳異世故其迹不同郭注云弊起於堯而釁成於禹者欲明有聖不如無聖有為不及無為故尚遠迹以明絶聖棄智者耳闔本亦作盍胡臘反無落落猶廢也俋俋徐於執反又直立反李云耕貌一云耕人行貌又音秩又於十反字林云勇壯貌治成直吏反能間間廁之間不與音豫侗音洞又音同趙諫議本便作使泰初有無無有無名一之所起有一而未形物得以生謂之德未形者有分且然無間謂之命留動而生物物成生理謂之形形體保神各有儀則謂之性性修反德德至同於初同乃虛虛乃大合喙鳴喙鳴合與天地為合其合緡緡若愚若昏是謂玄德同乎大順無有故無所名泰太初始也元氣始萌謂之太初言其氣廣大能為萬物之始本故名太初太初之時惟有此無未有於有有既未有名將安寄故無有無名泰初易説云氣之始也一者有之初至妙者也至妙故未有物理之形耳夫一之所起起於至一非起於無也然莊子之所以屢稱無於初者何哉初者未生而得生得生之難而猶上不資於無下不待於知突然而自得此生矣又何營生於已生以失其自生哉一道也有一之名而無萬物之狀夫無不能生物而云物得以生乃所以明物生之自得任其自得斯可謂德也德者得也謂得此也夫物得以生者外不資乎物內不由乎我非無非有不自不他不知所以生故謂之德也雖未有形質而受氣以有素分然且此分修短乎更無間隙故謂之命有分符問反無間如字家世父曰一陰一陽之謂道繼之者善也成之者性也物得其生所謂繼之者善也未有德之名也至凝而為命而性含焉所謂成之者性也命立而各肖乎形踐形而乃反乎性各有儀則盡性之功也莊生於此蓋亦得其恍惚留靜也陽動陰靜氤氳升降分布三才化生萬物物得成就生理具足謂之形也留動留或作流夫德形性命因變立名其於自爾一也體質保守也稟受形質保守精神形則有醜有妍神則有愚有智既而宜循軌則各自不同素分一定更無改易故謂之性也恆以不為而自得之率此所稟之性修復生初之德故至其德處同於太初不同於初而中道有為則其懷中故為有物也有物而容養之德小矣同於太初心乃虛豁心既虛空故能包容廣大無心於言而自言者合於喙鳴喙鳥口也心既虛空迹復冥物故其説合彼鳥鳴鳥鳴既無心於是非聖言豈有情於憎愛喙丁豆反又充芮喜穢二反天地亦無心而自動言既合於鳥鳴德亦合於天地天地無心於覆載聖人無心於言説故與天地合也坐忘而自合耳非照察以合之緡合也聖人內符至理外順群生唯迹與本罄無不合故曰緡緡是混俗揚波同塵萬物既若愚迷又如昏暗又解既合喙鳴又合天地亦是緡緡緡緡武巾反德玄而所順者大矣總結已前歎其美盛如是之人可謂深玄之德故同乎太初大順天下也夫子問於老聃曰有人治道若相放可不可然不然辨者有言曰離堅白若縣宇若是則可謂聖人乎若相放效強以不可為可不然為然斯矯其性情也師於老聃所以每事請答泛論無的故曰有人布行政化使人效放以己制物物失其性故己之可者物或不可己之然者物或不然物之可然於己亦爾也夫子仲尼也相方如字又甫往反本亦作放甫往反注同強以其兩反言其高顯易見堅白公孫龍守白論也孔穿之徒堅執此論當時獨步天下無敵今辨者云我能離析堅白之論不以為辨雄辨分明如縣日月於區宇故郭注云言其高顯易見也縣音玄宇司馬云辨明白若縣室在人前也易見以豉反結前問意如是之人得為聖否世德堂本作相放甫往反注同本作作方如字又甫往反老聃曰是胥易技係勞形怵心者也執留之狗成思猿狙之便自山林來丘豫告若而所不能聞與而所不能言凡有首有趾無心無耳者衆有形者與無形無狀而皆存者盡無其動止也其死生也其廢起也此又非其所以也有治在人忘乎物忘乎天其名為忘己忘己之人是之謂入於天胥相也言以是非更相易奪用此技藝係縛其身所以疲勞形體怵惕心慮也此答前問意技有本或作枝字者言是非易奪枝分葉派也技係其綺反言此皆失其常然也成思當為來田之訛自山林來宜為來藉之訛猿狙獮猴也執捉狐狸之狗多遭係頸而獵既不自在故成愁思猿猴本居山林逶迤放曠為攫便捷故失其常處狸有本作者竹鼠也執留如字本又作音同一本作亦如字司馬云竹鼠也一云執留之狗謂有能故被留係成愁思也家世父曰釋文留如字一本作狸司馬云狸竹鼠也疑狸不當為鼠秋水篇騏驥驊一日而馳千里捕鼠不如狸狌非鼠可知如司馬説字當作説文竹鼠也埤雅一名竹郭璞山海經注其音如留亦引此文執留之狗為證則此本作然山海經自謂留牛此自謂竹鼠亦未宜混而一之司馬一云執留之狗謂有能故被留繫説文留止也謂繫而止之熟玩文義言狗留繫思脫然以去猿狙之在山林號為便捷矣而可執之以來皆失其性者也於執狸之説無取當從司馬後説猿音袁狙七徐反之便婢面反徐扶面反司馬云言便捷見捕首趾猶始終也無心無耳言其自化若而皆汝也首趾終始也理絶言辨故不能聞言也又不可以心慮知耳根聽故言無心無耳也凡有識無情皆曰終始故言衆也咸不能以言説悉不可以心知汝何多設猿狙之能高張懸寓之辨令物效己豈非過乎言有形者善變不能與無形無狀者並存也故善治道者不以故自持也將順日新之化而已有形者身也無形者心也汝言心與身悉存我以理觀照盡見是空也此言動止死生盛衰廢興未始有恆皆自然而然非其所用而然故放之而自得也時有動靜物有死生事有興廢此六者自然之理不知所以然也豈關人情思慮倣效能致哉但任而順之物之自當也不在乎主自用人各有率性而動天機自張非主教天物皆忘非獨忘己復何所有哉豈惟物務是空抑亦天理非有唯事與理二種皆忘故能造乎非有非無之至也復何扶又反人之所不能忘者己也己猶忘之又奚識哉斯乃不識不知而冥於自然入會也凡天下難忘者己也而己尚能忘則天下有何物足存哉是知物我兼忘者故冥會自然之道也家世父曰有首有趾人物之所同也無心而不能慮事若鳥獸是也無耳而不能聞聲若蟲魚是也其動止其死生其廢起一皆天地之化機也化機之在天地不窮於物無形無狀推移動蕩天地之中者皆化機也而有治在人人其多事矣乎強物以從治不如忘己而聽諸物之適然也慶藩案此言唯忘己之人能與天合德也管子白心篇尹注天地忘形者也能效天地者其唯忘己乎與此同意趙諫議本留作狸字狸字依釋文本改世德堂本作狸此依釋文原本所字依趙本刪將閭葂見季徹曰魯君謂葂也曰請受教辭不獲命既已告矣未知中否請嘗薦之吾謂魯君曰必服恭儉拔出公忠之屬而無阿私民孰敢不輯薦獻也蔣閭及季姓也葂徹名也此二賢未知何許人也未詳所據魯君魯侯也伯禽之後未知的是何公魯公見葂請受治國之術雖復辭不得免君之命遂告魯君為政之道當時率爾恐不折中敢陳所告試獻吾賢必不宜幸希針艾將一本作蔣閭力於反葂字亦作音免又音晚郭音問將閭葂人姓名也一云姓將閭名或云姓蔣名閭葂也季徹人姓名也蓋季氏之族魯君或云定公知中丁仲反阿曲也孰誰也輯和也夫為政之道先須躬服恭敬儉素清約然後拔擢公平忠節之人銓衡質直無私之士獻可替否共治百姓則蕃境無虞域中清謐民歌擊壤誰敢不和不輯音集爾雅云和也又側立反郭思魚反季徹局局然笑曰若夫子之言於帝王之德猶螳蜋之怒臂以當車軼則必不勝任矣且若是則其自為處危其觀臺多物將往投迹者衆必服恭儉非忘儉而儉也拔出公忠非忘忠而忠也故雖無阿私而不足以勝矯詐之任也局局俯身而笑也夫必能恭儉拔出公忠此皆偽情非忘淡者也故以此言為南面之德何異乎螳蜋怒臂以敵車轍用小擬大故不能任也局局其玉反一云大笑之貌螳螂音堂郎車軼音轍慶藩案釋文軼音轍是也轍車轍也古轍字通作軼戰國策車軼之所至注軼音轍説文無轍篆轍即徹也史記文帝紀結軼於道注亦音轍漢書文帝紀作結轍是其證不勝音升注同此皆自處高顯若臺觀之可睹也夫恭儉公忠非能忘淡適自顯耀以炫衆人既高危必遭隳敗猶如臺觀峻聳處置危縣雖復行李觀見而崩毀非久自為遽其據反本又作處盧文弨曰今本作處觀臺古亂反注同將使物不止於本性之分而矯跂自多以附之觀臺高迥人競觀之立行自多物爭歸湊家世父曰觀臺多言使民觀象受法其事繁也郭象以危其觀臺斷句恐誤亢足投迹不安其本步也顯耀動物物不安分故舉足投迹企踵者多也蔣閭葂覤覤然驚曰葂也汒若於夫子之所言矣雖然願先生之言其風也覷覷驚貌也汒無所見也乍聞高議率爾驚悚思量不悟所以汒然矣覷覷許逆反又生責反或云驚懼之貌汒若本或作芒武剛反郭武蕩反風教也我前所陳深為乖理所願一言庶為法教俞樾曰風當讀為凡猶云言其大凡也風本從凡聲故得通用季徹曰大聖之治天下也搖蕩民心使之成教易俗舉滅其賊心而皆進其獨志若性之自為而民不知其所由然若然者豈兄堯舜之教民溟涬然弟之哉欲同乎德而心居矣夫志各有趣不可相效也故因其自搖而搖之則雖搖而非為也因其自蕩而蕩之則雖蕩而非動也故其賊心自滅獨志自進教成俗易悶然無迹履性自為而不知所由皆云我自然矣舉皆也夫聖治天下大順群生乘其自搖而作法因其自蕩而成教是以教成而迹不顯俗易而物不知皆除滅其賊害之心而進修獨化之志不動於物故若性之自為率性而動故不知其所由然也舉皆也舉滅舉皆也悶然音門溟涬甚貴之謂也不肯多謝堯舜而推之為兄也溟涬甚貴之謂也若前方法以教蒼生則治合淳古物皆得性詎須獨貴堯舜而推之為兄邪此意揖讓之風不讓唐虞矣豈兄元嘉本作豈足溟亡頂反涬戶頂反居者不逐於外也心不居則德不同也居安定之謂也夫心馳分外則觸物參差虛夷靜定則萬境唯一故境之異同在心之靜亂耳是以欲將堯舜同德者必須定居其心也舉皆也三字係釋文誤入依趙諫議本刪子貢南遊於楚反於晉過漢陰見一丈人方將為圃畦鑿隧而入井抱甕而出灌搰搰然用力甚多而見功寡子貢曰有械於此一日浸百畦用力甚寡而見功多夫子不欲乎水南曰陰種蔬曰圃埒中曰畦隧地道也搰搰用力貌也丈人長者之稱也子貢南遊荊楚之地塗經漢水之陰遂與丈人更相泛答其抑揚詞調具在文中莊子因託二賢以明稱混沌圃布戶反又音布園也李云菜蔬曰圃畦圭反李云埒中曰畦説文云五十畝曰畦隧音遂李云道也甕烏送反字亦作甕搰搰苦骨反徐李苦滑反郭忽滑反用力貌一音胡沒反械機器也子貢既見丈人力多而功少是以教其機器庶力少功多輒進愚誠未知欲否有械戶戒反字林作械李云器械也浸子鴆反司馬云灌也闕誤引張君房本有下有機字戶字依世德堂本及釋文原本改械疑字之誤為圃者卬而視之曰奈何曰鑿木為機後重前輕挈手若抽數如泆湯其名為槔為圃者忿然作色而笑曰吾聞之吾師有機械者必有機事有機事者必有機心機心存於胸中則純白不備純白不備則神生不定神生不定者道之所不載也吾非不知羞而不為也奈何猶如何其方法也卬而音仰本又作仰機關也提挈其水灌若抽引欲論數疾似泆湯之騰沸前輕後重即今之所用桔槔也挈水口節反若抽敕留反李云引也司馬崔本作流數如所角反徐所録反泆湯音逸本或作溢李云疾速如湯沸溢也司馬本作佚蕩亦言其往來數疾如佚蕩佚蕩唐佚也槔本又作橋或作皋同音羔徐居橋反司馬李云桔槔也夫用時之所用者乃純備也斯人欲修純備而抱一守古失其旨也夫有機關之器者必有機動之務有機動之務者必有機變之心機變存乎胸府則純粹素白不圓備矣純粹素白不圓備則精神縣境生滅不定不定者至道不載也是以羞而不為此未體真修故抱一守白者也吾師謂老子也趙諫議本卬作仰闕誤引張君房本為作桔子貢瞞然慚俯而不對瞞羞怍之貌也既失所言故不知何答也瞞武版反又亡安反字林云目眥平貌李作天典反慚貌一音門又亡干反司馬本作憮音武崔本作撫有間為圃者曰子奚為者邪有間俄頃也奚何也問子貢汝是誰門徒作何學業曰孔丘之徒也答宣尼之弟子也慶藩案一切經音義二十五引司馬云徒弟子也釋文闕為圃者曰子非夫博學以擬聖於于以蓋衆獨弦哀歌以賣名聲於天下者乎汝方將忘汝神氣墮汝形骸而庶幾乎而身之不能治而何暇治天下乎子往矣無乏吾事於于佞媚之謂也言汝博學贍聞擬似聖人諂曲佞媚以蓋群物獨坐弦歌抑揚哀歎執斯聖迹賣彼名聲歷聘諸國遍行天下於于並如字本或作唹吁音同司馬云夸誕貌一云行仁恩之貌以蓋衆司馬本蓋作善家世父曰應帝王其臥徐徐其覺于于説文于於也象氣之舒是於于字同於于猶于于也不忘不墮則無庶幾之道幾近也汝忘遺神氣墮壞形骸身心既忘而後庶近於道墮許規反而汝也乏闕也夫物各自治則天下理矣以己理物則大亂矣如子貢之德未足以治身何容應聘天下理宜速往無廢吾業無乏乏廢也子貢卑陬失色頊頊然不自得行三十里而後愈卑陬慚怍之貌頊頊自失之貌既被詆訶顏色自失行三十里方得復常卑陬走侯反徐側留反李云卑陬愧懼貌一云顏色不自得也頊頊本又作旭旭許玉反李云自失貌其弟子曰向之人何為者邪夫子何故見之變容失色終日不自反邪反復也子貢之門人謂賜為夫子也向見之人修何藝業遂使先生一睹容色失常竟日崇朝神氣不復門人怪之所以致問向之許亮反本又作鄉音同後倣此曰始吾以為天下一人耳不知復有夫人也吾聞之夫子事求可功求成用力少見功多者聖人之道今徒不然執道者德全德全者形全形全者神全神全者聖人之道也託生與民並行而不知其所之汒乎淳備哉功利機巧必忘夫人之心若夫人者非其志不之非其心不為雖以天下譽之得其所謂謷然不顧以天下非之失其所謂儻然不受天下之非譽無益損焉是謂全德之人哉我之謂風波之民謂孔丘也昔來稟學宇內唯夫子一人今逢丈人道德又更深遠所以卑慚不能自得也既未體乎真假實謂賢乎仲尼也復有扶又反夫人音符下夫人同聖人之道即用百姓之心耳夫事以適時為可功以能遂為成故力少而見功多者則是適時能遂之機子貢述昔時所聞以為聖人之道此乃聖王之道非夫人道也子貢聞其假修之説而服之未知純白者之同乎世也今丈人問余則不如此言執持道者則德行無虧德全者則形不虧損形全者則精神專一神全者則寄迹人間託生同世雖與群物並行而不知所往芒昧深遠不可測量故其操行淳和道德圓備不可以此功利機巧語其心也斯乃聖人之道非假修之術子貢未悟妄致斯談汒乎莫剛反之心心或作道此宋榮子之徒未足以為全德子貢之迷沒於此人即若列子之心醉於季咸也謷是誕慢之容儻是無心之貌丈人志氣淳素不任機巧心懷寡欲不務有為縱令舉世贊譽稱為德知為無益曾不顧盼舉世非毀聲名喪失達其無損都不領受既毀譽不動可謂全德之人夫水性雖澄逢風波起我心不定類彼波瀾故謂之風波之民也郭注云此宋榮子之徒未足以為全德子貢之迷沒於此人即若列子之心醉於季咸譽之音餘下同謷然五羔反司馬本作警儻然本亦作黨司馬本作同敕蕩反郭吐更反反於魯以告孔子孔子曰彼假修渾沌氏之術者也識其一不知其二治其內而不治其外夫明白入素無為復朴體性抱神以遊世俗之間者汝將固驚邪且渾沌氏之術豫與汝何足以識之哉以其背今向古羞為世事故知其非真渾沌也子貢自魯適楚反歸於魯以其情事咨告孔子夫渾沌者無分別之謂也既背今向古所以知其真渾沌氏之術也渾胡本反沌徒本反背今音佩徒識修古抱灌之朴而不知因時任物之易也識其一謂向古而不移也不知其二謂不能順今而適變之易以豉反夫真渾沌都不治也豈以其外內為異而偏有所治哉抱道守素治內也不能隨時應變不治外也此真渾沌也故與世同波而不自失則雖遊於世俗而泯然無迹豈必使汝驚哉夫心智明白會於質素之本無為虛淡復於淳朴之原悟真性而抱精淳混囂塵而遊世俗者固當江海蒼生林藪萬物鳥獸不駭人豈驚哉而言汝將固驚者明其必不必驚也俞樾曰固讀為胡胡固皆從古聲故得通用汝將胡驚邪言汝與真渾沌遇則不驚也郭注曰故與世同波而不自失則雖遊於世俗而泯然無迹豈必使汝驚哉正得其意古書胡字或以故字為之管子侈靡篇公將有行故不送公墨子尚賢中篇故不察尚賢為政之本也皆以故為胡之證禮記哀公問篇鄭注曰固猶故也是以固為胡猶以故為胡矣在彼為彼在此為此渾沌玄同孰識之哉所識者常識其迹耳夫渾沌無心妙絶智慮假令聖賢特達亦何足識哉明恍惚深玄故推之於情意之表者也諄芒將東之大壑適遇苑風於東海之濱苑風曰子將奚之諄淳也苑小風也亦言是扶搖大風也濱涯大壑海也諄芒苑風皆寓言也莊生寄此二人明於大道故假為賓主相值海涯諄郭之倫反又述倫反芒本或作汒武剛反李云望之諄諄察之芒芒故曰諄芒一云姓名也或云霧氣也大壑火各反李云大壑東海也苑風本亦作宛徐於阮反李云小貌謂遊世俗也一云苑風人姓名一云扶搖大風也之濱音賓慶藩案釋文苑亦作宛苑宛字同也淮南俶真篇形苑而神壯高誘注苑枯病也苑讀南陽宛之宛奚何也之往也借問諄芒有何遊往曰將之大壑欲往東海曰奚為焉又問何所求訪曰夫大壑之為物也注焉而不滿酌焉而不竭吾將遊焉夫大海泓宏深遠難測百川注之而不溢尾閭泄之而不乾以譬至理而其義亦然故雖寄往滄溟實乃遊心大道也酌焉一本作取焉苑風曰夫子無意於橫目之民乎願聞聖治五行之內唯民橫目故謂之橫目之民且諄芒東遊臨於大壑觀其深遠而為治方苑風既察此情因發斯問夫子豈無意於黔首願聞聖化之法也橫目之民李云蟲之屬欲令其治之也願聞本或依司馬本作問下同聖治直吏反下皆同諄芒曰聖治乎官施而不失其宜拔舉而不失其能畢見其情事而行其所為行言自為而天下化手撓顧指四方之民莫不俱至此之謂聖治施令設官取得宜便拔擢薦舉不失才能如此則天下太平彝倫攸敘聖治之術在乎茲也官施始支反又始智反司馬云施政布教各得其宜皆因而任之夫所乖舛事業多端是以步驟殊時澆淳異世故治之者莫先任物必須睹見其情事而察其所為然後順物而行則無不當也使物為之則不化也所有施行之事教令之言咸任物自為而不使物從己如此則宇內蒼生自然從化言其指麾顧眄而民各至其性也任其自為故撓動也言動手指揮舉目顧眄則四方款附萬國來朝聖治功能其義如是有本作頤字者言用頤指揮四方皆服此中凡有三人一聖二德三神以上聖治以下次列德神二人手撓而小反又而了反司馬云動也一云謂指麾四方也顧指如字向云顧指者言指麾顧而治也或音頤本亦作頤以之反謂舉頤指揮也慶藩案手撓顧指二義對文注指麾承手撓言顧盼承顧指言故疏以動手舉目分釋四字如向云顧指者言指麾顧盼失其義矣顧指目顧其人而指使之左思吳都賦搴旗若顧指劉逵注謂顧指如意此言顧指與漢書貢禹傳目指氣使同義師古注曰動目以指物出氣以使人盼字依釋文原本改願聞德人前之聖治已蒙敷釋德人之義深所願聞曰德人者居無思行無慮不藏是非美惡四海之內共利之之謂悅共給之之為安怊乎若嬰兒之失其母也儻乎若行而失其道也財用有餘而不知其所自來飲食取足而不知其所從此謂德人之容率自然耳妙契道境得無所得故曰德人德人凝神端拱寂爾無思假令應物行化曾無謀慮無是非於胸中而任之天下懷道抱德物我俱忘豈容蘊蓄是非包藏善惡邪美惡烏路反無自私之懷也夫德人惠澤弘博遍覃群品故貨財將四海共同資給與萬民無別是以普天慶悅率土安寧慶藩案謂悅與為安對文謂猶為也古謂為字同義互用夫嬰兒失母心怊悵而無所依行李迷途神儻莽而無所據用斯二事以況德人也怊乎音超字林云悵也徐尺遙反郭音條儻乎敕黨反司馬本作德者神人迹也故曰容寡欲止分故財用有餘不貪滋味故飲食取足性命無求故不知所從來也都結前義故云德人之容德人之容羊凶反或云依注當作客願聞神人願聞所以迹也德者神人之迹耳願聞所以迹也曰上神乘光與形滅亡此謂照曠致命盡情天地樂而萬事銷亡萬物復情此之謂混冥乘光者乃無光乘用也光智也上品神人用智照物雖復光如日月即照而亡隳體黜聰心形俱遣是故與形滅亡者也無我而任物空虛無所懷者非暗塞也智周萬物明逾三景無幽不燭豈非曠遠情盡命至天地樂矣事不妨樂斯無事矣窮性命之致盡生化之情故寄天地之間而未嘗不逍遙快樂既達物我虛幻是以萬事銷亡天地樂音洛注同銷亡徐音消情復而混冥無迹也夫忘照而照照與三景高明忘生而生生將二儀並樂故能視萬物之還原睹四生之復命是以混沌無分而冥同一道也混冥胡本反門無鬼與赤張滿稽觀於武王之師赤張滿稽曰不及有虞氏乎故離此患也門與赤張姓也無鬼滿稽名也二千五百人為師師衆也武王伐紂兵渡孟津時則二人共觀門無鬼司馬本作無畏云門姓無畏字也赤張滿本或作蒲稽古兮反李云門赤張氏也無鬼滿稽名也離遭也虞舜以揖讓御時武王以干戈濟世而揖讓干戈優劣懸隔以斯商度至有不及之言而兵者不祥之器故遭殘殺之禍也門無鬼曰天下均治而有虞氏治之邪其亂而後治之與言二聖俱以亂故治之則揖讓之與用師直是時異耳未有勝負於其間也均平也若天下太平物皆得理則何勞虞舜作法治之良由堯年將減其德日衰故讓重華令其緝理也均治直吏反下及注均治並同之與音餘本又作邪復何扶又反下章注同赤張滿稽曰天下均治之為願而何計以有虞氏為有虞氏之藥瘍也禿而施病而求醫孝子操藥以修慈父其色燋然聖人羞之均治則願各足矣復何為計有虞氏之德而推以為君哉許無鬼之言是也宇內清夷志願各足則何須計有虞氏之德而推之為君此領悟無鬼之言許其有理也天下皆患創亂故求虞氏之藥瘍頭瘡也夫身上患創故求醫療亦猶世逢紛擾須聖人治之是以不病則無醫不亂則無聖瘍音羊李云頭創也言創以喻亂求虞氏藥治之司馬云疕瘍也王引之曰藥古讀曜説見唐韻正聲與療相近方言愮療治也江湘郊會謂醫治之曰愮或曰療注愮音曜與藥古字通故申鑒俗嫌篇云藥者療也襄三十一年左傳不如吾聞而藥之也家語正論篇同王肅注藥療也詩大雅板篇不可救藥韓詩外傳藥作療藥療字古同義通用患創初良反鬢髮如雲不勞施幸無疾恙豈假醫人是知天下清平無煩大聖此之二句總結前旨也禿吐木反大細反司馬云髲也又吐帝反郭音毛李云髦髮也明治天下者非以為榮操執也修理也燋然憔悴貌夫孝子之治慈父既不伐其功績聖人之救禍亂豈務矜以榮顯事不得已是故羞之操藥七刀反燋然將遙反又音樵闕誤引張君房本羞之作所羞也郭下疑脫作髦二字至德之世不尚賢不使能上如標枝民如野鹿端正而不知以為義相愛而不知以為仁實而不知以為忠當而不知以為信蠢動而相使不以為賜是故行而迹事而無傳賢當其位非尚之也夫不肖與賢各當其分非尚之以別賢能者自為非使之也巧拙習性不相夸企非尚而使之出物上而不自高也君居民上恬淡虛忘猶如高樹之枝無心榮貴也如標方小反徐方遙反又方妙反言樹杪之枝無心在上也校胡孝反李音較一本作枝盧文弨曰今本校作枝放而自得也上既無為下亦淳朴譬彼野鹿絶君王之禮也端直其心不為邪惡豈識裁非之義率乎天理更相親附寧知偏愛之仁者也率性自然非由知也率性成實不知此實為忠任真當理豈將此當為信用其自動故動而不謝賜蒙賴也蠢動之物即是精爽之類更相驅使理固自然譬彼股肱方茲耳目既無心於為造豈有情於蒙賴無為理物其義亦然蠢郭處允反動也能任其自行故無迹也君民淳朴上下和平率性而動故無迹之可記各止其分故不傳教於彼也方之首足各有職司止其分內不相傳習迹既昧矣事亦滅焉無傳丈專反無字依宋本及各本改主字依道藏本改孝子不諛其親忠臣不諂其君臣子之盛也親之所言而然所行而善則世俗謂之不肖子君之所言而然所行而善則世俗謂之不肖臣而未知此其必然邪世俗之所謂然而然之所謂善而善之則不謂之道諛之人也然則俗故嚴於親而尊於君邪謂己道人則勃然作色謂己諛人則怫然作色而終身道人也終身諛人也合譬飾辭聚衆也是終始本末不相坐垂衣裳設采色動容貌以媚一世而不自謂道諛與夫人之為徒通是非而不自謂衆人愚之至也知其愚者非大愚也知其惑者非大惑也大惑者終身不解大愚者終身不靈三人行而一人惑所適者猶可致也惑者少也二人惑則勞而不至惑者勝也而今也以天下惑豫雖有祈嚮不可得也不亦悲乎善事父母為孝諛偽也諂欺也不以正求人謂之諂為臣為子事父事君不諂不諛盡忠盡孝此乃臣子之盛德也不諛羊朱反郭貽附反不諂敕檢反此直違俗而從君親故俗謂不肖耳未知至當正在何許不肖猶不似也君父言行不擇善惡直致隨時曾無諫爭之心故世俗之中實為不肖未知正理的在何許也不肖音笑言俗不為尊嚴於君親而從俗俗不謂之諂明尊嚴不足以服物則服物者更在於從俗也是以聖人未嘗獨異於世必與時消息故在皇為皇在王為王豈有背俗而用我哉嚴敬也此明違從不定也世俗然善則諫爭是也夫違俗從親謂之道諛而違親從俗豈非諂佞耶且有逆有順故見是見非而違順既空未知正在何處又違親從俗豈謂尊嚴君父之道音導下同慶藩案道人即諂人也漁父篇曰希意道言謂之諂道與諂同義荀子不苟篇非諂諛也賈子先醒篇君好諂諛而惡至言韓詩外傳並作道諛諂與道聲之轉豈有背音佩世俗遂以多同為正故謂之道諛則作色不受則勃步忽反謂己諛人本又作衆人下同司馬云衆人凡人也則怫符弗反郭敷謂反亦不問道理期於相善耳勃怫皆嗔貌也道達也謂其諂佞以媚君親也言世俗之人謂己諂佞即作色而怒不受其名而終身道諛舉世皆爾夫合譬飾辭應受道諛之罪而世復以此得人以此聚衆亦為從俗者恆不見罪坐也夫合於譬喻飾於浮詞人皆競趨故以聚衆能保其終始合其本末衆既從之故不相罪坐也譬本有作璧字者言合圭璧也相坐才臥反注同世皆至愚乃更不可不從黃帝垂衣裳而天下治上衣下裳以象天地紅紫之色間而為彩用此華飾改動容貌以媚一世浮偽之人不謂道諛翻且從君諂佞此乃與夫流俗之人而徒黨更相彼此通用是非自謂殊於衆人可謂愚癡之至與夫音符夫聖人道同而帝王殊迹者誠世俗之惑不可解故隨而任之解悟也靈知也知其愚惑者聖人也隨而任之故愚非愚惑也大愚惑者凡俗也心識暗鄙觸境生迷所以竟世終身不覺悟也不解音蟹又佳買反不靈本又作無靈司馬云靈曉也天下都惑雖我有求嚮至道之情而終不可得故堯舜湯武隨時而已適往也致至也惑迷也祈求也夫三人同行一人迷路所往之方猶自可至惑少解多故也二人迷則神勞而不至迷勝悟劣故也今宇內皆惑莊子雖求向至道之情無由能致故可悲傷也祈嚮許亮反司馬云祈求也俞樾曰祈字無義司馬云祈求也則但云豫雖祈嚮足矣郭注云雖我有求嚮至道之情則又增出情字殆皆非也祈疑所字之誤言天下皆惑豫雖有所嚮往不可得也祈所字形相似故誤耳下同趙諫議本道作導下同闕誤引張君房本相下有罪字大聲不入於里耳折楊皇荂則嗑然而笑是故高言不止於衆人之心至言不出俗言勝也以二缶鍾惑而所適不得矣而今也以天下惑豫雖有祈嚮其庸可得邪知其不可得也而強之又一惑也故莫若釋之而不推不推誰其比憂厲之人夜半生其子遽取火而視之汲汲然唯恐其似己也非委巷之所尚也大聲司馬云謂咸池六英之樂也俗人得嘖曲則同聲動笑也大聲謂咸池大韶之樂也非下里委巷之所聞折楊皇華蓋古之俗中小曲也玩狎鄙野故嗑然動容同聲大笑也昔魏文侯聽於古樂恍焉而睡聞鄭衛新聲欣然而喜即其事也折楊之列反皇荂況于反又撫于反本又作華音花司馬本作里華嗑然許甲反李云折楊皇華皆古歌曲也嗑笑聲也本又作嗌烏邈反司馬本作榼嘖曲仕責反本又作嗑不以存懷至妙之談超出俗表故謂之高言適可蘊群聖之靈府豈容止於衆人之智乎大聲不入於里耳高言固不止於衆心此天下所以未曾用聖而常自用也出顯也至道之言淡而無味不入委巷之耳豈止衆人之心而流俗之言飾詞浮偽猶如折楊之曲喜聽者多俗説既其當塗至言於乎隱蔽故齊物云言隱於榮華各自信據故不知所之踵足也夫迷方之士指北為南而二惑既生垂腳不行一人亦無由獨進欲達前所其可得乎此復釋前惑者也以二缶鍾缶應作垂鍾應作踵言垂腳空中必不得有之適也司馬本作二垂鍾云鍾注意也所適司馬云至也家世父曰釋文缶應作垂鍾應作踵言垂腳空中必不得有所適也司馬本作二垂鍾今案説文缶瓦器也所以盛酒漿鍾酒器也小爾雅釜二有半謂之藪藪二有半謂之缶缶二謂之鍾缶鍾皆量器也缶受四斛鍾受八斛以二缶鍾惑謂不辨缶鍾二者所受多寡也持以為量茫乎無所適從矣上文一人惑二人惑據人言之此以二缶鍾惑據事言之盡人皆惑而誰與明之操量器而惑不足與定數舉天下之大而皆惑也誰與舉而指之自分兩義俞樾曰二缶鍾之文未知何義釋文云缶應作垂鍾應作踵言垂腳空中必不得有之適也此於莊子之意不合所適謂所之也郭注曰各自信據故不知所之是也如陸氏説則以適為適意之適當云不得其適不當云所適不得也今案鍾當作踵而二則一字之誤缶則企字之誤企下從止缶字俗作其下亦從止兩形相似因致誤耳文選歎逝賦注引字林曰企舉踵也一切經音義十五引通俗文曰舉踵曰企然則企踵猶舉踵也人一企踵不過步武之間耳然以一企踵惑則已不得其所適矣故下云而今也以天下惑豫雖有所嚮其庸可得邪以天下惑極言其地之大以一企踵惑極言其地之小也上文二人惑則勞而不至惑者勝也而今也以天下惑豫雖有所嚮不可得也以天下對二人言則以人之多寡言此以天下對一企踵言則以地之廣狹言一企踵誤為二缶鍾則不得其義矣夫二人垂踵所適尚難況天下皆迷如何得正故雖有求向之心其用固不可得此釋前不亦悲乎傷歎既深所以鄭重即而同之釋放也迷惑既深造次難解而強欲正者又是一愚莫若放而不推則物我安矣而強其丈反下注同趣得當時之適不強推之令解也則相與無憂於一世矣比與也若任物解惑棄而不推則彼此逍遙憂患誰與也比憂毗志反司馬本作鼻云始也趣令力呈反下同令解音蟹厲惡人也言天下皆不願為惡及其為惡或迫於苛役或迷而失性耳然迷者自思復而厲者自思善故我無為而天下自化厲醜病人遽速也汲汲匆迫貌言醜人半夜生子速取火而看之情意匆忙恐其似己而厲醜惡之甚尚希改醜以從妍欲明愚惑之徒豈不厭迷以思悟耶釋之不推自無憂患厲音賴又如字家世父曰厲之人夜半生其子別出一義以收足上意以己同俗亦喜俗之同乎己不知其非也厲者生子而懼其似己於此顧不求同焉惟自知其厲也然則其同於俗也與其強己以同於厲無以異也而懵然不辨其非亦唯其不知焉而已遽巨據反本或作蘧音同汲汲音急苛役音河舍字依趙諫議本改百年之木破為犧尊青黃而文之其斷在溝中比犧尊於溝中之斷則美惡有間矣其於失性一也跖與曾史行義有間矣然其失性均也且夫失性有五一曰五色亂目使目不明二曰五聲亂耳使耳不聰三曰五臭薰鼻困惾中顙四曰五味濁口使口厲爽五曰趣舍滑心使性飛揚此五者皆生之害也而楊墨乃始離跂自以為得非吾所謂得也夫得者困可以為得乎則鳩梟之在於籠也亦可以為得矣且夫趣舍聲色以柴其內皮辨鷸冠搢笏紳修以約其外內支盈於柴柵外重纆繳睆睆然在纆繳之中而自以為得則是罪人交臂歷指而虎豹在於囊檻亦可以為得矣犧刻作犧牛之形以為祭器名曰犧尊也間別既削刻為牛又加青黃文飾其一斷棄之溝瀆不被收用若將此兩斷相比則美惡有殊其於失喪木性一也此且起譬也犧音羲又素河反慶藩案毛傳曰犧尊有沙飾見詩閟宮篇鄭司農曰犧尊飾以翡翠見周官司尊彝注後鄭曰犧讀如沙見禮明堂位正義刻畫鳳凰之象於尊其羽形婆娑然王念孫引高注淮南俶真篇曰犧尊猶疏鏤之尊然則犧尊者刻而畫為衆物之形在六尊之中最為華美故古人言文飾之盛者猶舉犧尊今案或曰有沙飾者或曰飾以翡翠或曰刻畫鳳凰之象於尊或曰疏鏤之尊説雖不同其於雕鏤之義則一至阮諶禮圖云犧尊飾以牛於尊腹之上畫為牛之形則因犧從牛望文生義矣其斷徒亂反下同本或作故此合譬也桀跖之縱凶殘曾史之行仁義雖復善惡之迹有別而喪真之處實同迷情失性抑乃多端要且而言其數有五五色者青黃赤白黑也流俗貪以此亂目不能見理故曰不明也五聲謂宮商角徵羽也淫滯俗聲不能聞道故曰不聰五臭謂羶薰香鯷腐惾塞也謂刻賊不通也言鼻五臭故壅塞不通而中傷顙額也外書呼香為臭也故易云其臭如蘭道經謂五香故西升經云香味是冤也困如字本或作悃音同惾子公反郭音俊又素奉反李云困惾猶刻賊不通也中丁仲反顙桑蕩反五味謂酸辛甘苦鹹也厲病爽失也令人著五味穢濁口根遂使鹹苦成痾舌失其味故言厲爽也濁口本又作噣音同慶藩案大雅思齊箋曰厲病也逸周書諡法篇曰爽傷也廣雅同使口厲爽病傷滋味也見淮南精神篇高誘注作爽傷文子九守篇作使口生創皆後人妄改趣取也滑亂也順心則取違情則舍撓亂其心使自然之性馳競不息輕浮躁動故曰飛揚也滑心李音骨本亦作噣總結前之五事皆是伐命之刀害生之斧是生民之巨害也離跂用力貌也言楊朱墨翟各擅己能失性害生以此為得既乖自然之理故非莊生之所得也離力智跂丘豉反夫仁義禮法約束其心者非真性者也既偽其性則遭困苦若以此困而為得者則何異乎鳩梟之鳥在樊寵之中稱其自得者也皮辨者以皮為冠也鷸者鳥名也似鶩紺色出鬱林取其翠羽飾冠故謂之鷸冠此鳥知天文者為之冠也搢插也笏猶圭謂插笏也紳大帶也修長裙也此皆以飾朝服也夫浮偽之徒以取舍為業故聲色諸塵柴塞其內府衣冠搢笏約束其外形背無為之道乖自然之性以此為得何異鳩梟也鷸尹必反徐音述本又作鶐音同鳥名也一名翠似燕紺色出鬱林取其羽毛以飾冠慶藩案説文鷸知天將雨鳥也案鷸即翠鳥也禮記知天文冠鷸玉篇爾雅釋文漢書五行志鷸並聿述二音匡謬正俗曰案鷸水鳥天將雨即鳴古人以其知天時乃為象此鳥之形使掌天文者冠之鷸音聿亦有術音故禮之衣服圖及蔡雍獨斷謂為術氏冠亦鷸音轉為術耳此釋文鷸又作鶐案漢書輿服志引記曰知天者冠述説苑修文篇作冠鉥蓋因鷸有述音故或作鶐或作述或作鉥耳笏音忽紳音申帶也支塞也盈滿也柵籠也纆繳繩也睆睆視貌也夫以取舍塞滿於內府故方柴柵紳搢約束於外形取譬繳繩既外內困弊如斯而自以為得者則何異有罪之人交臂歷指以繩反縛也又類乎虎豹遭陷困於囊檻之中憂危困苦莫斯之甚自以為得何異此乎柴柵楚格反郭音策外重直龍反纆音墨繳音灼郭古弔反睆睆環版反又戶鰥反李云窮視貌一云眠目貌交臂歷指司馬云交臂反縛也歷指猶歷樓貌檻戶覽反也字依毛傳原文改之字依經義述聞改依世德堂本及釋文原本改
